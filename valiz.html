<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Şifreli Valiz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧳</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--sehir1:#c2412d;--sehir2:#8f2a1c;--yesil:#3fb950;--sari:#e3b23c;--gri:#59606b}
html,body{margin:0;height:100%;background:#16202b;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;color:#fbf6ec}
#app{position:relative;margin:0 auto;height:100%;width:min(100vw,calc(100vh * 0.5625));overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#3b5068 0,#223246 55%,#16202b 100%)}
#arka{position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.4px);background-size:16px 16px}
#yerSimge{position:absolute;right:-6%;bottom:31%;font-size:150px;opacity:.09;filter:grayscale(.3);pointer-events:none;transform:rotate(-6deg)}
.ik{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.17em;background:center/contain no-repeat;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23e0a817'/><circle cx='16' cy='16' r='10.5' fill='%23ffd35a' stroke='%23c48a0a' stroke-width='1.5'/><path d='M16 9.5v13M12.5 12.5h7M12.5 19.5h7' stroke='%23c48a0a' stroke-width='2.2' stroke-linecap='round'/></svg>")}
/* ust bilgi */
#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;z-index:3}
.pill{background:rgba(10,16,22,.65);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:3px 11px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px)}
.pill s{text-decoration:none;font-size:12px;opacity:.7}
.pill.vur{animation:vur .3s}
@keyframes vur{50%{transform:scale(1.18)}}
button.pill{color:inherit;font-family:inherit;cursor:pointer}
/* bagaj bandi */
#bant{position:absolute;left:-10%;right:-10%;top:44%;height:46px;background:repeating-linear-gradient(90deg,#2b2f36 0 34px,#1d2026 34px 38px);border-top:4px solid #50565f;border-bottom:6px solid #0e1014;transform:perspective(500px) rotateX(28deg);box-shadow:0 18px 30px rgba(0,0,0,.5);animation:bant 1.2s linear infinite paused}
#bant.akar{animation-play-state:running}
@keyframes bant{to{background-position:38px 0}}
/* valiz */
#sahne{position:absolute;left:0;right:0;top:64px;height:44%;display:flex;align-items:flex-end;justify-content:center;perspective:900px;z-index:2}
#valiz{position:relative;margin-bottom:7%;transition:transform .7s cubic-bezier(.5,0,.3,1);transform-style:preserve-3d}
#kutu3d{position:relative;transform-style:preserve-3d;--D:84px;transform:rotateX(-8deg)}
#kutu3d.yumusak{transition:transform .6s cubic-bezier(.2,.9,.3,1.05)}
.yuz{position:absolute;left:0;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--sehir1),var(--sehir2))}
.yuz::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 26px)}
.yuz.arka{width:var(--W);height:var(--H);transform:rotateY(180deg) translateZ(calc(var(--D) / 2));box-shadow:inset 0 0 0 4px rgba(0,0,0,.2)}
.yuz.sol,.yuz.sag{width:var(--D);height:var(--H);left:calc((var(--W) - var(--D)) / 2);border-radius:14px}
.yuz.sol{transform:rotateY(-90deg) translateZ(calc(var(--W) / 2))}.yuz.sag{transform:rotateY(90deg) translateZ(calc(var(--W) / 2))}
.yuz.sol::after,.yuz.sag::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.15) 50%,rgba(0,0,0,.35))}
.yuz.ust,.yuz.alt{width:var(--W);height:var(--D);top:calc((var(--H) - var(--D)) / 2);border-radius:14px}
.yuz.ust{transform:rotateX(90deg) translateZ(calc(var(--H) / 2))}.yuz.ust::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.12)}
.yuz.alt{transform:rotateX(-90deg) translateZ(calc(var(--H) / 2))}.yuz.alt::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.4)}
.teker{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#444 0 30%,#111 32% 100%);z-index:1}
.yuz.ic{width:var(--W);height:var(--H);transform:translateZ(calc(var(--D) / 2 - 8px));background:radial-gradient(ellipse at 50% 40%,#6a2f7a,#2a0f33 70%);display:flex;align-items:center;justify-content:center}
.yuz.ic::before{display:none}
.yuz.ic .isinlar{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;background:repeating-conic-gradient(rgba(255,240,190,.5) 0 8deg,transparent 8deg 22deg);-webkit-mask:radial-gradient(circle,#000,transparent 60%);mask:radial-gradient(circle,#000,transparent 60%);animation:isin 6s linear infinite}
.fermuar{position:absolute;top:8px;bottom:8px;left:50%;width:6px;margin-left:-3px;background:repeating-linear-gradient(180deg,#c9a24a 0 3px,#6b5220 3px 6px);border-radius:3px;z-index:1}
/* ipucu notlari (Caveat el yazisi) */
.not{position:absolute;z-index:2;font-family:'Caveat',cursive;font-weight:700;color:#2a1d10;line-height:1.02;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.not .kno{display:inline-block;font-family:'Baloo 2',system-ui;font-size:12px;font-weight:800;background:#2a1d10;color:#fff3c0;border-radius:8px;padding:0 7px;margin-bottom:3px}
.not.bant{left:50%;top:50%;width:68%;transform:translate(-50%,-50%) rotate(-4deg);background:linear-gradient(#f6ead0,#ead9b1);padding:12px 10px;font-size:24px;border-radius:3px}
.not.bant::before,.not.bant::after{content:'';position:absolute;top:-8px;width:44px;height:18px;background:rgba(255,250,230,.75);transform:rotate(-8deg)}
.not.bant::before{left:-10px}.not.bant::after{right:-10px;transform:rotate(10deg)}
.not.havayolu{left:7px;right:7px;top:50%;transform:translateY(-50%) rotate(2deg);background:#fff;border-radius:10px;padding:22px 5px 8px;font-size:18px;overflow:hidden}
.not.havayolu::before{content:'✈ PRIORITY';position:absolute;left:0;right:0;top:0;background:#d6322f;color:#fff;font:800 9px 'Baloo 2',system-ui;letter-spacing:.12em;padding:2px 0}
.not.etiketNot{left:7px;right:7px;top:50%;transform:translateY(-50%) rotate(-3deg);background:linear-gradient(#ffe9a8,#f2c94c);border-radius:6px 6px 22px 22px;padding:10px 5px;font-size:18px}
.not.etiketNot::before{content:'';position:absolute;left:50%;top:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#7a5420}
.ipcip{margin-left:4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);cursor:pointer}
.ipcip.var{background:radial-gradient(circle,#fff6b0,#e0a817);box-shadow:0 0 10px rgba(255,220,100,.9);animation:cipNabiz 1.6s ease-in-out infinite}
@keyframes cipNabiz{50%{transform:scale(1.12)}}
#golge{position:absolute;left:50%;bottom:6.5%;width:70%;height:22px;margin-left:-35%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);pointer-events:none}
#cevirIp{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);font-size:12px;font-weight:800;opacity:.75;white-space:nowrap;pointer-events:none;animation:cevirIp 2.4s ease-in-out infinite}
@keyframes cevirIp{50%{transform:translateX(calc(-50% + 8px))}}
.govde::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);background-size:300% 100%;animation:parilti 6s ease-in-out infinite;pointer-events:none}
@keyframes parilti{0%,70%{background-position:120% 0}100%{background-position:-40% 0}}
#valiz.gel{animation:gel .8s cubic-bezier(.2,.9,.3,1.1)}
@keyframes gel{from{transform:translateX(120vw) rotate(4deg)}}
#valiz.git{transform:translateX(-130vw) rotate(-3deg)}
.sap{position:absolute;left:50%;top:-30px;width:86px;height:34px;margin-left:-43px;border:9px solid #2a1c14;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.15)}
.etiket{position:absolute;left:50%;top:-62px;margin-left:52px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:4px 2px;animation:salla 2.6s ease-in-out infinite;z-index:3}
.etiket .ip{position:absolute;left:-8px;top:18px;width:2px;height:40px;background:#d9c39a;transform:rotate(38deg);transform-origin:top}
.etiket .kagit{position:absolute;left:-6px;top:18px;background:linear-gradient(#fff8e6,#efe0bc);color:#5a3b17;border-radius:4px 10px 10px 4px;padding:3px 10px 3px 14px;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35);letter-spacing:.05em}
.etiket .kagit::before{content:'';position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#b8a27a}
.etiket .kagit small{display:block;font-size:9px;letter-spacing:.2em;opacity:.6;line-height:1}
@keyframes salla{50%{transform:rotate(7deg)}}
.govde{position:relative;transform:translateZ(calc(var(--D) / 2));backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:16px 14px 18px;background:linear-gradient(180deg,var(--sehir1),var(--sehir2));box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.25),0 14px 0 -4px rgba(0,0,0,.35),0 24px 40px rgba(0,0,0,.45)}
.govde::before{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 26px),linear-gradient(105deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
.kose{position:absolute;width:26px;height:26px;border:4px solid #c9a24a;background:#2a1c14}
.kose.a{left:-3px;top:-3px;border-radius:16px 0 6px 0}.kose.b{right:-3px;top:-3px;border-radius:0 16px 0 6px}.kose.c{left:-3px;bottom:-3px;border-radius:0 6px 0 16px}.kose.d{right:-3px;bottom:-3px;border-radius:6px 0 16px 0}
.cikartma{position:absolute;z-index:1;width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 0 0 3px #fff,0 3px 6px rgba(0,0,0,.4);pointer-events:none}
.cikartma img{width:44px;height:44px;object-fit:contain}
/* kilit plakasi */
.kilit{position:relative;display:flex;align-items:center;gap:6px;margin:7px 0;padding:6px 10px 6px 6px;border-radius:14px;background:linear-gradient(180deg,#e9cf86,#b88a2e 55%,#8a6418);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.3),0 3px 6px rgba(0,0,0,.35);transition:transform .2s,filter .2s;cursor:pointer}
.kilit.aktif{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.3),0 0 0 3px #fff3c0,0 0 22px rgba(255,220,120,.85)}
.kilit.pasif{filter:saturate(.6) brightness(.85)}
.kilit.cozuldu{filter:none}
.kilit .asma{font-size:22px;width:28px;text-align:center;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.kilit.cozuldu .asma{animation:asmaAc .6s cubic-bezier(.2,.9,.3,1.6)}
@keyframes asmaAc{40%{transform:translateY(-10px) rotate(-18deg) scale(1.3)}}
.kilit.salla{animation:kSalla .4s}
@keyframes kSalla{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.carklar{display:flex;gap:4px}
.cark{position:relative;width:var(--cw,38px);height:52px;border-radius:9px;overflow:hidden;background:linear-gradient(180deg,#1b1e22,#4a5058 22%,#e4e7ea 50%,#4a5058 78%,#1b1e22);box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.3)}
.cark .serit{position:absolute;inset:0}
.cark span{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:#20242a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.cark .h0{top:50%;transform:translateY(-50%);font-size:calc(var(--cw,38px) * .62)}
.cark .h1{top:-2px;font-size:calc(var(--cw,38px) * .36);opacity:.35;transform:scaleY(.6)}
.cark .h2{bottom:-2px;font-size:calc(var(--cw,38px) * .36);opacity:.35;transform:scaleY(.6)}
.cark .renk{position:absolute;inset:0;opacity:0;mix-blend-mode:multiply;transition:opacity .15s}
.cark.y .renk{opacity:.85;background:var(--yesil)}.cark.s .renk{opacity:.85;background:var(--sari)}.cark.g .renk{opacity:.7;background:var(--gri)}
.cark.y span,.cark.s span{color:#10140f}
.cark.imlec{box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),0 0 0 3px #fff,0 0 14px #fff}
.cark.don .serit{animation:don .16s ease-out}
@keyframes don{from{transform:translateY(-55%)}}
.cark.donA .serit{animation:donA .16s ease-out}
@keyframes donA{from{transform:translateY(55%)}}
.cark.cevir{animation:cevir .38s ease-in-out}
@keyframes cevir{50%{transform:scaleY(.1)}}
.cark.altin{background:linear-gradient(180deg,#5a4110,#d9b04a 25%,#fff1b8 50%,#d9b04a 75%,#5a4110)}
.cark.altin .renk{opacity:0}
.kilit .no{position:absolute;right:6px;top:3px;font-size:10px;font-weight:800;color:#5a3b17;opacity:.6}
/* kapak acilisi */
@keyframes isin{to{transform:rotate(360deg)}}
.govde.acik{transform-origin:50% 100%;animation:kapakAc 1s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes kapakAc{from{transform:translateZ(calc(var(--D) / 2))}to{transform:translateZ(calc(var(--D) / 2)) rotateX(-96deg);filter:brightness(.7)}}
#esya{position:absolute;left:50%;top:40%;font-size:96px;transform:translate(-50%,-50%) scale(0);z-index:5;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
#esya.cik{animation:esyaCik 1.2s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes esyaCik{0%{transform:translate(-50%,30%) scale(.2)}60%{transform:translate(-50%,-80%) scale(1.25) rotate(-8deg)}100%{transform:translate(-50%,-70%) scale(1.1) rotate(0)}}
#esya.parlak{filter:drop-shadow(0 0 18px #fff6a0) drop-shadow(0 0 40px #ffcf40)}
/* alt panel */
#panel{position:absolute;left:0;right:0;bottom:0;top:58%;display:flex;flex-direction:column;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;z-index:3}
#bilgi{display:flex;align-items:center;justify-content:space-between;gap:8px}
#hak{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
#hakBar{display:flex;gap:3px;flex-wrap:wrap;max-width:190px}
#hakBar i{width:10px;height:16px;border-radius:4px;background:linear-gradient(#ffd35a,#e0a817);box-shadow:0 1px 0 rgba(0,0,0,.4)}
#hakBar i.bos{background:rgba(255,255,255,.12);box-shadow:none}
#hakBar i.son{animation:son .9s infinite}
@keyframes son{50%{background:#ff6b5e}}
#steto{display:flex;align-items:center;gap:4px;border:0;border-radius:12px;padding:4px 10px;background:linear-gradient(#5aa7e8,#2f6fb0);color:#fff;font:800 14px "Baloo 2",system-ui;box-shadow:0 3px 0 #1d4a78;cursor:pointer}
#steto:disabled{filter:grayscale(1) brightness(.7)}
#gecmis{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;mask:linear-gradient(transparent,#000 14px)}
.gs{display:flex;gap:3px}
.gs b{width:22px;height:24px;border-radius:5px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#10140f}
.gs b.y{background:var(--yesil)}.gs b.s{background:var(--sari)}.gs b.g{background:var(--gri);color:#e6e8ea}
#klavye{display:flex;flex-direction:column;gap:5px}
#klavye .sira{display:flex;gap:4px;justify-content:center}
#klavye button{flex:1;max-width:36px;height:42px;border:0;border-radius:8px;background:#e6e0d2;color:#2a2219;font:800 17px "Baloo 2",system-ui;box-shadow:0 3px 0 #a99c80;padding:0;cursor:pointer}
#klavye button:active{transform:translateY(2px);box-shadow:0 1px 0 #a99c80}
#klavye button.y{background:var(--yesil);color:#fff;box-shadow:0 3px 0 #23712e}
#klavye button.s{background:var(--sari);color:#2a1f08;box-shadow:0 3px 0 #94721f}
#klavye button.g{background:#3c424a;color:#9aa3ad;box-shadow:0 3px 0 #22262b}
#klavye button.genis{max-width:none;flex:1.6;font-size:15px}
#klavye button.cevirB{flex:2.6;max-width:none;height:46px;background:linear-gradient(#ffd35a,#e0a817);box-shadow:0 3px 0 #a37a05;font-size:16px;letter-spacing:.04em}
/* ekranlar */
#damga{position:absolute;left:0;right:0;top:20%;text-align:center;font-weight:800;font-size:40px;color:#ffd35a;text-shadow:0 0 18px rgba(255,170,40,.8),0 4px 0 rgba(0,0,0,.5);pointer-events:none;opacity:0;z-index:8}
#damga.goster{animation:damga 1.2s cubic-bezier(.2,.9,.3,1.2) forwards}
#damga.yesil{color:#b8f27a;text-shadow:0 0 18px rgba(120,220,60,.8),0 4px 0 rgba(0,0,0,.5)}
#damga.kirmizi{color:#ff8a7a;text-shadow:0 0 18px rgba(255,80,60,.8),0 4px 0 rgba(0,0,0,.5)}
@keyframes damga{0%{opacity:0;transform:scale(2.2) rotate(-5deg)}15%{opacity:1;transform:scale(1) rotate(-5deg)}75%{opacity:1}100%{opacity:0}}
#ipuc{position:absolute;left:12px;right:12px;top:calc(56px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:7}
#ipuc.goster{opacity:1}
#ipuc span{display:inline-block;background:rgba(10,16,22,.85);border:1px solid rgba(255,211,90,.35);border-radius:12px;padding:5px 12px;font-weight:700;font-size:14px;line-height:1.25}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,10,16,.6);z-index:9;backdrop-filter:blur(2px)}
.card{background:linear-gradient(#2a3a4e,#18222f);border:1px solid rgba(255,211,90,.3);border-radius:22px;padding:18px;text-align:center;width:84%;max-height:86%;overflow-y:auto;box-sizing:border-box;box-shadow:0 12px 34px rgba(0,0,0,.55);animation:kartIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes kartIn{from{transform:scale(.6);opacity:0}}
.card h2{margin:0;font-size:28px;line-height:1.1}
.card .alt{font-size:12px;letter-spacing:.22em;opacity:.65;font-weight:800}
.card p{margin:6px 0 0;font-size:15px;opacity:.85}
.card .buyukIkon{font-size:74px;line-height:1.1;margin:4px 0}
.card .buyukIkon img{width:132px;height:132px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45));animation:ikonSal 2.8s ease-in-out infinite}
@keyframes ikonSal{50%{transform:translateY(-5px) rotate(2deg)}}
#esya img{width:150px;height:150px;object-fit:contain;display:block}
.card .parla{color:#fff3a0;text-shadow:0 0 12px #ffcf40;font-weight:800}
.btn{margin-top:12px;border:0;border-radius:16px;padding:10px 24px;font:800 19px "Baloo 2",system-ui;color:#1a1409;background:linear-gradient(#ffd35a,#e0a817);box-shadow:0 4px 0 #a37a05;cursor:pointer}
.btn.ikinci{background:#e6e0d2;box-shadow:0 4px 0 #a99c80;margin-right:8px}
.btn:active{transform:translateY(2px)}
.kelimeler{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.kelimeler b{background:#3c424a;border-radius:8px;padding:2px 10px;letter-spacing:.1em}
.rota{display:flex;flex-direction:column;gap:8px;margin-top:10px;text-align:left}
.rota .durak{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.rota .durak.su{background:rgba(255,211,90,.16);border-color:rgba(255,211,90,.55)}
.rota .durak.kilitli{opacity:.45}
.rota .durak em{font-style:normal;font-size:28px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.rota .durak em img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Koli Konvoy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2b3a4a;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#10334a}
#app{position:relative;margin:0 auto;height:100%;width:min(100vw,calc(100vh * 0.5625));overflow:hidden;background:#5d6b78}
#app canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:9px 10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:2}
.pill{background:rgba(255,255,255,.95);border-radius:16px;padding:2px 12px;font-weight:800;font-size:17px;display:flex;gap:6px;align-items:center;box-shadow:0 3px 0 rgba(16,51,74,.3);white-space:nowrap}
#sure{flex:1;position:relative;height:30px;padding:0;overflow:hidden}
#sureBar{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#7ee07a,#44b54a);transition:background .3s}
#sure.az #sureBar{background:linear-gradient(#ff8a75,#e0452f)}
#sure.az{animation:nabiz .5s infinite alternate}
@keyframes nabiz{to{transform:scale(1.04)}}
#sureYazi{position:relative;width:100%;text-align:center;font-size:17px;color:#10334a}
.hbtn{pointer-events:auto;border:0;cursor:pointer;font:800 18px "Baloo 2",sans-serif;padding:2px 11px}
.hbtn:active{transform:translateY(2px)}
.salla{animation:salla .35s}
.hbtn.pasif{opacity:.45}
@keyframes salla{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn.ikincil{background:#3b8fe8;box-shadow:0 5px 0 #245ea3;margin-right:8px}
#bYeniden{pointer-events:auto;border:0;cursor:pointer;font:800 18px "Baloo 2",sans-serif;padding:2px 11px}
#bYeniden:active{transform:translateY(2px)}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:24px;color:#fff;pointer-events:none;white-space:nowrap;-webkit-text-stroke:1.5px rgba(16,51,74,.85);text-shadow:0 3px 0 rgba(16,51,74,.7);animation:popUp .9s ease-out forwards;z-index:3}
.pop.buyuk{font-size:32px}
@keyframes popUp{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}18%{transform:translate(-50%,-60%) scale(1.2);opacity:1}32%{transform:translate(-50%,-70%) scale(1)}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-weight:800;font-size:54px;color:#fff;-webkit-text-stroke:2px rgba(16,51,74,.9);text-shadow:0 5px 0 rgba(16,51,74,.7);pointer-events:none;opacity:0;z-index:3}

@keyframes banner{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.1);opacity:1}32%{transform:scale(1)}78%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}

.card{background:#fff;border-radius:24px;padding:18px 24px 20px;text-align:center;box-shadow:0 8px 0 rgba(16,51,74,.3);animation:cardIn .4s cubic-bezier(.2,.9,.3,1.35);min-width:68%;max-width:84%}
@keyframes cardIn{from{transform:scale(.5);opacity:0}}
.card h2{margin:0 0 2px;font-size:30px;line-height:1.1}
.card p{margin:4px 0 0;font-size:16px;opacity:.8}
.yildiz{font-size:44px;letter-spacing:4px;margin:6px 0 0}
.yildiz span{display:inline-block;animation:yildiz .45s cubic-bezier(.2,.9,.3,1.6) both;filter:drop-shadow(0 3px 0 rgba(16,51,74,.25))}
.yildiz span.bos{filter:grayscale(1) opacity(.35)}
@keyframes yildiz{from{transform:scale(0) rotate(-90deg)}}
.btn{margin-top:14px;border:0;border-radius:18px;padding:10px 32px;font:800 22px "Baloo 2",system-ui,sans-serif;color:#fff;background:#ff7a3d;box-shadow:0 5px 0 #b64d1d;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b64d1d}
</style>

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="pill" id="hLevel">Level 1</div>
    <div class="pill" id="sure"><div id="sureBar"></div><div id="sureYazi">60</div></div>
    <button class="pill hbtn" id="bGeri" aria-label="Geri al">↶</button>
    <button class="pill hbtn" id="bYeniden" aria-label="Yeniden başla">↻</button>
  </div>
  <div id="banner"></div>
  <div id="over"><div class="card" id="kart"></div></div>
</div>
<script>
/* <<<MANTIK>>> */
/* Koli Konvoy oyun mantigi (v2: buyuyen yuk) — DOM'a dokunmaz, harness botlarla calistirir.
   Tahtada renkli yukler kayar. Seviye buyudukce kapladigi alan buyur: kutu 1x1, koli 1x2, palet 2x2, konteyner 2x4.
   Birlestirme alani korur: ayni renk + ayni seviyedeki iki yuk, birlesimleri bir ust seviyenin dikdortgenini TAM
   olusturacak sekilde yan yana ise birlesir (iki koli yan yana -> palet; uc uca -> olmaz).
   Kenardaki kapilarda kamyon bekler; siparis = renk + seviye + adet. Yuk, siparise uyuyorsa, kapi genisligine sigiyorsa
   ve kenara duz yolu aciksa cikar. Siparis tamamlaninca kamyon gider, kapinin siradaki kamyonu gelir.
   Kazanma: tahta bos. Kayip: sure ya da seviye kilidi (kalan yukler kalan siparisleri karsilayamaz). */
const RENKLER = ['#ef5a4a', '#3b8fe8', '#f5c230', '#3fbf6b', '#a45ee5'];
const SEVIYE_AD = ['', 'Kutu', 'Koli', 'Palet', 'Konteyner'];
const MAX_SEV = 4;
const OLCULER = [null, [[1, 1]], [[2, 1], [1, 2]], [[2, 2]], [[4, 2], [2, 4]]];   // seviye -> izinli [en, boy]
// kapilar: [kenar, boy]  kenar u=ust a=alt s=sol g=sag. doluluk: baslangic doluluk, koli: baslangicta koli olan yuk orani,
// sabit: sabit engel, birles: kurulum simulasyonunda birlestirme tercihi, maxSev, adet: siparis adedi araligi
const SEVIYELER = [
  { W: 4, H: 5, renk: 2, doluluk: 0.45, koli: 0, sabit: 0, birles: 0.6, maxSev: 2, adet: [1, 2], kapilar: [['u', 2], ['a', 2]], sure: 60, tohum: 1 },
  { W: 5, H: 6, renk: 2, doluluk: 0.55, koli: 0, sabit: 0, birles: 0.65, maxSev: 3, adet: [1, 2], kapilar: [['u', 2], ['s', 2], ['g', 2]], sure: 75, tohum: 11 },
  { W: 5, H: 6, renk: 3, doluluk: 0.6, koli: 0.2, sabit: 1, birles: 0.65, maxSev: 3, adet: [1, 3], kapilar: [['u', 2], ['s', 2], ['a', 2]], sure: 90, tohum: 4 },
  { W: 6, H: 7, renk: 3, doluluk: 0.65, koli: 0.25, sabit: 2, birles: 0.7, maxSev: 3, adet: [1, 3], kapilar: [['u', 2], ['s', 2], ['g', 2], ['a', 2]], sure: 100, tohum: 7 },
  { W: 6, H: 8, renk: 3, doluluk: 0.68, koli: 0.3, sabit: 3, birles: 0.75, maxSev: 4, adet: [1, 3], kapilar: [['u', 2], ['s', 2], ['g', 2], ['a', 3]], sure: 110, tohum: 10 },
  { W: 6, H: 8, renk: 4, doluluk: 0.7, koli: 0.3, sabit: 3, birles: 0.75, maxSev: 4, adet: [1, 3], kapilar: [['u', 3], ['s', 2], ['g', 2], ['a', 2]], sure: 120, tohum: 4 },
];

function rnd(S) { S.rs = (S.rs + 0x6D2B79F5) >>> 0; let t = S.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function karistir(S, d) { for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; }
const YON = { u: [0, -1], a: [0, 1], s: [-1, 0], g: [1, 0] };
const DORT = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const SABIT = -1;

function doluHarita(S) {
  const d = new Array(S.W * S.H).fill(0);
  for (const i of S.sabit) d[i] = SABIT;
  for (const k of S.kutular) for (let y = k.y; y < k.y + k.h; y++) for (let x = k.x; x < k.x + k.w; x++) d[y * S.W + x] = k.id;
  return d;
}
function yerBos(S, k, x, y, d) {
  if (x < 0 || y < 0 || x + k.w > S.W || y + k.h > S.H) return false;
  for (let yy = y; yy < y + k.h; yy++) for (let xx = x; xx < x + k.w; xx++) { const o = d[yy * S.W + xx]; if (o && o !== k.id) return false; }
  return true;
}
// (x,y,w,h)'deki yuku dondur: yeni dikdortgen eskisiyle ortusmeli ve bos olmali; merkeze en yakin aday once
function cevirAdaylari(S, k, x, y, w, h, d) {
  if (w === h) return [];
  const nw = h, nh = w, out = [], t = { id: k.id, w: nw, h: nh };
  for (let ny = y - nh + 1; ny < y + h; ny++) for (let nx = x - nw + 1; nx < x + w; nx++)
    if (yerBos(S, t, nx, ny, d)) out.push([nx, ny, nw, nh]);
  const cx = x + w / 2, cy = y + h / 2;
  return out.sort((a, b) => (Math.abs(a[0] + nw / 2 - cx) + Math.abs(a[1] + nh / 2 - cy)) - (Math.abs(b[0] + nw / 2 - cx) + Math.abs(b[1] + nh / 2 - cy)));
}
// yukun diger yukler yerindeyken kayarak ve donerek gidebildigi tum konumlar: [x, y, w, h] (kendi konumu dahil)
function ulasilir(S, k, d) {
  const anah = (x, y, w) => (w * 64 + y) * 64 + x;
  const gor = new Set([anah(k.x, k.y, k.w)]), q = [[k.x, k.y, k.w, k.h]], out = [];
  while (q.length) { const [x, y, w, h] = q.pop(); out.push([x, y, w, h]);
    const t = { id: k.id, w, h };
    for (const [dx, dy] of DORT) { const nx = x + dx, ny = y + dy, a = anah(nx, ny, w); if (gor.has(a) || !yerBos(S, t, nx, ny, d)) continue; gor.add(a); q.push([nx, ny, w, h]); }
    for (const c of cevirAdaylari(S, k, x, y, w, h, d)) { const a = anah(c[0], c[1], c[2]); if (gor.has(a)) continue; gor.add(a); q.push(c); }
  }
  return out;
}
// (x,y)'deki yuk kapidan duz cikabilir mi: tum hucreleri kapi acikligi icinde ve kenara yol acik
function kapiYolu(S, k, x, y, kp, d) {
  const [dx, dy] = YON[kp.kenar];
  if (dx) { if (y < kp.bas || y + k.h > kp.bas + kp.boy) return false; }
  else if (x < kp.bas || x + k.w > kp.bas + kp.boy) return false;
  for (let yy = y; yy < y + k.h; yy++) for (let xx = x; xx < x + k.w; xx++)
    for (let px = xx + dx, py = yy + dy; px >= 0 && py >= 0 && px < S.W && py < S.H; px += dx, py += dy) { const o = d[py * S.W + px]; if (o && o !== k.id) return false; }
  return true;
}
const onKamyon = kp => kp.kapali ? null : kp.kuyruk[0];
function kapiKabul(S, k, gi) {
  const t = onKamyon(S.kapilar[gi]);
  if (!t) return 'kapali'; if (t.renk !== k.renk) return 'renk'; if (t.sev !== k.sev) return 'seviye';
  return 'tamam';
}
// a yuku (ax,ay)'de iken b ile birlesimi bir ust seviyenin dikdortgeni mi? evetse {x,y,w,h}
function birlesim(a, ax, ay, b) {
  if (a.renk !== b.renk || a.sev !== b.sev || a.sev >= MAX_SEV) return null;
  const x0 = Math.min(ax, b.x), y0 = Math.min(ay, b.y), x1 = Math.max(ax + a.w, b.x + b.w), y1 = Math.max(ay + a.h, b.y + b.h);
  const w = x1 - x0, h = y1 - y0;
  if (w * h !== a.w * a.h * 2) return null;   // ortusmeyen iki esit alan bbox'i tam dolduruyorsa bosluk yoktur
  if (!OLCULER[a.sev + 1].some(([ow, oh]) => ow === w && oh === h)) return null;
  return { x: x0, y: y0, w, h };
}
// hamleler: {tur:'cik', id, g, x, y} ve {tur:'birles', id, hedef, x, y}
function hamleler(S, sadece) {
  const out = [], d = doluHarita(S);
  for (const k of S.kutular) {
    const cikis = sadece !== 'birles' ? S.kapilar.map((kp, gi) => gi).filter(gi => kapiKabul(S, k, gi) === 'tamam') : [];
    const esler = sadece !== 'cik' && k.sev < MAX_SEV ? S.kutular.filter(o => o.id !== k.id && o.renk === k.renk && o.sev === k.sev) : [];
    if (!cikis.length && !esler.length) continue;
    const yerler = ulasilir(S, k, d);
    for (const gi of cikis) { const y = yerler.find(([x, yy, w, h]) => kapiYolu(S, { id: k.id, w, h }, x, yy, S.kapilar[gi], d)); if (y) out.push({ tur: 'cik', id: k.id, g: gi, x: y[0], y: y[1], w: y[2], h: y[3] }); }
    for (const o of esler) { const y = yerler.find(([x, yy, w, h]) => birlesim({ ...k, w, h }, x, yy, o)); if (y) out.push({ tur: 'birles', id: k.id, hedef: o.id, x: y[0], y: y[1], w: y[2], h: y[3] }); }
  }
  return out;
}
function kaydir(S, id, x, y) {   // UI: yuku bir hucre kaydir
  const k = S.kutular.find(q => q.id === id); if (!k || Math.abs(x - k.x) + Math.abs(y - k.y) !== 1) return false;
  if (!yerBos(S, k, x, y, doluHarita(S))) return false;
  k.x = x; k.y = y; return true;
}
function tasi(S, k, x, y, w, h) {   // ulasilabilir konuma (ve yone) isinla (botlar/cozucu)
  w = w || k.w; h = h || k.h;
  if (x === k.x && y === k.y && w === k.w) return true;
  if (!ulasilir(S, k, doluHarita(S)).some(([ux, uy, uw]) => ux === x && uy === y && uw === w)) return false;
  k.x = x; k.y = y; k.w = w; k.h = h; return true;
}
function cevir(S, id) {   // UI: dokununca dondur (koli, konteyner)
  const k = S.kutular.find(q => q.id === id); if (!k || k.w === k.h) return false;
  const c = cevirAdaylari(S, k, k.x, k.y, k.w, k.h, doluHarita(S))[0]; if (!c) return false;
  [k.x, k.y, k.w, k.h] = c; return true;
}
// seviye kilidi: renk renk, alttan yukari; her seviyede siparis kadar yuk ayrilir, artanlar ikiserli ust seviyeye gecer.
// Eksik ya da tek artan = kesin kilit (geometriden bagimsiz; alan korundugu icin sayim ayni kalir).
function seviyeKilidi(S) {
  const renkler = new Set(S.kutular.map(k => k.renk)), ihtiyac = {};
  for (const kp of S.kapilar) if (!kp.kapali) kp.kuyruk.forEach((t, i) => { renkler.add(t.renk); const a = (ihtiyac[t.renk] = ihtiyac[t.renk] || new Array(MAX_SEV + 2).fill(0)); a[t.sev] += t.adet - (i === 0 ? kp.yuk : 0); });
  for (const renk of renkler) {
    const var_ = new Array(MAX_SEV + 2).fill(0), ist = ihtiyac[renk] || new Array(MAX_SEV + 2).fill(0);
    for (const k of S.kutular) if (k.renk === renk) var_[k.sev]++;
    let tasinan = 0;
    for (let s = 1; s <= MAX_SEV; s++) {
      const mevcut = var_[s] + tasinan;
      if (mevcut < ist[s]) return true;
      const artan = mevcut - ist[s];
      if (s === MAX_SEV) { if (artan) return true; break; }
      if (artan % 2) return true;
      tasinan = artan / 2;
    }
  }
  return false;
}
function sonDurum(S, olaylar) {
  if (!S.kutular.length) { S.bitti = true; S.kazandi = true; olaylar.push({ tur: 'kazandi' }); }
  else if (seviyeKilidi(S)) { S.bitti = true; S.neden = 'kilit'; olaylar.push({ tur: 'bitti', neden: 'kilit' }); }
}
// id yuku hedefe birlesir (x,y verilirse once oraya tasinir). Hedef yuk birlesim dikdortgenine buyur.
function birlestir(S, id, hedefId, x, y, w, h) {
  if (S.bitti) return null;
  const k = S.kutular.find(q => q.id === id), o = S.kutular.find(q => q.id === hedefId);
  if (!k || !o) return null;
  if (x != null && !tasi(S, k, x, y, w, h)) return null;
  const r = birlesim(k, k.x, k.y, o); if (!r) return null;
  const eski = { x: o.x, y: o.y, w: o.w, h: o.h };
  S.kutular.splice(S.kutular.indexOf(k), 1); Object.assign(o, r); o.sev++; S.hamle++;
  const olaylar = [{ tur: 'birlesti', kutu: k, hedef: o, eski }];
  sonDurum(S, olaylar);
  return olaylar;
}
function cikar(S, id, gi, x, y, w, h) {
  if (S.bitti) return null;
  const k = S.kutular.find(q => q.id === id), kp = S.kapilar[gi]; if (!k) return null;
  if (x != null && !tasi(S, k, x, y, w, h)) return null;
  if (kapiKabul(S, k, gi) !== 'tamam' || !kapiYolu(S, k, k.x, k.y, kp, doluHarita(S))) return null;
  S.kutular.splice(S.kutular.indexOf(k), 1); S.hamle++;
  kp.yuk++;
  const olaylar = [{ tur: 'cikti', kutu: k, kapi: gi }], t = kp.kuyruk[0];
  if (kp.yuk >= t.adet) {
    kp.kuyruk.shift(); kp.yuk = 0;
    olaylar.push({ tur: 'gitti', kapi: gi, kamyon: t });
    if (kp.kuyruk.length) olaylar.push({ tur: 'geldi', kapi: gi, kamyon: kp.kuyruk[0] }); else { kp.kapali = true; olaylar.push({ tur: 'kapandi', kapi: gi }); }
  }
  sonDurum(S, olaylar);
  return olaylar;
}
function uygula(S, m) { return m.tur === 'cik' ? cikar(S, m.id, m.g, m.x, m.y, m.w, m.h) : birlestir(S, m.id, m.hedef, m.x, m.y, m.w, m.h); }

/* Ileri kurulum (her level cozulebilir): tahta kutu (ve biraz koli) ile doldurulur, sonra rastgele bir oyun simule edilir:
   birlestirmeler (yuk gercekten buyur) + kapilardan cikislar. Bir kapidan ilk cikan yuk o kapinin acik siparisini belirler;
   siparis dolana kadar o kapidan sadece uyan yuk cikar. Tahta bosalamazsa tohum atilir. Simule edilen oyun gecerli bir cozumdur. */
const SIM_AGIRLIK = [0, 1, 4, 10];
function seviyeKur(p, tohum) {
  const S = { rs: (tohum >>> 0) || 1, W: p.W, H: p.H, kutular: [], sabit: [], kapilar: [], sayac: 1, bitti: false, kazandi: false, neden: null, hamle: 0 };
  const r = () => rnd(S);
  for (const [kenar, boy] of p.kapilar) {
    const uz = (kenar === 'u' || kenar === 'a') ? p.W : p.H;
    let bas = 0, tamam = false;
    for (let dn = 0; dn < 40 && !tamam; dn++) { bas = Math.floor(r() * (uz - boy + 1)); tamam = !S.kapilar.some(k => k.kenar === kenar && bas < k.bas + k.boy + 1 && k.bas < bas + boy + 1); }
    if (!tamam) return null;
    S.kapilar.push({ kenar, bas, boy, kuyruk: [], yuk: 0 });
  }
  const hucreler = karistir(S, [...Array(p.W * p.H).keys()]);
  for (const i of hucreler) { if (S.sabit.length >= p.sabit) break; const x = i % p.W, y = (i / p.W) | 0; if (x > 0 && y > 0 && x < p.W - 1 && y < p.H - 1) S.sabit.push(i); }
  const renkler = karistir(S, RENKLER.slice(0, p.renk));
  const d0 = doluHarita(S), hedef = Math.round(p.W * p.H * p.doluluk);
  let dolu = 0, n = 0;
  for (const i of hucreler) {
    if (dolu >= hedef) break;
    const x = i % p.W, y = (i / p.W) | 0, koli = r() < p.koli, yatay = r() < 0.5;
    const k = { id: S.sayac, renk: renkler[n % p.renk], sev: koli ? 2 : 1, x, y, w: koli && yatay ? 2 : 1, h: koli && !yatay ? 2 : 1 };
    if (!yerBos(S, k, x, y, d0)) { if (!koli) continue; k.sev = 1; k.w = 1; k.h = 1; if (!yerBos(S, k, x, y, d0)) continue; }

      const px = L.x + (k.x + k.w / 2 + Math.sign(Math.abs(cex) >= Math.abs(cey) ? cex : 0) * k.w / 2) * L.C, py = L.y + (k.y + k.h / 2 + Math.sign(Math.abs(cey) > Math.abs(cex) ? cey : 0) * k.h / 2) * L.C;
      for (let i = 0; i < 4; i++) { const a = Math.random() * 6.28; parca.push({ duman: true, x: px, y: py, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, g: 0, rv: 0, s: 2.5, c: '#eef2f5', t0: now, omur: 0.35 }); } } }

  if (guc >= 0.3 && (yon[0] || yon[1])) {
    const ids = new Set();
    for (let yy = k.y; yy < k.y + k.h; yy++) for (let xx = k.x; xx < k.x + k.w; xx++) { const nx = xx + yon[0], ny = yy + yon[1]; if (nx >= 0 && ny >= 0 && nx < S.W && ny < S.H) { const o = d[ny * S.W + nx]; if (o > 0 && o !== k.id) ids.add(o); } }
    for (const id of ids) { const o = S.kutular.find(q => q.id === id); if (o.renk === k.renk && o.sev === k.sev) dayanilan = o; }
  }
  if (dayanilan) {
    const r = birlesim(k, k.x, k.y, dayanilan);
    if (r && (!surukle.birles || surukle.birles.hedef !== dayanilan.id)) {
      const px = (k.x + k.w / 2 + dayanilan.x + dayanilan.w / 2) / 2, py = (k.y + k.h / 2 + dayanilan.y + dayanilan.h / 2) / 2;
      surukle.birles = { hedef: dayanilan.id, t0: now, r, px, py, yon }; SES.hazir();
    } else if (!r) {
      surukle.birles = null;
      if (k.sev >= MAX_SEV) { if (now - surukle.retZaman > 900) { surukle.retZaman = now; SES.ret(); pop('En büyük yük!', L.x + (dayanilan.x + dayanilan.w / 2) * L.C, L.y + dayanilan.y * L.C, '#ffb4a6'); } }
      else if (now - surukle.retZaman > 900) { surukle.retZaman = now; SES.ret(); pop(k.sev === 1 ? '' : 'Yan yana hizala', L.x + (dayanilan.x + dayanilan.w / 2) * L.C, L.y + dayanilan.y * L.C, '#ffb4a6'); }
    }
  } else surukle.birles = null;
  // kapiya dayali ve disari itiliyor mu
  for (let gi = 0; gi < S.kapilar.length; gi++) {
    const kp = S.kapilar[gi]; if (kp.kapali) continue;
    const it = { u: k.y - surukle.ty, a: surukle.ty - k.y, s: k.x - surukle.tx, g: surukle.tx - k.x }[kp.kenar];
    const dayali = { u: k.y === 0, a: k.y + k.h === S.H, s: k.x === 0, g: k.x + k.w === S.W }[kp.kenar];
    if (it < 0.3 || !dayali) continue;
    const [kdx] = YON[kp.kenar], hizada = kdx ? (k.y + k.h > kp.bas && k.y < kp.bas + kp.boy) : (k.x + k.w > kp.bas && k.x < kp.bas + kp.boy);

    if (now - surukle.retZaman > 700) {

      const f = kapiCerceve(gi), p = yerel(f, 0, -L.C * 0.6), t = onKamyon(kp);
      if (neden === 'seviye') pop(SEVIYE_AD[t.sev] + ' lazım!', p.x, p.y, '#ffb4a6');

}
// basili tutma birlestirmesi (parmak dursa da zaman ilerler)
function birlesmeKontrol(now) {
  if (!surukle || !surukle.birles || faz !== 'oyun') return;
  const bb = surukle.birles, k = S.kutular.find(q => q.id === surukle.id), o = S.kutular.find(q => q.id === bb.hedef);
  if (!k || !o) { surukle.birles = null; return; }
  const guc = bb.yon[0] ? (surukle.tx - k.x) * bb.yon[0] : (surukle.ty - k.y) * bb.yon[1];
  if (guc < 0.2 || !birlesim(k, k.x, k.y, o)) { surukle.birles = null; return; }
  if (now - bb.t0 < BIRLES_SURE) return;
  gecmisKaydet();
  const ol = birlestir(S, k.id, o.id); surukle = null;
  if (ol) olaylariOyna(ol); else gecmis.pop();
}
const birak = e => {
  if (!surukle || e.pointerId !== surukle.pid) return;
  const s0 = surukle; surukle = null;
  // kisa dokunus (surukleme yok): koli / konteyner doner
  if (s0.adim === 0 && s0.maxYol < L.C * 0.3 && performance.now() - s0.t0 < 300) {
    const k = S.kutular.find(q => q.id === s0.id);
    if (k && k.w !== k.h) {
      if (cevir(S, k.id)) { const v = vis.get(k.id); v.x = k.x; v.y = k.y; v.don = performance.now(); v.donYon = 1; SES.don(); titre(8); }
      else { SES.ret(); pop('Dönecek yer yok', L.x + (k.x + k.w / 2) * L.C, L.y + k.y * L.C, '#ffb4a6'); }

};
// geri al: birlestirme ve cikislardan once durum kaydedilir
const gecmis = [];

function geriAl() {
  const izin = S && gecmis.length && (faz === 'oyun' || ((faz === 'bitiyor' || faz === 'sonuc') && S.neden === 'kilit'));
  if (!izin) { SES.ret(); $('bGeri').classList.add('salla'); setTimeout(() => $('bGeri').classList.remove('salla'), 350); return; }
  const no = S.no, sure = S.sure;
  S = gecmis.pop(); S.no = no; S.sure = sure;
  oyunJeton++; surukle = null; ucan.length = 0; birlesen.length = 0;
  const now = performance.now();
  for (const k of S.kutular) { const v = vis.get(k.id); vis.set(k.id, { x: k.x, y: k.y, kalk: 0, dogus: 0, pop: v ? 0 : now }); }
  for (const id of [...vis.keys()]) if (!S.kutular.some(k => k.id === id)) vis.delete(id);
  S.kapilar.forEach((kp, gi) => { const g = G[gi]; Object.assign(g, { K: onKamyon(kp), yuk: kp.yuk, uzak: 0, alfa: 1, gelis: false, is: null, sira: [], kapali: !!kp.kapali, zip: now }); });
  faz = 'oyun'; $('over').style.display = 'none'; SES.geri(); hudSure();
}
cv.addEventListener('pointerup', birak); cv.addEventListener('pointercancel', birak);
$('bGeri').onclick = () => { SES.baslat(); geriAl(); };
$('bYeniden').onclick = () => { SES.baslat(); if (S && faz !== 'sonuc') levelBaslat(S.no); };
addEventListener('resize', yerlesim);

/* ---------------- DONGU ---------------- */
function kare(now) {
  if (S) $('bGeri').classList.toggle('pasif', !gecmis.length);
  requestAnimationFrame(kare);
  const dt = Math.min(0.05, (now - sonZaman) / 1000); sonZaman = now;
  if (window.PAUSE) return;
  guncelle(dt, now); ciz(now);
}
function guncelle(dt, now) {
  if (!S) return;
  if (faz === 'oyun' && dokunuldu) {
    const once = Math.ceil(kalan); kalan -= dt;
    if (kalan <= 10 && Math.ceil(kalan) !== once && kalan > 0) SES.tik();
    if (kalan <= 0) { kalan = 0; faz = 'bitiyor'; surukle = null; sonuc(false, 'sure'); }
    hudSure();
  }
  const k = 1 - Math.exp(-dt * 26);
  birlesmeKontrol(now);
  for (const b of S.kutular) {
    const v = vis.get(b.id); if (!v) continue;
    let hx = b.x, hy = b.y, kalk = 0;
    if (surukle && surukle.id === b.id) { kalk = 1; hx += Math.max(-0.14, Math.min(0.14, surukle.tx - b.x)); hy += Math.max(-0.14, Math.min(0.14, surukle.ty - b.y)); }
    v.x += (hx - v.x) * k; v.y += (hy - v.y) * k; v.kalk += (kalk - v.kalk) * (1 - Math.exp(-dt * 18));
  }

}
yerlesim();
levelBaslat(Math.min(kayit.level || 0, SEVIYELER.length - 1));
requestAnimationFrame(kare);
window.G_ = { get S() { return S; }, levelBaslat, cikar, birlestir, uygula, cevir, geriAl, gecmisKaydet, hamleler, coz, olaylariOyna, suruklemeAdim, get L() { return L; }, get faz() { return faz; }, ciz, guncelle, G };

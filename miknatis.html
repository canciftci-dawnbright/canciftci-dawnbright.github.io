<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mıknatıs Deposu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1b1f24;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
#app{position:relative;margin:0 auto;height:100%;width:min(100vw,calc(100vh * 0.5625));overflow:hidden}
#app canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px;pointer-events:none}
.pill{background:rgba(15,20,30,.62);border-radius:16px;padding:5px 12px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pill b{font-variant-numeric:tabular-nums}
.pill b.bump{animation:bump .3s cubic-bezier(.2,.9,.3,1.5)}
@keyframes bump{0%{transform:scale(1.6)}100%{transform:scale(1)}}
#hopWrap{position:absolute;left:12px;right:12px;top:calc(52px + env(safe-area-inset-top,0px));pointer-events:none}
#hopBar{height:14px;border-radius:8px;background:rgba(10,14,20,.55);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
#hopFill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#4FD68A,#F2C230,#E5484D);transition:width .2s}
#hopTxt{position:absolute;left:10px;top:-1px;font-size:13px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#hopWrap.warn #hopBar{animation:warn .5s infinite}
@keyframes warn{50%{box-shadow:0 0 14px 3px #E5484D}}
button.pill{border:0;font-family:inherit;pointer-events:auto;cursor:pointer}
#quota{gap:10px}
#quota i{display:inline-flex;align-items:center;gap:4px;font-style:normal}
#quota i s{width:13px;height:13px;border-radius:4px;display:inline-block;text-decoration:none}
#quota i.done{opacity:.35}
#badges b{position:absolute;transform:translate(-50%,-50%);padding:2px 9px;border-radius:12px;font-size:14px;font-weight:800;background:rgba(12,16,22,.6);box-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;transition:transform .15s}
#badges b.hit{transform:translate(-50%,-50%) scale(1.35)}
#badges b.done{background:#2f7d4f}
#load{position:absolute;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;padding:5px 14px;border-radius:18px;background:rgba(15,20,30,.62);font-weight:800;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.25);opacity:.45;transition:opacity .15s,transform .15s}
#load.on{opacity:1;transform:translateX(-50%) scale(1.06)}
#load s{width:18px;height:18px;border-radius:6px;background:#8d98a6;text-decoration:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
#load.on s{box-shadow:0 0 12px 2px currentColor}
#load b.full{color:#FFD166}
#heatWrap{position:absolute;left:12px;right:12px;top:calc(76px + env(safe-area-inset-top,0px));pointer-events:none;display:none}
#heatBar{height:10px;border-radius:6px;background:rgba(10,14,20,.55);overflow:hidden}
#heatFill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#63c8ff,#F2C230,#E5484D);transition:width .1s}
#heatTxt{position:absolute;left:10px;top:-3px;font-size:11px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#warn{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:800;font-size:26px;color:#FFD166;text-shadow:0 2px 6px rgba(0,0,0,.8);pointer-events:none;display:none}
#lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0 14px}
#lvls button{border:0;border-radius:12px;padding:7px 0 3px;font:800 19px "Baloo 2",system-ui,sans-serif;color:#fff;background:#E8663F;box-shadow:0 4px 0 #a8431f}
#lvls button small{display:block;font-size:10px;color:#ffe7a0;height:12px}
#lvls button.lock{background:#9aa3ad;box-shadow:0 4px 0 #6f7780}
#hint{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-weight:800;font-size:19px;text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:800;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 rgba(10,10,20,.9);animation:popUp .9s ease-out forwards}
@keyframes popUp{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,20,.55)}
#over .card{background:#f4efe4;color:#2a2f36;border-radius:22px;padding:20px 24px;text-align:center;box-shadow:0 8px 0 #9aa3ad;animation:cardIn .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes cardIn{from{transform:scale(.6)}}
#over h2{margin:0 0 4px;font-size:30px}
#over p{margin:2px 0 14px;font-size:17px}
#over button{border:0;border-radius:16px;padding:10px 24px;font:800 20px "Baloo 2",system-ui,sans-serif;color:#fff;background:#E8663F;box-shadow:0 5px 0 #a8431f}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.45) 100%)}
#quota i.hit{animation:qhit .4s cubic-bezier(.2,.9,.3,1.6)}
@keyframes qhit{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
</style>

<div id="app">

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ---------------- AYARLAR ---------------- */
const COLORS = [
  { key: 'red', hex: '#E8483F', name: 'Kırmızı' },
  { key: 'blue', hex: '#3A9BE8', name: 'Mavi' },
  { key: 'yellow', hex: '#F2C230', name: 'Sarı' },
];
const HOP = { x: 0, z: -1.0, w: 3.7, d: 2.8, h: 1.5 };      // orta hazne
const CRATES = [{ x: -1.42, z: 2.05 }, { x: 1.42, z: 2.05 }, { x: -1.42, z: 4.35 }];   // 2x2 kare düzen, aralarında boşluk   // önde renkli kutular (dördüncüsü paslı kutu)
const MAG_Y = 2.35, MAG_SPEED = 9;                            // mıknatıs yüksekliği ve takip hızı
const PULL = 115, PULL_R = 2.6, GRAB_D = 0.85, HOLD_MAX = 6, PULL_MAX = 4, MAX_V = 3.4;   // MAX_V: çekilen parçanın hız tavanı (fırlamayı önler)
/* 10 bölüm: kota + besleme hızı + zorluklar. rust: paslı hurda, heat: mıknatıs ısınır,
   heavy: ağır blok, power: elektrik dalgalanması, swap: kutular yer değiştirir */
const LEVELS = [   // iki bölümde bir yeni mekanik: 2 paslı hurda, 4 ısınma, 6 ağır blok, 8 elektrik, 10 kutu karışması
  { n: 1, quota: [5, 4, 0], feed: 1.7, cap: 30, err: 6 },
  { n: 2, quota: [5, 5, 5], feed: 1.55, cap: 30, err: 6, rust: 0.15, yeni: 'Paslı hurda: gri kutuya at' },
  { n: 3, quota: [6, 6, 6], feed: 1.45, cap: 28, err: 6, rust: 0.16 },
  { n: 4, quota: [7, 6, 6], feed: 1.35, cap: 28, err: 5, rust: 0.16, heat: true, yeni: 'Mıknatıs ısınır: kısa çek' },
  { n: 5, quota: [7, 7, 7], feed: 1.25, cap: 27, err: 5, rust: 0.18, heat: true },
  { n: 6, quota: [8, 7, 7], feed: 1.15, cap: 27, err: 5, rust: 0.18, heat: true, heavy: 0.16, yeni: 'Ağır blok: 3 yuva kaplar' },
  { n: 7, quota: [8, 8, 8], feed: 1.08, cap: 26, err: 5, rust: 0.18, heat: true, heavy: 0.18 },
  { n: 8, quota: [9, 8, 8], feed: 1.02, cap: 26, err: 4, rust: 0.18, heat: true, heavy: 0.18, power: true, yeni: 'Elektrik düşer: çekim zayıflar' },
  { n: 9, quota: [9, 9, 9], feed: 0.96, cap: 25, err: 4, rust: 0.18, heat: true, heavy: 0.2, power: true },
  { n: 10, quota: [10, 9, 9], feed: 0.9, cap: 25, err: 4, rust: 0.18, heat: true, heavy: 0.2, power: true, swap: true, yeni: 'Kutular karışır: renklere bak' },
];
const HEAT_UP = 0.3, HEAT_DOWN = 0.7, COOL_T = 1.6;      // ısınma hızı, soğuma, aşırı ısınınca kapalı kalma
const POWER_EVERY = 13, POWER_T = 3.2, POWER_K = 0.35;     // elektrik dalgalanması
const SWAP_EVERY = 16;                                     // kutu yer değiştirme
const SAVE_KEY = 'dbg.miknatis.v1';
const SAVE = (() => { try { return Object.assign({ stars: [] }, JSON.parse(localStorage.getItem(SAVE_KEY))); } catch (e) { return { stars: [] }; } })();
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} };
const HOP_CAP = 26;                                           // haznede bu kadar parça birikirse taşar
const FEED_T0 = 1.5, FEED_MIN = 0.62, FEED_RAMP = 0.005;       // konveyör besleme aralığı (giderek hızlanır)
const SCRAP_MAX = 10;                                         // yanlış kutu / yere düşürme hakkı
const PHYS_DT = 1 / 120, PHYS_SUB = 3;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let seed = 7; const srnd = (a, b) => a + ((seed = (seed * 16807) % 2147483647) / 2147483647) * (b - a);
const G = window.G = { FAST: false };

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ac = null, master, noise; const last = {};
  let hum = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.85; master.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(t, dur, f0, f1, g, type) { const o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.005); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gg); gg.connect(master); o.start(t); o.stop(t + dur + 0.02); }
  function burst(t, dur, f, q, g, type) { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = type || 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.005); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(gg); gg.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02); }
  const ok = (k, gap) => { if (!ac || G.FAST) return false; const t = ac.currentTime; if (last[k] && t - last[k] < gap) return false; last[k] = t; return true; };
  return { init,
    humOn() { if (!ac || hum || G.FAST) return; const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = 58; o2.type = 'sine'; o2.frequency.value = 116; fl.type = 'lowpass'; fl.frequency.value = 420;
      g.gain.value = 0; o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(master); o.start(); o2.start(); g.gain.setTargetAtTime(0.14, ac.currentTime, 0.05); hum = { o, o2, g }; },
    humOff() { if (!hum) return; const h = hum; hum = null; h.g.gain.setTargetAtTime(0, ac.currentTime, 0.05); setTimeout(() => { try { h.o.stop(); h.o2.stop(); } catch (e) {} }, 300); },
    clank(v, p) { if (!ok('clank', 0.02)) return; const t = ac.currentTime, fr = (420 + rnd(-80, 160)) * (p || 1);
      [1, 2.4, 4.1].forEach((k, i) => tone(t, 0.3 - i * 0.07, fr * k, fr * k * 0.96, 0.07 * v / (i + 1), 'sine')); burst(t, 0.04, 3200, 1.2, 0.18 * v); },
    snap() { if (!ok('snap', 0.03)) return; const t = ac.currentTime; tone(t, 0.09, 1200, 420, 0.22, 'triangle'); burst(t, 0.05, 5000, 1, 0.2, 'highpass'); tone(t, 0.14, 180, 90, 0.16, 'sine'); },
    drop(n) { if (!ok('drop', 0.04)) return; const t = ac.currentTime, fr = 440 * Math.pow(2, Math.min(n, 12) * 2 / 12); tone(t, 0.16, fr, fr, 0.06, 'triangle'); tone(t + 0.04, 0.2, fr * 2, fr * 2, 0.025, 'sine'); },
    scrap() { if (!ok('scrap', 0.06)) return; const t = ac.currentTime; tone(t, 0.22, 300, 120, 0.1, 'square'); burst(t, 0.25, 700, 0.8, 0.22, 'lowpass'); },
    rumble() { if (!ok('rumble', 0.7)) return; const t = ac.currentTime; burst(t, 1.1, 150, 0.7, 0.45, 'lowpass'); tone(t, 0.8, 70, 40, 0.2, 'sine'); },
    ambient(on) { if (!ac) return; if (on && !this._amb) { const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = 42; o2.type = 'sine'; o2.frequency.value = 63; fl.type = 'lowpass'; fl.frequency.value = 180;
        g.gain.value = 0; o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(master); o.start(); o2.start(); g.gain.setTargetAtTime(0.05, ac.currentTime, 1.5); this._amb = { o, o2, g }; } },
    win() { if (!ac || G.FAST) return; const t = ac.currentTime; [0,4,7,12,16].forEach((n,i)=>{ const fr=523.25*Math.pow(2,n/12); tone(t+i*0.09,0.55,fr,fr,0.075,'triangle'); }); burst(t,0.3,6000,1,0.08); },
    lose() { if (!ac || G.FAST) return; const t = ac.currentTime; tone(t,0.5,420,180,0.12,'sawtooth'); tone(t+0.25,0.6,300,120,0.09,'triangle'); burst(t,0.6,400,0.7,0.25,'lowpass'); },
    chute() { if (!ok('chute', 0.12)) return; const t = ac.currentTime; burst(t, 0.18, 900, 1.2, 0.2, 'lowpass'); tone(t, 0.12, 320, 160, 0.06, 'triangle'); },
    zap() { if (!ok('zap', 0.08)) return; const t = ac.currentTime; burst(t, 0.12, 6000, 1.5, 0.12, 'highpass'); tone(t, 0.08, 900, 1600, 0.04, 'square'); },
  };
})();
const buzz = ms => { try { const ua = navigator.userActivation; if (!G.FAST && navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} };

/* ---------------- SAHNE ---------------- */
const app = $('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
app.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog('#2a3038', 16, 40);
scene.background = (() => { const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#4b5a6b'); gr.addColorStop(0.6, '#2f3944'); gr.addColorStop(1, '#232a33'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const camera = new THREE.PerspectiveCamera(64, 9 / 16, 0.1, 100);
const CAM_POS = new THREE.Vector3(0, 9.4, 10.1), CAM_LOOK = new THREE.Vector3(0, 0.3, 1.3);
camera.position.copy(CAM_POS); camera.lookAt(CAM_LOOK);
scene.add(new THREE.HemisphereLight('#cfe2ff', '#3a3a32', 1.0));
const sun = new THREE.DirectionalLight('#fff0d8', 2.1); sun.position.set(-4, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 25 }); sun.shadow.bias = -0.0009;
scene.add(sun, sun.target);
const rimLight = new THREE.DirectionalLight('#8fd0ff', 0.6); rimLight.position.set(3, 3, -5); scene.add(rimLight);

const rim = (mat, k) => { k = k === undefined ? 0.3 : k;
  mat.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n    float rf = pow(1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0), 3.0);\n    gl_FragColor.rgb += vec3(0.85, 0.93, 1.0) * rf * ' + k.toFixed(2) + ';'); };
  mat.customProgramCacheKey = () => 'rim' + k; return mat; };
const std = (color, o, rk) => rim(new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.7 }, o || {})), rk);
const mesh = (geo, mat, shadow) => { const m = new THREE.Mesh(geo, mat); m.castShadow = shadow !== false; m.receiveShadow = true; return m; };
const canvasTex = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };


/* ---------------- DEPO ---------------- */
const floorTex = canvasTex(64, 64, (g, w, h) => { g.fillStyle = '#5a5f66'; g.fillRect(0, 0, w, h); g.strokeStyle = '#4a4f56'; g.lineWidth = 4; g.strokeRect(0, 0, w, h);
  g.fillStyle = '#646a72'; for (let i = 0; i < 20; i++) g.fillRect(Math.random() * w, Math.random() * h, 3, 2); }, [16, 16]);
const floorM = mesh(new THREE.PlaneGeometry(60, 60), std('#ffffff', { map: floorTex, roughness: 0.95 }, 0.1), false);
floorM.rotation.x = -Math.PI / 2; scene.add(floorM);
const wall = mesh(new THREE.BoxGeometry(30, 10, 0.4), std('#39424d', { roughness: 0.9 }, 0.15)); wall.position.set(0, 5, -8); scene.add(wall);
for (let i = 0; i < 2; i++) { const sh = mesh(new THREE.BoxGeometry(28, 0.16, 1.1), std('#6b7480', { metalness: 0.4, roughness: 0.5 })); sh.position.set(0, 1.9 + i * 2.1, -7.3); scene.add(sh);
  for (let k = -6; k <= 6; k++) { const box = mesh(new THREE.BoxGeometry(0.9, 0.7, 0.8), std(['#8a6b45', '#6f7a86', '#7d5f52'][(i + k + 9) % 3], { roughness: 0.85 }));
    box.position.set(k * 2.2 + (i % 2 ? 0.7 : 0), 2.35 + i * 2.1, -7.3); scene.add(box); } }
const steel = std('#8d98a6', { metalness: 0.55, roughness: 0.45 }, 0.35);
const steelDark = std('#5d6874', { metalness: 0.5, roughness: 0.55 }, 0.25);
function staticBox(w, h, d, x, y, z, mat) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), mat || steel); m.position.set(x, y, z); scene.add(m);
  const b = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)) }); b.position.set(x, y, z); world.addBody(b); return m;
}

/* ---------------- FİZİK ---------------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -16, 0) });

const unlocked = () => { let i = 0; while (i < LEVELS.length - 1 && SAVE.stars[i]) i++; return i; };

/* ---------------- ÇİZİM ---------------- */

/* ---------------- ARAYÜZ ---------------- */

    ? '<i class="' + (q <= 0 ? 'done' : '') + '"><s style="background:' + COLORS[i].hex + '"></s>' + Math.max(0, q) + '</i>' : '').join('');

/* ---------------- GİRDİ: mıknatısı parmakla sürükle ---------------- */
const ray = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

      setTimeout(() => { for (let i = 0; i < 70; i++) parca.push({ k: 'konf', x: Math.random() * W, y: -20 - Math.random() * 120, vx: (Math.random() - 0.5) * 80, vy: 40 + Math.random() * 120, o: 1, s: 2.2 + Math.random(), c: ['#ef4b4b', '#3d8bf0', '#3cc45a', '#f5c430', '#f070b8', '#fff'][i % 6] }); }, 500); } else SES.kaybet(); }
  }
}

/* ---------------- dongu */
function kare(t) { requestAnimationFrame(kare); if (!O) return; const dt = Math.min(0.1, (t - son) / 1000); son = t;
  if (!ekranAcik()) { acc += dt; let n = 0; while (acc >= DT && n < 5) { adim(O); olaylar(t); acc -= DT; n++; } if (n === 5) acc = 0; }
  ogretDenetle(); ciz(t); hud(); if (bitisZ && t > bitisZ) { bitisZ = 0; bitisEkrani(); } }
function hud() { $('seviyeAd').textContent = (O.n + 1) + '. ' + O.S.ad; $('ipucuSay').textContent = kayit.ipucu; $('bIpucu').classList.toggle('bos', kayit.ipucu <= 0); }
const ekranAcik = () => !$('ekran').classList.contains('gizli');
const titre = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { } };

/* ---------------- ogretici + ipucu */
const OGRET_METIN = [
  'Pime <b>dokun</b>, çekilsin! En alttaki pim gidince <b>mavi</b> şekerler düşer; eğik pim onları <b>mavi kavanoza</b> kaydırır.',
  'Şimdi <b>eğik pimi</b> çek: yol açılır, düşen şekerler artık <b>sol</b> kavanoza gider.',
  'Son pimi çek: kırmızılar <b>kırmızı kavanoza</b>! Yanlış renk giren kavanoz <b>bozulur</b>.',
];
function ogretHedef(ad) { return ogret && ogret.adim < ogret.sira.length && ogret.sira[ogret.adim] === ad && !ogret.bekle; }
function ogretIlerle() { ogret.adim++; ogret.bekle = true; const a = ogret.adim; if (ogret.ipucu) { ogret = null; return; } ip(a < ogret.sira.length ? '👀 İzle… şekerler dursun.' : 'Harika! Hepsi yerinde 🍬', a < ogret.sira.length ? 0 : 2000); if (a >= ogret.sira.length) ogret = null; }
function ogretDenetle() { if (!ogret || !ogret.bekle || ogret.ipucu || !sakinMi(O)) return; ogret.bekle = false; ip(OGRET_METIN[ogret.adim] || 'Parlayan pime dokun.'); } // sekerler durunca sonraki adim
$('bIpucu').addEventListener('pointerdown', e => { e.stopPropagation(); SES.hazirla(); if (!O || O.bitti || ekranAcik() || ogret) return;
  const cz = O.S.cozum, ok = yapilan.every((x, i) => x === cz[i]);
  if (!ok) { ip('Bu sıra çözüme gitmiyor. <b>↻ Tekrar</b> ile baştan dene.', 2600); return; }
  if (kayit.ipucu <= 0) { ip('İpucun kalmadı. 3 yıldızla bitirdiğin her bölüm <b>+1 💡</b> verir.', 2400); return; }
  if (yapilan.length >= cz.length) return; kayit.ipucu--; yaz(); const sonraki = cz[yapilan.length]; ogret = { sira: cz, adim: yapilan.length, bekle: false, ipucu: true };
  ip(sonraki[0] === 'k' ? 'Parlayan <b>yönlendiriciye</b> dokun.' : 'Parlayan <b>pimi</b> çek.', 2400);
  setTimeout(() => { if (ogret && ogret.ipucu) ogret = null; }, 3500); });
$('bTekrar').addEventListener('pointerdown', e => { e.stopPropagation(); SES.hazirla(); if (!O || ekranAcik()) return; bolumBaslat(O.n); });
$('bMenu').addEventListener('click', () => { SES.hazirla(); haritaAc(); });
let ipZ = 0;
function ip(metin, sure) { const d = $('ip'); if (!metin) { d.classList.add('gizli'); return; } d.innerHTML = metin; d.classList.remove('gizli'); clearTimeout(ipZ); if (sure) ipZ = setTimeout(() => d.classList.add('gizli'), sure); }

/* ---------------- ekranlar */
function ekranAc(html) { const e = $('ekran'); e.innerHTML = `<div class="kart">${html}</div>`; e.classList.remove('gizli'); }
function ekranKapat() { $('ekran').classList.add('gizli'); son = performance.now(); acc = 0; }
const ENGEL_IKON = { gri: () => sekerImg('g', 2.2), tas: () => sekerImg('t', 1.6), dugme: () => '<div class="dIkon"><i></i></div>', kapi: () => '<div class="kIkon"></div>', zincir: () => '<div class="zIkon">⛓️</div>' };
function sekerImg(r, k) { const sp = sekerSprite(r, r === 't' ? 11 : R); return `<img src="${sp.toDataURL()}" style="height:${Math.round(sp.width / 3 * k * 2)}px;width:auto">`; }
function haritaAc() { const n = BOLUMLER.length;
  ekranAc(`<div class="ust">FİZİK BULMACA · ${n} BÖLÜM</div><h1>Pim Çek Ayır</h1><p>Pimlere dokun, şekerler aksın! Her şeker <b>kendi renginin kavanozuna</b> girmeli; yanlış renk giren kavanoz bozulur. Pimleri <b>doğru sırayla</b> çek.</p>
    <div class="ornek">${['k', 'm', 'y', 's', 'p'].map(r => sekerImg(r, 1.6)).join('')}</div>
    <div class="harita">${Array.from({ length: n }, (_, i) => { const S = BOLUMLER[i], y = kayit.yildiz[i] || 0;
      return `<button ${i > kayit.acik ? 'disabled' : ''} class="${i === kayit.acik ? 'su' : ''}" data-n="${i}"><div class="hIkon">${S.yeniEngel ? ENGEL_IKON[S.yeniEngel]() : sekerImg('k', 1.2)}</div><span>${i + 1}</span><small>${'★'.repeat(y)}${'☆'.repeat(3 - y)}</small></button>`; }).join('')}</div>
    <button class="btn" id="bOyna">${kayit.acik ? 'Devam: ' + (Math.min(kayit.acik, n - 1) + 1) : 'Başla'} ▶</button>`);
  $('ekran').querySelectorAll('.harita button').forEach(b => b.onclick = () => { SES.hazirla(); bolumBaslat(+b.dataset.n); });
  $('bOyna').onclick = () => { SES.hazirla(); bolumBaslat(Math.min(kayit.acik, n - 1)); }; }
function bolumBaslat(n) {
  O = oyunBaslat(n); yapilan = []; parca = []; bitisZ = 0; sallaKav = -1; ogret = null; kapakT = 0; sarsZ = 0; ekranKapat(); ip(''); afis(n);
  // baslangicta sekerler yerine otursun
  for (let i = 0; i < 240; i++) adim(O); O.olaylar.length = 0;
  const S = O.S, yeni = S.yeniEngel;
  if (S.ogretici) { ogret = { sira: S.cozum, adim: 0, bekle: false }; ip(OGRET_METIN[0]); }
  else ip(`Pimleri doğru sırayla çek · ${O.kav.length} kavanoz`, 2400);
  if (yeni && !kayit.gordu[yeni]) { const E = ENGEL[yeni];
    ekranAc(`<div class="ust">YENİ ENGEL</div><div class="engelG">${ENGEL_IKON[yeni]()}</div><h2>${E.ad}</h2><p>${E.metin}</p><button class="btn" id="bTamam">Anladım ▶</button>`);
    $('bTamam').onclick = () => { kayit.gordu[yeni] = 1; yaz(); ekranKapat(); }; }
}
function afis(n) { const a = $('afis'); a.innerHTML = `<small>BÖLÜM ${n + 1}</small>${BOLUMLER[n].ad}`; a.classList.remove('oyna'); a.offsetWidth; a.classList.add('oyna'); }
function bitisEkrani() {
  const yuzde = Math.round((O.oran || 0) * 100);
  if (O.kazandi) { const y = yildiz(O), eski = kayit.yildiz[O.n] || 0; kayit.yildiz[O.n] = Math.max(eski, y); if (y === 3 && eski < 3) kayit.ipucu++; kayit.acik = Math.max(kayit.acik, Math.min(O.n + 1, BOLUMLER.length - 1)); yaz();
    ekranAc(`<div class="ust">${O.n + 1}. BÖLÜM</div><h1>Kavanozlar doldu!</h1><div class="yildizlar">${[0, 1, 2].map(i => `<span class="${i < y ? 'dolu' : ''}" style="animation-delay:${0.2 + i * 0.25}s">★</span>`).join('')}</div>
      <p>Şekerlerin <b>%${yuzde}</b>'i doğru kavanozda.${y < 3 ? '<br>3 yıldız için şekerlerin neredeyse hepsi kavanoza girmeli.' : ''}${y === 3 && eski < 3 ? '<br><b>+1 💡 ipucu kazandın!</b>' : ''}</p>
      ${O.n + 1 < BOLUMLER.length ? '<button class="btn" id="bSonraki">Sonraki ▶</button>' : '<p><b>Bütün bölümler bitti! 🎉</b></p>'}<button class="btn gri" id="bHarita">Harita</button>`);
    if ($('bSonraki')) $('bSonraki').onclick = () => bolumBaslat(O.n + 1); $('bHarita').onclick = haritaAc; }
  else { const boz = O.neden === 'bozuldu', K = O.kav[sallaKav] || O.kav.find(k => k.bozuk);
    const neden = boz && K ? `<b>${RENK[K.renk].ad}</b> kavanoza <b>${(RENK[O.bozanRenk] || { ad: 'yanlış' }).ad.toLowerCase()}</b> ${O.bozanRenk === 't' ? 'girdi' : 'şeker girdi'}!` : `Şekerler yolda kaldı: <b>%${yuzde}</b> doğru kavanozda (en az %90 gerekli).`;
    ekranAc(`<div class="ust">${O.n + 1}. BÖLÜM</div><h1>${boz ? '💥 Kavanoz bozuldu' : '😕 Olmadı'}</h1><p>${neden}<br>Pimlerin <b>sırasını</b> değiştirip yeniden dene.</p>
      <button class="btn" id="bTekrar2">Tekrar dene</button><button class="btn gri" id="bHarita">Harita</button>`);
    $('bTekrar2').onclick = () => bolumBaslat(O.n); $('bHarita').onclick = haritaAc; }
}

/* ---------------- test kancalari */
window.G = { get O() { return O; }, bolumBaslat, eylem, ileri: k => { for (let i = 0; i < k; i++) { adim(O); olaylar(performance.now()); } } };
boyutla(); O = oyunBaslat(0); for (let i = 0; i < 240; i++) adim(O); O.olaylar.length = 0; haritaAc(); requestAnimationFrame(kare);

</script>

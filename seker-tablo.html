      return `<button ${acik ? '' : 'disabled'} class="${i === kayit.acik ? 'su' : ''}" data-n="${i}"><div class="hIkon">${kayit.yildiz[i] && ART['tablo' + i] ? `<img class="hAsil" src="${ART['tablo' + i]}">` : acik ? `<img class="hAsil" src="${resimURL(S)}">` : '<b style="font-size:24px">?</b>'}</div><span>${S.ad}</span><small>${'★'.repeat(y)}${'☆'.repeat(3 - y)}</small></button>`; }).join('')}</div>
    <button class="btn" id="bOyna">${kayit.acik ? 'Devam: ' + (Math.min(kayit.acik, n - 1) + 1) : 'Başla'} ▶</button>`);
  $('ekran').querySelectorAll('.harita button').forEach(b => b.onclick = () => { SES.hazirla(); bolumBaslat(+b.dataset.n); });
  $('bOyna').onclick = () => { SES.hazirla(); bolumBaslat(Math.min(kayit.acik, n - 1)); }; }
function bolumBaslat(n) {
  O = oyunBaslat(n); yapilan = []; parca = []; bitisZ = 0; revealT = 0; ogret = null; satirSon = 0; kafesT = 0; anahtarUc = null; patlamaT = 0; kaskadN = 0; ekranKapat(); ip(''); katmanKur();
  for (let i = 0; i < 200; i++) adim(O); O.olaylar.length = 0;
  const S = O.S, yeni = S.yeniEngel;
  if (S.ogretici) { ogret = { sira: S.cozum, adim: 0, bekle: false }; ip(OGRET_METIN[0]); }
  else ip(`<b>${S.ad}</b> tablosunu tamamla. Alttan üste düşün; tepsiyi taşırma!`, 3000);
  if (yeni && !kayit.gordu[yeni]) { const E = ENGEL[yeni];
    ekranAc(`<div class="ust">YENİ ENGEL</div><div class="engelG">${ENGEL_IKON[yeni](80)}</div><h2>${E.ad}</h2><p>${E.metin}</p><button class="btn" id="bTamam">Anladım ▶</button>`);
    $('bTamam').onclick = () => { kayit.gordu[yeni] = 1; yaz(); ekranKapat(); }; }
}
function bitisEkrani() {
  if (O.kazandi) { const y = yildiz(O), eski = kayit.yildiz[O.n] || 0; kayit.yildiz[O.n] = Math.max(eski, y); if (y === 3 && eski < 3) kayit.ipucu++; kayit.acik = Math.max(kayit.acik, Math.min(O.n + 1, BOLUMLER.length - 1)); yaz();
    const asilSrc = (typeof ART !== 'undefined' && ART['tablo' + O.n]) || ''; const seker = katman.toDataURL();
    ekranAc(`<div class="ust">${O.n + 1}. TABLO${O.S.sanatci ? ' · ' + O.S.sanatci : ''}</div><h1>${O.S.ad}!</h1><div class="ikiTablo"><img class="seker" src="${seker}"><span>➜</span>${asilSrc ? `<img class="asil" src="${asilSrc}">` : ''}</div>
      <div class="yildizlar">${[0, 1, 2].map(i => `<span class="${i < y ? 'dolu' : ''}" style="animation-delay:${0.2 + i * 0.25}s">★</span>`).join('')}</div>
      <p><b>🖼️ Galeriye asıldı · ${kayit.yildiz.filter(Boolean).length}/${BOLUMLER.length}</b><br>Tepside en fazla <b>${O.rafMaks}</b> şeker bekledi.${y < 3 ? `<br>3 yıldız için tepsiyi en fazla <b>${O.S.enIyiRaf + 2}</b> doldur.` : ''}${y === 3 && eski < 3 ? '<br><b>+1 💡 ipucu kazandın!</b>' : ''}</p>
      ${O.n + 1 < BOLUMLER.length ? '<button class="btn" id="bSonraki">Sonraki ▶</button>' : '<p><b>Bütün tablolar tamam! 🎉</b></p>'}<button class="btn gri" id="bHarita">Harita</button>`);
    if ($('bSonraki')) $('bSonraki').onclick = () => bolumBaslat(O.n + 1); $('bHarita').onclick = haritaAc; }
  else { const neden = O.neden === 'raf' ? '<b>Tepsi taştı!</b> Yeri açılmamış renkleri sonraya bırak: tabloyu alttan üste düşün.' : O.neden === 'bomba' ? '<b>Bomba patladı!</b> Sayı sıfıra inmeden bombanın altındaki bölmeleri boşalt, bombayı serbest bırak.' : 'Şekerler bitti ama tablo tamamlanmadı. Gri şekerleri <b>renkli bölmenin üstüne</b> düşürüp boyamayı unutma!';
    ekranAc(`<div class="ust">${O.n + 1}. TABLO</div><h1>💥 Olmadı</h1><p>${neden}</p><button class="btn" id="bTekrar2">Tekrar dene</button><button class="btn gri" id="bHarita">Harita</button>`);
    $('bTekrar2').onclick = () => bolumBaslat(O.n); $('bHarita').onclick = haritaAc; }
}

/* ---------------- test kancalari */
window.G = { get O() { return O; }, bolumBaslat, eylem, ileri: k => { for (let i = 0; i < k; i++) { adim(O); olaylar(performance.now()); } } };
$('bMuzik').textContent = kayit.muzik === false ? '🔇' : '🎵';
boyutla(); O = oyunBaslat(0); katmanKur(); for (let i = 0; i < 200; i++) adim(O); O.olaylar.length = 0; haritaAc(); requestAnimationFrame(kare);

</script>

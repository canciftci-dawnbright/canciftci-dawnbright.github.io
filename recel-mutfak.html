<style>
:root{
  --bg:#3A2418; --panel:#FFF4E4; --panel2:#F6E3C8; --line:#E2C39B;
  --ink:#4A2A18; --ink-soft:#8A6245; --ink-dim:#B08E6E;
  --red:#D93A45; --gold:#F2A93B; --ok:#4FA85B; --bad:#D6423A;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

<div id="app"><div class="cab" id="cab">

<script>
'use strict';
/* ============================================================
   REÇEL MUTFAĞI — birleştir + pişir + yetiştir
   Sepete dokun → meyve düşer. 2 aynı meyve → büyük meyve → 2 büyük → reçel hamuru.
   Hamuru kazana sürükle → pişer → reçel onu isteyen müşteriye gider. İsteyen yoksa kazanda yanmaya başlar.
   Hata: kızıp giden müşteri, yanan reçel. 3 hata = bölüm biter. Kısıt: tahta alanı + sabır.
   ============================================================ */
const W = 360, H = 612;
const COLS = 6, ROWS = 5, CELL = 56, BX = 12, BY = 318;
const MAX_STRIKES = 3, FAST_TIP = 0.55, DRAG_PX = 9;
const MERGE_FLY_T = 0.14, SERVE_FLY_T = 0.45;
const KAZAN = [{ x: 64, y: 258 }, { x: 170, y: 258 }];
const TRASH = { x: 316, y: 260, r: 26 };

const FRUITS = [
  { id:'cilek', name:'Çilek',  col:'#E23B4A', hi:'#FF8A8F', jam:'#B81F35' },
  { id:'kayisi',name:'Kayısı', col:'#F59A2E', hi:'#FFD08A', jam:'#DB7410' },
  { id:'incir', name:'İncir',  col:'#7B4A9E', hi:'#B98BD8', jam:'#56296F' },
  { id:'erik',  name:'Erik',   col:'#6DB33F', hi:'#B8E68C', jam:'#4F8A26' },
];
const TIER_NAME = ['', '', 'Büyük ', 'hamuru'];

/* Bölümler.
   gens: her sepetin verdiği meyve türleri · charges/recharge: sepet hakkı ve dolma süresi (sn)
   raw: ara seviye (büyük meyve) sipariş olasılığı · slow: kazan pişirme hızı çarpanları
   arrive: ilk müşterilerin geliş gecikmesi — tahta kurulurken nefes payı */
const LEVELS = [
  { customers:8,  types:3, gens:[[0,1],[2]],   visible:3, patience:50, cook:3.5, burn:7, slow:[1,1],    raw:0,    trash:3, charges:12, recharge:1.1, decoy:0.10, arrive:[0,6,12], hints:true },
  { customers:9,  types:4, gens:[[0,1],[2,3]], visible:3, patience:44, cook:3.5, burn:7, slow:[1,1],    raw:0.30, trash:3, charges:12, recharge:1.0, decoy:0.12, arrive:[0,5,10], hints:false },
  { customers:10, types:4, gens:[[0,1],[2,3]], visible:3, patience:38, cook:3.5, burn:6, slow:[1,0.55], raw:0.35, trash:2, charges:10, recharge:1.0, decoy:0.14, arrive:[0,4,8],  hints:false },
];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);
const $ = id => document.getElementById(id);
const cellX = c => BX + c * CELL + CELL / 2, cellY = r => BY + r * CELL + CELL / 2;
const CUST_Y = 138, BUBBLE_Y = 56;
const custX = (i, n) => W / 2 + (i - (n - 1) / 2) * 116;

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ctx = null, master = null, noise = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(t0, dur, f0, f1, g, type) {
    const o = ctx.createOscillator(), gg = ctx.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.008);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(gg); gg.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function burst(t0, dur, f, q, g) {
    const s = ctx.createBufferSource(); s.buffer = noise; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = f; bp.Q.value = q; const gg = ctx.createGain();
    gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.006); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(bp); bp.connect(gg); gg.connect(master); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
  }
  const w = fn => (...a) => { if (!ctx) return; fn(ctx.currentTime, ...a); };
  return {
    init,
    pick: w(t => tone(t, 0.06, 700, 900, 0.08)),
    drop: w(t => { tone(t, 0.08, 380, 260, 0.14); burst(t, 0.04, 800, 1, 0.05); }),
    spawn: w(t => { tone(t, 0.1, 520, 820, 0.14); burst(t, 0.05, 2000, 1.2, 0.05); }),
    merge: w((t, tier) => { const f = 440 * Math.pow(2, (tier * 4) / 12); tone(t, 0.1, f, f * 1.5, 0.2); tone(t + 0.06, 0.16, f * 1.5, f * 2, 0.14); burst(t, 0.08, 2600, 1.5, 0.07); }),
    cook: w(t => { for (let i = 0; i < 6; i++) burst(t + i * 0.05, 0.08, 1400 + Math.random() * 1200, 2, 0.06); tone(t, 0.1, 300, 200, 0.1); }),
    ready: w(t => { tone(t, 0.5, 1320, 1320, 0.1, 'triangle'); tone(t + 0.12, 0.5, 1760, 1760, 0.08, 'triangle'); }),
    warn: w(t => tone(t, 0.08, 900, 900, 0.07, 'square')),
    burn: w(t => { burst(t, 0.5, 600, 0.6, 0.25); tone(t, 0.4, 200, 70, 0.2, 'sawtooth'); }),
    serve: w(t => { [0, 4, 7].forEach((s, i) => tone(t + i * 0.06, 0.22, 784 * Math.pow(2, s / 12), 784 * Math.pow(2, s / 12), 0.13, 'triangle')); }),
    strike: w(t => { tone(t, 0.12, 180, 120, 0.25, 'square'); tone(t + 0.13, 0.2, 150, 90, 0.22, 'square'); }),
    angry: w(t => tone(t, 0.18, 300, 180, 0.18, 'sawtooth')),
    trash: w(t => { burst(t, 0.2, 500, 0.7, 0.2); tone(t, 0.12, 200, 90, 0.14); }),
    deny: w(t => tone(t, 0.08, 160, 140, 0.12, 'square')),
    win: w(t => { [0, 4, 7, 12, 16].forEach((s, i) => tone(t + i * 0.09, 0.35, 523 * Math.pow(2, s / 12), 523 * Math.pow(2, s / 12), 0.14, 'triangle')); }),
    lose: w(t => { [7, 4, 0, -5].forEach((s, i) => tone(t + i * 0.15, 0.28, 392 * Math.pow(2, s / 12), 380 * Math.pow(2, s / 12), 0.12, 'square')); }),
  };
})();
const buzz = ms => { try { const ua = navigator.userActivation; if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} };

/* ---------------- DURUM ----------------
   Eşya: { k:'f' meyve (tier 1 küçük, 2 büyük, 3 hamur) | 'j' reçel | 'g' sepet, type, tier, ax, ay (çizim konumu), pop }
   Sipariş: { k:'j', type } reçel  ya da  { k:'f', type, tier:2 } ham büyük meyve */
let S = null, rnd = Math.random, uid = 1;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function mkItem(k, type, tier, r, c) { return { id: uid++, k, type, tier: tier || 0, ax: cellX(c), ay: cellY(r), pop: 1 }; }
function newLevel(lv, seed) {
  const cfg = LEVELS[lv];
  rnd = mulberry(seed !== undefined ? seed : (Date.now() ^ (Math.random() * 1e9)));
  const queue = [];
  for (let i = 0; i < cfg.customers; i++) {
    const type = i % cfg.types;
    // ilk iki müşteri her zaman reçel ister: önce çekirdek döngü öğrenilsin
    queue.push(i >= 2 && rnd() < cfg.raw ? { k: 'f', type, tier: 2 } : { k: 'j', type });
  }
  for (let i = queue.length - 1; i > 2; i--) { const j = 2 + Math.floor(rnd() * (i - 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  S = {
    lv, cfg, queue, t: 0, board: [], cust: new Array(cfg.visible).fill(null), arriveT: cfg.arrive.slice(0, cfg.visible),
    kazans: KAZAN.map((p, i) => ({ ...p, state: 'empty', type: 0, t: 0, speed: cfg.slow[i], warnT: 0 })),
    flyers: [], parts: [], pops: [], strikes: 0, served: 0, lost: 0, coins: 0, trash: cfg.trash,
    over: null, overT: 0, shown: false, lastReason: '', merges: 0, cooked: 0,
  };
  for (let r = 0; r < ROWS; r++) S.board.push(new Array(COLS).fill(null));
  cfg.gens.forEach((types, i) => {
    const c = i === 0 ? 1 : 4, g = mkItem('g', 0, 0, ROWS - 1, c);
    g.types = types; g.charges = cfg.charges; g.max = cfg.charges; g.rt = 0; S.board[ROWS - 1][c] = g;
  });
  // birkaç başlangıç meyvesi: boş tahta yerine hemen birleştirme fırsatı
  for (const [r, c] of [[3, 2], [3, 3]]) S.board[r][c] = mkItem('f', 0, 1, r, c);
}
const itemAt = (r, c) => (r >= 0 && r < ROWS && c >= 0 && c < COLS) ? S.board[r][c] : undefined;
function eachItem(fn) { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.board[r][c]) fn(S.board[r][c], r, c); }
const orderVal = o => o.k === 'j' ? 4 : Math.pow(2, o.tier - 1);
const itemVal = it => it.k === 'j' ? 4 : it.k === 'f' ? Math.pow(2, it.tier - 1) : 0;
const matches = (it, o) => !!it && !!o && (o.k === 'j' ? it.k === 'j' && it.type === o.type : it.k === 'f' && it.tier === o.tier && it.type === o.type);

/* ---------------- ÜRETİM: açık talebe göre ---------------- */
function demand() {
  const need = [0, 0, 0, 0];
  for (const c of S.cust) if (c && !c.reserved && (c.state === 'wait' || c.state === 'in')) need[c.order.type] += orderVal(c.order);
  for (let i = 0; i < 2 && i < S.queue.length; i++) need[S.queue[i].type] += orderVal(S.queue[i]);
  eachItem(it => { if (it.k !== 'g') need[it.type] -= itemVal(it); });
  for (const k of S.kazans) if (k.state === 'cook' || k.state === 'ready') need[k.type] -= 4;
  return need;
}
function nearestEmpty(r0, c0) {
  let best = null, bd = 1e9;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!S.board[r][c]) {
    const d = Math.abs(r - r0) + Math.abs(c - c0) + (r > r0 ? 0.1 : 0); if (d < bd) { bd = d; best = [r, c]; } }
  return best;
}

/* ---------------- EYLEMLER (girdi ve test botu bunları çağırır) ----------------
   yer: { cell:[r,c] } | { kazan:i } | { cust:i } | { trash:true } */
function tapGen(r, c) {
  const g = itemAt(r, c); if (!g || g.k !== 'g' || S.over) return false;
  if (g.charges <= 0) { SFX.deny(); popText('Sepet boş', cellX(c), cellY(r) - 30, '#D6423A'); g.pop = 0.6; return false; }
  const e = nearestEmpty(r, c);
  if (!e) { SFX.deny(); popText('Tahta dolu!', cellX(c), cellY(r) - 30, '#D6423A'); shake(); return false; }
  const need = demand(), pool = [];
  for (const tp of g.types) for (let k = 0; k < Math.max(0, need[tp]); k++) pool.push(tp);
  const type = !pool.length || rnd() < S.cfg.decoy ? g.types[Math.floor(rnd() * g.types.length)] : pool[Math.floor(rnd() * pool.length)];
  const it = mkItem('f', type, 1, r, c); it.ax = cellX(c); it.ay = cellY(r) - 10; it.pop = 0.2;
  S.board[e[0]][e[1]] = it; g.charges--; g.pop = 1.25;
  SFX.spawn(); buzz(6);
  return true;
}
function tapItem(r, c) {   // hazır reçel / istenen ham meyveye dokun → isteyen müşteriye uçar
  const it = itemAt(r, c); if (!it || S.over) return false;
  if (it.k === 'g') return tapGen(r, c);
  const ci = customerFor(it);
  if (ci < 0) { it.pop = 0.8; SFX.deny(); return false; }
  S.board[r][c] = null; sendToCustomer(it, it.ax, it.ay, ci);
  return true;
}
function dropMove(from, to) {
  if (S.over) return false;
  const src = from.cell ? itemAt(from.cell[0], from.cell[1]) : from.kazan !== undefined && S.kazans[from.kazan].state === 'ready' ? { k: 'j', type: S.kazans[from.kazan].type, tier: 0 } : null;
  if (!src) return false;
  const take = () => { if (from.cell) S.board[from.cell[0]][from.cell[1]] = null; else { const k = S.kazans[from.kazan]; k.state = 'empty'; k.t = 0; } };
  const sx = from.cell ? cellX(from.cell[1]) : S.kazans[from.kazan].x, sy = from.cell ? cellY(from.cell[0]) : S.kazans[from.kazan].y;
  if (to.cust !== undefined) {
    const c = S.cust[to.cust];
    if (!c || c.state !== 'wait' || c.reserved || !matches(src, c.order)) { SFX.deny(); return false; }
    take(); const it = from.cell ? src : mkItem('j', src.type, 0, 0, 0); it.ax = sx; it.ay = sy;
    sendToCustomer(it, sx, sy, to.cust); return true;
  }
  if (to.trash) {
    if (src.k === 'g' || S.trash <= 0) { SFX.deny(); if (S.trash <= 0) popText('Çöp hakkı yok', TRASH.x - 20, TRASH.y - 36, '#D6423A'); return false; }
    take(); S.trash--; SFX.trash(); burstParts(TRASH.x, TRASH.y - 8, '#9A8A76', 8); return true;
  }
  if (to.kazan !== undefined) {
    const k = S.kazans[to.kazan];
    if (!(src.k === 'f' && src.tier === 3) || k.state !== 'empty') { SFX.deny(); return false; }
    take(); k.state = 'cook'; k.type = src.type; k.t = 0; S.cooked++;
    SFX.cook(); buzz(12); burstParts(k.x, k.y - 14, FRUITS[src.type].hi, 8);
    return true;
  }
  if (to.cell) {
    const [r, c] = to.cell, dst = itemAt(r, c);
    if (dst === undefined) return false;
    if (from.cell && from.cell[0] === r && from.cell[1] === c) return false;
    const srcItem = from.cell ? src : mkItem('j', src.type, 0, r, c);
    if (!from.cell) { srcItem.ax = sx; srcItem.ay = sy; }
    if (dst && dst.k === 'f' && srcItem.k === 'f' && dst.type === srcItem.type && dst.tier === srcItem.tier && dst.tier < 3) {
      take(); dst.tier++; dst.pop = 1.45; S.merges++;   // BİRLEŞME

/* ---------------- MÜŞTERİ ---------------- */

}

  if (c.state === 'happy') { y -= Math.sin(Math.min(1, c.t / 0.25) * Math.PI) * 12; if (c.t > 0.35) { const k = (c.t - 0.35) / 0.35; x += c.dir * k * 140; alpha = 1 - k; } }
  if (c.state === 'angry') { x += Math.sin(c.t * 50) * 3 * (1 - c.t); if (c.t > 0.3) { const k = (c.t - 0.3) / 0.4; x += c.dir * k * 140; alpha = 1 - k; } }
  const frac = c.pat / c.max, worried = c.state === 'wait' && !c.reserved && frac < 0.3;
  if (worried) x += Math.sin(S.t * 30) * 1.5;
  ctx.save(); ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.fillStyle = ['#5B7DB1', '#C75B7A', '#6AA56B', '#D4944A', '#8C6BB8', '#4E9AA8'][c.shirt];
  rr(x - 30, y + 18, 60, 60, 22); ctx.fill();
  ctx.fillStyle = c.look[0]; ctx.beginPath(); ctx.arc(x, y, 25, 0, 7); ctx.fill();
  ctx.fillStyle = c.look[1]; ctx.beginPath(); ctx.arc(x, y - 6, 25, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  ctx.fillRect(x - 25, y - 8, 7, 12); ctx.fillRect(x + 18, y - 8, 7, 12);
  const mood = c.state === 'happy' ? 1 : c.state === 'angry' ? -1 : frac > 0.55 ? 0.6 : frac > 0.3 ? 0 : -0.7;
  ctx.fillStyle = '#2A1A12'; ctx.strokeStyle = '#2A1A12';
  if (c.state === 'happy') { ctx.lineWidth = 2.5; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * 9, y + 2, 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); } }
  else for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * 9, y + 1, 3, 0, 7); ctx.fill(); }
  if (mood < 0) { ctx.lineWidth = 2.2; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + s * 14, y - 7); ctx.lineTo(x + s * 5, y - 4); ctx.stroke(); } }
  ctx.strokeStyle = '#7A3A2A'; ctx.lineWidth = 2.5; ctx.beginPath();
  ctx.moveTo(x - 8, y + 12 - mood * 2); ctx.quadraticCurveTo(x, y + 12 + mood * 6, x + 8, y + 12 - mood * 2); ctx.stroke();
  if (c.state === 'angry' || worried) { ctx.fillStyle = 'rgba(230,80,70,.35)'; ctx.beginPath(); ctx.arc(x, y + 3, 25, 0, 7); ctx.fill(); }
  if (c.state !== 'angry') {
    const by = BUBBLE_Y + (c.state === 'wait' ? Math.sin(S.t * 3 + i) * 1.5 : 0);
    const hover = DRAG && DRAG.moved && DRAG.item && matches(DRAG.item, c.order) && c.state === 'wait' && !c.reserved;
    ctx.fillStyle = hover ? '#E3F5E5' : '#FFFFFF'; ctx.beginPath(); ctx.arc(x, by, 30, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 8, by + 26); ctx.lineTo(x, by + 44); ctx.lineTo(x + 8, by + 26); ctx.fill();
    if (c.state === 'wait' || c.state === 'in') {
      ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.beginPath(); ctx.arc(x, by, 30, 0, 7); ctx.stroke();
      ctx.strokeStyle = frac > 0.55 ? '#4FA85B' : frac > 0.3 ? '#F2A93B' : '#D6423A';
      ctx.beginPath(); ctx.arc(x, by, 30, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(frac, 0, 1)); ctx.stroke();
    }
    if (c.state === 'happy') { ctx.fillStyle = '#4FA85B'; ctx.font = font(30); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✓', x, by + 2); }
    else { const o = c.order; if (o.k === 'j') drawJamIcon(o.type, x, by + 2, 1); else { drawFruit(o.type, x, by + 1, 17); } }
  } else { ctx.font = font(26); ctx.textAlign = 'center'; ctx.fillText('💢', x + 22, y - 28); }
  ctx.restore();
}
function hintPath() {   // 1. bölüm: ilk hizmete kadar el ile ne yapılacağını göster
  if (!S.cfg.hints || S.served > 0 || S.over || DRAG) return null;
  let ham = null, pair = null, gen = null;
  eachItem((it, r, c) => {
    if (it.k === 'f' && it.tier === 3 && !ham) ham = [r, c];
    if (it.k === 'g' && it.charges > 0 && !gen) gen = [r, c];
    if (it.k === 'f' && it.tier < 3 && !pair) eachItem((o, r2, c2) => { if (!pair && o !== it && o.k === 'f' && o.type === it.type && o.tier === it.tier) pair = [[r, c], [r2, c2]]; });
  });
  const ek = S.kazans.findIndex(k => k.state === 'empty');
  if (ham && ek >= 0) return { from: [cellX(ham[1]), cellY(ham[0])], to: [S.kazans[ek].x, S.kazans[ek].y - 6], txt: 'Hamuru kazana sürükle' };
  if (pair) return { from: [cellX(pair[0][1]), cellY(pair[0][0])], to: [cellX(pair[1][1]), cellY(pair[1][0])], txt: 'Aynı iki meyveyi birleştir' };
  if (gen) return { from: [cellX(gen[1]), cellY(gen[0])], to: null, txt: 'Sepete dokun' };
  return null;
}
function draw() {
  if (!S) return;
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  S.cust.forEach((c, i) => { if (c) drawCustomer(c, i); });
  ctx.fillStyle = 'rgba(74,42,24,.55)'; ctx.font = font(12, 700); ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(S.queue.length ? 'Sırada ' + S.queue.length + ' müşteri' : 'Son müşteriler', W - 8, 16);
  S.kazans.forEach(drawKazan);
  // çöp
  ctx.fillStyle = S.trash > 0 ? '#8A96A3' : '#C9C1B5'; rr(TRASH.x - 20, TRASH.y - 16, 40, 38, 7); ctx.fill();
  ctx.fillStyle = S.trash > 0 ? '#6C7885' : '#B5ADA2'; rr(TRASH.x - 24, TRASH.y - 24, 48, 10, 4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = font(15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🗑', TRASH.x, TRASH.y + 3);
  ctx.fillStyle = S.trash > 0 ? '#4A2A18' : '#D6423A'; ctx.font = font(11); ctx.fillText('×' + S.trash, TRASH.x, TRASH.y + 32);
  // sürüklerken hedef vurgusu
  let hl = null;
  if (DRAG && DRAG.moved) {
    hl = new Map();
    eachItem((it, r, c) => { if (DRAG.from.cell && DRAG.from.cell[0] === r && DRAG.from.cell[1] === c) return;
      if (it.k === 'f' && DRAG.item.k === 'f' && it.type === DRAG.item.type && it.tier === DRAG.item.tier && it.tier < 3) hl.set(r * COLS + c, '#4FA85B'); });
    if (DRAG.item.k === 'f' && DRAG.item.tier === 3) S.kazans.forEach(k => { if (k.state === 'empty') { ctx.strokeStyle = '#4FA85B'; ctx.lineWidth = 3; rr(k.x - 40, k.y - 30, 80, 64, 12); ctx.stroke(); } });
  }
  drawBoard(hl);
  for (const f of S.flyers) { const t = ease(f.t), x = lerp(f.x0, f.x1, t), y = lerp(f.y0, f.y1, t) - Math.sin(f.t * Math.PI) * 50;
    drawItem(f.it, x, y, 1 + Math.sin(f.t * Math.PI) * 0.3); }
  if (DRAG && DRAG.moved) { ctx.globalAlpha = 0.95; drawItem(DRAG.item, DRAG.x, DRAG.y - 14, 1.2); ctx.globalAlpha = 1; }
  for (const p of S.parts) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (const p of S.pops) { const k = p.t / 0.9; ctx.globalAlpha = 1 - k * k; ctx.font = font(p.size);
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(p.txt, p.x, p.y - k * 30); ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y - k * 30); }
  ctx.globalAlpha = 1;
  const h = hintPath();
  if (h) {
    const ph = (S.t % 1.4) / 1.4, t = h.to ? ease(clamp(ph * 1.4, 0, 1)) : 0;
    const hx = h.to ? lerp(h.from[0], h.to[0], t) : h.from[0], hy = h.to ? lerp(h.from[1], h.to[1], t) : h.from[1] + Math.sin(S.t * 8) * 4;
    ctx.font = font(30); ctx.fillText('👆', hx + 8, hy + 30);
    ctx.font = font(13); const tw = ctx.measureText(h.txt).width + 20;
    ctx.fillStyle = 'rgba(74,42,24,.88)'; rr(W / 2 - tw / 2, 291, tw, 20, 10); ctx.fill();
    ctx.fillStyle = '#FFF4E4'; ctx.fillText(h.txt, W / 2, 306);
  }
}

/* ---------------- GİRDİ: dokun / sürükle-bırak ---------------- */
let paused = true, DRAG = null;
function toLogic(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
function cellAt(x, y) { const c = Math.floor((x - BX) / CELL), r = Math.floor((y - BY) / CELL); return r >= 0 && r < ROWS && c >= 0 && c < COLS ? [r, c] : null; }
function targetAt(x, y) {
  const cell = cellAt(x, y); if (cell) return { cell };
  for (let i = 0; i < S.kazans.length; i++) { const k = S.kazans[i]; if (Math.abs(x - k.x) < 46 && y > k.y - 70 && y < k.y + 34) return { kazan: i }; }
  if (Math.hypot(x - TRASH.x, y - TRASH.y) < TRASH.r + 14) return { trash: true };
  if (y < 215) { let best = -1, bd = 1e9; S.cust.forEach((c, i) => { const d = Math.abs(x - custX(i, S.cfg.visible)); if (c && d < 58 && d < bd) { bd = d; best = i; } }); if (best >= 0) return { cust: best }; }
  return null;
}
cv.addEventListener('pointerdown', e => {
  if (!S || paused || S.over || DRAG) return;
  e.preventDefault(); SFX.init();
  const [x, y] = toLogic(e), tg = targetAt(x, y);
  if (!tg) return;
  let item = null;
  if (tg.cell) item = itemAt(tg.cell[0], tg.cell[1]);
  else if (tg.kazan !== undefined && S.kazans[tg.kazan].state === 'ready') item = { k: 'j', type: S.kazans[tg.kazan].type, tier: 0 };
  if (!item) return;
  DRAG = { id: e.pointerId, from: tg.cell ? { cell: tg.cell } : { kazan: tg.kazan }, item, x, y, sx: x, sy: y, moved: false };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!DRAG || e.pointerId !== DRAG.id) return;
  const [x, y] = toLogic(e); DRAG.x = x; DRAG.y = y;
  if (!DRAG.moved && Math.hypot(x - DRAG.sx, y - DRAG.sy) * scale > DRAG_PX) { DRAG.moved = true; SFX.pick(); }
});
function endDrag(e) {
  if (!DRAG || (e && e.pointerId !== DRAG.id)) return;
  const d = DRAG; DRAG = null;
  if (!S || S.over) return;
  if (!d.moved) {   // dokunma
    if (d.from.cell) tapItem(d.from.cell[0], d.from.cell[1]);
    else { const k = S.kazans[d.from.kazan], it = mkItem('j', k.type, 0, 0, 0), ci = customerFor(it);
      if (ci >= 0) { k.state = 'empty'; k.t = 0; it.ax = k.x; it.ay = k.y; sendToCustomer(it, k.x, k.y - 30, ci); } else SFX.deny(); }
    return;
  }
  const tg = targetAt(d.x, d.y - 14);
  if (tg && dropMove(d.from, tg)) return;
  if (d.from.cell) { const it = itemAt(d.from.cell[0], d.from.cell[1]); if (it) { it.ax = d.x; it.ay = d.y - 14; } }   // geri kayar
}
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('blur', () => { DRAG = null; });

/* ---------------- HUD / EKRANLAR ---------------- */
const HUD = { dirty: true,
  update() {
    if (!this.dirty) return; this.dirty = false;
    $('hLv').textContent = 'Bölüm ' + (S.lv + 1);
    $('hServed').textContent = S.served + '/' + S.cfg.customers;
    $('hCoins').textContent = S.coins;
    const is = $('hStrikes').children; for (let k = 0; k < 3; k++) is[k].className = k < S.strikes ? 'on' : '';
    $('fInfo').textContent = S.cfg.types + ' meyve · ' + S.cfg.patience + ' sn sabır' + (S.cfg.raw ? ' · ham siparişler' : '');
  } };
function shake() { const b = $('stage'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
function hideOverlay() { const o = $('ovNode'); if (o) o.remove(); }
function overlay(html, cls) { hideOverlay(); const d = document.createElement('div'); d.className = 'ov ' + (cls || ''); d.id = 'ovNode'; d.innerHTML = html; $('cab').appendChild(d); return d; }
function legendHTML() {
  return '<div class="legend">' +
    '<div class="lrow"><span class="e">🧺</span><p><b>Sepete dokun</b>, tahtaya meyve düşer. Sepetin hakkı zamanla dolar.</p></div>' +
    '<div class="lrow"><span class="e">🍓</span><p><b>Aynı iki meyveyi</b> sürükleyip üst üste koy: <b>büyük meyve</b>. İki büyük meyve: <b>reçel hamuru</b>.</p></div>' +
    '<div class="lrow"><span class="e">🍲</span><p>Hamuru <b>kazana sürükle</b>. Pişince reçel <b>kendiliğinden</b> isteyen müşteriye gider.</p></div>' +
    '<div class="lrow"><span class="e">🔥</span><p>İsteyen yoksa reçel kazanda <b>yanmaya başlar</b> — sürükleyip tahtaya al.</p></div>' +
    '<div class="lrow"><span class="e">✅</span><p>Yeşil tikli eşya bir müşterinin istediğidir: <b>dokun</b> ya da müşteriye sürükle.</p></div>' +
    '<div class="lrow"><span class="e">✕</span><p><b>Kızıp giden müşteri</b> ve <b>yanan reçel</b> hata. <b>3 hata</b> = bölüm biter. Tahtayı doldurma!</p></div>' +
    '</div>';
}
function showIntro() {
  paused = true;
  const d = overlay('<div class="big">🍓🍯</div><h2>Reçel Mutfağı</h2><p class="sub">Birleştir, pişir, yetiştir. ' + S.cfg.customers + ' müşteri bekliyor.</p>' +
    legendHTML() + '<div class="row"><button class="go" data-a="start">▶ Mutfağı aç</button></div>', 'scroll');
  d.addEventListener('click', e => { if (e.target.dataset.a === 'start') { SFX.init(); hideOverlay(); paused = false; } });
}
function showHelp() {
  paused = true;
  const d = overlay('<h2>Nasıl oynanır</h2>' + legendHTML() + '<div class="row"><button class="go" data-a="close">Anladım</button></div>', 'scroll');
  d.addEventListener('click', e => { if (e.target.dataset.a === 'close') { hideOverlay(); paused = !!(S && S.over); } });
}
function showEnd() {
  const win = S.over === 'win', last = S.lv >= LEVELS.length - 1;
  if (win) {
    SFX.win(); saveProgress(S.lv + 1);
    const stars = MAX_STRIKES - S.strikes;
    const d = overlay('<div class="big">🎉</div><h2>' + (last ? 'Bütün bölümler bitti!' : 'Bölüm ' + (S.lv + 1) + ' tamam') + '</h2>' +
      '<div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>' +
      '<p class="sub"><b>' + S.served + '/' + S.cfg.customers + '</b> müşteri · <b>' + S.coins + '</b> kasa · ' + S.strikes + ' hata<br>' +
      S.merges + ' birleştirme · ' + S.cooked + ' kazan</p>' +
      '<div class="row">' + (last ? '<button class="go" data-a="first">↻ Baştan oyna</button>' : '<button class="go" data-a="next">▶ Sonraki bölüm</button>') +
      '<button data-a="retry">↻ Tekrar oyna</button></div>');
    [...$('stars').children].forEach((s, i) => { if (i < stars) setTimeout(() => { s.classList.add('on'); buzz(12); }, 300 + i * 260); });
    d.addEventListener('click', e => { const a = e.target.dataset.a; if (a) startLevel(a === 'next' ? S.lv + 1 : a === 'first' ? 0 : S.lv); });
  } else {
    SFX.lose();
    const d = overlay('<div class="big">🍯💥</div><h2>Mutfak kapandı</h2><p class="why"><b>3 hata yaptın.</b><br>Son hata: ' + S.lastReason + '</p>' +
      '<p class="sub">' + S.served + '/' + S.cfg.customers + ' müşteriye hizmet ettin.<br>Sadece istenen türleri üret, tahtayı boş tut.</p>' +
      '<div class="row"><button class="go" data-a="retry">↻ Tekrar dene</button></div>');
    d.addEventListener('click', e => { if (e.target.dataset.a === 'retry') startLevel(S.lv); });
  }
}
const LS = 'dbg.recelmutfak.v1';
function saveProgress(n) { try { if (n > (parseInt(localStorage.getItem(LS), 10) || 0)) localStorage.setItem(LS, String(n)); } catch (e) {} }
function loadProgress() { try { return parseInt(localStorage.getItem(LS), 10) || 0; } catch (e) { return 0; } }
function startLevel(lv) { newLevel(Math.min(lv, LEVELS.length - 1)); DRAG = null; hideOverlay(); HUD.dirty = true; paused = false; }
$('bRetry').onclick = () => startLevel(S.lv);
$('bHelp').onclick = showHelp;

/* ---------------- DÖNGÜ ---------------- */
let lastTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, lastTs ? (ts - lastTs) / 1000 : 0); lastTs = ts;
  if (!paused) step(dt);
  HUD.update(); draw();
}
addEventListener('resize', () => { fitCanvas(); fitCanvas(); });
const hashLv = /^#(\d)$/.exec(location.hash || '');
newLevel(hashLv ? clamp(parseInt(hashLv[1], 10) - 1, 0, LEVELS.length - 1) : Math.min(loadProgress(), LEVELS.length - 1));
fitCanvas(); fitCanvas(); HUD.update();
showIntro();
requestAnimationFrame(loop);
$('boot').remove();
</script>

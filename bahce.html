<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
:root{ --bg:#3E6B2E; --panel:#FFF7EA; --line:#E5D3B8; --ink:#3A2E26; --ink-dim:#A08C78; --go:#2F9E6B; --bad:#D6423A; --gold:#F2B233; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;background-image:radial-gradient(640px 360px at 50% 0%,rgba(255,240,150,.16),transparent 72%)}
#app{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:6px 5px 10px}
.cab{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 9px 9px;box-shadow:0 20px 50px rgba(0,0,0,.45);position:relative;overflow:hidden}
.hud{display:flex;align-items:center;justify-content:space-between;padding:0 4px 7px;border-bottom:1px solid var(--line)}
.stat{line-height:1}.stat small{display:block;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:2px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;display:inline-block;transition:transform .12s}.stat.r{text-align:right}
.stat.warn b{color:var(--bad)}
.stat b.bump{transform:scale(1.25)}
.stage{position:relative;margin-top:7px;border-radius:13px;overflow:hidden;border:1px solid var(--line);touch-action:none}
#cv{display:block;margin:0 auto}
.row{display:flex;gap:7px;margin-top:8px}
button{flex:1;appearance:none;border:1px solid var(--line);background:#F2E6D2;color:var(--ink);font:inherit;font-size:14px;font-weight:800;padding:10px 6px;border-radius:12px;cursor:pointer;white-space:nowrap}
button.go{background:var(--go);color:#fff;border-color:#237A52}
button:disabled{opacity:.45}
.ov{position:absolute;inset:0;background:rgba(255,247,234,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:20}
.ov h2{font-size:30px;margin:0 0 4px;line-height:1.1}.ov p{color:#7A6656;font-size:14px;line-height:1.45;margin:4px 0 12px;max-width:310px}
.ov .row{width:100%;max-width:280px;flex-direction:column}
.ov .order{display:flex;gap:10px;justify-content:center;margin:6px 0 2px}
.ov .order span{background:#F2E6D2;border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-size:18px}
.stars{font-size:44px;letter-spacing:6px;margin:4px 0}
.stars span{display:inline-block;color:#E8D9C2;transform:scale(.5);transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .2s}
.stars span.on{color:var(--gold);transform:scale(1)}
.boot{position:fixed;left:10px;right:10px;top:10px;z-index:9999;padding:12px 14px;border-radius:10px;background:#3B1512;color:#FFD9D2;font-size:13px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
</style>

<div class="boot" id="boot"><b>Oyun başlatılamadı — JavaScript çalışmıyor.</b></div>

<div id="app"><div class="cab" id="cab">
  <div class="hud">
    <span class="stat"><small>Bölüm</small><b id="hLv">1</b></span>
    <span class="stat" id="hShovBox" style="text-align:center"><small>Kürek</small><b id="hShov">0</b></span>
    <span class="stat r"><small>Hedef ★★★</small><b id="hPar">0</b></span>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="row"><button id="bUndo">↶ Geri al</button><button id="bRe">↻ Tekrarla</button><button id="bReset">⏮ Baştan</button></div>
</div></div>

<script>
'use strict';
/* ============================================================
   BAHÇE HORTUMU — kanal kaz, su canlı aksın, bitkiler büyüsün, siparişi topla
   Sulu kanaldan (ya da kaynaktan) parmakla sürükle → kanal kazılır (toprak 1, çamur 2 kürek). Su hemen akar.
   Kanala komşu bitki sulanır ve ürün verir. Büyüyen bitkiye dokun → sulama, hızlanır (yıldızı etkilemez).
   HER KAYNAK EN FAZLA 3 TÜKETİCİ BESLER (bitki 1, kirpi 2): fazlası olursa o ağda hiçbir şey büyümez.
   Vana: dokun aç/kapa. Zehirli kaynağın suyu filtreden geçmeden bitkiyi soldurur.
   Engeller birbirine bağlı: çamur (pahalı+yavaş), çukur (bedava kanal ama önce dolar), vana, kirpi, zehir+filtre.
   ============================================================ */
const W = 360, H = 640;
const COLS = 8, ROWS = 11, T = 40, BX = 20, BY = 92;   // bahçe ızgarası
const CAP = 3, GROW = 2.0;                             // kaynak başı tüketici sınırı · tek bitkinin büyüme hızı (ürün/sn)
const BOOST = 0.22, BOOST_CD = 0.12;                   // bitkiye dokununca eklenen büyüme · dokunuşlar arası en az süre
const SPEED = { soil: 12, chan: 12, mud: 3, pit: 0.9, valve: 12, filter: 8 };   // kanal dolma hızı (1/sn)
const PLANTS = { t: { e: '🍅', n: 'domates', c: '#E5484D' }, c: { e: '🥕', n: 'havuç', c: '#F28C28' }, k: { e: '🌽', n: 'mısır', c: '#F2C94C' } };
/* Bölümler — harita: . toprak  # kaya  ~ çamur  o çukur  = hazır kanal  S kaynak  P zehirli kaynak  V/v vana açık/kapalı
   F filtre  M kirpi  t/c/k bitki · shovels: kürek hakkı · par: ★★★ için en az kürek (elle çözülüp doğrulanmış yol) · tip: bahçıvanın ilk sözü */
const LEVELS = [
  { order:{ t:3 }, shovels:8, par:4, tip:'Kaynaktan 🚰 domatese kadar sürükle!', map:[
    '...S....','........','........','........','........','...t....','........','........','........','........','........'] },
  { order:{ t:2, c:2 }, shovels:13, par:9, tip:'Tek kanalı dallandır: iki bitki de su içsin.', map:[
    '...S....','........','........','.t......','........','........','......c.','........','........','........','........'] },
  { order:{ c:3 }, shovels:18, par:15, tip:'Kayalar kazılmaz, etrafından dolaş.', map:[
    'S.......','........','#######.','........','........','...c....','........','........','........','........','........'] },
  { order:{ t:2, k:2 }, shovels:14, par:13, tip:'Çamur 2 kürek ama yol kısa. Dolambaç yetmez!', map:[
    '...S....','........','###~~##.','###~~##.','........','........','.t....k.','........','........','........','........'] },
  { order:{ t:2, c:2 }, shovels:11, par:9, tip:'Çukurlar bedava kanal. Su önce onları doldurur.', map:[
    'S.......','........','.o......','........','..o.....','.t......','....o...','........','.....c..','........','........'] },
  { order:{ c:3 }, shovels:13, par:10, tip:'Kaynak en fazla 3 bitki besler. Domatesleri vanayla kapat!', map:[
    '...S....','...=....','...V....','..t=t...','...=t...','........','........','........','.c......','........','........'] },
  { order:{ t:2, c:2, k:2 }, shovels:15, par:12, tip:'Kirpi yanından geçen suyu içer ve 2 kişilik yer kaplar.', map:[
    '...S....','........','........','...M....','........','.t.c.k..','........','........','........','........','........'] },
  { order:{ t:2, c:2 }, shovels:15, par:13, tip:'Zehirli su! Önce filtreden 🧪 geçir.', map:[
    '...P....','........','........','......F.','........','..t.....','........','.....c..','........','........','........'] },
  { order:{ t:2, k:2 }, shovels:15, par:13, tip:'Çamur, çukur, kirpi… en ucuz yolu bul.', map:[
    '...S....','........','#~~~~~~#','#......#','o..M....','........','.t....k.','........','........','........','........'] },
  { order:{ t:2, c:2, k:2 }, shovels:12, par:9, tip:'İki kaynak var. Ağları sakın birleştirme!', map:[
    'S.....P.','......=.','##....V.','......=.','..t...=M','......=.','.c....F.','......=.','....k.=.','......=.','........'] },
];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };   // kareye sabit rastgelelik (süs)

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ac = null, master = null, noise = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(t0, dur, f0, f1, g, type) { const o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.006); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gg); gg.connect(master); o.start(t0); o.stop(t0 + dur + 0.02); }
  function burst(t0, dur, f, q, g, type) { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = type || 'bandpass';
    bp.frequency.value = f; bp.Q.value = q; const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.005);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(bp); bp.connect(gg); gg.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.02); }
  const w = fn => (...a) => { if (!ac) return; fn(ac.currentTime, ...a); };
  let lastDig = 0, lastSplash = 0, lastBoost = 0;
  return { init,
    dig: w((t, mud) => { if (t - lastDig < 0.04) return; lastDig = t; burst(t, 0.09, mud ? 350 : 700, 0.9, 0.16, 'lowpass'); tone(t, 0.06, mud ? 120 : 190, 90, 0.08); if (mud) burst(t + 0.03, 0.12, 250, 2, 0.08); }),
    splash: w((t, d) => { if (t - lastSplash < 0.07) return; lastSplash = t; const f = 700 + Math.min(d || 0, 20) * 45; burst(t, 0.14, 1600 + f, 1.4, 0.05); tone(t, 0.07, f * 1.3, f, 0.035, 'sine'); }),
    boost: w(t => { if (t - lastBoost < 0.05) return; lastBoost = t; burst(t, 0.12, 4000, 1.5, 0.06); tone(t, 0.05, 1300, 1700, 0.03, 'sine'); }),
    harvest: w((t, i) => { const f = 660 * Math.pow(2, (i % 8) * 2 / 12); tone(t, 0.12, f, f * 1.5, 0.1, 'triangle'); tone(t + 0.05, 0.1, f * 2, f * 2, 0.04); }),
    land: w(t => { tone(t, 0.06, 1400, 1100, 0.05, 'triangle'); }),
    ding: w(t => { tone(t, 0.35, 1568, 1568, 0.09, 'sine'); tone(t + 0.08, 0.4, 2093, 2093, 0.06, 'sine'); }),
    bad: w(t => { tone(t, 0.12, 240, 170, 0.12, 'square'); }),
    valve: w((t, open) => { tone(t, 0.08, open ? 500 : 700, open ? 800 : 400, 0.1, 'triangle'); burst(t, 0.05, 2500, 3, 0.05); burst(t + 0.06, 0.2, open ? 1200 : 400, 1, 0.05); }),
    undo: w(t => { tone(t, 0.1, 700, 950, 0.08, 'triangle'); }),
    thirst: w(t => { tone(t, 0.18, 400, 300, 0.07, 'sine'); tone(t + 0.16, 0.2, 300, 220, 0.07, 'sine'); }),
    slurp: w(t => { burst(t, 0.2, 900, 4, 0.07); tone(t, 0.18, 300, 600, 0.04, 'sine'); }),
    poison: w(t => { tone(t, 0.3, 200, 120, 0.1, 'sawtooth'); }),
    chirp: w(t => { const f = 2600 + Math.random() * 900; [0, 0.09, 0.2].forEach(d => tone(t + d, 0.06, f, f * 1.25, 0.018, 'sine')); }),
    win: w(t => { [0, 4, 7, 12, 16].forEach((s, i) => tone(t + i * 0.09, 0.35, 523 * Math.pow(2, s / 12), 523 * Math.pow(2, s / 12), 0.14, 'triangle')); }),
  };
})();
const buzz = ms => { try { const ua = navigator.userActivation; if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} };

/* ---------------- DURUM ---------------- */
let S = null, STROKE = null;
const SAVE_KEY = 'dbg.bahce.v1';
const loadBest = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || { lv: 0, stars: {} }; } catch (e) { return { lv: 0, stars: {} }; } };
const saveBest = b => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(b)); } catch (e) {} };
function parseTile(ch, r, c) {
  const t = { r, c, ch, kind: 'soil', trench: false, dug: false, w: 0, poison: false, open: true, net: -1, reach: false, dist: 0, carve: 1, spin: 0 };
  if (ch === '#') t.kind = 'rock';
  else if (ch === '~') t.kind = 'mud';
  else if (ch === 'o') { t.kind = 'pit'; t.trench = true; }
  else if (ch === '=') { t.kind = 'chan'; t.trench = true; }
  else if (ch === 'S') { t.kind = 'src'; t.trench = true; t.w = 1; }
  else if (ch === 'P') { t.kind = 'psrc'; t.trench = true; t.w = 1; }
  else if (ch === 'V' || ch === 'v') { t.kind = 'valve'; t.trench = true; t.open = ch === 'V'; }
  else if (ch === 'F') { t.kind = 'filter'; t.trench = true; }
  else if (ch === 'M') { t.kind = 'mole'; t.drink = false; t.peek = 0; }
  else if (PLANTS[ch]) { t.kind = 'plant'; t.plant = { k: ch, g: 0, hp: 1, dead: false, pop: 0, squash: 0, cd: 0, state: 'dry' }; }
  return t;
}
function newRun(lv) {
  const L = LEVELS[lv];
  S = { lv, L, grid: L.map.map((row, r) => [...row].map((ch, c) => parseTile(ch, r, c))), shovels: L.shovels, used: 0, strokes: [],
    got: Object.fromEntries(Object.keys(L.order).map(k => [k, 0])), bump: {}, flies: [], parts: [], pops: [], ripples: [], confetti: [], nets: [], t: 0,
    running: false, over: false, phase: 'play', idleT: 0, harvests: 0, shake: 0, fountainT: 0, chirpT: 6 + Math.random() * 5, boosts: 0, dance: 0 };
  STROKE = null;
  simWater(0);
}
const tileAt = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS ? S.grid[r][c] : null;
const passable = t => t && t.trench && !(t.kind === 'valve' && !t.open);
const digCost = t => t.kind === 'soil' ? 1 : t.kind === 'mud' ? 2 : 0;
const diggable = t => t && !t.trench && (t.kind === 'soil' || t.kind === 'mud');
const nextToTrench = t => N4.some(([dr, dc]) => { const n = tileAt(t.r + dr, t.c + dc); return n && n.trench; });
const tcx = t => BX + t.c * T + T / 2, tcy = t => BY + t.r * T + T / 2;

/* ---------------- SU ---------------- */
function simWater(dt) {
  const G = S.grid, all = G.flat();
  for (const t of all) { t.reach = false; t.net = -1; t.pReach = false; }
  // ağlar: kaynaklardan geçilebilir kanal boyunca (genişlik öncelikli → dist: akış dalgası için kaynağa uzaklık)
  S.nets = [];
  for (const src of all) {
    if ((src.kind !== 'src' && src.kind !== 'psrc') || src.reach) continue;
    const id = S.nets.length, net = { id, Q: 0, cons: 0, src, plants: 0, moles: 0 }, q = [src]; src.reach = true; src.net = id; src.dist = 0;
    for (let qi = 0; qi < q.length; qi++) { const u = q[qi]; if (u.kind === 'src' || u.kind === 'psrc') net.Q++;
      for (const [dr, dc] of N4) { const v = tileAt(u.r + dr, u.c + dc); if (passable(v) && !v.reach) { v.reach = true; v.net = id; v.dist = u.dist + 1; q.push(v); } } }
    S.nets.push(net);
  }
  // zehir: zehirli kaynaktan filtreye girmeden ulaşılan kanallar
  const pst = all.filter(t => t.kind === 'psrc'); pst.forEach(t => t.pReach = true);
  while (pst.length) { const u = pst.pop(); for (const [dr, dc] of N4) { const v = tileAt(u.r + dr, u.c + dc); if (passable(v) && !v.pReach && v.kind !== 'filter') { v.pReach = true; pst.push(v); } } }
  // yayılma (önceki karenin değerleriyle)
  const prev = all.map(t => t.w);
  all.forEach((t, i) => {
    if (!t.trench) { t.w = 0; return; }
    if (t.kind === 'src' || t.kind === 'psrc') { t.w = 1; return; }
    if (!passable(t) || !t.reach) { t.w = Math.max(0, prev[i] - dt * 1.5); return; }
    const feed = N4.some(([dr, dc]) => { const n = tileAt(t.r + dr, t.c + dc); return passable(n) && n.reach && prev[n.r * COLS + n.c] >= 1; });
    if (feed) { const before = t.w; t.w = Math.min(1, prev[i] + dt * (SPEED[t.kind] || 12));
      if (before < 0.05 && t.w >= 0.05 && dt > 0) waterArrives(t); }
  });
  for (const t of all) t.poison = t.trench && t.pReach && t.w > 0.05;
}
function waterArrives(t) {
  SFX.splash(t.dist);
  S.ripples.push({ x: tcx(t), y: tcy(t), t: 0, poison: t.pReach });
  for (let i = 0; i < 5; i++) { const a = Math.random() * 6.28, v = 30 + Math.random() * 70;
    S.parts.push({ x: tcx(t), y: tcy(t), vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50, g: 420, t: 0, life: 0.35 + Math.random() * 0.2, r: 1.5 + Math.random() * 1.8, col: t.pReach ? '#C48BF2' : '#B3E5FC' }); }
}
const wetNeighbors = t => N4.map(([dr, dc]) => tileAt(t.r + dr, t.c + dc)).filter(n => passable(n) && n.reach && n.w >= 0.6);
function simPlants(dt) {
  const all = S.grid.flat();
  for (const n of S.nets) { n.cons = 0; n.plants = 0; n.moles = 0; }
  for (const t of all) {
    if (t.kind === 'plant') {
      const p = t.plant; p.net = -1; p.poisoned = false;
      if (p.dead) continue;
      const wn = wetNeighbors(t);
      if (!wn.length) { p.state = 'dry'; continue; }
      if (wn.some(n => n.poison)) { p.poisoned = true; p.state = 'poison'; continue; }
      p.net = wn[0].net; S.nets[p.net].cons += 1; S.nets[p.net].plants++;
    } else if (t.kind === 'mole') {
      const wn = wetNeighbors(t), was = t.drink; t.drink = wn.length > 0; t.net = t.drink ? wn[0].net : -1;
      if (t.drink) { S.nets[t.net].cons += 2; S.nets[t.net].moles++; if (!was && S.running) { SFX.slurp(); popText('Şlurp!', tcx(t), tcy(t) - 22, '#6D4C2F', 15); } }
    }
  }
  let growing = 0;
  for (const t of all) {
    if (t.kind !== 'plant') continue;
    const p = t.plant; p.pop *= Math.exp(-6 * dt); p.squash *= Math.exp(-10 * dt); p.cd = Math.max(0, p.cd - dt);
    if (p.dead) continue;
    if (p.poisoned) { p.hp -= dt * 0.7; if (p.hp <= 0) { p.hp = 0; p.dead = true; SFX.poison(); buzz([30, 30, 60]); popText('Soldu!', tcx(t), tcy(t) - 20, '#8E44AD', 18); } continue; }
    if (p.net < 0) continue;
    const net = S.nets[p.net];
    if (net.cons > CAP * net.Q) { if (p.state !== 'thirsty') { p.state = 'thirsty'; if (S.running) SFX.thirst(); } continue; }
    p.state = 'grow'; growing++;
    p.g += dt * GROW * net.Q / net.cons;
    if (p.g >= 1) { p.g -= 1; harvest(t); }
  }
  return growing;
}
function harvest(t) {
  const k = t.plant.k, need = S.L.order[k] || 0, counted = S.got[k] !== undefined && S.got[k] + S.flies.filter(f => f.k === k && f.counted && !f.done).length < need;
  t.plant.pop = 1; t.plant.squash = 1; S.harvests++;
  const slot = slotXY(k), tx = counted ? slot.x - 18 : tcx(t), ty = counted ? slot.y : tcy(t) - 44;
  S.flies.push({ k, x0: tcx(t), y0: tcy(t) - 6, x1: tx, y1: ty, t: 0, counted });
  for (let i = 0; i < 7; i++) { const a = -Math.PI * Math.random(), v = 60 + Math.random() * 90;   // yaprak saçılır

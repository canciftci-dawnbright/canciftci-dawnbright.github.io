<style>
:root{ --bg:#0B0A1A; --panel:#15142B; --line:#2C2A4F; --ink:#EDEBFF; --ink-dim:#8F8BC0; --go:#7C5CFF; --bad:#FF5A6E; --gold:#FFC94A; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;background-image:radial-gradient(640px 360px at 50% 0%,rgba(124,92,255,.22),transparent 72%)}
#app{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:6px 5px 10px}
.cab{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 9px 9px;box-shadow:0 20px 50px rgba(0,0,0,.6);position:relative;overflow:hidden}
.hud{display:flex;align-items:center;justify-content:space-between;padding:0 4px 7px;border-bottom:1px solid var(--line)}
.stat{line-height:1}.stat small{display:block;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:2px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.stat.r{text-align:right}
.stat.warn b{color:var(--bad)}
.stage{position:relative;margin-top:7px;border-radius:13px;overflow:hidden;border:1px solid var(--line);touch-action:none}
#cv{display:block;margin:0 auto}
.row{display:flex;gap:7px;margin-top:8px}
button{flex:1;appearance:none;border:1px solid var(--line);background:#221F45;color:var(--ink);font:inherit;font-size:14px;font-weight:800;padding:10px 6px;border-radius:12px;cursor:pointer;white-space:nowrap}
button.go{background:var(--go);color:#fff;border-color:#5B3FE0}
.ov{position:absolute;inset:0;background:rgba(11,10,26,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:20}
.ov h2{font-size:30px;margin:0 0 4px;line-height:1.1}.ov p{color:#B7B3E6;font-size:14px;line-height:1.5;margin:4px 0 12px;max-width:310px}
.ov .row{width:100%;max-width:280px;flex-direction:column}
.ov .chain{display:block;color:#fff;font-size:22px;letter-spacing:2px;margin:2px 0 8px}
.stars{font-size:44px;letter-spacing:6px;margin:4px 0}
.stars span{display:inline-block;color:#35325E;transform:scale(.5);transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .2s}
.stars span.on{color:var(--gold);transform:scale(1)}
.boot{position:fixed;left:10px;right:10px;top:10px;z-index:9999;padding:12px 14px;border-radius:10px;background:#3B1512;color:#FFD9D2;font-size:13px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}

<script>
'use strict';
/* ============================================================
   MİNİK GEZEGEN — yörüngede merge (his dilimi)
   Gezegenin etrafında dönen 12 yuvalı halka. Uzaydan küçük nesneler gelip boş yuvalara yerleşir.
   Aynı iki nesneyi sürükleyip üst üste bırak → birleşir: ✨ toz → ⭐ yıldız → ☄ kuyruklu yıldız → 🌙 ay → ☀ güneş.
   Nesneyi gezegenin üstüne bırak → gezegen yer. Değer katlanır (1·3·9·27·81); istediğini verirsen ×2.
   Halka 5 sn dolu kalırsa kaybedersin. Meteor yağmuru halkaya taş atar: taş + taş = ✨ (çöp kaynağa döner), taş yenmez.
   Gezegen büyüdükçe okyanus → orman → hayvanlar → şehir ışıkları; her aşamada müziğe katman eklenir.
   ============================================================ */
const W = 360, H = 640, CX = 180, CY = 334;
const SLOTS = 12, RING_R = 136, RING_SPIN = 0.13;       // yuva sayısı · halka yarıçapı (ekran px) · dönüş (rad/sn)
const P_R0 = 34, P_R1 = 70;                               // gezegen yarıçapı: başlangıç / tam büyüme
/* Bölümler — target: büyüme puanı · spawn: [başta, sonda] geliş aralığı · hunger: açlık düşüşü (%/sn, 0 = yok)
   showers: meteor yağmuru büyüme oranları · ice: donmuş nesne sayısı · ufo: uzaylı aralığı (sn) · hole: kara delik · reqT: istek süresi (sn) */
const LEVELS = [
  { target: 110, spawn: [1.3, 0.9],   hunger: 0,   showers: [] },
  { target: 150, spawn: [1.2, 0.8],   hunger: 2.4, showers: [0.5] },
  { target: 170, spawn: [1.1, 0.7],   hunger: 2.6, showers: [0.45], ice: 3 },
  { target: 190, spawn: [1.05, 0.62], hunger: 2.8, showers: [], ice: 2, ufo: 12 },
  { target: 200, spawn: [1.0, 0.58],  hunger: 3.0, showers: [0.5], hole: true },
  { target: 210, spawn: [1.0, 0.55],  hunger: 3.1, showers: [], reqT: 10, ufo: 13 },
  { target: 220, spawn: [0.95, 0.52], hunger: 3.2, showers: [0.3, 0.7], ice: 4, hole: true },
  { target: 230, spawn: [0.9, 0.5],   hunger: 3.3, showers: [0.5], ufo: 10, reqT: 9 },
  { target: 240, spawn: [0.9, 0.48],  hunger: 3.4, showers: [], hole: true, ice: 3, ufo: 11 },
  { target: 260, spawn: [0.85, 0.45], hunger: 3.6, showers: [0.35, 0.7], hole: true, ice: 3, ufo: 10, reqT: 8 },
];
const FOOD = [0, 2, 8, 20, 38, 60];                       // kademeye göre açlık doyurma (%) — toz tek tek doyurmaz, büyük lokma ödüllü
const ICE_HITS = 2, UFO_CHARGE = 2.6, HOLE_SPEED = -0.36; // donmuşu kırmak için yan merge · uzaylının çekme süresi · kara deliğin halka üstündeki hızı
const LV_KEY = 'dbg.gezegen.lv';
const VALUE = [0, 1, 3, 9, 27, 81];                       // kademeye göre besleme değeri
const MAX_TIER = 5, FULL_LOSE = 5;
const STAGE_AT = [0, 0.18, 0.4, 0.63, 0.85];
/* Gezegen türleri — her biri kendi görünüşü, yüzey renkleri, sesi ve aşama isimleriyle.
   base: [uyku rengi, canlı renk] · pat: desen rengi/türü · flora: bitki örtüsü rengi/türü · light: ışık rengi · feats: kulak/kuyruk vb. çizimi */
const SPECIES = [
  { id: 'cat', name: 'Kedi', emoji: '🐱', base: ['#C9A98C', '#F4A259'], pat: ['#D9772B', 'stripes'], flora: ['#8FD18F', 'grass'], light: '#FFE082', inner: '#FFB3C7',
    stages: ['🧶 Tüyleri kabardı!', '🐟 Balık gölleri doğdu!', '🌿 Kedi otu bahçeleri!', '🏮 Işıklar yandı!'] },
  { id: 'monkey', name: 'Maymun', emoji: '🐵', base: ['#9C8272', '#9A6340'], pat: ['#7A4A2C', 'patch'], flora: ['#43A047', 'palm'], light: '#FFB74D', inner: '#F2D2A9',
    stages: ['🌴 Palmiyeler çıktı!', '🍌 Muz ormanları!', '🐒 Sarmaşıklar sarktı!', '🔥 Kamp ateşleri yandı!'] },
  { id: 'rabbit', name: 'Tavşan', emoji: '🐰', base: ['#C8C2D6', '#EFE6F4'], pat: ['#DCC9E8', 'spots'], flora: ['#F48FB1', 'flowers'], light: '#FFF59D', inner: '#FFB3C7',
    stages: ['🌸 Çayırlar açtı!', '🥕 Havuç tarlaları!', '🍀 Yonca bahçeleri!', '🏡 Yuvaların ışığı!'] },
  { id: 'octo', name: 'Ahtapot', emoji: '🐙', base: ['#8A7FB8', '#6C63FF'], pat: ['#8C85FF', 'spots'], flora: ['#FF8A80', 'coral'], light: '#80FFEA', inner: '#B9B4FF',
    stages: ['🌊 Derin denizler!', '🐚 Mercan resifleri!', '🐠 Balık sürüleri!', '💡 Işıldayan denizanaları!'] },
  { id: 'dragon', name: 'Ejderha', emoji: '🐲', base: ['#8FA08A', '#43B581'], pat: ['#2E8B62', 'scales'], flora: ['#FF7043', 'volcano'], light: '#FFAB40', inner: '#FFD180',
    stages: ['🌋 Volkanlar uyandı!', '💎 Kristal mağaralar!', '🌲 Çam ormanları!', '🔥 Ejderha ateşleri!'] },
  { id: 'panda', name: 'Panda', emoji: '🐼', base: ['#BDBDC7', '#F3F3F3'], pat: ['#DADADA', 'patch'], flora: ['#7CB342', 'bamboo'], light: '#FF8A65', inner: '#3A3A3A',
    stages: ['⛰ Dağlar yükseldi!', '🎋 Bambu ormanları!', '☁ Bulutlu vadiler!', '🏮 Fener festivali!'] },
];
const COLL_KEY = 'dbg.gezegen.v1';
const loadColl = () => { try { return JSON.parse(localStorage.getItem(COLL_KEY)) || { got: [] }; } catch (e) { return { got: [] }; } };
const saveColl = c => { try { localStorage.setItem(COLL_KEY, JSON.stringify(c)); } catch (e) {} };
const TIER_NAME = ['', 'Yıldız tozu', 'Yıldız', 'Kuyruklu yıldız', 'Ay', 'Güneş'];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);
const rnd = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ac = null, master = null, noise = null, pads = [];
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    [[130.8, 'sine'], [196, 'triangle'], [261.6, 'sine'], [329.6, 'triangle'], [392, 'sine']].forEach(([f, type], i) => {
      const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.value = 0;
      lfo.frequency.value = 0.15 + i * 0.07; lg.gain.value = f * 0.004; lfo.connect(lg); lg.connect(o.frequency); o.connect(g); g.connect(master); o.start(); lfo.start(); pads.push(g); });
  }
  function tone(t0, dur, f0, f1, g, type) { const o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gg); gg.connect(master); o.start(t0); o.stop(t0 + dur + 0.02); }
  function burst(t0, dur, f, q, g, type) { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = type || 'bandpass';
    bp.frequency.value = f; bp.Q.value = q; const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.01);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(bp); bp.connect(gg); gg.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.02); }
  const w = fn => (...a) => { if (!ac) return; fn(ac.currentTime, ...a); };
  const note = (t, semi, dur, g, type) => { const f = 523.25 * Math.pow(2, semi / 12); tone(t, dur, f, f, g, type || 'sine'); };
  return { init,
    pads: level => { if (!ac) return; pads.forEach((g, i) => g.gain.setTargetAtTime(i <= level ? 0.02 : 0, ac.currentTime, 1.2)); },
    silence: () => { if (!ac) return; pads.forEach(g => g.gain.setTargetAtTime(0, ac.currentTime, 0.4)); },
    pick: w(t => { tone(t, 0.06, 700, 1000, 0.05, 'triangle'); }),
    drop: w(t => { tone(t, 0.06, 500, 380, 0.05, 'triangle'); }),
    arrive: w(t => { tone(t, 0.12, 1800 + Math.random() * 400, 1200, 0.02, 'sine'); }),
    merge: w((t, tier) => { const base = [0, 0, 4, 7, 12, 16][tier]; note(t, base, 0.35, 0.09, 'triangle'); note(t + 0.06, base + 7, 0.45, 0.07); if (tier >= 4) { note(t + 0.12, base + 12, 0.7, 0.07); burst(t, 0.6, 2400, 0.8, 0.05); } }),
    feed: w((t, tier) => { const f = 260 - tier * 18; tone(t, 0.14, f * 1.5, f, 0.14); tone(t + 0.1, 0.12, f * 1.2, f * 0.9, 0.1); }),
    yum: w(t => { [0, 4, 7, 12].forEach((s, i) => note(t + i * 0.07, s + 7, 0.4, 0.07, 'sine')); }),
    bleh: w(t => { tone(t, 0.25, 260, 160, 0.1, 'square'); }),
    worry: w(t => { tone(t, 0.12, 620, 600, 0.05, 'triangle'); tone(t + 0.16, 0.12, 520, 500, 0.05, 'triangle'); }),
    growl: w(t => { burst(t, 0.5, 120, 1.5, 0.18, 'lowpass'); tone(t, 0.45, 70, 55, 0.08, 'sawtooth'); }),
    crack: w((t, last) => { burst(t, 0.1, 5000, 2, 0.12); tone(t, 0.08, last ? 2600 : 1800, 1200, 0.06, 'triangle'); if (last) burst(t + 0.05, 0.25, 6000, 1, 0.1); }),
    ufo: w(t => { const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain(); o.type = 'sine'; o.frequency.value = 700; lfo.frequency.value = 7; lg.gain.value = 120;
      lfo.connect(lg); lg.connect(o.frequency); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.3); lfo.start(t); lfo.stop(t + 1.3); }),
    zap: w(t => { tone(t, 0.4, 300, 1800, 0.07, 'sawtooth'); }),
    shoo: w(t => { tone(t, 0.25, 1200, 300, 0.08, 'square'); burst(t, 0.2, 2000, 1, 0.08); }),
    swallow: w(t => { tone(t, 0.5, 400, 60, 0.12, 'sine'); burst(t, 0.4, 300, 0.7, 0.1, 'lowpass'); }),
    tick: w(t => { tone(t, 0.04, 1500, 1500, 0.04, 'square'); }),
    shower: w(t => { for (let i = 0; i < 4; i++) { burst(t + i * 0.12, 0.25, 600, 0.8, 0.12, 'lowpass'); tone(t + i * 0.12, 0.2, 300, 120, 0.06, 'sawtooth'); } }),
    stage: w(t => { [0, 4, 7, 11, 14].forEach((s, i) => note(t + i * 0.08, s - 5, 0.9, 0.07)); burst(t, 1, 3000, 0.8, 0.03); }),
    yawn: w(t => { tone(t, 0.6, 300, 500, 0.05, 'sine'); tone(t + 0.5, 0.5, 500, 260, 0.05, 'sine'); }),
    lose: w(t => { tone(t, 0.6, 500, 200, 0.12, 'sine'); tone(t + 0.4, 0.8, 400, 150, 0.1, 'sine'); }),
    win: w(t => { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => note(t + i * 0.11, s - 5, 0.9, 0.1, 'triangle')); }),
    /* türün sesi: love = istediğini aldı */
    voice: w((t, id, love) => {
      if (id === 'cat') { if (love) { const s = ac.createBufferSource(); s.buffer = noise; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; const g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
          lfo.frequency.value = 26; lg.gain.value = 0.08; lfo.connect(lg); lg.connect(g.gain); g.gain.value = 0.08; s.connect(lp); lp.connect(g); g.connect(master); s.start(t); s.stop(t + 1.1); lfo.start(t); lfo.stop(t + 1.1); }   // mırlama
        tone(t, 0.12, 520, 820, 0.07, 'triangle'); tone(t + 0.11, 0.28, 820, 460, 0.07, 'triangle'); }                     // miyav
      else if (id === 'monkey') { tone(t, 0.18, 300, 480, 0.08, 'sine'); tone(t + 0.2, 0.22, 360, 620, 0.08, 'sine'); if (love) tone(t + 0.45, 0.25, 420, 760, 0.08, 'sine'); }
      else if (id === 'rabbit') { tone(t, 0.06, 1400, 1800, 0.05, 'sine'); tone(t + 0.09, 0.06, 1500, 1900, 0.05, 'sine'); if (love) tone(t + 0.2, 0.1, 1600, 2200, 0.05, 'sine'); }
      else if (id === 'octo') { tone(t, 0.16, 520, 140, 0.1, 'sine'); for (let i = 0; i < (love ? 5 : 2); i++) tone(t + 0.1 + i * 0.07, 0.06, 900 + Math.random() * 600, 1400, 0.03, 'sine'); }
      else if (id === 'dragon') { tone(t, 0.3, 170, 90, 0.1, 'sawtooth'); burst(t, 0.35, 500, 0.6, love ? 0.18 : 0.08, 'lowpass'); }
      else if (id === 'panda') { for (let i = 0; i < 3; i++) burst(t + i * 0.09, 0.06, 700, 1.5, 0.12, 'lowpass'); if (love) tone(t + 0.3, 0.3, 500, 700, 0.05, 'sine'); }
    }),
  };
})();
const buzz = ms => { try { const ua = navigator.userActivation; if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} };

/* ---------------- DURUM ---------------- */
let S = null, DRAG = null;
const NAMES = ['Pofuduk', 'Mırmır', 'Bulut', 'Pıtırcık', 'Minnoş', 'Fındık', 'Tomurcuk', 'Işıltı'];
function newRun(lv) {
  const cfg = Object.assign({ showers: [], ice: 0, ufo: 0, hole: false, reqT: 0 }, LEVELS[lv]);
  S = { t: 0, time: 0, running: false, phase: 'play', pts: 0, stage: 0, R: P_R0, ringA: 0, lv, cfg,
    hunger: 80, hungerWarnT: 0, reqLeft: cfg.reqT, failWhy: '',
    ufo: { st: 'off', t: 9, x: -60, y: 90, slot: -1, charge: 0, item: null },
    hole: cfg.hole ? { a: Math.PI * 0.75, cd: {} } : null,
    slots: Array(SLOTS).fill(null), incoming: [], spawnT: 0.4, fullT: 0, showersDone: 0,
    want: 2, wantPop: 0, fed: 0, merges: 0, best: 1, parts: [], pops: [], rings: [], shake: 0,
    face: { mood: 'sleep', moodT: 0, blink: 0, nextBlink: 2, nom: 0, open: 0, look: -Math.PI / 2, twitch: 0, nextTwitch: 3, purr: 0, hop: 0 }, woke: false, lastWorry: 0,
    sp: speciesFor(lv),
    name: NAMES[Math.floor(Math.random() * NAMES.length)] + '-' + (1 + Math.floor(Math.random() * 9)),
    stars: Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.3, tw: Math.random() * 6 })) };
  // başlangıç: halkada birkaç toz, bir çift yan yana (ilk birleştirmeyi kolaylaştırır)
  [0, 1, 4, 7].forEach(i => S.slots[i] = makeItem(1));
  // donmuş nesneler: boş yuvalara, yanında birleştirme yapılınca çözülür
  const free = S.slots.map((s, i) => s ? -1 : i).filter(i => i >= 0 && i !== 2 && i !== 11).sort(() => Math.random() - 0.5);
  for (let k = 0; k < cfg.ice && k < free.length; k++) { const it = makeItem(Math.random() < 0.5 ? 1 : 2); it.ice = ICE_HITS; S.slots[free[k]] = it; }
}
function speciesFor(lv) { const q = new URLSearchParams(location.search).get('tur'); return SPECIES.find(s => s.id === q) || SPECIES[lv % SPECIES.length]; }
let NEXT = 1;
const makeItem = tier => ({ id: NEXT++, tier, pop: 0, born: 1, wob: Math.random() * 6 });
const progress = () => clamp(S.pts / S.cfg.target, 0, 1);
const slotAngle = i => S.ringA + i * Math.PI * 2 / SLOTS - Math.PI / 2;

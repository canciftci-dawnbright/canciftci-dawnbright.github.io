<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cephane Hattı</title>
<style>
:root{
  --void:#0E0B09; --panel:#1A1310; --line:#3A2A1E;
  --stone:#251B15; --stone2:#2F2219;
  --ink:#F6EADA; --ink-soft:#B39A80; --ink-dim:#7C6753;
  --brass:#F0B429; --brass-lit:#FFD972;
  --leaf:#4CB944; --leaf-lit:#7FE06F;
  --blood:#D8453A; --blood-dim:#8E2C25;
  --sky:#8FD3F0;
  --shadow:0 24px 64px rgba(0,0,0,.62);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--void);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(720px 440px at 50% 0%, rgba(240,180,41,.12), transparent 72%);
}
#app{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-left))
          max(24px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right))}
.stage{width:min(384px, 100%, calc((100dvh - 168px) * 0.5625));background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:10px 12px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;
  border-bottom:1px solid var(--line)}
.lv{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
.ammo{display:flex;align-items:center;gap:6px}
.ammo .bul{width:7px;height:15px;border-radius:3px 3px 2px 2px;flex:0 0 auto;
  background:linear-gradient(180deg,var(--brass-lit),var(--brass));box-shadow:0 0 9px rgba(240,180,41,.5)}
.ammo b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ammo.dry b{color:var(--blood)}
.ammo.full b{color:var(--leaf-lit)}
.ammo b.pump{animation:ammoPump .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes ammoPump{
  0%{transform:scale(1)} 30%{transform:scale(1.45);color:var(--brass-lit)} 100%{transform:scale(1)}
}
.ammo b{display:inline-block}
.ammo.full .bul{box-shadow:0 0 12px var(--leaf-lit)}
.hp{display:flex;align-items:center;gap:4px}
.hp i{display:block;width:11px;height:11px;border-radius:3px;background:var(--blood);
  box-shadow:0 0 8px rgba(216,69,58,.45)}
.hp i.out{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-dim)}

/* ---------- tahta ---------- */
.board{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;
  background:var(--sky);border:1px solid var(--line);cursor:grab}
.board:active{cursor:grabbing}
#cv{display:block;width:100%;height:auto;touch-action:none}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.pop{position:absolute;font-size:15px;font-weight:900;text-shadow:0 2px 8px #000;
  animation:popUp .85s ease-out forwards;white-space:nowrap;transform:translate(-50%,0)}
.pop.ok{color:var(--leaf-lit)} .pop.bad{color:#FF7A6E} .pop.gold{color:var(--brass-lit)}
@keyframes popUp{0%{transform:translate(-50%,6px) scale(.7);opacity:0}
  22%{transform:translate(-50%,-6px) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-40px) scale(1);opacity:0}}
.veil{position:absolute;inset:0;opacity:0;border-radius:12px;pointer-events:none;z-index:6}
.veil.bad{background:radial-gradient(130% 70% at 50% 8%, rgba(216,69,58,.6), transparent 66%);animation:vl .5s ease-out}
.veil.ok{background:radial-gradient(130% 70% at 50% 8%, rgba(76,185,68,.45), transparent 68%);animation:vl .6s ease-out}
@keyframes vl{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.board.shake{animation:shk .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}
  55%{transform:translateX(5px)}82%{transform:translateX(-3px)}}

/* ---------- kontroller ---------- */
.ctrls{display:flex;gap:7px;margin-top:9px}
button{flex:1;appearance:none;border:1px solid var(--line);background:var(--stone);color:var(--ink);
  font:inherit;font-size:12px;font-weight:700;padding:11px 6px;border-radius:9px;cursor:pointer;
  transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:var(--stone2);border-color:#4E3826}
button.go{background:var(--brass);color:#2A1C05;border-color:var(--brass)}
button.mini{flex:0 0 42px;padding:11px 0;font-size:14px}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- overlay ---------- */
.ov{position:absolute;inset:0;background:rgba(14,11,9,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px 22px;z-index:20;
  backdrop-filter:blur(3px);animation:ovIn .26s ease-out}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.ov.out{animation:ovOut .26s ease-in forwards;pointer-events:none}
@keyframes ovOut{to{opacity:0}}

/* ---------- dalga bandı ---------- */
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;z-index:15;pointer-events:none;
  animation:bnr 1.65s cubic-bezier(.2,.85,.25,1) forwards}
.banner.kan b{color:#FF9B8E;border-color:rgba(216,69,58,.6);
  text-shadow:0 3px 0 #2A0B08, 0 10px 30px rgba(216,69,58,.6)}
.banner b{display:inline-block;padding:9px 24px;border-radius:13px;
  font-size:30px;font-weight:900;letter-spacing:.16em;color:var(--brass-lit);
  background:rgba(14,11,9,.6);border:1px solid rgba(240,180,41,.4);
  text-shadow:0 3px 0 #2A1B0C, 0 10px 26px rgba(0,0,0,.75)}
@keyframes bnr{
  0%  {opacity:0;transform:scale(2.1) rotate(-8deg);filter:blur(7px)}
  16% {opacity:1;transform:scale(1) rotate(0deg);filter:blur(0)}
  68% {opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.9) translateY(-18px)}
}
.ov h2{margin:0 0 6px;font-size:24px;letter-spacing:.05em;font-weight:900}
.ov .big{font-size:44px;line-height:1;margin-bottom:4px}
.ov .sub{color:var(--ink-soft);font-size:13px;line-height:1.6;margin:0 0 16px;max-width:272px}
.ov .ctrls{width:100%;max-width:270px}
.ov.scroll{justify-content:flex-start;overflow-y:auto}
.legend{display:flex;flex-direction:column;gap:7px;width:100%;max-width:292px;margin:2px 0 14px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  background:var(--stone);border:1px solid var(--line)}
.lrow p{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink-soft);text-align:left}
.lrow p b{color:var(--ink)}
.chip{flex:0 0 54px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:15px;color:#12240E;border:2px solid #2A1C05}
.chip.g{background:var(--leaf)} .chip.r{background:var(--blood);color:#2A0B08}

/* ---------- dalga sonu kart draftı ---------- */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px;
  margin:6px 0 12px;perspective:900px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;
  text-align:center;padding:12px 9px 11px;aspect-ratio:3/4;border-radius:12px;
  background:linear-gradient(160deg,#2E231B 0%,#1E1611 100%);
  border:2px solid var(--line);box-shadow:0 8px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
  cursor:pointer;transform-origin:50% 62%;
  animation:kartGel .78s cubic-bezier(.22,.68,.28,1.02) backwards;
  transition:transform .13s,border-color .13s,box-shadow .13s}
.card::after{content:"";position:absolute;inset:4px;border-radius:8px;
  border:1px solid rgba(255,243,207,.10);pointer-events:none}
.card:hover{border-color:var(--brass);transform:translateY(-4px) scale(1.03);
  box-shadow:0 14px 26px rgba(0,0,0,.6),0 0 0 1px var(--brass)}
.card .ic{font-size:30px;line-height:1;margin-top:4px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.card b{font-size:12.5px;font-weight:900;color:var(--ink);letter-spacing:.01em;line-height:1.2}
.card i{font-style:normal;font-size:10.5px;line-height:1.35;color:var(--ink-soft);font-weight:600}
.card.atk{border-color:#5E2620} .card.atk .ic{color:#FF9B8E}
.card.hat{border-color:#5C4318} .card.hat .ic{color:var(--brass-lit)}
.card.def{border-color:#2C4C22} .card.def .ic{color:var(--leaf-lit)}
.card.sil{border-color:#4A3E6B} .card.sil .ic{color:#C3B2FF}

/* masaya döne döne atılıp yüzü açılır -- dönüş görünsün diye opaklık erken doluyor */
@keyframes kartGel{
  0%  {transform:translateY(95px) scale(.42) rotate(-340deg) rotateY(-70deg);opacity:0}
  18% {opacity:1}
  100%{transform:none;opacity:1}
}
.card.sec{animation:kartSec .36s ease-in forwards;border-color:var(--brass);z-index:2}
@keyframes kartSec{0%{transform:none}38%{transform:scale(1.14) rotate(-4deg)}
  100%{transform:scale(.28) rotate(200deg) translateY(-110px);opacity:0}}
.card.at{animation:kartAt .32s ease-in forwards}
@keyframes kartAt{to{transform:rotate(150deg) translateY(70px) scale(.55);opacity:0}}

.foot{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  font-size:9.5px;letter-spacing:.07em;color:var(--ink-dim);display:flex;justify-content:space-between}

/* Kısa telefon ekranı: çerçeveyi incelt, kazanılan yeri tahtaya ver.
   Künye satırı burada süs; silah/kalan bilgisi zaten HUD'da ve kart ekranında. */
@media (max-height:760px){
  #app{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .stage{width:min(384px, 100%, calc((100dvh - 124px) * 0.5625));padding:8px 10px 9px}
  .foot{display:none}
  .ctrls{margin-top:7px;gap:6px}
  button{padding:9px 6px}
  .hud{padding-bottom:6px}
  .board{margin-top:6px}
}
</style>

<script>
window.addEventListener("error", function(e){
  var b = document.getElementById("boot"); if(!b) return;
  b.innerHTML = "<b>Oyun hata verdi</b><br>" + (e.message||"?") + "<br><small>satır " + (e.lineno||"?") + "</small>";
});
</script>

<div id="app"><div class="stage" id="stage">
  <div class="hud">
    <span class="lv" id="hLv">Dalga 1</span>
    <span class="ammo" id="hAmmoBox"><span class="bul"></span><b id="hAmmo">0</b></span>
    <span class="hp" id="hHp"></span>
  </div>

  <div class="board" id="board">
    <canvas id="cv"></canvas>
    <div class="fx" id="fx"></div>
    <div class="veil" id="veil"></div>
    <div class="ov" id="boot"><div class="sub">yükleniyor…</div></div>
  </div>

  <div class="ctrls">
    <button id="bNew">↻ Yeniden</button>
    <button id="bHelp" class="mini" title="Kurallar">?</button>
  </div>

  <div class="foot"><span>DAWNBRIGHT · PROTOTİP</span><span id="fInfo">—</span></div>
</div></div>

<script>
(function(){
"use strict";

/* ═══════════════════ AYARLAR — tek kaynak ═══════════════════ */
var CFG = {
  W:360, H:640,

  /* yer üstü */
  groundY:218,        // toprak yüzeyi
  footY:214,          // karakterlerin taban çizgisi
  gunX:78,            // nişancı
  barrX:104,          // barikat: buraya ulaşan düşman bir kalp götürür
  spawnX:340,

  /* yer altı — 3 kanal x 3 satır */
  lanes:[76,180,284],
  shaftTop:262, shaftBot:596,
  rowsY:[332,428,524],
  plateW:108,
  fallTime:2.0,       // sn: tepeden dibe (1. bölüm)
  /* Bölüm ilerledikçe yığın hızlanır: 2.0 sn -> 1.2 sn. Takip edilemeyecek
     kadar değil ama karar süresi kısaldıkça panik artıyor. */
  fallStep:function(w){ return Math.max(0.6, 1 - 0.08*(w-1)); },
  dropGap:0.35,       // teslimattan sonraki nefes
  packetBase:12,

  /* kaydırma: tavanlı üstel yaklaşma -- uzakta hızlı, hedefte yumuşak */
  steerK:18, steerMax:620,

  /* Silah: ateş hızı şarjördeki mermiyle orantılı.
     Katsayı, şarjör tavanıyla (ammoCap = 6 × düşman canı) birlikte seçildi:
     tavanda öldürme süresi ≈ 1/(6·fireK) ≈ 0.9 sn oluyor ve bu her dalgada
     aynı kalıyor. Katsayı büyük olursa (1.2 denedik) dolu şarjörde düşman
     0.1 sn'de eriyor, küçük olursa silah hiç yetişemiyor. */
  fireBase:20, fireK:0.18, fireMax:3000,

  /* Mermi görsellerinin ortak ölçeği — yığın, teslimat seli ve uçan atışlar
     hepsi bunu çarpan olarak kullanır, tek sayıyla ayarlanır. */
  bulletScale:0.8,

  hearts:3, heartsMax:5, ammoStart:400, ammoWave:160,

  /* Elit düşman: iki kat büyük, dört kat canlı, biraz yavaş. Dalga bütçesinden
     dört normal düşman eder (eliteCost), böylece dalganın toplam canı ve
     ritmi bozulmuyor — sadece o can tek bir gövdede toplanıyor. */
  eliteFrom:3, eliteP:0.22, eliteHp:4, eliteCost:4, eliteScale:2, eliteSpd:0.78,

  /* Koşu 6 bölüm. 6. bölümde tek bir boss var: çok canlı, çok yavaş ve
     barikata ulaşırsa tek vuruşta koşuyu bitiriyor — kalp sayısı önemsiz. */
  waves:6, bossHp:6000, bossSpd:7, bossScale:3,

  /* Savaş alanı kamerası: toprak çizgisi ve ekran ortası sabit kalacak şekilde
     yer üstü büyütülür. Oyun koordinatları değişmez, yalnız çizim ölçeklenir. */
  zoom:1.42,

  /* Menzil referansı: horde önce ekrana girip yaklaşsın, ateş menzile girince
     başlasın — yoksa nişancı hepsini ekranın sağ kenarında eritiyor ve ortada
     horde diye bir şey kalmıyordu. Gerçek atış menzili silahtan gelir
     (WEAPONS[...].range); bu değer koridor ön-dolumunun geometrisi için. */
  range:230,

  /* Düşman canı tablo halinde; tarayıcıda otomatik oyuncuyla ölçülerek çıkarıldı.
     Ölçümün söyledikleri: efektif DPS ≈ mermi arz hızı (~94/sn, kusursuz
     kaydırmayla) ve kartlar bunu dalga başına ~1.3× büyütüyor.
     Korunum yasası: harcanan mermi = gelen mermi. Yani
        can(w) = arz(w) × spawn aralığı(w) × hasar çarpanı(w).
     İlk üç dalga KUSURSUZ oyuna göre değil, "hep yeşil kapıyı seçen acemi"
     arzına göre ölçüldü (~57/sn, kusursuz ~110/sn). Kusursuz eğriye göre
     ayarlıyken acemi 1. dalgayı geçemiyordu. 4. dalgadan sonra eğri kartlarla
     birlikte 1.3×/dalga tırmanıp usta kalibrasyonuna yaklaşıyor.
     Tablo bunun altında kalırsa şarjör binlere tırmanıp oyunu bozuyor (ölçtük),
     üstünde kalırsa silah susup barikat düşüyor. Katsayı 0.95: ufak bir pay
     oyuncuda kalsın, hata affedilebilsin.
     Düşman SAYISI neredeyse sabit tutuldu, zorluk tamamen cana yüklendi —
     böylece öldürme süresi her dalgada ~1.2 sn'de kalıyor, düşman hiçbir
     dalgada "bir kurşunda" ölmüyor.
     Tablo, tasarımcı tek tek dalga ayarlayabilsin diye açık bırakıldı. */
  hpTable:[55,70,105,150,200,270,360,470,620,810,1060,1390,1820],
  waveCount:function(w){ return 14 + Math.round(w/3); },
  waveHp:function(w){
    var t = CFG.hpTable;
    return (w <= t.length) ? t[w-1] : Math.round(t[t.length-1] * Math.pow(1.15, w - t.length));
  },
  /* Dalga ~30 sn sürsün: yavaş yürüyüş + geniş spawn aralığı dalgayı 40 sn'nin
     üstüne çıkarıyordu, oysa döngünün nefes almadan dönmesi gerek. */
  waveSpeed:function(w){ return 11 + 0.8*w; },
  waveGap:function(w){ return Math.max(1.0, 1.3 - 0.02*w); }
};

/* ═══════════════════ SAF OYUN MANTIĞI — DOM YOK ═══════════════════ */
/* <<<OYUN>>> */
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[rnd(a.length)]; }

/* Kart etkilerinin tamamı burada toplanır; oyun mantığı yalnız bu objeyi okur. */
function newMods(){
  return {
    dmg:1, critP:0, critX:3, pierce:0,
    fireBase:CFG.fireBase, fireK:CFG.fireK,
    packetBase:CFG.packetBase, fallTime:CFG.fallTime,
    addMul:1, divSoft:false, deliverMul:1,
    slow:0, poison:0,
    bolt:0, boltDmg:0, bomb:0, bombDmg:0, saw:0
  };
}

/* ═══════════════════ SİLAHLAR ═══════════════════
   Her silah mermiyi hasara çevirme VERİMİ (eff) ve tetik RİTMİ (rate) üzerinden
   ayrışır; toplam DPS yine mermi arzıyla sınırlı kalır, yani korunum bozulmaz.
   Ayrışma menzil, aynı anda vurulan hedef sayısı ve tetik ritminde.            */
var WEAPONS = {
  revolver:{ ad:"Revolver",        spr:"revolver", rate:1.0,  eff:1.0,  cost:1, targets:1, range:230, minGap:0,   iz:1.6 },
  pompali: { ad:"Pompalı",         spr:"pompali",  rate:0.7,  eff:1.0,  cost:3, targets:3, range:150, minGap:0,   iz:3.4 },
  smg:     { ad:"SMG",             spr:"smg",      rate:1.7,  eff:0.80, cost:1, targets:1, range:230, minGap:0,   iz:1.2 },
  ar:      { ad:"AR",              spr:"ar",       rate:0.80, eff:1.7,  cost:1, targets:1, range:260, minGap:0,   iz:2.2 },
  keskin:  { ad:"Keskin nişancı",  spr:"keskin",   rate:1.0,  eff:1.6,  cost:1, targets:3, range:360, minGap:2.0, iz:4.5, sarj:160 }
};

function wep(){ return WEAPONS[S.weapon] || WEAPONS.revolver; }

/* İlk satır yalnız toplama: yığın 12 iken ×2 her zaman +45'in altında kalır,
   yani orada çarpan/bölen sahte bir seçim olurdu. Matematik 2. ve 3. satırda. */
function gatePool(w, r){
  if(r === 0){
    var a = [ {t:"add",v:10}, {t:"add",v:25}, {t:"add",v:45} ];
    if(w>=4) a.push({t:"add",v:70});
    if(w>=7) a.push({t:"add",v:110});
    return { good:a, bad:a, addOnly:true };
  }
  var good = [ {t:"mul",v:2}, {t:"add",v:30} ];
  /* Çıkarma kapısı satıra göre ölçeklenir: 2. satırda yığın ~40, 3. satırda ~100
     olduğu için sabit bir "−25" birinde ucuz, ötekinde yıkıcı olurdu. */
  var bad  = [ {t:"div",v:2}, {t:"sub", v:(r === 1 ? 20 : 50)} ];
  if(w>=2){ good.push({t:"add",v:45}); bad.push({t:"sub", v:(r === 1 ? 30 : 75)}); }
  if(w>=3){ good.push({t:"mul",v:3}); bad.push({t:"div",v:3}); }
  if(w>=5){ bad.push({t:"zero",v:0}); }
  if(w>=7){ good.push({t:"add",v:70}); }
  if(w>=9){ good.push({t:"mul",v:4}); bad.push({t:"div",v:4}); }
  return { good:good, bad:bad, addOnly:false };
}

function isGood(t){ return t === "mul" || t === "add"; }

/* ═══════════════════ KAPI MATEMATİĞİ ═══════════════════
   Kapının sayısı düz yazılmaz, bir işlem olarak yazılır: "+24" yerine "+6+9×2".
   Oyuncu önce ifadeyi çözer (çarpma/bölme toplamadan önce), sonra kapıları
   karşılaştırır. Sonuç zaten mevcut havuzdan geldiği için denge bozulmuyor;
   zorlaşan tek şey kararı verme hızı.                                        */
function zorluk(w){ return w <= 1 ? 1 : (w <= 3 ? 2 : (w <= 5 ? 3 : 4)); }

function parcala(t, sev){
  var a, b, c, d, k;
  if(sev <= 1 || t < 6) return String(t);
  if(sev === 2){
    if(Math.random() < 0.45){ a = 1 + rnd(t-1); return a + "+" + (t-a); }
    b = 2 + rnd(3);
    if(t % b === 0 && t/b > 1) return (t/b) + "×" + b;
    a = t + 2 + rnd(8); return a + "−" + (a-t);
  }
  /* Terimler dengeli tutulur: çarpım hedefin en az üçte birini taşısın ki
     oyuncu gerçekten hesaplasın, "170+3×2" gibi sahte zorluk çıkmasın. */
  if(sev === 3){
    b = 2 + rnd(4);                                   // 2..5
    if(Math.random() < 0.4){                          // negatif kurulum: a − b×c
      c = Math.max(2, Math.round(t * (0.2 + Math.random()*0.3) / b));
      return (t + b*c) + "−" + b + "×" + c;
    }
    c = Math.max(2, Math.round(t * (0.3 + Math.random()*0.3) / b));
    if(b*c >= t) c = Math.floor((t-1)/b);
    a = t - b*c;
    if(a > 0 && c >= 2) return a + "+" + b + "×" + c;
    return parcala(t, 2);
  }
  b = 2 + rnd(3); d = 2 + rnd(3);                     // a×b + c÷d
  k = Math.max(1, Math.round(t * (0.2 + Math.random()*0.2)));
  k = k + (((t - k) % b) + b) % b;                    // (t-k) b'ye tam bölünsün
  a = (t - k) / b;
  if(a > 0 && k > 0) return a + "×" + b + "+" + (d*k) + "÷" + d;
  return parcala(t, 3);
}

/* Bölme kapılarının değeri 2-4 arasında; parcala() bu kadar küçük sayıyı düz
   yazıyordu, yani kırmızı kapılarda hiç matematik yoktu. Bunlar için ayrı
   üretici: bölmeyle büyütür, en zor kademede içine sıfırlanan bir terim koyar
   — levha büyük görünür ama değeri küçüktür, oyuncunun sıfırı fark etmesi gerekir. */
function parcalaKucuk(t, sev){
  var a, b, d;
  if(sev <= 1) return String(t);
  if(sev === 2){
    if(t >= 2 && Math.random() < 0.5){ a = 1 + rnd(t-1); return a + "+" + (t-a); }
    d = 2 + rnd(4); return (t*d) + "÷" + d;
  }
  if(sev === 3){
    if(Math.random() < 0.5){ d = 3 + rnd(6); return (t*d) + "÷" + d; }
    a = 2 + rnd(4); return (t*a) + "÷" + a;
  }
  a = 2 + rnd(8); b = 2 + rnd(8);
  return Math.random() < 0.5 ? (t + "+" + a + "×0")
                             : (t + "+" + a + "×(" + b + "−" + b + ")");
}

/* Kart etkileri (Altın kapı, Sigorta) burada pişirilir ki levhada yazan ifade
   ile kapının gerçek etkisi hiçbir zaman ayrışmasın. */
function pisir(src, w, m){
  var t = src.t, v = src.v;
  if(t === "add") v = Math.round(v * m.addMul);
  else if(t === "div" && m.divSoft) v = Math.max(1.5, v - 1);
  else if(t === "zero" && m.divSoft){ t = "div"; v = 4; }
  var sev = zorluk(w);
  var ex = (t === "zero") ? "0"
         : (v !== Math.floor(v)) ? String(v)
         : (v < 6 ? parcalaKucuk(v, sev) : parcala(v, sev));
  return { t:t, v:v, ex:ex, hit:0 };
}

function sameAs(g, i){
  var k;
  for(k=0;k<g.length;k++) if(k !== i && g[k].t === g[i].t && g[k].v === g[i].v) return true;
  return false;
}

/* Karışık satırda en az bir iyi ve en az bir kötü kapı olur — bedava geçiş yok. */
function makeRow(w, r, m){
  var p = gatePool(w, r), i, j, t, g, pool;
  if(p.addOnly){
    g = []; pool = p.good.slice();
    for(i=0;i<3;i++){ j = rnd(pool.length); g.push(pool[j]); pool.splice(j,1); }
  } else {
    g = [ pick(p.good), pick(p.bad), ((w <= 2 || Math.random() < 0.55) ? pick(p.good) : pick(p.bad)) ];
    for(i=0;i<3;i++){
      for(j=0;j<12 && sameAs(g, i);j++) g[i] = pick(isGood(g[i].t) ? p.good : p.bad);
    }
  }
  for(i=g.length-1;i>0;i--){ j = rnd(i+1); t = g[i]; g[i] = g[j]; g[j] = t; }
  for(i=0;i<3;i++) g[i] = pisir(g[i], w, m);
  return g;
}

function applyGate(n, g){
  if(g.t === "mul") return n * g.v;
  if(g.t === "add") return n + g.v;
  if(g.t === "sub") return Math.max(1, n - g.v);        // asla sıfırlamaz
  if(g.t === "div") return Math.max(1, Math.ceil(n / g.v));
  return 0;                                             // zero
}

function gateLabel(g){
  var e = g.ex, bilesik = /[+\-−×÷]/.test(e);
  if(g.t === "add") return "+" + e;                      // toplamada öncelik zaten doğru
  if(g.t === "mul") return "×" + (bilesik ? "(" + e + ")" : e);
  if(g.t === "sub") return "−" + (bilesik ? "(" + e + ")" : e);
  if(g.t === "div") return "÷" + (bilesik ? "(" + e + ")" : e);
  return "×0";
}

function laneOf(x){
  var best = 0, bd = 1e9, i, d;
  for(i=0;i<CFG.lanes.length;i++){ d = Math.abs(x - CFG.lanes[i]); if(d < bd){ bd = d; best = i; } }
  return best;
}

/* ═══════════════════ KART HAVUZU ═══════════════════
   Her kart bir kez alınır. Yetenek hasarları o dalganın düşman canına oranlıdır
   (S.hp) — böylece geç dalgalarda anlamsızlaşmazlar.                            */
var CARDS = [

  { ic:"☠",  ad:"Zehir",        k:"atk", ac:"Vurulan düşman 3 saniye boyunca erir.",

  { ic:"▽",  ad:"Geniş huni",   k:"hat", ac:"Yığın 12 yerine 30 mermiyle başlar.",

  { ic:"⇊",  ad:"Hızlı hat",    k:"hat", ac:"Yığın %30 daha hızlı düşer, teslimat sıklaşır.",
    f:function(m){ m.fallTime *= 0.7; } },
  { ic:"✚",  ad:"Altın kapı",   k:"hat", ac:"Toplama kapıları %60 daha fazla verir.",
    f:function(m){ m.addMul *= 1.6; } },
  { ic:"🛡", ad:"Sigorta",      k:"hat", ac:"Bölme kapıları bir kademe zayıflar, ×0 kalkar.",
    f:function(m){ m.divSoft = true; } },
  { ic:"✦",  ad:"Bereket",      k:"hat", ac:"Her teslimat %25 fazla mermi getirir.",
    f:function(m){ m.deliverMul *= 1.25; } },

    ok:function(s){ return s.maxHearts < CFG.heartsMax; },

  { ic:"✚♥", ad:"Onarım",       k:"def", ac:"2 kalp geri gelir.",

/* ═══════════════════ DURUM ═══════════════════ */
var S = null;

function newRun(){
  var i;
  S = {
    /* açılış şarjörü: hat ilk teslimatını yapana kadar silah susmasın */
    wave:0, hearts:CFG.hearts, maxHearts:CFG.hearts, ammo:CFG.ammoStart,
    over:false, won:false, paused:false, boss:false,
    t:0, fireAcc:0, shake:0, flash:0, walk:0, fired:0,
    foes:[], toSpawn:0, spawnT:0, hp:0, spd:0, gap:0,
    rows:[], packet:null, aimX:CFG.lanes[1], dropT:0, refHp:CFG.waveHp(1),
    puffs:[], feed:[], zaps:[], blasts:[], shots:[], dmgPops:[], sawA:0, deliverFx:0,
    boltT:0, bombT:0,
    weapon:"revolver", shotT:0, beam:0, bossBar:null,
    mods:newMods(), deck:[], taken:[]
  };
  for(i=0;i<CARDS.length;i++) S.deck.push(i);
  startWave(1);
  newBoard();
  S.dropT = 0;
  S.paused = true;             // bant/yardım kapanana kadar bekle
  syncHud();
}

function startWave(w){
  S.wave = w;
  S.boss = (w >= CFG.waves);
  S.toSpawn = S.boss ? 0 : CFG.waveCount(w);
  S.hp  = S.boss ? CFG.bossHp : CFG.waveHp(w);
  S.refHp = CFG.waveHp(Math.min(w, CFG.hpTable.length));   // yetenek/tavan ölçeği
  S.spd = S.boss ? CFG.bossSpd : CFG.waveSpeed(w);
  S.gap = CFG.waveGap(w);
  S.spawnT = S.gap;
  S.boltT = S.mods.bolt;
  S.bombT = S.mods.bomb;
  S.shotT = 0; S.fireAcc = 0;
  /* Her dalga kendi tedarik problemi: devreden mermi yok. Küçük bir açılış
     stoğu var ki silah ilk teslimat gelene kadar tamamen susmasın. */
  if(w > 1) S.ammo = CFG.ammoWave;

  /* Koridorun UZAK yarısını baştan doldur: yoksa horde menzile yürüyene kadar
     silah ~9 sn boşta kalıyor, o boşlukta şarjör binlere tırmanıyor ve dalga
     bomboş bir sahnede açılıyordu. Yakın yarı boş bırakılıyor ki hat ilk
     teslimatını yapacak kadar zaman bulsun — aksi halde dalga, şarjör sıfırken
     yedi düşmanla birden açılıyor. */
  if(S.boss){ spawnFoe(CFG.spawnX, true, true); return; }

  var i, adim = S.spd * S.gap, span = CFG.spawnX - CFG.range;
  var pre = Math.floor(span / adim / 2), bas = CFG.range + span/2;
  for(i=0;i<pre && S.toSpawn>0;i++){
    S.toSpawn--;
    spawnFoe(Math.min(CFG.spawnX, bas + i*adim));
  }
}

function spawnFoe(x, el, boss){
  var hp = boss ? CFG.bossHp : (el ? S.hp * CFG.eliteHp : S.hp);
  S.foes.push({
    x: boss ? x : x + rnd(10),
    y: boss ? CFG.footY : CFG.footY - (el ? 4 : 10) + rnd(el ? 8 : 14),
    hp: hp, max: hp,
    kind: rnd(2), ph: Math.random()*6.28,
    el: !!el, boss: !!boss, sp: boss ? 1 : (el ? CFG.eliteSpd : 1),
    hurt:0, die:0, burn:0, acc:0, accT:0
  });
}

function rollElite(){
  return S.wave >= CFG.eliteFrom && S.toSpawn > CFG.eliteCost && Math.random() < CFG.eliteP;
}

/* Yeni kapı dizilimi — yığın yok. Oyuncu tahtayı görüp kararını verdikten
   sonra kendi tıklamasıyla bırakıyor; hat artık kendi kendine akmıyor. */
function newBoard(){
  var i;
  S.rows = [];
  for(i=0;i<CFG.rowsY.length;i++) S.rows.push(makeRow(S.wave, i, S.mods));
  S.packet = null;
  S.dropT = CFG.dropGap;
}

function canDrop(){
  return !S.over && !S.paused && !S.packet && S.dropT <= 0;
}

function dropPacket(){
  if(!canDrop()) return;
  S.packet = { x:S.aimX, tx:S.aimX, y:CFG.shaftTop, n:S.mods.packetBase, row:0, bump:0 };
}

/* ═══════════════════ ADIM ═══════════════════ */
function step(dt){
  if(S.over || S.paused) return;
  S.t += dt; S.walk += dt; S.sawA += dt*9;
  if(S.shake > 0) S.shake -= dt;
  if(S.flash > 0) S.flash -= dt;
  stepPacket(dt);
  stepSpawn(dt);
  stepFoes(dt);
  stepGun(dt);
  stepAbility(dt);
  stepFx(dt);
}

function stepPacket(dt){
  var P = S.packet, m = S.mods, i, lane, g, before, v;
  if(S.dropT > 0) S.dropT -= dt;
  if(!P) return;
  if(P.bump > 0) P.bump -= dt;

  /* yanal: tavanlı üstel yaklaşma — parmağa yapışır, hedefte titremez */
  v = (P.tx - P.x) * CFG.steerK;
  if(v >  CFG.steerMax) v =  CFG.steerMax;
  if(v < -CFG.steerMax) v = -CFG.steerMax;
  P.x += v * dt;
  if(Math.abs(P.tx - P.x) < 0.5) P.x = P.tx;

  /* dikey */
  var vy = (CFG.shaftBot - CFG.shaftTop) / (m.fallTime * CFG.fallStep(S.wave));
  var py = P.y;
  P.y += vy * dt;

  for(i=P.row;i<CFG.rowsY.length;i++){
    if(py < CFG.rowsY[i] && P.y >= CFG.rowsY[i]){
      lane = laneOf(P.x);
      g = S.rows[i][lane];
      before = P.n;
      P.n = applyGate(P.n, g);
      g.hit = 0.35;
      P.row = i + 1;
      P.bump = 0.22;
      onGate(P.x, CFG.rowsY[i], before, P.n, g);
    }
  }

  if(P.y >= CFG.shaftBot){
    deliver(P.n);
    newBoard();
  }
}

function stepSpawn(dt){
  if(S.toSpawn <= 0) return;
  S.spawnT -= dt;
  if(S.spawnT > 0) return;
  var el = rollElite();
  S.spawnT = S.gap * (el ? CFG.eliteCost : 1);   // elit, dört düşmanlık yer tutar
  S.toSpawn -= el ? CFG.eliteCost : 1;
  spawnFoe(CFG.spawnX, el);
}

function stepFoes(dt){
  var i, f, alive = 0, sp = S.spd * (1 - S.mods.slow);
  for(i=S.foes.length-1;i>=0;i--){
    f = S.foes[i];
    if(f.die > 0){
      f.die -= dt;
      if(f.die <= 0) S.foes.splice(i,1);
      continue;
    }
    if(f.hurt > 0) f.hurt -= dt;
    /* Biriken hasar ~0.2 sn'de bir tek sayı olarak fırlar; yoksa saniyede
       yüzlerce rakam üst üste binerdi. */
    if(f.acc > 0){
      f.accT -= dt;
      if(f.accT <= 0){
        S.dmgPops.push({ x:f.x + rnd(16)-8, y:f.y - (f.boss ? 96 : f.el ? 66 : 34),
                         v:Math.round(f.acc), t:0.62, vy:-46 - rnd(24), buyuk:f.acc > S.refHp*0.6 });
        f.acc = 0; f.accT = 0.2;
      }
    }
    if(f.burn > 0){ f.burn -= dt; hurt(f, S.mods.poison * Math.min(f.max, S.refHp * CFG.eliteHp) * dt); if(f.die > 0) continue; }
    f.x -= sp * f.sp * dt;
    if(f.x <= CFG.barrX){ var bs = f.boss; S.foes.splice(i,1); breach(bs); }
    else alive++;
  }
  if(S.toSpawn <= 0 && alive === 0 && S.foes.length === 0 && !S.over && !S.paused) waveClear();
}

/* Menzil içindeki en yakın n düşman — pompalı üçünü birden biçer. */
function targets(n){
  var w = wep(), out = [], i, f;
  for(i=0;i<S.foes.length;i++){
    f = S.foes[i];
    /* Boss menzil dışı sayılmaz: o kadar büyük ki her silah vurur. Aksi halde
       kısa menzilli pompalı boss'a karşı 5 saniyelik pencere buluyor ve silah
       seçimi bir tercih değil gizli tuzak oluyordu. */
    if(f.die > 0 || (f.x > w.range && !f.boss)) continue;
    out.push(f);
  }
  out.sort(function(a,b){ return a.x - b.x; });
  return out.slice(0, n);
}
function target(){ var t = targets(1); return t.length ? t[0] : null; }
function second(skip){
  var t = targets(3), i;
  for(i=0;i<t.length;i++) if(t[i] !== skip) return t[i];
  return null;
}

function hurt(f, d){
  if(f.die > 0) return;
  f.hp -= d; f.hurt = 0.09; f.acc += d;
  if(S.mods.poison > 0 && f.burn <= 0) f.burn = 3;
  if(f.hp <= 0){
    f.die = 0.3;
    if(f.acc > 0){
      S.dmgPops.push({ x:f.x, y:f.y - (f.boss ? 96 : f.el ? 66 : 34),
                       v:Math.round(f.acc), t:0.7, vy:-58, buyuk:true });
      f.acc = 0;
    }
    puff(f.x, f.y, f.kind, f.boss ? 3 : f.el ? 2 : 1);
  }
}

function stepGun(dt){
  S.fired = 0;
  var m = S.mods, w = wep(), i, d, tg, s2, guard = 0;

  /* Keskin nişancı: tetik zamanla sınırlı. Her atışta şarjörün bir kısmını
     boşaltıp hattaki üç düşmanı deler — böylece hem "2 sn'de bir" tarifine
     uyar hem de gücü mermi arzıyla ölçeklenir. */
  if(w.minGap > 0){
    if(S.shotT > 0) S.shotT -= dt;
    if(S.shotT > 0) return;
    tg = targets(w.targets);
    if(!tg.length || S.ammo <= 0) return;
    var harca = Math.min(S.ammo, w.sarj);
    S.ammo -= harca;
    d = harca * w.eff * m.dmg;
    if(m.critP > 0 && Math.random() < m.critP) d *= m.critX;
    for(i=0;i<tg.length;i++) hurt(tg[i], d);
    for(i=0;i<tg.length;i++) shotFx(tg[i].x, tg[i].y - 16);
    S.shotT = w.minGap;
    S.fired = 6; S.flash = 0.16; S.beam = 0.2;
    return;
  }

  var cost = w.cost;
  tg = targets(w.targets);
  if(!tg.length || S.ammo < cost){ S.fireAcc = 0; return; }
  var rate = Math.min(CFG.fireMax, (m.fireBase + S.ammo * m.fireK) * w.rate);
  S.fireAcc += rate * dt;
  while(S.fireAcc >= 1 && S.ammo >= cost && guard < 400){
    S.fireAcc -= 1; S.ammo -= cost; S.fired++; guard++;
    if(S.fired % 2 === 1) shotFx(tg[0].x, tg[0].y - 14);
    d = w.eff * m.dmg;
    if(m.critP > 0 && Math.random() < m.critP) d *= m.critX;
    for(i=0;i<tg.length;i++) hurt(tg[i], d);
    if(m.pierce > 0 && tg.length === 1){ s2 = second(tg[0]); if(s2) hurt(s2, d * m.pierce); }
    if(tg[0].die > 0){ tg = targets(w.targets); if(!tg.length) break; }
  }
  if(S.fired > 0) S.flash = 0.06;
}

/* Yetenek hasarı o dalganın düşman canına oranlı — geç dalgada da anlamlı kalır. */
function stepAbility(dt){
  var m = S.mods, i, f, cx;
  if(m.bolt > 0){
    S.boltT -= dt;
    if(S.boltT <= 0){
      S.boltT = m.bolt;
      f = target();
      if(f){ S.zaps.push({ x:f.x, y:f.y, t:0.32 }); hurt(f, m.boltDmg * S.refHp); }
    }
  }
  if(m.bomb > 0){
    S.bombT -= dt;
    if(S.bombT <= 0){
      S.bombT = m.bomb;
      cx = densest();
      if(cx !== null){
        S.blasts.push({ x:cx, y:CFG.footY-14, t:0.4 });
        for(i=0;i<S.foes.length;i++){
          f = S.foes[i];
          if(f.die <= 0 && Math.abs(f.x - cx) < 56) hurt(f, m.bombDmg * S.refHp);
        }
      }
    }
  }
  if(m.saw > 0){
    for(i=0;i<S.foes.length;i++){
      f = S.foes[i];
      if(f.die <= 0 && f.x < CFG.barrX + 44) hurt(f, m.saw * S.refHp * dt);
    }
  }
}

function densest(){
  var i, j, best = null, bn = 0, n;
  for(i=0;i<S.foes.length;i++){
    if(S.foes[i].die > 0) continue;
    n = 0;
    for(j=0;j<S.foes.length;j++){
      if(S.foes[j].die <= 0 && Math.abs(S.foes[j].x - S.foes[i].x) < 56) n++;
    }
    if(n > bn){ bn = n; best = S.foes[i].x; }
  }
  return best;
}

/* Namlu izleri yerine gerçek mermi görselleri: nereye ateş edildiği okunuyor. */
function shotFx(tx, ty){
  if(S.shots.length > 70) return;
  S.shots.push({ x0:CFG.gunX + 30, y0:CFG.footY - 27, x1:tx, y1:ty,
                 t:0, dur:0.09 + Math.random()*0.05, j:(Math.random()-0.5)*8 });
}

function stepFx(dt){
  var i, p;
  for(i=S.shots.length-1;i>=0;i--){
    p = S.shots[i]; p.t += dt;
    if(p.t >= p.dur) S.shots.splice(i,1);
  }
  if(S.deliverFx > 0) S.deliverFx -= dt;
  for(i=S.puffs.length-1;i>=0;i--){
    p = S.puffs[i]; p.t -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt;
    p.a = (p.a || 0) + (p.dr || 0)*dt;
    if(p.t <= 0) S.puffs.splice(i,1);
  }
  for(i=S.dmgPops.length-1;i>=0;i--){
    p = S.dmgPops[i]; p.t -= dt; p.y += p.vy*dt; p.vy += 90*dt;
    if(p.t <= 0) S.dmgPops.splice(i,1);
  }
  for(i=S.feed.length-1;i>=0;i--){
    p = S.feed[i]; p.t += dt;
    if(p.t >= p.dur) S.feed.splice(i,1);
  }
  if(S.beam > 0) S.beam -= dt;
  for(i=S.zaps.length-1;i>=0;i--){ S.zaps[i].t -= dt; if(S.zaps[i].t <= 0) S.zaps.splice(i,1); }
  for(i=S.blasts.length-1;i>=0;i--){ S.blasts[i].t -= dt; if(S.blasts[i].t <= 0) S.blasts.splice(i,1); }
}

/* ═══════════════════ OLAYLAR ═══════════════════ */
/* Şarjör tavanı: "6 düşmanı devirecek kadar mermi". Dalgayla kendiliğinden
   ölçekleniyor, hasar kartları aldıkça daralıyor. Tavan olmadan boşta geçen
   saniyelerde banka binlere tırmanıyor ve mermi akışının baskısı yok oluyordu. */
function ammoCap(){
  var w = wep();
  return Math.ceil(6 * S.refHp * w.cost / (w.eff * S.mods.dmg));
}

function deliver(n){
  var got = Math.round(n * S.mods.deliverMul), i, k, cap = ammoCap();
  S.ammo = Math.min(cap, S.ammo + got);
  /* Teslimat miktarı görünür olsun: mermi sayısıyla orantılı bir sel akıyor.
     Tamamını çizmek (1000 sprite) gereksiz; 220'de doyuyor ama akış süresi
     miktarla uzuyor, "çok mermi aldım" hissi oradan geliyor. */
  k = Math.max(10, Math.min(220, Math.round(got / 5)));
  for(i=0;i<k;i++){
    S.feed.push({ t:-i*0.010, dur:0.5, x0:CFG.lanes[1]+rnd(46)-23, y0:CFG.shaftBot,
                  x1:CFG.barrX+6+rnd(20)-10, y1:CFG.footY-16, r:Math.random()*6.28 });
  }
  /* Kutlama, yığının kaç katına çıktığına göre: mutlak sayı bölümle büyüdüğü
     için tek eşik her yerde doğru olmuyor. */
  var kat = got / Math.max(1, S.mods.packetBase);
  S.deliverFx = kat >= 12 ? 0.55 : 0;
  pop(CFG.lanes[1], CFG.shaftBot-26, "+" + got, got > 0 ? "gold" : "bad");
  if(kat >= 26){
    pop(CFG.lanes[1], CFG.shaftBot-58, "MUHTEŞEM! ×" + Math.round(kat), "gold");
    S.shake = 0.26; pumpHud();
  } else if(kat >= 12){
    pop(CFG.lanes[1], CFG.shaftBot-58, "×" + Math.round(kat), "ok");
    pumpHud();
  }
  syncHud();
}

function breach(boss){
  S.hearts = boss ? 0 : S.hearts - 1;      // boss barikata değerse koşu biter
  S.shake = 0.34; shakeBoard(); veil("bad");
  syncHud();
  if(S.hearts <= 0) gameOver();
}

function waveClear(){
  veil("ok");
  S.paused = true;
  if(S.wave >= CFG.waves){ S.over = true; S.won = true; setTimeout(showWin, 500); return; }
  setTimeout(function(){ if(!S.over) showCards(); }, 420);   // flaş okunsun, sonra kartlar
}

function gameOver(){ S.over = true; showEnd(); }

function puff(x, y, kind, olcek){
  var i, o = olcek || 1, n = Math.round(11 * o);
  for(i=0;i<n;i++){
    S.puffs.push({ x:x, y:y-14*o, vx:(Math.random()-0.5)*190*o, vy:-50-Math.random()*170*o,
                   t:0.45+Math.random()*0.25, k:kind, r:(2+Math.random()*3.4)*o,
                   dr:(Math.random()-0.5)*14 });
  }
}

(function loadArt(){
  var k;
  for(k in ART_SRC){
    if(!ART_SRC.hasOwnProperty(k)) continue;
    (function(key){
      var im = new Image();
      im.onload = function(){ ART[key] = im; };
      im.src = ART_SRC[key];
    })(k);
  }
})();

/* ═══════════════════ ÇİZİM ═══════════════════ */
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
function el(id){ return document.getElementById(id); }

function fitCanvas(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = cv.clientWidth || CFG.W;
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(w * (CFG.H/CFG.W) * dpr);
  ctx.setTransform(cv.width/CFG.W, 0, 0, cv.width/CFG.W, 0, 0);
  ctx.imageSmoothingEnabled = true;
}

/* Vuruş flash'ı için beyaz siluet. Canvas'ta görsel boyamanın ucuz yolu:
   sprite'ı bir kez offscreen'e çizip "source-in" ile beyaza boyamak. */
var WHITE = {};
function beyaz(key){
  if(WHITE[key] !== undefined) return WHITE[key];
  var im = ART[key];
  if(!im){ return null; }                        // sprite henüz yüklenmediyse önbelleğe alma
  var c = document.createElement("canvas");
  c.width = im.width; c.height = im.height;
  var x = c.getContext("2d");
  x.drawImage(im, 0, 0);
  x.globalCompositeOperation = "source-in";
  x.fillStyle = "#FFFFFF";
  x.fillRect(0, 0, c.width, c.height);
  WHITE[key] = c;
  return c;
}

/* sprite: (cx, taban y) hizasında, yüksekliğe göre ölçekli */
function spr(key, cx, cy, h, flip){
  var im = ART[key];
  if(!im) return false;
  var s = h / im.height, w = im.width * s;
  ctx.save();
  ctx.translate(cx, cy);
  if(flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w/2, -h, w, h);
  ctx.restore();
  return true;
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

function bigText(txt, x, y, size, fill){
  ctx.font = "900 " + size + "px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.miterLimit = 2;
  ctx.lineWidth = Math.max(4, size*0.26);
  ctx.strokeStyle = "#2A1B0C"; ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}

function camIn(){
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, CFG.W, CFG.groundY); ctx.clip();
  ctx.translate(CFG.W/2, CFG.groundY);
  ctx.scale(CFG.zoom, CFG.zoom);
  ctx.translate(-CFG.W/2, -CFG.groundY);
}
function camOut(){ ctx.restore(); }

function drawBg(){
  if(ART.zemin){
    ctx.drawImage(ART.zemin, 0, 0, CFG.W, CFG.H);
    camIn(); ctx.drawImage(ART.zemin, 0, 0, CFG.W, CFG.H); camOut();
    return;
  }
  var g = ctx.createLinearGradient(0, 0, 0, CFG.groundY);
  g.addColorStop(0, "#8FD3F0"); g.addColorStop(1, "#CFE9F5");
  ctx.fillStyle = g; ctx.fillRect(0, 0, CFG.W, CFG.groundY-24);
  ctx.fillStyle = "#E3C078"; ctx.fillRect(0, CFG.groundY-24, CFG.W, 24);
  ctx.fillStyle = "#6B4A2F"; ctx.fillRect(0, CFG.groundY, CFG.W, CFG.H-CFG.groundY);
  ctx.fillStyle = "#5A3E27"; ctx.fillRect(0, CFG.H-42, CFG.W, 42);
}

function drawBossBar(){
  if(S.bossBar == null) return;
  var x = 14, y = 12, w = CFG.W - 28, h = 15;
  ctx.save();
  ctx.fillStyle = "rgba(10,7,5,.72)";
  roundRect(x-3, y-3, w+6, h+22, 8); ctx.fill();
  ctx.fillStyle = "#4A1210"; roundRect(x, y, w, h, 5); ctx.fill();
  ctx.fillStyle = "#E0503F"; roundRect(x, y, Math.max(2, w*S.bossBar), h, 5); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.18)"; roundRect(x, y, Math.max(2, w*S.bossBar), h*0.45, 5); ctx.fill();
  ctx.strokeStyle = "#FFD972"; ctx.lineWidth = 1.6; roundRect(x, y, w, h, 5); ctx.stroke();
  ctx.restore();
  bigText("BOSS", CFG.W/2 - 34, y + h + 9, 13, "#FFD972");
  bigText("%" + Math.ceil(S.bossBar*100), CFG.W/2 + 26, y + h + 9, 13, "#FFB3A6");
}

function drawBattle(){
  var i, f, p, sh = S.shake > 0 ? (Math.random()-0.5)*5 : 0;
  S.bossBar = null;
  camIn();
  ctx.save(); ctx.translate(sh, 0);

  /* testere bölgesi */
  if(S.mods.saw > 0){
    var sx = CFG.barrX + 30, sy = CFG.footY - 12;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(S.sawA);
    ctx.fillStyle = "#C8D2DA"; ctx.strokeStyle = "#5A6670"; ctx.lineWidth = 2;
    ctx.beginPath();
    for(i=0;i<10;i++){
      var a = i/10*6.283, r = (i%2 ? 9 : 16);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  var order = S.foes.slice().sort(function(a,b){ return a.y - b.y; });
  for(i=0;i<order.length;i++){
    f = order[i];
    var el  = f.el, bs = f.boss;
    var bob = Math.sin(S.walk*(bs ? 4 : el ? 6 : 9) + f.ph) * (bs ? 4 : el ? 3 : 2);
    var fr  = Math.floor(S.walk*(bs ? 4 : el ? 5 : 7) + f.ph) % 2;
    var key = (f.kind === 0 ? "sari-" : "yesil-") + fr;
    var h = bs ? 30*CFG.bossScale : (el ? 30*CFG.eliteScale : 30);
    ctx.save();
    if(el && f.die <= 0){                       // elitin/boss'un ayağının dibinde koyu halka
      ctx.fillStyle = bs ? "rgba(150,16,12,.5)" : "rgba(120,20,16,.35)";
      ctx.beginPath(); ctx.ellipse(f.x, f.y+1, bs ? 34 : 22, bs ? 9 : 6, 0, 0, 6.28); ctx.fill();
    }
    if(f.die > 0){
      var k = f.die/0.26;
      ctx.globalAlpha = k;
      ctx.translate(f.x, f.y); ctx.scale(1+(1-k)*0.5, 1-(1-k)*0.4); ctx.translate(-f.x, -f.y);
    }
    /* sola yürüyorlar; sprite sağa bakıyor, aynalanmazsa geri geri yürür gibi duruyor */
    if(!spr(key, f.x, f.y + bob, h, true)){
      ctx.fillStyle = f.kind === 0 ? "#F2C230" : "#57A83E";
      ctx.beginPath(); ctx.arc(f.x, f.y-12+bob, 12, 0, 6.28); ctx.fill();
    }
    if(f.hurt > 0){
      var wim = beyaz(key);
      if(wim){
        var wsc = h / wim.height, ww = wim.width * wsc;
        ctx.globalAlpha = Math.min(0.75, f.hurt/0.09 * 0.75);
        ctx.translate(f.x, f.y + bob); ctx.scale(-1, 1);
        ctx.drawImage(wim, -ww/2, -h, ww, h);
      }
    }
    ctx.restore();

    if(f.die <= 0 && bs) S.bossBar = Math.max(0, f.hp / f.max);   // bar kamera dışında çizilir
    if(f.die <= 0 && !bs){
      var bw = el ? 40 : 24, bh = el ? 5 : 3, bx = f.x - bw/2, by = f.y - h - (el ? 10 : 8);
      ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(bx-1, by-1, bw+2, bh+2);
      ctx.fillStyle = "#D8453A"; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = f.burn > 0 ? "#B6E44F" : "#7FE06F";
      ctx.fillRect(bx, by, bw*Math.max(0, f.hp/f.max), bh);
      if(el){                                   // elit rozeti
        ctx.strokeStyle = "#FFD972"; ctx.lineWidth = 1.5;
        ctx.strokeRect(bx-1.5, by-1.5, bw+3, bh+3);
      }
    }
  }

  if(!spr("sandik", CFG.barrX + 6, CFG.footY + 4, 30, false)){
    ctx.fillStyle = "#7A5636"; ctx.fillRect(CFG.barrX-8, CFG.footY-26, 26, 26);
  }

  var firing = S.fired > 0 || S.flash > 0;
  var w = wep(), poz = firing ? "ates" : "bekle", gx = CFG.gunX + (firing ? -3 : 0);
  if(!spr("nisanci-" + w.spr + "-" + poz, gx, CFG.footY, 46, false) &&
     !spr("nisanci-" + poz, gx, CFG.footY, 46, false)){
    ctx.fillStyle = "#8A6A45"; ctx.fillRect(CFG.gunX-9, CFG.footY-42, 18, 42);
  }

  /* Kısa menzilli silahta (pompalı) ateş hattının bittiği yer görünsün:
     yerde parlak bir köşebent + sönük dikey çizgi. */
  if(w.range < 200){
    ctx.save();
    ctx.strokeStyle = "rgba(255,150,120,.30)"; ctx.lineWidth = 2; ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.moveTo(w.range, CFG.footY - 34); ctx.lineTo(w.range, CFG.footY + 1);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = "#FF8C6E"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(w.range - 12, CFG.footY + 2);
    ctx.lineTo(w.range, CFG.footY + 2);
    ctx.lineTo(w.range, CFG.footY - 9);
    ctx.stroke();
    ctx.restore();
  }

  /* uçan mermiler — nereye ateş edildiği net okunsun */
  for(i=0;i<S.shots.length;i++){
    p = S.shots[i];
    var kk = Math.min(1, p.t / p.dur);
    var sx = p.x0 + (p.x1 - p.x0) * kk;
    var sy = p.y0 + (p.y1 - p.y0) * kk + p.j * Math.sin(kk*3.14);
    /* mermi sprite'ı aşağı bakar (+Y). Hedef yönü ac ise doğru dönüş ac-90'dır;
       +90 kullanınca mermi tam ters yöne, ucu geriye bakarak uçuyordu. */
    var ac = Math.atan2(p.y1 - p.y0, p.x1 - p.x0);
    ctx.save();
    ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.lineWidth = w.iz; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx - Math.cos(ac)*16, sy - Math.sin(ac)*16);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    ctx.translate(sx, sy); ctx.rotate(ac - 1.5708);
    var bs1 = CFG.bulletScale * w.iz / 1.6;
    if(ART.mermi) ctx.drawImage(ART.mermi, -3.5*bs1, -9*bs1, 7*bs1, 18*bs1);
    else { ctx.fillStyle = "#F0B429"; ctx.fillRect(-3*bs1,-8*bs1,6*bs1,16*bs1); }
    ctx.restore();
  }

  if(firing){
    var mx = CFG.gunX + 30, my = CFG.footY - 27;
    ctx.fillStyle = "rgba(255,238,170,.95)";
    ctx.beginPath(); ctx.arc(mx+2, my, 5 + Math.random()*4, 0, 6.28); ctx.fill();
    ctx.fillStyle = "rgba(255,190,80,.55)";
    ctx.beginPath(); ctx.arc(mx+6, my, 9 + Math.random()*5, 0, 6.28); ctx.fill();
  }

  /* keskin nişancı hattı */
  if(S.beam > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, S.beam/0.2);
    ctx.strokeStyle = "#FFF3CF"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(CFG.gunX + 30, CFG.footY - 27);
    ctx.lineTo(w.range, CFG.footY - 30);
    ctx.stroke();
    ctx.globalAlpha *= 0.5; ctx.lineWidth = 9; ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* şimşek */
  for(i=0;i<S.zaps.length;i++){
    p = S.zaps[i];
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.t/0.32);
    ctx.strokeStyle = "#BFE9FF"; ctx.lineWidth = 3; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(p.x, 0);
    var yy = 0, xx = p.x;
    while(yy < p.y - 12){ yy += 22; xx = p.x + (Math.random()-0.5)*22; ctx.lineTo(xx, yy); }
    ctx.lineTo(p.x, p.y - 12); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  /* bomba */
  for(i=0;i<S.blasts.length;i++){
    p = S.blasts[i];
    var kk = 1 - p.t/0.4;
    ctx.globalAlpha = 1 - kk;
    ctx.fillStyle = "#FFB33A";
    ctx.beginPath(); ctx.arc(p.x, p.y, 12 + kk*52, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  }

  for(i=0;i<S.puffs.length;i++){
    p = S.puffs[i];
    ctx.globalAlpha = Math.max(0, p.t/0.5);
    ctx.fillStyle = p.k === 0 ? "#F7D64A" : "#6FBF4C";
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.a || 0);
    ctx.fillRect(-p.r, -p.r*0.72, p.r*2, p.r*1.44);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* hasar sayıları */
  for(i=0;i<S.dmgPops.length;i++){
    p = S.dmgPops[i];
    var dk = 1 - p.t/0.7;
    ctx.globalAlpha = Math.min(1, p.t*3.2);
    bigText(String(p.v), p.x, p.y, p.buyuk ? 19 : 14,
            p.buyuk ? "#FFD972" : "#FFF3CF");
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  camOut();
  drawBossBar();
}

function drawShaft(dt){
  var i, j, y, g, im, p;

  im = ART.boru;
  if(im){
    var pw = 22, ph = pw * (im.height/im.width);
    for(y = CFG.groundY - 4; y < CFG.H; y += ph - 5) ctx.drawImage(im, 4, y, pw, ph);
  }

  /* Kova imleci takip eder; bırakmaya hazırken hafifçe nefes alır. */
  var hazir = canDrop(), nabiz = hazir ? 1 + Math.sin(S.t*7)*0.06 : 1;
  var kx = S.aimX;
  if(hazir){                                     // hazır halkası
    ctx.save();
    ctx.globalAlpha = 0.30 + Math.sin(S.t*7)*0.14;
    ctx.fillStyle = "#FFD972";
    ctx.beginPath(); ctx.ellipse(kx, CFG.shaftTop - 20, 30*nabiz, 22*nabiz, 0, 0, 6.28); ctx.fill();
    ctx.restore();
  }
  if(!spr("huni", kx, CFG.shaftTop - 4, 46*nabiz, false)){
    ctx.fillStyle = "#EFEFEF"; ctx.fillRect(kx-16, CFG.shaftTop-46, 32, 40);
  }
  /* hat durduysa oyuncuyu dürt: mermi akmazsa silah susar */
  if(hazir && (S.dropT < -1.2 || S.ammo <= 0)){
    ctx.globalAlpha = 0.55 + Math.sin(S.t*8)*0.35;
    bigText("TIKLA", kx, CFG.shaftTop + 20, 15, "#FFD972");
    ctx.globalAlpha = 1;
  }

  /* kılavuz: yığın düşerken kendi hattı, beklerken kovanın hedef hattı */
  ctx.save();
  ctx.strokeStyle = S.packet ? "rgba(255,243,207,.30)" : "rgba(255,217,114,.42)";
  ctx.lineWidth = 3; ctx.setLineDash([7,9]);
  ctx.beginPath();
  if(S.packet){ ctx.moveTo(S.packet.x, S.packet.y + 12); ctx.lineTo(S.packet.x, CFG.shaftBot); }
  else        { ctx.moveTo(kx, CFG.shaftTop + 6);        ctx.lineTo(kx, CFG.shaftBot); }
  ctx.stroke();
  ctx.restore();

  for(i=0;i<CFG.rowsY.length;i++){
    y = CFG.rowsY[i];
    for(j=0;j<3;j++){
      g = S.rows[i][j];
      if(g.hit > 0) g.hit -= dt;
      var x = CFG.lanes[j], good = isGood(g.t);
      var w = CFG.plateW + (g.hit > 0 ? 26*g.hit : 0);
      im = ART[good ? "levha-yesil" : "levha-kirmizi"];
      if(im){
        var s = w/im.width;
        ctx.drawImage(im, x - w/2, y - im.height*s/2, w, im.height*s);
      } else {
        ctx.fillStyle = good ? "#4CB944" : "#8E2C25";
        ctx.strokeStyle = "#2A1B0C"; ctx.lineWidth = 3;
        ctx.fillRect(x-w/2, y-16, w, 32); ctx.strokeRect(x-w/2, y-16, w, 32);
      }
      /* ifade uzadıkça yazı küçülür ki levhadan taşmasın */
      var lbl = gateLabel(g), fs = 22;
      ctx.font = "900 " + fs + "px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
      var gen = ctx.measureText(lbl).width, sinir = CFG.plateW - 16;
      if(gen > sinir) fs = Math.max(12, Math.floor(fs * sinir / gen));
      bigText(lbl, x, y + 1, fs, good ? "#FFFFFF" : "#FFD9D4");
    }
  }

  if(S.deliverFx > 0){
    var dk = 1 - S.deliverFx/0.55;
    ctx.save();
    ctx.globalAlpha = (1 - dk) * 0.85;
    ctx.strokeStyle = "#FFD972"; ctx.lineWidth = 5 - dk*3;
    ctx.beginPath(); ctx.arc(CFG.lanes[1], CFG.H - 22, 14 + dk*72, 0, 6.28); ctx.stroke();
    ctx.globalAlpha = (1 - dk) * 0.35;
    ctx.fillStyle = "#FFD972";
    ctx.beginPath(); ctx.arc(CFG.lanes[1], CFG.H - 22, 10 + dk*40, 0, 6.28); ctx.fill();
    ctx.restore();
  }

  if(!spr("sandik", CFG.lanes[1], CFG.H - 4, 34, false)){
    ctx.fillStyle = "#7A5636"; ctx.fillRect(CFG.lanes[1]-18, CFG.H-38, 36, 34);
  }

  drawPacket();

  for(i=0;i<S.feed.length;i++){
    p = S.feed[i];
    if(p.t < 0) continue;
    var k = Math.min(1, p.t/p.dur), e = k*k*(3-2*k);
    /* Akış BORUNUN İÇİNDEN geçer: uçuşun %64'ünde mermi boruda dikey ilerliyor.
       Serbest bir eğri kullanınca sel sol sütundaki levhayı kapatıyordu; hem
       okunurluk bozuluyordu hem de borunun ne işe yaradığı belirsiz kalıyordu. */
    var bx = 17, by1 = CFG.shaftBot - 30, by2 = CFG.groundY + 20, px, py, q;
    if(e < 0.18){ q = e/0.18;            px = p.x0 + (bx - p.x0)*q;  py = p.y0 + (by1 - p.y0)*q; }
    else if(e < 0.82){ q = (e-0.18)/0.64; px = bx;                    py = by1 + (by2 - by1)*q; }
    else { q = (e-0.82)/0.18;             px = bx + (p.x1 - bx)*q;    py = by2 + (p.y1 - by2)*q; }
    ctx.save(); ctx.translate(px, py); ctx.rotate(p.r + k*8); ctx.globalAlpha = 1-k*0.3;
    var bs3 = CFG.bulletScale;
    if(ART.mermi) ctx.drawImage(ART.mermi, -3*bs3, -8*bs3, 6*bs3, 16*bs3);
    else { ctx.fillStyle = "#F0B429"; ctx.fillRect(-2*bs3,-6*bs3,4*bs3,12*bs3); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawPacket(){
  var P = S.packet, i;
  if(!P) return;
  var n = Math.min(16, 3 + Math.floor(Math.log(Math.max(2, P.n)) * 3));
  var sc = 1 + (P.bump > 0 ? P.bump*1.6 : 0);

  ctx.save(); ctx.translate(P.x, P.y); ctx.scale(sc, sc);
  for(i=0;i<n;i++){
    var a = i*2.399, r = 4 + Math.sqrt(i)*5.2;
    ctx.save();
    ctx.translate(Math.cos(a)*r, Math.sin(a)*r*0.7);
    ctx.rotate(Math.sin(a)*0.5);
    var bs2 = CFG.bulletScale;
    if(ART.mermi) ctx.drawImage(ART.mermi, -3.5*bs2, -9*bs2, 7*bs2, 18*bs2);
    else { ctx.fillStyle = "#F0B429"; ctx.fillRect(-2.5*bs2,-7*bs2,5*bs2,14*bs2); }
    ctx.restore();
  }
  ctx.restore();

  var lbl = String(P.n), ls = 30 * (1 + (P.bump > 0 ? P.bump*0.8 : 0));
  ctx.font = "900 " + ls + "px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  var lw = ctx.measureText(lbl).width + 22, lh = ls + 10, ly = P.y - 42;
  ctx.fillStyle = "rgba(18,12,7,.82)";
  ctx.strokeStyle = "rgba(255,243,207,.35)"; ctx.lineWidth = 2;
  roundRect(P.x - lw/2, ly - lh/2, lw, lh, 9);
  ctx.fill(); ctx.stroke();
  bigText(lbl, P.x, ly + 1, ls, "#FFF3CF");
}

function draw(dt){
  ctx.clearRect(0, 0, CFG.W, CFG.H);
  drawBg();
  drawShaft(dt);
  drawBattle();
}

/* ═══════════════════ HUD / EFEKT ═══════════════════ */
function syncHud(){
  el("hLv").textContent = S.boss ? "BOSS" : ("Dalga " + S.wave + "/" + CFG.waves);
  el("hAmmo").textContent = S.ammo;
  el("hAmmoBox").className = "ammo" +
    (S.ammo <= 0 ? " dry" : (S.ammo >= ammoCap() ? " full" : ""));
  var h = "", i;
  for(i=0;i<S.maxHearts;i++) h += '<i class="' + (i < S.hearts ? "" : "out") + '"></i>';
  el("hHp").innerHTML = h;
  var ic = "";
  for(i=0;i<S.taken.length;i++) ic += CARDS[S.taken[i]].ic;
  el("fInfo").textContent = wep().ad + (ic ? "  ·  " + ic : "") +
                            "  ·  kalan " + (S.toSpawn + S.foes.length);
}

function pop(x, y, txt, cls){
  var d = document.createElement("div");
  d.className = "pop " + (cls || "");
  d.style.left = (x/CFG.W*100) + "%";
  d.style.top  = (y/CFG.H*100) + "%";
  d.textContent = txt;
  el("fx").appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 900);
}

function onGate(x, y, before, after, g){
  var up = after > before;
  pop(x + (laneOf(x) === 2 ? -58 : 58), y - 6, (up ? "▲ " : "▼ ") + gateLabel(g), up ? "ok" : "bad");
}

function veil(kind){
  var v = el("veil");
  v.className = "veil"; void v.offsetWidth; v.className = "veil " + kind;
}
/* HUD'daki mermi sayısı büyük teslimatta zıplasın */
function pumpHud(){
  var b = el("hAmmo");
  b.classList.remove("pump"); void b.offsetWidth; b.classList.add("pump");
  setTimeout(function(){ b.classList.remove("pump"); }, 420);
}

function shakeBoard(){
  var b = el("board");
  b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  setTimeout(function(){ b.classList.remove("shake"); }, 360);
}

/* ═══════════════════ OVERLAY ═══════════════════ */
function clearOv(){
  var o = el("board").querySelectorAll(".ov"), i;
  for(i=0;i<o.length;i++) o[i].parentNode.removeChild(o[i]);
}
function overlay(html, scroll){
  clearOv();
  var d = document.createElement("div");
  d.className = "ov" + (scroll ? " scroll" : "");
  d.innerHTML = html;
  el("board").appendChild(d);
  return d;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* Overlay'i sertçe silmek yerine soldur — dalga geçişi böylece kesilmiyor. */
function fadeOv(cb){
  var o = el("board").querySelector(".ov");
  if(!o){ if(cb) cb(); return; }
  o.className += " out";
  setTimeout(function(){ clearOv(); if(cb) cb(); }, 260);
}

/* Dalga bandı: "DALGA 2" dönerek girer, okunur, silinir. cb bandın okunduğu
   anda çağrılır — oyun o ana kadar duraklı kalır ki geçiş yumuşak olsun. */
function banner(txt, cb, kirmizi){
  var d = document.createElement("div");
  d.className = "banner" + (kirmizi ? " kan" : "");
  d.innerHTML = "<b>" + esc(txt) + "</b>";
  el("board").appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 1700);
  if(cb) setTimeout(cb, 860);
}

function resumeWithBanner(){
  banner(S.boss ? "BOSS" : ("DALGA " + S.wave + "/" + CFG.waves),
         function(){ if(!S.over) S.paused = false; }, S.boss);
}

/* ─────────── dalga sonu kart draftı ─────────── */
function showCards(){
  var avail = [], i, j, t, draw = [], c;
  for(i=0;i<S.deck.length;i++){
    c = CARDS[S.deck[i]];
    if(!c.ok || c.ok(S)) avail.push(S.deck[i]);
  }
  if(avail.length === 0){ nextWave(); return; }        // havuz bitti: kartsız devam
  for(i=avail.length-1;i>0;i--){ j = rnd(i+1); t = avail[i]; avail[i] = avail[j]; avail[j] = t; }
  draw = avail.slice(0, Math.min(4, avail.length));

  var html = '<h2>Dalga ' + S.wave + ' temiz</h2>' +
             '<p class="sub">Bir kart seç — koşu boyunca sende kalır.</p><div class="cards">';
  for(i=0;i<draw.length;i++){
    c = CARDS[draw[i]];
    html += '<button class="card ' + c.k + '" data-k="' + draw[i] + '"' +
              ' style="animation-delay:' + (0.10*i).toFixed(2) + 's">' +
              '<span class="ic">' + c.ic + '</span><b>' + esc(c.ad) + '</b><i>' + esc(c.ac) + '</i>' +
            '</button>';
  }
  html += '</div>';

  var d = overlay(html, false);            // 4 kart sığıyor, ortalanmış dursun
  var btns = d.querySelectorAll(".card");
  for(i=0;i<btns.length;i++){
    btns[i].addEventListener("click", function(e){
      var me = e.currentTarget, j;
      if(me.getAttribute("data-done")) return;
      for(j=0;j<btns.length;j++){
        btns[j].setAttribute("data-done", "1");
        btns[j].style.animation = "none"; void btns[j].offsetWidth;
        btns[j].className = btns[j].className.replace(/ (sec|at)/g, "") + (btns[j] === me ? " sec" : " at");
      }
      var k = parseInt(me.getAttribute("data-k"), 10);
      setTimeout(function(){ takeCard(k); }, 340);   // kart uçsun, sonra sıradaki dalga
    });
  }
}

function takeCard(idx){
  var c = CARDS[idx], i;
  if(c.f) c.f(S.mods);
  if(c.g) c.g(S);
  if(c.w){ S.weapon = c.w; S.shotT = 0; S.fireAcc = 0; }
  S.taken.push(idx);
  for(i=0;i<S.deck.length;i++){ if(S.deck[i] === idx){ S.deck.splice(i,1); break; } }
  fadeOv(nextWave);
}

function nextWave(){
  startWave(S.wave + 1);
  newBoard();
  syncHud();
  resumeWithBanner();          // duraklı kalır, bant okununca devam eder
}

function showWin(){
  var i, ic = "";
  for(i=0;i<S.taken.length;i++) ic += CARDS[S.taken[i]].ic + " ";
  var d = overlay(
    '<div class="big">🏆</div><h2>Hat tutuldu</h2>' +

/* ═══════════════════ GİRDİ ═══════════════════
   İmleç/parmak kovayı sürer, tık yığını bırakır. Yığın düşerken aynı hareket
   onu da yönlendirmeye devam eder — kova zaten yığının hedef kanalında durur. */
var dragging = false;

function boardX(e){
  var r = cv.getBoundingClientRect();
  var cx = (e.touches && e.touches.length) ? e.touches[0].clientX : e.clientX;
  return (cx - r.left) / r.width * CFG.W;
}
function aimTo(x){
  if(!S) return;
  var lo = CFG.lanes[0], hi = CFG.lanes[CFG.lanes.length-1];
  S.aimX = Math.max(lo, Math.min(hi, x));
  if(S.packet) S.packet.tx = S.aimX;
}
function onDown(e){ e.preventDefault(); dragging = true; aimTo(boardX(e)); dropPacket(); }
function onMove(e){ e.preventDefault(); if(dragging || e.pointerType === "mouse") aimTo(boardX(e)); }
function onUp(){ dragging = false; }

cv.addEventListener("pointerdown", onDown);
cv.addEventListener("pointermove", onMove);
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);
cv.addEventListener("touchstart", onDown, { passive:false });
cv.addEventListener("touchmove",  onMove, { passive:false });
document.addEventListener("keydown", function(e){
  if(!S) return;
  var i = laneOf(S.aimX);
  if(e.key === "ArrowLeft"){ aimTo(CFG.lanes[Math.max(0, i-1)]); e.preventDefault(); }
  if(e.key === "ArrowRight"){ aimTo(CFG.lanes[Math.min(2, i+1)]); e.preventDefault(); }
  if(e.key === " " || e.key === "Enter"){ dropPacket(); e.preventDefault(); }
});

el("bNew").addEventListener("click", function(){
  fadeOv(function(){ newRun(); resumeWithBanner(); });
});
el("bHelp").addEventListener("click", function(){
  if(S) S.paused = true;       // yardım açıkken oyun arkada akmasın
  showHelp();
});
window.addEventListener("resize", function(){ fitCanvas(); draw(0); });

/* ═══════════════════ DÖNGÜ ═══════════════════ */
var last = 0, hudT = 0;
function loop(ts){
  var dt = last ? Math.min(0.05, (ts - last)/1000) : 0;
  last = ts;
  step(dt);
  draw(dt);
  hudT += dt;
  if(hudT > 0.1){ hudT = 0; syncHud(); }
  requestAnimationFrame(loop);
}

fitCanvas();
newRun();
showHelp();
requestAnimationFrame(loop);

})();
</script>

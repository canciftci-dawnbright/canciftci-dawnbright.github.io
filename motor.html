<script type="module">
import * as THREE from 'three';
const G = window.G = {};

/* <<<FIZIK>>> */
/* Tek parca dinamik: yokusta yercekimi + motor - surukleme - yuvarlanma direnci,
   yanal surus ve toplanabilirler, rampada firlama, havada balistik + oyuncunun takla
   kontrolu. Duvarin ustunden gecen, arkasindaki inis yokusuna konup bir sonraki
   rampaya devam eder; her asilan duvar kademeyi bir artirir, sonraki duvar daha uzak.
   DOM'a hic dokunmuyor, saf fonksiyon -- harness bu blogu oldugu gibi kesip
   calistiriyor. Oyun da ayni adimla()'yi 1/240 sn adimla cagiriyor. */
const FZ = { g: 9.81, rho: 1.22, m: 185 };

/* Parkur: 5 bolum. Bolum = yokus (ilki tepe, sonrakiler duvarin arkasindaki inis) +
   rampa + carpan bolgeleri + duvar. Ilk 4 duvar asilabilir (x2..x5), sonuncusu parkurun sonu. */
const PARKUR = {
  ilkTepe: 8, ilkBoy: 110,          // eskisi 9 m / 74 m idi: kosu cok kisa bitiyordu
  rampaBoy: 11, rampaYuk: 3.3, kalinlik: 1.6,
  duvarH: [8, 9.5, 11, 12.5, 15],   // asilabilir duvarlar tepenin dorugunda: oyuncu istegi, alcak tumsek degil tepe gibi gorunsun
  mesafe: [100, 140, 180, 220, 260], // rampa cikisindan duvara; her bolumde 40 m uzar (tepeli duvarla merdiven aramasi)
  inisBoy: [110, 125, 140, 155],     // duvarin arkasindaki inis yokusu (baslangic yuksekligi = duvar yuksekligi)
  /* Duvara yaslanan sicrama rampasi (boy = oran x duvar yuksekligi). Ayri bir tumsek once denendi:
     hizli motor tumsegi asip duvarin dibine carpiyor, yavasi tumsekten asiyordu -- yukseltme
     sonucu kotulestiriyordu. Duvara yaslaninca duvara alcak gelen her motor rampaya biner. */
  tumsekOran: 3.4,
  tumsekFren: 4,       // tepe yuzunde tirmanirken yavaslama (duz bolgedeki kayma freninden ayri)
};
const KAT_DIZI = [2, 3, 5, 10, 25], KAT_ORAN = [0, 0.4, 0.6, 0.78, 0.92];     // 2x rampaya yakin: atlayabilen herkes kazanir (yoksa yeni oyuncunun %71'i 0 coin); 25x duvarin dibinde
const BOLUMLER = [];
{ let x = 0;
  for (let k = 0; k < PARKUR.duvarH.length; k++) {
    const tepe = k === 0 ? PARKUR.ilkTepe : PARKUR.duvarH[k - 1], boy = k === 0 ? PARKUR.ilkBoy : PARKUR.inisBoy[k - 1];
    const yokusSon = x + boy, rampaSon = yokusSon + PARKUR.rampaBoy, duvar = rampaSon + PARKUR.mesafe[k];
    const asilir = k < PARKUR.duvarH.length - 1, tumsekBoy = PARKUR.tumsekOran * PARKUR.duvarH[k];
    BOLUMLER.push({ i: k, bas: x, tepe, boy, yokusSon, rampaSon, duvar, duvarH: PARKUR.duvarH[k], asilir,
      tumsekBas: asilir ? duvar - tumsekBoy : Infinity, tumsekSon: asilir ? duvar : Infinity, tumsekBoy, tumsekYuk: PARKUR.duvarH[k],
      katlar: KAT_ORAN.map((f, j) => ({ d: rampaSon + f * PARKUR.mesafe[k], k: KAT_DIZI[j] })) });
    x = duvar + PARKUR.kalinlik;
  }
}
const SON_BOLUM = BOLUMLER.length - 1;
const bolumOf = x => { for (const b of BOLUMLER) if (x < b.duvar + PARKUR.kalinlik) return b; return BOLUMLER[SON_BOLUM]; };
// eski kodla uyum: YER ilk bolumu anlatir
const YER = { tepe: PARKUR.ilkTepe, yokusSon: BOLUMLER[0].yokusSon, rampaBoy: PARKUR.rampaBoy, rampaYuk: PARKUR.rampaYuk,
  rampaSon: BOLUMLER[0].rampaSon, duvar: BOLUMLER[0].duvar, duvarYuk: PARKUR.duvarH[0], son: BOLUMLER[SON_BOLUM].duvar };

// Yokus: basta dik, sonra yumusayan bir yamac. Rampa: yukari kivrilan parabol. Duvar onu duz.
function zemin(x) {
  if (x <= 0) return PARKUR.ilkTepe;
  const b = bolumOf(x);
  if (x < b.bas) return 0;
  if (x <= b.yokusSon) return b.tepe * Math.pow(1 - (x - b.bas) / b.boy, 1.7);
  if (x <= b.rampaSon) { const t = (x - b.yokusSon) / PARKUR.rampaBoy; return PARKUR.rampaYuk * t * t; }
  if (x >= b.tumsekBas && x < b.tumsekSon) { const t = (x - b.tumsekBas) / b.tumsekBoy; return b.tumsekYuk * t * t; }
  return x >= b.duvar ? b.duvarH : 0;   // duvar kalinligi boyunca zemin duvarin tepesi
}
/* Egim parca parca analitik turevden. Eskiden merkezi farkla olculuyordu: rampa agzindaki
   basamagi (3.3 m -> 0) da icine alip her kalkista burnu bir kare -1.52 rad'a ceviriyordu. */
function zeminTurev(x) {
  if (x <= 0) return 0;
  const b = bolumOf(x);
  if (x < b.bas) return 0;
  if (x <= b.yokusSon) return -1.7 * b.tepe / b.boy * Math.pow(Math.max(0, 1 - (x - b.bas) / b.boy), 0.7);
  if (x <= b.rampaSon) return 2 * PARKUR.rampaYuk * (x - b.yokusSon) / (PARKUR.rampaBoy * PARKUR.rampaBoy);
  if (x >= b.tumsekBas && x < b.tumsekSon) return 2 * b.tumsekYuk * (x - b.tumsekBas) / (b.tumsekBoy * b.tumsekBoy);
  return 0;
}
const zeminEgim = x => Math.atan(zeminTurev(x));
/* Aci farkini +-pi araligina sar. Bu olmadan havada tur atan motorun egimi
   -9.9 rad oluyordu ve fark 9 cikip takla sayiliyordu. */
const sar = a => Math.atan2(Math.sin(a), Math.cos(a));

/* Degerler asamali parkur icin merdiven aramasiyla secildi (motor-ara2.js): duz surus
   yukseltmesiz 2x, 1. duvar ancak ust yukseltmelerle ya da iyi cizgiyle asilir. */
const MOTOR = { kuvvet: 160, cda: 0.62, mu: 0.021, enHiz: 78 };
const FREN = 9.0;        // bolgeye inisten sonra kayarken yavaslama (inis hiz kaybettirmedigi icin fren kaymayi belirliyor)
const YUKSELT = {
  motor: { ad: 'Motor', not: 'İtiş gücü +180 N', max: 5, fiyat: n => 90 * Math.pow(1.85, n) },
  aero:  { ad: 'Aerodinamik', not: 'Sürükleme %11 azalır', max: 5, fiyat: n => 110 * Math.pow(1.85, n) },
  rampa: { ad: 'Rampa açısı', not: 'Daha dik fırlatma', max: 3, fiyat: n => 240 * Math.pow(2.2, n) },
};
const AYAR = { motorAdim: 180, aeroCarpan: 0.89, rampaAdim: 0.16 };
const ayar = yuk => ({
  kuvvet: MOTOR.kuvvet + AYAR.motorAdim * (yuk.motor || 0),
  cda: MOTOR.cda * Math.pow(AYAR.aeroCarpan, yuk.aero || 0),
  rampaK: 1 + AYAR.rampaAdim * (yuk.rampa || 0),     // rampa cikis acisini buyuten carpan
});

/* Carpan: bitis bolgesi (2x..25x, duvara carpmak 25x) x kademe (asilan duvar + 1).
   Asilan her duvar o kademede 25x'e ulasilmis sayilir; sonuc ikisinin buyugu --
   yoksa duvari asip sonraki bolumde 2x'e dusmek, carpmaktan (25x) kotu olurdu. */
const KATLAR = BOLUMLER[0].katlar;
const TABAN = 10;
const bolgeKat = (b, x) => { let k = 0; for (const z of b.katlar) if (x >= z.d) k = z.k; return k; };
const katOf = x => bolgeKat(bolumOf(x), x);

/* Yanal surus: yol ~3 serit genisliginde ama serit kilidi yok. yon (-1..1) hedef
   yanal hizi verir; yanal hiz ona gecikmeyle yaklasir (atalet) ve yanal hizdaki
   her degisim ileri hizdan yer -- keskin savrulmanin bedeli. */
const YOL = { yari: 4.5, seritler: [-3, 0, 3], wMax: 6.5, tau: 0.22, kayip: 0.1, kenarFren: 1.5, carpY: 1.1 };

/* Toplanabilirler. iyi: true iyi, false kotu, null duruma gore. */
const TUR = {
  nitro: { iyi: true, dv: 3.6 },                      // aninda +hiz (m/s)
  turbo: { iyi: true, sarj: 1.2 },                    // turbo barina saniye; basili tutunca yanar
  aero:  { iyi: true, cdaK: 0.45 },                   // o kosu boyunca surukleme carpani (ucusta da)
  agir:  { iyi: null, dm: 110 },                      // kutle: ivmelenme duser, surukleme az isler; kotuler az yer, direksiyon agirlasir
  jeton: { iyi: null, kat: 2 },                       // coin carpani; hep kotu bir seyin ustunde durur
  camur: { iyi: false, boy: 7, gen: 2.6, fren: 3.0 }, // icindeyken yavaslama; hizli gecen daha kisa kalir, yavasta motoru durdurmaz
  kasis: { iyi: false, dv: 1.6, hava: 0.4, yuk: 0.45 },       // sabit hiz kaybi + ziplama (havada itis yok)
};
const TURBO = { kuvvet: 520, max: 3 };
const RAMPA_EN_AZ = 5;   // m/s
/* Havada donus: acisal hiz ivmelenir ve sonumlenir (aninda basla/dur robotik hissettiriyordu).
   Uc hiz ~ alfa/sonum = 3.5 rad/s, eskisiyle ayni. */
const HAVA = { alfa: 14, sonum: 4, yanOran: 0.5 };   // yanOran: havada yanal yonlendirme yerdekinin yarisi
/* Inis: yokusa inerken kayip ~0.3 sn'ye yayilir; sert iniste motor seker.
   Bolgeye (duz) iniste hiz kaybi yok -- kullanici istegi: akis tumsekle devam edebilsin. */
const INIS = { yayma: 0.3, sertZipla: 0.28, hedefOran: 0.08, ekYercekimiMax: 3 };
/* Karsilasma satirlari: her yokusta en fazla 5, yokusun sonuna dogru siklasir.
   Inis yokuslarinda motor ortalara konacagi icin satirlar biraz daha geride. */
const SATIR_ORAN = [[0.16, 0.36, 0.54, 0.7, 0.84], [0.3, 0.46, 0.6, 0.73, 0.85]];

function rastgele(seed) {   // mulberry32
  let s = (seed >>> 0) || 1;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
/* Her kosu yeni yerlesim. Kural: bir satirdan en fazla bir sey alinabilir (hepsi ayni x'te,
   seritler 3 m arali), ve her satirda ya iyi ile kotu yan yana durur ya da iki iyi arasinda
   secim vardir -- iyilerin hepsini toplayan tek bir cizgi yok. */
function yolUret(seed) {
  const r = rastgele(seed), L = YOL.seritler;
  const karis = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const kotu = () => r() < 0.5 ? 'camur' : 'kasis';
  const yol = [];
  const jetonBolum = r() < 0.45 ? Math.floor(r() * (BOLUMLER.length - 1)) : -1;   // kosu basina en fazla bir jeton (her yokusta olunca jeton avi baskin cikti)
  for (const b of BOLUMLER) {
    let jeton = b.i === jetonBolum;
    const koy = (tur, x, z, satir) => yol.push({ tur, x, z: z + (r() - 0.5) * 0.8, satir, bolum: b.i });
    SATIR_ORAN[b.i === 0 ? 0 : 1].forEach((f, i) => {
      const x = b.bas + f * b.boy + (r() - 0.5) * 2.5, iyi = karis(['nitro', 'turbo', 'aero', 'agir']);
      if (i < 2) {                                   // seyrek, affedici: iyi ile kotu yan yana, bir serit bos
        const a = Math.floor(r() * 3), c = a === 1 ? (r() < 0.5 ? 0 : 2) : 1;
        koy(iyi[0], x, L[a], i); koy(kotu(), x, L[c], i);
      } else if (i === 2 || (i === 4 && r() < 0.5)) { // iki iyi arasinda secim + bir kotu; seritler rastgele (sabit olunca "hep kenar" baskin cikti)
        const s = karis([0, 1, 2]);
        koy(iyi[0], x, L[s[0]], i); koy(kotu(), x, L[s[1]], i); koy(iyi[1], x, L[s[2]], i);
      } else {                                       // sikisik: bir iyi, iki kotu (biri jetonlu olabilir)
        const s = karis([0, 1, 2]), k1 = kotu(), k2 = kotu();
        koy(iyi[0], x, L[s[0]], i); koy(k1, x, L[s[1]], i); koy(k2, x, L[s[2]], i);
        if (jeton) { const o = yol[yol.length - 1]; yol.push({ tur: 'jeton', x: o.tur === 'kasis' ? x + 1.6 : x, z: o.z, satir: i, bolum: b.i }); jeton = false; }
      }
    });
  }
  return yol;
}

function yeniDurum(yuk, yol) {

    const a = -FZ.g * Math.sin(S.egim) + itis / S.m
            - 0.5 * FZ.rho * cda * S.v * S.v / S.m
            - MOTOR.mu * FZ.g * Math.cos(S.egim) * (S.v > 0.2 ? 1 : 0) - camurFren;

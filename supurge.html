<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Süpürge">
<title>Süpürge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&display=swap">
<style>
:root{
  --bg:#1B1714; --panel:rgba(30,25,21,.82); --line:rgba(255,236,214,.14);
  --ink:#FFF6EC; --ink-soft:#D9C8B6; --ink-dim:#9C8B7A;
  --vurgu:#FF7A59; --vurgu-dk:#2A0F07; --altin:#FFC94A; --ok:#6BD69A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
  display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);line-height:1.05}
.pill small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.pill b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.pill .u{font-size:11px;color:var(--ink-dim)}
.prog{flex:1;min-width:0}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--vurgu),var(--altin));
  transition:width .18s ease-out}
.pill.r{text-align:right}
.pill.warn b{color:#FF6B6B}
.pill.warn{animation:warnP .5s ease-in-out infinite alternate}
@keyframes warnP{to{border-color:rgba(255,107,107,.7)}}
/* çekişme barı: soldan mavi (sen), sağdan kırmızı (robot) */
.tugHead{display:flex;justify-content:space-between;align-items:baseline;gap:6px;line-height:1}
.tugHead .me{color:#7DBDFF;font-size:9px;font-weight:800;letter-spacing:.1em}
.tugHead .bot{color:#FF7B7B;font-size:9px;font-weight:800;letter-spacing:.1em}
.tugHead b{font-size:15px;letter-spacing:0}
.tugHead small{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
/* dövüş oyunu barı: iki taraf çizgilerle birbirine akar, kesişimde parlayan çarpışma ışığı + kıvılcım */
.tug{position:relative;height:15px;margin-top:5px}
.tugIn{position:absolute;inset:0;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 4px rgba(0,0,0,.35)}
.tug i{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-style:normal;font-size:9.5px;font-weight:800;
  color:rgba(255,255,255,.95);transition:filter .15s;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tug .b{left:0;width:50%;padding-left:6px;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.2) 0 5px,transparent 5px 13px),
  linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%),linear-gradient(90deg,#1F56B8,#4FA3FF);
  background-size:28px 100%,100% 100%,100% 100%;animation:stripeB .55s linear infinite}
.tug .r{right:0;width:50%;justify-content:flex-end;padding-right:6px;background-image:repeating-linear-gradient(65deg,rgba(255,255,255,.2) 0 5px,transparent 5px 13px),
  linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%),linear-gradient(270deg,#A8141E,#FF5A5A);
  background-size:28px 100%,100% 100%,100% 100%;animation:stripeR .55s linear infinite}
@keyframes stripeB{to{background-position:28px 0,0 0,0 0}}
@keyframes stripeR{to{background-position:-28px 0,0 0,0 0}}
.tug .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;margin-left:-.5px;background:rgba(255,255,255,.35);z-index:2}
.tug.fb .b,.tug.fr .r{filter:brightness(1.5) saturate(1.2)}
.clash{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;z-index:3}
.clash::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,#fff 0 14%,rgba(255,236,170,.95) 24%,rgba(255,190,80,.45) 46%,transparent 68%);
  animation:clashPulse .16s ease-in-out infinite alternate}
.clash b{position:absolute;left:50%;top:6px;bottom:6px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;
  box-shadow:0 0 6px #fff,-5px 0 12px #4FA3FF,5px 0 12px #FF5A5A}
.clash.hit::before{animation:clashHit .32s ease-out}
@keyframes clashPulse{from{transform:scale(.8);opacity:.8}to{transform:scale(1.1);opacity:1}}
@keyframes clashHit{0%{transform:scale(2.3);opacity:1}100%{transform:scale(1);opacity:.9}}
.spark{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff;pointer-events:none;z-index:4;
  box-shadow:0 0 6px 1px var(--c);animation:sparkFly .5s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes sparkFly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.tug.lead .tugIn::after{content:'';position:absolute;inset:0;background:#fff;animation:leadFlash .45s ease-out forwards}
@keyframes leadFlash{from{opacity:.85}to{opacity:0}}
.count{position:fixed;inset:0;display:grid;place-items:center;z-index:15;pointer-events:none}
.count span{font-size:110px;font-weight:800;color:var(--ink);text-shadow:0 8px 40px rgba(0,0,0,.6);animation:cnt .9s ease-out forwards}
.count span.go2{font-size:64px;color:var(--altin)}
@keyframes cnt{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:0}}
.stats .me b{color:#7DBDFF}.stats .bot b{color:#FF7B7B}
.pop.steal{color:#7DBDFF}.pop.rob{color:#FF7B7B}
.btn-ic{pointer-events:auto;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;display:grid;place-items:center}

/* başlık seçici — başparmak erişiminde */
.heads{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);
  display:flex;gap:8px;z-index:6;padding:6px;border-radius:18px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hd{appearance:none;border:1.5px solid transparent;background:rgba(255,255,255,.04);color:var(--ink-soft);
  width:70px;height:58px;border-radius:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font:inherit;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:0}
.hd svg{width:34px;height:22px;fill:currentColor}
.hd .k{font-size:8.5px;opacity:.5;font-weight:600}
.hd.on{border-color:var(--vurgu);background:rgba(255,122,89,.16);color:var(--ink)}
.hd:active{transform:scale(.95)}

.fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.pop{position:absolute;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6);white-space:nowrap;
  transform:translate(-50%,-50%);animation:popUp .8s ease-out forwards;color:var(--altin)}
@keyframes popUp{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}
  20%{transform:translate(-50%,-70%) scale(1.2);opacity:1}
  100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.arrow{position:absolute;left:0;top:0;width:0;height:0;border-left:16px solid var(--altin);
  border-top:9px solid transparent;border-bottom:9px solid transparent;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
  animation:arw .7s ease-in-out infinite alternate}
@keyframes arw{from{opacity:.55}to{opacity:1}}
/* yüzen joystick */
.stick{position:fixed;left:0;top:0;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;pointer-events:none;z-index:7;
  border:2.5px solid rgba(255,255,255,.75);background:radial-gradient(circle,rgba(20,14,10,.12),rgba(20,14,10,.32) 72%);
  box-shadow:0 0 0 1px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.25);
  opacity:0;transform:scale(.7);transition:opacity .12s,transform .12s}
.stick.on{opacity:1;transform:scale(1)}
.stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,#FFE3D0);border:2px solid rgba(255,122,89,.9);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);
  font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink);background:var(--panel);text-align:center;
  border:1px solid var(--line);padding:8px 14px;border-radius:20px;pointer-events:none;z-index:5;
  transition:opacity .4s;max-width:88vw}

.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;z-index:20;background:radial-gradient(circle at 50% 40%,rgba(40,30,24,.9),rgba(16,12,10,.97))}
#ovWin{background:radial-gradient(circle at 50% 42%,rgba(30,22,17,.78),rgba(16,12,10,.5) 75%)}
.ov h1{font-size:44px;margin:0 0 2px;font-weight:800;letter-spacing:-.02em}
.ov h2{font-size:32px;margin:0 0 4px;font-weight:800}
.ov p{margin:4px 0;color:var(--ink-soft);font-size:14px;max-width:320px;line-height:1.4}
.ov .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.go{appearance:none;border:0;background:var(--vurgu);color:var(--vurgu-dk);font:inherit;font-weight:800;
  font-size:17px;padding:14px 34px;border-radius:14px;margin-top:18px;cursor:pointer;
  box-shadow:0 8px 24px rgba(255,122,89,.35)}
.go:active{transform:scale(.97)}
.go.alt{background:transparent;color:var(--ink-soft);box-shadow:none;border:1px solid var(--line);font-size:14px;padding:10px 22px;margin-top:10px}
.stars{font-size:46px;letter-spacing:6px;margin:10px 0 6px}
.stars span{display:inline-block;color:rgba(255,255,255,.14);transform:scale(.4);transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .2s}
.stars span.on{color:var(--altin);transform:scale(1)}
.stats{display:flex;gap:10px;margin-top:6px}
.stats div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:84px}
.stats small{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.stats b{font-size:20px}
.err{color:#FF9C93}
[hidden]{display:none!important}
</style>

<div id="stage"></div>

<div class="hud" id="hud" hidden>
  <div class="pill" id="tmPill"><small id="lvName">Bölüm 1</small><b id="tm">90</b><span class="u"> sn</span></div>
  <div class="pill prog">
    <div class="tugHead"><span class="me">SEN <b id="scMe">0</b></span><small id="leftTxt">0 çöp</small><span class="bot"><b id="scBot">0</b> ROBOT</span></div>
    <div class="tug" id="tug"><div class="tugIn"><i class="b" id="tugB">50%</i><i class="r" id="tugR">50%</i></div>
      <span class="mid"></span><span class="clash" id="clash"><b></b></span></div></div>
  <div class="pill r"><small>Toz</small><b id="dustP">0</b><span class="u">%</span></div>
  <button class="btn-ic" id="btnRe" title="Yeniden başlat" aria-label="Yeniden başlat">↻</button>
</div>
<div class="fx" id="fx"></div>
<div class="hint" id="hint" hidden></div>
<div class="count" id="count" hidden></div>
<div class="stick" id="stick"><i id="knob"></i></div>
<div class="heads" id="heads" hidden>
  <button class="hd on" data-h="wide" aria-label="Geniş başlık"><svg viewBox="0 0 40 24"><rect x="3" y="8" width="34" height="9" rx="3"/></svg>Geniş<span class="k">1</span></button>
  <button class="hd" data-h="tri" aria-label="Üçgen başlık"><svg viewBox="0 0 40 24"><path d="M20 1.5 L33 22 L7 22Z"/></svg>Üçgen<span class="k">2</span></button>
  <button class="hd" data-h="slot" aria-label="Yarık başlık"><svg viewBox="0 0 40 24"><path d="M17.5 1 H22.5 L24 23 H16Z"/></svg>Yarık<span class="k">3</span></button>
</div>

<div class="ov" id="ovStart">
  <div class="sub">Dawnbright · prototip</div>
  <h1>Süpürge</h1>
  <p>90 saniye. Kırmızı robot süpürgeden daha çok çöp topla!</p>
  <p style="font-size:12px;color:var(--ink-dim)">Ağır olanlar direnir, ağzı üstlerinde tut. Köşeler için ▲ Üçgen, dar aralıklar için ▮ Yarık başlık.</p>
  <button class="go" id="btnStart">Başla</button>
  <p class="err" id="errMsg" hidden></p>
</div>

<div class="ov" id="ovWin" hidden>
  <div class="sub" id="winLv">Bölüm 1</div>
  <h2 id="winTitle">Kazandın!</h2>
  <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
  <div class="stats">
    <div class="me"><small>Sen</small><b id="wMe">0</b></div>
    <div class="bot"><small>Robot</small><b id="wBot">0</b></div>
    <div><small>Toz</small><b id="wDust">0%</b></div>
  </div>
  <p style="font-size:12px;color:var(--ink-dim);margin-top:12px" id="starHelp"></p>
  <button class="go" id="btnNext">Sonraki bölüm</button>
  <button class="go alt" id="btnAgain">Tekrar oyna</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   SÜPÜRGE — tatmin prototipi
   Ayarlar: CFG · başlıklar: HEADS · çöp tipleri: TYPES · bölümler: LEVELS
   ============================================================ */
const CFG = {
  nozzle:  { followK:14, accel:22, maxSpeed:8.5, turnRate:11, keySpeed:6, swapTime:0.28 },
  // yüzen joystick (px): parmağın değdiği yerde çıkar; radius'tan uzağa çekince merkez parmağı izler
  stick:   { radius:58, dead:8, curve:1.35 },
  suction: { strength:30, minForceK:1.6, maxItemSpeed:11, airDrag:2.2, floorDrag:7.5, yank:3.2, swirl:0.35,
             wedgeReach:0.17 },        // sıkışmış çöpe ağız çizgisinin bu kadar yaklaşması gerekir
  hose:    { segs:24, segLen:0.3, iters:8, beads:120, r:0.1, neckY:0.32, pulseSpeed:1.15, pulseW:0.03, skipNear:3 },
  canister:{ r:0.5, share:0.12, h:0.62 },
  bag:     { minScale:0.45, maxScale:1.0, wrinkle:0.2, stiffness:38, damping:6.5 },
  dust:    { texPerUnit:26, gridCell:0.2, alpha:0.52, starPct:40, stampStep:0.07 },
  props:   { massBase:1.2, massPerR:5, friction:3.2, bounce:0.35, kick:1.1, slow:0.1, tilt:0.07, clonkV:1.2 },  // itilebilen saksı/kova
  match:   { time:90, warnAt:10, countdown:3, dominate:0.65, bagShare:0.6 },
  // TODO: bölüme göre robotun hız/zekâ artışı — şimdilik tek standart ayar
  robot:   { r:0.36, speed:2.6, turnRate:3.4, mouthZ:0.16, suctionR:0.8, strength:17, capture:0.26, back:0.35,
             retarget:0.9, backup:0.35, giveUp:6, blacklist:12, playerAvoid:1.6, color:0xE5484D },
  grid:    { cell:0.5 },
  sleep:   { speed:0.03, time:0.3 },
  combo:   { window:0.42 },
  room:    { wallH:0.5, wallT:0.22, underH:0.3 },   // underH: koltuk altı boşluğu (ağız ve hortum girer, gövde girmez)
  cam:     { fov:34, pitchDeg:66, margin:0.95, viewW:5.4, viewD:8.8, follow:4.5, arrowsAt:10 },
  gravity: 22,
};

/* Başlıklar — yerel eksen: x sağ, z ileri. foot: taban çokgeni (toz izi + "altında" testi),
   mouth: emiş çizgisi [ax,az,bx,bz], probes: çarpışma daireleri [x,z,r], rear: boyun bağlantısı z'si.
   radius/strength: emiş alanı; back: arkadaki emiş oranı; cone: öne odaklanma (0 = her yöne);
   funnel: çöpleri ağız ortasına toplama; cap: yutulma mesafesi çarpanı */
const HEADS = {
  wide: { name:'Geniş', foot:[[-0.68,-0.21],[0.68,-0.21],[0.68,0.21],[-0.68,0.21]], mouth:[-0.48,0.04,0.48,0.04],
          probes:[[-0.44,0,0.36],[0,0,0.36],[0.44,0,0.36]], rear:-0.21, color:0xFF7A59,   // kalın tampon: duvar dibine giremez
          radius:1.5, strength:1.0, back:0.55, cone:0, funnel:0.55, cap:1.0, speed:1.0, turn:1.0 },
  tri:  { name:'Üçgen', foot:[[0,0.62],[0.46,-0.16],[-0.46,-0.16]], mouth:[0,0.2,0,0.5],
          probes:[[0,0.54,0.07],[-0.2,0.24,0.12],[0.2,0.24,0.12],[-0.3,-0.04,0.13],[0.3,-0.04,0.13],[0,0.08,0.15]],
          rear:-0.16, color:0x4FC3A1, radius:1.25, strength:1.15, back:0.5, cone:0.2, funnel:0.3, cap:0.9, speed:1.0, turn:1.1 },
  slot: { name:'Yarık', foot:[[-0.13,-0.2],[0.13,-0.2],[0.1,0.74],[-0.1,0.74]], mouth:[0,0.5,0,0.72],
          probes:[[0,-0.08,0.14],[0,0.2,0.13],[0,0.46,0.12],[0,0.65,0.1]], rear:-0.2, color:0x6C8CFF,
          radius:2.0, strength:1.55, back:0.2, cone:0.55, funnel:0, cap:0.8, speed:0.9, turn:0.85 },
};

/* Çöp tipleri. r: çarpışma yarıçapı, h: yükseklik (dinlenme y = h/2), mass: ağırlık,
   grip: tam emişte kopma süresi (sn, 0 = anında), lift: havalanma, capture: yutulma mesafesi,
   dur: yutulma animasyonu, drag: yer sürtünmesi (varsayılan CFG), big: ağız altına sığmaz */
const LEGO = [0xD9342B, 0x2F6FD6, 0xF2C21B, 0x2BA84A, 0xF5F5F5, 0xF57F20, 0x1E1E1E];
const TYPES = {
  crumb: { r:0.065,h:0.085,mass:0.10,grip:0,   lift:0.18,capture:0.28,dur:0.09,roll:true, snd:'crumb', colors:[0xE8A24A,0xD98B35,0xF2C06B,0xC4742A] },
  cereal:{ r:0.07, h:0.04, mass:0.12,grip:0,   lift:0.22,capture:0.28,dur:0.09,           snd:'crumb', colors:[0xE8A33B,0xD9534F,0x9B5DE5,0xF4C542,0x4CAF50] },
  popcorn:{r:0.08, h:0.12, mass:0.08,grip:0,   lift:0.35,capture:0.30,dur:0.10,roll:true, snd:'pop',   colors:[0xFFF4D6,0xF7E3A1,0xFFFBEA] },
  dust:  { r:0.13, h:0.16, mass:0.14,grip:0,   lift:0.28,capture:0.30,dur:0.12,roll:true, snd:'dust',  colors:[0xA9A29A,0x8F8880,0xBDB6AD] },
  leaf:  { r:0.17, h:0.03, mass:0.22,grip:0,   lift:0.55,capture:0.30,dur:0.14,flutter:1, snd:'leaf',  colors:[0xE0892E,0xC9562B,0xE8B33C,0x9A6B2A,0x7A8F3A] },
  twig:  { r:0.2,  h:0.05, mass:0.35,grip:0.08,lift:0.2, capture:0.32,dur:0.15,           snd:'twig',  colors:[0x6B4A2E,0x8A6440,0x5A3D24] },

  H.mx = (m[0] + m[2]) / 2; H.mz = (m[1] + m[3]) / 2; H.ux = m[2] - m[0]; H.uz = m[3] - m[1];
  H.len2 = Math.max(1e-6, H.ux * H.ux + H.uz * H.uz);
  // emiş tabanı: tabanın %75'i. Açılı dönen başlığın taban köşesi duvar dibini süpürmesin
  const cx = H.foot.reduce((a, p) => a + p[0], 0) / H.foot.length, cz = H.foot.reduce((a, p) => a + p[1], 0) / H.foot.length;
  H.suck = H.foot.map(p => [cx + (p[0] - cx) * 0.75, cz + (p[1] - cz) * 0.75]);
}

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c) { const t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO; return t; }
function radialTex(inner, outer) {
  const s = 128, c = makeCanvas(s, s), g = c.getContext('2d'), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer); g.fillStyle = gr; g.fillRect(0, 0, s, s); return new THREE.CanvasTexture(c);
}

function floorTexture(style, W, D, rnd) {
  const tw = 1024, th = Math.round(1024 * D / W), c = makeCanvas(tw, th), g = c.getContext('2d');
  const ppu = tw / W;   // piksel / birim
  const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16);
    const f = v => clamp(Math.round(v * k), 0, 255); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; };
  if (style === 'wood') {
    const pw = 0.5 * ppu;
    for (let x = 0; x < tw; x += pw) {
      let y = -rnd() * 3 * ppu;
      while (y < th) {
        const len = (1.6 + rnd() * 2.2) * ppu;
        g.fillStyle = shade('#C8925A', 0.86 + rnd() * 0.22); g.fillRect(x, y, pw, len);
        g.globalAlpha = 0.09; g.strokeStyle = '#5A3A1E'; g.lineWidth = 1;
        for (let k = 0; k < 7; k++) { const gx = x + rnd() * pw; g.beginPath(); g.moveTo(gx, y);
          g.bezierCurveTo(gx + (rnd() - .5) * 8, y + len * .3, gx + (rnd() - .5) * 8, y + len * .7, gx + (rnd() - .5) * 4, y + len); g.stroke(); }
        g.globalAlpha = 1; g.fillStyle = 'rgba(60,35,15,.55)'; g.fillRect(x, y, pw, 2); y += len;
      }
      g.fillStyle = 'rgba(60,35,15,.6)'; g.fillRect(x, 0, 2, th);
    }
  } else if (style === 'tile') {
    const ts = 0.7 * ppu;
    for (let y = 0, r = 0; y < th; y += ts, r++) for (let x = 0, q = 0; x < tw; x += ts, q++) {
      g.fillStyle = shade((r + q) % 2 ? '#EDE6DA' : '#C9BFAF', 0.96 + rnd() * 0.06); g.fillRect(x, y, ts, ts);
    }
    g.fillStyle = 'rgba(120,108,92,.55)';
    for (let y = 0; y < th; y += ts) g.fillRect(0, y - 1, tw, 2);
    for (let x = 0; x < tw; x += ts) g.fillRect(x - 1, 0, 2, th);
  } else {
    const bw = 0.42 * ppu;
    for (let y = 0; y < th; y += bw) {
      g.fillStyle = shade('#9C7B5B', 0.85 + rnd() * 0.25); g.fillRect(0, y, tw, bw);
      g.globalAlpha = 0.08; g.strokeStyle = '#3A2816';
      for (let k = 0; k < 6; k++) { const gy = y + rnd() * bw; g.beginPath(); g.moveTo(0, gy); g.lineTo(tw, gy + (rnd() - .5) * 6); g.stroke(); }
      g.globalAlpha = 1; g.fillStyle = 'rgba(30,20,10,.75)'; g.fillRect(0, y, tw, 3);
      g.fillStyle = 'rgba(40,40,40,.5)';
      for (let x = 0.3 * ppu; x < tw; x += 1.2 * ppu) { g.fillRect(x, y + 5, 3, 3); g.fillRect(x, y + bw - 8, 3, 3); }
    }
  }
  for (let i = 0; i < 12000; i++) { g.fillStyle = rnd() < .5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.05)';
    g.fillRect(rnd() * tw, rnd() * th, 1.5, 1.5); }
  return canvasTex(c);
}

function rugTexture(col) {
  const s = 256, c = makeCanvas(s, s), g = c.getContext('2d');
  g.fillStyle = col; g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,230,200,.55)'; g.lineWidth = 6;
  [0.86, 0.62, 0.36].forEach(k => { g.beginPath(); g.arc(s / 2, s / 2, s / 2 * k, 0, TAU); g.stroke(); });
  g.fillStyle = 'rgba(255,230,200,.35)';
  for (let a = 0; a < TAU; a += TAU / 16) { g.beginPath(); g.arc(s / 2 + Math.cos(a) * s * .37, s / 2 + Math.sin(a) * s * .37, 7, 0, TAU); g.fill(); }
  return canvasTex(c);
}

/* ---------------- TOZ KATMANI: başlık geçtikçe kendi şeklinde silinir ---------------- */
const Dust = {
  cv: null, g: null, tex: null, mesh: null, W: 0, D: 0, sx: 1, sy: 1,
  cols: 0, rows: 0, grid: null, total: 0, clean: 0, dirty: false,
  build(L, rnd, colliders) {
    this.W = L.W; this.D = L.D;
    const tw = Math.round(L.W * CFG.dust.texPerUnit), th = Math.round(L.D * CFG.dust.texPerUnit);
    this.cv = makeCanvas(tw, th); this.g = this.cv.getContext('2d'); const g = this.g;
    this.sx = tw / L.W; this.sy = th / L.D;
    g.fillStyle = `rgba(104,94,82,${CFG.dust.alpha})`; g.fillRect(0, 0, tw, th);
    for (let i = 0; i < 16; i++) {   // lekeli, düzensiz kirlilik
      const x = rnd() * tw, y = rnd() * th, r = (0.15 + rnd() * 0.25) * tw;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(95,82,68,.28)'); gr.addColorStop(1, 'rgba(95,82,68,0)'); g.fillStyle = gr; g.fillRect(0, 0, tw, th);
    }
    // duvar dibi ve köşeler daha kirli: geniş başlığın ulaşamadığı yerler göze batsın
    const band = 0.45 * this.sx;
    [[0, 0, band, 0], [tw, 0, tw - band, 0], [0, 0, 0, band], [0, th, 0, th - band]].forEach(([x0, y0, x1, y1]) => {
      const gr = g.createLinearGradient(x0, y0, x1, y1);
      gr.addColorStop(0, 'rgba(80,70,58,.45)'); gr.addColorStop(1, 'rgba(80,70,58,0)'); g.fillStyle = gr; g.fillRect(0, 0, tw, th);
    });
    for (const [cx, cy] of [[0, 0], [tw, 0], [0, th], [tw, th]]) {
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, 0.9 * this.sx);
      gr.addColorStop(0, 'rgba(70,60,50,.55)'); gr.addColorStop(1, 'rgba(70,60,50,0)'); g.fillStyle = gr; g.fillRect(0, 0, tw, th);
    }
    for (let i = 0; i < tw * th / 40; i++) { g.fillStyle = rnd() < .6 ? 'rgba(70,60,50,.35)' : 'rgba(210,200,185,.3)';
      g.fillRect(rnd() * tw, rnd() * th, 1 + rnd() * 1.4, 1 + rnd() * 1.4); }
    g.strokeStyle = 'rgba(190,180,170,.4)'; g.lineWidth = 0.8;
    for (let i = 0; i < L.W * L.D * 1.5; i++) { const x = rnd() * tw, y = rnd() * th; g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + (rnd() - .5) * 12, y + (rnd() - .5) * 12, x + (rnd() - .5) * 16, y + (rnd() - .5) * 16); g.stroke(); }
    this.tex = canvasTex(this.cv);
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(L.W, L.D),
      new THREE.MeshLambertMaterial({ map: this.tex, transparent: true, depthWrite: false }));
    this.mesh.rotation.x = -PI / 2; this.mesh.position.y = 0.004; this.mesh.receiveShadow = true; this.mesh.renderOrder = 1;
    // ilerleme ızgarası — katı engellerin altı sayılmaz (koltuk altı sayılır)
    const cs = CFG.dust.gridCell;
    this.cols = Math.ceil(L.W / cs); this.rows = Math.ceil(L.D / cs);
    this.grid = new Uint8Array(this.cols * this.rows); this.total = 0; this.clean = 0;
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      const x = -L.W / 2 + (c + .5) * cs, z = -L.D / 2 + (r + .5) * cs;
      const blocked = colliders.some(o => !o.tall && !o.dyn && (o.t === 'box'
        ? Math.abs(x - o.x) < o.hw + 0.1 && Math.abs(z - o.z) < o.hd + 0.1
        : Math.hypot(x - o.x, z - o.z) < o.r + 0.1));
      if (blocked) this.grid[r * this.cols + c] = 2; else this.total++;
    }
    return this.mesh;
  },
  stamp(x, z, yaw, H) {
    const g = this.g, poly = H.foot;
    g.globalCompositeOperation = 'destination-out';
    g.setTransform(this.sx, 0, 0, this.sy, (x + this.W / 2) * this.sx, (z + this.D / 2) * this.sy);
    g.rotate(-yaw);
    g.beginPath(); poly.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
    g.globalAlpha = 0.5; g.lineWidth = 0.08; g.stroke(); g.globalAlpha = 1; g.fill();
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over';
    this.dirty = true;
    const cs = CFG.dust.gridCell, cy = Math.cos(yaw), sy = Math.sin(yaw), R = H.reach + cs;
    const c0 = Math.max(0, Math.floor((x - R + this.W / 2) / cs)), c1 = Math.min(this.cols - 1, Math.floor((x + R + this.W / 2) / cs));
    const r0 = Math.max(0, Math.floor((z - R + this.D / 2) / cs)), r1 = Math.min(this.rows - 1, Math.floor((z + R + this.D / 2) / cs));
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const i = r * this.cols + c; if (this.grid[i]) continue;
      const dx = -this.W / 2 + (c + .5) * cs - x, dz = -this.D / 2 + (r + .5) * cs - z;
      if (inPoly(poly, dx * cy - dz * sy, dx * sy + dz * cy)) { this.grid[i] = 1; this.clean++; }
    }
  },
  flush() { if (this.dirty) { this.tex.needsUpdate = true; this.dirty = false; } },
  pct() { return this.total ? Math.round(this.clean / this.total * 100) : 100; },
};

/* ---------------- ODA + ENGELLER ---------------- */
/* colliders: {t:'cyl'|'box', x, z, r | hw,hd, tall} — tall: sadece yüksek gövdeleri (elektrikli süpürge gövdesi) durdurur,
   ağız, hortum ve çöpler altından geçer. fades: ağız altına girince yarı saydamlaşan mobilyalar */
const World = { group: null, colliders: [], fades: [], props: [], W: 11, D: 18 };
const std = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0 }, o || {}));
const fadeMat = (color, o) => std(color, Object.assign({ transparent: true }, o || {}));
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function addMesh(parent, geo, mat, x, y, z, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv; parent.add(m); return m;
}
function disposeTree(o) {
  o.traverse(n => { if (n.geometry) n.geometry.dispose();
    if (n.material) [].concat(n.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); });
}
function addLegs(G, col, x, z, w, d, h, r, inset, mat) {
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const lx = x + sx * (w / 2 - inset), lz = z + sz * (d / 2 - inset);
    addMesh(G, new THREE.CylinderGeometry(r, r * 0.8, h, 10), mat, lx, h / 2, lz);
    col.push({ t: 'cyl', x: lx, z: lz, r: r + 0.03 });
  }
}
function underObstacle(col, o, w, d, mats) {
  col.push({ t: 'box', x: o.x, z: o.z, hw: w / 2, hd: d / 2, tall: true });
  World.fades.push({ x: o.x, z: o.z, hw: w / 2 + 0.2, hd: d / 2 + 0.2, mats, op: 1 });
}
const plantM = () => [std(0x4E9A4A, { roughness: .8 }), std(0x3E7F3C, { roughness: .8 }), std(0x67B35A, { roughness: .8 })];

function buildObstacle(G, o, col, rnd) {
  const U = CFG.room.underH, wood = std(0x3B2A1E, { roughness: 0.6 });
  switch (o.k) {
    case 'couch': case 'armchair': {
      const m = fadeMat(o.c, { roughness: 0.95 }), m2 = fadeMat(new THREE.Color(o.c).offsetHSL(0, 0, 0.07).getHex(), { roughness: 1 });
      addLegs(G, col, o.x, o.z, o.w, o.d, U, 0.05, 0.15, wood);
      addMesh(G, box(o.w, 0.3, o.d), m, o.x, U + 0.15, o.z);
      addMesh(G, box(o.w, 0.52, 0.28), m, o.x, U + 0.56, o.z - o.d / 2 + 0.14);
      for (const s of [-1, 1]) addMesh(G, box(0.28, 0.44, o.d), m, o.x + s * (o.w / 2 - 0.14), U + 0.3, o.z);
      const n = o.w > 2.5 ? 3 : 1, cw = (o.w - 0.56) / n;
      for (let i = 0; i < n; i++) addMesh(G, box(cw - 0.05, 0.13, o.d - 0.36), m2, o.x - o.w / 2 + 0.28 + cw * (i + .5), U + 0.36, o.z + 0.13);
      underObstacle(col, o, o.w, o.d, [m, m2]); break;
    }
    case 'ctable': {
      const m = fadeMat(o.c, { roughness: 0.5 });
      addLegs(G, col, o.x, o.z, o.w, o.d, o.h, 0.04, 0.1, wood);
      addMesh(G, box(o.w, 0.06, o.d), m, o.x, o.h, o.z);
      underObstacle(col, o, o.w, o.d, [m]); break;
    }
    case 'chair': {
      const m = fadeMat(0x9B6B43, { roughness: 0.6 }), s = 0.6;
      addLegs(G, col, o.x, o.z, s, s, 0.45, 0.03, 0.06, wood);
      addMesh(G, box(s, 0.05, s), m, o.x, 0.47, o.z);
      const bx = { n: [0, -1], s: [0, 1], w: [-1, 0], e: [1, 0] }[o.rot || 'n'];
      addMesh(G, bx[0] ? box(0.05, 0.5, s) : box(s, 0.5, 0.05), m, o.x + bx[0] * (s / 2 - 0.03), 0.74, o.z + bx[1] * (s / 2 - 0.03));
      underObstacle(col, { x: o.x, z: o.z }, s, s, [m]); break;
    }
    case 'bench': {
      const m = fadeMat(o.c, { roughness: 0.85 });
      addLegs(G, col, o.x, o.z, o.w, o.d, o.h, 0.05, 0.15, wood);
      for (let i = 0; i < 4; i++) addMesh(G, box(o.w, 0.06, o.d / 4 - 0.04), m, o.x, o.h, o.z - o.d / 2 + o.d / 8 + i * o.d / 4);
      underObstacle(col, o, o.w, o.d, [m]); break;
    }
    case 'table': {
      const legM = std(0x3A3A3A, { metalness: 0.6, roughness: 0.35 });
      addLegs(G, col, o.x, o.z, o.w, o.d, o.h, 0.045, 0.12, legM);
      const glass = addMesh(G, box(o.w, 0.04, o.d), new THREE.MeshStandardMaterial({ color: 0xBFE3E8, transparent: true,
        opacity: 0.2, roughness: 0.05, metalness: 0.1, depthWrite: false }), o.x, o.h, o.z, false, false);
      glass.renderOrder = 5;
      col.push({ t: 'box', x: o.x, z: o.z, hw: o.w / 2, hd: o.d / 2, tall: true }); break;
    }
    case 'tv': {
      addMesh(G, box(o.w, o.h, o.d), std(o.c, { roughness: 0.6 }), o.x, o.h / 2, o.z);
      addMesh(G, box(0.07, 1.1, o.d * 0.85), std(0x111418, { roughness: 0.25, metalness: 0.4 }), o.x, o.h + 0.56, o.z);
      col.push({ t: 'box', x: o.x, z: o.z, hw: o.w / 2, hd: o.d / 2 }); break;
    }
    case 'shelf': {
      addMesh(G, box(o.w, o.h, o.d), std(o.c, { roughness: 0.7 }), o.x, o.h / 2, o.z);
      const fx = o.x - o.w / 2 - 0.04;
      for (const y of [0.1, 0.62, 1.14]) {
        let z = o.z - o.d / 2 + 0.08;
        while (z < o.z + o.d / 2 - 0.12) {
          const bw = 0.07 + rnd() * 0.07, bh = 0.3 + rnd() * 0.14;
          addMesh(G, box(0.1, bh, bw), std(new THREE.Color().setHSL(rnd(), 0.45, 0.45).getHex(), { roughness: 0.8 }), fx, y + bh / 2, z + bw / 2, false);
          z += bw + 0.01;
        }
      }
      col.push({ t: 'box', x: o.x - 0.05, z: o.z, hw: o.w / 2 + 0.05, hd: o.d / 2 }); break;
    }
    case 'counter': case 'island': {
      addMesh(G, box(o.w, o.h, o.d), std(o.c), o.x, o.h / 2, o.z);
      addMesh(G, box(o.w + 0.06, 0.06, o.d + 0.08), std(0x6B5B4E, { roughness: 0.4 }), o.x, o.h + 0.03, o.z + (o.k === 'counter' ? 0.04 : 0));
      if (o.k === 'counter') for (let x = -o.w / 2 + 0.9; x < o.w / 2; x += 0.9)
        addMesh(G, box(0.02, o.h * 0.8, 0.01), std(0xB9AE9E), o.x + x, o.h * 0.45, o.z + o.d / 2 + 0.005, false);
      col.push({ t: 'box', x: o.x, z: o.z + (o.k === 'counter' ? 0.02 : 0), hw: o.w / 2 + 0.03, hd: o.d / 2 + 0.04 }); break;
    }
    case 'fridge': {
      addMesh(G, box(o.w, o.h, o.d), std(o.c, { roughness: 0.3 }), o.x, o.h / 2, o.z);
      addMesh(G, box(o.w * 0.98, 0.02, 0.01), std(0x9AA3AB), o.x, o.h * 0.66, o.z + o.d / 2 + 0.005, false);
      addMesh(G, box(0.04, 0.5, 0.05), std(0x9AA3AB, { metalness: 0.6 }), o.x - o.w / 2 + 0.15, o.h * 0.45, o.z + o.d / 2 + 0.03, false);
      col.push({ t: 'box', x: o.x, z: o.z, hw: o.w / 2, hd: o.d / 2 + 0.05 }); break;
    }
    case 'planter': {
      addMesh(G, box(o.w, o.h, o.d), std(o.c, { roughness: 0.85 }), o.x, o.h / 2, o.z);
      addMesh(G, box(o.w - 0.1, 0.02, o.d - 0.1), std(0x3B2A1E, { roughness: 1 }), o.x, o.h + 0.01, o.z, false);
      const pm = plantM();
      for (let z = o.z - o.d / 2 + 0.35; z < o.z + o.d / 2 - 0.2; z += 0.45)
        addMesh(G, new THREE.IcosahedronGeometry(0.2 + rnd() * 0.12, 0), pm[Math.floor(rnd() * 3)], o.x + (rnd() - .5) * 0.3, o.h + 0.2 + rnd() * 0.15, z);
      col.push({ t: 'box', x: o.x, z: o.z, hw: o.w / 2, hd: o.d / 2 }); break;
    }
    case 'bin': case 'pot': {   // itilebilen eşya: kendi grubunda, çarpışma dairesi onunla birlikte hareket eder
      const P = new THREE.Group(); P.position.set(o.x, 0, o.z); G.add(P);
      const tilt = new THREE.Group(); P.add(tilt);
      if (o.k === 'bin') {
        addMesh(tilt, new THREE.CylinderGeometry(o.r, o.r * 0.88, 0.7, 20, 1, true), std(o.c, { roughness: 0.4, metalness: 0.5, side: THREE.DoubleSide }), 0, 0.35, 0);
        addMesh(tilt, new THREE.CircleGeometry(o.r * 0.95, 20), std(0x222222), 0, 0.45, 0, false).rotation.x = -PI / 2;
      } else {
        const h = o.r * 1.4;
        addMesh(tilt, new THREE.CylinderGeometry(o.r, o.r * 0.78, h, 22), std(o.c, { roughness: 0.8 }), 0, h / 2, 0);
        addMesh(tilt, new THREE.CylinderGeometry(o.r * 1.07, o.r * 1.07, 0.08, 22), std(new THREE.Color(o.c).offsetHSL(0, 0, -0.05).getHex()), 0, h, 0);
        const pm = plantM();

      sw: rnd() < 0.5 ? -1 : 1, spin: new V3(rnd() - .5, rnd() - .5, rnd() - .5).normalize(), spinV: 0, tickT: 0,

/* yerdeki çöpler birbirini iter. all: hepsini uyanık say (başlangıç gevşetmesi) */
function separate(all) {

  for (let i = 0; i < L.length; i++) {
    const a = L[i]; if (a.st >= 2 || a.T.flutter || !(all || a.awake)) continue;
    const c0 = gcx(a.x), r0 = gcz(a.z);
    for (let r = Math.max(0, r0 - 1); r <= Math.min(Grid.rows - 1, r0 + 1); r++)
      for (let c = Math.max(0, c0 - 1); c <= Math.min(cols - 1, c0 + 1); c++) {
        for (let j = head[r * cols + c]; j >= 0; j = next[j]) {

    const c0 = gcx(hx), r0 = gcz(hz), span = h === N - 1 ? 2 : 1;

      for (let c = Math.max(0, c0 - span); c <= Math.min(cols - 1, c0 + span); c++)
        for (let j = head[r * cols + c]; j >= 0; j = next[j]) {
          const it = L[j]; if (it.st >= 2 || it.wedge) continue;   // sıkışmış çöp hortumla kurtulmaz
          const dx = it.x - hx, dz = it.z - hz, m = R + it.T.r * 0.7, d2 = dx * dx + dz * dz;

const _qs = new THREE.Quaternion(), _ax = new V3(), _po = { x: 0, z: 0, hit: false };
function updateItems(dt, now) {
  const S = CFG.suction, H = Noz.H, m = H.mouth, reach = H.radius + 0.6;
  const cy = Math.cos(Noz.yaw), sy = Math.sin(Noz.yaw), baseF = S.strength * H.strength;
  const RC = CFG.robot, robotOn = state === 'play', RR = RC.suctionR + 0.3, rfx = Math.sin(Robot.yaw), rfz = Math.cos(Robot.yaw);
  let strain = 0, load = 0;
  for (const it of Items.list) {
    if (it.st === 3) continue;
    if (it.st === 2) { updateGulp(it, dt, now); continue; }
    const T = it.T, dx = it.x - Noz.x, dz = it.z - Noz.z;
    const near = robotOn && Math.abs(dx) < reach && Math.abs(dz) < reach;   // maç dışında emiş yok
    const nearR = robotOn && Math.abs(it.x - Robot.mx) < RR && Math.abs(it.z - Robot.mz) < RR;

  Cam.dist = lerp(Cam.dist, over ? Cam.overDist : Cam.playDist, dt ? 1 - Math.exp(-2.2 * dt) : 1);
  const tx = over ? 0 : clamp(Noz.x, -Cam.xMax, Cam.xMax), tz = over ? Cam.z0 : clamp(Noz.z, Cam.zMin, Cam.zMax);
  Cam.cx = lerp(Cam.cx, tx, k); Cam.cz = lerp(Cam.cz, tz, k);

  camera.position.copy(_cc).addScaledVector(Cam.dir, -Cam.dist); camera.lookAt(_cc);

addEventListener('resize', () => { fitCamera(); });

/* ---------------- HUD + AKIŞ ---------------- */
const $ = id => document.getElementById(id);
const HUD = { dirty: true, dustDirty: true, dustT: 0, lastSec: -1, ft: {},
  update(dt) {
    const rem = Math.max(0, CFG.match.time - levelTime), sec = Math.ceil(rem);
    if (sec !== this.lastSec) {   // geri sayım; son saniyelerde kırmızı + bip
      this.lastSec = sec; $('tm').textContent = sec;
      const warn = state === 'play' && rem <= CFG.match.warnAt;
      $('tmPill').classList.toggle('warn', warn); if (warn && sec > 0) SFX.beep(false);
    }
    if (this.dirty) {   // çekişme barı: kim daha çok topladıysa sınır o tarafa kayar
      this.dirty = false;
      const me = Items.me, bot = Robot.count, tot = me + bot, share = tot ? me / tot : 0.5, pm = Math.round(share * 100);
      $('scMe').textContent = me; $('scBot').textContent = bot; $('leftTxt').textContent = Items.left + ' çöp';
      $('tugB').textContent = pm >= 12 ? pm + '%' : ''; $('tugR').textContent = pm <= 88 ? (100 - pm) + '%' : '';
      Tug.target = share;
    }
    if (this.dustDirty && (this.dustT -= dt) <= 0) { this.dustT = 0.2; this.dustDirty = false; $('dustP').textContent = Dust.pct(); }
  },
  flash(side) {
    const el = $('tug'), c = side === 'b' ? 'fb' : 'fr';
    el.classList.add(c); clearTimeout(this.ft[c]); this.ft[c] = setTimeout(() => el.classList.remove(c), 140);
    Tug.shove(side);
  } };

/* çekişme barı: yaylı sınır (taşar, geri teper), mücadele titremesi, yutuşta itme + kıvılcım, lider değişince parlama */
const Tug = { share: 0.5, v: 0, target: 0.5, lead: 0, lastSpark: 0,
  reset() { this.share = this.target = 0.5; this.v = 0; this.lead = 0; },
  shove(side) {
    this.v += side === 'b' ? 0.9 : -0.9;   // atan taraf sınırı karşıya iter
    const now = performance.now(); if (now - this.lastSpark < 70) return; this.lastSpark = now;
    const cl = $('clash'); cl.classList.remove('hit'); void cl.offsetWidth; cl.classList.add('hit');
    const tug = $('tug'), col = side === 'b' ? '#6FB6FF' : '#FF6B6B', dir = side === 'b' ? 1 : -1;
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('span'); s.className = 'spark';
      s.style.left = cl.style.left || '50%';
      s.style.setProperty('--c', col);
      s.style.setProperty('--dx', (dir * (10 + Math.random() * 26)) + 'px');
      s.style.setProperty('--dy', ((Math.random() - 0.5) * 34) + 'px');
      tug.appendChild(s); setTimeout(() => s.remove(), 520);
    }
  },
  update(dt, now) {
    this.v += ((this.target - this.share) * 160 - this.v * 11) * dt; this.share += this.v * dt;
    const fight = state === 'play' ? Math.sin(now * 23) * 0.004 + Math.sin(now * 41) * 0.003 : 0;   // mücadele titremesi
    const d = clamp(this.share + fight, 0.03, 0.97);
    $('tugB').style.width = d * 100 + '%'; $('tugR').style.width = (1 - d) * 100 + '%'; $('clash').style.left = d * 100 + '%';
    const lead = this.target > 0.52 ? 1 : this.target < 0.48 ? -1 : 0;
    if (lead && lead !== this.lead) {   // önde olan değişti
      const t = $('tug'); t.classList.remove('lead'); void t.offsetWidth; t.classList.add('lead');
    }
    if (lead) this.lead = lead;
  } };

let state = 'menu', levelIdx = 0, levelTime = 0, firstHint = true, countT = 0, lastCount = -1;
function loadLevel(i) {
  levelIdx = i % LEVELS.length; const L = LEVELS[levelIdx];
  L.start = L.start || [0, L.D / 2 - 1.8];
  const rnd = mulberry(L.seed);
  buildRoom(L, rnd);
  Noz.heads[Noz.H.key].visible = false; Noz.H = HEADS.wide; Noz.heads.wide.visible = true; Noz.swapT = 1; Noz.pendingHead = null;
  document.querySelectorAll('.hd').forEach(b => b.classList.toggle('on', b.dataset.h === 'wide'));
  Noz.x = Noz.tx = Noz.sx = L.start[0]; Noz.z = Noz.tz = Noz.sz = L.start[1];
  Noz.vx = Noz.vz = Noz.speed = 0; Noz.yaw = Noz.syaw = PI; Noz.strain = Noz.load = 0;
  resetHose(); spawnItems(L, rnd); buildNav(); resetRobot(L);
  Bag.fill = Bag.target = Bag.vel = 0; Bag.drawn = -1;
  levelTime = 0; HUD.dirty = HUD.dustDirty = true; HUD.dustT = 0; HUD.lastSec = -1; Tug.reset();
  $('lvName').textContent = `Bölüm ${levelIdx + 1} · ${L.name}`; $('tmPill').classList.remove('warn');
  fitCamera();
}
function startPlay() {
  SFX.init(); $('ovStart').hidden = true; $('ovWin').hidden = true; $('hud').hidden = false; $('heads').hidden = false;
  state = 'count'; countT = CFG.match.countdown; lastCount = -1; firstHint = true; placeCam(0); hideHint();
}
function showCount(txt, big) {
  const el = $('count'); el.hidden = false;
  el.innerHTML = `<span class="${big ? 'go2' : ''}">${txt}</span>`;
}
function beginMatch(now) {   // geri sayım bitti: ikisi aynı anda başlar
  state = 'play'; Items.lastGulp = now; idleHintAt = now + 15;
  setTimeout(() => $('count').hidden = true, 900);
  showHint('Ekrana dokun ve çek · başlığı alttan değiştir', 0);
}
function endMatch() {
  state = 'won'; stickRelease(); const L = LEVELS[levelIdx], dp = Dust.pct();
  const me = Items.me, bot = Robot.count, tot = me + bot, share = tot ? me / tot : 0.5, win = me > bot;
  const got = [win, dp >= CFG.dust.starPct, win && share >= CFG.match.dominate];   // her yıldız kendi koşuluna bağlı
  $('winLv').textContent = `Bölüm ${levelIdx + 1} · ${L.name}`;
  $('winTitle').textContent = win ? 'Kazandın!' : me === bot ? 'Berabere!' : 'Robot kazandı!';
  $('wMe').textContent = me; $('wBot').textContent = bot; $('wDust').textContent = dp + '%';
  $('starHelp').textContent = `★ kazan · ★ toz %${CFG.dust.starPct}+ · ★ %${Math.round(CFG.match.dominate * 100)} pay  —  en iyi seri x${Items.bestCombo}`;
  $('stars').hidden = !win;
  $('btnNext').textContent = win ? 'Sonraki bölüm' : 'Yine de geç'; $('btnNext').className = win ? 'go' : 'go alt';
  $('btnAgain').textContent = win ? 'Tekrar oyna' : 'Tekrar dene'; $('btnAgain').className = win ? 'go alt' : 'go';
  $('btnNext').style.order = 5; $('btnAgain').style.order = win ? 6 : 4;   // ana buton üstte
  const st = [...$('stars').children]; st.forEach(s => s.classList.remove('on'));
  hideHint(); $('heads').hidden = true; $('tmPill').classList.remove('warn');
  if (win) SFX.win(); else SFX.lose();
  // önce kamera geri çekilip temiz odayı göstersin, sonra perde
  setTimeout(() => {
    if (state !== 'won') return;
    $('ovWin').hidden = false;
    st.forEach((s, i) => { if (got[i]) setTimeout(() => { s.classList.add('on'); buzz(12); }, 300 + i * 260); });
  }, 1400);
}
$('btnStart').onclick = startPlay;
$('btnNext').onclick = () => { loadLevel(levelIdx + 1); startPlay(); };
$('btnAgain').onclick = () => { loadLevel(levelIdx); startPlay(); };
$('btnRe').onclick = () => { loadLevel(levelIdx); startPlay(); };

/* ---------------- ANA DÖNGÜ ---------------- */
buildNozzle(); buildCanister(); buildHose(); buildRobot(); buildFx();
loadLevel(0);
const _cyan = new THREE.Color(0x7FF3FF), _warn = new THREE.Color(0xFF9A3C);
function stepSim(dt, now) {
  if (state === 'play') { updateNozzle(dt); updateRobot(dt, now); }
  updateProps(dt); updateHose(dt); if (state !== 'menu') updateItems(dt, now);
}
function drawFrame(dtAll, now) {
  updateFx(dtAll); updateFades(dtAll); updateBag(dtAll);
  // yaylar: ağız şişmesi, gövde zıplaması, başlık değişim zıplaması, sarsıntı
  Noz.bumpV += (-Noz.bump * 260 - Noz.bumpV * 16) * dtAll; Noz.bump += Noz.bumpV * dtAll;
  Can.wobV += (-Can.wob * 140 - Can.wobV * 9) * dtAll; Can.wob += Can.wobV * dtAll;
  const b = clamp(Noz.bump, -0.6, 1.2), tr = Noz.strain, sw = Noz.swapT < 1 ? Math.sin(Noz.swapT * PI) : 0;
  const head = Noz.heads[Noz.H.key], ud = head.userData;
  Noz.g.position.set(Noz.x, sw * 0.12, Noz.z); Noz.g.rotation.y = Noz.yaw;
  head.scale.set((1 + b * 0.05) * (1 - sw * 0.35), (1 + b * 0.16) * (1 - sw * 0.2), (1 + b * 0.05) * (1 - sw * 0.35));
  head.position.set((Math.random() - .5) * 0.018 * tr, 0, (Math.random() - .5) * 0.018 * tr);
  ud.led.color.copy(_cyan).lerp(_warn, clamp(tr, 0, 1));
  ud.glowM.opacity = 0.07 + Noz.load * 0.1 + Math.sin(now * 9) * 0.01;
  renderHose(); renderRobot(dtAll); renderProps(dtAll); renderItems(); Dust.flush(); HUD.update(dtAll); Tug.update(dtAll, now);
  SFX.setMotor(state === 'play', Noz.speed, tr, Noz.load, Noz.H.key === 'slot' ? 1.35 : Noz.H.key === 'tri' ? 1.12 : 1);
  Noz.shake *= Math.exp(-9 * dtAll);
  placeCam(dtAll); updateArrows();
  if (Noz.shake > 0.002) camera.position.add(_v.set((Math.random() - .5) * Noz.shake, (Math.random() - .5) * Noz.shake, 0));
  renderer.render(scene, camera);
}
let lastT = performance.now();
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000, dtAll = Math.min(0.05, (nowMs - lastT) / 1000); lastT = nowMs;
  const sub = Math.max(1, Math.ceil(dtAll / 0.0167)), dt = dtAll / sub;
  for (let i = 0; i < sub; i++) stepSim(dt, now);
  if (state === 'count') {   // 3-2-1-SÜPÜR!
    countT -= dtAll; const n = Math.ceil(countT);
    if (n !== lastCount) { lastCount = n; showCount(n > 0 ? n : 'SÜPÜR!', n <= 0); SFX.beep(n <= 0); }
    if (countT <= 0) beginMatch(now);
  } else if (state === 'play') {
    levelTime += dtAll; idleHint(now);
    if (levelTime >= CFG.match.time || Items.left === 0) endMatch();
  }
  drawFrame(dtAll, now);
}
requestAnimationFrame(frame);
</script>

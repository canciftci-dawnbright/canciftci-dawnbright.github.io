(function () {

  var dugme = '<button class="btn" style="margin-top:16px" onclick="location.reload()">Tekrar dene</button>';
  window.__yukHata = function () { if (hazir()) return; hata = true; goster('3D kütüphanesi yüklenemedi.<small>İnternet bağlantısını kontrol edip tekrar dene.</small>' + dugme); };

<script>
/* <<<MANTIK>>> */
// Karadelik Mutfak: masadaki karadeligi surukle, tarifteki malzemeleri yut. Buyudukce daha buyuk malzeme sigar,
// ama yanlis malzemeyi istemeden yutma riski de buyur. Sure + 3 yanlis hakki.
const MASA_W = 10, MASA_H = 14;
const BOY = { S: 0.28, M: 0.45, L: 0.68 };
const DELIK_R0 = 0.42, BUYUME = 0.06, DELIK_RMAX = 1.25, VMAX = 7.5;
const YUT_ORAN = 0.9;          // malzeme yaricapi <= delik yaricapi * YUT_ORAN ise sigar
const YANLIS_HAK = 3;

const MALZEME = {
  domates: { ad: 'Domates', boy: 'M' }, mantar: { ad: 'Mantar', boy: 'S' }, zeytin: { ad: 'Zeytin', boy: 'S' }, peynir: { ad: 'Peynir', boy: 'M' }, feslegen: { ad: 'Fesleğen', boy: 'S' },
  ekmek: { ad: 'Hamburger ekmeği', boy: 'L' }, kofte: { ad: 'Köfte', boy: 'M' }, marul: { ad: 'Marul', boy: 'M' }, tursu: { ad: 'Turşu', boy: 'S' },
  pirinc: { ad: 'Pirinç topu', boy: 'S' }, somon: { ad: 'Somon', boy: 'M' }, nori: { ad: 'Nori', boy: 'M' }, avokado: { ad: 'Avokado', boy: 'M' }, karides: { ad: 'Karides', boy: 'S' },
  tortilla: { ad: 'Tortilla', boy: 'L' }, biber: { ad: 'Biber', boy: 'S' }, misir: { ad: 'Mısır', boy: 'S' }, limon: { ad: 'Limon', boy: 'S' },
  yumurta: { ad: 'Yumurta', boy: 'S' }, kase: { ad: 'Erişte kasesi', boy: 'L' }, et: { ad: 'Et dilimi', boy: 'M' }, sogan: { ad: 'Yeşil soğan', boy: 'S' },
  makarna: { ad: 'Makarna', boy: 'M' }, sarimsak: { ad: 'Sarımsak', boy: 'S' }, parmesan: { ad: 'Parmesan', boy: 'L' },
  // mutfak esyalari: hicbir tarifte yok
  catal: { ad: 'Çatal', boy: 'S', esya: true }, tuzluk: { ad: 'Tuzluk', boy: 'S', esya: true }, kapak: { ad: 'Tencere kapağı', boy: 'L', esya: true }, sunger: { ad: 'Sünger', boy: 'M', esya: true },
};
const TARIFLER = [
  { ad: 'Margherita Pizza', ulke: 'İtalya', mal: { domates: 3, feslegen: 2, peynir: 2 } },
  { ad: 'Hamburger', ulke: 'ABD', mal: { ekmek: 1, kofte: 2, marul: 2, tursu: 2 } },
  { ad: 'Suşi Tabağı', ulke: 'Japonya', mal: { pirinc: 4, somon: 2, nori: 2 } },
  { ad: 'Taco', ulke: 'Meksika', mal: { tortilla: 1, biber: 3, misir: 3, avokado: 1 } },
  { ad: 'Mantarlı Pizza', ulke: 'İtalya', mal: { mantar: 4, zeytin: 3, peynir: 2, domates: 2 } },
  { ad: 'Ramen', ulke: 'Japonya', mal: { kase: 1, yumurta: 2, et: 2, sogan: 3 } },
  { ad: 'Spagetti', ulke: 'İtalya', mal: { makarna: 3, domates: 2, sarimsak: 3, parmesan: 1 } },
  { ad: 'Guacamole', ulke: 'Meksika', mal: { avokado: 3, limon: 3, biber: 2, sogan: 2 } },
  { ad: 'Karides Taco', ulke: 'Meksika', mal: { tortilla: 2, karides: 4, limon: 2, marul: 2 } },
  { ad: 'Suşi Partisi', ulke: 'Japonya', mal: { pirinc: 5, somon: 3, karides: 3, avokado: 2, nori: 2 } },
];

function rngYap(tohum) { let s = (tohum >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const yr = tip => BOY[MALZEME[tip].boy];
const yutabilir = (R, tip) => yr(tip) <= R * YUT_ORAN + 1e-9;
const delikR = yenen => Math.min(DELIK_RMAX, DELIK_R0 + yenen * BUYUME);

// ---------- seviye
function seviye(n) {
  const T = TARIFLER[n % TARIFLER.length], tur = Math.floor(n / TARIFLER.length);
  const gerek = Object.values(T.mal).reduce((a, b) => a + b, 0);
  const yanlisSay = Math.min(22, 7 + n * 1.2 + tur * 3) | 0;
  const kume = Math.min(0.6, 0.25 + n * 0.04);          // yanlislarin ne kadari dogrularin dibine konur
  const sure = Math.round(10 + gerek * 2.2 - Math.min(6, n * 0.4));
  return { n, tarif: T, yanlisSay, kume, sure, fazla: n < 3 ? 2 : 1 };
}
function oyunKur(n, tohum) {
  const S = seviye(n), r = rngYap(tohum == null ? 777 + n * 13 : tohum), T = S.tarif;
  const O = { n, S, t: 0, sure: S.sure, delik: { x: MASA_W / 2, y: MASA_H - 1.2, R: DELIK_R0 }, yenen: 0, yanlis: 0, kalan: { ...T.mal }, esyalar: [], sid: 1, bitti: false, kazandi: false, olaylar: [], hedefX: null, hedefY: null };
  const koy = (tip, yakin) => {
    const rr = yr(tip);
    for (let deneme = 0; deneme < 300; deneme++) {
      let x, y; if (yakin) { const a = r() * 6.283, d = yakin.r + rr + 0.12 + r() * 0.5; x = yakin.x + Math.cos(a) * d; y = yakin.y + Math.sin(a) * d; }
      else { x = 0.5 + rr + r() * (MASA_W - 1 - 2 * rr); y = 0.5 + rr + r() * (MASA_H - 3.2 - 2 * rr); }
      if (x < rr + 0.3 || x > MASA_W - rr - 0.3 || y < rr + 0.3 || y > MASA_H - rr - 0.3) continue;
      if (Math.hypot(x - O.delik.x, y - O.delik.y) < 1.8) continue;
      if (O.esyalar.some(e => Math.hypot(e.x - x, e.y - y) < e.r + rr + 0.1)) continue;
      const e = { id: O.sid++, tip, x, y, r: rr, dogru: tip in T.mal, yutuldu: false }; O.esyalar.push(e); return e;
    }
    return null;
  };
  // dogrular (+ birkac fazla), sonra yanlislar: bir kismi dogrularin dibine
  for (const [tip, k] of Object.entries(T.mal)) for (let i = 0; i < k; i++) koy(tip);
  const tipler = Object.keys(T.mal); for (let i = 0; i < S.fazla; i++) koy(tipler[Math.floor(r() * tipler.length)]);
  const yanlisHavuz = Object.keys(MALZEME).filter(t => !(t in T.mal)), dogrular = O.esyalar.slice();
  for (let i = 0; i < S.yanlisSay; i++) { const tip = yanlisHavuz[Math.floor(r() * yanlisHavuz.length)]; koy(tip, r() < S.kume ? dogrular[Math.floor(r() * dogrular.length)] : null); }
  return O;
}

// ---------- adim: delik hedefe dogru en fazla VMAX ile gider, sigan ve icine giren her sey dusser
function hedefVer(O, x, y) { O.hedefX = x; O.hedefY = y; }
function adim(O, dt) {
  if (O.bitti) return;
  O.t += dt;
  const D = O.delik;
  if (O.hedefX != null) { const dx = O.hedefX - D.x, dy = O.hedefY - D.y, d = Math.hypot(dx, dy), m = Math.min(d, VMAX * dt); if (d > 1e-6) { D.x += dx / d * m; D.y += dy / d * m; } }
  D.x = Math.max(0.3, Math.min(MASA_W - 0.3, D.x)); D.y = Math.max(0.3, Math.min(MASA_H - 0.3, D.y));
  for (const e of O.esyalar) {
    if (e.yutuldu || !yutabilir(D.R, e.tip)) continue;
    if (Math.hypot(e.x - D.x, e.y - D.y) > D.R - e.r * 0.35) continue;
    e.yutuldu = true;
    if (e.dogru && O.kalan[e.tip] > 0) { O.kalan[e.tip]--; O.yenen++; D.R = delikR(O.yenen); O.olaylar.push({ tip: 'dogru', esya: e }); }
    else if (e.dogru) { O.yenen++; D.R = delikR(O.yenen); O.olaylar.push({ tip: 'fazla', esya: e }); }
    else { O.yanlis++; O.olaylar.push({ tip: 'yanlis', esya: e }); }
  }
  if (Object.values(O.kalan).every(k => k === 0)) { O.bitti = true; O.kazandi = true; O.olaylar.push({ tip: 'bitti', kazandi: true }); }
  else if (O.yanlis >= YANLIS_HAK) { O.bitti = true; O.olaylar.push({ tip: 'bitti', kazandi: false, neden: 'yanlis' }); }
  else if (O.t >= O.sure) { O.bitti = true; O.olaylar.push({ tip: 'bitti', kazandi: false, neden: 'sure' }); }
}
const yildiz = O => !O.kazandi ? 0 : O.yanlis === 0 && O.t < O.sure * 0.7 ? 3 : O.yanlis <= 1 ? 2 : 1;
/* <<<MANTIK SONU>>> */
</script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module" onerror="window.__yukHata && window.__yukHata()">
import * as THREE from 'three';
const $ = id => document.getElementById(id);
const app = $('app');
const G = window.G = {};
const titre = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ================================================================ SES */
const SES = (() => {
  let ac = null, ana, gur;
  const hazirla = () => { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); ana = ac.createGain(); ana.gain.value = 0.8; ana.connect(ac.destination);
    gur = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = gur.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; };

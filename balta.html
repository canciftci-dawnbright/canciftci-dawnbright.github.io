<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Balta Ustası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪓</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0f1a12;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#f4efe6}
#app{position:relative;margin:0 auto;height:100%;width:min(100vw,calc(100vh * 0.5625));overflow:hidden;background:#0f1a12}
#app canvas{display:block;width:100%;height:100%}
.ik{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.17em;background:center/contain no-repeat;font-style:normal}
.ik.o{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='10' width='22' height='13' rx='3' fill='%238a5a34'/><rect x='3' y='13' width='22' height='2' fill='%23704626'/><rect x='3' y='18' width='22' height='2' fill='%23704626'/><ellipse cx='25' cy='16.5' rx='5' ry='6.5' fill='%23e8c98f' stroke='%238a5a34' stroke-width='1.5'/><ellipse cx='25' cy='16.5' rx='2.6' ry='3.6' fill='none' stroke='%23b98a52' stroke-width='1.2'/><circle cx='25' cy='16.5' r='.9' fill='%23b98a52'/></svg>")}
.ik.p{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23e0a817'/><circle cx='16' cy='16' r='10.5' fill='%23ffd35a' stroke='%23c48a0a' stroke-width='1.5'/><path d='M16 9.5v13M12.5 12.5h7M12.5 19.5h7' stroke='%23c48a0a' stroke-width='2.2' stroke-linecap='round'/></svg>")}
.ucan .ik{width:24px;height:24px}
#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:2}
#hud .satir{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pill{background:rgba(20,26,18,.8);border:1px solid rgba(255,210,90,.22);border-radius:14px;padding:4px 11px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:5px;text-shadow:0 1px 3px rgba(0,0,0,.6);transition:transform .12s}
.pill s{text-decoration:none;font-size:12px;opacity:.72}
.pill.vur{transform:scale(1.16)}
#pPara b{color:#ffd35a}
#stamina{position:relative;width:112px;height:22px;border-radius:11px;background:rgba(20,26,18,.85);border:1px solid rgba(143,227,255,.35);overflow:hidden}
#stamina i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#2f9fe8,#8fe3ff);transition:width .15s}
#stamina b{position:relative;display:block;text-align:center;font-size:13px;line-height:22px;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#stamina.az i{background:linear-gradient(90deg,#e8582f,#ffb35a)}
#stamina.salla{animation:salla .45s}
@keyframes salla{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#sirt{position:relative;width:104px;height:22px;border-radius:11px;background:rgba(20,26,18,.85);border:1px solid rgba(232,201,143,.45);overflow:hidden}
#sirt i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8a5a34,#e8c98f);transition:width .15s}
#sirt b{position:relative;display:block;text-align:center;font-size:13px;line-height:22px;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#sirt.dolu{border-color:#ffb35a;animation:nabiz .7s ease-in-out infinite}
#sirt.dolu i{background:linear-gradient(90deg,#e8582f,#ffb35a)}
#sirt.salla{animation:salla .45s}
#guc{display:none;color:#8fe3ff}
#guc.acik{display:flex;animation:nabiz .6s ease-in-out infinite}
#oto{display:none;margin:0 auto;font-size:13px;padding:3px 11px;background:rgba(20,26,18,.72)}
#oto.acik{display:flex}
#oto s{opacity:.85}
#gelir{display:none}
#gelir.acik{display:flex}
@keyframes nabiz{50%{transform:scale(1.07)}}
#ipuc{position:absolute;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
#ipuc.goster{opacity:1}
#ipuc span{display:inline-block;background:rgba(15,20,12,.78);border:1px solid rgba(255,210,90,.25);border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px;line-height:1.25}
#damga{position:absolute;left:0;right:0;top:38%;text-align:center;font-weight:800;font-size:42px;letter-spacing:.03em;color:#ffd35a;text-shadow:0 0 22px rgba(255,150,40,.85),0 4px 0 rgba(0,0,0,.6);pointer-events:none;opacity:0;z-index:2}
#damga.goster{animation:damga 1.3s cubic-bezier(.2,.9,.3,1.2) forwards}
#damga.mavi{color:#9fe8ff;text-shadow:0 0 22px rgba(80,190,255,.9),0 4px 0 rgba(0,0,0,.6)}
#damga.yesil{color:#b8f27a;text-shadow:0 0 22px rgba(120,220,60,.85),0 4px 0 rgba(0,0,0,.6)}
@keyframes damga{0%{opacity:0;transform:scale(2.2) rotate(-5deg)}15%{opacity:1;transform:scale(1) rotate(-5deg)}75%{opacity:1}100%{opacity:0;transform:scale(1.05) rotate(-5deg)}}
#etiketler{position:absolute;inset:0;pointer-events:none;z-index:1}
.etiket{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;background:rgba(20,26,18,.88);border:1px solid rgba(255,210,90,.35);border-radius:12px;padding:2px 10px;font-weight:800;font-size:14px;white-space:nowrap;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.etiket.hazir{background:#ffc21a;color:#1a1409;border-color:#fff3c0}
.etiket.hazir.zipla{animation:zipla .9s ease-in-out infinite}
.etiket.kilit{opacity:.55}
.etiket u{text-decoration:none;color:#7dff8a}
@keyframes zipla{50%{transform:translate(-50%,calc(-100% - 5px))}}
#ucanlar{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.ucan{position:absolute;left:0;top:0;font-size:20px;line-height:1;will-change:transform}
.yuzen{position:absolute;left:0;top:0;font-weight:800;font-size:17px;color:#ffd35a;text-shadow:0 2px 4px rgba(0,0,0,.85);white-space:nowrap;will-change:transform}
#sekmeler{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(10,14,8,0),rgba(10,14,8,.8) 40%);z-index:5}
#sekmeler button{flex:1;border:0;border-radius:14px;background:rgba(38,49,31,.94);color:#f4efe6;font:800 13px "Baloo 2",system-ui,sans-serif;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.4);cursor:pointer}
#sekmeler button em{font-style:normal;font-size:22px;line-height:1.15}
#sekmeler button.secili{background:#ffc21a;color:#1a1409;box-shadow:0 3px 0 #a37a05}
#sekmeler button:active{transform:translateY(2px)}
.rozet{position:absolute;top:-5px;right:14%;min-width:14px;height:14px;border-radius:9px;background:#ff4a3a;border:2px solid #fff;display:none}
.rozet.acik{display:block;animation:nabiz .8s ease-in-out infinite}
#sayfa{position:absolute;inset:0;z-index:4;display:none;background:rgba(0,0,0,.22)}
#sayfa.acik{display:block}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:linear-gradient(#2c3a23,#1b2416);border:1px solid rgba(255,210,90,.28);border-radius:20px;padding:14px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#sayfa.acik #sheet{animation:yukari .28s cubic-bezier(.2,.9,.3,1.15)}
@keyframes yukari{from{transform:translateY(40px);opacity:0}}
#sheet h3{margin:0;font-size:22px;line-height:1.1}
#sheet .kapat{position:absolute;right:10px;top:8px;border:0;background:none;color:#f4efe6;font-size:20px;opacity:.6;cursor:pointer}
#sheet p{margin:4px 0 0;font-size:14px;opacity:.8;line-height:1.25}
#sheet .istat{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#sheet .istat span{background:rgba(255,255,255,.07);border-radius:10px;padding:2px 9px;font-size:13px;font-weight:700}
#sheet .gsat{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
#sheet .gsat:first-of-type{border-top:0}
#sheet .gsat em{font-style:normal;font-size:28px}
#sheet .gsat .bilgi{flex:1;min-width:0}
#sheet .gsat b{display:block;font-size:16px}
#sheet .gsat small{display:block;font-size:12px;opacity:.75;line-height:1.2}
#sheet .pip{font-size:11px;letter-spacing:2px;color:#ffd35a}
#sheet .eksik{color:#ff9a7a;font-size:13px;font-weight:700;margin-top:4px}
.btn{margin-top:12px;border:0;border-radius:16px;padding:10px 26px;font:800 19px "Baloo 2",system-ui,sans-serif;color:#1a1409;background:#ffc21a;box-shadow:0 4px 0 #a37a05;cursor:pointer}
.btn.tam{width:100%}
.btn.kucuk{margin:0;padding:6px 12px;font-size:15px;border-radius:12px;min-width:84px}
.btn:disabled{background:#5d6153;color:#c9c6b8;box-shadow:0 4px 0 #34372d;cursor:default}
.btn:active:not(:disabled){transform:translateY(2px)}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,12,6,.6);z-index:6}
.card{background:linear-gradient(#26311f,#1a2215);border:1px solid rgba(255,210,90,.25);border-radius:22px;padding:20px 22px;text-align:center;min-width:64%;max-width:84%;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:kartIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes kartIn{from{transform:scale(.6);opacity:0}}
.card h2{margin:0;font-size:28px}
.card p{margin:6px 0 0;font-size:15px;opacity:.85}
.card .buyuk{font-size:38px;font-weight:800;color:#ffd35a;margin-top:6px}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at 50% 45%,rgba(120,200,255,0) 50%,rgba(30,80,140,.42) 100%);z-index:1}
#app.yavas::after{opacity:1}
#app.yavas canvas{filter:saturate(.72) brightness(1.04)}
#app canvas{transition:filter .25s}
#err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:#0f1a12;z-index:50;font-weight:800;font-size:17px;line-height:1.35}
#err small{display:block;font-size:13px;opacity:.7;font-weight:700;margin-top:6px}
#err .cark{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,194,26,.25);border-top-color:#ffc21a;animation:don .8s linear infinite;margin-bottom:14px}
@keyframes don{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="satir">
      <div class="pill" id="pParsel">🌲 <b id="hParsel">1</b><s id="hKalan"></s></div>
      <div class="pill" id="pOdun"><i class="ik o"></i> <b id="hOdun">0</b></div>
      <div class="pill" id="pPara"><i class="ik p"></i> <b id="hPara">0</b></div>
    </div>
    <div class="satir">
      <div id="stamina"><i></i><b>⚡ 12/12</b></div>
      <div id="sirt"><i></i><b>🎒 0/30</b></div>
      <div class="pill" id="guc">⚡ GÜÇLÜ ATIŞ</div>
      <div class="pill" id="gelir"><i class="ik p"></i> <b id="hGelir">0</b><s>/dk</s></div>
    </div>
    <div class="satir"><div class="pill" id="oto">🔄 <b>OTO</b> <s id="otoYazi"></s></div></div>
  </div>
  <div id="etiketler"></div>
  <div id="damga"></div>
  <div id="ipuc"></div>
  <div id="ucanlar"></div>
  <div id="sekmeler">
    <button data-s="orman" class="secili"><em>🌲</em>Orman</button>
    <button data-s="kasaba"><em>🏘️</em>Kasaba<i class="rozet" id="rKasaba"></i></button>
    <button data-s="atolye"><em>🔨</em>Atölye<i class="rozet" id="rAtolye"></i></button>
  </div>
  <div id="sayfa"><div id="sheet"></div></div>
  <div id="over"><div class="card" id="kart"></div></div>
  <div id="err"></div>
</div>
<script>
/* Yukleme ekrani: hazir olunca kalkar; sadece gercek yukleme hatasinda "Tekrar dene". */
(function () {
  var e = document.getElementById('err'), t0 = Date.now(), hata = false;
  var hazir = function () { return window.G && window.G.hazir; };
  var goster = function (html) { e.innerHTML = html; e.style.display = 'flex'; };
  var dugme = '<button class="btn" style="margin-top:16px" onclick="location.reload()">Tekrar dene</button>';
  window.__yukHata = function () { if (hazir()) return; hata = true; goster('3D kütüphanesi yüklenemedi.<small>İnternet bağlantısını kontrol edip tekrar dene.</small>' + dugme); };
  addEventListener('error', function (ev) { if (ev.target && ev.target.tagName === 'SCRIPT') window.__yukHata(); }, true);
  addEventListener('unhandledrejection', function () { window.__yukHata(); });
  (function kontrol() {
    if (hazir()) { e.style.display = 'none'; return; }
    if (!hata) { var sn = (Date.now() - t0) / 1000;
      if (sn > 2) goster('<div class="cark"></div>Yükleniyor…' + (sn > 20 ? '<small>Bağlantı yavaş, biraz daha bekle</small>' : '') + (sn > 60 ? dugme : '')); }
    setTimeout(kontrol, 400);
  })();
})();
</script>
<script>
/* <<<MANTIK>>> */
/* Balta Ustasi (sandbox) oyun mantigi -- DOM/three.js'e dokunmaz; benzetim betikleri ayni kodu calistirir.
   Orman: oyuncu orijinde -Z'ye bakar; onunde bir parsel agac. Atis stamina harcar, stamina zamanla dolar.
   Balta ilk saglam govdeye saplanir (fidanlari keserek gecer). Geri cagirma: dokunulan noktadan (govdeye yakinsa
   miknatisla govdenin ortasindan) gecen Catmull-Rom egrisiyle ele doner, yolundaki her govdeye bir centik acar.
   Cani dolan agac son vurusun hareket yonune devrilir, saplanan balta onunla birlikte gider; yere degen agac oduna doner.
   Parsel temizlenince yenisi gelir (ilerledikce kalin agac artar).
   Kesilen odun once oduncunun sirtina biner (kapasiteli; dolunca atis kilitlenir), kasabadaki depoya bosaltilinca harcanabilir.
   Kasaba: odunla (ve parayla) yapi kurulur; her yapi belli araliklarla musteri alir, musteri para birakir (idle). */
const AYAR = {
  g: 9.8, el: { x: 0.45, y: 1.35, z: 0.3 }, hiz: 26, donusHiz: 22, menzil: 34, adimDt: 1 / 120,
  kesikY: 0.35, tepeOran: 0.5,          // govdenin tepe baslangicina kadarki kismi vurulabilir
  yakalaOnce: 0.2,                       // kusursuz yakalama penceresi (s)
  dusKick: 0.35,                         // devrilmeye baslarken ilk acisal hiz (rad/s)
  tepeKalinlik: 0.9,                     // devrilen agacin tepesi carpma icin ek yaricap (m)
  miknatis: 0.7,                         // donus dokunmasi bir govdeye bu kadar yakinsa yol o govdeye kilitlenir (m)
  donusMenzil: 9,                        // donus gecis noktasi baltanin o anki yerinden en fazla bu kadar uzakta (m)
  stamina: { azami: 12, yenile: 12 },    // en fazla atis, bir atisin dolma suresi (s)
  sirt: { azami: 40, sepet: 20 },        // sirtta tasinan odun ve sepet gelistirmesi basina ek
  koni: 0.2,                             // coklu baltada komsu baltalar arasi aci (rad, ~11 derece; 5 baltada uclar +-23)
  cevrimdisiOran: 0.5, cevrimdisiAzami: 7200,   // oyun kapaliyken gelir orani ve en fazla sure (s)
};
const AGAC = {
  ince: { r: 0.11, h: 3.4, can: 1, dominoEsik: 1.0, odun: 2 },
  orta: { r: 0.24, h: 6.4, can: 2, dominoEsik: 2.4, odun: 5 },
  kalin: { r: 0.38, h: 8.2, can: 3, dominoEsik: 4.6, odun: 10 },
  mese: { r: 0.46, h: 7.4, can: 4, dominoEsik: 6.0, odun: 16 },
  dev: { r: 0.58, h: 10.5, can: 6, dominoEsik: 8.5, odun: 26 },
};
// kasaba yapilari: sirayla acilir; gelir: musteri basina para, aralik: iki musteri arasi (s), seviye basina gelir +%50
const YAPILAR = [
  { id: 'tezgah', ad: 'Odun Tezgâhı', ikon: '🧺', odun: 25, para: 0, gelir: 4, aralik: 6, svTaban: 40 },
  { id: 'marangoz', ad: 'Marangoz', ikon: '🛠️', odun: 90, para: 60, gelir: 10, aralik: 6, svTaban: 140 },
  { id: 'kafe', ad: 'Kafe', ikon: '☕', odun: 220, para: 350, gelir: 18, aralik: 5, svTaban: 400 },
  { id: 'mobilya', ad: 'Mobilyacı', ikon: '🪑', odun: 450, para: 1200, gelir: 36, aralik: 5, svTaban: 1100 },
];
const YAPI_AZAMI_SV = 5;
// atolye gelistirmeleri (para): seviye basina maliyet taban * kat^sv
const GELISTIR = {
  uclu: { ad: 'Çoklu Balta', ikon: '🔱', aciklama: '+1 balta, koni şeklinde uçar. Enerji yine 1', taban: 250, kat: 1.8, azami: 4 },
  stamina: { ad: 'Dayanıklılık', ikon: '💪', aciklama: '+3 atış hakkı', taban: 60, kat: 1.6, azami: 8 },
  yenile: { ad: 'Nefes', ikon: '💨', aciklama: 'Enerji %10 daha hızlı dolar', taban: 80, kat: 1.6, azami: 6 },
  sepet: { ad: 'Sırt Sepeti', ikon: '🎒', aciklama: '+20 odun taşırsın', taban: 50, kat: 1.6, azami: 8 },
  keskin: { ad: 'Keskin Balta', ikon: '🪓', aciklama: '+%20 çift çentik şansı', taban: 120, kat: 1.7, azami: 4 },
};

const v3 = (x, y, z) => ({ x, y, z });
const topla = (a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z);
const cikar = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
const olc = (a, k) => v3(a.x * k, a.y * k, a.z * k);
const boy = a => Math.hypot(a.x, a.y, a.z);
const olay = (S, o) => S.olaylar.push(o);
function rnd(S) { S.rs = (S.rs + 0x6D2B79F5) >>> 0; let t = S.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

/* ---- dunya durumu: orman + ekonomi */
function dunyaKur(kayitli) {
  const k = kayitli || {};
  const S = { rs: (k.tohum >>> 0) || 12345, zaman: 0, olaylar: [], agaclar: [], parsel: k.parsel || 0,
    balta: yeniBalta(), baltalar: [],
    odun: k.odun || 0, sirt: k.sirt || 0, para: k.para || 0, toplamOdun: k.toplamOdun || 0, toplamPara: k.toplamPara || 0,
    stamina: k.stamina != null ? k.stamina : AYAR.stamina.azami,
    gel: Object.assign({ uclu: 0, stamina: 0, yenile: 0, sepet: 0, keskin: 0 }, k.gel || {}),
    yapilar: (k.yapilar || []).map(y => ({ id: y.id, sv: y.sv || 1, t: 0 })),
    kusursuzSay: 0, domino: 0 };
  S.baltalar.push(S.balta); baltaTamamla(S);
  parselKur(S, S.parsel);
  return S;
}
const yeniBalta = () => ({ durum: 'elde', p: { ...AYAR.el }, guc: 1 });
const BALTA_AZAMI = 5;
const baltaSayi = S => Math.min(BALTA_AZAMI, 1 + S.gel.uclu);
function baltaTamamla(S) { while (S.baltalar.length < baltaSayi(S)) S.baltalar.push(yeniBalta()); }
const hepsiElde = S => S.baltalar.every(B => B.durum === 'elde');
const disarida = B => B.durum === 'saplandi' || B.durum === 'ucuyor';
const cagrilabilir = S => S.baltalar.some(disarida);
const baltaDonuyor = S => S.baltalar.some(B => B.durum === 'donuyor');
// koni: ana yon + yan baltalar icin yatayda +-koni dondurulmus yonler (birim vektor listesi)

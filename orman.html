<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orman Bekçisi</title>
<style>
:root{
  --deep:#0C1710;
  --panel:#16261A;
  --panel2:#213524;
  --sky:#2B4A33;
  --ink:#EDF4E7;
  --ink-soft:#9FBBA1;
  --ink-dim:#6B8C70;
  --line:#2C4A33;
  --bark:#57402C;
  --sun:#F2C14E;
  --ok:#7BC96F;
  --bad:#E0614C;
  --shadow:0 24px 64px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--deep);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(820px 500px at 50% -10%, rgba(120,170,90,.20), transparent 72%);
  /* mobil: çift dokunuşta yakınlaşma, metin seçimi ve mavi vurgu oyunu bozuyor */
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
#app{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
  padding:14px 10px 32px}
.stage{
  width:min(400px,100%);background:var(--panel);
  border:1px solid var(--line);border-radius:22px;
  padding:14px 20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.lv{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);line-height:1.5}
.lv b{display:block;color:var(--sun);font-size:19px;letter-spacing:0;font-variant-numeric:tabular-nums}
.stat{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-dim);text-align:right;line-height:1.5}
.stat b{display:block;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--sun)}
.stat.crit b{color:var(--bad);animation:statPulse .8s ease-in-out infinite}
@keyframes statPulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- talep tabelaları ---------- */
.orders{display:flex;align-items:stretch;gap:8px;margin-top:12px}
.order{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 9px;
  background:linear-gradient(180deg,#3A2C1D,#2A2015);
  border:1px solid #4A3826;border-radius:6px;position:relative;overflow:hidden;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 3px 0 rgba(0,0,0,.35);
}
.order::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;
  background:repeating-linear-gradient(180deg,transparent 0 6px,rgba(0,0,0,.18) 6px 7px)}
.order.empty{opacity:.3}
.order .pic{width:38px;height:31px;flex:0 0 auto;position:relative;z-index:1}
.order .meta{flex:1;min-width:0;position:relative;z-index:1}
.order .cap{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#C8B08A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.order .prog{display:flex;align-items:center;gap:6px;margin-top:4px}
.order .prog b{font-size:12.5px;font-weight:800;color:var(--sun);font-variant-numeric:tabular-nums}
.order .pips{display:flex;gap:3px}
.order .pips i{width:12px;height:7px;border-radius:2px;background:rgba(0,0,0,.35);
  transition:background .25s ease, transform .25s ease}
.order .pips i.on{background:var(--sun);transform:scaleY(1.3)}
/* Bu türden serbest hayvan kalmadı: hepsi sepette/çimende kilitli.
   İşaret olmasa oyuncu "hayvan bitti, bölüm bozuk" sanır. */
.order .lk{position:absolute;right:5px;top:4px;font-size:12px;line-height:1;z-index:2;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.order.locked{border-color:#8A6A3E;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),
  0 3px 0 rgba(0,0,0,.35), 0 0 0 1px rgba(242,193,78,.5)}
.order.locked .pic{opacity:.5}

/* ---------- bekleme kafesleri ---------- */
.pens{display:flex;gap:7px;margin-top:11px;padding:9px;border-radius:10px;position:relative;
  background:rgba(0,0,0,.26);border:1px solid var(--line);transition:border-color .25s, box-shadow .25s}
.pens.warn{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun), 0 0 22px rgba(242,193,78,.22)}
.pens.full{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad), 0 0 26px rgba(224,97,76,.32);
  animation:pensPulse 1s ease-in-out infinite}
@keyframes pensPulse{0%,100%{box-shadow:0 0 0 1px var(--bad), 0 0 12px rgba(224,97,76,.2)}
  50%{box-shadow:0 0 0 2px var(--bad), 0 0 30px rgba(224,97,76,.46)}}
.pens.deny{animation:denyShake .4s ease-in-out}
@keyframes denyShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.pen{flex:1;aspect-ratio:1/.86;border-radius:5px;border:2px dashed rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .2s}
.pen.on{border-style:solid;border-color:#6A5236;background:rgba(90,68,44,.35);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.pen.on::before{content:"";position:absolute;inset:2px;pointer-events:none;border-radius:3px;
  background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(0,0,0,.4) 7px 9px)}
.pen svg{width:34px;height:27px;position:relative;z-index:1}
.pen .drop{animation:penDrop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes penDrop{0%{transform:translateY(-10px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
.pen.freeing{animation:freePop .45s ease-out}
@keyframes freePop{0%{transform:scale(1)}45%{transform:scale(1.25);filter:brightness(1.7)}100%{transform:scale(1)}}
/* salıver modu: dolu kafesler tıklanabilir olur */
.pen.armed{cursor:pointer;border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);
  animation:armedPulse 1s ease-in-out infinite}
@keyframes armedPulse{0%,100%{box-shadow:0 0 0 1px var(--ok)}50%{box-shadow:0 0 0 3px var(--ok), 0 0 16px rgba(123,201,111,.5)}}
.pen .free{position:absolute;right:2px;top:1px;font-size:11px;font-weight:800;color:var(--ok);z-index:2}

/* ---------- orman açıklığı (dekor) ---------- */
.glade{
  position:relative;margin-top:11px;border-radius:16px;overflow:hidden;
  height:352px;                        /* eski tarayicilar icin yedek */
  height:clamp(280px, 46dvh, 352px);   /* sahne oranli oldugu icin serbestce kisalabilir */
  background:linear-gradient(180deg,#33573B 0%,var(--sky) 34%,#1B3122 100%);
  border:2px solid var(--line);box-shadow:inset 0 12px 34px rgba(0,0,0,.45);
}
.glade .ray{position:absolute;top:-14%;width:56px;height:130%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,236,170,.16),transparent 62%);
  transform:skewX(-13deg);animation:rayShift 9s ease-in-out infinite alternate}
.glade .ray.r2{left:44%;width:34px;animation-duration:12s;animation-delay:-3s;opacity:.7}
.glade .ray.r3{left:74%;width:46px;animation-duration:11s;animation-delay:-6s;opacity:.5}
@keyframes rayShift{from{transform:skewX(-13deg) translateX(-9px)}to{transform:skewX(-6deg) translateX(11px)}}
.glade .canopy{position:absolute;left:-6%;right:-6%;top:-18px;height:56px;pointer-events:none;
  background:radial-gradient(32px 24px at 10% 62%, rgba(0,0,0,.55), transparent 70%),
             radial-gradient(40px 28px at 30% 40%, rgba(0,0,0,.5), transparent 70%),
             radial-gradient(34px 26px at 52% 64%, rgba(0,0,0,.55), transparent 70%),
             radial-gradient(42px 28px at 74% 42%, rgba(0,0,0,.5), transparent 70%),
             radial-gradient(34px 24px at 94% 60%, rgba(0,0,0,.55), transparent 70%)}
/* gövdeler ve teraslar JS'ten üretilir — konumları TIERS/TREES ile aynı kaynaktan gelsin */
.glade .trunk{position:absolute;top:0;pointer-events:none;
  background:linear-gradient(90deg,#332415,var(--bark) 42%,#291D11);}
.glade .trunk::after{content:"";position:absolute;inset:0;opacity:.42;
  background:repeating-linear-gradient(180deg,transparent 0 14px,rgba(0,0,0,.4) 14px 16px)}
/* Teras kenarı belirgin olmalı: zemin gibi okunmayan teras, üstündeki
   her şeyi "havada" gösteriyor. Kalın çim şeridi + üstte açık kenar çizgisi. */
.glade .bank{position:absolute;left:-5%;right:-5%;pointer-events:none;
  border-radius:50% 50% 0 0 / 26px 26px 0 0;
  box-shadow:0 -3px 10px rgba(0,0,0,.45)}
.glade .turf{position:absolute;left:0;right:0;top:0;height:14px;border-radius:inherit;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22), inset 0 -4px 8px rgba(0,0,0,.25)}
/* dallar: tembel hayvan bunlara tutunur */
.glade .branch{position:absolute;height:7px;border-radius:4px;
  background:linear-gradient(180deg,#6E5438,#38290F);box-shadow:0 2px 5px rgba(0,0,0,.55)}
.glade .branch::before,.glade .branch::after{content:"";position:absolute;top:-10px;
  width:24px;height:17px;border-radius:62% 62% 38% 38%;
  background:linear-gradient(180deg,#43854A,#255230)}
.glade .branch::before{left:-11px}
.glade .branch::after{right:-11px}
.glade .tuft{position:absolute;width:4px;border-radius:3px 3px 0 0;transform-origin:bottom center;
  animation:sway 4.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.glade .spark{position:absolute;border-radius:50%;background:rgba(255,238,150,.9);
  box-shadow:0 0 8px rgba(255,226,120,.85);animation:drift linear infinite}
@keyframes drift{
  0%{transform:translate(0,0) scale(.6);opacity:0}
  15%{opacity:.95}
  50%{transform:translate(14px,-110px) scale(1);opacity:.7}
  100%{transform:translate(-10px,-230px) scale(.5);opacity:0}
}

/* ---------- sahne katmanı: hayvanlar, çalılar, sepetler ---------- */
.field{position:absolute;inset:0;pointer-events:none;z-index:6}
.critter{position:absolute;left:0;top:0;width:42px;height:34px;pointer-events:auto;cursor:pointer;
  will-change:transform;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));touch-action:manipulation}
/* Parmakla dokunulabilir alan gorselden buyuk: arka terasta hayvan 0.84
   olceginde kuculuyor ve 35x29 px hedef mobilde cok kucuk kaliyor. */
.critter::before{content:"";position:absolute;inset:-8px;border-radius:12px}
.critter svg{width:100%;height:100%;display:block;overflow:visible}
.critter:hover{filter:drop-shadow(0 0 9px rgba(255,240,190,.75)) drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.critter.fly{pointer-events:none;transition:transform .42s cubic-bezier(.4,.05,.25,1), opacity .42s ease-in;z-index:99}
.critter.born{animation:bornGlow .5s ease-out}
@keyframes bornGlow{
  0%{opacity:0;filter:brightness(2.4) drop-shadow(0 0 14px #fff)}
  40%{opacity:1}
  100%{opacity:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
}
.critter.deny{animation:critterDeny .4s ease-in-out}
@keyframes critterDeny{0%,100%{filter:none}30%{filter:brightness(1.6) drop-shadow(0 0 10px var(--bad))}}
/* çalılar: kendi terasındaki hayvanı örter, öndekini örtmez */
.bush{position:absolute;left:0;top:0;pointer-events:none;
  border-radius:58% 58% 26% 26% / 62% 62% 30% 30%;
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.4), inset 0 4px 0 rgba(255,255,255,.09)}

/* ---------- çimen öbeği: içeriden iki göz bakar ---------- */
.patch{position:absolute;left:0;top:0;pointer-events:none;
  transform:translate(var(--px),var(--py))}
.patch .blades{position:absolute;inset:0;border-radius:46% 46% 16% 16% / 60% 60% 22% 22%;
  background:linear-gradient(180deg,var(--pt),var(--ps));
  box-shadow:inset 0 -9px 15px rgba(0,0,0,.55), inset 0 5px 0 rgba(255,255,255,.1)}
/* dişli üst kenar — düz tepe "çalı", dişli tepe "uzun çimen" okunur */
.patch .blades::before{content:"";position:absolute;left:2px;right:2px;top:-9px;height:14px;
  background:repeating-linear-gradient(92deg, var(--pt) 0 4px, transparent 4px 10px)}
.patch .eyes{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;gap:8px}
.patch .eyes i{width:6px;height:6px;border-radius:50%;background:#FFE79A;
  box-shadow:0 0 8px rgba(255,231,154,.95);animation:blink 3.6s infinite}
.patch .eyes i:last-child{animation-delay:.14s}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.patch .cnt{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  min-width:18px;height:16px;padding:0 4px;border-radius:8px;
  background:rgba(12,23,16,.88);border:1px solid #4C7A4F;color:#CFE9C6;
  font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center}
/* açılırken yavaşça kıpırdar */
.patch.rustle{animation:rustle 1.5s ease-in-out}
@keyframes rustle{
  0%,100%{transform:translate(var(--px),var(--py)) skewX(0deg)}
  14%{transform:translate(var(--px),var(--py)) skewX(-8deg)}
  38%{transform:translate(var(--px),var(--py)) skewX(7deg)}
  62%{transform:translate(var(--px),var(--py)) skewX(-5deg)}
  84%{transform:translate(var(--px),var(--py)) skewX(3deg)}
}

/* ---------- örgü sepetler ---------- */
/* Sepet AÇIKLIĞIN İÇİNDE ve tabana `bottom` ile çivili. Hesaplanmış bir
   `top` ile konumlandırılınca ölçüm kayması havada bırakabiliyordu. */
.glade .basket{position:absolute;width:58px;height:48px;z-index:7}
.glade .basket .shadow{position:absolute;left:-7px;right:-7px;bottom:-6px;height:13px;
  border-radius:50%;background:radial-gradient(ellipse at center, rgba(0,0,0,.6), transparent 72%)}
.basket{position:absolute;width:58px;height:48px}
.basket .weave{position:absolute;inset:0;border-radius:6px 6px 10px 10px;
  background:
    repeating-linear-gradient(90deg, rgba(150,110,64,.85) 0 3px, transparent 3px 11px),
    repeating-linear-gradient(180deg, rgba(120,86,48,.8) 0 3px, transparent 3px 11px),
    rgba(60,44,26,.24);
  border:2px solid #7A5A34;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.14), 0 8px 18px rgba(0,0,0,.55);
  overflow:hidden}
.basket .rim{position:absolute;left:-2px;right:-2px;top:-3px;height:8px;border-radius:5px;
  background:linear-gradient(180deg,#A97C46,#6F5029);border:1px solid #4E3819}
.basket .peek{position:absolute;inset:5px 4px 4px;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:center;gap:1px 2px;pointer-events:none}
.basket .peek svg{width:16px;height:13px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.basket .lock{position:absolute;left:50%;top:-13px;transform:translateX(-50%);
  min-width:25px;height:23px;padding:0 6px;border-radius:5px;
  background:var(--sun);color:#2A1F00;border:2px solid #93720A;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;
  box-shadow:0 3px 9px rgba(0,0,0,.5)}
.basket.burst .weave{animation:weaveBurst .5s ease-out forwards}
.basket.burst .rim{animation:rimGo .4s ease-out forwards}
.basket.burst .lock{animation:lockGo .3s ease-out forwards}
@keyframes weaveBurst{
  0%{transform:scale(1);opacity:1}
  32%{transform:scale(1.24) rotate(-6deg)}
  100%{transform:scale(.35) rotate(13deg);opacity:0}
}
@keyframes rimGo{to{transform:translateY(-22px) rotate(-16deg);opacity:0}}
@keyframes lockGo{to{transform:translateX(-50%) translateY(-18px) scale(.4);opacity:0}}

/* ---------- kontroller ---------- */
.ctrls{display:flex;gap:7px;margin-top:13px}
button{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:12px;font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer;
  transition:background .12s,border-color .12s,opacity .12s}
button:hover:not(:disabled){background:#2C4A31;border-color:#41724A}
button:disabled{opacity:.35;cursor:not-allowed}
button.mini{flex:0 0 40px;padding:9px 0;font-size:14px}
button.go{background:var(--sun);color:#2A1F00;border-color:var(--sun)}
button.go:hover{background:#FFD772}
button.armed{background:var(--ok);color:#0C1710;border-color:var(--ok)}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* ---------- uyarı / bitiş ---------- */
.danger{position:absolute;inset:0;pointer-events:none;z-index:14;opacity:0;border-radius:22px;
  box-shadow:inset 0 0 58px 11px rgba(224,97,76,.62)}
.danger.on{animation:dangerPulse .48s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{opacity:0}45%{opacity:1}}

.ov{position:absolute;inset:0;background:rgba(12,23,16,.95);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px 26px;z-index:20;backdrop-filter:blur(3px)}
.ov h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
.ov .sub{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0 0 20px;max-width:280px}
.ov .big{font-size:46px;margin-bottom:6px;line-height:1}
.ov .ctrls{width:100%;max-width:280px}
.help{text-align:left;overflow-y:auto;align-items:stretch;justify-content:flex-start}
.help h2{font-size:19px;margin-bottom:12px}
.help ol{margin:0 0 16px;padding-left:20px}
.help li{font-size:12.5px;line-height:1.65;color:var(--ink-soft);margin-bottom:7px}
.help li b{color:var(--ink)}
.help .box{border-left:2px solid var(--sun);padding-left:11px;font-size:12.5px;
  line-height:1.65;color:var(--ink-soft);margin-bottom:16px}
.foot{margin-top:13px;padding-top:10px;border-top:1px solid var(--line);
  font-size:10px;letter-spacing:.06em;color:var(--ink-dim);display:flex;justify-content:space-between}
@media (max-width:430px){
  #app{padding:8px 6px 24px}
  .stage{padding:10px 12px 14px;border-radius:16px}
  .lv b{font-size:17px}
  .stat b{font-size:14px}
  .orders{gap:6px;margin-top:10px}
  .order{padding:7px;gap:6px;border-radius:5px}
  .order .pic{width:34px;height:28px}
  .order .prog b{font-size:11.5px}
  .order .pips i{width:10px;height:6px}
  .pens{padding:7px;gap:5px;margin-top:9px}
  .pen svg{width:30px;height:24px}
  .glade{margin-top:9px}
  .ctrls{margin-top:10px;gap:6px}
  button{font-size:11.5px;padding:10px 4px}
  button.mini{flex:0 0 38px}
  .foot{font-size:9px;margin-top:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Onyukleme tanisi: JS hic calismazsa bu kutu ekranda kalir ve sebebini soyler.
   Onceden bos bir sahne goruluyor, sorunun ne oldugu anlasilmiyordu. */
.boot{position:fixed;left:10px;right:10px;top:10px;z-index:9999;padding:12px 14px;
  border-radius:10px;background:#3B1512;color:#FFD9D2;border:1px solid #A8422F;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.boot b{color:#fff}
.boot small{opacity:.75;font-size:11px;word-break:break-all}
</style>

<div class="boot" id="boot">
  <b>Oyun başlatılamadı — JavaScript çalışmıyor.</b><br>
  Dosyayı dosya yöneticisi ya da uygulama içi önizleme yerine
  <b>Chrome / Safari</b> ile aç, veya paylaşılan bağlantıyı kullan.
</div>
<script>
window.addEventListener("error", function(e){
  var b = document.getElementById("boot");
  if(!b) return;
  b.innerHTML = "<b>Oyun hata verdi</b><br>" + (e.message || "bilinmeyen hata") +
    "<br><small>" + (e.filename || "") + " : " + (e.lineno || "?") + "</small>";
});
</script>
<div id="app"><div class="stage" id="stage">
  <div class="hud">
    <div class="lv">Bölüm<b id="hLv">1</b></div>
    <div class="stat" id="hPenStat">Kafes<b id="hPen">0/5</b></div>
    <div class="stat">Talep<b id="hOrd">0/0</b></div>
  </div>

  <div class="orders">
    <div class="order" id="ord0">
      <span class="pic" id="ordPic0"></span>
      <span class="meta">
        <span class="cap" id="ordCap0">—</span>
        <span class="prog"><b id="ordCnt0">0/3</b><span class="pips" id="ordPips0"></span></span>
      </span>
      <span class="lk" id="ordLk0"></span>
    </div>
    <div class="order" id="ord1">
      <span class="pic" id="ordPic1"></span>

(function(){
"use strict";

/* ═══════════ türler ═══════════

var SPECIES = [

  { name:"Kapibara", hex:"#C99A5B", home:"ground", svg:
    '<circle cx="4.5" cy="10.5" r="2.8"/><circle cx="11.5" cy="9.8" r="2.8"/>'+
    '<rect x="8" y="13" width="28" height="17" rx="8"/>'+
    '<rect x="1" y="11.5" width="13" height="15" rx="5"/>'+

    '<rect x="27" y="28" width="5.5" height="5" rx="2.2"/>'+
    '<circle cx="6.5" cy="16.5" r="1.8" fill="#0C1710"/>'+
    '<ellipse cx="2.6" cy="21" rx="2" ry="2.7" fill="rgba(0,0,0,.4)"/>' },
  { name:"Tembel", hex:"#9AA37E", home:"tree", svg:
    '<path d="M10 7 q-5 9 0 15" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/>'+
    '<path d="M32 7 q5 9 0 15" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/>'+
    '<ellipse cx="21" cy="23" rx="9.5" ry="10"/>'+
    '<circle cx="21" cy="12" r="7.8"/>'+
    '<ellipse cx="17.6" cy="11" rx="2.7" ry="3.2" fill="#0C1710"/>'+
    '<ellipse cx="24.4" cy="11" rx="2.7" ry="3.2" fill="#0C1710"/>'+
    '<path d="M18 16.5 q3 2.4 6 0" stroke="#0C1710" stroke-width="1.5" fill="none" stroke-linecap="round"/>' }
];
function critterSVG(sp, w, h){
  var s = SPECIES[sp];
  return '<svg viewBox="0 0 42 34" style="color:'+s.hex+'" fill="'+s.hex+'"'+
    (w?' width="'+w+'" height="'+h+'"':'')+'>'+s.svg+'</svg>';
}

var NEED = 3, PENS = 5, CR_W = 42, CR_H = 34;
var ACTIVE = 2, SPEED_MUL = 1.25;
var LS = "dbg.forest.v1";

/* ÜÇ TERAS. index 0 = en ön (büyük, alçak), 2 = en arka (küçük, yüksek).
   Ölçek + yükseklik farkı derinliği taşıyor; z-index örtüşmeyi çözüyor. */
/* Konumlar ORAN olarak tutulur (açıklık yüksekliğinin katı). Sabit piksel
   olsaydı mobilde açıklık kısalınca teraslar sahne dışına taşardı. */
var TIERS = [
  { topF:0.886, scale:1.14, z:30, turf:"#57A854", soil:"#3A5730" },
  { topF:0.699, scale:1.00, z:20, turf:"#468A48", soil:"#2C4526" },
  { topF:0.523, scale:0.84, z:10, turf:"#37673D", soil:"#20351E" }
];
var AIR  = { topF:0.074, botF:0.426, z:15 };   // kanatlıların bandı
var BRANCH_F = 0.364;                          // dal yüksekliği oranı
var TREE_Z = 16;
var TREES = [ {fx:0.06,w:26}, {fx:0.25,w:19}, {fx:0.48,w:24}, {fx:0.70,w:18}, {fx:0.91,w:27} ];
var BUSHES = [
  { tier:2, fx:0.18, w:52, h:26 }, { tier:2, fx:0.62, w:46, h:23 },
  { tier:1, fx:0.34, w:62, h:32 }, { tier:1, fx:0.82, w:54, h:29 },
  { tier:0, fx:0.10, w:70, h:38 }, { tier:0, fx:0.58, w:64, h:35 }
];
/* Çimen öbekleri YALNIZCA ön ve orta terasta. Arka terasa konulunca
   ekranın üst yarısında kalıp "havada uçuyor" gibi duruyordu. */
var PATCH_SPOTS = [
  { tier:0, fx:0.09, w:66, h:40 },
  { tier:1, fx:0.46, w:56, h:34 },
  { tier:0, fx:0.74, w:62, h:38 }
];

function el(id){ return document.getElementById(id); }
function rnd(n){ return Math.floor(Math.random()*n); }

/* ═══════════ bölüm ═══════════ */
function cfgFor(n){
  return {
    /* Tavan SPECIES.length-2: en az iki tur siparislerde HIC kullanilmaz,
       ziyaretciler onlardan secilir. Boylece ziyaretciye dokunmak asla
       gecerli teslimat olmaz — kacak arz olusmaz. */
    species: Math.min(SPECIES.length - 2, 3 + Math.floor((n-1)/2)),
    /* Ziyaretci araligi (ms) ve ayni anda ekranda durabilecek en fazla sayi. */
    visMs  : (n < 2) ? 0 : Math.max(900, 3000 - (n-2)*180),
    visMax : Math.min(8, 2 + Math.floor(n/2)),
    /* Aciklikta ayni anda duracak en fazla YERLESIK hayvan. Fazlasi disarida
       bekler ve her talep tamamlandiginda 3'er 3'er iceri girer. */
    onScreen: (n < 2) ? 99 : Math.min(14, 8 + Math.floor(n/2)),   // 1. bolum: hepsi sahada
    orders : Math.min(10, 2 + n),
    /* SALIVER: sınırlı bir kurtarma hakkı. Kafesler saf ceza olmaktan çıkıp
       "hangisini, ne zaman bırakırım" kararına dönüşüyor. */
    frees  : Math.min(3, 1 + Math.floor((n-1)/4))
  };
}
function basketCount(n){
  if(n < 4) return 0;
  if(n < 6) return 1;
  if(n < 8) return 2;
  return 3;
}
/* Kusursuz-oyuncu benzetimi: kilitli kaplarla bölüm gerçekten bitirilebiliyor mu?
   İki kap türü var ve FARKLI SAYAÇLARA bağlılar:
     sepet  -> teslim edilen hayvan sayısı
     çimen  -> tamamlanan talep sayısı
   Kilitli hayvan erken bir talebe lazımsa oyun kilitlenir; bunu elemek için. */
function solvable(orders, chests, freeCounts){
  var avail = freeCounts.slice();
  var locked = chests.map(function(b){
    return { on:b.on, at:b.at, kids:b.kids.slice(), open:false };
  });
  var queue = orders.slice(), active = [], delivered = 0, done = 0, guard = 0;

  function pull(){ return queue.length ? { sp:queue.shift(), need:NEED } : null; }
  for(var a=0;a<ACTIVE;a++) active.push(pull());
  function unlock(){
    for(var i=0;i<locked.length;i++){
      var L = locked[i]; if(L.open) continue;
      var v = (L.on === "done") ? done : delivered;
      if(v >= L.at){
        L.open = true;
        for(var k=0;k<L.kids.length;k++) avail[L.kids[k]]++;
      }
    }
  }
  unlock();
  while(guard++ < 500){
    var live = 0, moved = false;
    for(var i=0;i<active.length;i++){
      var o = active[i]; if(!o) continue;
      live++;
      if(avail[o.sp] > 0){
        avail[o.sp]--; o.need--; delivered++; moved = true;
        if(o.need <= 0){ done++; active[i] = pull(); }
        unlock();
        break;
      }
    }
    if(live === 0) return true;
    if(!moved) return false;
  }
  return false;
}
function pickMixed(tokens, elig, size){
  var chosen = [], seen = {}, i;
  for(i=0;i<elig.length && chosen.length<size;i++){
    var sp = tokens[elig[i]].sp;
    if(!seen[sp]){ seen[sp] = 1; chosen.push(elig[i]); }
  }
  for(i=0;i<elig.length && chosen.length<size;i++)
    if(chosen.indexOf(elig[i]) < 0) chosen.push(elig[i]);
  chosen.sort(function(a,b){ return b - a; });
  var out = [];
  for(i=0;i<chosen.length;i++) out.push(tokens.splice(chosen[i],1)[0].sp);
  return out;
}
function grassCount(n){
  if(n < 2) return 0;
  if(n < 5) return 1;
  if(n < 8) return 2;
  return 3;
}
function buildLevel(n){
  var cfg = cfgFor(n), attempt, i, k;
  var nb = basketCount(n), ng = grassCount(n);

  for(attempt=0; attempt<200; attempt++){
    /* Kullanilacak turler her bolumde rastgele secilir; kalanlar ziyaretci
       olur. Sabit bir alt kume secseydik ayni turler hep disarida kalirdi. */
    var pal = [];
    for(i=0;i<SPECIES.length;i++) pal.push(i);
    for(i=pal.length-1;i>0;i--){ var pj=rnd(i+1); var pt=pal[i]; pal[i]=pal[pj]; pal[pj]=pt; }
    var use = pal.slice(0, cfg.species), decoys = pal.slice(cfg.species);

    var orders = [];
    for(i=0;i<cfg.orders;i++) orders.push(use[i % cfg.species]);
    for(i=orders.length-1;i>0;i--){ var j=rnd(i+1); var t=orders[i]; orders[i]=orders[j]; orders[j]=t; }

    /* Tek örnekli bir türü 1. sıraya taşı — o tabela BAŞLANGIÇTA açık olur ve
       tamamı kilitlenince 🔒 gösterir. Takas jetonlardan ÖNCE yapılmalı,
       yoksa jetonların talep etiketi eskisiyle kalır. */
    var freq = {}, single = -1;
    for(i=0;i<orders.length;i++) freq[orders[i]] = (freq[orders[i]] || 0) + 1;
    for(i=1;i<orders.length;i++) if(freq[orders[i]] === 1){ single = i; break; }
    if(single > 1){ var sw = orders[1]; orders[1] = orders[single]; orders[single] = sw; }

    var tokens = [];
    for(i=0;i<orders.length;i++) for(k=0;k<NEED;k++) tokens.push({ sp:orders[i], oi:i });

    /* KİLİT BASKISI: bölüm ilerledikçe daha YAKIN taleplerin hayvanları
       kilitlenebilir. Böylece "açık talep, kafesteki/çimendeki hayvanı istiyor"
       durumu bilerek üretilir — oyuncu diğer talebi işleyip kilidi açmak zorunda.
       Çözülebilirlik garantisi solvable() benzetiminden geliyor. */
    var press = (n < 6) ? 0 : (n < 9 ? 1 : 2);
    var maxLock = Math.floor(tokens.length * 0.22);
    var baskets = [], locked = 0, made = 0, p, minOi, elig, size, take;

    /* HEDEFLİ KİLİT: bir türün TAMAMINI kilitle ki o talep açıldığında
       sahada tek örneği kalmasın — tabelada 🔒 çıkar, oyuncu diğer talebi
       işleyip sepeti açmak zorunda kalır. Sadece bir türde geçen talep
       seçilir; 0. talep asla seçilmez, yani başlangıçta hep işlenecek bir
       tabela kalır. Yanına geç taleplerden 1-2 hayvan katılır (karışık kalsın). */
    if(n >= 5 && nb > 0 && single > 0){
      {
        var tOi = 1, idx = [];
        for(i=0;i<tokens.length;i++) if(tokens[i].oi === tOi) idx.push(i);
        idx.sort(function(a,b){ return b - a; });
        var kids = [];
        for(i=0;i<idx.length;i++) kids.push(tokens.splice(idx[i],1)[0].sp);
        var extraE = [];
        for(i=0;i<tokens.length;i++) if(tokens[i].oi >= 2) extraE.push(i);
        kids = kids.concat(pickMixed(tokens, extraE, Math.min(1 + rnd(2), extraE.length)));
        for(i=kids.length-1;i>0;i--){ var q=rnd(i+1); var z=kids[i]; kids[i]=kids[q]; kids[q]=z; }
        baskets.push({ on:"deliver", at: NEED, kids: kids });
        locked += kids.length;
        made = 1;                       // hedefli sepet de sayıya dâhil
      }
    }

    /* Yer kalmadıysa DENEMEYİ ÇÖPE ATMA, sadece sepet eklemeyi bırak.
       Eskiden burada `continue` vardı ve 200 denemenin hepsi düşünce
       üretici konteynersiz yedeğe kaçıyordu — bölümler boşalıyordu. */
    for(p=made;p<nb;p++){
      minOi = Math.max(1, 2 + p - press); elig = [];
      for(i=0;i<tokens.length;i++) if(tokens[i].oi >= minOi) elig.push(i);
      size = Math.min(3 + rnd(3), elig.length, maxLock - locked);
      if(size < 3) break;
      take = pickMixed(tokens, elig, size);
      locked += take.length;
      baskets.push({ on:"deliver", at: NEED + p*NEED, kids: take });
    }

    /* ÇİMEN ÖBEKLERİ: bir talep tamamlandığında (3/3) açılırlar.
       Sepetlerden ayrı bir kapı — biri hıza, biri tamamlamaya bağlı. */
    var grass = [], gBudget = Math.floor(tokens.length / 8), gLock = 0;
    for(p=0;p<ng;p++){
      var at = 1 + p;
      minOi = Math.max(1, at + 1 - press); elig = [];
      for(i=0;i<tokens.length;i++) if(tokens[i].oi >= minOi) elig.push(i);
      size = Math.min(1 + rnd(3), elig.length, gBudget - gLock);
      if(size < 1) break;
      take = pickMixed(tokens, elig, size);
      gLock += take.length;
      grass.push({ on:"done", at: at, kids: take });
    }

    /* DALGALAR: kalan havuzun fazlasi disarida bekler. Her tamamlanan talepte
       3'u kenardan iceri girer. Gec taleplere ait jetonlar once beklemeye
       alinir ki erken talepler sahada karsilanabilsin. */
    tokens.sort(function(a,b){ return a.oi - b.oi; });
    var waves = [], keep = tokens;
    if(tokens.length > cfg.onScreen){
      keep = tokens.slice(0, cfg.onScreen);
      var rest = tokens.slice(cfg.onScreen);
      var groups = [];
      for(i=0;i<rest.length;i+=3){
        var kids2 = [];
        for(k=i;k<i+3 && k<rest.length;k++) kids2.push(rest[k].sp);
        groups.push(kids2);
      }
      /* Kapilar bolume YAYILIR. Arka arkaya 1,2,3 olsaydi butun bekleyenler
         ilk uc tamamlamada iceri girer, sonrasi bombos gecerdi. */
      for(i=0;i<groups.length;i++)
        waves.push({ on:"done",
                     at: Math.max(1, Math.round((i+1) * cfg.orders / (groups.length + 1))),
                     kids: groups[i] });
    }
    /* saha karisik gorunsun */
    for(i=keep.length-1;i>0;i--){ var kj=rnd(i+1); var kt=keep[i]; keep[i]=keep[kj]; keep[kj]=kt; }

    var free = [], counts = new Array(SPECIES.length).fill(0);
    for(i=0;i<keep.length;i++){ free.push(keep[i].sp); counts[keep[i].sp]++; }

    var chests = baskets.concat(grass).concat(waves);
    if(chests.length === 0 || solvable(orders, chests, counts))
      return { cfg:cfg, orders:orders, pool:free, baskets:baskets, grass:grass,
               waves:waves, decoys:decoys, tries:attempt+1 };
  }
  var o2 = [];
  for(i=0;i<cfg.orders;i++) o2.push(rnd(cfg.species));
  var p2 = [];
  for(i=0;i<o2.length;i++) for(k=0;k<NEED;k++) p2.push(o2[i]);
  return { cfg:cfg, orders:o2, pool:p2, baskets:[], grass:[], waves:[], decoys:[], tries:-1 };
}

/* ═══════════ durum ═══════════ */
var S = null, critters = [], crSeq = 0, raf = null, lastTs = 0, armed = false, levelGen = 0;
var visTimer = null;
var VIS_LIFE = 9;      // ziyaretci kac saniye dolasip sonra gidiyor

function startLevel(n){
  var L = buildLevel(n);
  S = {
    n:n, cfg:L.cfg, queue:L.orders.slice(),
    active:[], pens:new Array(PENS).fill(null),
    done:0, total:L.orders.length, over:null,
    delivered:0, frees:L.cfg.frees, decoys:L.decoys.slice(),
    baskets:L.baskets.map(function(b,i){
      return { id:i, at:b.at, kids:b.kids.slice(), open:false, el:null };
    }),
    grass:L.grass.map(function(b,i){
      return { id:i, at:b.at, kids:b.kids.slice(), open:false, el:null };
    }),
    waves:L.waves.map(function(b){
      return { at:b.at, kids:b.kids.slice(), open:false };
    })
  };
  levelGen++;
  for(var a=0;a<ACTIVE;a++) S.active.push(pullOrder(activeSpecies()));
  armed = false;
  el("danger").className = "danger";
  try{ localStorage.setItem(LS, String(n)); }catch(e){}

  if(visTimer){ clearTimeout(visTimer); visTimer = null; }
  decorateGlade();
  spawnCritters(L.pool);
  spawnBaskets();
  spawnGrass();
  renderAll();
  startAnim();
  scheduleVisitor();
}

/* ═══════════ ZİYARETÇİLER ═══════════
   Bölümde HİÇ sipariş edilmeyen türler kenardan girip karşıdan çıkar.
   Teslim edilemezler; dokunursan kafese girer ve ORADA KALIR — hiçbir talep
   onları serbest bırakmaz. Kalabalık artar, yanlış dokunuşun bedeli yükselir.
   Ayırt etme ipucu davranışta: yerleşikler duvardan seker, ziyaretçiler
   düz yürüyüp sahneden çıkar. */
function scheduleVisitor(){
  if(visTimer){ clearTimeout(visTimer); visTimer = null; }
  if(!S || S.over || !S.cfg.visMs || !S.decoys.length) return;
  var gen = levelGen;
  visTimer = setTimeout(function(){
    if(gen !== levelGen || !S || S.over) return;
    spawnVisitor();
    scheduleVisitor();
  }, S.cfg.visMs * (0.7 + Math.random()*0.6));
}
function spawnVisitor(){
  var live = 0, i;
  for(i=0;i<critters.length;i++) if(critters[i].visitor && !critters[i].taken) live++;
  if(live >= S.cfg.visMax) return;

  var box = gladeBox();
  var sp = S.decoys[rnd(S.decoys.length)];
  var fromLeft = Math.random() < 0.5;
  var c = addCritter(sp, fromLeft ? box.x - CR_W - 8 : box.x + box.w + 8, box.y + 40, true);
  c.visitor = true;
  c.seek = null;
  c.age = 0; c.entering = true; c.leaving = false;
  if(SPECIES[sp].home === "air"){
    c.y = box.y + box.h*AIR.topF +
          Math.random()*Math.max(20, box.h*(AIR.botF-AIR.topF) - CR_H);
  } else {
    c.home = "ground";                            // ağaç türü de yürüyerek geçer
    c.tier = rnd(TIERS.length);
    c.y = tierY(box, c.tier);
  }
  c.vx = (fromLeft ? 1 : -1) * (26 + Math.random()*16) * SPEED_MUL;
  c.vy = 0;
  if(c.el) c.el.style.zIndex = String(layerZ(c));
  place(c);
}
function dropCritter(i){
  var c = critters[i];
  if(c.el && c.el.parentNode) c.el.parentNode.removeChild(c.el);
  c.el = null;
  critters.splice(i, 1);
}

/* ═══════════ açıklık geometrisi ═══════════ */
function gladeBox(){
  var t = el("glade");
  var w = t.offsetWidth || 356, h = t.offsetHeight || 352;
  var x = t.offsetLeft, y = t.offsetTop;
  if(typeof x !== "number" || !isFinite(x)) x = 20;
  if(typeof y !== "number" || !isFinite(y)) y = 250;
  return { x:x, y:y, w:w, h:h };
}
/* Hayvanın ayakları terasın çim çizgisine bassın. */
function tierTop(box, t){ return box.h * TIERS[t].topF; }
function tierY(box, t){ return box.y + tierTop(box, t) + 7 - CR_H * TIERS[t].scale; }
function treeX(box, i){ return box.x + TREES[i].fx * box.w + TREES[i].w/2 - CR_W/2; }
function branchY(box, i){ return box.h * BRANCH_F - (i % 3) * 9; }

function homeSpot(box, c){
  var pad = 10;
  if(c.home === "air"){
    return { x: box.x + pad + Math.random()*(box.w - CR_W - pad*2),
             y: box.y + box.h*AIR.topF + Math.random()*Math.max(20, box.h*(AIR.botF-AIR.topF) - CR_H) };
  }
  if(c.home === "tree"){                     // daldan sarkar
    return { x: treeX(box, c.tree),
             y: box.y + branchY(box, c.tree) + 4 + Math.random()*48 };
  }
  return { x: box.x + pad + Math.random()*(box.w - CR_W - pad*2), y: tierY(box, c.tier) };
}

/* ═══════════ hayvanlar ═══════════ */
function addCritter(sp, atX, atY, isVisitor){
  var box = gladeBox();
  var c = {
    id: crSeq++, sp: sp, home: SPECIES[sp].home, taken: false,
    tier: rnd(TIERS.length), tree: rnd(TREES.length),
    vx: (Math.random()<0.5?-1:1) * (14 + Math.random()*22) * SPEED_MUL,
    vy: (Math.random()<0.5?-1:1) * (5 + Math.random()*10) * SPEED_MUL,
    ph: Math.random()*6.28, seek: null, el: null
  };
  var home = homeSpot(box, c);
  if(atX === undefined){ c.x = home.x; c.y = home.y; }
  else {
    c.x = atX; c.y = atY;
    c.seek = home;                       // sepetten/kafesten çıkan doğal yerine gider
  }
  if(c.home === "tree") c.vx = 0;
  var d = document.createElement("div");
  d.className = "critter" + (isVisitor ? " vis" : (atX === undefined ? "" : " born"));
  d.style.zIndex = String(c.seek ? 40 : layerZ(c));
  d.innerHTML = critterSVG(c.sp);
  (function(ci){ d.addEventListener("click", function(){ tapCritter(ci); }); })(c);
  el("field").appendChild(d);
  c.el = d;
  place(c);
  critters.push(c);
  return c;
}
function layerZ(c){
  if(c.home === "air")  return AIR.z;
  if(c.home === "tree") return TREE_Z;
  return TIERS[c.tier].z;
}
function critterScale(c){
  if(c.home === "air")  return 0.94;
  if(c.home === "tree") return 1.0;
  return TIERS[c.tier].scale;
}
function spawnCritters(pool){
  el("field").innerHTML = "";
  critters = []; crSeq = 0;
  var i, ground = 0;
  for(i=0;i<pool.length;i++){
    var c = addCritter(pool[i]);
    if(c.home === "ground"){ c.tier = ground++ % TIERS.length; }   // teraslara eşit dağıt
    if(c.home === "tree")   { c.tree = i % TREES.length; }
    var box = gladeBox(), h = homeSpot(box, c);
    c.x = h.x; c.y = h.y; c.seek = null;
    c.el.style.zIndex = String(layerZ(c));
    place(c);
  }
  spawnBushes();
}
function place(c){
  if(!c.el) return;
  var s = critterScale(c);
  /* Ciziimler SOLA bakiyor (burun/goz x ekseninin sol yarisinda). Bu yuzden
     sola giderken AYNALAMA YOK, saga giderken aynalanir. Tersi yazilmisti ve
     hayvanlar geri geri yuruyordu. */
  var dir = (c.home === "tree") ? 1 : (c.vx < 0 ? 1 : -1);
  c.el.style.transform = "translate(" + c.x.toFixed(1) + "px," + c.y.toFixed(1) + "px) scale(" +
    (dir * s).toFixed(3) + "," + s.toFixed(3) + ")";
}
/* Her yaşam alanının kendi hareketi var — hepsi aynı 2D süzülmeyi
   paylaştığında hayvanlar havada uçuyormuş gibi görünüyordu. */
function step(dt){
  var box = gladeBox(), pad = 6;
  for(var i=0;i<critters.length;i++){
    var c = critters[i];
    if(c.taken) continue;

    /* ZİYARETÇİ ÜÇ EVRE: kenardan girer, bir süre YERLEŞİK GİBİ dolaşır,
       sonra en yakın kenardan çıkar. Eskiden düz geçiyordu ve hem kalabalığa
       katkısı azdı hem de "düz gidiyorsa ziyaretçidir" diye bedava okunuyordu. */
    if(c.visitor){
      c.age += dt;
      if(c.entering){                             // sahneye giriyor
        c.ph += dt * 4.4;
        c.x += c.vx * dt;
        if(c.home === "air") c.y += Math.sin(c.ph) * 11 * dt;
        else c.y = tierY(box, c.tier) - Math.abs(Math.sin(c.ph)) * 4;
        if(c.x > box.x + 10 && c.x < box.x + box.w - CR_W - 10) c.entering = false;
        place(c); continue;
      }
      if(!c.leaving && c.age > VIS_LIFE){          // vakti doldu, kenara yönel
        c.leaving = true;
        var mid = box.x + box.w/2;
        c.vx = (c.x < mid ? -1 : 1) * (30 + Math.random()*14) * SPEED_MUL;
      }
      if(c.leaving){
        c.ph += dt * 4.4;
        c.x += c.vx * dt;
        if(c.home === "air") c.y += Math.sin(c.ph) * 11 * dt;
        else c.y = tierY(box, c.tier) - Math.abs(Math.sin(c.ph)) * 4;
        if(c.x < box.x - CR_W - 24 || c.x > box.x + box.w + 24){ dropCritter(i); i--; continue; }
        place(c); continue;
      }
      /* dolasma evresi: asagidaki yerlesik hareketine dusuyor */
    }

    if(c.seek){                                   // doğal yerine yöneliyor
      var dx = c.seek.x - c.x, dy = c.seek.y - c.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 3){
        c.seek = null;
        if(c.el) c.el.style.zIndex = String(layerZ(c));
      } else {
        var mv = Math.min(150 * dt, dist);
        c.x += dx/dist * mv; c.y += dy/dist * mv;
        if(c.home !== "tree") c.vx = (dx >= 0) ? Math.abs(c.vx) : -Math.abs(c.vx);
      }
      place(c);
      continue;
    }

    if(c.home === "ground"){                      // yürür: sadece yatay + zıplama
      var gy = tierY(box, c.tier);
      c.ph += dt * 5.2;
      c.x += c.vx * dt;
      c.y = gy - Math.abs(Math.sin(c.ph)) * 4;    // küçük sıçrama
      if(c.x < box.x + pad){ c.x = box.x + pad; c.vx = Math.abs(c.vx); }
      if(c.x > box.x + box.w - CR_W*TIERS[c.tier].scale - pad){
        c.x = box.x + box.w - CR_W*TIERS[c.tier].scale - pad; c.vx = -Math.abs(c.vx);
      }
    } else if(c.home === "air"){                  // uçar: serbest 2D
      c.ph += dt * 2.4;
      c.x += c.vx * dt;
      c.y += c.vy * dt + Math.sin(c.ph) * 12 * dt;
      if(c.x < box.x + pad){ c.x = box.x + pad; c.vx = Math.abs(c.vx); }
      if(c.x > box.x + box.w - CR_W - pad){ c.x = box.x + box.w - CR_W - pad; c.vx = -Math.abs(c.vx); }
      var aTop = box.y + box.h*AIR.topF, aBot = box.y + box.h*AIR.botF - CR_H;
      if(c.y < aTop){ c.y = aTop; c.vy = Math.abs(c.vy); }
      if(c.y > aBot){ c.y = aBot; c.vy = -Math.abs(c.vy); }
    } else {                                      // daldan sarkar: yavaş dikey
      c.x = treeX(box, c.tree);
      c.y += c.vy * 0.35 * dt;
      var hi = box.y + branchY(box, c.tree) + 2, lo = hi + 56;
      if(c.y < hi){ c.y = hi; c.vy = Math.abs(c.vy); }
      if(c.y > lo){ c.y = lo; c.vy = -Math.abs(c.vy); }
    }
    place(c);
  }
}
function startAnim(){
  if(typeof requestAnimationFrame !== "function") return;
  if(raf) cancelAnimationFrame(raf);
  lastTs = 0;
  raf = requestAnimationFrame(function loop(ts){
    raf = requestAnimationFrame(loop);
    if(!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if(S && !S.over) step(dt);
  });
}

/* ═══════════ dekor ═══════════ */
function decorateGlade(){
  var g = el("glade"), i, k, d;
  var gh = g.offsetHeight || 352;   /* CSS yuksekligi ile ayni kaynaktan */
  var old = g.querySelectorAll ? g.querySelectorAll(".trunk,.branch,.bank,.tuft,.spark,.basket") : [];
  for(k=0;k<old.length;k++) if(old[k].parentNode) old[k].parentNode.removeChild(old[k]);

  for(i=0;i<TREES.length;i++){                     // gövdeler: arkada, toprağa iner
    d = document.createElement("span"); d.className = "trunk";
    d.style.left = (TREES[i].fx * 100) + "%";
    d.style.width = TREES[i].w + "px";
    d.style.height = (TIERS[0].topF * 100 + 5) + "%";
    d.style.zIndex = "1";
    g.appendChild(d);

    d = document.createElement("span"); d.className = "branch";
    d.style.left = "calc(" + (TREES[i].fx * 100) + "% - " + (16 - i%3*4) + "px)";
    d.style.width = (TREES[i].w + 30) + "px";
    d.style.top = (gh * BRANCH_F - (i%3)*9) + "px";
    d.style.zIndex = "1";
    g.appendChild(d);
  }
  for(i=TIERS.length-1;i>=0;i--){                  // teraslar: arkadan öne
    var T = TIERS[i];
    d = document.createElement("span"); d.className = "bank";
    d.style.top = (T.topF * 100) + "%";
    d.style.bottom = "0";
    d.style.background = T.soil;
    d.style.zIndex = String(2 + (TIERS.length - i));
    d.innerHTML = '<span class="turf" style="background:'+T.turf+'"></span>';
    g.appendChild(d);
    for(k=0;k<16;k++){                             // çim tutamları
      var t = document.createElement("span"); t.className = "tuft";
      t.style.left = (2 + k*6.2 + rnd(3)) + "%";
      t.style.bottom = (gh - gh*T.topF - 2) + "px";
      t.style.height = (6 + rnd(11)) + "px";
      t.style.background = T.turf;
      t.style.zIndex = String(2 + (TIERS.length - i));
      t.style.animationDelay = (-k*0.27) + "s";
      g.appendChild(t);
    }
  }
  for(i=0;i<9;i++){                                // ateş böcekleri
    d = document.createElement("span"); d.className = "spark";
    var sz = 3 + rnd(3);
    d.style.left = (6 + rnd(88)) + "%";
    d.style.bottom = (40 + rnd(70)) + "px";
    d.style.width = sz + "px"; d.style.height = sz + "px";
    d.style.zIndex = "9";
    d.style.animationDuration = (9 + Math.random()*8) + "s";
    d.style.animationDelay = (-Math.random()*11) + "s";
    g.appendChild(d);
  }
}
/* Çalılar hayvanlarla AYNI katmanda durur: kendi terasındakini örter,
   öndekini örtmez. Görsel arama zorluğu buradan geliyor. */
function spawnBushes(){
  var box = gladeBox(), i;
  for(i=0;i<BUSHES.length;i++){
    var B = BUSHES[i], T = TIERS[B.tier];
    var d = document.createElement("span");
    d.className = "bush";
    d.style.width = B.w + "px"; d.style.height = B.h + "px";
    d.style.background = "linear-gradient(180deg," + T.turf + "," + T.soil + ")";
    d.style.zIndex = String(T.z + 1);
    d.style.transform = "translate(" + (box.x + B.fx*box.w) + "px," +
      (box.y + tierTop(box, B.tier) + 12 - B.h) + "px)";
    el("field").appendChild(d);
  }
}

/* ═══════════ çimen öbekleri ═══════════
   Bir talep TAMAMLANDIĞINDA (3/3) açılırlar: çimen yavaşça kıpırdar,
   gözler kaybolur, içindeki hayvanlar çıkıp yaşam alanlarına dağılır. */
function spawnGrass(){
  var box = gladeBox(), i;
  for(i=0;i<S.grass.length;i++){
    var g = S.grass[i], P = PATCH_SPOTS[i % PATCH_SPOTS.length], T = TIERS[P.tier];
    g.w = P.w; g.h = P.h;
    g.x = box.x + P.fx * box.w;
    g.y = box.y + tierTop(box, P.tier) + 12 - P.h;
    var d = document.createElement("span");
    d.className = "patch";
    d.style.width = P.w + "px"; d.style.height = P.h + "px";
    d.style.zIndex = String(T.z + 1);
    d.style.setProperty("--px", g.x.toFixed(1) + "px");
    d.style.setProperty("--py", g.y.toFixed(1) + "px");
    d.style.setProperty("--pt", T.turf);
    d.style.setProperty("--ps", T.soil);
    d.innerHTML = '<span class="blades"></span>' +
                  '<span class="eyes"><i></i><i></i></span>' +
                  '<span class="cnt">' + g.at + '</span>';
    el("field").appendChild(d);
    g.el = d;
  }
}
function openGrass(){
  for(var i=0;i<S.grass.length;i++){
    var g = S.grass[i];
    if(g.open) continue;
    if(S.done < g.at){
      if(g.el){
        var q = g.el.querySelector ? g.el.querySelector(".cnt") : null;
        if(q) q.textContent = String(g.at - S.done);
      }
      continue;
    }
    g.open = true;
    burstGrass(g);
  }
}
function burstGrass(g){
  var gen = levelGen;
  if(g.el){
    var node = g.el;
    node.className = "patch rustle";
    setTimeout(function(){
      if(gen !== levelGen) return;
      var e = node.querySelector ? node.querySelector(".eyes") : null;
      if(e && e.parentNode) e.parentNode.removeChild(e);
      var c = node.querySelector ? node.querySelector(".cnt") : null;
      if(c && c.parentNode) c.parentNode.removeChild(c);
      node.className = "patch";
    }, 1500);
    g.el = null;
  }
  /* hayvanlar tek tek, kıpırdanma sürerken çıksın */
  for(var k=0;k<g.kids.length;k++){
    (function(sp, i){
      setTimeout(function(){
        if(gen !== levelGen || !S || S.over) return;
        addCritter(sp, g.x + 4 + rnd(Math.max(6, g.w - 34)), g.y - 4);
        renderAll();                 // kilit işareti güncellensin
      }, 340 + i*240);
    })(g.kids[k], k);
  }
}

/* ═══════════ DALGALAR ═══════════
   Havuzun tamami baslangicta sahada degil. Her talep tamamlandiginda
   bekleyenlerden 3'u kenardan yurüyerek girer ve kendi yasam alanina gider.
   Aciklik hep okunabilir kalabalikta kalir; oyuncu her seyi bir anda gormez. */
function openWaves(){
  for(var i=0;i<S.waves.length;i++){
    var w = S.waves[i];
    if(w.open || S.done < w.at) continue;
    w.open = true;
    releaseWave(w);
  }
}
function releaseWave(w){
  var gen = levelGen, box = gladeBox();
  /* Dalgayla birlikte 1-2 ISE YARAMAZ hayvan da girsin. Yoksa kenardan gelen
     her hayvan mutlaka bir talebe yariyor ve secim kolaylasiyor. */
  var junk = 1 + rnd(2);
  for(var q=0;q<junk;q++)
    (function(d){ setTimeout(function(){
      if(d !== levelGen || !S || S.over) return;
      spawnVisitor();
    }, 300 + rnd(500)); })(gen);
  for(var k=0;k<w.kids.length;k++){
    (function(sp, i){
      setTimeout(function(){
        if(gen !== levelGen || !S || S.over) return;
        var b = gladeBox();
        var fromLeft = Math.random() < 0.5;
        addCritter(sp, fromLeft ? b.x - CR_W - 6 : b.x + b.w + 6,
                       b.y + b.h * 0.55 + rnd(40));
        renderAll();                       // kilit isareti guncellensin
      }, 220 + i*260);
    })(w.kids[k], k);
  }
}
function waitingCount(){
  var k = 0;
  for(var i=0;i<S.waves.length;i++) if(!S.waves[i].open) k += S.waves[i].kids.length;
  return k;
}

/* ═══════════ sepetler ═══════════ */
var BASKET_W = 58, BASKET_H = 48, BASKET_BOTTOM = 14;
function spawnBaskets(){
  var box = gladeBox(), i;
  var n = S.baskets.length;
  var cw = box.w - 4, ch = box.h - 4;            // açıklığın iç (content) kutusu
  for(i=0;i<n;i++){
    var b = S.baskets[i];
    var frac = (i + 1) / (n + 1);
    var lx = frac * cw - BASKET_W/2;
    /* Dünya koordinatı yalnızca patlama anında hayvan doğurmak için gerekli;
       sepetin KENDİ konumu ölçümden bağımsız (bottom ile zemine sabit). */
    b.x = box.x + 2 + lx;
    b.y = box.y + 2 + ch - BASKET_BOTTOM - BASKET_H;
    var peek = "";
    for(var k=0;k<b.kids.length;k++) peek += critterSVG(b.kids[k], 16, 13);
    var d = document.createElement("div");
    d.className = "basket";
    d.style.left = lx.toFixed(1) + "px";
    d.style.bottom = BASKET_BOTTOM + "px";
    d.innerHTML = '<span class="shadow"></span>' +
                  '<span class="weave"><span class="peek">' + peek + '</span></span>' +
                  '<span class="rim"></span><span class="lock"><b>' + b.at + '</b></span>';
    el("glade").appendChild(d);
    b.el = d;
  }
}
function openBaskets(){
  for(var i=0;i<S.baskets.length;i++){
    var b = S.baskets[i];
    if(b.open) continue;
    if(S.delivered < b.at){
      if(b.el){
        var q = b.el.querySelector("b");
        if(q) q.textContent = String(b.at - S.delivered);
      }
      continue;
    }
    b.open = true;
    burstBasket(b);
  }
}
function burstBasket(b){
  if(b.el){
    b.el.className = "basket burst";
    (function(node){ setTimeout(function(){
      if(node.parentNode) node.parentNode.removeChild(node);
    }, 520); })(b.el);
    b.el = null;
  }
  for(var k=0;k<b.kids.length;k++){
    addCritter(b.kids[k], b.x + 8 + rnd(44), b.y - 4 - rnd(24));
  }
}

/* ═══════════ kurallar ═══════════ */
function activeSpecies(){
  var out = [];
  for(var a=0;a<S.active.length;a++) if(S.active[a]) out.push(S.active[a].sp);
  return out;
}
function pullOrder(avoid){
  if(!S.queue.length) return null;
  var idx = 0;
  if(avoid && avoid.indexOf(S.queue[0]) >= 0){
    for(var i=1;i<S.queue.length;i++)
      if(avoid.indexOf(S.queue[i]) < 0){ idx = i; break; }
  }
  return { sp: S.queue.splice(idx,1)[0], need: NEED };
}
function completeOrder(a){
  S.done++;
  S.active[a] = null;
  S.active[a] = pullOrder(activeSpecies());
}
function freePen(){
  for(var i=0;i<PENS;i++) if(S.pens[i] === null) return i;
  return -1;
}
function usedPens(){
  var k = 0;
  for(var i=0;i<PENS;i++) if(S.pens[i] !== null) k++;
  return k;
}
function releaseFromPens(){
  var freed = [], guard = 0, changed = true;
  while(changed && guard++ < 80){
    changed = false;
    for(var a=0;a<S.active.length && !changed;a++){
      var o = S.active[a]; if(!o) continue;
      for(var i=0;i<PENS;i++){
        if(S.pens[i] === o.sp){
          S.pens[i] = null; freed.push(i);
          S.delivered++;
          if(--o.need <= 0) completeOrder(a);
          changed = true;
          break;
        }
      }
    }
  }
  return freed;
}
function matchIndex(sp){
  for(var a=0;a<S.active.length;a++) if(S.active[a] && S.active[a].sp === sp) return a;
  return -1;
}
/* Model ANINDA güncellenir, uçuş yalnızca animasyondur. */
function tapCritter(c){
  if(!S || S.over || c.taken) return;

  var a = matchIndex(c.sp);
  if(a >= 0){
    c.taken = true;
    var o = S.active[a];
    S.delivered++;
    if(--o.need <= 0) completeOrder(a);
    var freed = releaseFromPens();
    openBaskets();
    openGrass();
    openWaves();
    checkEnd();
    flyTo(c, orderTarget(a));
    renderAll(freed);
    return;
  }

  var pen = freePen();
  if(pen < 0){ denyFeedback(c); return; }
  c.taken = true;
  S.pens[pen] = c.sp;
  flyTo(c, penTarget(pen));
  if(usedPens() >= PENS){          // beşinci kafes dolduğu an biter
    S.over = "lose-pens";
    denyFeedback(c);
    flashDanger();
  }
  checkEnd();
  renderAll();
}
/* SALIVER: kafesteki hayvanı ormana geri bırakır. Sınırlı hak. */
function setFree(i){
  if(!S || S.over || !armed || S.frees <= 0) return;
  var sp = S.pens[i];
  if(sp === null) return;
  S.pens[i] = null;
  S.frees--;
  armed = false;
  var p = penTarget(i);
  addCritter(sp, p.x, p.y);
  renderAll();
}
function checkEnd(){
  if(S.over) return;
  for(var a=0;a<S.active.length;a++) if(S.active[a]) return;
  S.over = "win";
}

/* ═══════════ uçuş / geri bildirim ═══════════ */
function stagePos(node){
  var st = el("stage"), x = 0, y = 0, guard = 0;
  while(node && node !== st && guard++ < 20){
    x += node.offsetLeft || 0;
    y += node.offsetTop  || 0;
    node = node.offsetParent;
  }
  return { x:x, y:y };
}
function orderTarget(a){ return stagePos(el("ordPic" + a)); }
function penTarget(i){
  var s = el("pens").children[i];
  if(!s) return { x:0, y:0 };
  var p = stagePos(s);
  return { x:p.x + 2, y:p.y + 2 };
}
function flyTo(c, tgt){
  var d = c.el;
  if(!d) return;
  d.classList.add("fly");
  d.style.transform = "translate(" + tgt.x + "px," + tgt.y + "px) scale(.62)";
  d.style.opacity = "0";
  (function(node){ setTimeout(function(){
    if(node.parentNode) node.parentNode.removeChild(node);
  }, 420); })(d);
  c.el = null;
}
function denyFeedback(c){
  if(c.el){ c.el.classList.remove("deny"); void c.el.offsetWidth; c.el.classList.add("deny"); }
  var t = el("pens");
  t.classList.remove("deny"); void t.offsetWidth; t.classList.add("deny");
}
function flashDanger(){
  var d = el("danger");
  d.className = "danger"; void d.offsetWidth;
  d.className = "danger on";
  setTimeout(function(){ d.className = "danger"; }, 900);
}

/* ═══════════ çizim ═══════════ */
/* Sahada serbest gezen, henüz alınmamış hayvan sayısı. */
function freeCountOf(sp){
  var k = 0;
  for(var i=0;i<critters.length;i++)
    if(!critters[i].taken && critters[i].sp === sp) k++;
  return k;
}
function renderOrder(){
  for(var a=0;a<ACTIVE;a++){
    var o = S.active[a];
    var got = o ? (NEED - o.need) : 0;
    var shut = !!o && freeCountOf(o.sp) === 0;      // hepsi kilitli kapta
    el("ordPic" + a).innerHTML = o ? critterSVG(o.sp, 38, 31) : "";
    el("ordCap" + a).textContent = o ? SPECIES[o.sp].name : "—";
    el("ordCnt" + a).textContent = o ? (got + "/" + NEED) : "";
    el("ordLk" + a).textContent = shut ? "🔒" : "";
    el("ord" + a).className = "order" + (o ? "" : " empty") + (shut ? " locked" : "");
    var pips = el("ordPips" + a); pips.innerHTML = "";
    for(var i=0;i<NEED;i++){
      var p = document.createElement("i");
      if(o && i < got) p.className = "on";
      pips.appendChild(p);
    }
  }
}
function renderPens(freed){
  var t = el("pens"); t.innerHTML = "";
  var used = 0;
  for(var i=0;i<PENS;i++){
    var full = S.pens[i] !== null;
    var s = document.createElement("div");
    s.className = "pen" + (full ? " on" : "") + (full && armed ? " armed" : "");
    if(full){
      used++;
      s.innerHTML = '<span class="drop">' + critterSVG(S.pens[i], 34, 27) + '</span>' +
                    (armed ? '<span class="free">↩</span>' : '');
      if(armed) (function(k){ s.addEventListener("click", function(){ setFree(k); }); })(i);
    } else if(freed && freed.indexOf(i) >= 0){
      s.className += " freeing";
    }
    t.appendChild(s);
  }
  t.className = "pens" + (used >= PENS ? " full" : (used === PENS - 1 ? " warn" : ""));
}
function renderAll(freed){
  if(!S) return;
  var u = usedPens();
  el("hLv").textContent   = S.n;
  el("hOrd").textContent  = S.done + "/" + S.total;
  el("hPen").textContent  = u + "/" + PENS;
  el("hPenStat").className = "stat" + (u >= PENS - 1 ? " crit" : (u >= PENS - 2 ? " warn" : ""));
  var wait = waitingCount();
  el("fSeed").textContent = S.total + " talep" +
    (S.baskets.length ? " · " + S.baskets.length + " sepet" : "") +
    (S.grass.length ? " · " + S.grass.length + " çimen" : "") +
    (wait ? " · " + wait + " bekliyor" : "");
  var bf = el("bFree");
  bf.textContent = "↩ Salıver ×" + S.frees;
  bf.disabled = (S.frees <= 0 || u === 0 || !!S.over);
  bf.className = armed ? "armed" : "";
  renderOrder();
  renderPens(freed);
  if(S.over) setTimeout(showEnd, 420);
}

/* ═══════════ overlay ═══════════ */
function hideOverlay(){ var o = el("ovNode"); if(o && o.parentNode) o.parentNode.removeChild(o); }
function overlay(html, cls){
  hideOverlay();
  var d = document.createElement("div");
  d.className = "ov " + (cls || ""); d.id = "ovNode"; d.innerHTML = html;
  el("stage").appendChild(d);
  return d;
}
function showEnd(){
  if(!S || !S.over) return;
  var T = {
    "win":       ["🌲","Orman tamam","Bütün talepler karşılandı."],
    "lose-pens": ["🪵","Kafesler doldu","Beş kafes de doldu — yer kalmadı."]
  }[S.over];
  var win = S.over === "win";
  var d = overlay(
    '<div class="big">'+T[0]+'</div><h2>'+T[1]+'</h2>'+
    '<p class="sub">'+T[2]+'<br><b style="color:var(--ink)">'+S.done+'/'+S.total+'</b> talep</p>'+
    '<div class="ctrls">'+
      (win ? '<button class="go" data-a="next">Sonraki bölüm →</button>' : '')+
      '<button data-a="retry">⟲ Tekrar</button>'+
    '</div>');
  d.addEventListener("click", function(e){
    var a = e.target.getAttribute && e.target.getAttribute("data-a");
    if(!a) return;
    hideOverlay();
    if(a === "next")  startLevel(S.n + 1);
    if(a === "retry") startLevel(S.n);
  });
}
function showHelp(){
  var d = overlay(
    '<h2>Nasıl oynanır</h2>'+
    '<ol>'+
      '<li>Üstteki iki <b>ahşap tabela</b> hangi hayvanların istendiğini gösterir; her biri için <b>3 tane</b>.</li>'+
      '<li>Açıklıktaki <b>hayvana dokun</b>. İki talepten birine uyuyorsa tabelaya gider.</li>'+
      '<li>Uymuyorsa <b>5 bekleme kafesinden</b> birine girer. <b>Sırası gelince serbest kalır</b> ve talebe sayılır.</li>'+
      '<li>Her tür kendi yerinde yaşar: <b>yerdekiler üç terasta yürür</b>, <b>baykuş ve alakarga uçar</b>, '+
        '<b>tembel hayvan ağaca tutunur</b>. Nereye bakacağını bilmek işini hızlandırır.</li>'+
      '<li><b>Çalıların arkasına</b> giren hayvan geçici olarak görünmez — beklemen gerekebilir.</li>'+
      '<li>Topraktaki <b>örgü sepetlerde karışık türden 3–5 hayvan</b> bekler; üstündeki sayı kaç teslimat '+
        'gerektiğini söyler. Açılınca hayvanlar <b>kendi yaşam alanlarına</b> dağılır.</li>'+
      '<li>Uzun <b>çimen öbeklerinden iki göz</b> bakar. Bunlar <b>bir talebi tamamlayınca</b> (3/3) '+
        'kıpırdar ve içindeki hayvanlar çıkar. Üstündeki sayı kaç talep kaldığını gösterir.</li>'+
      '<li>Bir tabelada <b>🔒</b> görürsen o türün <b>tamamı kilitli</b> demektir. Diğer talebi işleyip '+
        'sepeti/çimeni aç ya da yeni hayvanların gelmesini bekle — bölüm her zaman çözülebilir.</li>'+
      '<li>Ormandaki hayvanların <b>hepsi baştan sahada değil</b>. Bir talebi tamamladıkça '+
        '<b>kenarlardan üçer hayvan</b> gelip yerlerine dağılır.</li>'+
      '<li><b>Ziyaretçiler:</b> kenarlardan girip karşıdan çıkan hayvanlar bu bölümde '+
        '<b>hiç istenmez</b>. Dokunursan kafese girer ve <b>bir daha çıkmaz</b>. '+
        'Ayırt etmek için davranışa bak: yerleşikler duvardan seker, ziyaretçiler düz yürüyüp gider.</li>'+
    '</ol>'+
    '<div class="box"><b style="color:var(--ink)">↩ Salıver</b><br>'+
      'Düğmeye bas, sonra bir kafese dokun: o hayvan ormana geri döner ve kafes boşalır. '+
      'Bölüm başına <b>sınırlı hakkın</b> var — hangisini bırakacağın gerçek bir karar.</div>'+
    '<div class="box" style="border-left-color:var(--bad)"><b style="color:var(--ink)">Kaybetme</b><br>'+
      '<b>Beş kafes dolduğu an bölüm biter.</b> Gelecek talepler gizli.</div>'+
    '<div class="ctrls"><button class="go" data-a="close">Anladım</button></div>', "help");
  d.addEventListener("click", function(e){
    if(e.target.getAttribute && e.target.getAttribute("data-a") === "close") hideOverlay();
  });
}

/* ═══════════ bağlama ═══════════ */
el("bFree").addEventListener("click", function(){
  if(!S || S.over || S.frees <= 0 || usedPens() === 0) return;
  armed = !armed;
  renderAll();
});
el("bReset").addEventListener("click", function(){ hideOverlay(); startLevel(S.n); });
el("bFirst").addEventListener("click", function(){ hideOverlay(); startLevel(1); });
el("bHelp").addEventListener("click", showHelp);
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ hideOverlay(); armed = false; if(S) renderAll(); }
});

var start = 1;
try{ var v = parseInt(localStorage.getItem(LS), 10); if(v > 0 && v < 200) start = v; }catch(e){}
startLevel(start);

var bt = el("boot");                 // buraya gelindiyse JS calisti
if(bt && bt.parentNode) bt.parentNode.removeChild(bt);
})();
</script>

<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dişli Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #3a1a2e; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
#app { position: relative; width: 100%; max-width: 480px; height: 100%; margin: 0 auto; overflow: hidden; background: #ffe9f2; touch-action: none; }
#cv { position: absolute; inset: 0; display: block; }
#ust { position: absolute; left: 0; right: 0; top: 0; padding: 12px 12px 0; display: flex; flex-direction: column; gap: 8px; z-index: 5; pointer-events: none; }
#baslik { text-align: center; font-family: 'Lilita One', sans-serif; font-size: 26px; color: #c2185b; text-shadow: 0 3px 0 #fff, 0 5px 0 rgba(194,24,91,.25); letter-spacing: .5px; }
#bolAd { text-align: center; font-weight: 900; color: #8a3a62; font-size: 14px; margin-top: -6px; }
.satir { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pil { background: #fff; border-radius: 999px; padding: 4px 12px; font-weight: 900; color: #7a2a52; box-shadow: 0 3px 0 rgba(194,24,91,.25); display: flex; align-items: center; gap: 6px; font-size: 15px; }
.pil small { opacity: .6; font-size: 12px; } #hamle b { font-family: 'Lilita One'; font-weight: 400; font-size: 18px; color: #c2185b; }
#canlar span { color: #ff3a6a; font-size: 18px; } #canlar span.bos { color: #e8c8d4; }
.dugmeler { display: flex; gap: 6px; pointer-events: auto; }
.dugmeler button { border: 0; background: linear-gradient(#ff7ab0, #e84a8a); color: #fff; font-family: 'Lilita One', sans-serif; font-size: 18px; border-radius: 14px; padding: 4px 12px; box-shadow: 0 4px 0 #a82a62; }
.dugmeler button small { font-family: 'Nunito'; font-weight: 900; font-size: 12px; } .dugmeler button.pasif { opacity: .45; }
#yildizIp { font-size: 12px; }
.satir.sag { justify-content: flex-start; gap: 6px; pointer-events: auto; margin-top: -2px; } .kucukB { border: 0; background: rgba(255,255,255,.85); border-radius: 12px; width: 36px; height: 32px; font-size: 16px; box-shadow: 0 3px 0 rgba(194,24,91,.25); }
#menu { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(rgba(255,228,240,.82), rgba(255,243,220,.9)); backdrop-filter: blur(2px); padding: 14px; }
#menu.gizli { display: none; }
.logo { font-family: 'Lilita One', sans-serif; font-size: 52px; line-height: .95; text-align: center; color: #ff4d8d; text-shadow: 0 4px 0 #fff, 0 8px 0 #c2185b, 0 12px 18px rgba(194,24,91,.35); transform: rotate(-3deg); animation: gel .7s cubic-bezier(.3,1.6,.5,1); }
.altBaslik { font-weight: 900; color: #8a3a62; margin-top: 2px; }
.menuMakine { width: 84px; filter: drop-shadow(0 8px 10px rgba(120,30,70,.3)); animation: zipla 1.6s ease-in-out infinite; }
@keyframes zipla { 50% { transform: translateY(-8px) rotate(2deg); } }
.harita { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100%, 380px); }
.bolB { border: 0; border-radius: 16px; padding: 5px 4px 4px; background: linear-gradient(#fff, #ffe0ee); box-shadow: 0 4px 0 #e0a0c0; font-family: inherit; color: #8a3a62; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bolB b { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 22px; color: #e91e63; } .bolB small { font-weight: 800; font-size: 11px; line-height: 1.15; min-height: 26px; }
.bolB .yz i { color: #e8c8d4; font-style: normal; font-size: 14px; } .bolB .yz i.d { color: #ffc400; text-shadow: 0 1px 0 #b88200; }
.bolB.simdi { outline: 3px solid #ff4d8d; } .bolB.kilitli { opacity: .55; filter: grayscale(.6); } .bolB.salla { animation: salla .35s; }
@keyframes salla { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
#guclar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; display: flex; gap: 12px; }
.guc { position: relative; width: 82px; height: 74px; border: 0; border-radius: 20px; background: linear-gradient(#fff, #ffe0ee); box-shadow: 0 5px 0 #e0a0c0, 0 8px 14px rgba(160,40,90,.18); font-family: inherit; color: #8a3a62; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.guc .gi { font-size: 30px; line-height: 1; } .guc small { font-weight: 900; font-size: 11.5px; }
.guc b { position: absolute; top: -7px; right: -7px; min-width: 26px; height: 26px; border-radius: 13px; background: #ff3a7a; color: #fff; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 15px; line-height: 26px; box-shadow: 0 2px 0 #a81a4a; border: 2px solid #fff; }
.guc.bos b { background: #34c868; box-shadow: 0 2px 0 #127a3a; } .guc.pasif { opacity: .5; }
.guc.secili { background: linear-gradient(#fff6c0, #ffd84a); box-shadow: 0 5px 0 #c89a00, 0 0 0 4px #fff, 0 0 22px #ffd23a; transform: translateY(-4px); }
.guc.bump { animation: bump .4s cubic-bezier(.3,1.8,.5,1); } .guc.salla { animation: salla .35s; } .guc:active { transform: scale(.92); }
.odul { font-family: 'Lilita One', sans-serif; font-weight: 400 !important; font-size: 20px !important; color: #ffe14a; text-shadow: 0 2px 0 #a06a00; }
#ip { position: absolute; left: 50%; bottom: 102px; transform: translateX(-50%); width: min(92%, 400px); background: rgba(255,255,255,.96); color: #6a2a4a; border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 15px; text-align: center; box-shadow: 0 5px 0 rgba(194,24,91,.25); z-index: 6; pointer-events: none; transition: opacity .3s; }
#ip b { color: #c2185b; } #ip.gizli { opacity: 0; }
#kart { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(60,20,45,.55); backdrop-filter: blur(3px); color: #fff; text-align: center; }
#kart.gizli { display: none; }
#kart h1 { margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 46px; color: #fff; text-shadow: 0 4px 0 #c2185b; animation: gel .5s cubic-bezier(.3,1.6,.5,1); }
#kart p { margin: 0; font-weight: 900; font-size: 16px; }
.yildiz span { font-size: 54px; color: rgba(255,255,255,.3); display: inline-block; } .yildiz span.dolu { color: #ffd23a; text-shadow: 0 4px 0 #c08a00; animation: gel .5s cubic-bezier(.3,1.8,.5,1) both; }
.btn { border: 0; background: linear-gradient(#5ee88a, #22b85a); color: #fff; font-family: 'Lilita One', sans-serif; font-size: 22px; border-radius: 18px; padding: 10px 26px; box-shadow: 0 5px 0 #127a3a; margin-top: 4px; }
.btn.ikincil { background: linear-gradient(#fff, #f0d8e4); color: #8a3a62; box-shadow: 0 5px 0 #c8a0b4; font-size: 17px; padding: 8px 20px; }
@keyframes gel { from { transform: scale(.2); opacity: 0; } }
#hamle.bump b { display: inline-block; animation: bump .35s cubic-bezier(.3,1.8,.5,1); } @keyframes bump { 40% { transform: scale(1.45); } }
#canlar.kir { animation: kir .4s; } @keyframes kir { 20% { transform: translateX(-7px) rotate(-4deg); } 50% { transform: translateX(7px) rotate(4deg); } 80% { transform: translateX(-3px); } }
.btn:active, .dugmeler button:active, .kucukB:active, .bolB:active { transform: scale(.92); }

#el { position: absolute; z-index: 7; font-size: 46px; pointer-events: none; margin: -8px 0 0 -18px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); animation: elDok .9s ease-in-out infinite; }
#el.gizli { display: none; } @keyframes elDok { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(12px) scale(.86); } }
#kart.yeni { gap: 6px; } .yeniRozet { background: #ff3a7a; color: #fff; font-family: 'Lilita One', sans-serif; font-size: 18px; padding: 3px 14px; border-radius: 999px; box-shadow: 0 3px 0 #a81a4a; animation: gel .4s cubic-bezier(.3,1.8,.5,1); }
.yeniIkon { font-size: 76px; line-height: 1.1; animation: gel .6s .1s cubic-bezier(.3,1.8,.5,1) both; filter: drop-shadow(0 6px 0 rgba(0,0,0,.2)); }
#kart h2 { margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 34px; text-shadow: 0 3px 0 #c2185b; }
.yeniMetin { max-width: 300px; font-weight: 800 !important; font-size: 16px !important; line-height: 1.4; background: rgba(255,255,255,.12); border-radius: 14px; padding: 10px 14px !important; } .yeniMetin b { color: #ffe14a; }

</style></head><body>

<div id="ust"><div id="baslik">Dişli Atölyesi</div><div id="bolAd"></div>

<div id="guclar"><button class="guc" id="gTek"><span class="gi">⚙️</span><small>Tek Dişli</small><b></b></button><button class="guc" id="gMik"><span class="gi">🧲</span><small>Mıknatıs</small><b></b></button><button class="guc" id="gGeri"><span class="gi">↶</span><small>Geri Al</small><b></b></button></div><div id="ip" class="gizli"></div><div id="el" class="gizli">👆</div><div id="kart" class="gizli"></div><div id="menu" class="gizli"></div></div>

<script>
// Disli Atolyesi — mantik. Tugla dizilisli disliler; her dislide 4 capraz yuva: 0=sag ust, 1=sag alt, 2=sol alt, 3=sol ust.
// Saat yonu (yon=+1): yuva i -> i+1. Alt yuvaya (1 ya da 2) gelen bilye duser: 1 -> sag alt seride, 2 -> sol alt seride.
// Seritler tam sayi: disli merkezi c; alt satirdaki komsular c-1 ve c+1. Ayni satirda |dc|=2 olan disliler birbirine degerek doner (zit yon).
// Dusen bilye seritte asagi iner: o seritte merkezi olan ilk dislinin ust yuvasina (soldan gelen -> sol ust 3, sagdan gelen -> sag ust 0) girer;
// yuva doluysa kendi yuvasinda takili kalir. Hic disli yoksa en alttaki kavanoza duser: renk tutarsa toplanir, tutmazsa hata (can).
// ENGELLER (disli ops): kilit:N (N sakiz toplanana kadar tum treni kilitler), cirt:+1/-1 (yalniz o yone doner; tren ters dusurse takilir),
//   hizli:true (180 derece doner). Kapi: [serit, r, renk] satir r'nin hemen altinda; o serit boyunca yalniz o renk gecer.
//   Bomba sakiz: 'renk*N' — her hamlede N azalir; 0 olunca patlar (can).
const DZ = (() => {
  const RENK = ['kirmizi', 'mavi', 'sari', 'yesil', 'mor', 'turuncu'];
  const renkOf = m => m ? m.split('*')[0] : null, sayac = m => m && m.includes('*') ? +m.split('*')[1] : null;
  function yeni(B) {
    const st = { disli: B.disli.map((d, i) => ({ id: i, r: d[0], c: d[1], s: (d[2] || [null, null, null, null]).slice(), ...(d[3] || {}) })),

<script>
/* <<<MANTIK>>> */
/* Burger Kulesi oyun mantigi — DOM'a dokunmaz; harness botlarla calistirir.
   Tabaklarda malzeme yiginlari var (alttan uste), sadece en ustteki alinabilir. Montaj tezgahlarinda birer siparis
   burger kurulur: tarif alttan uste sirali (alt ekmek ... ust ekmek). Hamleler:
   - montaj: tabagin ustundeki malzeme, bir tezgahtaki burgerin siradaki malzemesiyse oraya konur
   - park: tabagin ustundeki malzeme, yeri olan baska tabaga konur
   Burger tamamlaninca teslim edilir, tezgaha siradaki siparis gelir. Kazanma: tum siparisler teslim. Kayip: hamle biter
   ya da gecerli hamle kalmaz. Level uretimi: malzemeler karistirilip tabaklara dagitilir, cozucu (BFS) cozulebilirligi ve
   en kisa hamle sayisini bulur; hamle hakki = en kisa + pay. */
const MALZEME = { A: 'Alt ekmek', K: 'Köfte', P: 'Peynir', M: 'Marul', D: 'Domates', U: 'Üst ekmek', S: 'Soğan' };
const TARIFLER = {
  sade: 'AKU', peynirli: 'AKPU', marullu: 'AMKU', klasik: 'AKPMU', domatesli: 'AKDMU', duble: 'AKKPU', ozel: 'AMKDPU', soganli: 'AKSPU',
};
// siparis: TARIFLER adi ya da dogrudan malzeme dizisi (alttan uste). Burgerler level ilerledikce devlesir (fizik: devrilebilir)
const LEVELLER = [
  { tabak: 3, kap: 5, tezgah: 1, siparis: ['AKPU', 'AKPMU'], pay: 8, tohum: 3, en: 10, ilkHazir: true },
  { tabak: 4, kap: 5, tezgah: 1, siparis: ['AKPKPU', 'AMKDU'], pay: 8, tohum: 1, en: 14 },
  { tabak: 4, kap: 6, tezgah: 1, siparis: ['AKPKPMU', 'AKDKPU'], pay: 8, tohum: 1, en: 16 },
  { tabak: 5, kap: 6, tezgah: 2, siparis: ['AKPKPU', 'AMKMKU', 'AKDPKU'], pay: 8, tohum: 1, en: 20 },
  { tabak: 5, kap: 7, tezgah: 1, siparis: ['AKPKPKPMDU', 'AKMKMU'], pay: 8, tohum: 1, en: 18 },
  { tabak: 6, kap: 7, tezgah: 2, siparis: ['AKPMKPMKPU', 'AKDKDKU', 'AKPKPU'], pay: 8, tohum: 1, en: 26 },
  { tabak: 6, kap: 8, tezgah: 1, siparis: ['AKPKPKPKPMDMDU', 'AKPU'], pay: 8, tohum: 1, en: 25 },
  { tabak: 6, kap: 9, tezgah: 1, siparis: ['AKPKPMKPKDMKPKPMDU'], pay: 10, tohum: 1, en: 19 },
];

/* ---- FIZIK: burger kulesi dengesi. x burger eni biriminde (0 = tahta ortasi), yukseklik KALINLIK/100 eni.
   Birakilan malzeme ustteki katin (salinimli) konumuna gore sapma d ile iner; ortadan uzak inerse kayar.
   Her arayuzde ustteki katlarin agirlik merkezi alttaki ile ortusen destek araliginin disina cikarsa o kattan yukarisi devrilir.
   Kule yukseldikce ve dengesizlestikce sallanir: dogru yere birakmak zorlasir. Montaj h.x verilmezse fizik yok (cozucu). */
const KALINLIK = { A: 17, K: 16, P: 7, M: 9, D: 9, U: 26, S: 7 };
const FIZIK = {
  en: { A: 1, U: 1, K: 0.94, P: 1.04, M: 1.1, D: 0.9, S: 0.92 },
  agirlik: { A: 0.7, U: 0.8, K: 1.6, P: 0.9, M: 0.4, D: 0.7, S: 0.5 },
  kaygan: { A: 0.2, U: 0.2, K: 0.4, P: 0.7, M: 0.5, D: 0.8, S: 0.6 },
  kaymaEsik: 0.14,      // bu sapmaya kadar oturur
  maxSapma: 0.75,       // daha disari birakilamaz
  salinimTaban: 4,      // bu kattan sonra sallanmaya baslar
  salinimKat: 0.024,    // ek kat basina tepe genligi (en birimi)
  salinimDengesiz: 0.3, // tum kulenin agirlik merkezi kaymasi basina ek genlik
  periyot: 1.7,
  destekPay: 0.1,       // yumusak malzeme: destek araligi her yandan bu kadar daralir
  maxKayik: 0.4,        // bir kat alttakinden bu kadar kayiksa kayip duser
  sarsSonum: 1.1,       // firlatma carpmasinin ek salinimi saniyede bu hizla soner
  sarsMax: 0.35,
};
/* ---- TERAZI: iki burger cubugun (pivot) ustundeki tahtanin uclarinda. aci > 0: sag taraf asagi.
   Tork = agirlik * (konum - pivot) (en birimi). Denge acisi = tork / K; tahta bu aciya sonumlu salinimla gider.
   Her inis burgerin tarafina acisal hiz darbesi ekler (guclu atis daha cok). Burger yenince agirligi aniden kalkar.
   Aci limit'i asarsa burgerler kayar: kayip. Seviye uretimi statik dengeyi (guvenli) gozetir. */
const TERAZI = { kol: 1.05, K: 360, periyot: 1.15, zeta: 0.2, limit: 0.26, guvenli: 0.19, tahtaKutle: 60, darbe: 0.008, asim: 0.6 };   // asim: denge sicramasinin salinimla asilma payi (cozucu tahmini)
// siparis: iki burger ortak kuyruktan beslenir. terazi.pivot: cubugun tahta ortasina gore yeri (en), yukler: sabit agirliklar (ketcap sisesi)
const TERAZI_LEVELLER = [
  { tabak: 3, kap: 5, tezgah: 2, siparis: ['AKU', 'AKU'], pay: 6, tohum: 1, en: 6, ilkHazir: true, terazi: { pivot: 0, yukler: [] } },
  { tabak: 4, kap: 5, tezgah: 2, siparis: ['AKPKU', 'AKU', 'AKPU'], pay: 6, tohum: 1, en: 15, terazi: { pivot: 0, yukler: [] } },
  { tabak: 4, kap: 6, tezgah: 2, siparis: ['AKPMU', 'AKPU', 'AKMU'], pay: 6, tohum: 1, en: 15, terazi: { pivot: 0, yukler: [{ x: -1.75, w: 20 }] } },
  { tabak: 4, kap: 5, tezgah: 2, siparis: ['AKKU', 'AKPU', 'AKU'], pay: 6, tohum: 1, en: 14, terazi: { pivot: 0.22, yukler: [] } },
  { tabak: 5, kap: 6, tezgah: 2, siparis: ['AKPKPU', 'AKPKU', 'AKPU', 'AKU'], pay: 7, tohum: 1, en: 18, terazi: { pivot: -0.2, yukler: [] } },
  { tabak: 5, kap: 7, tezgah: 2, siparis: ['AKPKU', 'AKDKU', 'AKPU', 'AKMU'], pay: 7, tohum: 1, en: 19, terazi: { pivot: 0.15, yukler: [{ x: -1.75, w: 16 }] } },
];
const katAgirlik = m => FIZIK.en[m] * FIZIK.agirlik[m] * KALINLIK[m];
function teraziTork(S) {
  const T = S.terazi; let tork = TERAZI.tahtaKutle * (0 - T.pivot);
  for (const y of T.yukler) tork += y.w * (y.x - T.pivot);
  // agirlik tarif ilerlemesinden (cozucu konumsuz montaj yapar); konum biliniyorsa katin kaymasi da sayilir
  S.tezgahlar.forEach((z, k) => { if (!z) return; const sx = (k === 0 ? -1 : 1) * TERAZI.kol, katlar = S.kuleler[k] ? S.kuleler[k].katlar : [];
    for (let i = 0; i < z.ilerleme; i++) tork += katAgirlik(z.tarif[i]) * (sx + (katlar[i] ? katlar[i].x : 0) - T.pivot); });
  return tork;
}
const teraziDenge = S => teraziTork(S) / TERAZI.K;
// t anindaki aci ve acisal hiz (son olaydan beri kapali cozum)
function teraziAci(S, t) {
  const T = S.terazi, w = 2 * Math.PI / TERAZI.periyot, z = TERAZI.zeta, wd = w * Math.sqrt(1 - z * z), dt = Math.max(0, t - T.t0);
  const c1 = T.aci0 - T.denge, c2 = (T.hiz0 + z * w * c1) / wd, e = Math.exp(-z * w * dt), co = Math.cos(wd * dt), si = Math.sin(wd * dt);
  return { aci: T.denge + e * (c1 * co + c2 * si), hiz: e * (-z * w * (c1 * co + c2 * si) + wd * (-c1 * si + c2 * co)) };
}
function teraziOlay(S, t, darbe) { const T = S.terazi, q = teraziAci(S, t); T.aci0 = q.aci; T.hiz0 = q.hiz + (darbe || 0); T.t0 = t; T.denge = teraziDenge(S); }
// son olaydan t'ye kadar limit asildi mi: ilk asilma ani ya da -1
function teraziTasti(S, t) { const T = S.terazi; for (let u = T.t0; u <= t + 1e-9; u += 0.02) if (Math.abs(teraziAci(S, u).aci) > TERAZI.limit) return u; return -1; }
function teraziKontrol(S, t) {
  if (!S.terazi || S.bitti) return false;
  const u = teraziTasti(S, t); if (u < 0) return false;
  S.bitti = true; S.neden = 'terazi'; olay(S, { tur: 'terazi', t: u, yon: Math.sign(teraziAci(S, u).aci) }); olay(S, { tur: 'bitti', neden: 'terazi' }); return true;
}
function kuleYeni(tohum) { return { katlar: [], faz: ((tohum >>> 0) % 628) / 100 }; }
function kuleYukseklik(kule, n) { let h = 0; const k = kule.katlar; for (let i = 0; i < (n == null ? k.length : n); i++) h += KALINLIK[k[i].m] / 100; return h; }
function kuleAgirlikX(katlar) { let M = 0, MX = 0; for (const k of katlar) { const w = FIZIK.en[k.m] * FIZIK.agirlik[k.m] * KALINLIK[k.m]; M += w; MX += w * k.x; } return M ? MX / M : 0; }
function kuleSars(kule, t) { const q = kule.sars; if (!q || t == null || t < q.t) return 0; return q.a * Math.exp(-(t - q.t) * FIZIK.sarsSonum); }
function kuleGenlik(kule, t) { const n = kule.katlar.length; if (n < 2) return 0; return Math.max(0, n - FIZIK.salinimTaban) * FIZIK.salinimKat + Math.abs(kuleAgirlikX(kule.katlar.slice(1)) - kule.katlar[0].x) * FIZIK.salinimDengesiz * Math.min(1, n / 8) + kuleSars(kule, t); }
// h yuksekligindeki noktanin t anindaki yatay salinimi
function kuleSalinim(kule, t, h) { const H = kuleYukseklik(kule); if (H <= 0) return 0; return kuleGenlik(kule, t) * Math.pow(Math.min(1, h / H), 1.5) * Math.sin(t * 2 * Math.PI / FIZIK.periyot + kule.faz); }
// denge: devrilen = devrilen en alt katin indisi (-1 yok), marj = en kritik arayuzun kenara uzakligi (1 tam orta, <0 devrik)
function kuleDenge(katlar) {
  let M = 0, MX = 0, marj = 1, kritik = -1, devrilen = -1;
  for (let i = katlar.length - 1; i >= 1; i--) {
    const k = katlar[i], a = katlar[i - 1], w = FIZIK.en[k.m] * FIZIK.agirlik[k.m] * KALINLIK[k.m]; M += w; MX += w * k.x;
    const cx = MX / M, lo = Math.max(k.x - FIZIK.en[k.m] / 2, a.x - FIZIK.en[a.m] / 2) + FIZIK.destekPay, hi = Math.min(k.x + FIZIK.en[k.m] / 2, a.x + FIZIK.en[a.m] / 2) - FIZIK.destekPay;
    let mj = hi <= lo ? -1 : Math.min(cx - lo, hi - cx) / 0.5;
    mj = Math.min(mj, (FIZIK.maxKayik - Math.abs(k.x - a.x)) / 0.5);
    if (mj < marj) { marj = mj; kritik = i; }
    if (mj < 0) devrilen = i;
  }
  return { marj, kritik, devrilen };
}
// xEkran: ekranda birakilan nokta (salinim dahil). kuru: kuleyi degistirme (onizleme)
// itme (firlatma): { kayma: inen katin ek yana kaymasi (en birimi), sars: kuleye eklenen salinim genligi }
function kuleBirak(kule, m, xEkran, t, kuru, itme) {
  const n = kule.katlar.length, H = kuleYukseklik(kule);
  let x, d = 0, kayma = 0;
  const ik = itme ? itme.kayma || 0 : 0;
  if (!n) x = Math.max(-0.45, Math.min(0.45, Math.max(-0.35, Math.min(0.35, xEkran)) + ik * 0.5));   // tahtaya: genis, az kayar
  else {
    const alt = kule.katlar[n - 1];
    d = Math.max(-FIZIK.maxSapma, Math.min(FIZIK.maxSapma, xEkran - kuleSalinim(kule, t, H) - alt.x));
    const e = Math.abs(d) - FIZIK.kaymaEsik;
    if (e > 0) kayma = Math.sign(d) * e * (FIZIK.kaygan[m] + FIZIK.kaygan[alt.m]) / 2 * 1.2;
    kayma += ik;
    x = alt.x + d + kayma;
  }
  const katlar = kule.katlar.concat([{ m, x }]), dn = kuleDenge(katlar);
  if (!kuru) { kule.katlar = katlar; if (itme && itme.sars > 0) kule.sars = { a: Math.min(FIZIK.sarsMax, kuleSars(kule, t) + itme.sars), t }; }
  return { x, d, kayma, devrilen: dn.devrilen, marj: dn.marj, kritik: dn.kritik };
}

function rnd(S) { S.rs = (S.rs + 0x6D2B79F5) >>> 0; let t = S.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function karistir(S, d) { for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; }

function levelKur(p, tohum) {

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tüp Fabrikası</title>
<style>
:root{
  --bg:#141019;
  --panel:#1E1828;
  --panel2:#272034;
  --ink:#EFE9F7;
  --ink-soft:#9C92B0;
  --ink-dim:#6D6484;
  --line:#372E4A;
  --steel:#544A70;
  --steel2:#3A3250;
  --accent:#F5C451;
  --ok:#5FBE55;
  --bad:#E4574C;
  --shadow:0 22px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* mobil: cift dokunusta yakinlasma, metin secimi ve mavi vurgu oyunu bozuyor */
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  background-image:
    radial-gradient(900px 500px at 50% -10%, rgba(122,96,180,.18), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 46px);
}
#app{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
  padding:14px 10px 32px}
.stage{
  width:min(400px,100%);background:var(--panel);
  border:1px solid var(--line);border-radius:20px;
  padding:14px 20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.045), transparent 30%);
}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.lv{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);line-height:1.5}
.lv b{display:block;color:var(--accent);font-size:19px;letter-spacing:0;font-variant-numeric:tabular-nums}
.stat{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);text-align:right;line-height:1.5}
.stat b{display:block;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.hearts{font-size:13px;letter-spacing:3px;line-height:1.7}
.hearts .on{color:var(--bad)}
.hearts .off{color:var(--steel2)}

/* ---------- geri sayım ---------- */
/* Sayı ASIL göstergedir: ince bir çubuk "timer" gibi okunmuyordu, oyuncular
   ekranda süre arıyordu. Çubuk saniye altı akışı verir, sayı gerginliği. */
.stat.clock{text-align:center}
.stat.clock b{font-size:22px;letter-spacing:-.02em;transition:color .3s ease;transform-origin:center}
.stat.clock.idle b{color:var(--ink-dim)}
.stat.clock.warn b{color:var(--accent)}
.stat.clock.crit b{color:var(--bad)}
.stat.clock b.tick{animation:tickPop .3s ease-out}
@keyframes tickPop{0%{transform:scale(1.4)}70%{transform:scale(.97)}100%{transform:scale(1)}}

.timer{height:4px;border-radius:3px;background:var(--steel2);margin-top:9px;overflow:hidden}
.timer span{display:block;height:100%;width:100%;border-radius:3px;background:var(--ok);
  transition:width .12s linear, background .5s ease}
.timer.warn span{background:var(--accent)}
.timer.crit span{background:var(--bad)}
.timer.idle span{background:var(--steel)}

/* SÜRE UYARISI: son 10 sn'de ekran kenarı kırmızı yanıp söner, son 5'te hızlanır.
   Sınıf yalnızca seviye DEĞİŞİNCE yazılır — her karede yazılsa animasyon
   sürekli baştan başlar ve hiç yanıp sönmez. */
.danger{position:absolute;inset:0;pointer-events:none;z-index:14;opacity:0;border-radius:20px;
  box-shadow:inset 0 0 58px 11px rgba(228,87,76,.62)}
.danger.on{animation:dangerPulse 1.05s ease-in-out infinite}
.danger.on.fast{animation-duration:.48s;box-shadow:inset 0 0 70px 16px rgba(228,87,76,.78)}
@keyframes dangerPulse{0%,100%{opacity:0}45%{opacity:1}}

/* ---------- rezervuar ---------- */
.res-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 0 0}
.res{
  width:72px;height:152px;position:relative;padding:5px;
  border:3px solid var(--steel);border-radius:12px 12px 5px 5px;
  background:rgba(0,0,0,.32) linear-gradient(90deg,rgba(255,255,255,.09) 0 6px,transparent 6px 100%);
  display:flex;flex-direction:column-reverse;gap:2px;overflow:hidden;
}
.res .u{height:19px;border-radius:3px;flex:0 0 auto;position:relative}
.res .u.head{box-shadow:0 0 0 2px var(--accent), 0 0 14px rgba(245,196,81,.45);z-index:2;animation:headPulse 1.7s ease-in-out infinite}
@keyframes headPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.res .more{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:var(--ink-dim);letter-spacing:.08em}
.nozzle{width:24px;height:11px;background:var(--steel);border:2px solid var(--steel2);border-top:0;border-radius:0 0 6px 6px}

/* ---------- manifold + tüpler ---------- */
.rail{margin:0 auto;position:relative}
.manifold{
  height:15px;border-radius:8px;position:relative;
  background:linear-gradient(180deg,#645980,#3D3455);
  border:2px solid var(--steel2);box-shadow:0 3px 0 rgba(0,0,0,.28);
}
/* ── BAĞ = KALICI YAPI, VURGU = SADECE TÜP ──
   Boru her zaman görünür ve "bu tüp bu arabaya akıyor"u sessizce söyler.
   Parlayan hiçbir şey arabanın üstünde değil: parlayan = tıklanabilir. */
.colwrap{position:relative}
.tubes,.drip,.lane{position:relative}

.drip{height:32px}
.pipe{
  position:absolute;top:-2px;bottom:-2px;width:8px;border-radius:4px;
  background:linear-gradient(90deg,#4A4062 0 2px,#332B47 2px 6px,#231D33 6px);
  transition:background .18s, box-shadow .18s;
}
.pipe.flow{
  background:linear-gradient(90deg,
    color-mix(in srgb, var(--cc) 60%, #fff) 0 2px,
    var(--cc) 2px 6px,
    color-mix(in srgb, var(--cc) 55%, #000) 6px);
  box-shadow:0 0 14px color-mix(in srgb, var(--cc) 55%, transparent);
}
.drop{
  position:absolute;top:0;width:13px;height:16px;
  border-radius:52% 52% 58% 58%;background:var(--cc);
  box-shadow:0 0 12px color-mix(in srgb, var(--cc) 65%, transparent);
  animation:fall .36s ease-in forwards;pointer-events:none;
}
@keyframes fall{
  0%  {transform:translateY(-16px) scaleY(.65);opacity:0}
  22% {opacity:1}
  100%{transform:translateY(29px)  scaleY(1.3);opacity:0}
}
@keyframes chevBob{
  0%,100%{transform:translateY(0);opacity:.5}
  50%    {transform:translateY(5px);opacity:1}
}

.tubes{height:148px;margin-top:-2px}
.tube{
  position:absolute;top:0;width:44px;height:140px;padding:4px;
  border:3px solid var(--steel);border-top:0;border-radius:0 0 16px 16px;
  background:rgba(0,0,0,.3) linear-gradient(90deg,rgba(255,255,255,.08) 0 4px,transparent 4px 100%);
  display:flex;flex-direction:column-reverse;gap:2px;cursor:pointer;touch-action:manipulation;
  transition:transform .13s ease, box-shadow .13s ease, border-color .13s ease;
}
.tube .u{height:27px;border-radius:3px;position:relative;animation:drop .22s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
/* kabul eden tüp SIRADAKİ RENGİN halkasını takar — hangi tüpe basılacağı bakışta belli */
.tube.ok{border-color:color-mix(in srgb, var(--cc) 62%, var(--steel))}
/* tüp basılası dursun: hover'da yukarı kalkar — tıklanabilir olan bu */
.tube.ok:hover{border-color:var(--cc);transform:translateY(-4px);
  box-shadow:0 0 0 2px var(--cc), 0 10px 26px color-mix(in srgb, var(--cc) 32%, transparent)}
.tube.point{animation:tubePoint .72s ease-out}
@keyframes tubePoint{
  0%,100%{box-shadow:none}
  30%{box-shadow:0 0 0 3px var(--accent), 0 0 26px rgba(245,196,81,.6)}
  65%{box-shadow:0 0 0 3px var(--accent), 0 0 26px rgba(245,196,81,.6)}
}
.tube.no{opacity:.38;cursor:not-allowed}
/* yol gösterme: SADECE tüp parlar, aşağıdaki arabaya hiç dokunulmaz */
.tube.aim{animation:tubeAim 1.25s ease-in-out infinite}
@keyframes tubeAim{
  0%,100%{box-shadow:0 0 0 2px color-mix(in srgb, var(--cc) 45%, transparent), 0 0 16px color-mix(in srgb, var(--cc) 22%, transparent)}
  50%    {box-shadow:0 0 0 3px var(--cc), 0 0 28px color-mix(in srgb, var(--cc) 48%, transparent)}
}
.tube .aimArrow{
  position:absolute;left:0;right:0;top:6px;text-align:center;
  font-size:16px;line-height:1;color:var(--cc);pointer-events:none;
  animation:chevBob 1.1s ease-in-out infinite;
}
/* musluk: tüpün "aşağı boşaltan" bir kap olduğunu söyler — arabadan ayrışsın diye */
.tube::after{
  content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  width:13px;height:8px;background:var(--steel);
  border:2px solid var(--steel2);border-top:0;border-radius:0 0 5px 5px;
}

/* Soyut şerit sayacı KALDIRILDI — "ne yapıyorum da ilerliyor" sorusunu doğurmuştu.
   Yerine çıkış kapısındaki ◄ okları kalan hamleyi sayıyor (bkz. .gate.out).
   Kısmi araba sürünmesi de denendi ve kaldırıldı: hizayı bozuyordu. */

/* ---------- araba şeridi ---------- */
/* Zemin ayracı SÜTUN BAŞINA BİR TANE (70px = sütun adımı), boşluğun ortasına
   oturur. 35px'lik eski desen her sütunda iki çizgi çıkarıp sahte, kaymış
   hücreler gösteriyordu. Kaydırma yalnızca tam kaymalarda, arabalarla birlikte. */
.lane{position:relative;height:106px;margin:8px auto 0;
  border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 70px);
  transition:background-position .3s cubic-bezier(.34,.8,.3,1)}
/* ÇIKIŞ KAPISI: "arabalar niye sola kayıyor" sorusunun görsel cevabı.
   Sol uçta kalıcı bir çıkış işareti durur; araba oradan sahneden ayrılır. */
/* GERİ SAYIM: kalan hamle kadar ok. 2 hamle "◄◄", 1 hamle "◄" + sarı.
   Sayı yazmak yerine sayılabilir bir işaret, hem de SONUCUN olduğu yerde. */
.gate{position:absolute;top:0;bottom:0;width:26px;display:flex;align-items:center;
  justify-content:flex-end;gap:1px;font-size:16px;font-weight:700;pointer-events:none}
.gate.out{left:-30px;color:var(--steel);animation:gateBob 1.9s ease-in-out infinite}
.gate.out.ready{color:var(--accent);font-size:21px;animation-duration:.5s}
.gate.in {right:-30px;color:var(--steel2);justify-content:flex-start;opacity:.5}
@keyframes gateBob{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(-5px);opacity:1}}
/* son hamlede şeridin çıkış kenarı sararır — araba parlamaz, kenar parlar */
.lane .edge{position:absolute;left:-3px;top:-2px;bottom:-2px;width:3px;border-radius:2px;
  background:transparent;transition:background .2s, box-shadow .2s;pointer-events:none}
.lane .edge.hot{background:var(--accent);box-shadow:0 0 14px rgba(245,196,81,.65)}
/* SONUÇ ARABANIN ÜSTÜNDE: kenardaki küçük işaret okunmuyordu — sonuç,
   sonucu doğuran nesnenin üstünde durursa anlaşılıyor. */
.car .verdict{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:800;z-index:5;animation:verdictPop .3s ease-out;
}
.car .verdict.ok {color:var(--ok); text-shadow:0 0 16px rgba(95,190,85,.9)}
.car .verdict.bad{color:var(--bad);text-shadow:0 0 16px rgba(228,87,76,.9)}
@keyframes verdictPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.car.won .body   {border-color:var(--ok); background:rgba(95,190,85,.2)}
.car.missed .body{border-color:var(--bad);background:rgba(228,87,76,.18);filter:grayscale(.35)}
.car.gone{transition:transform .5s ease-in, opacity .5s ease-in}

/* Arabaya tıklamak BOŞA GİTMEZ: araba silkelenir, üstündeki tüp parlar,
   aradan yukarı bir ok çıkar. Yanlış tıklama böylece derse dönüşür. */
.car .body.nope{animation:nope .38s ease-in-out}
@keyframes nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}
  45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.uparrow{
  position:absolute;bottom:0;width:56px;text-align:center;font-size:19px;
  color:var(--accent);pointer-events:none;animation:upFly .72s ease-out forwards;
}
@keyframes upFly{
  0%{transform:translateY(8px);opacity:0} 22%{opacity:1}
  100%{transform:translateY(-30px);opacity:0}
}

/* ── EKRAN YANSIMASI: arabanın sola kaymasının SONUCU ── */
.flash{position:absolute;inset:0;pointer-events:none;z-index:15;opacity:0;border-radius:20px}
.flash.ok{
  background:radial-gradient(130% 85% at 10% 82%, rgba(95,190,85,.5), rgba(95,190,85,.12) 45%, transparent 68%);
  animation:flashFade .6s ease-out;
}
.flash.bad{
  background:radial-gradient(130% 85% at 10% 82%, rgba(228,87,76,.62), rgba(228,87,76,.16) 45%, transparent 70%);
  animation:flashFade .7s ease-out;
}
@keyframes flashFade{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.stage.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  0%,100%{transform:translateX(0)} 15%{transform:translateX(-6px)}
  32%{transform:translateX(5px)}   50%{transform:translateX(-4px)}
  70%{transform:translateX(3px)}   85%{transform:translateX(-2px)}
}
.car{position:absolute;top:12px;width:56px;height:82px;cursor:default;touch-action:manipulation;
  transition:transform .3s cubic-bezier(.34,.8,.3,1),opacity .3s}
.car .body{position:absolute;inset:0 4px;border-radius:15px 15px 11px 11px;border:2.5px solid var(--cc);background:#0E0B14;overflow:hidden}
/* KAPUT: dolu METAL, asla sıvı rengi değil. Eski açık cam kutusu alttaki
   yuvalarla aynı dili konuşuyordu ve "burası da dolar" sanılıyordu.
   Görsel dilbilgisi: kesikli çerçeve = dolar, dolu metal = yapı. */
.car .hood{
  position:absolute;left:0;right:0;top:0;height:23px;
  background:linear-gradient(180deg,#544A6C 0 55%,#39314E);
  border-bottom:2px solid #221C31;border-radius:12px 12px 3px 3px;
}
.car .hood::before,.car .hood::after{
  content:"";position:absolute;top:4px;width:10px;height:5px;border-radius:2px;
  background:rgba(255,238,196,.62);box-shadow:0 0 6px rgba(255,238,196,.35);
}
.car .hood::before{left:4px}
.car .hood::after{right:4px}
/* kapasite kadar yuva — "1/2" yazısı yerine bakışta sayılabilir kutucuk */
.car .slots{position:absolute;left:5px;right:5px;top:26px;bottom:5px;display:flex;flex-direction:column-reverse;gap:3px}
.car .slots i{
  position:relative;overflow:hidden;flex:1;border-radius:4px;
  border:1.5px dashed color-mix(in srgb, var(--cc) 52%, transparent);
  transition:border-color .2s ease, border-style .2s;
}
/* sıvı ALTTAN YÜKSELİR — dolum gözle görülsün diye yükseklik animasyonu */
.car .slots i::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:0;
  background:linear-gradient(180deg, color-mix(in srgb, var(--cc) 82%, #fff) 0 3px, var(--cc) 3px);
  transition:height .34s cubic-bezier(.35,1.35,.5,1);
}
.car .slots i.on{border:1.5px solid var(--cc)}
.car .slots i.on::after{height:100%}
/* araba sıvı aldığında hafif zıplar */
.car .body.hit{animation:splash .4s ease-out}
@keyframes splash{0%{transform:scale(1)}34%{transform:scale(1.08)}100%{transform:scale(1)}}
.car .gl{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:2}
.car .wh{position:absolute;width:7px;height:17px;border-radius:3px;background:#08060C;border:1px solid #2E2740}
.car .w1{left:0;top:11px}.car .w2{right:0;top:11px}.car .w3{left:0;bottom:11px}.car .w4{right:0;bottom:11px}
/* dolu araba PARLAMAZ — parlama tıklanabilirlik demek. Sadece durum değişir. */
.car.full .body{border-color:var(--ok)}
.car.gone{opacity:0}
.car.missed .body{border-style:dashed;filter:grayscale(.55)}

/* ---------- kuyruk ---------- */
.queue{display:flex;align-items:center;gap:7px;margin:11px auto 0;height:26px}
.queue .lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.qchip{width:15px;height:21px;border-radius:4px;border:2px solid var(--cc);background:color-mix(in srgb, var(--cc) 30%, transparent);position:relative}
.qchip .gl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.qmore{font-size:10px;color:var(--ink-dim);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- kontroller ---------- */
.ctrls{display:flex;gap:7px;margin-top:14px}
button{
  flex:1;appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:12px;font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer;
  transition:background .12s,border-color .12s,opacity .12s;
}
button:hover:not(:disabled){background:#332B44;border-color:var(--steel)}
button:disabled{opacity:.35;cursor:not-allowed}
button.go{background:var(--accent);color:#241B04;border-color:var(--accent)}
button.go:hover{background:#FFD86B}
button.mini{flex:0 0 38px;padding:9px 0;font-size:14px}
button.on{background:var(--steel2);border-color:var(--steel);color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- overlay ---------- */
.ov{position:absolute;inset:0;background:rgba(14,11,20,.93);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px 26px;z-index:20;backdrop-filter:blur(3px)}
.ov h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
.ov .sub{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0 0 20px;max-width:280px}
.ov .big{font-size:44px;margin-bottom:6px;line-height:1}
.ov .ctrls{width:100%;max-width:280px}
.help{text-align:left;overflow-y:auto;align-items:stretch;justify-content:flex-start}
.help h2{font-size:19px;margin-bottom:12px}
.help ol{margin:0 0 16px;padding-left:20px}
.help li{font-size:12.5px;line-height:1.65;color:var(--ink-soft);margin-bottom:7px}
.help li b{color:var(--ink)}
.help .lose{border-left:2px solid var(--bad);padding-left:11px;font-size:12.5px;line-height:1.65;color:var(--ink-soft);margin-bottom:16px}
.foot{margin-top:14px;padding-top:11px;border-top:1px solid var(--line);
  font-size:10px;letter-spacing:.06em;color:var(--ink-dim);display:flex;justify-content:space-between}
@media (max-width:430px){
  #app{padding:8px 6px 24px}
  .stage{padding:10px 12px 14px;border-radius:16px}
  .lv b{font-size:17px}
  .stat b{font-size:14px}
  .stat.clock b{font-size:19px}
  .res{width:64px}
  .ctrls{margin-top:10px;gap:6px}
  button{font-size:11.5px;padding:10px 4px}
  button.mini{flex:0 0 36px}
  .foot{font-size:9px;margin-top:10px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* Onyukleme tanisi: JS hic calismazsa bu kutu ekranda kalir ve sebebini soyler.
   Onceden bos bir sahne goruluyor, sorunun ne oldugu anlasilmiyordu. */
.boot{position:fixed;left:10px;right:10px;top:10px;z-index:9999;padding:12px 14px;
  border-radius:10px;background:#3B1512;color:#FFD9D2;border:1px solid #A8422F;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.boot b{color:#fff}
.boot small{opacity:.75;font-size:11px;word-break:break-all}
</style>

<div class="boot" id="boot">
  <b>Oyun başlatılamadı — JavaScript çalışmıyor.</b><br>
  Dosyayı dosya yöneticisi ya da uygulama içi önizleme yerine
  <b>Chrome / Safari</b> ile aç, veya paylaşılan bağlantıyı kullan.
</div>
<script>
window.addEventListener("error", function(e){
  var b = document.getElementById("boot");
  if(!b) return;
  b.innerHTML = "<b>Oyun hata verdi</b><br>" + (e.message || "bilinmeyen hata") +
    "<br><small>" + (e.filename || "") + " : " + (e.lineno || "?") + "</small>";
});
</script>
<div id="app"><div class="stage" id="stage">
  <div class="hud" id="hud">

  </div>

<script>
(function(){
"use strict";

/* ═══════════ sabitler ═══════════ */
var PAL = [
  {hex:"#E4574C", gl:"▲", tr:"kırmızı"},
  {hex:"#3B77D8", gl:"●", tr:"mavi"},
  {hex:"#F0A02C", gl:"■", tr:"turuncu"},
  {hex:"#59B04D", gl:"◆", tr:"yeşil"},
  {hex:"#9463D4", gl:"★", tr:"mor"},
  {hex:"#25B2BA", gl:"✚", tr:"turkuaz"}
];
/* İlk TEACH bölümde yol gösterme açık kalır. Sonrası oyuncunun tercihi —
   çünkü ▼ oku bölüm üreticisinin çözücüsüyle aynı kuralı gösteriyor:
   sürekli açık kalırsa bulmacayı oyuncu yerine oyun çözer. */
var TEACH = 3;
/* Bir "sütun" = bir tüp + tam altındaki şerit slotu. Tek sayı, iki isim değil. */
var COL_W = 56, GAP = 14, TUBE_W = 44;
/* TEK ŞANS: bir araba boş çıkarsa bölüm biter. Bölüm üreteci zaten
   sıfır kaçakla çözülebilen bölümler üretiyor, yani bu tutarlı bir bar. */
var MAX_STRIKES = 1, UNDO_MAX = 5, RES_SHOW = 7, PREFILL = 3;
var LS = "dbg.tubefac.v1";

function colX(i){ return i*(COL_W+GAP); }
function railW(cols){ return cols*COL_W + (cols-1)*GAP; }
/* Ray sabit piksel genisliginde (5 sutun = 336px). Dar ekranda tasmasin diye
   BUTUNUYLE olceklenir: ic koordinatlar olceksiz kalir, sadece gorsel kuculur.
   Tup fabrikasinda ray disina ucan hicbir sey yok, bu yuzden guvenli. */
function fitRail(cols){
  var rail = el("rail"), hud = el("hud");
  var natural = railW(cols);
  rail.style.width = natural + "px";
  rail.style.transform = "";
  rail.style.marginLeft = "";
  rail.style.marginBottom = "";
  if(!hud) return;
  var avail = hud.offsetWidth;
  if(!avail || !isFinite(avail) || avail >= natural) return;
  var k = avail / natural;
  var h = rail.offsetHeight || 0;
  rail.style.transformOrigin = "top left";
  rail.style.transform = "scale(" + k.toFixed(4) + ")";
  rail.style.marginLeft = ((avail - natural*k) / 2).toFixed(1) + "px";
  if(h) rail.style.marginBottom = (h*k - h).toFixed(1) + "px";
}
function rnd(n){ return Math.floor(Math.random()*n); }
function el(id){ return document.getElementById(id); }

/* ═══════════ bölüm üretimi ═══════════ */
/* Zorluk üç kaldıraçtan gelir: renk sayısı, sütun sayısı, karıştırma penceresi.
   Pencere 4'te sabit — üstünde bölüm üretilemez hâle geliyor (ölçüldü:
   6 renk / 5 sütun / pencere 8 -> %3 çözülebilirlik). */
/* SPEED ile CAR_CAP birbirine bağlıdır: şerit her SPEED hamlede bir ilerler,
   yani araba başına tam SPEED birim su düşer. İkisi eşit olmazsa su ile araba
   akışı tutmaz — biri diğerini bekler. Değiştirirken ikisini birlikte değiştir. */
var SPEED = 2, CAR_CAP = 2;

/* İlk dört bölüm elle yazıldı: 1. bölüm öğretme bölümü — 2 renk, karışım yok,
   yani her sıvı zaten şeritteki arabaya ait. Oyuncu kuralı kaybederek değil,
   çalıştığını görerek öğrenir. */
var EARLY = [
  null,
  { colors:2, cars:5, win:0 },
  { colors:3, cars:6, win:0 },
  { colors:3, cars:6, win:1 },
  { colors:3, cars:7, win:2 }
];

function cfgFor(n){
  var cols = (n < 13) ? 5 : 4;
  var e = EARLY[n];
  /* 1. bölümde şerit SEYREK başlar: 1-2 demo dolu araba, 3-4 boş, 5'te ilk gerçek
     araba. Dolu şerit "her şey hazır" izlenimi verip oyuncuyu bastırıyordu. */
  var prefill = (n === 1) ? 1 : PREFILL;
  if(e) return { colors:e.colors, cols:5, cap:4, speed:SPEED, cars:e.cars, win:e.win, prefill:prefill };
  return {
    colors : Math.min(6, 3 + Math.floor((n-1)/3)),
    cols   : cols,
    cap    : 4,
    speed  : SPEED,
    prefill: prefill,
    /* Bölüm boyu kısaltıldı (eski: 6 + n/2, 14'e kadar). Oyuncular mekaniği
       keyifli ama bölümü uzun buldu; 10 araba = 20 hamle üst sınır. */
    cars   : Math.min(10, 5 + Math.floor(n/3)),
    /* 4 sütunda tampon azaldığı için pencere tavanı da 3'e iner;
       zorluk artışı sütun kaybından geliyor, karışımı üstüne yığmaya gerek yok. */
    win    : Math.min(cols === 4 ? 3 : 4, Math.floor(n/3) + 1)
  };
}

/* greedy çözücü — SADECE yapısal Evet/Hayır kontrolü.
   Zorluk ölçüsü değildir; çözücü fail-oranı gerçek winrate'i yansıtmaz. */
function solvable(cfg, src, res){
  var i, s, C = cfg.cols;
  var tubes = []; for(i=0;i<C;i++) tubes.push({c:null,n:0});
  var lane = []; for(i=0;i<C;i++) lane.push(null);
  var q = src.map(function(c){ return {c:c.c, cap:c.cap, fill:0}; });
  var qi = 0;
  for(s=C-1; s>=C-cfg.prefill && qi<q.length; s--) lane[s] = q[qi++];
  var strikes=0, ri=0, tick=0, guard=0;

  function drain(){
    for(var s=0;s<C;s++){
      var car=lane[s], tb=tubes[s];
      if(car && tb.n>0 && tb.c===car.c && car.fill<car.cap){
        var k=Math.min(car.cap-car.fill, tb.n);
        car.fill+=k; tb.n-=k; if(tb.n===0) tb.c=null;
      }
    }
  }
  function advance(){
    if(lane[0] && lane[0].fill<lane[0].cap) strikes++;
    for(var s=0;s<C-1;s++) lane[s]=lane[s+1];
    lane[C-1] = (qi<q.length) ? q[qi++] : null;
    drain();
  }
  function laneEmpty(){ for(var s=0;s<C;s++) if(lane[s]) return false; return true; }

  while(ri<res.length && guard++<6000){
    var c=res[ri], pick=-1;
    for(s=0;s<C;s++){                             // 1) hizadaki muhtaç araba
      var car=lane[s], tb=tubes[s];
      if(car && car.c===c && car.fill<car.cap && tb.n<cfg.cap && (tb.n===0||tb.c===c)){ pick=s; break; }
    }
    if(pick<0) for(s=0;s<C;s++)                   // 2) aynı renk, yer var
      if(tubes[s].c===c && tubes[s].n<cfg.cap){ pick=s; break; }
    if(pick<0) for(s=0;s<C;s++)                   // 3) boş tüp
      if(tubes[s].n===0){ pick=s; break; }
    if(pick<0) return false;
    tubes[pick].c=c; tubes[pick].n++; ri++;
    drain();
    if(++tick>=cfg.speed){ tick=0; advance(); }
    if(strikes>0) return false;
  }
  while(guard++<6000){
    var done=true; for(i=0;i<C;i++) if(tubes[i].n>0) done=false;
    if(done) return true;
    if(qi>=q.length && laneEmpty()) return false;
    advance();
    if(strikes>0) return false;
  }
  return false;
}

/* Hedef pencereyle başlar; üretemezse pencereyi BİRER BİRER kısar.
   Doğrudan 0'a düşmek geç bölümleri kolaylaştırıyordu — eğri ters dönüyordu. */
function buildLevel(n){
  var cfg = cfgFor(n), w, attempt, i, k;
  for(w = cfg.win; w >= 0; w--){
    for(attempt=0; attempt<150; attempt++){
      var q=[];
      for(i=0;i<cfg.cars;i++) q.push({id:i, c:rnd(cfg.colors), cap:CAR_CAP, fill:0});
      var res=[];
      for(i=0;i<q.length;i++) for(k=0;k<q[i].cap;k++) res.push(q[i].c);
      if(w>0) for(i=0;i<res.length;i++){
        var j=i+rnd(w+1);
        if(j<res.length){ var t=res[i]; res[i]=res[j]; res[j]=t; }
      }
      if(solvable(cfg,q,res)) return {cfg:cfg, q:q, res:res, win:w, tries:attempt+1};
    }
  }
  return null;
}

/* ═══════════ durum ═══════════ */
/* HINTS varsayılan KAPALI: 1. bölümde zorla açık, 2-3'te oyuncu duraksarsa açılır.
   Sürekli açık kalsaydı ▼ oku bulmacayı oyuncu yerine çözerdi. */
var S=null, SHAPES=false, HINTS=false, IDLE=false, carEls={}, nextCarUid=1;
var gateOut=null, edgeEl=null;
var autoTimer=null, autoGen=0, idleTimer=null, clockTimer=null;
var AUTO_MS=420, IDLE_MS=3500;
/* Süre yalnızca OYUNCUNUN SIRASI işlerken akar. Şerit kendi ilerlerken
   (hamle yokken) durur — yapamadığın bir şey için ceza olmaz. */
var TIME_BASE=10000, TIME_PER_CAR=4500;

function stopClock(){ if(clockTimer){ clearTimeout(clockTimer); clockTimer=null; } }
function startClock(){
  if(!S || S.clockOn || S.over) return;
  S.clockOn = true; S.tLast = Date.now();
  clockTimer = setTimeout(tickClock, 100);
}
function tickClock(){
  stopClock();
  if(!S || !S.clockOn || S.over) return;
  var now = Date.now(), dt = now - S.tLast;
  S.tLast = now;
  if(playerCanMove()) S.left -= dt;
  if(S.left <= 0){
    S.left = 0; renderClock();
    S.over = "lose-time"; flashScreen(false); renderAll();
    return;
  }
  renderClock();
  clockTimer = setTimeout(tickClock, 100);
}
var WARN_S = 10, CRIT_S = 5;

function renderClock(){
  if(!S) return;
  var secs = Math.max(0, Math.ceil(S.left / 1000));
  var pct  = S.limit ? (S.left / S.limit * 100) : 100;
  var lvl  = (!S.clockOn || S.over) ? 0 : (secs <= CRIT_S ? 3 : (secs <= WARN_S ? 2 : 1));
  var mood = (lvl === 0) ? " idle" : (lvl === 3 ? " crit" : (lvl === 2 ? " warn" : ""));

  el("timerFill").style.width = pct + "%";
  el("timer").className = "timer" + mood;

  var c = el("clock"), n = el("hTime");
  c.className = "stat clock" + mood;
  var txt = Math.floor(secs/60) + ":" + (secs % 60 < 10 ? "0" : "") + (secs % 60);
  if(n.textContent !== txt){
    n.textContent = txt;
    n.classList.remove("tick"); void n.offsetWidth;      // saniye atışı
    if(lvl >= 2) n.classList.add("tick");
  }

  /* Uyarı sınıfı sadece seviye değişince yazılır; her karede yazılsaydı
     CSS animasyonu sürekli sıfırlanır ve yanıp sönme hiç görünmezdi. */
  if(S.dangerLvl !== lvl){
    S.dangerLvl = lvl;
    el("danger").className = "danger" + (lvl === 3 ? " on fast" : (lvl === 2 ? " on" : ""));
  }
}

/* 1. bölüm: hep açık. 2-3: sadece oyuncu bir süredir tıklamıyorsa. Sonrası: 💡 düğmesi. */
function guideOn(){
  if(!S) return false;
  if(S.n <= 1) return true;
  if(S.n <= TEACH) return IDLE || HINTS;
  return HINTS;
}
function armIdle(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  if(IDLE || !S || S.over) return;
  if(!(S.n > 1 && S.n <= TEACH)) return;
  idleTimer = setTimeout(function(){
    if(!S || S.over) return;
    IDLE = true; renderAll();
  }, IDLE_MS);
}

function startLevel(n){
  var L = buildLevel(n);
  if(!L){ L = buildLevel(1); n = 1; }
  var cfg = L.cfg, i;
  S = {
    n:n, cfg:cfg,
    res:L.res, ri:0,
    tubes:[], lane:[], queue:L.q.map(function(c){
      return {uid:nextCarUid++, c:c.c, cap:c.cap, fill:0};
    }),
    qi:0, tick:0, shifts:0, moves:0, strikes:0, delivered:0,
    limit:TIME_BASE + L.q.length*TIME_PER_CAR, left:0, clockOn:false, tLast:0, dangerLvl:-1,
    total:L.q.length, undo:[], over:null, win:L.win, tries:L.tries
  };
  for(i=0;i<cfg.cols;i++){ S.tubes.push({c:null,n:0}); S.lane.push(null); }
  for(i=cfg.cols-1; i>=cfg.cols-cfg.prefill && S.qi<S.queue.length; i--) S.lane[i]=S.queue[S.qi++];

  /* 1. BÖLÜM: ilk iki slota ZATEN DOLU araba koy.
     Oyuncu daha hiçbir şey yapmadan, dolu arabaların sola çıkıp yeşil yandığını
     görüyor — "arabalar niye gidiyor" sorusu oynamadan cevaplanıyor.
     Bu arabalar sıvı tüketmez ve teslim sayacına girmez: denge bozulmaz. */
  if(n === 1) for(i=0; i<2 && i<cfg.cols; i++){
    if(S.lane[i]) continue;
    S.lane[i] = { uid:nextCarUid++, c:rnd(cfg.colors), cap:CAR_CAP, fill:CAR_CAP, demo:true };
  }
  carEls = {};
  el("lane").innerHTML = "";
  addGates();
  fitRail(cfg.cols);
  try{ localStorage.setItem(LS, String(n)); }catch(e){}
  IDLE = false; autoGen++;
  S.left = S.limit;
  if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }
  if(idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
  stopClock();
  var p = drainAll();
  checkEnd();
  resolve(p);
}

function snapshot(){
  S.undo.push(JSON.stringify({
    ri:S.ri, tubes:S.tubes, lane:S.lane, queue:S.queue, qi:S.qi,
    tick:S.tick, shifts:S.shifts, moves:S.moves, strikes:S.strikes, delivered:S.delivered
  }));
  if(S.undo.length>UNDO_MAX) S.undo.shift();
}
function undo(){
  if(!S.undo.length) return;
  var p = JSON.parse(S.undo.pop());
  S.ri=p.ri; S.tubes=p.tubes; S.lane=p.lane; S.queue=p.queue; S.qi=p.qi;
  S.tick=p.tick; S.shifts=p.shifts; S.moves=p.moves; S.strikes=p.strikes; S.delivered=p.delivered;
  S.over=null; IDLE=false; autoGen++;
  /* Geri alma 5 sn iade eder. Olmasaydı süreden kaybeden oyuncu geri alsa bile
     sıfır saniyeye dönüp anında tekrar kaybederdi — çıkışsız durum. */
  S.left = Math.min(S.limit, S.left + 5000);
  stopClock();
  if(S.clockOn){ S.tLast = Date.now(); clockTimer = setTimeout(tickClock, 100); }
  hideOverlay();
  resolve(null);
}

/* ═══════════ kurallar ═══════════ */
function head(){ return S.ri < S.res.length ? S.res[S.ri] : -1; }
function canPlace(t){
  if(S.over) return false;
  var c = head(); if(c<0) return false;
  var tb = S.tubes[t];
  return tb.n < S.cfg.cap && (tb.n===0 || tb.c===c);
}
function anyPlace(){
  for(var i=0;i<S.cfg.cols;i++) if(canPlace(i)) return true;
  return false;
}
/* Akan sütunların listesini döndürür — bantları yakmak için.
   Teslim sayacı araba DOLDUĞU anda artar, şeritten çıktığında değil:
   geri bildirim anında gelsin ve şeritte kalan dolu arabalar sayılmadan kalmasın. */
function drainAll(){
  var poured = [];
  for(var s=0;s<S.cfg.cols;s++){
    var car=S.lane[s], tb=S.tubes[s];
    if(car && tb.n>0 && tb.c===car.c && car.fill<car.cap){
      var k=Math.min(car.cap-car.fill, tb.n);
      car.fill+=k; tb.n-=k; if(tb.n===0) tb.c=null;
      /* renk VE araba kimliğini OLAYLA BİRLİKTE taşı: çizim sırası geldiğinde
         şerit kaymış, araba gitmiş ve tüp boşalmış olabilir. */
      poured.push({ s:s, c:car.c, uid:car.uid });
      if(car.fill >= car.cap) S.delivered++;
    }
  }
  return poured;
}
function advanceLane(){
  var out = S.lane[0];
  if(out){
    var ok = out.fill >= out.cap;
    if(!ok){ S.strikes++; out.missed=true; }
    flashScreen(ok);            // arabanın sola kaymasının SONUCU ekrana yansır
    var e = carEls[out.uid];
    if(e){
      var v = document.createElement("div");
      v.className = "verdict " + (ok ? "ok" : "bad");
      v.textContent = ok ? "✓" : "✕";
      e.appendChild(v);
      e.classList.add(ok ? "won" : "missed");
      /* Önce SONUÇ okunsun, sonra araba çıksın. Tek hamlede silinince
         "sola kayan araba başardı mı" anlaşılmıyordu. */
      (function(node,uid){
        setTimeout(function(){
          node.classList.add("gone");
          node.style.transform = "translateX(" + (colX(0)-100) + "px)";
        }, 280);
        setTimeout(function(){
          if(node.parentNode) node.parentNode.removeChild(node);
          delete carEls[uid];
        }, 840);
      })(e, out.uid);
    }
  }
  for(var s=0;s<S.cfg.cols-1;s++) S.lane[s]=S.lane[s+1];
  S.lane[S.cfg.cols-1] = (S.qi < S.queue.length) ? S.queue[S.qi++] : null;
  S.shifts++;
  return drainAll();
}
/* Araba sahneden ayrılınca sonucu göster: yeşil = dolu gitti, kırmızı = boş gitti.
   Oyuncular "sola kayınca ne oluyor" diye soruyordu — cevabı bu. */
function flashScreen(ok){
  var f = el("flash"); if(!f) return;
  f.className = "flash"; void f.offsetWidth;
  f.className = "flash " + (ok ? "ok" : "bad");
  if(!ok){
    var st = el("stage");
    st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
    setTimeout(function(){ st.classList.remove("shake"); }, 450);
  }
}
/* Arabaya tıklandı: sessiz kalma — silkele, üstündeki tüpü parlat, yukarı ok at.
   Boşa giden tıklama oyuncuya "burası bozuk mu" dedirtiyordu. */
function nudgeToTube(s){
  if(!S || S.over) return;
  var car = S.lane[s]; if(!car) return;
  var e = carEls[car.uid];
  if(e){
    var b = e.querySelector(".body");
    if(b){ b.classList.remove("nope"); void b.offsetWidth; b.classList.add("nope"); }
  }
  var tubeEl = el("tubes").children[s];
  if(tubeEl){ tubeEl.classList.remove("point"); void tubeEl.offsetWidth; tubeEl.classList.add("point"); }
  var a = document.createElement("div");
  a.className = "uparrow"; a.textContent = "▲";
  a.style.left = colX(s) + "px";
  el("drip").appendChild(a);
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 740);
}
function addGates(){
  var lane = el("lane");
  var o=document.createElement("span"); o.className="gate out"; o.textContent="◄◄";
  var i=document.createElement("span"); i.className="gate in";  i.textContent="◄◄";
  var e=document.createElement("span"); e.className="edge";
  lane.appendChild(o); lane.appendChild(i); lane.appendChild(e);
  gateOut = o; edgeEl = e;
}

function tubesEmpty(){
  for(var i=0;i<S.cfg.cols;i++) if(S.tubes[i].n>0) return false;
  return true;
}
function laneEmpty(){
  for(var s=0;s<S.cfg.cols;s++) if(S.lane[s]) return false;
  return true;
}

/* Tüplerde duran sıvının teslim edilebileceği bir araba KALDI MI?
   Şeritte ya da kuyrukta. Kalmadıysa şeridi ilerletmek hiçbir şeyi kurtarmaz. */
function canProgress(){
  for(var t=0;t<S.cfg.cols;t++){
    var tb=S.tubes[t]; if(tb.n===0) continue;
    for(var s=0;s<S.cfg.cols;s++){
      var k=S.lane[s];
      if(k && k.c===tb.c && k.fill<k.cap) return true;
    }
    for(var i=S.qi;i<S.queue.length;i++) if(S.queue[i].c===tb.c) return true;
  }
  return false;
}
/* Oyuncunun yapabileceği bir hamle var mı? */
function playerCanMove(){ return S.ri < S.res.length && anyPlace(); }

function checkEnd(){
  if(S.strikes >= MAX_STRIKES){ S.over="lose-strike"; return; }
  if(S.ri >= S.res.length && tubesEmpty()){ S.over="win"; return; }
  /* Hamle yok VE tüplerdeki sıvıyı alacak araba yok -> bitti.
     Hamle yok ama araba varsa BİTMEZ: şerit kendi ilerler, tüp boşalabilir. */
  if(!playerCanMove() && !canProgress()){
    S.over = (S.ri < S.res.length) ? "lose-lock" : "lose-nocars";
  }
}

function place(t){
  if(!canPlace(t)) return;
  snapshot();
  var c = S.res[S.ri++];
  var tb = S.tubes[t]; tb.c=c; tb.n++;
  S.moves++;
  IDLE = false;
  startClock();                 // saat ilk dökümde başlar — tahtayı okumak bedava
  var poured = drainAll();
  if(++S.tick >= S.cfg.speed){ S.tick=0; poured = poured.concat(advanceLane()); }
  checkEnd();
  resolve(poured);
}

/* Oyuncunun hamlesi kalmadıysa şerit KENDİ ilerler — manuel düğme yok.
   Ya bir tüp boşalıp hamle açılır, ya oyun biter. */
function resolve(poured){
  if(autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
  renderAll(poured);
  if(S.over || playerCanMove()) return;
  var myGen = ++autoGen;
  autoTimer = setTimeout(function(){
    if(myGen !== autoGen || !S || S.over) return;
    S.tick = 0;
    var p = advanceLane();
    checkEnd();
    resolve(p);
  }, AUTO_MS);
}

/* ═══════════ çizim ═══════════ */
function unit(c, h){
  var p = PAL[c];
  var d = document.createElement("div");
  d.className = "u";
  d.style.background = "linear-gradient(180deg," + p.hex + "F2," + p.hex + "B8)";
  if(h) d.classList.add("head");
  if(SHAPES){
    d.style.display="flex"; d.style.alignItems="center"; d.style.justifyContent="center";
    d.style.font="700 11px/1 system-ui"; d.style.color="rgba(255,255,255,.82)";
    d.textContent = p.gl;
  }
  return d;
}

function renderRes(){
  var box = el("res"); box.innerHTML="";
  var left = S.res.length - S.ri;
  var show = Math.min(RES_SHOW, left);
  for(var i=0;i<show;i++) box.appendChild(unit(S.res[S.ri+i], i===0));
  if(left > RES_SHOW){
    var m=document.createElement("div"); m.className="more";
    m.textContent = "+" + (left-RES_SHOW); box.appendChild(m);
  }
  if(left===0){
    var e=document.createElement("div"); e.className="more";
    e.style.top="66px"; e.textContent="BOŞ"; box.appendChild(e);
  }
}

/* Sıradaki rengin HEMEN teslim olacağı sütunlar — yol göstermenin tek hesabı. */
function aimCols(){
  var c = head(), out = [];
  if(c < 0) return out;
  for(var s=0;s<S.cfg.cols;s++){
    var car=S.lane[s], tb=S.tubes[s];
    if(car && car.c===c && car.fill<car.cap && tb.n<S.cfg.cap && (tb.n===0 || tb.c===c)) out.push(s);
  }
  return out;
}

/* Boru = kalıcı yapı. Hep görünür, hiç yanıp sönmez: "bu tüp bu arabaya akar".
   Sadece akış anında renklenir; oyuncuyu arabaya tıklamaya davet etmez. */
function renderPipes(poured){
  var box = el("drip"); box.innerHTML="";
  var s, d, i;
  for(s=0;s<S.cfg.cols;s++){
    d = document.createElement("div");
    d.className = "pipe";
    d.style.left = (colX(s) + (COL_W-8)/2) + "px";
    if(poured) for(i=0;i<poured.length;i++) if(poured[i].s===s){
      d.style.setProperty("--cc", PAL[poured[i].c].hex);
      d.className = "pipe flow";
    }
    box.appendChild(d);
  }
  if(poured) for(i=0;i<poured.length;i++){
    d = document.createElement("div");
    d.className = "drop";
    d.style.left = (colX(poured[i].s) + (COL_W-13)/2) + "px";
    d.style.setProperty("--cc", PAL[poured[i].c].hex);
    box.appendChild(d);
  }
}

function renderTubes(aim){
  var box = el("tubes"); box.innerHTML="";
  var hc = head();
  for(var t=0;t<S.cfg.cols;t++){
    var tb = S.tubes[t];
    var isAim = aim && aim.indexOf(t) >= 0;
    var d = document.createElement("div");
    d.className = "tube " + (canPlace(t) ? "ok" : "no") + (isAim ? " aim" : "");
    if(hc>=0) d.style.setProperty("--cc", PAL[hc].hex);
    d.style.left = (colX(t) + (COL_W-TUBE_W)/2) + "px";
    for(var k=0;k<tb.n;k++) d.appendChild(unit(tb.c,false));
    if(isAim){
      var ar = document.createElement("span");
      ar.className = "aimArrow"; ar.textContent = "▼";
      d.appendChild(ar);
    }
    (function(i){ d.addEventListener("click", function(){ place(i); }); })(t);
    box.appendChild(d);
  }
}

function makeCar(car){
  var p = PAL[car.c];
  var d = document.createElement("div");
  d.className="car"; d.style.setProperty("--cc", p.hex);
  var slots=""; for(var i=0;i<car.cap;i++) slots += "<i></i>";
  d.innerHTML =
    '<div class="body"><div class="hood"></div><div class="gl"></div>' +
    '<div class="slots">' + slots + '</div></div>' +
    '<span class="wh w1"></span><span class="wh w2"></span>' +
    '<span class="wh w3"></span><span class="wh w4"></span>';
  d.addEventListener("click", function(){
    for(var s=0;s<S.cfg.cols;s++) if(S.lane[s] === car){ nudgeToTube(s); return; }
  });
  d.style.transform = "translateX(" + colX(S.cfg.cols) + "px)";
  el("lane").appendChild(d);
  d.getBoundingClientRect();               // reflow -> giriş animasyonu
  return d;
}

function renderLane(){
  /* ARABA HER ZAMAN TÜPÜNÜN TAM ALTINDA DURUR.
     Kısmi sürünme denendi ve kaldırıldı: arabayı tüpünden kaydırıp
     "hangi tüp bu arabayı besliyor" okumasını bozuyordu — oyunun tek kritik
     bilgisi bu. Kaç hamle kaldığını çıkıştaki ◄ okları söylüyor. */
  el("lane").style.backgroundPositionX = -(GAP/2 + S.shifts * (COL_W + GAP)) + "px";

  /* Kaç hamle sonra kayacak: kalan hamle kadar ok. Son hamlede sarı + kenar yanar. */
  var left = S.cfg.speed - S.tick;
  if(gateOut){
    gateOut.textContent = new Array(left + 1).join("◄");
    gateOut.classList.toggle("ready", left === 1);
  }
  if(edgeEl) edgeEl.classList.toggle("hot", left === 1 && !!S.lane[0]);

  for(var s=0;s<S.cfg.cols;s++){
    var car = S.lane[s]; if(!car) continue;
    var d = carEls[car.uid];
    if(!d){ d = makeCar(car); carEls[car.uid] = d; }
    d.style.transform = "translateX(" + colX(s) + "px)";
    var pips = d.querySelectorAll(".slots i");
    for(var k=0;k<pips.length;k++) pips[k].classList.toggle("on", k < car.fill);
    d.querySelector(".gl").textContent = SHAPES ? PAL[car.c].gl : "";
    d.classList.toggle("full", car.fill >= car.cap);
  }
}

function renderQueue(){
  var box = el("queue"); box.innerHTML="";
  var left = S.queue.length - S.qi;
  var show = Math.min(5, left);
  for(var i=0;i<show;i++){
    var car = S.queue[S.qi+i];
    var c = document.createElement("span");
    c.className="qchip"; c.style.setProperty("--cc", PAL[car.c].hex);
    if(SHAPES) c.innerHTML = '<span class="gl">'+PAL[car.c].gl+'</span>';
    box.appendChild(c);
  }
  var m=document.createElement("span"); m.className="qmore";
  m.textContent = left>show ? ("+"+(left-show)) : (left?"":"—");
  box.appendChild(m);
}

function renderAll(poured){
  el("hLv").textContent  = S.n;
  el("hDel").textContent = S.delivered + "/" + S.total;
  var hp=""; for(var i=0;i<MAX_STRIKES;i++)
    hp += (i < MAX_STRIKES-S.strikes) ? '<span class="on">●</span>' : '<span class="off">○</span>';
  el("hHp").innerHTML = hp;
  el("uN").textContent = "(" + S.undo.length + ")";
  el("bUndo").disabled = !S.undo.length;
  el("fSeed").textContent = S.cfg.colors + " renk · " + S.cfg.cols + " sütun · karışım " + S.win;

  var guide = !S.over && guideOn();
  el("bHint").className = "mini" + (guide ? " on" : "");
  el("bHint").disabled  = S.n <= 1;
  var aim = guide ? aimCols() : [];

  renderRes(); renderTubes(aim); renderLane(); renderQueue(); renderPipes(poured); renderClock();
  if(S.over) stopClock();

  if(poured && poured.length){
    for(var k=0;k<poured.length;k++){
      var ce = carEls[poured[k].uid]; if(!ce) continue;
      var bd = ce.querySelector(".body"); if(!bd) continue;
      bd.classList.remove("hit"); void bd.offsetWidth; bd.classList.add("hit");
    }
    setTimeout(function(){ if(S) renderPipes(null); }, 430);   // boru sönsün
  }
  armIdle();
  if(S.over) setTimeout(showEnd, 380);
}

/* ═══════════ overlay ═══════════ */
function hideOverlay(){ var o=el("ovNode"); if(o && o.parentNode) o.parentNode.removeChild(o); }
function overlay(html, cls){
  hideOverlay();
  var d=document.createElement("div");
  d.className = "ov " + (cls||""); d.id="ovNode"; d.innerHTML = html;
  el("stage").appendChild(d);
  return d;
}
function showEnd(){
  if(!S.over) return;
  var T = {
    "win":         ["🏁","Bölüm tamam","Tüm sıvı teslim edildi."],
    "lose-strike": ["✕","Araba boş çıktı","Sola giden her araba dolu olmalı."],
    "lose-time":   ["⏱","Süre doldu","Vardiya bitti, hat durdu."],
    "lose-lock":   ["🔒","Tüpler kilitlendi","Sıradaki rengi koyacak yer kalmadı."],
    "lose-nocars": ["🚫","Araba kalmadı","Tüplerde teslim edilemeyen sıvı var."]
  }[S.over];
  var win = S.over === "win";
  var d = overlay(
    '<div class="big">'+T[0]+'</div><h2>'+T[1]+'</h2>'+
    '<p class="sub">'+T[2]+'<br><b style="color:var(--ink)">'+S.moves+'</b> hamle · '+
    '<b style="color:var(--ink)">'+S.delivered+'/'+S.total+'</b> araba</p>'+
    '<div class="ctrls">'+
      (win ? '<button class="go" data-a="next">Sonraki bölüm →</button>' : '')+
      (!win && S.undo.length ? '<button class="go" data-a="undo">↶ Geri al</button>' : '')+
      '<button data-a="retry">⟲ Tekrar</button>'+
    '</div>');
  d.addEventListener("click", function(e){
    var a = e.target.getAttribute && e.target.getAttribute("data-a");
    if(!a) return;
    hideOverlay();
    if(a==="next")  startLevel(S.n+1);
    if(a==="retry") startLevel(S.n);
    if(a==="undo")  undo();
  });
}
function showHelp(){
  var d = overlay(
    '<h2>Nasıl oynanır</h2>'+
    '<ol>'+
      '<li>Üstteki <b>büyük tüpte</b> renkli sıvılar sırada bekler. <b>Sarı çerçeveli</b> olan şu an dökülecek olan.</li>'+
      '<li>Bir <b>tüpe tıkla</b> — sıvı oraya akar. Tüp <b>boşsa ya da aynı renkteyse</b> kabul eder. Kabul eden tüplerin kenarı <b>o rengin tonuna</b> döner; gri olanlar almaz.</li>'+
      '<li>Her tüp, <b>altındaki boruyla</b> tam karşısındaki arabaya bağlıdır. Renk tutunca boru yanar ve damla düşer.</li>'+
      '<li>Her araba <b>2 birim</b> alır — gövdesindeki iki kutucuk dolarak bunu gösterir.</li>'+
      '<li>Her <b>2 hamlede</b> şerit <b>sola</b> kayar. En soldaki araba fabrikadan çıkar: '+
        'dolu çıkarsa ekran <b style="color:var(--ok)">yeşil</b>, boş çıkarsa <b style="color:var(--bad)">kırmızı</b> yanar.</li>'+
      '<li>Alttaki <b>Sırada</b> şeridi gelecek arabaları gösterir. Rengi önceden tüpe hazırla.</li>'+
      '<li>Çıkıştaki <b>◄ okları</b> kaç hamle sonra kayacağını söyler: <b>◄◄</b> iki, <b>◄</b> bir hamle.</li>'+
      '<li>Hamlen kalmadıysa <b>şerit kendi ilerler</b> — beklemen yeter.</li>'+
      '<li>Üstteki <b>geri sayım</b> ilk dökümde başlar ve yalnızca <b>senin sıran işlerken</b> akar. '+
        'Son 10 saniyede ekran <b style="color:var(--bad)">kırmızı</b> yanıp sönmeye başlar.</li>'+
    '</ol>'+
    '<div class="lose"><b style="color:var(--ink)">Tek şans</b><br>'+
      '<b>Bir araba bile boş çıkarsa bölüm biter.</b> Her bölümün sıfır kaçakla çözülebilir bir yolu var.</div>'+
    '<div class="lose" style="border-left-color:var(--accent)"><b style="color:var(--ink)">💡 Yol gösterme</b><br>'+
      '<b>1. bölümde</b> ▼ oku hep açıktır. <b>2 ve 3'+"'"+'te</b> yalnızca bir süre duraksarsan görünür. '+
      'Sonrasında <b>💡 düğmesi</b> ile açıp kapatabilirsin — ok bölümün çözümünü gösterdiği için varsayılan kapalıdır.</div>'+
    '<div class="lose"><b style="color:var(--ink)">Kaybetme</b><br>'+
      '• Sıradaki renk hiçbir tüpe sığmıyorsa <b>kilit</b>.<br>'+
      '• <b>3 araba</b> eksik dolu çıkarsa bölüm biter.</div>'+
    '<div class="ctrls"><button class="go" data-a="close">Anladım</button></div>', "help");
  d.addEventListener("click", function(e){
    if(e.target.getAttribute && e.target.getAttribute("data-a")==="close") hideOverlay();
  });
}

/* ═══════════ bağlama ═══════════ */
el("bUndo").addEventListener("click", undo);
el("bReset").addEventListener("click", function(){ hideOverlay(); startLevel(S.n); });
el("bFirst").addEventListener("click", function(){ hideOverlay(); startLevel(1); });
el("bHelp").addEventListener("click", showHelp);
el("bShape").addEventListener("click", function(){
  SHAPES = !SHAPES;
  this.className = "mini" + (SHAPES ? " on" : "");
  renderAll();
});
el("bHint").addEventListener("click", function(){
  HINTS = !HINTS;
  try{ localStorage.setItem(LS+".hints", HINTS ? "1" : "0"); }catch(e){}
  renderAll();
});
if(typeof window !== "undefined" && window.addEventListener)
  window.addEventListener("resize", function(){ if(S) fitRail(S.cfg.cols); });
document.addEventListener("keydown", function(e){
  if(e.key>="1" && e.key<="5"){
    var t = parseInt(e.key,10)-1;
    if(S && t < S.cfg.cols) place(t);
  }
  if(e.key==="z" || e.key==="Z") undo();
  if(e.key==="Escape") hideOverlay();
});

/* Kural ekranı KENDİLİĞİNDEN AÇILMAZ: oyun kendini görsel olarak anlatmalı.
   1. bölüm bunun için var — 2 renk, karışım yok, ▼ oku hep açık. */
var start = 1;
try{
  var v = parseInt(localStorage.getItem(LS),10); if(v>0 && v<200) start=v;
  var h = localStorage.getItem(LS+".hints"); if(h !== null) HINTS = (h === "1");
}catch(e){}
startLevel(start);

var bt = el("boot");                 // buraya gelindiyse JS calisti
if(bt && bt.parentNode) bt.parentNode.removeChild(bt);
})();
</script>

<script>
'use strict';
/* ============================================================
   BAGAJ USTASI — bölümlü (her bölüm 90 sn)
   Aşağıdaki eşyaları sürükleyip arabanın bagajına yerleştir. Eşyaya dokun = 90° çevir.
   Bagaj tamamen dolunca kapak kapanır, araba yola çıkar, yenisi gelir. Hedef sayıda araba → bölüm geçilir; süre biterse kaybedilir.
   Her bagaj, eşyalarıyla birebir dolacak şekilde üretilir: çözümü her zaman vardır.
   ============================================================ */
const W = 360, H = 640;
const CELL = 44, TRUNK_CY = 262;            // bagaj ızgarası: hücre boyu, merkez y
const TRAY_Y0 = 424, TRAY_CELL = 29;         // kaldırım: eşyalar küçültülmüş durur
const RUN_TIME = 90, HONK_AT = 10;
const DRAG_LIFT = 58;                         // sürüklenen eşya parmağın bu kadar üstünde (parmak kapatmasın)

/* Araba tipleri: '#' = kullanılamaz (tekerlek yuvası, stepne, alet kutusu). tier: hangi zorluktan itibaren gelir */
const CARS = [
  { name:'Mini',     body:'#F28CA0', tier:0, mask:['....','....','....'] },
  { name:'Fiat',     body:'#4FB3BF', tier:0, mask:['.....','.....','.....'] },
  { name:'Kare',     body:'#F2B233', tier:1, mask:['....','....','....','....'] },
  { name:'Sedan',    body:'#E5484D', tier:1, mask:['.....','.....','.....','.....'] },
  { name:'Hatchback',body:'#3E7BFA', tier:2, mask:['#...#','.....','.....','.....'] },
  { name:'Station',  body:'#E07A2E', tier:2, mask:['......','......','......','......'] },
  { name:'SUV',      body:'#2F9E6B', tier:3, mask:['......','#....#','......','......','......'] },
  { name:'Minivan',  body:'#C9A227', tier:3, mask:['......','......','......','..##..','......'] },
  { name:'Pikap',    body:'#8C6BB8', tier:3, mask:['......','......','##....','##....'] },
  { name:'Kombi',    body:'#D9683E', tier:4, mask:['......','......','......','......','#....#'] },
];
/* Bölümler — bir bölüm = bir araba, 90 sn içinde bagajı doldur.
   car: araba adı · sizes: parça boyu aralığı · singles: tek hücreli eşya · valiz: 2x3 olasılığı
   rotate: eşyalar karışık yönde gelir · hints: ipucu hakkı
   (bırakınca sığan yöne kendiliğinden dönme bölüme bağlı değil: oyuncu ayarı, varsayılan kapalı) */
const LEVELS = [
  { car:'Mini',      sizes:[3,4], singles:false, valiz:0,    rotate:false, hints:2 },
  { car:'Fiat',      sizes:[3,4], singles:false, valiz:0,    rotate:false, hints:2 },
  { car:'Mini',      sizes:[2,4], singles:false, valiz:0,    rotate:true,  hints:2 },
  { car:'Kare',      sizes:[3,4], singles:false, valiz:0,    rotate:true,  hints:2 },
  { car:'Fiat',      sizes:[2,4], singles:false, valiz:0,    rotate:true,  hints:2 },
  { car:'Sedan',     sizes:[3,4], singles:false, valiz:0.12, rotate:true,  hints:2 },
  { car:'Kare',      sizes:[2,4], singles:false, valiz:0.1,  rotate:true,  hints:1 },
  { car:'Hatchback', sizes:[3,4], singles:false, valiz:0,    rotate:true,  hints:1 },
  { car:'Sedan',     sizes:[2,4], singles:false, valiz:0.15, rotate:true,  hints:1 },
  { car:'Station',   sizes:[3,4], singles:false, valiz:0.15, rotate:true,  hints:1 },
  { car:'Hatchback', sizes:[2,5], singles:true,  valiz:0.1,  rotate:true,  hints:1 },
  { car:'SUV',       sizes:[3,4], singles:false, valiz:0.15, rotate:true,  hints:1 },
  { car:'Station',   sizes:[2,5], singles:true,  valiz:0.18, rotate:true,  hints:1 },
  { car:'Pikap',     sizes:[2,5], singles:true,  valiz:0.15, rotate:true,  hints:1 },
  { car:'Minivan',   sizes:[2,5], singles:true,  valiz:0.18, rotate:true,  hints:1 },
  { car:'Kombi',     sizes:[2,5], singles:true,  valiz:0.18, rotate:true,  hints:1 },
];
/* 16'dan sonrası: en zor arabalardan rastgele, son bölüm ayarları */
const HARD_CARS = ['SUV', 'Minivan', 'Pikap', 'Kombi', 'Station'];
const levelCfg = lv => { const c = lv < LEVELS.length ? LEVELS[lv] : Object.assign({}, LEVELS[LEVELS.length - 1], { car: HARD_CARS[(lv * 7) % HARD_CARS.length] });
  return Object.assign({ cars: 1 }, c); };
/* Eşya görünümü: şekle göre */
const LUGGAGE = {
  1:  [{ n:'Top', e:'⚽', c:'#F4F1EA' }, { n:'Şapka kutusu', e:'🎩', c:'#E7A6B8' }],
  2:  [{ n:'Spor çantası', e:'👜', c:'#5B7DB1' }, { n:'Termos', e:'☕', c:'#D96C4E' }],
  I3: [{ n:'Gitar kılıfı', e:'🎸', c:'#6B4A32' }],
  L3: [{ n:'Kedi taşıma', e:'🐱', c:'#9FC7D9' }],
  O4: [{ n:'Soğutucu', e:'❄', c:'#4FB3BF' }, { n:'Sırt çantası', e:'🎒', c:'#E5484D' }],
  I4: [{ n:'Sörf tahtası', e:'🏄', c:'#F2B233' }],
  L4: [{ n:'Bebek arabası', e:'👶', c:'#B98BD8' }],
  T4: [{ n:'Oyuncak kutusu', e:'🧸', c:'#F28C28' }],
  S4: [{ n:'Çadır çantası', e:'⛺', c:'#6DB33F' }],
  P5: [{ n:'Büyük çanta', e:'👝', c:'#C75B7A' }],
  R6: [{ n:'Valiz', e:'💼', c:'#3A6FD8' }, { n:'Valiz', e:'💼', c:'#2E2E36' }],
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ctx = null, master = null, noise = null, engine = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(t0, dur, f0, f1, g, type) { const o = ctx.createOscillator(), gg = ctx.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.006); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gg); gg.connect(master); o.start(t0); o.stop(t0 + dur + 0.02); }
  function burst(t0, dur, f, q, g, type) { const s = ctx.createBufferSource(); s.buffer = noise; const bp = ctx.createBiquadFilter(); bp.type = type || 'bandpass';
    bp.frequency.value = f; bp.Q.value = q; const gg = ctx.createGain(); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.005);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(bp); bp.connect(gg); gg.connect(master); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02); }
  const w = fn => (...a) => { if (!ctx) return; fn(ctx.currentTime, ...a); };
  return { init,
    pick: w(t => { tone(t, 0.07, 500, 750, 0.1, 'triangle'); burst(t, 0.05, 1200, 1, 0.04); }),
    rotate: w(t => { tone(t, 0.05, 1100, 1500, 0.08, 'triangle'); burst(t, 0.03, 3000, 2, 0.04); }),
    place: w((t, size, fillK) => { const f = 150 - size * 8; tone(t, 0.16, f * 1.4, f, 0.3); burst(t, 0.09, 500, 0.8, 0.14, 'lowpass');
      const p = 520 * Math.pow(2, Math.round(fillK * 7) * 2 / 12); tone(t + 0.04, 0.14, p, p, 0.07, 'triangle'); }),
    bad: w(t => { tone(t, 0.1, 220, 160, 0.14, 'square'); }),
    slam: w(t => { tone(t, 0.22, 110, 50, 0.4); burst(t, 0.12, 700, 0.7, 0.25, 'lowpass'); tone(t + 0.02, 0.05, 1800, 1200, 0.08, 'square'); }),
    engine: w(t => { const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); o.type = 'sawtooth'; lp.type = 'lowpass'; lp.frequency.value = 600;
      o.frequency.setValueAtTime(55, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.9); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1); o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t + 1.2); }),
    honk: w(t => { tone(t, 0.18, 420, 410, 0.08, 'square'); tone(t, 0.18, 530, 520, 0.06, 'square'); }),
    cheer: w(t => { [0, 4, 7, 12].forEach((s, i) => tone(t + 0.15 + i * 0.07, 0.22, 660 * Math.pow(2, s / 12), 660 * Math.pow(2, s / 12), 0.1, 'triangle')); }),
    tick: w(t => tone(t, 0.04, 1500, 1500, 0.05, 'square')),
    win: w(t => { [0, 4, 7, 12, 16].forEach((s, i) => tone(t + i * 0.09, 0.35, 523 * Math.pow(2, s / 12), 523 * Math.pow(2, s / 12), 0.14, 'triangle')); }),
  };
})();
const buzz = ms => { try { const ua = navigator.userActivation; if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} };

/* ---------------- ŞEKİL ---------------- */
const norm = cells => { const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]); };
const rot = cells => norm(cells.map(([x, y]) => [-y, x]));
const dims = cells => [Math.max(...cells.map(c => c[0])) + 1, Math.max(...cells.map(c => c[1])) + 1];
function shapeKey(cells) {
  const n = cells.length, [w, h] = dims(cells);
  if (n === 1) return 1; if (n === 2) return 2;
  if (n === 3) return (w === 3 || h === 3) ? 'I3' : 'L3';
  if (n === 4) {
    if (w === 4 || h === 4) return 'I4'; if (w === 2 && h === 2) return 'O4';
    // T: bir hücrenin 3 komşusu var
    const has = (x, y) => cells.some(c => c[0] === x && c[1] === y);
    if (cells.some(([x, y]) => [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx, dy]) => has(x + dx, y + dy)).length === 3)) return 'T4';
    // S/Z: iki satır/sütun kayık
    const rows = [...new Set(cells.map(c => c[1]))].length, cols = [...new Set(cells.map(c => c[0]))].length;
    if (rows === 2 && cols === 3 && !(has(0,0) && has(0,1)) && !(has(2,0) && has(2,1))) return 'S4';
    if (cols === 2 && rows === 3 && !(has(0,0) && has(1,0)) && !(has(0,2) && has(1,2))) return 'S4';
    return 'L4';
  }
  if (n === 6 && w * h === 6) return 'R6';
  return 'P5';
}

/* ---------------- BAGAJ ÜRETİMİ: boş hücreleri eşyalara böl ---------------- */
/* birkaç bölme dene, bölümün parça boyu aralığına en çok uyanı al (kolay bölümde garip 1'li/5'li parça çıkmasın) */
function makeTrunk(carIdx, P) {
  let best = null, bestBad = 1e9;
  for (let i = 0; i < 30 && bestBad > 0; i++) {
    const T = makeTrunkOnce(carIdx, P);
    const bad = T.pieces.filter(p => p.key !== 'R6' && (p.cells.length > P.sizes[1] || p.cells.length < (P.singles ? 1 : P.sizes[0]))).length;
    if (bad < bestBad) { best = T; bestBad = bad; }
  }
  return best;
}
function makeTrunkOnce(carIdx, P) {
  const car = CARS[carIdx], rows = car.mask.length, cols = car.mask[0].length;
  const free = [], owner = {};
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (car.mask[y][x] === '.') free.push([x, y]);
  const k = (x, y) => x + ',' + y, isFree = (x, y) => car.mask[y] && car.mask[y][x] === '.';
  let pieces = [];
  const unassigned = () => free.filter(([x, y]) => owner[k(x, y)] === undefined);
  let guard = 0;
  while (unassigned().length && guard++ < 200) {
    const un = unassigned(); const [sx, sy] = un[Math.floor(Math.random() * un.length)];
    const id = pieces.length, cells = [[sx, sy]]; owner[k(sx, sy)] = id;
    // büyük valiz (2x3) dene
    if (Math.random() < P.valiz) {
      const opts = [[2, 3], [3, 2]].sort(() => Math.random() - 0.5);
      for (const [rw, rh] of opts) {
        let ok = true; for (let yy = 0; yy < rh && ok; yy++) for (let xx = 0; xx < rw; xx++) { const X = sx + xx, Y = sy + yy; if (!isFree(X, Y) || (owner[k(X, Y)] !== undefined && !(X === sx && Y === sy))) { ok = false; break; } }
        if (ok) { for (let yy = 0; yy < rh; yy++) for (let xx = 0; xx < rw; xx++) { const X = sx + xx, Y = sy + yy; if (X === sx && Y === sy) continue; owner[k(X, Y)] = id; cells.push([X, Y]); } break; }
      }
    }
    if (cells.length === 1) {
      const [lo, hi] = P.sizes, target = lo + Math.floor(Math.random() * (hi - lo + 1));
      let tries = 0;
      while (cells.length < target && tries++ < 30) {
        const [cx, cy] = cells[Math.floor(Math.random() * cells.length)], [dx, dy] = [[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random() * 4)];
        const X = cx + dx, Y = cy + dy; if (isFree(X, Y) && owner[k(X, Y)] === undefined) { owner[k(X, Y)] = id; cells.push([X, Y]); }
      }
    }
    pieces.push(cells);
  }
  // hedef boya ulaşamayan küçük parçaları komşuya kat (kolay bölümlerde tek/ikili parça kalmasın)
  const minSize = P.singles ? 2 : Math.max(2, P.sizes[0]);
  for (let pass = 0; pass < 3; pass++) pieces.forEach((cells, id) => {
    if (!cells.length || cells.length >= minSize) return;
    if (P.singles && cells.length === 1 && Math.random() < 0.5) return;
    for (const [x, y] of cells) {
      let done = false;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const o = owner[k(x + dx, y + dy)];
        if (o !== undefined && o !== id && pieces[o].length && pieces[o].length + cells.length <= 5 && pieces[o].length !== 6) {
          for (const c of cells) { pieces[o].push(c); owner[k(c[0], c[1])] = o; } pieces[id] = []; done = true; break; } }
      if (done) break;
    }
  });
  pieces = pieces.filter(c => c.length);
  return { carIdx, rows, cols, mask: car.mask, grid: Array.from({ length: rows }, () => new Array(cols).fill(-1)),
    pieces: pieces.map((cells, i) => {
      const sol = { cells: norm(cells), gx: Math.min(...cells.map(c => c[0])), gy: Math.min(...cells.map(c => c[1])) };   // üretimdeki kesin çözüm
      let sh = sol.cells; const turns = P.rotate ? Math.floor(Math.random() * 4) : 0; for (let t = 0; t < turns; t++) sh = rot(sh);
      const key = shapeKey(sh), look = LUGGAGE[key][Math.floor(Math.random() * LUGGAGE[key].length)];
      return { id: i, cells: sh, key, look, sol, placed: false, gx: 0, gy: 0, tx: 0, ty: 0, x: 0, y: 0, scale: 0.5, rotA: 0, pop: 0 };
    }) };
}
/* şeklin farklı dönüşleri (tekrarsız) */
function rotations(cells) { const out = []; let c = norm(cells);
  for (let i = 0; i < 4; i++) { if (!out.some(o => o.join() === c.join())) out.push(c); c = rot(c); } return out; }
/* mevcut yerleşimle bagaj tamamlanabilir mi? çözüm varsa { id: {cells,gx,gy} } döner */
function solveFrom(T) {
  const g = T.grid.map(r => r.slice()), rest = T.pieces.filter(p => !p.placed), used = new Set(), sol = {};
  const rots = new Map(rest.map(p => [p.id, rotations(p.cells)]));
  let nodes = 0;
  function dfs() {
    if (++nodes > 60000) return false;
    let ex = -1, ey = -1;
    outer: for (let y = 0; y < T.rows; y++) for (let x = 0; x < T.cols; x++) if (T.mask[y][x] === '.' && g[y][x] < 0) { ex = x; ey = y; break outer; }
    if (ex < 0) return true;
    for (const p of rest) { if (used.has(p.id)) continue;
      for (const c of rots.get(p.id)) {
        const gx = ex - c[0][0], gy = ey - c[0][1];   // şeklin ilk hücresi (en üst-sol) boş hücreye otursun
        if (!c.every(([cx, cy]) => { const X = gx + cx, Y = gy + cy; return Y >= 0 && Y < T.rows && X >= 0 && X < T.cols && T.mask[Y][X] === '.' && g[Y][X] < 0; })) continue;

      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(S.hint.t * 7); drawPiece({ ...hp, rotA: 0, pop: 0 }, o.x + (S.hint.gx + w / 2) * CELL, o.y + (S.hint.gy + h / 2) * CELL, CELL, 'rgba(242,178,51,.85)');
      ctx.globalAlpha = 1; }
    if (DRAG && DRAG.moved) { const spot = dropResolve(DRAG.p, DRAG.x, DRAG.y - DRAG_LIFT);
      if (spot) { const o = trunkOrigin(T), [w, h] = dims(spot.cells); drawPiece({ ...DRAG.p, cells: spot.cells, rotA: 0, pop: 0 }, o.x + (spot.gx + w / 2) * CELL, o.y + (spot.gy + h / 2) * CELL, CELL, true); } }
    drawLid(T, offY, lid);
  }
  // kaldırımdaki eşyalar
  if (S.hint && A.st === 'idle') { const hp = T.pieces[S.hint.id]; if (!hp.placed && !(DRAG && DRAG.p === hp)) { const [w, h] = dims(hp.cells), k = 1 + 0.08 * Math.sin(S.hint.t * 7);
    ctx.strokeStyle = '#F2B233'; ctx.lineWidth = 3; rr(hp.x - w * TRAY_CELL / 2 * k - 6, hp.y - h * TRAY_CELL / 2 * k - 6, w * TRAY_CELL * k + 12, h * TRAY_CELL * k + 12, 10); ctx.stroke(); } }
  for (const p of T.pieces) if (!p.placed && !(DRAG && DRAG.p === p && DRAG.moved)) drawPiece(p, p.x, p.y, CELL * p.scale);
  if (DRAG && DRAG.moved) drawPiece(DRAG.p, DRAG.p.x, DRAG.p.y, CELL * DRAG.p.scale);
  for (const q of S.parts) { ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of S.pops) { const k = q.t; ctx.globalAlpha = 1 - k * k; ctx.font = '800 ' + q.size + 'px "Baloo 2",sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = '#fff';
    ctx.strokeText(q.txt, q.x, q.y - k * 40); ctx.fillStyle = q.col; ctx.fillText(q.txt, q.x, q.y - k * 40); }
  ctx.globalAlpha = 1;
  if (S.running && S.lv === 0 && S.cars === 0 && S.placed === 0) { ctx.fillStyle = 'rgba(58,46,38,.85)'; rr(W / 2 - 128, TRAY_Y0 - 36, 256, 26, 13); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 13px "Baloo 2",sans-serif'; ctx.fillText('Sürükle → bagaja koy · dokun → çevir', W / 2, TRAY_Y0 - 23); }
}

/* ---------------- HUD / EKRAN / DÖNGÜ ---------------- */
const HUD = { dirty: true, update() { if (!this.dirty) return; this.dirty = false;
  $('hLv').textContent = 'Bölüm'; $('hCars').textContent = S.lv + 1;
  $('hFill').textContent = Math.round(fillPct() * 100) + '%'; $('hTime').textContent = Math.ceil(S.left);
  $('hTimeBox').className = 'stat r' + (S.left <= HONK_AT ? ' warn' : '');
  $('hHints').textContent = S.hints; $('bHint').disabled = S.hints <= 0; $('bHint').style.opacity = S.hints > 0 ? 1 : 0.45; } };
function hideOv() { const o = $('ov'); if (o) o.remove(); }
function overlay(html) { hideOv(); const d = document.createElement('div'); d.className = 'ov'; d.id = 'ov'; d.innerHTML = html; $('cab').appendChild(d); return d; }
/* bölüme gir: özet ekranı → Başla */
function startLevel(lv) {
  newRun(lv); HUD.dirty = true;
  const c = S.cfg, news = [];
  // bu bölümde ilk kez görülen şeyleri duyur (önceki bölümlerle karşılaştır)
  const prev = Array.from({ length: Math.min(lv, LEVELS.length) }, (_, i) => levelCfg(i)), first = f => !prev.some(f);
  const blocked = cfg => CARS.find(x => x.name === cfg.car).mask.some(r => r.includes('#'));
  if (lv === 0) news.push('Eşyaları <b>sürükleyip</b> bagaja yerleştir, <b>dokunarak çevir</b>.');
  if (c.rotate && first(p => p.rotate)) news.push('Yeni: eşyalar artık <b>karışık yönde</b> geliyor.');
  if (c.valiz > 0 && first(p => p.valiz > 0)) news.push('Yeni: <b>büyük valizler</b>.');
  if (blocked(c) && first(blocked)) news.push('Yeni: <b>stepne yuvalı</b> bagaj — koyu hücreler dolmaz.');
  if (c.singles && first(p => p.singles)) news.push('Yeni: <b>küçük eşyalar</b> (top, şapka kutusu).');
  overlay('<div style="font-size:46px">' + (lv === 0 ? '🚗💼' : '🚙') + '</div><h2>' + (lv === 0 ? 'Bagaj Ustası' : 'Bölüm ' + (lv + 1)) + '</h2>'
    + '<p><b>' + c.car + '</b> tatile çıkıyor: bagajını <b>90 saniyede</b> doldur.<br>' + news.join('<br>') + '</p>'
    + '<div class="row"><button class="go" id="bGo">▶ ' + (lv === 0 ? 'Başla' : 'Bölüm ' + (lv + 1)) + '</button></div>');
  $('bGo').onclick = () => { SFX.init(); hideOv(); S.running = true; };
  try { history.replaceState(null, '', '#' + (lv + 1)); } catch (e) {}
}
function showWin() {
  const stars = S.left >= 60 ? 3 : S.left >= 30 ? 2 : 1, best = loadBest();
  best.lv = Math.max(best.lv, S.lv + 1); best.stars[S.lv] = Math.max(best.stars[S.lv] || 0, stars); saveBest(best);
  overlay('<div style="font-size:46px">🏁</div><h2>Bölüm ' + (S.lv + 1) + ' tamam!</h2><div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>'
    + '<p>' + Math.ceil(S.left) + ' saniye kala bitirdin.<br>★★ 30 sn · ★★★ 60 sn kala</p>'
    + '<div class="row"><button class="go" id="bNx">▶ Sonraki bölüm</button><button id="bAg">↻ Tekrar oyna</button></div>');
  [...$('stars').children].forEach((s, i) => { if (i < stars) setTimeout(() => s.classList.add('on'), 300 + i * 250); });
  $('bNx').onclick = () => startLevel(S.lv + 1);
  $('bAg').onclick = () => { startLevel(S.lv); $('bGo').click(); };
}
function showFail() {
  overlay('<div style="font-size:46px">⏰</div><h2>Süre doldu!</h2><p>' + S.cars + '/' + S.goal + ' araba yola çıktı.<br>Az kaldı, bir daha dene!</p>'
    + '<div class="row"><button class="go" id="bAg">↻ Tekrar dene</button></div>');
  $('bAg').onclick = () => { startLevel(S.lv); $('bGo').click(); };
}
$('bRe').onclick = () => { startLevel(S.lv); $('bGo').click(); };
$('bHint').onclick = () => { SFX.init(); useHint(); };
const syncAuto = () => { $('bAuto').textContent = '🔄 Oto ' + (AUTO_ROT ? 'açık' : 'kapalı'); $('bAuto').className = AUTO_ROT ? 'go' : ''; };
$('bAuto').onclick = () => { SFX.init(); AUTO_ROT = !AUTO_ROT; try { localStorage.setItem(AUTO_KEY, AUTO_ROT ? '1' : '0'); } catch (e) {} syncAuto(); SFX.rotate(); };
syncAuto();
let lastTs = 0;
function loop(ts) { requestAnimationFrame(loop); const dt = Math.min(0.033, lastTs ? (ts - lastTs) / 1000 : 0); lastTs = ts;
  step(dt); if (S.trunk) HUD.dirty = true; HUD.update(); draw(); }
fitCanvas(); fitCanvas(); addEventListener('resize', () => { fitCanvas(); fitCanvas(); });
const hashLv = parseInt(location.hash.slice(1), 10);   // #N ile bölüm seç (test için)
startLevel(hashLv > 0 ? hashLv - 1 : loadBest().lv); requestAnimationFrame(loop); $('boot').remove();
</script>

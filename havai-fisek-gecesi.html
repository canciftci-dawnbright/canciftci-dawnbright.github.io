// Havai Fisek Gecesi: 8x8 fisek kutusu. Ayni renk >=2 dik komsu gruba dokun -> hepsi patlar, goge ucar, gokteki resimde
// kendi renginden bir noktayi yakar. Grup 5-6 -> roket (satir/sutun), 7-8 -> bomba (elmas r=2), 9+ -> yildiz topu (o rengin hepsi).
// Ozel fisege dokun -> patlar; yanindaki ozel fisekle kombo. Patlamalar diger ozelleri zincirleme tetikler.
// Hedef: resmin tum noktalari + engel hedefleri, hamle bitmeden. Engeller: kasa (komsu patlama, hp), buz (kutu kilitli, dusmez),
// balon (duser, komsu patlamada patlar), zincir (kutu eslesir ama yerinde kalir, zincir kirilir), bulut (her tur yayilir).
const NX = 8, NY = 8;
const RENK = ['#ff4a6a', '#ffc83a', '#3aa8ff', '#4ad06a', '#b06aff'];
// piksel resimler: rakam = renk, '.' = bos
const RESIMLER = {
  kalp: ['.00...00.', '0110.0110', '011101110', '.0111110.', '..01110..', '...010...', '....0....'],
  cicek: ['...111....', '..10001...', '..10301...', '...111....', '....2.....', '..2.2.2...', '...222....'],
  balik: ['....222...', '.2.22222..', '.22223222.', '.2.22222..', '....222...'],
  ev: ['...00...', '..0000..', '.000000.', '.344443.', '.342243.', '.342243.'],
  roket: ['....0.....', '...000....', '...222....', '...222....', '..32223...', '..3.1.3...', '....1.....'],
  gokkusagi: ['..000000..', '.01111110.', '0122222210', '0123333210', '0123..3210'],
};
const BOLUMLER = [
  { ad: 'İlk Kıvılcım', tohum: 4899, renk: 4, resim: 'kalp', hamle: 18, ogretici: true },
  { ad: 'Kasa Dolu Meydan', tohum: 11018, renk: 4, resim: 'cicek', hamle: 28, kasa: 10, yeni: 'kasa' },
  { ad: 'Buzlu Gece', tohum: 4266, renk: 4, resim: 'balik', hamle: 22, buz: 12, yeni: 'buz' },
  { ad: 'Balon Şenliği', tohum: 9330, renk: 5, resim: 'roket', hamle: 28, balon: 8, kasa: 6, yeni: 'balon' },
  { ad: 'Zincirli Kutular', tohum: 9541, renk: 5, resim: 'ev', hamle: 30, zincir: 10, yeni: 'zincir' },
  { ad: 'Yağmur Bulutları', tohum: 3211, renk: 5, resim: 'gokkusagi', hamle: 32, bulut: 3, buz: 6, yeni: 'bulut' },
];
function rng(s) { return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function resimSay(ad) { const R = RESIMLER[ad], say = {}; R.forEach(sat => [...sat].forEach(c => { if (c !== '.') say[c] = (say[c] || 0) + 1; })); return say; }
function bolumKur(n, tohum) { const S = BOLUMLER[Math.min(n, BOLUMLER.length - 1)], O = { n, S, r: rng(tohum || S.tohum || n * 7919 + 77), g: [], hamle: S.hamle, olaylar: [], bitti: false, kazandi: false, uid: 1, tur: 0 };
  O.ihtiyac = resimSay(S.resim); for (const k in O.ihtiyac) if (+k >= S.renk) { O.ihtiyac[k % S.renk] = (O.ihtiyac[k % S.renk] || 0) + O.ihtiyac[k]; delete O.ihtiyac[k]; }
  O.hedef = { kasa: 0, buz: 0, balon: 0, zincir: 0, bulut: 0 };
  for (let y = 0; y < NY; y++) { O.g.push([]); for (let x = 0; x < NX; x++) O.g[y].push(yeniKutu(O)); }
  const bos = () => { for (let d = 0; d < 200; d++) { const x = Math.floor(O.r() * NX), y = Math.floor(O.r() * NY); const c = O.g[y][x]; if (c && c.t === 'k' && !c.buz && !c.zincir) return [x, y]; } return null; };
  // engeller: kasa alt yarida, buz/zincir kutularda, balon ust, bulut kosede
  for (let q = 0; q < (S.kasa || 0); q++) { const p = bos(); if (p && p[1] >= 3) { O.g[p[1]][p[0]] = { id: O.uid++, t: 'kasa', hp: q % 3 === 0 ? 2 : 1 }; O.hedef.kasa++; } else q--; }

<style>

.yer b { position: absolute; left: 50%; bottom: calc(var(--u) * -.2); transform: translateX(-50%); font-size: calc(var(--u) * .2); line-height: 1; color: #3a2210; background: #e8c070; border-radius: 3px; padding: 0 3px; font-weight: 900; z-index: 1; box-shadow: 0 1px 0 #8a6020; }

.raf { height: calc(var(--u) * .2); margin: 0 calc(var(--u) * -.08); border-radius: 0 0 5px 5px; background: linear-gradient(#c89058, #8a5a2e); box-shadow: 0 3px 4px rgba(0,0,0,.35); }

.kitap { position: absolute; left: 0; top: 0; width: calc(var(--u) * .92); height: calc(var(--u) * 1.02); transform-origin: 50% 100%; pointer-events: auto;
  transition: transform .26s cubic-bezier(.3,1.3,.5,1), filter .35s, opacity .3s, width .25s, height .25s; will-change: transform; }
.kitap img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); pointer-events: none; transition: transform .35s cubic-bezier(.3,1.4,.5,1); }

.kitap .no { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); min-width: calc(var(--u) * .36); height: calc(var(--u) * .36); border-radius: 50%; background: #fff8e6; color: #3a2210;
  font-weight: 900; font-size: calc(var(--u) * .25); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 -2px 0 rgba(0,0,0,.12); border: 2px solid var(--r); pointer-events: none; }

.kitap.arka { pointer-events: none; filter: brightness(.42) saturate(.6); } .kitap.arka .no { opacity: 0; }
.kitap.yatan { pointer-events: none; } .kitap.yatan img { position: absolute; left: 50%; top: 50%; width: var(--yh); height: var(--yw); transform: translate(-50%, -50%) rotate(-90deg); }
.kitap.yatan.siradaki::after { content: '⬇'; position: absolute; left: 50%; top: 70%; transform: translateX(-50%); font-size: calc(var(--u) * .3); color: #ffd36a; text-shadow: 0 1px 2px #000; animation: nabiz .5s infinite alternate; }
.kitap.yatan.ters img { transform: translate(-50%, -50%) rotate(90deg); }
.kitap.kilitli { pointer-events: none; }
.kitap.surukle { transition: none; z-index: 50; filter: drop-shadow(0 10px 8px rgba(0,0,0,.45)); }
.kitap.secili { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px var(--altin)); }

@keyframes ipucuK { to { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 14px var(--altin)); } }
/* sirt gorunumu: dar, dik kitap sirtlari */

  ekranAc(`<div class="ust">SORT BULMACA · ${n} BÖLÜM</div><h1>Matruşka Dükkanı</h1><p>Her rafta bebekler <b>iç içe</b>. En dıştaki bebeği kaldır, boş rafa ya da kendinden <b>küçük</b> bir bebeğin üstüne kapat. Aynı desenin bütün boyları iç içe olunca takım vitrine gider!</p>
    <div class="ornek">${[1, 0.855, 0.71, 0.565].map(k => `<img src="${ART.d0 || ''}" style="height:${Math.round(56 * k)}px">`).join('')}<span style="font-size:26px;align-self:center;margin:0 6px">➜</span><img src="${ART.d0 || ''}" style="height:56px"><span style="font-size:22px;align-self:center">✨</span></div>
    <div class="harita">${Array.from({ length: n }, (_, i) => { const S = SEVIYE_TAB[i]; const y = kayit.yildiz[i] || 0;
      return `<button ${i > kayit.acik ? 'disabled' : ''} class="${i === kayit.acik ? 'su' : ''}" data-n="${i}"><div class="hIkon">${S.yeniEngel ? engelGorsel(S.yeniEngel, 30) : miniImg(30, 6)}</div><span>${i + 1}</span><small>${'★'.repeat(y)}${'☆'.repeat(3 - y)}</small></button>`; }).join('')}</div>
    <button class="btn" id="bOyna">${kayit.acik ? 'Devam: ' + (Math.min(kayit.acik, n - 1) + 1) : 'Başla'} ▶</button>`);
  $('ekran').querySelectorAll('.harita button').forEach(b => b.onclick = () => { SES.hazirla(); seviyeBaslat(+b.dataset.n); });
  $('bOyna').onclick = () => { SES.hazirla(); seviyeBaslat(Math.min(kayit.acik, n - 1)); }; }
function seviyeBaslat(n, tohum) {
  O = oyunKur(n, tohum == null ? Math.floor(Math.random() * 1000) : tohum); O.vitrin = []; gecmis = []; devamHakki = true; secili = -1; surukle = null; bitisZ = 0; ipAdim = 0; ip('');
  ekranKapat(); seviyeKur();
  const S = O.S, yeni = S.yeniEngel;
  if (yeni && !kayit.gordu[yeni]) { const E = ENGEL[yeni];
    ekranAc(`<div class="ust">YENİ ENGEL</div><div class="engelG">${engelGorsel(yeni, 86)}</div><h2>${E.ad}</h2><p>${E.metin}</p><button class="btn" id="bTamam">Anladım ▶</button>`);
    $('bTamam').onclick = () => { kayit.gordu[yeni] = 1; yaz(); ekranKapat(); }; }
  if (S.ogretici) { ipAdim = 1; ip('Bebekler <b>iç içe</b> duruyor; rafın altındaki küçük resimler <b>içindekiler</b>. Parlayan bebeği tut, parlayan rafa bırak!');
    setTimeout(() => { const m = ipucuHamle(); if (m) ipucuIsaretle(m, 0); }, 600); }
  else ip(`${O.takim} takım tamamla · ${O.kalan} hamle hakkın var.`, 2600);
}
function bitisEkrani() {
  if (O.kazandi) { const y = yildiz(O); const eski = kayit.yildiz[O.n] || 0; kayit.yildiz[O.n] = Math.max(eski, y); if (y === 3 && eski < 3) kayit.ipucu++; kayit.acik = Math.max(kayit.acik, Math.min(O.n + 1, SEVIYE_TAB.length - 1)); yaz();
    ekranAc(`<div class="ust">${O.n + 1}. BÖLÜM</div><h1>Vitrin hazır!</h1><div class="yildizlar">${[0, 1, 2].map(i => `<span class="${i < y ? 'dolu' : ''}" style="animation-delay:${0.2 + i * 0.25}s">★</span>`).join('')}</div>
      <div class="kolSatir">${O.vitrin.map((s, i) => `<img src="${KAPAK(s)}" style="height:46px;box-shadow:none;animation-delay:${0.5 + i * 0.08}s">`).join('')}</div>
      <p>${O.hamle} hamlede bitti (usta: ${O.par} hamle)${y === 3 && eski < 3 ? '<br><b>+1 🔍 ipucu kazandın!</b>' : ''}</p>
      ${O.n + 1 < SEVIYE_TAB.length ? '<button class="btn" id="bSonraki">Sonraki ▶</button>' : '<p><b>Bütün bölümler bitti! 🎉</b></p>'}<button class="btn gri" id="bHarita">Harita</button>`);
    if ($('bSonraki')) $('bSonraki').onclick = () => seviyeBaslat(O.n + 1); $('bHarita').onclick = haritaAc; }
  else { const sik = O.neden === 'sikisti';
    ekranAc(`<div class="ust">${O.n + 1}. BÖLÜM</div><h1>${sik ? '😵 Sıkıştın' : '👣 Hamle bitti'}</h1><p>${sik ? 'Hiç hamle kalmadı: küçük bebekler boş raf bekliyor.' : 'Hamle hakkın bitti.'}<br>${O.tamam}/${O.takim} takım tamamlandı.</p>
      ${!sik && devamHakki ? '<button class="btn ikinci" id="bDevam">+6 hamle ile devam</button>' : ''}${sik && kayit.ekRaf > 0 ? '<button class="btn ikinci" id="bRafE">+1 raf ile devam</button>' : ''}${gecmis.length && kayit.geri > 0 ? '<button class="btn ikinci" id="bGeriE">↶ Geri al</button>' : ''}
      <button class="btn" id="bTekrar">Tekrar dene</button><button class="btn gri" id="bHarita">Harita</button>`);
    if ($('bDevam')) $('bDevam').onclick = () => { devamHakki = false; O.bitti = false; O.neden = ''; O.kalan = 6; ekranKapat(); hudGuncelle(); };
    if ($('bRafE')) $('bRafE').onclick = () => { ekranKapat(); rafEkle(); hudGuncelle(); };
    if ($('bGeriE')) $('bGeriE').onclick = () => { ekranKapat(); geriAl(); hudGuncelle(); };
    $('bTekrar').onclick = () => seviyeBaslat(O.n); $('bHarita').onclick = haritaAc; }
}

/* ---------------- test kancalari */
window.G = { get O() { return O; }, seviyeBaslat, hamleTest: (a, b) => hamle(a, b), ipucuHamle, geriAl, rafEkle, ciz,
  dbg: () => O.raflar.map(R => (R.kilit > 0 ? '#' + R.kilit : '') + (R.kedi ? '@' : '') + (R.etiket >= 0 ? 'E' + R.etiket : '') + (R.sepet ? 'S' : '') + '[' + R.d.map(x => (x.toz ? '?' : '') + x.s + ':' + x.v).join(' ') + ']').join(' ') };
O = oyunKur(0, 0); O.vitrin = []; seviyeKur(); haritaAc();

</script>

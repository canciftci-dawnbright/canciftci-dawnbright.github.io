<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Boyacı Kedi</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #2c3a4a; overflow: hidden; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: relative; width: 100%; max-width: 480px; height: 100%; margin: 0 auto; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 30%, #8fd0d8 0%, #5aa8c0 45%, #3a7896 100%); }
#app::before { content: ''; position: absolute; inset: 0; opacity: .14; pointer-events: none; background: radial-gradient(circle at 20% 20%, #fff 0 3px, transparent 4px) 0 0 / 46px 46px, radial-gradient(circle at 70% 60%, #fff 0 2px, transparent 3px) 0 0 / 38px 38px; }
#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 10px 10px 0; z-index: 30; }
.pill { background: rgba(255,255,255,.95); color: #24506a; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 rgba(20,50,70,.35); white-space: nowrap; }
#hud button { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,.95); color: #24506a; font-size: 19px; font-weight: 900; box-shadow: 0 3px 0 rgba(20,50,70,.35); flex: none; }
#hud button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(20,50,70,.35); }
#ad { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#pati { position: absolute; left: 50%; transform: translateX(-50%); top: 60px; z-index: 20; display: flex; align-items: center; gap: 8px; }
#patiRenk { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.25); transition: background .25s; }
#tahta { position: absolute; left: 50%; transform: translateX(-50%); z-index: 5; touch-action: none; filter: drop-shadow(0 10px 14px rgba(10,40,60,.45)); }
#lejant { position: absolute; left: 10px; right: 10px; z-index: 20; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
#lejant button { border: 0; border-radius: 12px; background: rgba(255,255,255,.9); box-shadow: 0 3px 0 rgba(20,50,70,.3); padding: 4px 9px 4px 5px; display: flex; align-items: center; gap: 5px; font: 800 12px inherit; font-family: inherit; color: #24506a; }
#lejant img { width: 26px; height: 26px; object-fit: contain; }
#lejant .duv { width: 22px; height: 22px; border-radius: 5px; background: linear-gradient(90deg, #f7ecd8 0 40%, #7a4a26 40% 60%, #f1e4cc 60%); }
#ip { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 35; background: rgba(255,255,255,.97); color: #24506a; border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.35; box-shadow: 0 4px 0 rgba(20,50,70,.35); text-align: center; transition: opacity .3s; }
#ip.gizli { opacity: 0; pointer-events: none; }
#ip b { color: #e0602a; }
.yazi { position: absolute; font-weight: 900; font-size: 17px; color: #fff; text-shadow: 0 2px 0 #24506a, 0 0 6px rgba(0,0,0,.4); white-space: nowrap; transform: translate(-50%, 0); animation: yazi 1.2s ease-out forwards; pointer-events: none; z-index: 40; }
.yazi.uyari { color: #ffe0d8; } .yazi.altin { color: #ffe27a; font-size: 21px; }
@keyframes yazi { 0% { transform: translate(-50%, 6px) scale(.6); opacity: 0; } 18% { transform: translate(-50%, -6px) scale(1.12); opacity: 1; } 100% { transform: translate(-50%, -40px) scale(1); opacity: 0; } }
.konf { position: absolute; width: 9px; height: 9px; border-radius: 2px; pointer-events: none; z-index: 45; }
.ekran { position: absolute; inset: 0; z-index: 60; background: rgba(10,30,45,.55); display: flex; align-items: center; justify-content: center; padding: 18px; }
.ekran.gizli { display: none; }
.kart { width: 100%; max-width: 370px; background: linear-gradient(#ffffff, #e8f6fa); color: #24506a; border-radius: 22px; padding: 18px; text-align: center; box-shadow: 0 8px 0 #3a7896, 0 18px 40px rgba(0,0,0,.45); animation: kartGel .35s cubic-bezier(.3,1.4,.5,1); }
@keyframes kartGel { from { transform: scale(.7); opacity: 0; } }
.kart h1 { margin: 4px 0 6px; font-size: 27px; color: #1e5a7a; }
.kart p { margin: 6px 0 12px; font-size: 15px; line-height: 1.4; }
.kart .ust { font-size: 11px; letter-spacing: 2px; font-weight: 800; color: #5aa8c0; }
.kart .gorsel { height: 90px; margin: 4px 0; }
.kart .engelGorsel { height: 80px; margin: 6px 0 2px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
.kart .duvarOrnek { display: inline-block; width: 90px; height: 70px; margin: 6px 0; border-radius: 10px; background: linear-gradient(90deg, #f7ecd8 0 46%, #8a5a32 46% 54%, #f1e4cc 54%); box-shadow: inset 0 0 0 3px #e8c890; }
.damla { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; z-index: 42; }
.kalp { position: absolute; font-size: 20px; pointer-events: none; z-index: 42; }
.btn { border: 0; border-radius: 16px; padding: 12px 26px; font-size: 19px; font-weight: 900; color: #fff; background: linear-gradient(#ffb04a, #f07a1a); box-shadow: 0 5px 0 #a04a08; margin: 6px 4px 0; font-family: inherit; }
.btn.gri { background: linear-gradient(#a8c0cc, #7896a6); box-shadow: 0 5px 0 #4a6676; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.harita { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 14px; }
.harita button { border: 0; border-radius: 16px; padding: 10px 4px 6px; background: linear-gradient(#fff, #d8eef4); box-shadow: 0 4px 0 #8ab8c8; font-size: 22px; color: #24506a; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 900; }
.harita button small { font-size: 13px; color: #f0a020; letter-spacing: 1px; }
.harita button.su { background: linear-gradient(#ffe6a8, #ffc860); box-shadow: 0 4px 0 #c08a28; animation: nabiz .7s infinite alternate; }
.harita button:disabled { filter: grayscale(1); opacity: .45; }
@keyframes nabiz { to { transform: scale(1.06); } }
.yildizlar { font-size: 42px; letter-spacing: 6px; margin: 2px 0; }
.yildizlar span { display: inline-block; color: #c8d8e0; } .yildizlar span.dolu { color: #ffc12a; text-shadow: 0 3px 0 #b07a10; animation: yGel .4s cubic-bezier(.3,1.6,.5,1) backwards; }
@keyframes yGel { from { transform: scale(0) rotate(-90deg); } }
</style>

function haritaAc() { const n = SEVIYE_TAB.length;

    <button class="btn" id="bOyna">${kayit.acik ? 'Devam: ' + (Math.min(kayit.acik, n - 1) + 1) : 'Başla'} ▶</button>`);
  $('ekran').querySelectorAll('.harita button').forEach(b => b.onclick = () => baslat(+b.dataset.n)); $('bOyna').onclick = () => baslat(Math.min(kayit.acik, n - 1)); }
const ENGEL_SIMGE = { duvar: '🧱', ok: '⬆️', buz: '🧊', kapi: '🔑', karis: '🌈' }, ENGEL_IMG = { ok: 'ok', buz: 'buzK', kapi: 'anahtar', karis: 'gokkusagi' };
function bolumAl(n) { const h = HAZIR && HAZIR[n]; if (!h) return oyunKur(n, (Date.now() & 0xffff) + n); const B = JSON.parse(JSON.stringify(h)); B.duvar = new Set(B.duvar); return yeniOyun(seviye(n), B); }
let gordu = {}; try { gordu = JSON.parse(localStorage.getItem(KAYIT + '.gordu')) || {}; } catch (e) { }

      ekranAc(`<div class="ust">YENİ ENGEL</div>${ENGEL_IMG[yeni] && ART[ENGEL_IMG[yeni]] ? `<img class="engelGorsel" src="${ART[ENGEL_IMG[yeni]]}">` : '<div class="duvarOrnek"></div>'}<h1>${E.ad}</h1><p>${E.metin}</p><button class="btn" id="bTamam">Anladım ▶</button>`);
      $('bTamam').onclick = () => { gordu[yeni] = 1; try { localStorage.setItem(KAYIT + '.gordu', JSON.stringify(gordu)); } catch (e) { } $('ekran').classList.add('gizli'); acilisZ = performance.now(); }; } }, 30);
}

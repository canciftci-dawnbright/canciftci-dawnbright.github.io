<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kütüphaneci</title>
<style>
:root { --u: 40px; --ahsap: #8a5a32; --ahsapK: #5e3a1e; --ahsapA: #b07a46; --altin: #ffd36a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #2a1a10; overflow: hidden; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: relative; width: 100%; max-width: 480px; height: 100%; margin: 0 auto; overflow: hidden; background: #6b4426 center / cover no-repeat; }
#arkaKarart { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,20,5,.15), rgba(40,20,5,0) 30%, rgba(40,20,5,.25)); pointer-events: none; }
#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; z-index: 30; }
.pill { background: rgba(255,248,232,.94); color: #5a3418; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 rgba(60,30,10,.35); white-space: nowrap; }
#bMenu { width: 38px; height: 38px; border-radius: 12px; border: 0; background: rgba(255,248,232,.94); color: #5a3418; font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 rgba(60,30,10,.35); }
#seviyeAd { flex: 1; overflow: hidden; text-overflow: ellipsis; }
#saat { min-width: 86px; text-align: center; font-size: 17px; }
#saat.az { background: #ff5a4a; color: #fff; animation: nabiz .5s infinite alternate; }
#saat.donmus { background: #9fe0ff; color: #164a6a; }
@keyframes nabiz { to { transform: scale(1.08); } }
#kol { position: absolute; left: 12px; right: 12px; top: 56px; height: 50px; z-index: 20; border-radius: 12px; background: linear-gradient(#a8743f, #7a4e28); box-shadow: inset 0 -6px 0 #5a3418, 0 4px 8px rgba(0,0,0,.35); display: flex; align-items: flex-end; padding: 0 8px 7px; gap: 8px; }
#kolSay { font-weight: 900; color: #fff3d0; text-shadow: 0 2px 0 #4a2a10; font-size: 15px; align-self: center; margin-bottom: -4px; min-width: 46px; }
#kolKitap { flex: 1; height: 38px; display: flex; gap: 2px; align-items: flex-end; overflow: hidden; justify-content: flex-end; }
#kolKitap img { height: 34px; flex: none; filter: drop-shadow(0 2px 1px rgba(0,0,0,.4)); animation: kolGel .4s ease-out; }
@keyframes kolGel { from { transform: translateY(-30px) scale(1.4); opacity: 0; } }
#kombo { position: absolute; right: 16px; top: 112px; z-index: 25; background: linear-gradient(#ffcf4a, #ff8a2a); color: #5a2a00; font-weight: 900; border-radius: 12px; padding: 4px 10px; font-size: 15px; box-shadow: 0 3px 0 #a04a10; transform: scale(0); transition: transform .2s; overflow: hidden; }
#kombo.var { transform: scale(1); }
#kombo i { position: absolute; left: 0; bottom: 0; height: 3px; background: #fff; }
#dolap { position: absolute; left: 50%; transform: translateX(-50%); z-index: 5; padding: 12px; border-radius: 16px;
  background: linear-gradient(90deg, #6a4020, #9a6634 12%, #a8743f 50%, #9a6634 88%, #6a4020); box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,220,170,.35); }
#dolap::before { content: ''; position: absolute; left: -8px; right: -8px; top: -14px; height: 20px; border-radius: 10px 10px 4px 4px; background: linear-gradient(#c08a52, #8a5a2e); box-shadow: 0 4px 6px rgba(0,0,0,.35); }
#izgara { display: grid; grid-template-columns: repeat(2, auto); gap: 6px; }
.bolme { position: relative; padding: calc(var(--u) * .46) calc(var(--u) * .08) 0; border-radius: 6px;
  background: linear-gradient(#3a2212, #5a361c 60%, #4a2c16); box-shadow: inset 0 6px 10px rgba(0,0,0,.55), inset 0 -2px 0 rgba(0,0,0,.3); }
.yerler { display: flex; height: calc(var(--u) * 1.06); }
.yer { position: relative; width: var(--u); }
.yer b { position: absolute; left: 50%; bottom: calc(var(--u) * -.2); transform: translateX(-50%); font-size: calc(var(--u) * .2); line-height: 1; color: #3a2210; background: #e8c070; border-radius: 3px; padding: 0 3px; font-weight: 900; z-index: 1; box-shadow: 0 1px 0 #8a6020; }
.yer.hedef::after { content: ''; position: absolute; inset: 4% 6%; border-radius: 6px; border: 2px dashed rgba(255,240,200,.55); }
.yer.hedef.dogru::after { border: 2px solid var(--altin); background: rgba(255,211,106,.22); box-shadow: 0 0 12px rgba(255,211,106,.6); }
.yer.ustunde::after { content: ''; position: absolute; inset: 0 2%; border-radius: 6px; background: rgba(255,255,255,.25); border: 2px solid #fff; }
.raf { height: calc(var(--u) * .2); margin: 0 calc(var(--u) * -.08); border-radius: 0 0 5px 5px; background: linear-gradient(#c89058, #8a5a2e); box-shadow: 0 3px 4px rgba(0,0,0,.35); }
#katman, #ust { position: absolute; inset: 0; pointer-events: none; }
#katman { z-index: 10; } #ust { z-index: 15; }
.kitap { position: absolute; left: 0; top: 0; width: calc(var(--u) * .92); height: calc(var(--u) * 1.02); transform-origin: 50% 100%; pointer-events: auto;
  transition: transform .26s cubic-bezier(.3,1.3,.5,1), filter .35s, opacity .3s, width .25s, height .25s; will-change: transform; }
.kitap img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); pointer-events: none; }
.kitap .no { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); min-width: calc(var(--u) * .36); height: calc(var(--u) * .36); border-radius: 50%; background: #fff8e6; color: #3a2210;
  font-weight: 900; font-size: calc(var(--u) * .25); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 -2px 0 rgba(0,0,0,.12); border: 2px solid var(--r); pointer-events: none; }
.kitap .tozu { position: absolute; inset: -8% -10%; background: center / contain no-repeat; opacity: 0; pointer-events: none; transition: opacity .4s, transform .4s; }
.kitap.toz img { filter: grayscale(1) brightness(.75) blur(.5px); } .kitap.toz .no { opacity: 0; } .kitap.toz .tozu { opacity: .95; }
.kitap.arka { pointer-events: none; filter: brightness(.3) saturate(.5); } .kitap.arka .no { opacity: 0; }
.kitap.yatan { pointer-events: none; } .kitap.yatan img, .kitap.yatan .no { opacity: 0; }
.kitap.yatan::before { content: ''; position: absolute; inset: 0; border-radius: 3px; background: linear-gradient(var(--r), color-mix(in srgb, var(--r) 70%, #000)); box-shadow: inset 0 2px 0 rgba(255,255,255,.3), 0 2px 2px rgba(0,0,0,.4); }
.kitap.yatan::after { content: ''; position: absolute; right: 4%; top: 18%; bottom: 18%; width: 22%; background: #f4ead2; border-radius: 2px; }
.kitap.kilitli { pointer-events: none; }
.kitap.surukle { transition: none; z-index: 50; filter: drop-shadow(0 10px 8px rgba(0,0,0,.45)); }
.kitap.secili { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px var(--altin)); }
.kitap.ipucu { animation: ipucuK .6s infinite alternate; }
@keyframes ipucuK { to { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 14px var(--altin)); } }
/* sirt gorunumu: dar, dik kitap sirtlari */
#app.sirt .yerler { height: calc(var(--u) * 1.98); }
#app.sirt #arabaRaf .ayer { height: calc(var(--u) * 2); }
.kitap .sirtR, .kitap .bant { display: none; }
#app.sirt .kitap:not(.yatan) { border-radius: 3px 3px 2px 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--r) 55%, #000) 0, var(--r) 16%, color-mix(in srgb, var(--r) 70%, #fff) 46%, var(--r) 78%, color-mix(in srgb, var(--r) 50%, #000) 100%);
  box-shadow: 0 3px 3px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35); }
#app.sirt .kitap:not(.yatan) img { display: none; }
#app.sirt .kitap:not(.yatan) .sirtR { display: block; position: absolute; left: 12%; right: 12%; top: 5%; height: 30%; border-radius: 2px; background-size: 330% auto; background-position: 50% 42%; box-shadow: 0 0 0 1px rgba(255,220,140,.9), 0 1px 2px rgba(0,0,0,.4); }
#app.sirt .kitap:not(.yatan) .bant { display: block; position: absolute; left: 0; right: 0; height: 3%; background: linear-gradient(#ffe9a8, #c8962e); opacity: .9; }
#app.sirt .kitap .bant.b1 { top: 39%; } #app.sirt .kitap .bant.b2 { top: 44%; } #app.sirt .kitap .bant.b3 { top: 74%; }
#app.sirt .kitap .no { bottom: 5%; min-width: calc(var(--u) * .5); height: calc(var(--u) * .5); font-size: calc(var(--u) * .32); }
#app.sirt .kitap.toz { filter: grayscale(1) brightness(.75); }
#app.sirt .kitap.toz .sirtR { opacity: .4; }
#app.sirt .yer { width: calc(var(--u) * .8); }
#app.sirt #arabaRaf .ayer { width: calc(var(--u) * .8); }
.kitap .pano { display: none; }
#app.sirt .kitap.resimli:not(.yatan) .pano { display: block; position: absolute; left: 0; right: 0; background-repeat: no-repeat; box-shadow: 0 1px 0 rgba(255,230,160,.8), 0 -1px 0 rgba(255,230,160,.8); }
#app.sirt .kitap.resimli:not(.yatan) .sirtR, #app.sirt .kitap.resimli .no, #app.sirt .kitap.resimli .bant.b1, #app.sirt .kitap.resimli .bant.b2 { display: none; }
#app.sirt .kitap.resimli .bant.b3 { top: 88%; }
#app.sirt .kitap.resimli.toz .pano { opacity: .35; }
.ornekPano { position: relative; width: 240px; height: 80px; margin: 8px auto 4px; border-radius: 6px; background: center / cover; box-shadow: 0 3px 6px rgba(0,0,0,.3); }
.ornekPano i { position: absolute; top: -4px; bottom: -4px; width: 4px; background: #f4e2bd; }
.cam { position: absolute; border-radius: 6px; background: linear-gradient(120deg, rgba(200,235,255,.45), rgba(160,210,240,.18) 40%, rgba(255,255,255,.4) 46%, rgba(170,215,245,.2) 55%); border: 3px solid #c8a060; box-shadow: inset 0 0 12px rgba(255,255,255,.5); transition: transform .5s cubic-bezier(.6,-0.3,.7,1), opacity .5s; display: flex; align-items: center; justify-content: center; }
.cam.acik { transform: translateY(-120%); opacity: 0; }
.cam .kilitImg { width: 42%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
.cam .anahtar { position: absolute; right: 4%; top: 6%; min-width: 30px; height: 30px; border-radius: 15px; background: #fff8e6; color: #7a3a10; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.cam .anahtar.vur { animation: nabiz .25s 2 alternate; }
.cam .kilitImg { width: auto; height: 46%; }
.kediImg { position: absolute; transition: transform .7s ease-in, opacity .7s; filter: drop-shadow(0 3px 2px rgba(0,0,0,.4)); }
.kediImg.gitti { transform: translate(140%, -30%) rotate(10deg); opacity: 0; }
.zzz { position: absolute; font-size: 14px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000; animation: zzz 2s infinite; }
@keyframes zzz { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(10px, -18px); opacity: 0; } }
.efekt { position: absolute; pointer-events: none; }
.yazi { position: absolute; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 #6a3a10, 0 0 6px rgba(0,0,0,.5); white-space: nowrap; transform: translate(-50%, 0); animation: yazi 1.2s ease-out forwards; pointer-events: none; z-index: 40; }
.yazi.altin { color: var(--altin); font-size: 22px; } .yazi.uyari { color: #ffd0c0; font-size: 16px; }
@keyframes yazi { 0% { transform: translate(-50%, 6px) scale(.6); opacity: 0; } 18% { transform: translate(-50%, -6px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -46px) scale(1); opacity: 0; } }
#arabaAlan { position: absolute; left: 50%; transform: translateX(-50%); z-index: 6; display: none; align-items: flex-end; gap: 6px; }
#arabaAlan.var { display: flex; }
#arabaImg { height: 74px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.4)); }
#arabaRaf { position: relative; display: flex; gap: 3px; padding: 6px 6px 0; border-radius: 10px 10px 0 0; background: rgba(60,30,10,.55); border: 2px solid #c8a060; border-bottom: 0; }
#arabaRaf .ayer { width: var(--u); height: calc(var(--u) * 1.08); position: relative; border-bottom: 5px solid #a8743f; }
#arabaRaf.dolu { border-color: #ff6a4a; animation: nabiz .4s infinite alternate; }
#arabaSayac { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); }
#alt { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 14px; z-index: 30; }
.guc { position: relative; width: 62px; height: 56px; border-radius: 16px; border: 0; background: linear-gradient(#fff6de, #f0d8a8); box-shadow: 0 4px 0 #a07038; font-size: 26px; }
.guc small { position: absolute; right: -6px; top: -6px; min-width: 22px; height: 22px; border-radius: 11px; background: #ff5a4a; color: #fff; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
.guc.bos { filter: grayscale(1); opacity: .6; }
.guc:active { transform: translateY(3px); box-shadow: 0 1px 0 #a07038; }
#ip { position: absolute; left: 14px; right: 14px; bottom: 76px; z-index: 35; background: rgba(255,248,232,.97); color: #4a2a10; border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.35; box-shadow: 0 4px 0 rgba(80,40,10,.4); transition: opacity .3s, transform .3s; text-align: center; }
#ip.ust { bottom: auto; top: 112px; }
.zerre { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,236,190,.75); box-shadow: 0 0 6px rgba(255,220,150,.9); pointer-events: none; z-index: 1; animation: zerre linear infinite; }
@keyframes zerre { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .7; } 100% { transform: translate(var(--dx), -140px); opacity: 0; } }
.kolSatir { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 4px 0 8px; }
.kolSatir img { height: 34px; border-radius: 3px; box-shadow: 0 2px 3px rgba(0,0,0,.3); animation: kolGel .4s ease-out backwards; }
#ip.gizli { opacity: 0; transform: translateY(10px); pointer-events: none; }
#ip b { color: #c0501a; }
.ekran { position: absolute; inset: 0; z-index: 60; background: rgba(30,15,5,.6); display: flex; align-items: center; justify-content: center; padding: 18px; backdrop-filter: blur(3px); }
.ekran.gizli { display: none; }
.kart { width: 100%; max-width: 380px; background: linear-gradient(#fff8ea, #f4e2bd); color: #4a2a10; border-radius: 22px; padding: 18px 18px 20px; text-align: center; box-shadow: 0 8px 0 #a07038, 0 18px 40px rgba(0,0,0,.5); animation: kartGel .35s cubic-bezier(.3,1.4,.5,1); }
@keyframes kartGel { from { transform: scale(.7); opacity: 0; } }
.kart h1 { margin: 4px 0 6px; font-size: 28px; color: #7a3a10; }
.kart h2 { margin: 2px 0 8px; font-size: 22px; color: #7a3a10; }
.kart p { margin: 6px 0 12px; font-size: 15px; line-height: 1.4; }
.kart .ust { font-size: 11px; letter-spacing: 2px; font-weight: 800; color: #b07a46; }
.btn { border: 0; border-radius: 16px; padding: 12px 26px; font-size: 19px; font-weight: 900; color: #fff; background: linear-gradient(#5ec85a, #2f9a3a); box-shadow: 0 5px 0 #1f6a28; margin: 6px 4px 0; font-family: inherit; }
.btn.ikinci { background: linear-gradient(#ffb04a, #e07a1a); box-shadow: 0 5px 0 #9a4a08; }
.btn.gri { background: linear-gradient(#b8a890, #8a7a62); box-shadow: 0 5px 0 #5a4a36; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.harita { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 14px; }
.harita button { border: 0; border-radius: 16px; padding: 10px 4px 6px; background: linear-gradient(#ffe7b0, #f2c878); box-shadow: 0 4px 0 #b07a36; font-size: 26px; color: #6a3a10; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.harita button small { font-size: 13px; color: #c07a10; letter-spacing: 1px; }
.harita button span { font-size: 12px; font-weight: 800; }
.harita button.su { background: linear-gradient(#bff09a, #7cd05a); box-shadow: 0 4px 0 #3a8a28; animation: nabiz .7s infinite alternate; }
.harita button:disabled { filter: grayscale(1); opacity: .5; }
.yildizlar { font-size: 44px; letter-spacing: 6px; margin: 4px 0; }
.yildizlar span { display: inline-block; color: #d8c8a8; }
.yildizlar span.dolu { color: #ffc12a; text-shadow: 0 3px 0 #b07a10; animation: yildizGel .4s cubic-bezier(.3,1.6,.5,1) backwards; }
@keyframes yildizGel { from { transform: scale(0) rotate(-90deg); } }
.engelSimge { font-size: 52px; }
.engelImg { height: 86px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
.ornek { display: flex; justify-content: center; gap: 4px; margin: 6px 0; }
.ornek img { height: 54px; }
.ornek div { position: relative; }
.ornek div b { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); background: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 13px; display: flex; align-items: center; justify-content: center; color: #3a2210; }
</style>
</head>
<body>
<div id="app">
  <div id="arkaKarart"></div><div id="zerreler"></div>
  <div id="hud"><button id="bMenu">☰</button><div class="pill" id="seviyeAd">Kütüphaneci</div><div class="pill" id="saat">⏱ 0:00</div></div>
  <div id="kol"><span id="kolSay">0/0</span><div id="kolKitap"></div></div>
  <div id="kombo">Kombo ×1<i></i></div>
  <div id="dolap"><div id="izgara"></div></div>
  <div id="arabaAlan"><img id="arabaImg" alt=""><div id="arabaRaf"><span class="pill" id="arabaSayac">🛒</span></div></div>
  <div id="katman"></div>
  <div id="ust"></div>
  <div id="alt"><button class="guc" id="bIpucu">🔍<small id="ipucuSay">3</small></button><button class="guc" id="bDondur">❄️<small id="dondurSay">2</small></button></div>
  <div id="ip" class="gizli"></div>
  <div id="ekran" class="ekran gizli"></div>

  O = oyunKur(n, (Date.now() & 0xffff) + n * 13); basladi = false; gecmis = new Set(); sonHamle = null; dondurT = 0; devamHakki = true; secili = null; surukle = null; bitisZ = 0; ipAdim = 0; ip('');
  ekranKapat(); seviyeKur();
  const S = O.S, yeni = S.yeniEngel;
  if (yeni && !kayit.gordu[yeni]) { const E = ENGEL[yeni];
    ekranAc(`<div class="ust">YENİ ENGEL</div>${ENGEL_IMG[yeni] && ART[ENGEL_IMG[yeni]] ? `<img class="engelImg" src="${ART[ENGEL_IMG[yeni]]}">` : `<div class="engelSimge">${E.simge}</div>`}<h2>${E.ad}</h2><p>${E.metin}</p>
      ${S.araba ? `<p>${ENGEL.araba.metin}</p>` : ''}<button class="btn" id="bTamam">Anladım ▶</button>`);
    $('bTamam').onclick = () => { kayit.gordu[yeni] = 1; yaz(); ekranKapat(); }; }
  if (S.ogretici) { ipAdim = 1; ip('Bir kitabı <b>sürükleyip</b> boş bir yere bırak. (Dokunup seçebilirsin de.) Süre ilk hamlende başlar.'); }
  else ip(`Süre ilk hamlende başlar. ${O.takim} seri ciltle!`, 2600);
}
function bitisEkrani() {
  if (O.kazandi) { const y = yildiz(O); const eski = kayit.yildiz[O.n] || 0; kayit.yildiz[O.n] = Math.max(eski, y); if (y === 3 && eski < 3) kayit.ipucu++; kayit.acik = Math.max(kayit.acik, Math.min(O.n + 1, SEVIYE_TAB.length - 1)); yaz();
    ekranAc(`<div class="ust">${O.n + 1}. BÖLÜM</div><h1>Raflar düzenlendi!</h1><div class="yildizlar">${[0, 1, 2].map(i => `<span class="${i < y ? 'dolu' : ''}" style="animation-delay:${0.2 + i * 0.25}s">★</span>`).join('')}</div>
      <div class="kolSatir">${tamamlanan.map((s, i) => `<img src="${KAPAK(s)}" style="animation-delay:${0.5 + i * 0.06}s">`).join('')}</div>
      <p>${O.cilt} seri ciltlendi · en iyi kombo ×${O.enKombo} · kalan süre ${sureYaz(O.kalan)}${y === 3 && eski < 3 ? '<br><b>+1 🔍 ipucu kazandın!</b>' : ''}</p>
      ${O.n + 1 < SEVIYE_TAB.length ? '<button class="btn" id="bSonraki">Sonraki ▶</button>' : '<p><b>Bütün bölümler bitti! 🎉</b></p>'}<button class="btn gri" id="bHarita">Harita</button>`);
    if ($('bSonraki')) $('bSonraki').onclick = () => seviyeBaslat(O.n + 1); $('bHarita').onclick = haritaAc; }
  else { const neden = O.neden === 'araba' ? 'İade arabası taştı! Arabadaki kitapları raflara yerleştirmeyi unutma.' : 'Kütüphane kapandı! Süre bitti.';
    ekranAc(`<div class="ust">${O.n + 1}. BÖLÜM</div><h1>${O.neden === 'araba' ? '🛒 Araba taştı' : '⏰ Süre bitti'}</h1><p>${neden}<br>${O.cilt}/${O.takim} seri ciltlendi.</p>
      ${devamHakki && O.neden === 'sure' ? '<button class="btn ikinci" id="bDevam">+20 sn ile devam</button>' : ''}<button class="btn" id="bTekrar">Tekrar dene</button><button class="btn gri" id="bHarita">Harita</button>`);
    if ($('bDevam')) $('bDevam').onclick = () => { devamHakki = false; O.bitti = false; O.neden = ''; O.kalan = 20; ekranKapat(); };
    $('bTekrar').onclick = () => seviyeBaslat(O.n); $('bHarita').onclick = haritaAc; }
}

/* ---------------- test kancalari */
window.G = { get O() { return O; }, seviyeBaslat, ileri: sn => { for (let k = 0; k < sn * 30; k++) { son -= 1000 / 30; kare(performance.now(), true); } },
  tasiTest: (k, h) => hamle(k, h), enIyiHamle, ciz, dbg: () => O.bolme.map(B => B.on.map(x => x ? turBilgi(x.s).ad[0] + (resimliMi(x.s) ? 'r' : '') + x.v + (x.toz ? '*' : '') : '_').join('') + (B.arka.length ? '+' + B.arka.length : '') + (B.yigin.length ? '^' + B.yigin.length : '') + (B.kilit > 0 ? '#' + B.kilit : '') + (B.kedi >= 0 ? '@' : '')).join(' ') };
O = oyunKur(0, 1); seviyeKur(); haritaAc();
</script>

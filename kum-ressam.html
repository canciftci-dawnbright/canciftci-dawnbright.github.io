<script>
'use strict';
/* ============================================================
   KUM RESSAMI — kum dökerek resmi oluştur (his dilimi)
   Boş cam çerçevede hedef resmin hayaleti. Üstteki rayda kamyonlar soldan sağa geçer.
   Kamyon, SIRADAKİ boş hücresi (sütunun kum yığınının hemen üstü) kendi renginde olan her sütuna döker;
   o sütunda renk değişene kadar yığar. Kum alttan üste birikir: üstteki renk, altı bitmeden dökülemez.
   Kumu biten kamyon gider; rayın sonuna kumla gelen kamyon park yerine geçer (dokun → tekrar yola).
   KAYIP: park yeri kalmaz. KAZANÇ: resim tamamlanır ve canlanır. ★ = az park yeri.
   ============================================================ */
const W = 360, H = 640;
const COLS = 50, ROWS = 40, CELL = 5, DEP = 3, BX = 55, BY = 150;
const BW = COLS * CELL, BH = ROWS * CELL, FLOOR = BY + BH;
const RAIL_Y = 116, RAIL_X0 = 8, RAIL_X1 = 352, SPEED = 105, GAP = 44, POUR_STAGGER = 0.022, GRAV = 900;
const PARK_Y = 392, Q_Y = 458, Q_STEP = 42;
const PAL = [null,
  [238, 64, 82],   // 1 kırmızı
  [40, 120, 62],   // 2 koyu yeşil
  [120, 196, 92],  // 3 açık yeşil
  [246, 238, 200], // 4 krem / beyaz
  [44, 34, 40],    // 5 siyah
  [255, 150, 190], // 6 pembe
  [214, 80, 140],  // 7 koyu pembe
  [80, 160, 230],  // 8 mavi
  [240, 205, 150], // 9 bej
  [140, 90, 55],   // 10 kahverengi
  [210, 100, 70],  // 11 kiremit
  [255, 160, 40],  // 12 turuncu
  [52, 64, 104],   // 13 lacivert
  [255, 215, 70],  // 14 sarı
];
const CNAME = ['', 'kırmızı', 'koyu yeşil', 'açık yeşil', 'krem', 'siyah', 'pembe', 'koyu pembe', 'mavi', 'bej', 'kahverengi', 'kiremit', 'turuncu', 'lacivert', 'sarı'];
/* Bölümler — pic · emo · park: park yeri · onRail: raydaki en fazla kamyon · cols: kuyruk sütunu · caps: kamyon kapasiteleri
   noise: kuyruk sırasının karışıklığı (0 = alttan üste düzenli, 1 = tamamen karışık) */
const LEVELS = [
  { pic: 'karpuz', emo: '🍉', name: 'Karpuz', park: 5, onRail: 3, cols: 2, caps: [50, 70], noise: 0.12, hint: 'Kamyona dokun, rengini döksün' },
  { pic: 'kek', emo: '🧁', name: 'Kek', park: 5, onRail: 4, cols: 3, caps: [50, 80], noise: 0.25, hint: 'Üstteki renk, altı bitmeden dökülmez' },
  { pic: 'ev', emo: '🏠', name: 'Ev', park: 5, onRail: 4, cols: 3, caps: [60, 90, 120], noise: 0.35, hint: 'Basılı tut: nereye döküleceğini gör' },
  { pic: 'penguen', emo: '🐧', name: 'Penguen', park: 3, onRail: 4, cols: 3, caps: [50, 80], noise: 0.65, hint: 'Sadece 3 park yeri — gönderirken dikkat' },
  { pic: 'yelkenli', emo: '⛵', name: 'Yelkenli', park: 4, onRail: 4, cols: 3, caps: [60, 90, 120], noise: 0.5, hint: 'Son resim: yelkenler en son yükselir' },
];
const LV_KEY = 'dbg.kumressam.lv', GAL_KEY = 'dbg.kumressam.galeri';
const MILESTONES = [[0.25, 'Güzel gidiyor!'], [0.5, 'Yarısı tamam!'], [0.75, 'Harika!']];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const rgb = (c, k) => { const p = PAL[c]; k = k || 1; return `rgb(${Math.round(Math.min(255, p[0] * k))},${Math.round(Math.min(255, p[1] * k))},${Math.round(Math.min(255, p[2] * k))})`; };

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ac = null, master = null, noise = null, mOn = false, nextBeat = 0, beat = 0; const last = new Map();
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(t0, dur, f0, f1, g, type) { const o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gg); gg.connect(master); o.start(t0); o.stop(t0 + dur + 0.02); }
  function burst(t0, dur, f, q, g, type) { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = type || 'bandpass';
    bp.frequency.value = f; bp.Q.value = q; const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.01);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(bp); bp.connect(gg); gg.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.02); }
  const w = (name, fn, gapT) => (...a) => { if (!ac) return; const t = ac.currentTime; if (gapT && last.has(name) && t - last.get(name) < gapT) return; last.set(name, t); fn(t, ...a); };
  const note = (t, semi, dur, g, type) => { const f = 523.25 * Math.pow(2, semi / 12); tone(t, dur, f, f, g, type || 'sine'); };
  return { init,
    grain: w('grain', (t, k) => { tone(t, 0.02, 2600 + rnd(-700, 700), 1800, 0.012, 'sine'); }, 0.022),
    pour: w('pour', t => { burst(t, 0.18, 3400, 0.7, 0.05); }, 0.12),
    go: w('go', t => { tone(t, 0.12, 300, 520, 0.07, 'triangle'); burst(t, 0.1, 1200, 1, 0.05); }),
    deny: w('deny', t => { tone(t, 0.12, 220, 190, 0.08, 'square'); }),
    empty: w('empty', (t, k) => { [0, 4, 7, 12].forEach((s, i) => note(t + i * 0.06, s + (k % 6), 0.3, 0.07, 'triangle')); }),
    band: w('band', (t, k) => { note(t, 12 + (k % 5) * 2, 0.35, 0.05, 'sine'); }, 0.15),
    park: w('park', t => { tone(t, 0.1, 400, 260, 0.07, 'triangle'); burst(t, 0.06, 800, 1, 0.05, 'lowpass'); }),
    warn: w('warn', t => { tone(t, 0.12, 700, 680, 0.06, 'square'); }, 0.6),
    roll: w('roll', t => { for (let i = 0; i < 6; i++) burst(t + i * 0.08, 0.1, 300, 1, 0.08, 'lowpass'); tone(t, 0.5, 90, 110, 0.05, 'sawtooth'); }),
    fire: w('fire', t => { burst(t, 0.5, 250, 0.5, 0.5, 'lowpass'); tone(t, 0.35, 160, 40, 0.3, 'sine'); burst(t, 0.15, 3000, 0.8, 0.15); tone(t + 0.1, 0.55, 1800, 700, 0.03, 'sine'); }),
    boom: w('boom', t => { burst(t, 1.6, 140, 0.4, 0.9, 'lowpass'); tone(t, 0.9, 110, 28, 0.45, 'sine'); burst(t, 0.6, 2200, 0.5, 0.3); for (let i = 0; i < 14; i++) burst(t + 0.08 + i * 0.05, 0.08, rnd(1500, 5000), 2, 0.08); }),
    firework: w('firework', t => { tone(t, 0.35, 700, 1600, 0.03, 'sine'); burst(t + 0.35, 0.3, 1200, 0.6, 0.25, 'lowpass'); for (let i = 0; i < 8; i++) burst(t + 0.45 + i * 0.04, 0.04, rnd(3000, 7000), 3, 0.05); }),
    honk: w('honk', t => { tone(t, 0.1, 440, 430, 0.05, 'square'); tone(t, 0.1, 554, 545, 0.035, 'square'); tone(t + 0.14, 0.16, 440, 430, 0.05, 'square'); tone(t + 0.14, 0.16, 554, 545, 0.035, 'square'); }, 0.2),
    tap: w('tap', t => { tone(t, 0.05, 900, 1200, 0.04, 'triangle'); }),
    cheer: w('cheer', (t, k) => { [0, 4, 7, 12, 16].forEach((s, i) => note(t + i * 0.05, s + k * 2, 0.35, 0.06, 'triangle')); burst(t, 0.4, 5000, 0.6, 0.04); }),
    combo: w('combo', (t, k) => { const s = Math.min(k, 8) * 2; note(t, 7 + s, 0.15, 0.06, 'square'); note(t + 0.07, 12 + s, 0.25, 0.06, 'triangle'); }),
    shimmer: w('shimmer', t => { for (let i = 0; i < 6; i++) tone(t + i * 0.04, 0.2, 2000 + i * 260, 2400 + i * 260, 0.015, 'sine'); }, 0.2),
    heart: w('heart', t => { tone(t, 0.09, 72, 50, 0.22, 'sine'); tone(t + 0.17, 0.09, 66, 48, 0.16, 'sine'); }, 0.8),
    music: on => { if (!ac) return; mOn = on; if (on) nextBeat = Math.max(nextBeat, ac.currentTime + 0.1); },
    musicTick: () => {   // yumuşak pentatonik pıt pıt + bas; 0.3 sn vuruş
      if (!ac || !mOn) return;
      while (nextBeat < ac.currentTime + 0.25) {
        const t = nextBeat, sc = [0, 2, 4, 7, 9, 12, 14], prog = [0, -3, -5, -7][Math.floor(beat / 16) % 4];
        if (beat % 2 === 0 || (beat % 8 === 5)) note(t, sc[(beat * 3 + (beat >> 2)) % 7] + prog - 12, 0.45, 0.02, 'triangle');
        if (beat % 8 === 0) { const f = 130.8 * Math.pow(2, prog / 12); tone(t, 1.1, f, f, 0.035, 'sine'); }
        if (beat % 4 === 2) burst(t, 0.03, 7000, 1, 0.012);
        beat++; nextBeat += 0.3;
      }
    },
    lose: w('lose', t => { tone(t, 0.6, 500, 200, 0.12, 'sine'); tone(t + 0.4, 0.8, 400, 150, 0.1, 'sine'); }),
    win: w('win', t => { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => note(t + i * 0.11, s - 5, 0.9, 0.1, 'triangle')); burst(t + 0.6, 1.2, 6000, 0.5, 0.05); }),
  };
})();
const buzz = ms => { try { const ua = navigator.userActivation; if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} };

/* ---------------- 2.5D KÜP SPRITE'LARI ---------------- */
const SPR_SC = 2, SPR = [];   // SPR[renk][ton][maske] · maske: 1 üst yüz, 2 sağ yüz
function buildSprites() {
  for (let c = 1; c < PAL.length; c++) { SPR[c] = [];
    for (let s = 0; s < 4; s++) { SPR[c][s] = [];
      for (let m = 0; m < 4; m++) {
        const cnv = document.createElement('canvas'); cnv.width = (CELL + DEP) * SPR_SC; cnv.height = (CELL + DEP) * SPR_SC;
        const g = cnv.getContext('2d'); g.scale(SPR_SC, SPR_SC);
        const k = 0.9 + s * 0.06, x = 0, y = DEP;
        g.fillStyle = rgb(c, k); g.fillRect(x, y, CELL, CELL);
        g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(x, y, CELL, 1);
        if (m & 1) { g.fillStyle = rgb(c, k * 1.22); g.beginPath(); g.moveTo(x, y); g.lineTo(x + DEP, y - DEP); g.lineTo(x + CELL + DEP, y - DEP); g.lineTo(x + CELL, y); g.closePath(); g.fill(); }
        if (m & 2) { g.fillStyle = rgb(c, k * 0.68); g.beginPath(); g.moveTo(x + CELL, y); g.lineTo(x + CELL + DEP, y - DEP); g.lineTo(x + CELL + DEP, y + CELL - DEP); g.lineTo(x + CELL, y + CELL); g.closePath(); g.fill(); }
        SPR[c][s][m] = cnv;
      } } }
}

/* ---------------- RESİMLER ---------------- */
/* Her resim: fn(c, b) → renk (b = zeminden satır). Kum alttan yığıldığı için havada kalan hücreler sonda temizlenir. */
const KARPUZ_SEEDS = new Set();   // çekirdekler: iki yarım halka üzerinde gözyaşı biçimli
for (const [k, n] of [[0.55, 7], [0.3, 4]]) for (let i = 0; i < n; i++) {
  const a = (i + 0.5) / n * Math.PI, sx = Math.round(24.5 - Math.cos(a) * 17 * k), sb = Math.round(Math.sin(a) * 24 * k);
  for (const [ox, ob] of [[0, 0], [0, -1], [1, -1]]) KARPUZ_SEEDS.add((sx + ox) + ',' + (sb + ob));
}
const inEll = (c, b, cx, cb, rx, ry) => ((c - cx) / rx) ** 2 + ((b - cb) / ry) ** 2 <= 1;
const PICS = {
  karpuz(c, b) {
    const cx = 24.5, rx = 17, ry = 24, d = Math.hypot((c - cx) / rx, (b + 0.5) / ry); if (d > 1) return 0;
    if ((1 - d) * ry < 2.4) return 2;
    return KARPUZ_SEEDS.has(c + ',' + b) ? 5 : 1;
  },
  kek(c, b) {
    const cx = 24.5, dx = Math.abs(c - cx);
    if (b <= 12) { if (dx > 11 + b * 0.45) return 0; return Math.floor((c + 40) / 3) % 2 ? 6 : 7; }              // kâğıt kalıp, çizgili
    if (inEll(c, b, 25, 31.5, 3.3, 3.3)) return 1;                                                                 // kiraz
    if (c === 26 && b >= 34 && b <= 37) return 2;                                                                  // sap
    if (b >= 13 && inEll(c, b, cx, 13, 19, 17)) {                                                                   // krema
      if (hash(c * 3, b * 7) < 0.06) return [14, 8, 1, 3][Math.floor(hash(c, b) * 4)];                            // renkli serpme
      return ((b - 13) + Math.round(Math.sin(c * 0.45) * 1.5)) % 5 === 0 ? 6 : 4; }
    return 0;
  },
  ev(c, b) {
    const cx = 24.5;
    if (c >= 33 && c <= 36 && b >= 18 && b <= 31) { if (16 - (b - 18) * 1.05 >= Math.abs(c - cx)) return (b % 3 === 0) ? 10 : 11; return 1; }  // baca
    if (b >= 18) { const w = 16 - (b - 18) * 1.05; if (Math.abs(c - cx) > w) return 0; return (b % 3 === 0) ? 10 : 11; }   // çatı
    if (c < 9 || c > 40) return 0;
    if (c >= 21 && c <= 28 && b <= 10) return (c === 27 && b === 5) ? 14 : 10;                                      // kapı + tokmak
    for (const x0 of [12, 32]) if (c >= x0 && c <= x0 + 5 && b >= 7 && b <= 13) return (c === x0 + 2 || c === x0 + 3 || b === 10) ? 4 : 8;   // pencereler
    return 9;
  },
  penguen(c, b) {
    const cx = 24.5; if (!inEll(c, b, cx, 0, 15.5, 31)) return 0;
    if ((c >= 17 && c <= 21 || c >= 28 && c <= 32) && b <= 1) return 12;                                          // ayaklar
    if (inEll(c, b, cx, 24, 2.2, 1.6) && b <= 24) return 12;                                                        // gaga
    for (const ex of [20, 29]) { if (inEll(c, b, ex, 26, 2.2, 2.2)) return (Math.abs(c - ex) < 1 && Math.abs(b - 26) < 1) ? 5 : 4; }   // gözler
    for (const ex of [17, 32]) if (inEll(c, b, ex, 22, 1.8, 1.3)) return 6;                                        // yanaklar
    if (inEll(c, b, cx, 0, 10, 23)) return 4;                                                                       // beyaz karın
    if (Math.abs(c - cx) > 12 && b >= 5 && b <= 17) return 13;                                                      // kanatlar
    return 5;
  },
  yelkenli(c, b) {
    const cx = 24.5;
    if (b <= 6) { if (Math.abs(c - cx) > 13 + b * 1.25) return 0; return b === 4 ? 4 : b === 5 ? 14 : 10; }       // gövde
    if (c >= 24 && c <= 25 && b <= 35) return 10;                                                                   // direk
    if (c >= 24 && c <= 27 && b >= 36 && b <= 38) return 1;                                                         // bayrak
    if (c >= 26 && c <= 41 && b <= 7 + (42 - c) * 1.7) return (b % 6 === 0) ? 1 : 4;                               // ana yelken
    if (c >= 11 && c <= 23 && b <= 7 + (c - 10) * 1.9) return (b % 5 === 0) ? 8 : 4;                                // flok
    return 0;
  },
};
function makePicture(kind) {
  const g = new Uint8Array(COLS * ROWS), fn = PICS[kind];
  for (let c = 0; c < COLS; c++) {
    let floating = false;
    for (let b = 0; b < ROWS; b++) { const v = floating ? 0 : fn(c, b); if (!v) floating = true; else g[(ROWS - 1 - b) * COLS + c] = v; }
  }
  return g;
}

/* ---------------- DURUM ---------------- */
let S = null, NEXT = 1;
function newRun(lv) {
  const cfg = LEVELS[lv], target = makePicture(cfg.pic);
  S = { lv, cfg, t: 0, time: 0, phase: 'play', running: false, target, built: new Uint8Array(COLS * ROWS), sh: new Uint8Array(COLS * ROWS),
    fill: new Uint8Array(COLS), trucks: [], queue: [], park: Array(cfg.park).fill(null), parts: [], pops: [], sparks: [], shake: 0,
    landed: 0, total: 0, sent: 0, maxPark: 0, failWhy: '', winT: 0, glow: 0,

  if (scared) { ctx.beginPath(); ctx.ellipse(0, 11, 5, 6.5, 0, 0, 7); ctx.fill(); }            // şaşkın "o" ağız
  else { ctx.beginPath(); ctx.arc(0, 6, 9, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  ctx.restore();
}
function drawPark() {
  const n = S.cfg.park, danger = parked() >= n - 1 && S.phase === 'play';
  for (let i = 0; i < n; i++) { const x = parkX(i);
    ctx.fillStyle = danger && !S.park[i] ? `rgba(255,90,110,${0.25 + 0.15 * Math.sin(S.t * 8)})` : 'rgba(90,70,110,.16)'; rrect(x - 27, PARK_Y - 22, 54, 44, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(90,70,110,.35)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5; rrect(x - 27, PARK_Y - 22, 54, 44, 10); ctx.stroke(); ctx.setLineDash([]);
    const t = S.park[i];
    if (t && t.state === 'park') { drawTruck(t, x, PARK_Y, 1, false); if (S.phase === 'play' && pourable(t.col) > 0) { ctx.fillStyle = '#5FC46A'; ctx.beginPath(); ctx.arc(x + 22, PARK_Y - 16, 5, 0, 7); ctx.fill(); } }
    else if (!t) text('P', x, PARK_Y, 16, 'rgba(90,70,110,.35)'); }
}
function drawQueue() {
  for (let i = 0; i < S.queue.length; i++) { const q = S.queue[i], x = queueX(i);
    ctx.fillStyle = 'rgba(90,70,110,.12)'; rrect(x - 50, Q_Y - 26, 100, H - Q_Y + 20, 14); ctx.fill();
    for (let k = Math.min(3, q.length - 1); k >= 0; k--) { const y = q[k].qy !== undefined ? q[k].qy : Q_Y + k * Q_STEP; drawTruck(q[k], x, y, k === 0 ? 1 : 0.85 - k * 0.15, false);
      if (k === 0 && S.phase === 'play' && pourable(q[k].col) > 0) { ctx.fillStyle = '#5FC46A'; ctx.beginPath(); ctx.arc(x + 26, y - 16, 5, 0, 7); ctx.fill(); } }
    if (q.length > 4) text('+' + (q.length - 4), x, H - 10, 11, 'rgba(60,40,70,.6)', 700); }
}

/* ---------------- HUD / EKRAN / DÖNGÜ ---------------- */
const HUD = { dirty: true, update() { if (!this.dirty || !S) return; this.dirty = false;
  $('hLv').textContent = S.lv + 1; $('hPic').textContent = Math.round(S.landed / S.total * 100) + '%';
  const p = parked(); $('hPark').textContent = p + '/' + S.cfg.park; $('hParkBox').className = 'stat r' + (p >= S.cfg.park - 1 ? ' warn' : ''); } };
const cfg0 = lv => LEVELS[lv];
function hideOv() { const o = $('ov'); if (o) o.remove(); }
function overlay(html) { hideOv(); const d = document.createElement('div'); d.className = 'ov'; d.id = 'ov'; d.innerHTML = html; $('cab').appendChild(d); return d; }
function start(lv) {

  lv = clamp(lv, 0, LEVELS.length - 1);
  newRun(lv); HUD.dirty = true; hideOv();
  const NEWS = {
    0: ['🍉', 'Kum Ressamı', 'Çerçevedeki silik resmi <b>kumla oluştur</b>. Kamyona dokun: rayda geçerken, <b>sıradaki hücresi kendi renginde</b> olan sütunlara kum döker.<span class="chain">🚚 ➜ ⏳ ➜ 🍉</span>Kum <b>alttan üste</b> yığılır. Kumu artan kamyon park yerine geçer — park yeri biterse kaybedersin.'],
    1: ['🍉', 'Büyük karpuz', 'Ortada önce kırmızı yükselmeli, sonra krem, açık yeşil, en üstte kabuk. Kenarlarda kabuk en altta. <b>Yeşil nokta</b> o rengin şu an dökülebildiğini gösterir.'],
    2: ['🅿', 'Dar park', 'Aynı resim, <b>4 park yeri</b> ve daha karışık kuyruk. Çekirdekler kırmızıyı böler — kırmızıyı bir kerede bitiremezsin.'],
  };
  const INTRO = [
    'Çerçevedeki silik resmi <b>kumla oluştur</b>. Kamyona dokun: rayda geçerken, <b>sıradaki hücresi kendi renginde</b> olan sütunlara kum döker.<span class="chain">🚚 ➜ ⏳ ➜ 🍉</span>Kum <b>alttan üste</b> yığılır. Kumu artan kamyon park yerine geçer — park yeri biterse kaybedersin.',
    'Önce kâğıt kalıp, sonra krema, en üstte kiraz. Renkli serpmeler kremayı böler. <b>Basılı tut</b>: kamyonun nereye döküleceğini gör.',
    'Duvarlar, kapı ve pencereler birlikte yükselir; çatı ancak duvar bitince. Baca en son.',
    'Beyaz karın, siyah gövde, gözler ve gaga iç içe. <b>Sadece 3 park yeri</b> — boş dönen kamyon pahalı.',
    'Gövde, direk, iki yelken ve bayrak. Yelkenlerin çizgileri kumu parça parça böler.',
  ]; void NEWS;
  const n = S.queue.reduce((a, q) => a + q.length, 0);
  overlay('<div style="font-size:52px">' + cfg0(lv).emo + '</div><h2>' + (lv ? 'Bölüm ' + (lv + 1) + ' · ' + cfg0(lv).name : 'Kum Ressamı') + '</h2><p>' + INTRO[lv] + '</p><p style="margin-top:0;font-size:12px">' + S.total + ' tane · ' + n + ' kamyon · ' + S.cfg.park + ' park yeri</p><div class="row"><button class="go" id="bGo">▶ Başla</button></div>');
  $('bGo').onclick = () => { SFX.init(); hideOv(); S.running = true; SFX.music(true); };
  try { history.replaceState(null, '', location.pathname + location.search + '#' + (lv + 1)); } catch (e) {}
}
function showWin() {
  const last = S.lv >= LEVELS.length - 1;
  let gal = {}; try { gal = JSON.parse(localStorage.getItem(GAL_KEY) || '{}'); } catch (e) {}
  const wall = LEVELS.map((L, i) => '<span style="display:inline-block;margin:2px;padding:5px 3px 3px;border-radius:9px;background:' + (gal[i] ? '#FFF1DE' : 'rgba(255,255,255,.08)') + ';border:2px solid ' + (gal[i] ? '#C9956A' : '#453B63') + ';width:56px;line-height:1.15">'
    + '<span style="font-size:20px;' + (gal[i] ? '' : 'filter:grayscale(1);opacity:.35') + '">' + L.emo + '</span><br><span style="font-size:9.5px;color:' + (gal[i] ? '#6A4A3A' : '#8A80A8') + '">' + (gal[i] ? L.name : '???') + '</span><br><span style="font-size:9px;color:#E0A020">' + ('★'.repeat(gal[i] || 0) || '&nbsp;') + '</span></span>').join('');
  overlay('<div style="font-size:52px">' + S.cfg.emo + '✨</div><h2>' + S.cfg.name + ' hazır!</h2><div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>'
    + '<p>' + S.total + ' tane · ' + S.sent + ' kamyon · en uzun kombo x' + S.bestCombo + '<br>en çok ' + S.maxPark + ' park yeri kullandın</p>'
    + '<p style="margin:0 0 4px;font-size:12px">Galeri</p><div style="margin-bottom:12px">' + wall + '</div>'
    + (last ? '<p style="margin-top:0">Bütün resimleri yaptın! 🎉</p>' : '')

  [...$('stars').children].forEach((s, i) => { if (i < S.stars) setTimeout(() => s.classList.add('on'), 250 + i * 230); });
  if (!last) $('bNx').onclick = () => start(S.lv + 1);
  $('bAg').onclick = () => { start(S.lv); $('bGo').click(); };
}
function showFail() {
  overlay('<div style="font-size:52px">🚧</div><h2>Park yeri kalmadı</h2><p>Rengi <b>şu an dökülemeyen</b> kamyonu gönderme; kumu artar ve park yerine geçer. <b>Yeşil nokta</b> o rengin dökülebildiğini gösterir.</p><div class="row"><button class="go" id="bAg">↻ Tekrar dene</button></div>');

$('bRe').onclick = () => { SFX.init(); start(S.lv); $('bGo').click(); };
let lastTs = 0;
function loop(ts) { requestAnimationFrame(loop); const dt = Math.min(0.033, lastTs ? (ts - lastTs) / 1000 : 0); lastTs = ts; if (dt > 0) step(dt); HUD.update(); draw(); }
buildSprites(); fitCanvas(); fitCanvas(); addEventListener('resize', () => { fitCanvas(); fitCanvas(); });

<style>

#app{position:relative;margin:0 auto;height:100%;width:min(100vw,calc(100vh * 0.5625));overflow:hidden}

.pill b{font-variant-numeric:tabular-nums}
.pill b.bump{animation:bump .3s cubic-bezier(.2,.9,.3,1.5)}

.tile{display:inline-block;width:9px;height:16px;border-radius:3px;background:#F6E7C8;box-shadow:inset 0 -3px 0 #d9b98a}

.btn{border:0;border-radius:18px;padding:10px 16px;font:800 18px "Baloo 2",system-ui,sans-serif;color:#3a2410;background:#FFE6B8;box-shadow:0 5px 0 #b98a4a}

.btn.go{background:#FF7A3D;color:#fff;box-shadow:0 5px 0 #a8431f;padding:10px 26px;font-size:22px}
.btn[disabled]{opacity:.45}
#hint{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-weight:800;font-size:19px;text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:800;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 rgba(20,10,5,.9);animation:popUp .9s ease-out forwards}
@keyframes popUp{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,5,.5)}
.card{background:#FFF4E2;color:#3a2410;border-radius:22px;padding:20px 24px;text-align:center;box-shadow:0 8px 0 #b98a4a;animation:cardIn .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes cardIn{from{transform:scale(.6)}}
.card h2{margin:0 0 4px;font-size:30px}
.card p{margin:2px 0 14px;font-size:17px}
#lvNav{display:flex;align-items:center;gap:4px;pointer-events:auto}
#lvNav button{border:0;background:rgba(30,18,10,.6);color:#fff;font:800 22px "Baloo 2",system-ui,sans-serif;width:32px;height:32px;border-radius:11px;line-height:1;padding:0}

.pill.low{background:rgba(170,45,30,.85)}
.pill .bump,.pill.bump{animation:bump .3s cubic-bezier(.2,.9,.3,1.5)}
#banner{position:absolute;left:0;right:0;top:calc(50px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;opacity:0;padding:0 10px}
#banner.show{animation:bn 2.4s ease forwards}

.star{display:inline-block;animation:starIn .45s cubic-bezier(.2,.9,.3,1.6) both}
.star.off{color:#3a2410;opacity:.18}

#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}

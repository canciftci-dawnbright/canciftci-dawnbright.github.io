<style>
:root{ --bg:#2B3A47; --panel:#FFF7EA; --line:#E5D3B8; --ink:#3A2E26; --ink-dim:#A08C78; --go:#2F9E6B; --bad:#D6423A; --gold:#F2B233; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;background-image:radial-gradient(640px 360px at 50% 0%,rgba(120,190,255,.16),transparent 72%)}
#app{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:6px 5px 10px}
.cab{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 9px 9px;box-shadow:0 20px 50px rgba(0,0,0,.45);position:relative;overflow:hidden}

<div id="app"><div class="cab" id="cab">
  <div class="hud">
    <span class="stat"><small>Bölüm</small><b id="hLv">1</b></span>
    <span class="stat" style="text-align:center"><small>Yük</small><b id="hLoad">0/0</b></span>
    <span class="stat r" id="hTimeBox"><small>Süre</small><b id="hTime">90</b></span>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="row"><button id="bRe">↻ Bölümü tekrarla</button><button id="bReset">⏮ Baştan başla</button></div>
</div></div>

<script>
'use strict';
/* ============================================================
   KARGO UÇAĞI — yandan görünüş, canlı denge
   Dokun/sürükle: vinçteki kutuyu nişanla · bırak: kutu ambara düşer. Ambardaki kutuyu tut: geri al, yerini değiştir.
   Uçak ana tekerleğin üstünde tahterevalli gibi anında yatar; eğim artınca kutular kayar.
   Burun ya da kuyruk 2,5 sn yere sürterse kaybedersin. Tüm yük yüklü + su terazisi yeşilde → uçak kalkar.
   Vinç sabırsızdır (süre dolunca kutuyu kendi bırakır). Bırakınca uçak yeşilde kalırsa +2 sn, art arda: kombo.
   Kurallar: rüzgâr, sabitlenmiş yük, yolcular, kırılgan vazo.
   Her bölümün, hiç kaymadan dengeli biten bir yükleme sırası vardır (üretimde doğrulanır).
   ============================================================ */
const W = 360, H = 640;
const U = 34, COLS = 9, ROWS = 3;              // ambar: 9 x 3 birim
const BAY_L = U * COLS, BAY_H = U * ROWS;
const PIVOT = { x: 184, y: 468 };              // ana tekerleğin yere değdiği nokta: uçak bunun etrafında döner
const PS = 0.88;                               // uçağın ekran ölçeği (dar telefonda burun/kuyruk taşmasın)
const FLOOR_Y = -46;                           // ambar tabanı, pivotun üstünde (uçak koordinatı)
const HAND_Y = 226;                            // vinçteki kutunun ekran yüksekliği (halat boyu ağırlıkla uzar)
const G = 1500;                                // yerçekimi px/s²
const TILT_MAX = 12 * Math.PI / 180;           // burun/kuyruk yere değme açısı
const KS = 100;                                // eğim sertliği: tork (kütle × birim) / KS = hedef açı (radyan)
const STRIKE_LOSE = 2.5, READY_HOLD = 0.9, RUN_TIME = 90, WARN_AT = 10;
const COMBO_BONUS = 2, SETTLE_CHECK = 0.9;     // bırakıştan bu kadar sonra yeşildeyse +sn
const PAX_M = 1.5;                             // yolcu ağırlığı
const GLASS_BREAK_PENALTY = 8, GLASS_HIT = 300;
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;

/* kutu tipleri: w/h birim, dens birim başı kütle, mu sürtünme (tan açı: bu eğimin üstünde kayar) */
const TYPES = {
  box:    { w:1, h:1, dens:1,   mu:0.17, e:'📦', c:'#D9A66B', n:'Karton kutu' },
  bag:    { w:2, h:1, dens:2,   mu:0.17, e:'🧳', c:'#3E7BFA', n:'Valiz', clothes:true },
  motor:  { w:1, h:1, dens:5,   mu:0.17, e:'⚙',  c:'#56636F', n:'Motor', heavy:true },
  brick:  { w:2, h:1, dens:4,   mu:0.17, e:'🧱', c:'#B5563C', n:'Tuğla paleti', heavy:true },
  fridge: { w:1, h:2, dens:1.5, mu:0.17, e:'🧊', c:'#CFDDE6', n:'Buzdolabı' },
  rug:    { w:3, h:1, dens:0.7, mu:0.17, e:'🧶', c:'#C75B7A', n:'Halı' },
  cart:   { w:2, h:1, dens:2,   mu:0.09, e:'🛞', c:'#F2B233', n:'Tekerlekli sandık', wheels:true, clothes:true },
  glass:  { w:1, h:1, dens:1,   mu:0.17, e:'🏺', c:'#A8DCEB', n:'Kırılgan vazo', fragile:true },
};
const mass = t => TYPES[t].dens * TYPES[t].w * TYPES[t].h;
/* Bölümler — mix: yüklenecek kutular · green: kalkış eğim sınırı (°) · fuse: vinç sabrı (sn)
   wind: rüzgâr torku · fixed: sabitlenmiş yük {t, c: sütun} · pax: kaçıncı kutudan sonra yolcu biner */
const LEVELS = [
  { mix:{ box:4, motor:1 },                                          green:3.5 },
  { mix:{ box:3, bag:2, motor:1 },                                   green:3.0, fuse:6 },
  { mix:{ box:2, bag:2, fridge:2, brick:1 },                         green:3.0, fuse:5.5 },
  { mix:{ box:3, bag:2, motor:1, fridge:1 },                         green:3.0, fuse:5.5, wind:4 },
  { mix:{ box:3, bag:1, rug:1, motor:2, fridge:1 },                  green:2.5, fuse:5 },
  { mix:{ box:3, bag:2, motor:1, rug:1 },                            green:2.5, fuse:5, fixed:[{ t:'brick', c:2 }] },
  { mix:{ box:2, cart:2, bag:1, motor:1, brick:1, fridge:1 },        green:2.5, fuse:5 },
  { mix:{ box:3, bag:2, motor:1, fridge:1 },                         green:2.5, fuse:5, pax:[2, 4, 6] },
  { mix:{ box:3, bag:2, rug:1, motor:1, cart:1 },                    green:2.5, fuse:5, wind:4 },
  { mix:{ box:3, bag:1, glass:2, motor:1, fridge:1 },                green:2.2, fuse:4.5 },
  { mix:{ box:2, bag:2, glass:1, motor:2, brick:1 },                 green:2.0, fuse:4.5, fixed:[{ t:'motor', c:6 }], pax:[3, 6] },
  { mix:{ box:3, bag:2, rug:1, motor:2, brick:1, cart:1, glass:1 },  green:2.2, fuse:4.5, wind:4, pax:[4] },
];
const levelCfg = lv => lv < LEVELS.length ? LEVELS[lv] : Object.assign({}, LEVELS[LEVELS.length - 1], { green: Math.max(1.5, 2 - (lv - LEVELS.length + 1) * 0.1) });
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);
const rnd = n => Math.floor(Math.random() * n);
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ac = null, master = null, noise = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(t0, dur, f0, f1, g, type) { const o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.006); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gg); gg.connect(master); o.start(t0); o.stop(t0 + dur + 0.02); }
  function burst(t0, dur, f, q, g, type) { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = type || 'bandpass';
    bp.frequency.value = f; bp.Q.value = q; const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.005);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(bp); bp.connect(gg); gg.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.02); }
  const w = fn => (...a) => { if (!ac) return; fn(ac.currentTime, ...a); };
  let lastCreak = 0, lastThud = 0;
  return { init,
    pick: w(t => { tone(t, 0.08, 480, 720, 0.1, 'triangle'); burst(t, 0.05, 1500, 1, 0.04); }),
    drop: w(t => { burst(t, 0.12, 2400, 0.8, 0.05); tone(t, 0.1, 900, 500, 0.04, 'triangle'); }),
    clunk: w((t, m) => { tone(t, 0.18, 120 - m * 6, 60, 0.12 + m * 0.02, 'triangle'); burst(t, 0.06, 1800, 2, 0.05); }),
    thud: w((t, m, v) => { if (t - lastThud < 0.05) return; lastThud = t; const k = clamp(v / 900, 0.2, 1);
      const f = 190 - Math.min(m, 10) * 11; tone(t, 0.12 + m * 0.02, f * 1.5, f, (0.12 + Math.min(m, 10) * 0.035) * k); burst(t, 0.08 + m * 0.012, 500 - Math.min(m, 10) * 25, 0.7, 0.12 * k, 'lowpass'); }),
    creak: w((t, a) => { if (t - lastCreak < 0.35) return; lastCreak = t; tone(t, 0.22, 140 + a * 300, 110 + a * 200, 0.04, 'sawtooth'); }),
    slide: w(t => { burst(t, 0.18, 900, 2.5, 0.05); }),
    bad: w(t => { tone(t, 0.1, 220, 160, 0.14, 'square'); }),
    scrape: w(t => { burst(t, 0.3, 3000, 3, 0.1); tone(t, 0.3, 90, 70, 0.1, 'sawtooth'); }),
    alarm: w(t => { tone(t, 0.14, 950, 950, 0.07, 'square'); tone(t + 0.16, 0.14, 720, 720, 0.07, 'square'); }),
    fuse: w(t => { tone(t, 0.05, 1300, 1300, 0.05, 'square'); }),
    combo: w((t, n) => { const b = 660 * Math.pow(2, Math.min(n, 8) * 2 / 12); [0, 4, 7].forEach((s, i) => tone(t + i * 0.05, 0.16, b * Math.pow(2, s / 12), b * Math.pow(2, s / 12), 0.09, 'triangle')); }),
    gust: w(t => { burst(t, 1.6, 500, 0.5, 0.12, 'lowpass'); burst(t + 0.3, 1.2, 1400, 1.5, 0.05); }),
    pax: w(t => { tone(t, 0.1, 880, 880, 0.07, 'sine'); tone(t + 0.12, 0.14, 660, 660, 0.07, 'sine'); }),
    glass: w(t => { [0, 0.04, 0.09, 0.15].forEach(d => { burst(t + d, 0.12, 5000 + Math.random() * 3000, 3, 0.12); tone(t + d, 0.1, 2400 + Math.random() * 1600, 1800, 0.05, 'triangle'); }); }),
    engine: w((t, dur) => { const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(); o.type = 'sawtooth'; lp.type = 'lowpass'; lp.frequency.value = 700;
      o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(200, t + dur * 0.8); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05); burst(t, dur, 900, 0.4, 0.08, 'lowpass'); }),
    crash: w(t => { burst(t, 0.9, 380, 0.6, 0.4, 'lowpass'); tone(t, 0.8, 170, 40, 0.3, 'sawtooth'); [0.15, 0.3, 0.5, 0.7].forEach(d => { burst(t + d, 0.12, 700 + Math.random() * 900, 1, 0.14); tone(t + d, 0.1, 200, 90, 0.08); }); }),
    tick: w(t => tone(t, 0.04, 1500, 1500, 0.05, 'square')),
    ready: w(t => { tone(t, 0.12, 880, 880, 0.06, 'triangle'); }),
    win: w(t => { [0, 4, 7, 12, 16].forEach((s, i) => tone(t + i * 0.09, 0.35, 523 * Math.pow(2, s / 12), 523 * Math.pow(2, s / 12), 0.14, 'triangle')); }),
  };
})();
const buzz = ms => { try { const ua = navigator.userActivation; if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} };

/* ---------------- BÖLÜM ÜRETİMİ: kaymadan, dengeli biten bir yükleme sırası olmalı ---------------- */
/* statik model: kutu sütuna düşer, altındaki en yüksek kutunun üstüne oturur; eğim = tork / KS.
   sabit yük baştan yerinde, yolcular belirtilen kutu sayısından sonra biner, vazonun üstüne kutu konmaz. */
function genLevel(cfg) {
  const base = []; for (const t in cfg.mix) for (let i = 0; i < cfg.mix[t]; i++) base.push(t);
  const pax = cfg.pax || [];
  for (let att = 0; att < 5000; att++) {
    const order = base.slice().sort(() => Math.random() - 0.5), heights = new Array(COLS).fill(0), cap = new Array(COLS).fill(false);
    const seats = [...Array(COLS).keys()].sort(() => Math.random() - 0.5).slice(0, pax.length);
    let tq = 0, minMu = 1, ok = true;
    for (const f of cfg.fixed || []) { const T = TYPES[f.t]; for (let k = f.c; k < f.c + T.w; k++) heights[k] = T.h; tq += mass(f.t) * (f.c + T.w / 2 - COLS / 2); }
    // TODO: sabit yük tek başına kayma sınırını aşmamalı (bölüm yere sürterek başlar) — şimdilik LEVELS'te elle ayarlı
    for (let i = 0; i < order.length && ok; i++) {
      const t = order[i], T = TYPES[t], m = mass(t); minMu = Math.min(minMu, T.mu);
      const slideLim = Math.atan(minMu) * 0.75, cands = [];
      for (let c = 0; c <= COLS - T.w; c++) {
        let land = 0, capped = false; for (let k = c; k < c + T.w; k++) { land = Math.max(land, heights[k]); capped = capped || cap[k]; }
        if (capped || land + T.h > ROWS) continue;
        const ntq = tq + m * (c + T.w / 2 - COLS / 2);
        if (Math.abs(ntq / KS) < slideLim) cands.push({ c, land, ntq });
      }
      if (!cands.length) { ok = false; break; }
      const k = cands[rnd(cands.length)];
      for (let x = k.c; x < k.c + T.w; x++) { heights[x] = k.land + T.h; if (T.fragile) cap[x] = true; }
      tq = k.ntq;
      pax.forEach((at, j) => { if (at === i + 1) tq += PAX_M * (seats[j] + 0.5 - COLS / 2); });
      if (Math.abs(tq / KS) >= slideLim) ok = false;
    }
    if (ok && Math.abs(deg(tq / KS)) <= cfg.green * 0.5) return { order, seats };
  }
  return { order: base, seats: pax.map((_, j) => 4) };   // bulunamazsa (olmamalı)
}

/* ---------------- DURUM ---------------- */
let S = null, AIM = null;
const SAVE_KEY = 'dbg.kargo2.v1';
const loadBest = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || { lv: 0, stars: {} }; } catch (e) { return { lv: 0, stars: {} }; } };
const saveBest = b => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(b)); } catch (e) {} };
let nextId = 1;
function makeCrate(t, x, y, fixed) { const T = TYPES[t]; return { id: nextId++, t, w: T.w * U, h: T.h * U, m: mass(t), mu: T.mu, x, y, vx: 0, vy: 0, ground: false, svx: 0, slideT: 0, impact: 0, hImp: 0, fixed: !!fixed }; }
function newRun(lv, data) {
  const cfg = levelCfg(lv); data = data || genLevel(cfg);
  S = { lv, cfg, data, order: data.order, queue: data.order.slice(), hand: null, handX: W / 2, handDX: W / 2, handAnim: 0, swing: 0, swingV: 0,
    crates: [], total: data.order.length, maxLoaded: 0,
    pax: (cfg.pax || []).map((at, j) => ({ at, col: data.seats[j], boarded: false, pop: 0 })),
    wind: { st: 'calm', t: 0, dur: 4 + Math.random() * 2, dir: 1, v: 0 },
    fuseT: cfg.fuse || 0, combo: 0, pending: null, slow: 0, debris: [], emo: [],
    th: 0, thv: 0, strikeT: 0, readyT: 0, left: RUN_TIME, lastSec: RUN_TIME, running: false, over: false, phase: 'play', anim: { t: 0 },
    t: 0, parts: [], pops: [], shake: 0, fx: { x: 0, y: 0 }, lastAlarm: 0, strikeSide: 0, lastFuseSec: 0 };
  for (const f of cfg.fixed || []) S.crates.push(makeCrate(f.t, f.c * U, 0, true));
  setHand(S.queue.shift());
  AIM = null;
}
function setHand(t) { S.hand = t || null; S.handAnim = S.hand ? 1 : 0; S.fuseT = S.cfg.fuse || 0; if (S.hand) { S.swingV += (Math.random() - 0.5) * 2; } }
const loadedCount = () => S.crates.filter(b => !b.fixed).length;

/* uçak koordinatı ↔ ekran. yerel: x ambarın solundan sağa (px), y tabandan yukarı (px) */
function toScreen(lx, ly, th) { th = th === undefined ? S.th : th;
  const px = (-BAY_L / 2 + lx + S.fx.x) * PS, py = (FLOOR_Y - ly + S.fx.y) * PS, c = Math.cos(th), s = Math.sin(th);
  return [PIVOT.x + px * c - py * s, PIVOT.y + px * s + py * c]; }
function toLocal(sx, sy) { const dx = sx - PIVOT.x, dy = sy - PIVOT.y, c = Math.cos(S.th), s = Math.sin(S.th);
  const px = (dx * c + dy * s) / PS, py = (-dx * s + dy * c) / PS; return [px + BAY_L / 2, FLOOR_Y - py]; }

/* nişan: parmağın x'inden sütun */
function aimCol(t, sx) {
  const T = TYPES[t], [, byS] = toScreen(BAY_L / 2, BAY_H), [lx] = toLocal(sx, byS);
  return clamp(Math.round(lx / U - T.w / 2), 0, COLS - T.w);
}
function topUnder(x, w) { let top = null; for (const c of S.crates) if (c.x < x + w - 2 && c.x + c.w > x + 2 && (!top || c.y + c.h > top.y + top.h)) top = c; return top; }
function landingY(x, w) { const t = topUnder(x, w); return t ? t.y + t.h : 0; }
function canDrop(t, col) { const T = TYPES[t]; return landingY(col * U, T.w * U) + T.h * U <= BAY_H + 3; }
function paxTorque() { let tq = 0; for (const p of S.pax) if (p.boarded) tq += PAX_M * (p.col + 0.5 - COLS / 2); return tq; }
function torque(list, extra) {
  let tq = paxTorque(); for (const c of list) tq += c.m * ((c.x + c.w / 2) / U - COLS / 2);
  if (extra) tq += extra.m * ((extra.x + extra.w / 2) / U - COLS / 2);
  return tq;
}

function overlay(html) { hideOv(); const d = document.createElement('div'); d.className = 'ov'; d.id = 'ov'; d.innerHTML = html; $('cab').appendChild(d); return d; }
function startLevel(lv, sameData) {
  newRun(lv, sameData); HUD.dirty = true;
  const c = S.cfg, news = [], prev = LEVELS.slice(0, Math.min(lv, LEVELS.length));
  const firstMix = t => c.mix[t] && !prev.some(p => p.mix[t]), firstRule = k => c[k] && !prev.some(p => p[k]);
  if (lv === 0) news.push('Ekrana <b>dokun ve kaydır</b>: vinçteki kutuyu nişanla, <b>bırak</b>: düşer.<br>Uçak her kutuda <b>yatar</b>. Ambardaki kutuyu <b>tutarak geri alabilirsin</b>.<br>Burun ya da kuyruk <b>2,5 sn yere sürterse</b> kaybedersin.');
  if (firstRule('fuse')) news.push('Yeni: <b>vinç sabırsız</b> — ' + c.fuse + ' sn içinde bırakmazsan kendi bırakır.<br>Bıraktığında uçak <b>yeşilde</b> kalırsa <b>+' + COMBO_BONUS + ' sn</b>, art arda yaparsan kombo!');
  if (firstMix('bag')) news.push('Yeni: <b>valiz</b> (2 birim).');
  if (firstMix('fridge')) news.push('Yeni: <b>buzdolabı</b> (uzun) ve <b>tuğla paleti</b> (çok ağır).');
  if (firstRule('wind')) news.push('Yeni: <b>rüzgâr!</b> Sağ üstteki hortum uyarınca uçak o yöne itilecek, hazır ol.');
  if (firstMix('rug')) news.push('Yeni: <b>halı</b> — uzun ama hafif.');
  if (firstRule('fixed')) news.push('Yeni: <b>sabitlenmiş yük</b> 🔒 — yerinden oynamaz, dengeyi ona göre kur.');
  if (firstMix('cart')) news.push('Yeni: <b>tekerlekli sandık</b> — az eğimde bile kayar!');
  if (firstRule('pax')) news.push('Yeni: <b>yolcular!</b> Penceredeki numara: o kadar kutu yüklenince o koltuğa yolcu biner.');
  if (firstMix('glass')) news.push('Yeni: <b>kırılgan vazo</b> 🏺 — üstüne kutu koyma, sert kaydırma. Kırılırsa <b>−' + GLASS_BREAK_PENALTY + ' sn</b>.');
  overlay('<div style="font-size:46px">✈️📦</div><h2>' + (lv === 0 ? 'Kargo Uçağı' : 'Bölüm ' + (lv + 1)) + '</h2>'
    + '<p>' + S.total + ' kutuyu yükle, su terazisini <b>yeşilde</b> tut.<br>' + news.join('<br>') + '</p>'

}
function showWin() {
  const stars = S.left >= 55 ? 3 : S.left >= 25 ? 2 : 1, best = loadBest();
  best.lv = Math.max(best.lv, S.lv + 1); best.stars[S.lv] = Math.max(best.stars[S.lv] || 0, stars); saveBest(best);
  overlay('<div style="font-size:46px">🛫</div><h2>Bölüm ' + (S.lv + 1) + ' tamam!</h2><div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>'
    + '<p>' + Math.ceil(S.left) + ' saniye kala havalandın.<br>★★ 25 sn · ★★★ 55 sn kala · kombolar süre kazandırır</p>'
    + '<div class="row"><button class="go" id="bNx">▶ Sonraki bölüm</button><button id="bAg">↻ Tekrar oyna</button></div>');
  [...$('stars').children].forEach((s, i) => { if (i < stars) setTimeout(() => s.classList.add('on'), 300 + i * 250); });
  $('bNx').onclick = () => startLevel(S.lv + 1);
  $('bAg').onclick = () => { startLevel(S.lv); $('bGo').click(); };
}
function showFail(why) {
  const lv = S.lv, data = S.data;
  const txt = why === 'time' ? '<div style="font-size:46px">⏰</div><h2>Süre doldu!</h2><p>Uçak kalkış saatini kaçırdı.</p>'
    : '<div style="font-size:46px">💥</div><h2>' + (S.strikeSide > 0 ? 'Burun yere vurdu!' : 'Kuyruk yere vurdu!') + '</h2><p>Ağır kutuları <b>ortaya</b> yakın koy, bir tarafa yüklersen hemen <b>karşı tarafa</b> denge kutusu at.</p>';
  overlay(txt + '<div class="row"><button class="go" id="bAg">↻ Tekrar dene</button></div>');
  $('bAg').onclick = () => { startLevel(lv, data); $('bGo').click(); };
}
$('bRe').onclick = () => { const lv = S.lv, data = S.data; startLevel(lv, data); $('bGo').click(); };
/* baştan başla: onay sor, kaydı sil, 1. bölüme dön */
$('bReset').onclick = () => {
  const wasRunning = S.running; S.running = false; AIM = null;
  overlay('<div style="font-size:46px">⏮</div><h2>Baştan başla?</h2><p>İlerlemen ve yıldızların silinir, <b>1. bölüme</b> dönersin.</p>'
    + '<div class="row"><button class="go" id="bYes">Evet, baştan başla</button><button id="bNo">Vazgeç</button></div>');
  $('bYes').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} startLevel(0); };
  $('bNo').onclick = () => { if (wasRunning) { hideOv(); S.running = true; } else startLevel(S.lv, S.data); };   // oyun sürüyorsa devam, değilse bölüm ekranına dön
};
let lastTs = 0;
function loop(ts) { requestAnimationFrame(loop); let dt = Math.min(0.033, lastTs ? (ts - lastTs) / 1000 : 0); lastTs = ts;
  if (S.slow > 0) { S.slow -= dt; dt *= 0.35; }   // kaza anında ağır çekim
  step(dt); HUD.dirty = true; HUD.update(); draw(); }
fitCanvas(); fitCanvas(); addEventListener('resize', () => { fitCanvas(); fitCanvas(); });
const hashLv = parseInt(location.hash.slice(1), 10);
startLevel(hashLv > 0 ? hashLv - 1 : loadBest().lv); requestAnimationFrame(loop); $('boot').remove();
</script>

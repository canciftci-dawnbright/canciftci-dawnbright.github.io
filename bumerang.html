<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bumerang</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#16222e;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
#app{position:relative;margin:0 auto;height:100%;width:min(100vw,calc(100vh * 0.5625));overflow:hidden}
#app canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 10px 0;pointer-events:none}
.pill{background:rgba(20,30,50,.55);border-radius:18px;padding:4px 12px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.2);color:#fff;border:0;font-family:inherit}
button.pill{pointer-events:auto;cursor:pointer}
#hThrows{gap:2px;padding:4px 8px}
#hThrows svg{width:24px;height:24px;transition:opacity .25s,transform .25s}
#hThrows svg.used{opacity:.22;transform:scale(.7) rotate(-40deg)}
#barWrap{position:absolute;left:12px;right:12px;top:52px;height:24px;pointer-events:none}
#bar{position:absolute;left:0;right:0;top:4px;height:16px;border-radius:10px;background:rgba(20,30,50,.55);box-shadow:inset 0 2px 0 rgba(0,0,0,.25);overflow:hidden}
#barFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:linear-gradient(90deg,#FF9A3C,#FFD23C);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);transition:width .25s cubic-bezier(.2,.9,.3,1.2)}
#barFill.hot{animation:hot .3s}
@keyframes hot{50%{filter:brightness(1.6)}}
#barTxt{position:absolute;left:8px;top:1px;font-weight:800;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.mk{position:absolute;top:0;transform:translateX(-50%);font-size:18px;line-height:24px;color:#6d6a78;text-shadow:0 1px 0 rgba(0,0,0,.4);transition:color .2s}
.mk.on{color:#FFD23C;animation:mkOn .5s cubic-bezier(.2,.9,.3,1.8)}
@keyframes mkOn{0%{transform:translateX(-50%) scale(2.2)}100%{transform:translateX(-50%) scale(1)}}
#bSound{position:absolute;right:10px;top:84px;pointer-events:auto;font-size:15px;padding:2px 9px}
#bCam{position:absolute;right:10px;top:118px;pointer-events:auto;font-size:14px;padding:2px 9px;gap:4px}
#bFinish{position:absolute;left:12px;bottom:14px;border:0;border-radius:18px;padding:8px 16px;font:800 17px "Baloo 2",system-ui,sans-serif;color:#fff;background:#3FB86A;box-shadow:0 4px 0 #2a7d48;display:none;animation:cardIn .4s cubic-bezier(.2,.9,.3,1.3)}
#spin{position:absolute;right:12px;bottom:14px;border:0;border-radius:18px;padding:8px 14px;font:800 17px "Baloo 2",system-ui,sans-serif;color:#3a2410;background:#FFE6B8;box-shadow:0 4px 0 #c9924a}
#spin:active,#bFinish:active{transform:translateY(3px)}
#hint{position:absolute;left:0;right:0;bottom:78px;text-align:center;font-weight:800;font-size:20px;text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
#finger{position:absolute;left:50%;bottom:120px;font-size:44px;pointer-events:none;animation:drag 1.8s ease-in-out infinite;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
@keyframes drag{0%{transform:translate(-50%,0) scale(1);opacity:0}10%{opacity:1;transform:translate(-50%,0) scale(.85)}60%{transform:translate(-10%,-230px) scale(.85);opacity:1}80%{transform:translate(-10%,-230px) scale(1);opacity:0}100%{opacity:0}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;display:none}
#banner .in{display:inline-block;background:#FF7A3D;border:3px solid #fff;border-radius:22px;padding:8px 26px;box-shadow:0 6px 0 #b8501f;animation:banner 1.9s cubic-bezier(.2,.9,.3,1.2) forwards}
#banner .in.green{background:#3FB86A;box-shadow:0 6px 0 #2a7d48}
#banner h3{margin:0;font-size:30px;line-height:1.1}
#banner p{margin:0;font-size:17px;opacity:.95}
@keyframes banner{0%{transform:scale(.3) rotate(-8deg);opacity:0}15%{transform:scale(1.08) rotate(2deg);opacity:1}25%{transform:scale(1) rotate(0)}80%{transform:scale(1);opacity:1}100%{transform:scale(.8) translateY(-40px);opacity:0}}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:800;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 rgba(40,20,60,.9),0 0 6px rgba(40,20,60,.6);animation:popUp .9s ease-out forwards}
@keyframes popUp{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.pop.big{animation:popBig 1.3s ease-out forwards}
@keyframes popBig{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}12%{transform:translate(-50%,-50%) scale(1.35) rotate(3deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}75%{opacity:1}100%{transform:translate(-50%,-110%) scale(1.05);opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,35,.5);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{background:#FFF6E6;color:#3a2410;border-radius:22px;padding:20px 22px;text-align:center;min-width:230px;max-width:86%;box-shadow:0 8px 0 #c9924a;animation:cardIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes cardIn{from{transform:scale(.5) rotate(-4deg)}}
.card h2{margin:0 0 2px;font-size:32px}
.card p{margin:4px 0 12px;font-size:17px}
.big-pct{font-size:52px;font-weight:800;line-height:1;color:#FF7A3D;text-shadow:0 3px 0 #c9924a}
.stars{font-size:46px;letter-spacing:2px;height:60px}
.stars span{display:inline-block;color:#d9c9a8}
.stars span.on{color:#FFB800;text-shadow:0 3px 0 #c98a00;animation:starIn .45s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
.btn{border:0;border-radius:16px;padding:10px 22px;font:800 20px "Baloo 2",system-ui,sans-serif;color:#fff;background:#FF7A3D;box-shadow:0 5px 0 #b8501f;margin:4px}
.btn.alt{background:#8FA3B8;box-shadow:0 5px 0 #5c6e82}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.lv{border:0;border-radius:14px;padding:6px 0 2px;font:800 21px "Baloo 2",system-ui,sans-serif;color:#fff;background:#FF7A3D;box-shadow:0 4px 0 #b8501f}
.lv small{display:block;font-size:10px;color:#FFE7A0;letter-spacing:1px;height:13px}
.lv.lock{background:#b9ad98;box-shadow:0 4px 0 #8d8270;color:#eee}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}

/* Bölümler: yapı kurucu çağrıları. pass/s2/s3 = geçme ve yıldız eşikleri (yıkım oranı), bot testiyle ayarlandı. */

    ['tower', -3, -11, { levels: 8 }], ['tower', 3, -17, { levels: 8 }], ['pillar', 0.2, -13.5] ] },

  { name: 'Direkli Bahçe', throws: 4, theme: 'after', pass: 0.7, s2: 0.85, s3: 0.95, build: [
    ['house', -3, -13, { cols: 3, rows: 3, layers: 3, window: true }], ['house', 3, -19, { cols: 3, rows: 3, layers: 3, window: true }],

    ['glassWall', 0.4, -15.5, { n: 3 }], ['pillar', 0.6, -9.5], ['pillar', -4.6, -17] ] },

    ['stone', -3.4, -9, { w: 2.4 }], ['stone', 3.8, -12, { w: 2.2 }], ['tower', -3.6, -17, { levels: 7 }],
    ['shelf', 3.6, -19, { cols: 2, rows: 2, top: 'bottle' }], ['house', 0, -23, { cols: 3, rows: 2, layers: 3 }], ['tnt', 0.4, -16] ] },

// TODO: kalkanlı hedef (sadece dönüşte vurulabilen) bu döngü şekliyle ~%1 nişan alanı bıraktı; döngü şekli değişmeden eklenmeyecek

const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let seed = 1; const srnd = (a, b) => a + ((seed = (seed * 16807) % 2147483647) / 2147483647) * (b - a);   // fizik için tekrarlanabilir rastgele
const SAVE_KEY = 'dbg.bumerang.v2';
const SAVE = (() => { try { return Object.assign({ stars: [], best: [], sound: true }, JSON.parse(localStorage.getItem(SAVE_KEY))); } catch (e) { return { stars: [], best: [], sound: true }; } })();
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} };
const G = window.G = { FAST: false };

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ac = null, master, sfxBus, musBus, musHi, noise; const last = {};
  let wh = null, ch = null, mOn = false, nextBeat = 0, beat = 0;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = SAVE.sound ? 0.85 : 0; master.connect(ac.destination);
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(master);
    sfxBus = ac.createGain(); sfxBus.connect(comp); musBus = ac.createGain(); musBus.gain.value = 0.5; musBus.connect(comp);
    musHi = ac.createGain(); musHi.gain.value = 0; musHi.connect(musBus);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(t, dur, f0, f1, g, type, bus) { const o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.005); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gg); gg.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.02); }
  function burst(t, dur, f, q, g, type, bus) { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = type || 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(g, t + 0.005); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(gg); gg.connect(bus || sfxBus); s.start(t, Math.random()); s.stop(t + dur + 0.02); }
  const ok = (k, gap) => { if (!ac || G.FAST) return false; const t = ac.currentTime; if (last[k] && t - last[k] < gap) return false; last[k] = t; return true; };
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31];
  const nf = s => 523.25 * Math.pow(2, s / 12);
  return { init,
    setOn(on) { if (master) master.gain.setTargetAtTime(on ? 0.85 : 0, ac.currentTime, 0.05); },
    chargeStart() { if (!ac || ch || G.FAST) return; const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 600;
      o.frequency.value = 90; g.gain.value = 0; o.connect(f); f.connect(g); g.connect(sfxBus); o.start(); ch = { o, g, f }; },
    charge(k) { if (!ch) return; const t = ac.currentTime; ch.o.frequency.setTargetAtTime(90 + 140 * k, t, 0.05); ch.f.frequency.setTargetAtTime(500 + 1500 * k, t, 0.05); ch.g.gain.setTargetAtTime(0.015 + 0.03 * k, t, 0.05); },
    chargeStop() { if (!ch) return; const c = ch; ch = null; c.g.gain.setTargetAtTime(0, ac.currentTime, 0.02); setTimeout(() => { try { c.o.stop(); } catch (e) {} }, 150); },
    throw(k) { if (!ok('throw', 0.05)) return; const t = ac.currentTime; burst(t, 0.3, 600, 1.1, 0.35); burst(t + 0.04, 0.22, 1800 + 800 * k, 1.5, 0.15); tone(t, 0.22, 200, 600 + 300 * k, 0.07, 'triangle'); tone(t, 0.08, 120, 60, 0.2, 'sine'); },
    whooshStart() { if (!ac || wh || G.FAST) return; const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5; bp.frequency.value = 800;
      const g = ac.createGain(); g.gain.value = 0; s.connect(bp); bp.connect(g); g.connect(sfxBus); s.start(); wh = { s, bp, g }; },
    whoosh(spin, vol) { if (!wh) return; const t = ac.currentTime, k = Math.abs(Math.sin(spin)); wh.bp.frequency.setTargetAtTime(500 + 1100 * k, t, 0.01); wh.g.gain.setTargetAtTime(vol * (0.1 + 0.25 * k), t, 0.015); },
    whooshStop() { if (!wh) return; const w = wh; wh = null; w.g.gain.setTargetAtTime(0, ac.currentTime, 0.03); setTimeout(() => { try { w.s.stop(); } catch (e) {} }, 200); },
    can(p) { if (!ok('can', 0.02)) return; const t = ac.currentTime, f = 950 * p;   // katmanlı: metal tını + gövde "tonk" + tıkırtı
      [1, 2.76, 5.4].forEach((k, i) => tone(t, 0.4 - i * 0.1, f * k, f * k * 0.97, 0.08 / (i + 1), 'sine'));
      tone(t, 0.12, 260 * p, 180 * p, 0.14, 'triangle'); burst(t, 0.05, 4500, 1, 0.22); burst(t + 0.04, 0.12, 2500, 3, 0.05); },
    clink(v) { if (!ok('clink', 0.03)) return; const t = ac.currentTime, f = rnd(1600, 2600); tone(t, 0.12, f, f * 0.98, 0.03 * v, 'sine'); burst(t, 0.03, 5000, 2, 0.05 * v); },

  const iv = setInterval(() => { v = Math.min(target, v + Math.max(1, Math.round(target / 40))); const el = d.querySelector('#wPct'); if (!el) { clearInterval(iv); return; } el.textContent = '%' + v; SFX.count();
    th.forEach((t, k) => { if (v >= t && !lit[k] && k < st) { lit[k] = true; d.querySelector(`[data-k="${k}"]`).classList.add('on'); SFX.star(k); buzz(15); } });
    if (v >= target) clearInterval(iv); }, 30);
  d.querySelector('#bAgain').onclick = () => { SFX.init(); loadLevel(S.lv); };
  d.querySelector('#bNext').onclick = () => { SFX.init(); if (last) showLevels(); else loadLevel(S.lv + 1); };
}
function showLose() {
  const d = overlay(`<div class="card"><h2>Atış bitti</h2><div class="big-pct">%${Math.round(pct() * 100)}</div><p>Geçmek için %${Math.round(S.L.pass * 100)} yıkım lazım</p><button class="btn" id="bAgain">↻ Tekrar dene</button></div>`);
  d.querySelector('#bAgain').onclick = () => { SFX.init(); loadLevel(S.lv); };
}
const unlockedMax = () => { let i = 0; while (i < LEVELS.length - 1 && SAVE.stars[i]) i++; return i; };
function showLevels() {
  const um = unlockedMax();
  const d = overlay(`<div class="card"><h2>Bölümler</h2><div class="grid">${LEVELS.map((L, i) => `<button class="lv ${i > um ? 'lock' : ''}" data-i="${i}">${i > um ? '🔒' : i + 1}<small>${'★'.repeat(SAVE.stars[i] || 0)}</small></button>`).join('')}</div>
    <button class="btn alt" id="bClose">Kapat</button></div>`);
  d.querySelectorAll('.lv').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (i <= um) { SFX.init(); loadLevel(i); } else buzz(20); });
  d.querySelector('#bClose').onclick = () => hideOv();
}

/* ---------------- DÖNGÜ ---------------- */
function fit() { const w = app.clientWidth, h = app.clientHeight; renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', fit);
let lastTs = 0;
function loop(ts) { requestAnimationFrame(loop); if (window.PAUSE) return; const dt = Math.min(0.033, lastTs ? (ts - lastTs) / 1000 : 0); lastTs = ts; if (dt > 0) step(dt); render(); }
fit(); loadLevel(unlockedMax()); requestAnimationFrame(loop);
Object.assign(G, { step, render, makePath, pathPoint, obstacleAt, inZone, throwBoom, loadLevel, LEVELS, SAVE, pct }); Object.defineProperty(G, 'S', { get: () => S });
</script>

<style>

<div id="app"><div class="cab" id="cab">

    <span class="stat"><small>Bölüm</small><b id="hLv">1</b></span>

  </div>

</div></div>

<script>
'use strict';
/* ============================================================
   LİMAN VİNCİ — gemideki konteyner yığınlarını renklerine göre kamyonlara indir
   En üstteki konteynere dokun → vinç alır: rıhtımda aynı renk kamyon varsa ona, yoksa bekleme rampasına.
   Kamyon 3 birimle dolunca gider, sıradaki gelir; rampadaki uygun konteynerler kendiliğinden yüklenir.
   Gemi boşalınca kazanırsın; rampa taşarsa kaybedersin.
   Engeller: ❓ gizli · 🧊 buz (2 dokunuş) · 🔒 kilit + 🔑 anahtar · ⚓ ağır (kamyonda 2 birim) · 💣 bomba (N hamlede indir) · ⚖ gemi yatışı
   Mantık anlık ve saf (applyMove), görseller arkadan yetişir: vinç animasyonu oyuncuyu bekletmez.
   ============================================================ */
const W = 360, H = 640;
const TRUCK_CAP = 3, CW = 46, CH = 28, COL_GAP = 52;     // kamyon kapasitesi · konteyner boyu · yığın aralığı
const SHIP = { x: 180, y: 318 };                          // güverte merkezi (yığın tabanı)
const RAMP_Y = 424, DOCK_Y = 540, FLY_DUR = 0.42;
const COLORS = { R: { n: 'kırmızı', c: '#E5484D' }, B: { n: 'mavi', c: '#3E7BFA' }, Y: { n: 'sarı', c: '#F2B233' }, G: { n: 'yeşil', c: '#2F9E6B' }, P: { n: 'mor', c: '#9B5FD6' } };
/* Bölümler — stacks: yığınlar (alttan üste), jeton: renk + bayraklar  ? gizli  * buz  L kilit  K anahtar  H ağır  1-9 bomba hamlesi
   queue: kamyon sırası · dock: aynı anda rıhtımda duran kamyon · ramp: rampa yeri · tilt: gemi yatış sınırı (0 = yok)
   3–10. bölümler üretici + çözücüyle seçildi: hepsi çözülebilir; rastgele / açgözlü bot kazanma oranları yorumda */
const LEVELS = [
  { stacks:['R B', 'B R', 'R B'], queue:'RB', dock:2, ramp:4 },
  { stacks:['R Y B', 'B R Y', 'Y B R'], queue:'RBY', dock:2, ramp:4 },
  { stacks:['B? R? R R R', 'R Y', 'Y', 'R? Y? B B'], queue:'BYRR', dock:2, ramp:4 },                                   // ❓ · rastgele %68 · açgözlü %100
  { stacks:['R? R R Y Y', 'G B R', 'R? G B G R', 'B Y? B B B'], queue:'GBRYBR', dock:2, ramp:3 },                         // rampa 3 · %28 · %69
  { stacks:['Y Y G R R', 'Y', 'G B* B R* R', 'B G? R? R*'], queue:'RBYRG', dock:2, ramp:4 },                              // 🧊 · %46 · %86
  { stacks:['BL G B YK', 'R Y R B BL', 'G G Y B', 'B R'], queue:'BBRGY', dock:2, ramp:4 },                                // 🔒🔑 · %38 · %75
  { stacks:['B Y RH R', 'BH Y', 'B? R', 'RH', 'Y? B B'], queue:'BBRRY', dock:2, ramp:4 },                                 // ⚓ · %36 · %39
  { stacks:['R G', 'G Y7 G R', 'B Y B Y', 'Y B Y R Y'], queue:'YGYBR', dock:2, ramp:4 },                                  // 💣 · %22 · %27
  { stacks:['Y G G Y', 'B B', 'G R R R R', 'Y', 'R B R'], queue:'GYRRB', dock:2, ramp:4, tilt:6 },                        // ⚖ · %10 · %100
  { stacks:['G* B B?H7 Y G', 'B R R? R*', 'R G? PL', 'B R P? B? RK', 'Y Y? P'], queue:'RGYBPBR', dock:2, ramp:4, tilt:8 }, // karma · %0 · %9
];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

/* ---------------- MANTIK (saf) ---------------- */
let NEXT_ID = 1;
function parseLevel(L) {
  const stacks = L.stacks.map(s => s.split(' ').filter(Boolean).map(tok => {
    const c = { id: NEXT_ID++, c: tok[0], hidden: false, ice: 0, lock: false, key: false, heavy: false, bomb: 0 };
    for (const f of tok.slice(1)) { if (f === '?') c.hidden = true; else if (f === '*') c.ice = 1; else if (f === 'L') c.lock = true; else if (f === 'K') c.key = true; else if (f === 'H') c.heavy = true; else if (/\d/.test(f)) c.bomb = +f; }
    return c; }));
  for (const s of stacks) if (s.length) s[s.length - 1].hidden = false;   // en üsttekiler görünür
  const st = { stacks, ramp: [], queue: [...L.queue], docks: Array(L.dock).fill(null), rampCap: L.ramp, tilt: L.tilt || 0, moves: 0, coins: 0, over: null, truckId: 1 };
  for (let k = 0; k < L.dock; k++) arrive(st, k, []);
  return st;
}
const units = c => c.heavy ? 2 : 1;
const keysLeft = st => st.stacks.some(s => s.some(c => c.key));
const torque = st => { const mid = (st.stacks.length - 1) / 2; return st.stacks.reduce((a, s, i) => a + s.reduce((u, c) => u + units(c), 0) * (i - mid), 0); };
const shipEmpty = st => st.stacks.every(s => !s.length);
function arrive(st, k, ev) {
  if (!st.queue.length) { st.docks[k] = null; return; }
  st.docks[k] = { id: st.truckId++, color: st.queue.shift(), load: [], units: 0 };
  ev.push({ type: 'arrive', dock: k, truck: st.docks[k].id, color: st.docks[k].color });   // renk olayda: aynı hamlede dolup gidebilir
}
function loadInto(st, c, ev, from) {
  const k = st.docks.findIndex(d => d && d.color === c.c && d.units + units(c) <= TRUCK_CAP);
  if (k < 0) return false;
  const d = st.docks[k]; d.load.push(c); d.units += units(c);
  ev.push({ type: from === 'ramp' ? 'auto' : 'move', id: c.id, to: 'truck', dock: k, truck: d.id });
  if (d.units >= TRUCK_CAP) { ev.push({ type: 'depart', dock: k, truck: d.id, load: d.load.map(x => x.id), color: d.color }); st.coins += 10; arrive(st, k, ev); autoLoad(st, ev); }
  return true;
}
function autoLoad(st, ev) {
  let changed = true;
  while (changed) { changed = false;
    for (let i = 0; i < st.ramp.length; i++) { const c = st.ramp[i]; if (st.docks.some(d => d && d.color === c.c && d.units + units(c) <= TRUCK_CAP)) { st.ramp.splice(i, 1); loadInto(st, c, ev, 'ramp'); changed = true; break; } } }
}
function canTap(st, i) {
  const s = st.stacks[i]; if (!s || !s.length || st.over) return false;
  const top = s[s.length - 1];
  return !(top.lock && keysLeft(st));
}
/* bir hamle: yığın i'nin tepesine dokun. durum yerinde değişir, olay listesi döner */
function applyMove(st, i) {
  const ev = [], s = st.stacks[i];
  if (!s || !s.length || st.over) return ev;
  const top = s[s.length - 1];
  if (top.lock && keysLeft(st)) { ev.push({ type: 'locked', id: top.id }); return ev; }
  st.moves++;
  if (top.ice > 0) { top.ice--; ev.push({ type: 'crack', id: top.id }); }
  else {
    s.pop();
    if (s.length && s[s.length - 1].hidden) { s[s.length - 1].hidden = false; ev.push({ type: 'reveal', id: s[s.length - 1].id }); }
    top.bomb = 0;
    const hadKeys = top.key; top.key = false;
    if (hadKeys && !keysLeft(st)) ev.push({ type: 'unlock' });
    if (!loadInto(st, top, ev, 'ship')) {
      st.ramp.push(top); ev.push({ type: 'move', id: top.id, to: 'ramp', slot: st.ramp.length - 1 });
      if (st.ramp.length > st.rampCap) { st.over = 'ramp'; ev.push({ type: 'fail', why: 'ramp' }); return ev; }
    }
  }
  // bomba: gemide kalanların sayacı düşer
  for (const ss of st.stacks) for (const c of ss) if (c.bomb > 0) { c.bomb--; if (c.bomb === 0) { st.over = 'bomb'; ev.push({ type: 'fail', why: 'bomb', id: c.id }); return ev; } }
  if (st.tilt && Math.abs(torque(st)) > st.tilt) { st.over = 'tilt'; ev.push({ type: 'fail', why: 'tilt' }); return ev; }
  if (shipEmpty(st) && !st.ramp.length) { st.over = 'win'; ev.push({ type: 'win' }); return ev; }
  if (!shipEmpty(st) && !st.stacks.some((_, j) => canTap(st, j))) { st.over = 'stuck'; ev.push({ type: 'fail', why: 'stuck' }); }
  return ev;
}
const cloneState = st => JSON.parse(JSON.stringify(st));

/* ---------------- SES ---------------- */
const SFX = (() => {
  let ac = null, master = null, noise = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(t0, dur, f0, f1, g, type) { const o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.006); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gg); gg.connect(master); o.start(t0); o.stop(t0 + dur + 0.02); }
  function burst(t0, dur, f, q, g, type) { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = type || 'bandpass';
    bp.frequency.value = f; bp.Q.value = q; const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t0 + 0.005);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(bp); bp.connect(gg); gg.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.02); }
  const w = fn => (...a) => { if (!ac) return; fn(ac.currentTime, ...a); };
  return { init,
    grab: w(t => { tone(t, 0.08, 300, 520, 0.08, 'triangle'); burst(t, 0.12, 2200, 3, 0.05); }),
    tunk: w((t, heavy) => { tone(t, 0.14, heavy ? 120 : 180, heavy ? 60 : 90, heavy ? 0.3 : 0.22); burst(t, 0.08, 600, 0.8, 0.12, 'lowpass'); }),
    ramp: w(t => { tone(t, 0.1, 240, 150, 0.14, 'square'); burst(t, 0.06, 900, 1, 0.06); }),
    horn: w(t => { tone(t, 0.28, 330, 320, 0.09, 'sawtooth'); tone(t, 0.28, 415, 405, 0.07, 'sawtooth'); }),
    arrive: w(t => { burst(t, 0.3, 300, 0.6, 0.06, 'lowpass'); }),
    crack: w(t => { burst(t, 0.1, 5000, 2, 0.12); tone(t, 0.06, 2400, 1400, 0.05, 'triangle'); }),
    locked: w(t => { tone(t, 0.06, 800, 800, 0.08, 'square'); tone(t + 0.08, 0.08, 600, 600, 0.08, 'square'); }),
    unlock: w(t => { [0, 5, 9].forEach((s, i) => tone(t + i * 0.06, 0.15, 880 * Math.pow(2, s / 12), 880 * Math.pow(2, s / 12), 0.08, 'triangle')); }),
    reveal: w(t => { tone(t, 0.1, 600, 900, 0.05, 'sine'); }),
    tick: w(t => tone(t, 0.05, 1400, 1400, 0.06, 'square')),
    boom: w(t => { burst(t, 0.6, 300, 0.5, 0.5, 'lowpass'); tone(t, 0.5, 120, 40, 0.35, 'sawtooth'); }),
    splash: w(t => { burst(t, 0.5, 1200, 0.7, 0.25); tone(t, 0.3, 300, 100, 0.12); }),
    bad: w(t => { tone(t, 0.14, 240, 160, 0.14, 'square'); }),
    undo: w(t => { tone(t, 0.1, 700, 950, 0.08, 'triangle'); }),
    gull: w(t => { tone(t, 0.18, 1800, 1300, 0.02, 'sine'); tone(t + 0.2, 0.2, 1900, 1200, 0.02, 'sine'); }),
    shipHorn: w(t => { tone(t, 1.1, 98, 96, 0.22, 'sawtooth'); tone(t, 1.1, 147, 145, 0.12, 'sawtooth'); burst(t, 1.1, 300, 0.5, 0.05, 'lowpass'); }),
    siren: w(t => { tone(t, 0.25, 700, 950, 0.05, 'triangle'); tone(t + 0.25, 0.25, 950, 700, 0.05, 'triangle'); }),
    streak: w((t, n) => { const f = 523 * Math.pow(2, Math.min(n, 10) * 2 / 12); tone(t, 0.12, f, f, 0.08, 'triangle'); tone(t + 0.07, 0.14, f * 1.5, f * 1.5, 0.06, 'triangle'); }),
    coin: w(t => { tone(t, 0.06, 1800, 2400, 0.04, 'square'); }),
    toot: w(t => { tone(t, 0.08, 520, 520, 0.05, 'square'); tone(t + 0.12, 0.08, 520, 520, 0.05, 'square'); }),
    win: w(t => { [0, 4, 7, 12, 16].forEach((s, i) => tone(t + i * 0.09, 0.35, 523 * Math.pow(2, s / 12), 523 * Math.pow(2, s / 12), 0.14, 'triangle')); }),
  };
})();
const buzz = ms => { try { const ua = navigator.userActivation; if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} };

/* ---------------- GÖRSEL DURUM ---------------- */
let S = null;
const SAVE_KEY = 'dbg.liman.v1';
const loadBest = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || { lv: 0, stars: {} }; } catch (e) { return { lv: 0, stars: {} }; } };
const saveBest = b => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(b)); } catch (e) {} };
function newRun(lv) {
  const L = LEVELS[lv], st = parseLevel(L);
  S = { lv, L, st, history: [], undos: 0, vis: {}, trucks: {}, leaving: [], crane: { x: W / 2, y: 70, carry: null }, flies: {}, parts: [], pops: [], shake: 0, t: 0,
    running: false, phase: 'play', tilt: 0, gullT: 5, splashT: 0, overT: 0,
    bob: 0, shipX: 0, sail: 0, streak: 0, colFlash: {}, confetti: [], smokeT: 0, fuseT: 0, sirenT: 0, craneIdleX: W / 2, coinsShown: 0 };
  st.docks.forEach((d, k) => { if (d) S.trucks[d.id] = { id: d.id, color: d.color, dock: k, x: dockX(k), state: 'idle', bounce: 0 }; });
  syncVis(true);
}
const dockX = k => W / 2 + (k - (S.st.docks.length - 1) / 2) * 172;
const rampX = j => W / 2 + (j - (S.st.rampCap - 1) / 2) * 54;
const colX = i => SHIP.x + (i - (S.st.stacks.length - 1) / 2) * COL_GAP;
/* mantıktaki yere göre konteynerin hedef ekran konumu (gemi yatışıyla döner) */
function targets() {
  const T = {}, st = S.st, a = S.tilt, ca = Math.cos(a), sa = Math.sin(a);
  st.stacks.forEach((s, i) => s.forEach((c, h) => { const lx = colX(i) - SHIP.x, ly = -CH / 2 - h * CH;
    T[c.id] = { x: SHIP.x + S.shipX + lx * ca - ly * sa, y: SHIP.y + S.bob + lx * sa + ly * ca, rot: a, sc: 1, where: 'ship', c }; }));
  st.ramp.forEach((c, j) => T[c.id] = { x: rampX(j), y: RAMP_Y, rot: 0, sc: 0.9, where: 'ramp', c });
  st.docks.forEach((d, k) => { if (!d) return; const tr = S.trucks[d.id]; let off = 0;
    d.load.forEach(c => { const u = units(c); T[c.id] = { x: (tr ? tr.x : dockX(k)) - 38 + (off + u / 2) * 30, y: DOCK_Y - 22 - (tr ? tr.bounce * 6 : 0), rot: 0, sc: 0.62, where: 'truck', c, wide: u }; off += u; }); });
  for (const lv of S.leaving) { let off = 0; lv.load.forEach(c => { const u = units(c); T[c.id] = { x: lv.x - 38 + (off + u / 2) * 30, y: DOCK_Y - 22, rot: 0, sc: 0.62, where: 'truck', c, wide: u }; off += u; }); }
  return T;
}
function syncVis(snap) {
  const T = targets();
  for (const id in T) { if (!S.vis[id] || snap) S.vis[id] = { x: T[id].x, y: T[id].y, rot: T[id].rot, sc: T[id].sc, pop: 0, shake: 0 }; }
  for (const id in S.vis) if (!T[id]) delete S.vis[id];
}

/* ---------------- OYUNCU HAMLESİ ---------------- */
function tapStack(i) {
  if (!S.running || S.phase !== 'play') return;
  const st = S.st, s = st.stacks[i]; if (!s || !s.length) return;
  const top = s[s.length - 1];
  const before = cloneState(st);
  S.colFlash[i] = 1; S.craneIdleX = colX(i);
  const ev = applyMove(st, i);
  if (ev.length && ev[0].type === 'locked') { SFX.locked(); buzz(20); S.vis[top.id].shake = 1; popText('🔒 Önce 🔑 anahtarı indir', W / 2, 120, '#B3261E', 16); return; }
  S.history.push({ st: before, trucks: JSON.parse(JSON.stringify(S.trucks)) });
  handleEvents(ev);
  HUD.dirty = true;
}
function handleEvents(ev) {
  let delay = 0;
  for (const e of ev) {
    if (e.type === 'crack') { SFX.crack(); buzz(12); const v = S.vis[e.id]; v.shake = 1; shards(v.x, v.y, '#DFF4FF', 10); popText('Çatladı!', v.x, v.y - 26, '#3E7BFA', 15); }
    else if (e.type === 'move' || e.type === 'auto') {
      // rampadan yeni gelen kamyona otomatik yükleme: kamyon rıhtıma varınca uçsun
      const tr = S.trucks[e.truck]; if (e.type === 'auto' && tr && tr.state === 'arrive') delay = Math.max(delay, tr.wait + 0.35);

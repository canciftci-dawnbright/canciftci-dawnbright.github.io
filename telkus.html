<style>
html,body{margin:0;height:100%;background:#8fd0f2;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#2a3a4a}

canvas#sahne3d{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:8px;right:8px;top:8px;display:flex;align-items:center;gap:6px;z-index:5;pointer-events:none}
.pil{background:rgba(255,255,255,.9);border-radius:14px;padding:3px 10px;font-weight:800;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px;white-space:nowrap}

#ilerle{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.6);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}

.erozet{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);border-radius:10px;padding:0 6px;font-weight:800;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.25);white-space:nowrap;font-family:'Baloo 2','Segoe UI Emoji',system-ui}

.pop{position:absolute;z-index:7;pointer-events:none;font-weight:800;font-size:18px;white-space:nowrap;transform:translate(-50%,-50%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.25);animation:pop 1.1s ease-out forwards}
.pop.zincir{color:#ffe066;font-size:24px}.pop.uyari{color:#ff6a5a}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}
.yuk i{display:block;height:4px;border-radius:2px;margin:2px 0 1px;background:linear-gradient(90deg,#5fd35a var(--w),rgba(0,0,0,.15) var(--w))}
.yuk.dikkat i{background:linear-gradient(90deg,#f2a23a var(--w),rgba(0,0,0,.15) var(--w))}.yuk.tehlike i{background:linear-gradient(90deg,#fff var(--w),rgba(255,255,255,.3) var(--w))}

@keyframes elYukari{0%{opacity:0;transform:translate(-30%,10%)}20%{opacity:1}80%{opacity:1;transform:translate(-30%,-90%)}100%{opacity:0;transform:translate(-30%,-90%)}}

@keyframes elGit{0%{opacity:0;transform:translate(var(--x0),var(--y0))}20%{opacity:1;transform:translate(var(--x0),var(--y0)) scale(.9)}80%{opacity:1;transform:translate(var(--x1),var(--y1))}100%{opacity:0;transform:translate(var(--x1),var(--y1))}}
#ip{position:absolute;left:14px;right:14px;bottom:66px;z-index:20;background:#fff;border-radius:14px;padding:9px 12px;font-weight:700;font-size:14px;line-height:1.25;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}

<div id="app">
  <div id="hud"><button class="pil" id="bMenu">☰</button><div class="pil" id="hSev">🐦 <span id="hNo">1</span> <small id="hAd"></small></div><div id="ilerle"><div id="ilerleIc"></div></div><div class="pil" id="hKalan">0</div></div>
  <div id="huzur" class="pil">Huzur <span id="huzurIc"></span></div>
  <div id="sirada">SIRADA</div>
  <div id="alt"><button id="bKirinti">🍞 <span id="kirSay">3</span> <small>güçlendirme</small></button></div>
  <div id="ip"></div>
  <div id="over"><div class="card" id="ekran"></div></div>
  <div id="err"></div>
</div>
<script>
(function () {
  var e = document.getElementById('err'), t0 = Date.now(), hata = false;
  var hazir = function () { return window.G && window.G.hazir; };
  var goster = function (html) { e.innerHTML = html; e.style.display = 'flex'; };
  var dugme = '<button class="btn" style="margin-top:16px" onclick="location.reload()">Tekrar dene</button>';
  window.__yukHata = function () { if (hazir()) return; hata = true; goster('3D kütüphanesi yüklenemedi.<small>İnternet bağlantısını kontrol edip tekrar dene.</small>' + dugme); };
  addEventListener('error', function (ev) { if (ev.target && ev.target.tagName === 'SCRIPT') window.__yukHata(); }, true);
  addEventListener('unhandledrejection', function () { window.__yukHata(); });
  (function kontrol() {
    if (hazir()) { e.style.display = 'none'; return; }
    if (!hata) { var sn = (Date.now() - t0) / 1000;
      if (sn > 2) goster('<div class="cark"></div>Yükleniyor…' + (sn > 20 ? '<small>Bağlantı yavaş, biraz daha bekle</small>' : '') + (sn > 60 ? dugme : '')); }
    setTimeout(kontrol, 400);
  })();
})();
</script>
<script>
/* <<<MANTIK>>> */
// Tel Kuslari: gokten gelen kuslari tellere yerlestir. Ayni renkten 4 kus yan yana gelince havalanir (ortadan giderse
// iki yan birlesir: zincir). Tel dolup 4'lu olmazsa kuslar geri ucar (huzur -1). Yukari kaydir = kiskis (huzur -1).
// Depo (camasir ipi) huzur bozmaz. Engeller: baykus, yumurta, kedi, kivilcim, yagmur.
const KUS = {
  sari:    { ad: 'Kanarya',  agir: 1, renk: '#ffd23a' },
  mavi:    { ad: 'Maviş',    agir: 1, renk: '#4a9ff0' },
  kirmizi: { ad: 'Kardinal', agir: 1, renk: '#e8453a' },
  pembe:   { ad: 'Flamingo yavrusu', agir: 1, renk: '#ff8ac8' },
  yesil:   { ad: 'Papağan',  agir: 2, renk: '#3fbf5a' },
  gri:     { ad: 'Güvercin', agir: 2, renk: '#9aa4b0' },
};
const GRUP = 4;
const HUZUR = 3;
const ENGEL = {
  baykus:   { ad: 'Uykucu baykuş', simge: '🦉', metin: 'Telde bir yer kaplar ve renkleri böler. O telde <b>kanat sesi</b> olunca (sürü havalanır, geri uçar ya da kışkışlarsın) uyanıp uçar.' },
  yumurta:  { ad: 'Yumurta', simge: '🥚', metin: 'Telde bir yer kaplar. Üstündeki sayı her kuş konuşta azalır; sıfırda çatlar ve <b>o renkte bir yavru</b> olur. Yavrunun yanına aynı renkleri hazırla!' },
  kedi:     { ad: 'Mahalle kedisi', simge: '🐈', metin: 'Balkondaki kedi sayacı bitince o telin <b>ucundaki aynı renk grubu</b> korkutup gökyüzüne yollar. Huzur gitmez ama kuşlar sıraya geri döner.' },
  kivilcim: { ad: 'Arızalı trafo', simge: '⚡', metin: 'Bu tel aralıklarla <b>elektriklenir</b>. Kıvılcım varken o tele kuş konmaz; sayaca bakıp zamanla.' },
  yagmur:   { ad: 'Yağmur bulutu', simge: '🌧️', metin: 'Bulut tellerin üstünde gezer. Altındaki tel ıslanır ve <b>taşıma sınırı 3 düşer</b>: fazla yüklersen kopar!' },
};

function rngYap(tohum) { let s = (tohum >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

// ---------- seviyeler. bas: [[tel, [ogeler]]] (oge: renk | 'baykus' | ['yumurta', renk, sayac])
const SEVIYE_TAB = [
  { ad: 'İlk sabah', tel: 3, yer: 6, limit: 10, renk: ['sari', 'mavi', 'kirmizi'], suru: 2, depo: 3, ogretici: true },
  { ad: 'Uykucu baykuş', tel: 3, yer: 6, limit: 10, renk: ['sari', 'mavi', 'kirmizi'], suru: 2, depo: 3, yeniEngel: 'baykus',
    bas: [[0, ['baykus']], [1, ['baykus', 'mavi']], [2, ['baykus']]] },
  { ad: 'Yumurtalar', tel: 3, yer: 7, limit: 11, renk: ['sari', 'mavi', 'kirmizi', 'yesil'], suru: 2, depo: 3, yeniEngel: 'yumurta',
    bas: [[0, [['yumurta', 'sari', 6]]], [1, ['kirmizi', ['yumurta', 'kirmizi', 9]]], [2, ['baykus']]] },
  { ad: 'Mahalle kedisi', tel: 3, yer: 7, limit: 11, renk: ['sari', 'mavi', 'kirmizi', 'yesil'], suru: 2, depo: 3, yeniEngel: 'kedi',
    kedi: { tel: 1, aralik: 4 }, bas: [[0, [['yumurta', 'mavi', 8]]], [2, ['baykus']]] },
  { ad: 'Arızalı trafo', tel: 3, yer: 7, limit: 11, renk: ['sari', 'mavi', 'kirmizi', 'gri'], suru: 2, depo: 3, yeniEngel: 'kivilcim',
    kivilcim: { tel: 0, acik: 3, kapali: 3 }, kedi: { tel: 2, aralik: 5 }, bas: [[1, [['yumurta', 'gri', 7]]]] },
  { ad: 'Yağmurlu gün', tel: 3, yer: 7, limit: 11, renk: ['sari', 'mavi', 'yesil', 'gri'], suru: 2, depo: 3, yeniEngel: 'yagmur',
    yagmur: { aralik: 4, sure: 3, eksi: 3 }, bas: [[1, ['baykus']]] },
];
function seviye(n) {
  if (n < SEVIYE_TAB.length) return { n, ...SEVIYE_TAB[n] };
  const k = n - SEVIYE_TAB.length, T = SEVIYE_TAB[1 + (k % 5)];
  return { n, ...T, ad: T.ad + ' ' + (k + 2), suru: T.suru + Math.floor(k / 5), yeniEngel: null };
}
// gelis sirasi: her renkten suru*4 kus; bastan telde olan / yumurtadan cikacak renkler siradan dusulur
function siraUret(S, r, dus) {
  const t = []; for (const c of S.renk) for (let i = 0; i < S.suru * GRUP - (dus[c] || 0); i++) t.push(c);
  for (let d = 0; d < 50; d++) { for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
    let ok = true, say = 1; for (let i = 1; i < t.length; i++) { say = t[i] === t[i - 1] ? say + 1 : 1; if (say > 3) { ok = false; break; } } if (ok) break; }
  return t;
}
function oyunKur(n, tohum) {
  const S = seviye(n), r = rngYap(tohum == null ? 4242 + n * 17 : tohum);
  const teller = Array.from({ length: S.tel + (S.depo ? 1 : 0) }, () => []), dus = {};
  for (const [t, ogeler] of S.bas || []) for (const o of ogeler) {
    if (o === 'baykus') teller[t].push({ ozel: 'baykus' });
    else if (Array.isArray(o)) { teller[t].push({ ozel: 'yumurta', renk: o[1], sayac: o[2] }); dus[o[1]] = (dus[o[1]] || 0) + 1; }
    else { teller[t].push(o); dus[o] = (dus[o] || 0) + 1; } }
  // baykus kurali: uyandirmak icin sagina 4'lu konabilmeli (bos yer + baykustan sonraki tek renk dizi >= GRUP), yoksa oyuncu huzur harcamaya zorlanir
  teller.forEach((T, t) => T.forEach((x, i) => { if (x.ozel !== 'baykus') return; const sag = T.slice(i + 1), bos = (Array.isArray(S.yer) ? S.yer[t] : S.yer) - T.length;
    const tekRenk = sag.every(y => y === sag[0]) && (!sag.length || typeof sag[0] === 'string');
    if (!tekRenk || bos + sag.length < GRUP) console.warn('Seviye ' + (n + 1) + ' tel ' + t + ': baykusun yaninda 4lu kurulamaz'); }));
  const sira = siraUret(S, r, dus);
  const O = { n, S, r, teller, sira, siraId: sira.map((_, j) => j), sonId: sira.length, i: 0, hak: 0, huzur: HUZUR, bitti: false, kazandi: false, kopan: -1, ucan: 0, hamle: 0, olaylar: [] };
  if (S.kedi) O.kedi = { tel: S.kedi.tel, sayac: S.kedi.aralik };
  if (S.kivilcim) O.kiv = { tel: S.kivilcim.tel, acik: false, sayac: S.kivilcim.kapali };
  if (S.yagmur) O.yag = { tel: -1, sayac: S.yagmur.aralik, sira: 0 };
  return O;
}
const kusMu = x => typeof x === 'string';
const ogeAgir = x => kusMu(x) ? KUS[x].agir : x.ozel === 'baykus' ? 2 : 1;
const agirlik = tel => tel.reduce((a, c) => a + ogeAgir(c), 0);
const depoMu = (O, t) => !!O.S.depo && t === O.teller.length - 1;
const yerT = (O, t) => depoMu(O, t) ? O.S.depo : Array.isArray(O.S.yer) ? O.S.yer[t] : O.S.yer;
const islakMi = (O, t) => !!O.yag && O.yag.tel === t;
const limitT = (O, t) => depoMu(O, t) ? 99 : (Array.isArray(O.S.limit) ? O.S.limit[t] : O.S.limit) - (islakMi(O, t) ? O.S.yagmur.eksi : 0);
const elektrikMi = (O, t) => !!O.kiv && O.kiv.acik && O.kiv.tel === t;
const siradaki = O => O.sira[O.i];
// yerlestirme sonucu: 'tamam' | 'dolu' | 'elektrik' | 'kopar'
function konabilir(O, t, tip) { const T = O.teller[t]; if (T.length >= yerT(O, t)) return 'dolu'; if (elektrikMi(O, t)) return 'elektrik'; if (agirlik(T) + KUS[tip].agir > limitT(O, t)) return 'kopar'; return 'tamam'; }
// kanat sesi: teldeki uyuyan baykuslar uyanip ucar
function baykusUyan(O, t) { const T = O.teller[t]; for (let i = T.length - 1; i >= 0; i--) if (!kusMu(T[i]) && T[i].ozel === 'baykus') { T.splice(i, 1); O.olaylar.push({ tip: 'baykusUcar', tel: t, idx: i }); } }
// 4'lu gruplari ucur (zincirleme)
function cozum(O, t) {
  const T = O.teller[t]; let zincir = 0;
  for (;;) {
    let bul = -1; for (let i = 0; i + GRUP <= T.length; i++) { if (!kusMu(T[i])) continue; let ok = true; for (let k = 1; k < GRUP; k++) if (T[i + k] !== T[i]) { ok = false; break; } if (ok) { bul = i; break; } }
    if (bul < 0) break;
    const tip = T[bul]; T.splice(bul, GRUP); zincir++; O.ucan++; O.olaylar.push({ tip: 'ucus', tel: t, bas: bul, kus: tip, zincir });
  }
  if (zincir) baykusUyan(O, t);
  return zincir;
}
// kuslari (engeller kalir) gokyuzune geri gonder, siraya karistir
function geriGonder(O, t, indeks) {
  const T = O.teller[t], kuslar = indeks.map(i => T[i]), idler = [];
  for (let k = indeks.length - 1; k >= 0; k--) T.splice(indeks[k], 1);
  for (const tip of kuslar) { const j = O.i + 1 + Math.floor(O.r() * (O.sira.length - O.i)); const id = O.sonId++; O.sira.splice(Math.min(j, O.sira.length), 0, tip); O.siraId.splice(Math.min(j, O.siraId.length), 0, id); idler.push(id); }
  return { kuslar, idler };
}

// telin u (0..1) noktasindaki dunya y'si: iki uc arasi egik + yuk sarkmasi + titresim
function telY(T, u) { return T.yL + (T.yR - T.yL) * u - T.sarkma * 4 * u * (1 - u) + T.A * Math.sin(Math.PI * u); }
function telGuncelle(T, dt, t) {
  const hedef = 0.1 + agirlik(O.teller[t]) * 0.075; T.sarkma += (hedef - T.sarkma) * Math.min(1, dt * 6);
  T.V += (-60 * T.A - 5 * T.V) * dt; T.A += T.V * dt;
  const p = T.mesh.geometry.attributes.position, b = T.taban;
  for (let i = 0; i < p.count; i++) { const x = b[i * 3], u = (x - SOL_X) / T.L; p.array[i * 3 + 1] = b[i * 3 + 1] + (T.kopuk ? kopukY(T, u) : telY(T, u)); }
  p.needsUpdate = true;
}
function kopukY(T, u) { const kir = 0.55, k = Math.min(1, T.ka); if (u < kir) { const v = u / kir; return T.yL - v * v * k * 3.2; } const v = (1 - u) / (1 - kir); return T.yR - v * v * k * 3.2; }
// tel uzerinde slot konumu (yuvalar teli esit boler)
function slotKonum(t, i, hedef) { const T = teller[t], yer = yerT(O, t), ara = T.L / yer, x = SOL_X + (i + 0.5) * ara, u = (x - SOL_X) / T.L; return hedef.set(x, telY(T, u), 0); }
// telin egimi (dy/dx)
function telEgim(T, u) { return ((T.yR - T.yL) - T.sarkma * 4 * (1 - 2 * u) + T.A * Math.PI * Math.cos(Math.PI * u)) / T.L; }

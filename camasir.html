<!doctype html>
<html lang="tr">
<head>

<title>Çamaşırhane</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2a4a5e;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#10334a}
#app{position:relative;margin:0 auto;height:100%;width:100%;max-width:560px;overflow:hidden;background:#bfe3ef}
#app canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px 10px;display:flex;gap:7px;align-items:center;pointer-events:none;z-index:2}
.pill{background:rgba(255,255,255,.96);border-radius:16px;padding:2px 11px;font-weight:800;font-size:16px;display:flex;gap:5px;align-items:center;box-shadow:0 3px 0 rgba(16,51,74,.25);white-space:nowrap}
#hCan{letter-spacing:1px}
#hCan.kirik{animation:kirik .5s}
@keyframes kirik{20%{transform:scale(1.3) rotate(-6deg)}40%{transform:scale(1.1) rotate(6deg)}}
#hPara.artti{animation:artti .4s}
@keyframes artti{40%{transform:scale(1.25)}}
.bosluk{flex:1}
.hbtn{pointer-events:auto;border:0;cursor:pointer;font:800 17px "Baloo 2",sans-serif;padding:2px 11px}
.hbtn:active{transform:translateY(2px)}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:22px;color:#fff;pointer-events:none;white-space:nowrap;-webkit-text-stroke:1.5px rgba(16,51,74,.85);text-shadow:0 3px 0 rgba(16,51,74,.7);animation:popUp 1.1s ease-out forwards;z-index:3}
.pop.buyuk{font-size:30px}
@keyframes popUp{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}15%{transform:translate(-50%,-60%) scale(1.2);opacity:1}28%{transform:translate(-50%,-70%) scale(1)}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-weight:800;font-size:46px;color:#fff;-webkit-text-stroke:2px rgba(16,51,74,.9);text-shadow:0 5px 0 rgba(16,51,74,.7);pointer-events:none;opacity:0;z-index:3;padding:0 16px}
#banner small{display:block;font-size:21px;-webkit-text-stroke:1px rgba(16,51,74,.9);margin-top:4px}
#banner.goster{animation:banner 2.6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes banner{0%{transform:scale(.3);opacity:0}10%{transform:scale(1.1);opacity:1}16%{transform:scale(1)}85%{transform:scale(1);opacity:1}100%{transform:scale(1.2);opacity:0}}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,25,40,.5);z-index:5}
.card{background:#fff;border-radius:24px;padding:18px 22px 20px;text-align:center;box-shadow:0 8px 0 rgba(16,51,74,.3);animation:cardIn .4s cubic-bezier(.2,.9,.3,1.35);min-width:68%;max-width:86%}
@keyframes cardIn{from{transform:scale(.5);opacity:0}}
.card h2{margin:0 0 2px;font-size:29px;line-height:1.1}
.card p{margin:4px 0 0;font-size:16px;opacity:.8}
.satir{display:flex;justify-content:space-between;font-size:17px;font-weight:800;padding:4px 2px;border-top:2px solid rgba(16,51,74,.08)}
.yildiz{font-size:42px;letter-spacing:4px;margin:4px 0}
.yildiz span{display:inline-block;animation:yildiz .45s cubic-bezier(.2,.9,.3,1.6) both}
.yildiz span.bos{filter:grayscale(1) opacity(.3)}
@keyframes yildiz{from{transform:scale(0) rotate(-90deg)}}
.btn{margin-top:14px;border:0;border-radius:18px;padding:10px 30px;font:800 21px "Baloo 2",system-ui,sans-serif;color:#fff;background:#ff7a3d;box-shadow:0 5px 0 #b64d1d;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b64d1d}
.btn.mavi{background:#3b8fe8;box-shadow:0 5px 0 #245ea3;margin-right:8px}
</style>

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="pill" id="hGun">Pazartesi</div>
    <div class="pill" id="hCan">❤️❤️❤️</div>
    <div class="bosluk"></div>
    <button class="pill hbtn" id="bKural" aria-label="Kurallar">?</button>
    <div class="pill" id="hMusteri">👤 0/6</div>
    <div class="pill" id="hPara">💰 <b id="hParaSay">0</b></div>
  </div>
  <div id="banner"></div>
  <div id="over"><div class="card" id="kart"></div></div>
</div>
<script>
/* <<<MANTIK>>> */
/* Camasirhane oyun mantigi — DOM'a dokunmaz; adimla(S, dt) ile zaman ilerler, harness botlarla calistirir.
   Musteriler dalgalar halinde gelir, sepetlerini ayiklama masasina bosaltir (masada yer yoksa kapida bekler).
   Oyuncu esyalari yikama makinelerine koyar, makineyi baslatir; biten yuku bir dokunusla kurutucuya aktarir;
   kuruyan esyalar sahibine doner. Musterinin tum esyalari donunce odeme alir ve gider.
   Bozulma (makine baslarken kesinlesir): farkli renk gruplari ayni yukte -> acik grup boyanir (beyaz < renkli < koyu);
   hassas esya sicak yikanirsa kuculur; lekeli esya on yikamadan girerse leke kalir; cift corap farkli yuklere ayrilirsa teki kaybolur.
   Can kaybi: sabri biten musteri (kizgin gider) ya da bozuk esya alan musteri. 3 can biterse gun biter (kayip).
   Kazanma: gunun tum musterileri islenir ve can > 0. */
const GRUPLAR = ['beyaz', 'renkli', 'koyu'];                 // acik -> koyu
const RENK_KOD = { beyaz: ['#f4f6f8'], renkli: ['#ef5a4a', '#3b8fe8', '#f5c230', '#3fbf6b'], koyu: ['#2b2f38', '#2f3552'] };
const CESITLER = ['tisort', 'pantolon', 'havlu', 'elbise'];
const AYAR = { yikamaSicak: 7, yikamaSoguk: 10, kurutma: 5, onYikama: 3, makineKap: 6, kurutucuKap: 8, arizaTik: 5, cayOran: 0.5, ucret: 10 };
// gun parametreleri: musteri sayisi, gruplar, makine/kurutucu sayisi, masa yeri, sabir (sn), esya adedi, gelis araligi (sn), mekanik oranlari
const GUNLER = [
  { ad: 'Pazartesi', musteri: 6, gruplar: 2, makine: 2, kurutucu: 1, masa: 10, sabir: [55, 70], esya: [2, 4], aralik: [6, 10], cift: 0, hassas: 0, leke: 0, ekspres: 0, ariza: 0, tohum: 1 },
  { ad: 'Salı', musteri: 8, gruplar: 3, makine: 3, kurutucu: 2, masa: 12, sabir: [55, 70], esya: [2, 5], aralik: [5, 9], cift: 0.35, hassas: 0, leke: 0, ekspres: 0, ariza: 0, tohum: 1 },
  { ad: 'Çarşamba', musteri: 9, gruplar: 3, makine: 3, kurutucu: 2, masa: 12, sabir: [55, 70], esya: [3, 5], aralik: [5, 8], cift: 0.3, hassas: 0.2, leke: 0, ekspres: 0, ariza: 0, tohum: 1 },
  { ad: 'Perşembe', musteri: 10, gruplar: 3, makine: 3, kurutucu: 2, masa: 12, sabir: [50, 65], esya: [3, 5], aralik: [5, 8], cift: 0.3, hassas: 0.2, leke: 0.15, ekspres: 0, ariza: 0, tohum: 1 },
  { ad: 'Cuma', musteri: 12, gruplar: 3, makine: 3, kurutucu: 2, masa: 14, sabir: [55, 70], esya: [3, 5], aralik: [4, 7], cift: 0.3, hassas: 0.2, leke: 0.15, ekspres: 0.25, ariza: 0.25, tohum: 1 },
];

function rnd(S) { S.rs = (S.rs + 0x6D2B79F5) >>> 0; let t = S.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const aral = (S, [a, b]) => a + Math.floor(rnd(S) * (b - a + 1));
const secR = (S, d) => d[Math.floor(rnd(S) * d.length)];

function gunKur(no, tohum) {
  const p = GUNLER[Math.min(no, GUNLER.length - 1)];
  const S = { rs: ((tohum == null ? p.tohum : tohum) * 7919 + no * 131) >>> 0 || 1, no, p, t: 0, can: 3, para: 0, sayac: 1, bitti: false, kazandi: false, olaylar: [],
    musteriler: [], esyalar: [], kapi: [], masa: [], lavabo: null,
    makineler: [], kurutucular: [], yukNo: 1, istatistik: { memnun: 0, kizgin: 0, bozuk: 0, bozukNeden: {} } };
  for (let i = 0; i < p.makine; i++) S.makineler.push({ id: i, esyalar: [], durum: 'bos', kalan: 0, sicak: true, ariza: 0 });
  for (let i = 0; i < p.kurutucu; i++) S.kurutucular.push({ id: i, esyalar: [], durum: 'bos', kalan: 0 });
  const gruplar = GRUPLAR.slice(0, p.gruplar);
  let zaman = 2;
  for (let m = 0; m < p.musteri; m++) {
    const ekspres = rnd(S) < p.ekspres;
    const M = { id: S.sayac++, gelis: zaman, sabirMax: ekspres ? Math.round(aral(S, p.sabir) * 0.6) : aral(S, p.sabir), sabir: 0, ekspres, esyalar: [], durum: 'yolda', teslim: 0, bozuk: 0 };
    M.sabir = M.sabirMax;
    const n = aral(S, p.esya);
    // sepet 1-2 renk grubundan (gercekci: bir kisinin sepeti karisik)
    // sepet cogunlukla karisik: ikinci grup her zaman farkli (ilk musteri hep karisik: ogretici)
    const g1 = secR(S, gruplar), sepetGrup = [g1];
    if (gruplar.length > 1 && (m === 0 || rnd(S) < 0.75)) sepetGrup.push(secR(S, gruplar.filter(g => g !== g1)));
    for (let k = 0; k < n; k++) {
      const grup = k < sepetGrup.length ? sepetGrup[k] : secR(S, sepetGrup);   // her gruptan en az bir esya
      const cift = rnd(S) < p.cift && k < n - 1;
      const temel = { sahip: M.id, grup, renk: secR(S, RENK_KOD[grup]), hassas: !cift && rnd(S) < p.hassas, leke: !cift && rnd(S) < p.leke, bozuk: null, yer: 'sepet', yukNo: 0 };
      if (cift) {
        const cid = S.sayac++;
        for (let c = 0; c < 2; c++) { const E = { id: S.sayac++, ...temel, cesit: 'corap', cift: cid }; S.esyalar.push(E); M.esyalar.push(E.id); }
        k++;
      } else { const E = { id: S.sayac++, ...temel, cesit: temel.hassas ? 'kazak' : secR(S, CESITLER), cift: 0 }; S.esyalar.push(E); M.esyalar.push(E.id); }   // hassas = yun kazak (tanınır olsun)
    }
    S.musteriler.push(M);
    zaman += aral(S, p.aralik);
  }
  S.arizaZamanlari = p.ariza ? S.makineler.map(() => rnd(S) < p.ariza ? 15 + rnd(S) * 40 : Infinity) : S.makineler.map(() => Infinity);
  return S;
}
const esya = (S, id) => S.esyalar.find(e => e.id === id);
const musteri = (S, id) => S.musteriler.find(m => m.id === id);
const olay = (S, o) => S.olaylar.push({ t: S.t, ...o });

// ---- oyuncu eylemleri (hepsi gecersizse false doner) ----
function koy(S, esyaId, makineId) {   // masadaki esyayi durmus bir makineye koy
  const E = esya(S, esyaId), M = S.makineler[makineId];
  if (!E || E.yer !== 'masa' || !M || M.durum !== 'bos' || M.ariza > 0 || M.esyalar.length >= AYAR.makineKap) return false;
  S.masa.splice(S.masa.indexOf(E.id), 1); M.esyalar.push(E.id); E.yer = 'makine'; olay(S, { tur: 'koydu', esya: E.id, makine: makineId });
  return true;
}
function geriAl(S, esyaId) {   // henuz baslamamis makineden masaya geri al (yer varsa)
  const E = esya(S, esyaId); if (!E || E.yer !== 'makine') return false;
  const M = S.makineler.find(m => m.esyalar.includes(E.id)); if (!M || M.durum !== 'bos' || S.masa.length >= S.p.masa) return false;
  M.esyalar.splice(M.esyalar.indexOf(E.id), 1); S.masa.push(E.id); E.yer = 'masa'; return true;
}
function lavaboyaKoy(S, esyaId) {
  const E = esya(S, esyaId); if (!E || E.yer !== 'masa' || S.lavabo) return false;
  S.masa.splice(S.masa.indexOf(E.id), 1); S.lavabo = { esya: E.id, kalan: AYAR.onYikama }; E.yer = 'lavabo'; olay(S, { tur: 'lavabo', esya: E.id }); return true;
}
function sicaklik(S, makineId) { const M = S.makineler[makineId]; if (!M || M.durum !== 'bos') return false; M.sicak = !M.sicak; return true; }
function tamir(S, makineId) { const M = S.makineler[makineId]; if (!M || M.ariza <= 0) return false; M.ariza--; if (!M.ariza) olay(S, { tur: 'tamir', makine: makineId }); return true; }
function baslat(S, makineId) {
  const M = S.makineler[makineId]; if (!M || M.durum !== 'bos' || !M.esyalar.length || M.ariza > 0) return false;
  const yuk = M.esyalar.map(id => esya(S, id)), yukNo = S.yukNo++;
  const enKoyu = Math.max(...yuk.map(e => GRUPLAR.indexOf(e.grup)));
  for (const e of yuk) {
    e.yukNo = yukNo;
    if (GRUPLAR.indexOf(e.grup) < enKoyu && !e.bozuk) { e.bozuk = 'boyandi'; e.boya = yuk.find(x => GRUPLAR.indexOf(x.grup) === enKoyu).renk; }
    if (e.hassas && M.sicak && !e.bozuk) e.bozuk = 'kuculdu';
    if (e.leke && !e.bozuk) e.bozuk = 'lekeli';
  }
  M.durum = 'calisiyor'; M.kalan = M.sicak ? AYAR.yikamaSicak : AYAR.yikamaSoguk; M.sure = M.kalan;
  olay(S, { tur: 'basladi', makine: makineId, bozuk: yuk.filter(e => e.bozuk).map(e => e.id) });
  return true;
}
function aktar(S, makineId) {   // biten yikamayi yer olan bos kurutucuya aktar (kurutucu hemen calisir)
  const M = S.makineler[makineId]; if (!M || M.durum !== 'bitti') return false;
  const K = S.kurutucular.find(k => k.durum === 'bos' && k.esyalar.length + M.esyalar.length <= AYAR.kurutucuKap); if (!K) return false;
  for (const id of M.esyalar) { K.esyalar.push(id); esya(S, id).yer = 'kurutucu'; }
  M.esyalar = []; M.durum = 'bos';
  K.durum = 'calisiyor'; K.kalan = AYAR.kurutma; K.sure = K.kalan;
  olay(S, { tur: 'aktardi', makine: makineId, kurutucu: K.id });
  return true;
}

// ---- zaman ----
function musteriBitir(S, M, kizgin) {
  M.durum = kizgin ? 'kizgin' : 'memnun';
  if (kizgin) { S.can--; S.istatistik.kizgin++; }
  else { const cay = Math.round(AYAR.ucret * M.esyalar.length * AYAR.cayOran * (M.sabir / M.sabirMax) * (M.ekspres ? 2 : 1)); M.odeme = AYAR.ucret * M.esyalar.length + cay; S.para += M.odeme; S.istatistik.memnun++; }
  olay(S, { tur: kizgin ? 'kizdi' : 'odedi', musteri: M.id, odeme: M.odeme || 0, sebep: M.sebep });
  if (S.can <= 0) { S.bitti = true; S.kazandi = false; olay(S, { tur: 'bitti', kazandi: false }); }
}
function teslimEt(S, E) {
  E.yer = 'teslim';
  const M = musteri(S, E.sahip); if (M.durum !== 'bekliyor') return;
  M.teslim++;
  if (M.teslim < M.esyalar.length) return;
  // cift kontrolu: ayni ciftin corapları farkli yuklerde yikandiysa teki kaybolur
  const es = M.esyalar.map(id => esya(S, id));
  for (const e of es) if (e.cift && !e.bozuk) { const es2 = es.find(x => x.cift === e.cift && x.id !== e.id); if (es2 && es2.yukNo !== e.yukNo) { e.bozuk = 'tekCorap'; es2.bozuk = es2.bozuk || 'tekCorap'; } }
  const bozuk = es.filter(e => e.bozuk);
  if (bozuk.length) { S.istatistik.bozuk++; for (const b of bozuk) S.istatistik.bozukNeden[b.bozuk] = (S.istatistik.bozukNeden[b.bozuk] || 0) + 1; M.sebep = bozuk[0].bozuk; musteriBitir(S, M, true); }
  else musteriBitir(S, M, false);
}
function adimla(S, dt) {
  if (S.bitti) return;
  S.t += dt;
  // gelisler: kapiya
  for (const M of S.musteriler) if (M.durum === 'yolda' && S.t >= M.gelis) { M.durum = 'kapida'; S.kapi.push(M.id); olay(S, { tur: 'geldi', musteri: M.id }); }
  // kapidan masaya: masada tum sepete yer varsa bosalt
  while (S.kapi.length) {
    const M = musteri(S, S.kapi[0]);
    if (S.masa.length + M.esyalar.length > S.p.masa) break;
    S.kapi.shift(); M.durum = 'bekliyor';
    for (const id of M.esyalar) { S.masa.push(id); esya(S, id).yer = 'masa'; }
    olay(S, { tur: 'bosaltti', musteri: M.id });
  }
  // sabir
  for (const M of S.musteriler) if (M.durum === 'kapida' || M.durum === 'bekliyor') {
    M.sabir -= dt;
    if (M.sabir <= 0) {
      M.sebep = 'sabir';
      // esyalari sistemden cikar
      for (const id of M.esyalar) { const E = esya(S, id); if (E.yer === 'masa') S.masa.splice(S.masa.indexOf(id), 1); E.yer = 'gitti'; }
      S.kapi = S.kapi.filter(x => x !== M.id);
      musteriBitir(S, M, true); if (S.bitti) return;
    }
  }
  // makineler
  S.makineler.forEach((M, i) => {
    if (M.durum === 'bos' && !M.esyalar.length && M.ariza === 0 && S.t >= S.arizaZamanlari[i]) { M.ariza = AYAR.arizaTik; S.arizaZamanlari[i] = Infinity; olay(S, { tur: 'ariza', makine: i }); }
    if (M.durum === 'calisiyor') { M.kalan -= dt; if (M.kalan <= 0) { M.durum = 'bitti'; M.kalan = 0; olay(S, { tur: 'yikandi', makine: i }); } }
  });
  if (S.lavabo) { S.lavabo.kalan -= dt; if (S.lavabo.kalan <= 0) { const E = esya(S, S.lavabo.esya); E.leke = false; E.yer = 'masa'; S.masa.push(E.id); S.lavabo = null; olay(S, { tur: 'temizlendi', esya: E.id }); } }
  for (const K of S.kurutucular) if (K.durum === 'calisiyor') {
    K.kalan -= dt;
    if (K.kalan <= 0) { K.durum = 'bos'; const ids = K.esyalar; K.esyalar = []; olay(S, { tur: 'kurudu', kurutucu: K.id, esyalar: ids }); for (const id of ids) { teslimEt(S, esya(S, id)); if (S.bitti) return; } }
  }
  // gun sonu
  if (S.musteriler.every(M => M.durum === 'memnun' || M.durum === 'kizgin')) { S.bitti = true; S.kazandi = S.can > 0; olay(S, { tur: 'bitti', kazandi: S.kazandi }); }
}
/* <<<MANTIK SONU>>> */
</script>
<script>
/* ---------------- SES ---------------- */
const SES = (() => {
  let ac = null, ana;
  const baslat = () => { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ac = new AC(); ana = ac.createGain(); ana.gain.value = 0.8; ana.connect(ac.destination); };
  function ton(t, sure, f0, f1, g, tip) { const o = ac.createOscillator(), k = ac.createGain(); o.type = tip || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + sure);
    k.gain.setValueAtTime(0.0001, t); k.gain.exponentialRampToValueAtTime(g, t + 0.008); k.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(k); k.connect(ana); o.start(t); o.stop(t + sure + 0.05); }
  function gurultu(t, sure, g, frek, q) { const n = Math.floor(ac.sampleRate * sure), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), k = ac.createGain(); s.buffer = buf; f.type = 'bandpass'; f.frequency.value = frek; f.Q.value = q || 1; k.gain.value = g;
    s.connect(f); f.connect(k); k.connect(ana); s.start(t); }
  const T = () => ac.currentTime, a = f => (...x) => { if (ac) f(T(), ...x); };
  return { baslat,
    al: a(t => ton(t, 0.06, 500, 760, 0.07, 'triangle')),
    koy: a(t => { gurultu(t, 0.12, 0.35, 700, 2); ton(t, 0.1, 260, 160, 0.12, 'sine'); }),

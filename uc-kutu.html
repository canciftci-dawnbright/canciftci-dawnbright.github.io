<title>Üç Kutu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --void:#0E0A07; --wood:#241910; --panel:#1C1409;
  --line:#3B2A18; --brass:#C08A3E; --brass-lit:#F0C878; --brass-dim:#7A5723;
  --ink:#F2E7D3; --ink-soft:#AE9670; --ink-dim:#7B6748;
  --c0:#D9483B; --c0l:#F79285;
  --c1:#E0A33A; --c1l:#F8D591;
  --c2:#3E8FD0; --c2l:#96CFF2;
  --ok:#6FBF4A; --bad:#DC5340;
  --shadow:0 24px 64px rgba(0,0,0,.66);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--void);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(680px 400px at 50% 0%, rgba(192,138,62,.13), transparent 72%);
}
#app{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:10px 8px 22px}
.cab{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:10px 11px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 2px 9px;border-bottom:1px solid var(--line)}
.mv,.left{font-family:Bitter,Georgia,serif;font-weight:800;font-size:21px;
  font-variant-numeric:tabular-nums;line-height:1}
.left{text-align:right}
.mv small,.left small{display:block;font-family:inherit;font-size:8.5px;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:3px}
.mv.low b{color:var(--bad)}
.mv.bump{animation:mvBump .3s ease-out}
@keyframes mvBump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
/* Kutu göstergesi: renk yuvarlagi + doluluk. Kapasite 5'e cikinca 15 nokta
   HUD'a sigmiyordu, sayaca cevrildi. */
.socks{display:flex;gap:8px;align-items:center}
.socks span{display:flex;align-items:center;gap:4px;font-family:Bitter,Georgia,serif;
  font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.socks span u{display:block;width:11px;height:11px;border-radius:50%;text-decoration:none;
  border:2px solid var(--bc);background:transparent}
.socks span.full{color:var(--ink)}
.socks span.full u{background:var(--bc);box-shadow:0 0 9px var(--bc)}

/* ---------- masa ---------- */
.table{position:relative;margin-top:9px;border-radius:11px;overflow:hidden;
  border:1px solid var(--line);background:#0A0704}
#cv{display:block;margin:0 auto}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
/* Bolum yeni bir mekanik tanitiyorsa kisa bir seride yazar. */
.note{position:absolute;left:8px;right:8px;top:9px;z-index:6;pointer-events:none;
  text-align:center;font-family:Bitter,Georgia,serif;font-weight:700;font-size:12px;
  color:#2A1B04;background:var(--brass);border-radius:8px;padding:7px 9px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px)}
.note.on{animation:noteIn 3.4s ease-out forwards}
@keyframes noteIn{
  0%{opacity:0;transform:translateY(-10px)}
  9%{opacity:1;transform:translateY(0)}
  78%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-8px)}}
.pop{position:absolute;font-family:Bitter,Georgia,serif;font-size:14px;font-weight:800;
  text-shadow:0 2px 8px #000;animation:popUp .85s ease-out forwards;white-space:nowrap}
.pop.ok{color:#B6F09A} .pop.bad{color:var(--bad)} .pop.gold{color:var(--brass-lit)}
@keyframes popUp{0%{transform:translate(-50%,8px) scale(.6);opacity:0}
  22%{transform:translate(-50%,-4px) scale(1.14);opacity:1}
  100%{transform:translate(-50%,-32px) scale(1);opacity:0}}
.veil{position:absolute;inset:0;opacity:0}
.veil.ok{background:radial-gradient(120% 60% at 50% 6%, rgba(111,191,74,.42), transparent 66%);
  animation:vl .55s ease-out}
.veil.bad{background:radial-gradient(120% 60% at 50% 6%, rgba(220,83,64,.42), transparent 66%);
  animation:vl .5s ease-out}
@keyframes vl{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.table.shake{animation:shk .3s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}
  60%{transform:translate(4px,-1px)}85%{transform:translate(-2px,1px)}}

/* ---------- kollar ---------- */
.flips{display:flex;gap:9px;margin-top:10px}
.flip{flex:1;height:64px;border-radius:11px;border:1px solid var(--line);background:var(--wood);
  position:relative;cursor:pointer;touch-action:none;overflow:hidden;
  transition:background .07s,border-color .07s}
.flip::after{content:"";position:absolute;top:50%;width:54px;height:11px;border-radius:6px;
  margin-top:-5px;background:linear-gradient(180deg,var(--brass-lit),var(--brass) 55%,var(--brass-dim));
  box-shadow:0 2px 0 rgba(0,0,0,.45);transition:transform .07s ease}
.flip.l::after{left:16px;transform-origin:6px 50%;transform:rotate(19deg)}
.flip.r::after{right:16px;transform-origin:calc(100% - 6px) 50%;transform:rotate(-19deg)}
.flip.on{background:#3A2913;border-color:var(--brass)}
.flip.l.on::after{transform:rotate(-24deg)}
.flip.r.on::after{transform:rotate(24deg)}
.flip .k{position:absolute;bottom:5px;width:100%;text-align:center;font-size:8.5px;
  font-weight:700;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}

.bar{display:flex;gap:7px;margin-top:9px}
button{flex:1;appearance:none;border:1px solid var(--line);background:var(--wood);color:var(--ink);
  font:inherit;font-size:11.5px;font-weight:700;padding:10px 6px;border-radius:9px;cursor:pointer}
button:hover:not(:disabled){background:#31220F;border-color:var(--brass-dim)}
button.go{background:var(--brass);color:#2A1B04;border-color:var(--brass)}
button.mini{flex:0 0 40px;padding:10px 0;font-size:13px}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- overlay ---------- */
.ov{position:absolute;inset:0;background:rgba(14,10,7,.95);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px 22px;z-index:20;
  backdrop-filter:blur(3px)}
.ov h2{font-family:Bitter,Georgia,serif;font-weight:800;margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
.ov .big{font-size:40px;line-height:1;margin-bottom:4px}
.ov .sub{color:var(--ink-soft);font-size:12.5px;line-height:1.6;margin:0 0 15px;max-width:266px}
.ov .num{font-family:Bitter,Georgia,serif;font-size:38px;font-weight:800;color:var(--brass-lit);
  font-variant-numeric:tabular-nums;line-height:1.05}
.ov .bar{width:100%;max-width:266px}
.ov .why{font-size:12.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 15px;max-width:262px;
  padding:9px 12px;border-radius:9px;background:rgba(220,83,64,.13);border:1px solid rgba(220,83,64,.42)}
.ov .why b{color:var(--bad)}
.ov.scroll{justify-content:flex-start;overflow-y:auto}
.legend{display:flex;flex-direction:column;gap:8px;width:100%;max-width:284px;margin:2px 0 14px}
.lrow{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;
  background:var(--wood);border:1px solid var(--line)}
.lrow p{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink-soft);text-align:left}
.lrow p b{color:var(--ink)}
.lart{flex:0 0 48px;height:40px;position:relative;display:flex;align-items:center;justify-content:center}
.lbat{width:34px;height:9px;border-radius:5px;background:linear-gradient(180deg,var(--brass-lit),var(--brass));
  transform:rotate(-20deg)}
.lbox{width:32px;height:26px;border:2.5px solid var(--brass-dim);border-bottom:0;border-radius:5px 5px 0 0;
  display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:2px;position:relative}
.lbox::after{content:"";position:absolute;left:2px;right:2px;bottom:-2px;height:3px;border-radius:2px;
  background:var(--mem)}
.lbox u{display:block;width:9px;height:9px;border-radius:50%;text-decoration:none;background:var(--mem)}
.lmar{width:15px;height:15px;border-radius:50%;box-shadow:0 1px 3px #000}
.lart .arw{position:absolute;right:-2px;bottom:2px;font-size:15px;font-weight:800;color:var(--bad)}

.foot{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  font-size:9px;letter-spacing:.07em;color:var(--ink-dim);display:flex;justify-content:space-between}
@media (max-width:420px){
  #app{padding:6px 4px 16px}
  .cab{padding:8px 8px 10px;border-radius:13px}
  .flip{height:68px}
}
@media (prefers-reduced-motion:reduce){.pop,.veil,.table{animation:none!important}}
.boot{position:fixed;left:10px;right:10px;top:10px;z-index:9999;padding:12px 14px;border-radius:10px;
  background:#3B1512;color:#FFD9D2;border:1px solid #A8422F;font-size:13px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.boot b{color:#fff}
</style>

<div class="boot" id="boot">
  <b>Oyun başlatılamadı — JavaScript çalışmıyor.</b><br>
  Dosyayı dosya yöneticisi yerine <b>Chrome / Safari</b> ile aç.
</div>
<script>
window.addEventListener("error", function(e){
  var b = document.getElementById("boot"); if(!b) return;
  b.innerHTML = "<b>Oyun hata verdi</b><br>" + (e.message||"?") + "<br><small>satır " + (e.lineno||"?") + "</small>";
});
</script>

<div id="app"><div class="cab" id="cab">
  <div class="hud">
    <span class="mv"><small><span id="hLvl">Bölüm 1</span> · Hamle</small><b id="hMoves">0</b></span>
    <span class="socks" id="hBoxes"></span>
    <span class="left"><small>Masada</small><b id="hLeft">6</b></span>
  </div>

  <div class="table" id="table">
    <canvas id="cv"></canvas>
    <div class="note" id="note"></div>
    <div class="fx" id="fx"></div>
    <div class="veil" id="veil"></div>
  </div>

  <div class="flips">
    <div class="flip l" id="fL"><span class="k">Sol kol</span></div>
    <div class="flip r" id="fR"><span class="k">Sağ kol</span></div>
  </div>

  <div class="bar">
    <button id="bNew" class="go">▶ Yeni oyun</button>
    <button id="bHelp" class="mini" title="Kurallar">?</button>
  </div>

  <div class="foot"><span>DAWNBRIGHT · PROTOTİP</span><span id="fInfo">—</span></div>
</div></div>

<script>
(function(){
"use strict";

/* ═══════════════════ FİZİK — SAF, DOM YOK ═══════════════════
   Node testleri tam olarak bu bloğu kesip çalıştırır.

   Üç şey bu oyunu ayakta tutuyor:
   1) KOL HAREKETLİ YÜZEY. Çarpışma, topun kolun TEMAS NOKTASINDAKİ hızına
      GÖRELİ hızıyla çözülür — fırlatma ve "uçtan vurmak daha güçlü" buradan.
   2) TÜNELLEME YOK. Alt adım sayısı o karedeki hıza göre seçilir; hiçbir
      adımda top yarıçapının yarısından fazla yol almaz.
   3) RENK ZARI. Kutunun ağzındaki zar, rengi tutan mermer için YOK; tutmayan
      için KATI DUVAR. "Yanlış renk geri düşsün" ayrı bir kural değil, fizik. */
/* <<<FIZIK>>> */
var TW = 320, TH = 500, BR = 8;
/* Kucultucu yuzunden yaricap artik TOP BASINA (b.r). BR yalnizca baslangic
   degeri; yari boyut BR*0.5 = 4 px. */
var R_MIN = BR*0.5, PUSH_V = 560;
var GRAV = 860, VMAX = 1200, EBALL = 0.34;
var SUB_MAX = 16, SUB_STEP = 5;
var TUBE_IN = 488, TUBE_SPD = 470;   /* ağzın y eşiği, boruda ilerleme hızı */
var DAMP = 0.9986;

function seg(a){
  var dx = a[2]-a[0], dy = a[3]-a[1];
  return { x1:a[0], y1:a[1], x2:a[2], y2:a[3], dx:dx, dy:dy,
           L2:(dx*dx + dy*dy) || 1e-9, r:a[4], e:a[5], kick:a[6] || 0 };
}
function circ(a){ return { x:a[0], y:a[1], r:a[2], e:a[3], kick:a[4] || 0, hit:0 }; }

function makeTable(L){
  var t = { L:L, segs:[], bumps:[], posts:[], boxes:[], flips:[], balls:[],
            moves:L.moves, used:0, frames:0, clamps:0, done:false }, i;
  for(i=0;i<L.segs.length;i++)  t.segs.push(seg(L.segs[i]));
  for(i=0;i<L.bumps.length;i++) t.bumps.push(circ(L.bumps[i]));
  for(i=0;i<L.posts.length;i++) t.posts.push(circ(L.posts[i]));
  /* KUCULTUCU: [x, y, yaricap] — carpan mermer yariya iner (bir kez). */
  t.shrinks = [];
  if(L.shrinks) for(i=0;i<L.shrinks.length;i++)
    t.shrinks.push({ x:L.shrinks[i][0], y:L.shrinks[i][1], r:L.shrinks[i][2], hit:0 });
  /* ITICI: [x, y, yukseklik, yon] — duvardaki ped, degen mermeri yana firlatir. */
  t.pushes = [];
  if(L.pushes) for(i=0;i<L.pushes.length;i++){
    var pu = L.pushes[i];
    t.pushes.push({ seg:seg([pu[0], pu[1], pu[0], pu[1]+pu[2], 5, 0.3, 0]),
                    x:pu[0], y:pu[1], h:pu[2], dir:pu[3], hit:0 });
  }
  /* Kutular bolume ait: [yuva, renk, adet]. Ilk bolumlerde masada tek kutu
     olabilir — ogretmek icin once bir hedef, sonra iki, sonra uc. */
  for(i=0;i<L.boxes.length;i++){
    var lb = L.boxes[i], sl = L.slots[lb[0]];   /* yuva: [cx, top, w, h] */
    var hw = sl[2]/2, x0 = sl[0]-hw, x1 = sl[0]+hw, y0 = sl[1], y1 = sl[1]+sl[3];
    t.boxes.push({
      cx:sl[0], top:y0, bot:y1, w:sl[2], h:sl[3], c:lb[1],
      cap:lb[2], stack:0, lit:0, rej:0,
      walls:[ seg([x0,y0, x0,y1, 4, 0.35, 0]),
              seg([x1,y0, x1,y1, 4, 0.35, 0]),
              seg([x0,y0, x1,y0, 4, 0.35, 0]) ],
      mem: seg([x0+4, y1, x1-4, y1, 3, 0.45, 0])
    });
  }
  for(i=0;i<L.flips.length;i++){
    var f = L.flips[i];
    t.flips.push({ px:f[0], py:f[1], len:f[2], rad:f[3], rest:f[4], up:f[5],
                   a:f[4], w:0, held:false });
  }
  buildTubes(t);          /* masa kendi basina eksiksiz olsun */
  return t;
}
function allFull(t){
  for(var i=0;i<t.boxes.length;i++) if(t.boxes[i].stack < t.boxes[i].cap) return false;
  return true;
}
/* ── TÜNELLER ──
   Dibe inen mermer kaybolmuyor, yutuluyor: boruda ilerleyip yan duvarın
   yukarısındaki ağızdan sahaya geri fırlıyor. Yay bunu yapıyordu ama topu
   sadece 130 px kaldırıyordu; tünel onu doğrudan üst alana taşıyor.        */
function buildTubes(t){
  t.tubes = [];
  for(var i=0;i<t.L.tubes.length;i++){
    var pth = t.L.tubes[i].path, cum = [0], k;
    for(k=1;k<pth.length;k++)
      cum.push(cum[k-1] + Math.sqrt(Math.pow(pth[k][0]-pth[k-1][0],2) +
                                    Math.pow(pth[k][1]-pth[k-1][1],2)));
    t.tubes.push({ path:pth, cum:cum, len:cum[cum.length-1] || 1,
                   out:t.L.tubes[i].out });
  }
}
function tubePos(tb, s){
  var d = s * tb.len, i;
  for(i=1;i<tb.path.length;i++){
    if(d <= tb.cum[i] || i === tb.path.length-1){
      var a = tb.path[i-1], b = tb.path[i];
      var seg = tb.cum[i] - tb.cum[i-1];
      var u = seg > 0 ? (d - tb.cum[i-1]) / seg : 0;
      if(u < 0) u = 0; if(u > 1) u = 1;
      return [a[0] + (b[0]-a[0])*u, a[1] + (b[1]-a[1])*u];
    }
  }
  return tb.path[tb.path.length-1];
}
/* Her renkten counts[c] tane; sayılar eşit olmak zorunda değil. */
function spawnBalls(t, rnd){
  var cols = [], i, k;
  for(i=0;i<t.boxes.length;i++)
    for(k=0;k<t.boxes[i].cap;k++) cols.push(t.boxes[i].c);
  for(i=cols.length-1;i>0;i--){ var j = Math.floor(rnd()*(i+1)); var m=cols[i]; cols[i]=cols[j]; cols[j]=m; }
  t.balls = [];
  for(i=0;i<cols.length && i<t.L.spawn.length;i++)
    t.balls.push({ x:t.L.spawn[i][0], y:t.L.spawn[i][1],
                   vx:(rnd()-0.5)*40, vy:0, c:cols[i], r:BR,
                   alive:true, tube:-1, ts:0, trail:[] });
}
function ballsLeft(t){
  var n = 0;
  for(var i=0;i<t.balls.length;i++) if(t.balls[i].alive) n++;
  return n;
}
function stepFlip(f, dt){
  var target = f.held ? f.up : f.rest;
  var d = target - f.a;
  if(d === 0){ f.w = 0; return; }
  var maxStep = (f.held ? 18 : 12) * dt;
  if(Math.abs(d) <= maxStep){ f.w = d/dt; f.a = target; }
  else { var s = d > 0 ? maxStep : -maxStep; f.w = s/dt; f.a += s; }
}
function closestOnSeg(px, py, s){
  var u = ((px - s.x1)*s.dx + (py - s.y1)*s.dy) / s.L2;
  u = u < 0 ? 0 : (u > 1 ? 1 : u);
  return { x:s.x1 + s.dx*u, y:s.y1 + s.dy*u };
}
function hitCapsule(b, qx, qy, capR, e, kick, cvx, cvy){
  var dx = b.x - qx, dy = b.y - qy;
  var d2 = dx*dx + dy*dy, rr = b.r + capR;
  if(d2 >= rr*rr) return 0;
  var d = Math.sqrt(d2), nx, ny;
  if(d > 1e-6){ nx = dx/d; ny = dy/d; } else { nx = 0; ny = -1; d = 0; }
  b.x += nx*(rr - d); b.y += ny*(rr - d);
  var rvx = b.vx - (cvx || 0), rvy = b.vy - (cvy || 0);
  var vn = rvx*nx + rvy*ny;
  if(vn < 0){ var j = -(1 + e)*vn; b.vx += j*nx; b.vy += j*ny; }
  if(kick){
    /* Sekme itisi. Onceden teget bilesenin YARISI korunuyordu: asagi inen
       mermerin tegeti sekme boyunca asagi-saga baktigi icin itis yatayda
       birikiyor ve mermer (190,-94) ile firlayip butun alt sahayi gecerek
       ortadaki tunel agzina dusuyordu. Teget artik 0.2, ve gelen hiz itisi
       katlayamasin diye tavan var: sekme geri iter, savurmaz. */
    var sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    var out = sp*0.72;
    if(out < kick) out = kick;
    if(out > kick*1.7) out = kick*1.7;
    var pn = b.vx*nx + b.vy*ny;
    var tvx = b.vx - pn*nx, tvy = b.vy - pn*ny;
    b.vx = nx*out + tvx*0.2;
    b.vy = ny*out + tvy*0.2;
    return 2;
  }
  return 1;
}
function clampSpeed(b){
  var sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
  if(sp > VMAX){ b.vx = b.vx/sp*VMAX; b.vy = b.vy/sp*VMAX; }
}
/* Tek topluyken gerekmiyordu; altı mermer birbirini itmezse üst üste binip
   tek bir topmuş gibi davranıyorlar ve istif okunmuyor. */
function ballPairs(t){
  var i, j, b, o;
  for(i=0;i<t.balls.length;i++){
    b = t.balls[i]; if(!b.alive || b.tube >= 0) continue;
    for(j=i+1;j<t.balls.length;j++){
      o = t.balls[j]; if(!o.alive || o.tube >= 0) continue;
      var dx = o.x - b.x, dy = o.y - b.y, d2 = dx*dx + dy*dy;
      var sr = b.r + o.r;
      if(d2 >= sr*sr || d2 < 1e-9) continue;
      var d = Math.sqrt(d2), nx = dx/d, ny = dy/d, pen = (sr - d)*0.5;
      b.x -= nx*pen; b.y -= ny*pen;
      o.x += nx*pen; o.y += ny*pen;
      var rvn = (o.vx - b.vx)*nx + (o.vy - b.vy)*ny;
      if(rvn < 0){
        var im = -(1 + EBALL)*rvn*0.5;
        b.vx -= im*nx; b.vy -= im*ny;
        o.vx += im*nx; o.vy += im*ny;
      }
    }
  }
}
function substepBall(t, b, sdt, ev){
  var i, k, q, res;
  /* Yaricap tanimsizsa butun carpisma testleri NaN olur ve mermer her seyin
     icinden gecer — sessiz ve yikici bir hata. Bir satirlik guvence. */
  if(!b.r) b.r = BR;
  b.vy += GRAV*sdt;
  b.vx *= DAMP; b.vy *= DAMP;
  clampSpeed(b);
  b.x += b.vx*sdt; b.y += b.vy*sdt;

  for(i=0;i<t.segs.length;i++){
    var s = t.segs[i];
    q = closestOnSeg(b.x, b.y, s);
    res = hitCapsule(b, q.x, q.y, s.r, s.e, s.kick, 0, 0);
    if(res === 2) ev.push(["sling", q.x, q.y]);
  }
  for(i=0;i<t.bumps.length;i++){
    var c = t.bumps[i];
    if(hitCapsule(b, c.x, c.y, c.r, c.e, c.kick, 0, 0)) ev.push(["bump", c.x, c.y, i]);
  }
  for(i=0;i<t.posts.length;i++){
    var p = t.posts[i];
    hitCapsule(b, p.x, p.y, p.r, p.e, 0, 0, 0);
  }
  /* --- KUCULTUCU --- once yuzeyden sektirir, sonra yaricabi yariya iner.
     Tek kademe: R_MIN'in altina inmez, yoksa mermer kapali sanilan
     centiklerden gecebilecek kadar kucuk olurdu. */
  for(i=0;i<t.shrinks.length;i++){
    var sh = t.shrinks[i];
    if(hitCapsule(b, sh.x, sh.y, sh.r, 0.55, 0, 0, 0)){
      sh.hit = 1;
      if(b.r > R_MIN){
        b.r = b.r*0.5;
        if(b.r < R_MIN) b.r = R_MIN;
        b.trail.length = 0;
        ev.push(["shrink", b.x, b.y]);
      }
    }
  }
  /* --- ITICI --- duvardaki ped: degen mermer yatayda hizla karsiya firlar. */
  for(i=0;i<t.pushes.length;i++){
    var pz = t.pushes[i];
    q = closestOnSeg(b.x, b.y, pz.seg);
    if(hitCapsule(b, q.x, q.y, pz.seg.r, 0.2, 0, 0, 0)){
      pz.hit = 1;
      b.vx = pz.dir * PUSH_V;
      b.vy = b.vy*0.35 - 60;          /* biraz da yukari, drenaja surmesin */
      ev.push(["push", b.x, b.y, pz.dir]);
    }
  }
  /* --- kutular ---
     Kutunun DORT KENARI da renk zari: dogru renk mermer kutuya nereden
     degerse degsin yakalanir — altindan, yanindan, ustunden. Onceden yalniz
     alttaki zar yakaliyordu, kenara ya da kose kapagina surten mermer
     sortlanmak yerine sekip gidiyordu. Yanlis renk ise her kenardan seker. */
  for(i=0;i<t.boxes.length;i++){
    var bx = t.boxes[i];
    if(b.c === bx.c && bx.stack < bx.cap){
      if(b.x > bx.cx - bx.w/2 - b.r && b.x < bx.cx + bx.w/2 + b.r &&
         b.y > bx.top - b.r && b.y < bx.bot + b.r){
        b.alive = false;
        bx.stack++; bx.lit = 1;
        ev.push(["stack", bx.cx, bx.bot, i]);
        return;
      }
      continue;                      /* dogru renk: kutu onun icin gecirgen */
    }
    /* rengi tutmuyor ya da kutu dolu: butun kenarlar KATI */
    for(k=0;k<bx.walls.length;k++){
      q = closestOnSeg(b.x, b.y, bx.walls[k]);
      hitCapsule(b, q.x, q.y, bx.walls[k].r, bx.walls[k].e, 0, 0, 0);
    }
    q = closestOnSeg(b.x, b.y, bx.mem);
    var dx2 = b.x - q.x, dy2 = b.y - q.y;
    var rr2 = b.r + bx.mem.r;
    if(dx2*dx2 + dy2*dy2 < rr2*rr2){
      hitCapsule(b, q.x, q.y, bx.mem.r, bx.mem.e, 0, 0, 0);
      bx.rej = 1;
      ev.push(["reject", b.x, b.y, i]);
    }
  }
  for(i=0;i<t.flips.length;i++){
    var f = t.flips[i];
    var tipx = f.px + Math.cos(f.a)*f.len, tipy = f.py + Math.sin(f.a)*f.len;
    var fs = { x1:f.px, y1:f.py, x2:tipx, y2:tipy,
               dx:tipx-f.px, dy:tipy-f.py, L2:f.len*f.len };
    q = closestOnSeg(b.x, b.y, fs);
    var rx = q.x - f.px, ry = q.y - f.py;
    if(hitCapsule(b, q.x, q.y, f.rad, 0.18, 0, -f.w*ry, f.w*rx))
      ev.push(["flip", q.x, q.y, i]);
  }
  clampSpeed(b);

  if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx)*0.4; t.clamps++; }
  if(b.x > TW - b.r){ b.x = TW - b.r; b.vx = -Math.abs(b.vx)*0.4; t.clamps++; }
  if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy)*0.4; t.clamps++; }
  /* Dip KAPALI ve kayıp yok: eğimli zemin her mermeri ortadaki TÜNEL AĞZINA
     indirir. Oraya varan mermer yutulur, borudan geçip yukarıdan çıkar.
     Zemin eğimleri x=150..170 dışında y>488'e inmeyi engellediği için
     bu eşiğe yalnız ağızdan ulaşılır. */
  if(b.y > TUBE_IN){
    b.tube = (b.vx < 0) ? 0 : 1;
    b.ts = 0; b.vx = 0; b.vy = 0; b.trail.length = 0;
    ev.push(["in", b.x, b.y]);
    return;
  }
  if(b.y > TH - b.r){ b.y = TH - b.r; b.vy = -Math.abs(b.vy)*0.5; t.clamps++; }
}
function flipsMoving(t){
  for(var i=0;i<t.flips.length;i++){
    var f = t.flips[i];
    if(f.a !== (f.held ? f.up : f.rest)) return true;
  }
  return false;
}
function stepTable(t, dt){
  var ev = [], i, k, mx = 0;
  t.frames++;
  /* borudaki mermerler yol boyunca ilerler, çarpışmaya girmez */
  for(i=0;i<t.balls.length;i++){
    var tb2 = t.balls[i];
    if(!tb2.alive || tb2.tube < 0) continue;
    var tube = t.tubes[tb2.tube];
    tb2.ts += TUBE_SPD*dt / tube.len;
    if(tb2.ts >= 1){
      var e = tube.path[tube.path.length-1];
      tb2.x = e[0]; tb2.y = e[1];
      tb2.vx = tube.out[0]; tb2.vy = tube.out[1];
      tb2.r = BR;                     /* tunel mermeri eski boyuna dondurur */
      tb2.tube = -1; tb2.ts = 0;
      ev.push(["out", tb2.x, tb2.y]);
    } else {
      var q2 = tubePos(tube, tb2.ts);
      tb2.x = q2[0]; tb2.y = q2[1];
    }
  }
  for(i=0;i<t.balls.length;i++){
    var b = t.balls[i]; if(!b.alive || b.tube >= 0) continue;
    var sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    if(sp > mx) mx = sp;
  }
  if(!ballsLeft(t)){
    for(i=0;i<t.flips.length;i++) stepFlip(t.flips[i], dt);
    return ev;
  }
  var n = Math.ceil((mx*dt) / SUB_STEP);
  /* Kol ~0.06 sn'de dönüyor: kare başına ucu onlarca px sıçrar ve topun
     üstünden atlayabilir. Kol hareketliyken alt adım tabanını yükseltiyoruz. */
  if(flipsMoving(t) && n < 8) n = 8;
  if(n < 1) n = 1;
  if(n > SUB_MAX) n = SUB_MAX;
  var sdt = dt/n;
  for(i=0;i<n;i++){
    for(k=0;k<t.flips.length;k++) stepFlip(t.flips[k], sdt);
    for(k=0;k<t.balls.length;k++)
      if(t.balls[k].alive && t.balls[k].tube < 0) substepBall(t, t.balls[k], sdt, ev);
    ballPairs(t);
  }
  return ev;
}
/* Hamle = kola BASMA. Basılı tutmak ek hamle yakmaz. */
function flipHold(t, side, down){
  var f = t.flips[side];
  if(!f) return false;
  if(down && !f.held){
    if(t.moves <= 0) return false;
    t.moves--; t.used++;
  }
  f.held = !!down;
  return true;
}

var IMG = { zemin:null, mermer:[null,null,null] };
function loadArt(){
  IMG.zemin = new Image(); IMG.zemin.src = ART.zemin;
  for(var i=0;i<3;i++){ IMG.mermer[i] = new Image(); IMG.mermer[i].src = ART.mermer[i]; }
}
/* Gorsel yuklenmediyse eski vektor cizim devrede kalir: oyun asla bos kalmaz. */
function ready(im){ return !!(im && im.complete && im.naturalWidth > 0); }


/* OYUN */
var LS = "dbg.uckutu.v2";
function el(id){ return document.getElementById(id); }

var T = null, cv = null, ctx = null, raf = null, lastTs = 0, scale = 1, tms = 0;
var over = false, graceMs = 0, level = 1;

function best(){ try{ var v = parseInt(localStorage.getItem(LS), 10); return v > 0 ? v : 0; }catch(e){ return 0; } }
function saveBest(n){ try{ if(n > best()) localStorage.setItem(LS, String(n)); }catch(e){} }
function totalBalls(){
  var n = 0;
  for(var i=0;i<T.boxes.length;i++) n += T.boxes[i].cap;
  return n;
}

function newGame(){
  T = makeTable(levelDef(level));
  spawnBalls(T, Math.random);
  over = false; graceMs = 0;
  hideOverlay();
  fitCanvas(); fitCanvas();      /* ilk gecis kabin yuksekligini olcer, ikincisi oturtur */
  renderHud();
  showNote(T.L.note);
}
function showNote(txt){
  var n = el("note");
  if(!n) return;
  if(!txt){ n.className = "note"; n.textContent = ""; return; }
  n.textContent = txt;
  n.className = "note"; void n.offsetWidth; n.className = "note on";
}
/* Masa yalniz genislige gore olceklenirse kisa telefonlarda (375x667) kabin
   749 px oluyor, 104 px tasiyor ve kollar ekranin tam dibine siniyor.
   Bu yuzden YUKSEKLIK de sinir: kabinin kanvas disi yuksekligini olcup
   (HUD + kollar + butonlar + bosluklar) kalan yere sigdiriyoruz. */
function fitCanvas(){
  var box = el("table");
  var availW = box.clientWidth || 340;
  var cabH = el("cab").offsetHeight, cvH = cv.offsetHeight;
  var chrome = (cabH > 0 && cvH > 0) ? (cabH - cvH) : 200;
  var availH = (window.innerHeight || 760) - chrome - 26;
  if(availH < 260) availH = 260;
  scale = Math.min(availW / TW, availH / TH);
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(TW*scale*dpr);
  cv.height = Math.round(TH*scale*dpr);
  cv.style.width  = Math.round(TW*scale) + "px";
  cv.style.height = Math.round(TH*scale) + "px";
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
}

function loop(ts){
  raf = requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  var dt = Math.min(0.04, (ts - lastTs)/1000);
  lastTs = ts; tms = ts;
  if(T && !over){
    var ev = stepTable(T, dt);
    for(var i=0;i<ev.length;i++) onEvent(ev[i]);
    /* Hamle bitti: havadaki mermerler yerine oturana kadar sure taniyoruz. */
    if(T.moves <= 0 && !allFull(T)){
      graceMs += dt*1000;
      if(graceMs > 4200) lose();
    }
  }
  drawTable();
}
function onEvent(e){
  var k = e[0];
  if(k === "stack"){
    popAt(e[1], e[2] + 14, "ok", "yerleşti");
    veil("ok");
    renderHud();
    if(allFull(T)) win();
  } else if(k === "reject"){
    popAt(e[1], e[2] - 14, "bad", "yanlış kutu");
  } else if(k === "out"){
    popAt(e[1], e[2] - 16, "gold", "↑");
  } else if(k === "shrink"){
    popAt(e[1], e[2] - 16, "bad", "yarıya indi");
  } else if(k === "push"){
    popAt(e[1] + e[3]*16, e[2] - 14, "gold", e[3] > 0 ? "»»" : "««");
  }
}
function win(){
  if(over) return;
  over = true;
  saveBest(level);
  setTimeout(showWin, 560);
}
function nextLevel(){
  if(level < LEVELS.length) level++;
  newGame();
}
function lose(){
  if(over) return;
  over = true;
  shake();
  setTimeout(showLose, 400);
}

/* ---------- girdi ---------- */
function setFlip(side, down){
  if(!T || over) return;
  var wasHeld = T.flips[side].held;
  var okMove = flipHold(T, side, down);
  if(down && !wasHeld && !okMove){
    var m = el("hMoves").parentNode;
    m.className = "mv low"; void m.offsetWidth; m.className = "mv low bump";
    return;
  }
  el(side === 0 ? "fL" : "fR").className = "flip " + (side === 0 ? "l" : "r") + (down ? " on" : "");
  if(down && !wasHeld) renderHud();
}
function bindPad(node, side){
  node.addEventListener("pointerdown", function(e){
    e.preventDefault();
    if(node.setPointerCapture) node.setPointerCapture(e.pointerId);
    setFlip(side, true);
  });
  node.addEventListener("pointerup", function(e){ e.preventDefault(); setFlip(side, false); });
  node.addEventListener("pointercancel", function(){ setFlip(side, false); });
  node.addEventListener("pointerleave", function(){ setFlip(side, false); });
}

/* ---------- HUD ---------- */
function renderHud(){
  var mv = el("hMoves"), wrap = mv.parentNode;
  mv.textContent = T.moves;
  wrap.className = "mv" + (T.moves <= 5 ? " low" : "");
  var h = "", i, k;
  for(i=0;i<T.boxes.length;i++){
    var bx = T.boxes[i];
    h += '<span class="' + (bx.stack >= bx.cap ? "full" : "") +
         '" style="--bc:' + PAL[bx.c].hex + '"><u></u>' + bx.stack + "/" + bx.cap + "</span>";
  }
  el("hBoxes").innerHTML = h;
  el("hLvl").textContent = "Bölüm " + level;
  el("hLeft").textContent = ballsLeft(T);
  el("fInfo").textContent = totalBalls() + " mermer · " + T.used + " hamle harcandı" +
    (best() > 1 ? " · en uzak bölüm " + best() : "");
}

/* ---------- cizim ---------- */
function capsule(x1, y1, x2, y2, r, fill, top){
  ctx.lineCap = "round";
  ctx.strokeStyle = fill; ctx.lineWidth = r*2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if(top){
    ctx.strokeStyle = top; ctx.lineWidth = Math.max(1.4, r*0.7);
    ctx.beginPath(); ctx.moveTo(x1, y1 - r*0.42); ctx.lineTo(x2, y2 - r*0.42); ctx.stroke();
  }
}
function marble(x, y, c, r){
  var p = PAL[c], rr = r || BR;
  var sp = IMG.mermer[c];
  if(ready(sp)){ ctx.drawImage(sp, x - rr, y - rr, rr*2, rr*2); return; }
  var g = ctx.createRadialGradient(x - rr*0.35, y - rr*0.4, rr*0.1, x, y, rr + 1);
  g.addColorStop(0, "#FFFFFF"); g.addColorStop(0.28, p.lit);
  g.addColorStop(0.72, p.hex); g.addColorStop(1, p.dk);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.42)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI*2); ctx.stroke();
}
/* Basketbol potasindaki file: dikey ve yatay ipler asagi dogru daralir,
   DIBI KAPALIDIR — biriken mermerler oradan dusmez. */
function drawNet(bx, p, dolu){
  var x0 = bx.cx - bx.w/2 + 5, x1 = bx.cx + bx.w/2 - 5;
  var yt = bx.top + 10, yb = bx.bot - 2;
  var tap = 0.30, i, k;
  ctx.save();
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(255,255,255,.22)";
  ctx.lineWidth = 1;
  for(i=0;i<=7;i++){
    var f = i/7, xa = x0 + (x1-x0)*f;
    var xb = bx.cx + (xa - bx.cx)*(1-tap);
    ctx.beginPath(); ctx.moveTo(xa, yt); ctx.lineTo(xb, yb); ctx.stroke();
  }
  for(k=1;k<=3;k++){
    var g = k/4, yy = yt + (yb-yt)*g;
    var half = (x1-x0)/2 * (1 - tap*g);
    ctx.beginPath(); ctx.moveTo(bx.cx-half, yy); ctx.lineTo(bx.cx+half, yy); ctx.stroke();
  }
  /* KAPALI DIP — ayni zamanda renk zari: dogru renk gecer, yanlis renk seker */
  var hb = (x1-x0)/2*(1-tap);
  ctx.strokeStyle = dolu ? p.hex : p.lit;
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(bx.cx-hb, yb-2);
  ctx.quadraticCurveTo(bx.cx, yb+7, bx.cx+hb, yb-2);
  ctx.stroke();
  ctx.restore();
}
/* Kutu icindeki yuvalar: ucerli siralar, alttan yukari, ortalanmis.
   Kapasite bolume gore 2..5 arasinda degisiyor. */
function stackSlot(bx, i){
  var per = 3, row = Math.floor(i/per);
  var inRow = Math.min(per, bx.cap - row*per);
  var idx = i - row*per;
  return [ bx.cx + (idx - (inRow-1)/2) * 17, bx.bot - 12 - row*16 ];
}

/* Boru sahanin ALTINDAN gecer: karanlik bir oluk olarak, her seyin arkasina
   cizilir. Agizlar pirinc halkayla isaretli — mermerin nereden cikacagi belli. */
function drawTubes(){
  var i, k;
  for(i=0;i<T.tubes.length;i++){
    var p = T.tubes[i].path;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(0,0,0,.62)"; ctx.lineWidth = 23;
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for(k=1;k<p.length;k++) ctx.lineTo(p[k][0], p[k][1]);
    ctx.stroke();
    ctx.strokeStyle = "rgba(192,138,62,.26)"; ctx.lineWidth = 1.6;
    ctx.setLineDash([7, 7]); ctx.stroke(); ctx.setLineDash([]);
    /* cikis agzi */
    var e = p[p.length-1];
    ctx.strokeStyle = "#C08A3E"; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(e[0], e[1], 12, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = "rgba(240,200,120,.13)";
    ctx.beginPath(); ctx.arc(e[0], e[1], 10.5, 0, Math.PI*2); ctx.fill();
    var dir = T.tubes[i].out[0] > 0 ? 1 : -1;
    ctx.fillStyle = "#F0C878";
    ctx.beginPath();
    ctx.moveTo(e[0] + dir*4, e[1] - 9);
    ctx.lineTo(e[0] + dir*11, e[1] - 2);
    ctx.lineTo(e[0] + dir*4, e[1] + 5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  /* giris agzi */
  var m = T.tubes[0].path[0];
  ctx.save();
  ctx.fillStyle = "#080503";
  ctx.beginPath(); ctx.ellipse(m[0], m[1] - 4, 25, 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#C08A3E"; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.ellipse(m[0], m[1] - 4, 25, 10, 0, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = "rgba(240,200,120,.5)";
  for(var q=-1;q<=1;q++){
    ctx.beginPath();
    ctx.moveTo(m[0] + q*11 - 4, m[1] - 16);
    ctx.lineTo(m[0] + q*11 + 4, m[1] - 16);
    ctx.lineTo(m[0] + q*11, m[1] - 8);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawTable(){
  if(!T) return;
  var i, k;
  ctx.clearRect(0, 0, TW, TH);

  if(ready(IMG.zemin)){
    ctx.drawImage(IMG.zemin, 0, 0, TW, TH);
    /* Ahsabi bir tik koyultuyoruz ki pirinc geometri ustunde okunsun. */
    ctx.fillStyle = "rgba(12,8,4,.24)";
    ctx.fillRect(0, 0, TW, TH);
    /* Fotografin alti cok karanlikti: kollarin oldugu bolgede mermer
       secilmiyordu. Oraya yumusak bir sicak isik koyuyoruz. */
    var lg = ctx.createRadialGradient(TW/2, 430, 20, TW/2, 430, 210);
    lg.addColorStop(0, "rgba(240,200,120,.13)");
    lg.addColorStop(1, "rgba(240,200,120,0)");
    ctx.fillStyle = lg; ctx.fillRect(0, 250, TW, TH-250);
  } else {
    var g = ctx.createLinearGradient(0, 0, 0, TH);
    g.addColorStop(0, "#2B1E13"); g.addColorStop(0.55, "#1C1409"); g.addColorStop(1, "#0F0A05");
    ctx.fillStyle = g; ctx.fillRect(0, 0, TW, TH);
  }
  ctx.fillStyle = "rgba(240,200,120,.05)";
  ctx.beginPath(); ctx.ellipse(TW/2, 40, 150, 110, 0, 0, Math.PI*2); ctx.fill();

  drawTubes();
  for(i=0;i<T.segs.length;i++){
    var s = T.segs[i];
    capsule(s.x1, s.y1, s.x2, s.y2, s.r, s.kick ? "#8E3B2C" : "#6B4B22", s.kick ? "#E0705F" : "#C08A3E");
  }
  for(i=0;i<T.posts.length;i++){
    var p = T.posts[i];
    ctx.fillStyle = "#6B4B22"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#C08A3E"; ctx.beginPath(); ctx.arc(p.x, p.y - 1, p.r*0.5, 0, Math.PI*2); ctx.fill();
  }
  for(i=0;i<T.bumps.length;i++){
    var c = T.bumps[i];
    if(c.hit > 0) c.hit -= 0.09;
    var hk = c.hit > 0 ? c.hit : 0;
    ctx.fillStyle = "#0D0705";
    ctx.beginPath(); ctx.arc(c.x, c.y + 2, c.r + 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = hk > 0 ? "#E0705F" : "#A8362E";
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(242,231,211," + (0.42 + 0.5*hk) + ")"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r - 3.5, 0, Math.PI*2); ctx.stroke();
  }

  /* ---- ITICI: duvardaki ped, ice bakan cift chevron ---- */
  for(i=0;i<T.pushes.length;i++){
    var pz = T.pushes[i];
    if(pz.hit > 0) pz.hit -= 0.07;
    var ph = pz.hit > 0 ? pz.hit : 0;
    capsule(pz.x, pz.y, pz.x, pz.y + pz.h, 5,
            ph > 0 ? "#4E7FB8" : "#2E4C70", ph > 0 ? "#BFE0FF" : "#6D9CC9");
    ctx.save();
    ctx.strokeStyle = "rgba(191,224,255," + (0.45 + 0.5*ph) + ")";
    ctx.lineWidth = 2; ctx.lineCap = "round";
    for(k=0;k<3;k++){
      var cy2 = pz.y + pz.h*(0.22 + 0.28*k);
      ctx.beginPath();
      ctx.moveTo(pz.x - pz.dir*3, cy2 - 6);
      ctx.lineTo(pz.x + pz.dir*5, cy2);
      ctx.lineTo(pz.x - pz.dir*3, cy2 + 6);
      ctx.stroke();
    }
    ctx.restore();
  }
  /* ---- KUCULTUCU: ice dogru daralan halkalar ---- */
  for(i=0;i<T.shrinks.length;i++){
    var sh = T.shrinks[i];
    if(sh.hit > 0) sh.hit -= 0.06;
    var k2 = sh.hit > 0 ? sh.hit : 0;
    ctx.fillStyle = "#0B0710";
    ctx.beginPath(); ctx.arc(sh.x, sh.y + 2, sh.r + 3, 0, Math.PI*2); ctx.fill();
    var sg = ctx.createRadialGradient(sh.x - sh.r*0.3, sh.y - sh.r*0.35, 1, sh.x, sh.y, sh.r);
    sg.addColorStop(0, k2 > 0 ? "#E7C7FF" : "#8E6BB8");
    sg.addColorStop(1, "#3A2352");
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(231,199,255," + (0.55 + 0.45*k2) + ")";
    for(k=1;k<=3;k++){
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, sh.r*(1 - 0.26*k) - k2*2, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  /* kutular */
  for(i=0;i<T.boxes.length;i++){
    var bx = T.boxes[i], p2 = PAL[bx.c];
    var open = bx.stack < bx.cap;
    if(bx.lit > 0) bx.lit -= 0.05;
    if(bx.rej > 0) bx.rej -= 0.06;

    ctx.fillStyle = "rgba(0,0,0,.42)";
    ctx.fillRect(bx.cx - bx.w/2, bx.top, bx.w, bx.h);
    if(open){
      var pl = 0.5 + 0.5*Math.sin(tms/340 + i*1.4);
      ctx.save();
      ctx.shadowColor = p2.hex; ctx.shadowBlur = 10 + 12*pl;
      ctx.strokeStyle = p2.lit; ctx.lineWidth = 2;
      ctx.strokeRect(bx.cx - bx.w/2 - 2, bx.top - 2, bx.w + 4, bx.h + 4);
      ctx.restore();
    }
    /* pota cercevesi */
    for(k=0;k<bx.walls.length;k++){
      var wl = bx.walls[k];
      capsule(wl.x1, wl.y1, wl.x2, wl.y2, wl.r, p2.dk, p2.hex);
    }
    /* file */
    ctx.save();
    if(bx.rej > 0){ ctx.shadowColor = "#FFF"; ctx.shadowBlur = 20*bx.rej; }
    drawNet(bx, p2, !open);
    ctx.restore();
    /* bos yuvalar: kac mermer daha alacagi okunsun */
    for(k=bx.stack;k<bx.cap;k++){
      var es = stackSlot(bx, k);
      ctx.strokeStyle = "rgba(255,255,255,.13)"; ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(es[0], es[1], 7, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }

    for(k=0;k<bx.stack;k++){
      var sl = stackSlot(bx, k);
      marble(sl[0], sl[1], bx.c, 7);
    }
    if(bx.lit > 0){
      ctx.strokeStyle = "rgba(182,240,154," + bx.lit + ")"; ctx.lineWidth = 3;
      ctx.strokeRect(bx.cx - bx.w/2 - 3, bx.top - 3, bx.w + 6, bx.h + 6);
    }
  }

  for(i=0;i<T.flips.length;i++){
    var f = T.flips[i];
    var tx = f.px + Math.cos(f.a)*f.len, ty = f.py + Math.sin(f.a)*f.len;
    capsule(f.px, f.py, tx, ty, f.rad, "#8A6224", "#F0C878");
    ctx.fillStyle = "#3B2A18";
    ctx.beginPath(); ctx.arc(f.px, f.py, f.rad*0.8, 0, Math.PI*2); ctx.fill();
  }

  for(i=0;i<T.balls.length;i++){
    var b = T.balls[i];
    if(!b.alive) continue;
    if(b.tube >= 0){                      /* boruda: sahanin altinda, sonuk */
      ctx.save(); ctx.globalAlpha = 0.55;
      marble(b.x, b.y, b.c, Math.max(3, b.r - 1));
      ctx.restore();
      continue;
    }
    ctx.fillStyle = "rgba(0,0,0,.34)";
    ctx.beginPath();
    ctx.ellipse(b.x + b.r*0.31, b.y + b.r*0.44, b.r*0.92, b.r*0.72, 0, 0, Math.PI*2);
    ctx.fill();

    /* İZ: uzunlugu HIZA bagli — yavas yuvarlanan mermer leke birakmaz,
       havada ucan uzun bir kuyruk birakir. Renk mermerin kendi rengi ve
       toplamali harmanla ciziliyor, boylece koyu ahsapta akkor gibi yaniyor. */
    var spd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    var want = spd > 110 ? Math.min(18, 5 + Math.round(spd/58)) : 1;
    b.trail.push([b.x, b.y]);
    while(b.trail.length > want) b.trail.shift();
    if(b.trail.length > 2){
      var tp = PAL[b.c];
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for(k=0;k<b.trail.length-1;k++){
        var ff = k/(b.trail.length-1);            /* 0 = en eski, 1 = en yeni */
        ctx.globalAlpha = 0.05 + 0.36*ff*ff;
        ctx.fillStyle = ff > 0.72 ? tp.lit : tp.hex;
        ctx.beginPath();
        ctx.arc(b.trail[k][0], b.trail[k][1], b.r*(0.22 + 0.72*ff), 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    marble(b.x, b.y, b.c, b.r);
  }
}

cv = el("cv"); ctx = cv.getContext("2d");
loadArt();
bindPad(el("fL"), 0);
bindPad(el("fR"), 1);
cv.addEventListener("pointerdown", function(e){
  var r = cv.getBoundingClientRect();
  setFlip((e.clientX - r.left) < r.width/2 ? 0 : 1, true);
});
window.addEventListener("pointerup", function(){ setFlip(0, false); setFlip(1, false); });
document.addEventListener("keydown", function(e){
  if(e.repeat) return;
  if(e.key === "ArrowLeft"  || e.key === "z" || e.key === "Z") setFlip(0, true);
  if(e.key === "ArrowRight" || e.key === "m" || e.key === "M") setFlip(1, true);
});
document.addEventListener("keyup", function(e){
  if(e.key === "ArrowLeft"  || e.key === "z" || e.key === "Z") setFlip(0, false);
  if(e.key === "ArrowRight" || e.key === "m" || e.key === "M") setFlip(1, false);
});
el("bNew").addEventListener("click", function(){ level = 1; newGame(); });
el("bHelp").addEventListener("click", showHelp);
window.addEventListener("resize", function(){ fitCanvas(); fitCanvas(); drawTable(); });

/* Adres sonuna #4 yazarak o bolumden baslanabilir — bolumleri tek tek
   gozden gecirmek icin (ornek: .../uc-kutu.html#6 ). */
(function(){
  var m = /^#(\d+)$/.exec(window.location.hash || "");
  if(m){
    var n = parseInt(m[1], 10);
    if(n >= 1 && n <= LEVELS.length) level = n;
  }
})();
newGame();
showIntro();
raf = requestAnimationFrame(loop);

var bt = el("boot");
if(bt && bt.parentNode) bt.parentNode.removeChild(bt);
})();

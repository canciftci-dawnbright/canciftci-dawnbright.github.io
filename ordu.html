<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ordu Tüpleri</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#141a24;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#f4f1e6}
#app{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#2b2117 0%,#1c160f 100%)}
canvas#sahne3d{position:absolute;left:0;top:0;width:100%;display:block}
/* ---------- HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:5;pointer-events:none}
.pil{background:rgba(20,16,10,.62);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:3px 10px;font-weight:800;font-size:14px;backdrop-filter:blur(3px);display:flex;align-items:center;gap:6px}
#bMenu{pointer-events:auto;font:inherit;font-weight:800;color:inherit;cursor:pointer;padding:3px 9px;font-size:15px}
#hSev small{font-size:11px;opacity:.7;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pil{white-space:nowrap}
@media (max-width:370px){#hSev small{max-width:56px}}
#kaleBar{flex:1;max-width:150px;margin-left:auto}
#kaleBar .dis{height:10px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;flex:1;min-width:60px}
#kaleBar .ic{height:100%;width:100%;background:linear-gradient(90deg,#e04b3a,#f2c230 50%,#5fd35a);background-size:200% 100%;border-radius:6px;transition:width .3s}
#kaleBar.vur{animation:kaleVur .35s}
@keyframes kaleVur{30%{transform:translateX(-4px) scale(1.06);background:rgba(200,30,20,.8)}60%{transform:translateX(4px)}}
#onizle{position:absolute;left:8px;right:8px;top:42px;display:flex;align-items:center;gap:4px;z-index:5;pointer-events:none;flex-wrap:nowrap;overflow:hidden}
#onizle .et{font-size:11px;font-weight:800;opacity:.85;margin-right:2px;white-space:nowrap;text-shadow:0 1px 2px #000}
.dIk{position:relative;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a3a2a,#3a1a12);border:2px solid #f4ead2;box-sizing:border-box;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.5);flex:none}
.dIk svg{width:20px;height:20px}
.dIk i{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2px solid #f4ead2}
.dIk.ilk{width:36px;height:36px;box-shadow:0 0 0 2px #fff,0 0 12px rgba(255,255,255,.6)}
.dIk.sonra{opacity:.55;transform:scale(.85)}
.cb{position:absolute;left:0;top:0;width:36px;height:7px;margin:-3.5px 0 0 -18px;border-radius:4px;background:rgba(20,12,6,.8);box-shadow:0 0 0 1.5px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.5);pointer-events:none;z-index:3;will-change:transform}
.cb b,.cb i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:3px;width:calc(var(--o,1) * 34px)}
.cb b{background:#fff;width:calc(var(--z,1) * 34px)}.cb i{background:linear-gradient(#8af07a,#3fb83a)}.cb.onlar i{background:linear-gradient(#ff8a7a,#d8382a)}
.pop{position:absolute;z-index:7;pointer-events:none;font-weight:800;font-size:15px;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.4);animation:pop 1.1s ease-out forwards}
.pop.etkili{color:#ffe066;font-size:17px}.pop.zayif{color:#d8d2c4;font-size:13px}.pop.baskin{color:#ff9a3a;font-size:18px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%)}}
#dalgaYazi{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:30px;font-weight:800;z-index:6;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 20px rgba(0,0,0,.5);opacity:0;transform:scale(.7)}
#dalgaYazi.goster{animation:dalgaY 1.8s ease forwards}
#dalgaYazi small{display:block;font-size:14px;opacity:.85}
@keyframes dalgaY{15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
/* ---------- alt panel */
#panel{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:4;background:linear-gradient(180deg,#3a2b1a 0%,#2a1f13 30%,#21180f 100%);border-top:3px solid #5a4126;box-shadow:0 -8px 20px rgba(0,0,0,.5)}
#panel::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 38px);pointer-events:none}
#kislaSat{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;position:relative}
#kislaSat .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.18em;font-weight:800;opacity:.6}
.yer{flex:1;height:64px;border-radius:12px;border:2px dashed rgba(255,230,180,.18);position:relative;display:grid;place-items:center}
.kart{position:absolute;inset:-2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.35);animation:kartGel .35s cubic-bezier(.2,1.6,.4,1)}
.kart svg{width:30px;height:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.kart b{font-size:11px;line-height:1;margin-top:2px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.kart .nok{display:flex;gap:2px;margin-top:3px}.kart .nok i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85)}
.kart.karsi{animation:kartGel .35s cubic-bezier(.2,1.6,.4,1),karsiP 1s ease-in-out infinite .35s}
.kart.karsi::after{content:'⚔';position:absolute;top:-9px;right:-6px;width:20px;height:20px;border-radius:50%;background:#fff3c0;color:#5a3b17;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.4)}
@keyframes karsiP{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.35),0 0 0 3px #fff3c0,0 0 18px #ffd34a}}
@keyframes kartGel{from{transform:scale(.4) translateY(30px);opacity:0}}
.kart:active{transform:translateY(2px) scale(.97)}
#tupSat{display:flex;justify-content:center;align-items:flex-end;gap:7px;padding:6px 8px 14px;position:relative}
.tup{position:relative;flex:1;max-width:62px;border-radius:10px 10px 22px 22px;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.18) 30%,rgba(255,255,255,.05) 60%,rgba(255,255,255,.12));border:2px solid rgba(255,240,210,.35);border-top-color:rgba(255,240,210,.55);box-shadow:inset 0 -6px 12px rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.35);display:flex;flex-direction:column-reverse;align-items:center;padding:6px 0 7px;gap:3px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tup::before{content:'';position:absolute;left:-5px;right:-5px;top:-6px;height:8px;border-radius:5px;background:#8a6b44;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.tup.sec{transform:translateY(-6px);box-shadow:inset 0 -6px 12px rgba(0,0,0,.35),0 0 0 3px #fff3c0,0 0 18px rgba(255,230,140,.7)}
.tup.hata{animation:tupHata .3s}
@keyframes tupHata{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tup.dolu{box-shadow:inset 0 -6px 12px rgba(0,0,0,.35),0 0 0 3px #ffd34a,0 0 16px #ffd34a}
.tup .dolu-et{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.06em;white-space:nowrap;background:#ffd34a;color:#4a2e08;border-radius:6px;padding:1px 5px;animation:karsiP 1s ease-in-out infinite}
.tup .yolda{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:10px;font-weight:800;opacity:.85;text-align:center;line-height:1.1;white-space:nowrap}
.tup .yolda i{display:block;width:34px;height:5px;border-radius:3px;background:rgba(0,0,0,.4);margin:3px auto 0;overflow:hidden}
.tup .yolda i::after{content:'';display:block;height:100%;width:var(--k,0%);background:#ffd34a}
.jet{width:var(--j,46px);height:var(--j,46px);border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.25),0 2px 2px rgba(0,0,0,.35);transition:transform .14s}
.jet svg{width:62%;height:62%}
.jet.kalk{transform:translateY(-16px)}
.jet.dus{animation:jDus .45s cubic-bezier(.3,1.4,.5,1) backwards}
@keyframes jDus{from{transform:translateY(-140px);opacity:0}}
.jet.gizli{visibility:hidden}
.ucan{position:absolute;z-index:30;pointer-events:none;transition:none}
/* ---------- ipucu, ekranlar */
#ip{position:absolute;left:12px;right:12px;z-index:20;background:#fff8e6;color:#3a2a14;border-radius:14px;padding:9px 12px;font-weight:700;font-size:14px;line-height:1.25;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
#ip.goster{opacity:1;transform:none}
#ip::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff8e6}
#over{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(8,6,3,.62);backdrop-filter:blur(3px)}
#over.goster{display:flex}
.card{width:min(88%,380px);max-height:86%;overflow:auto;background:linear-gradient(180deg,#3b2c1b,#251a0f);border:2px solid #8a6b44;border-radius:20px;padding:18px 16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:kartGel .35s cubic-bezier(.2,1.4,.4,1)}
.card h1{margin:2px 0;font-size:30px;line-height:1.05}
.card h2{margin:4px 0;font-size:22px}
.card p{margin:6px 0;opacity:.9;font-size:14px;line-height:1.3}
.card .alt{font-size:11px;letter-spacing:.22em;opacity:.7;font-weight:800}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:10px 26px;margin:6px 4px 0;background:linear-gradient(#ffd34a,#e8a81a);color:#4a2e08;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #9a6a0a;cursor:pointer}
.btn.gri{background:linear-gradient(#e9dfc9,#c9bba0);color:#3a2a14;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #8a7a5a}
.btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 #9a6a0a}
.yildizlar{font-size:40px;letter-spacing:4px;margin:4px 0;font-family:'Segoe UI Symbol','Apple Symbols',system-ui,sans-serif;color:#ffd34a;text-shadow:0 3px 0 #9a6a0a}
.yildizlar span{display:inline-block;filter:grayscale(1) brightness(.5)}
.yildizlar span.on{filter:none;animation:yIn .5s cubic-bezier(.2,1.8,.4,1) backwards}
@keyframes yIn{from{transform:scale(0) rotate(-40deg)}}
.harita{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.harita button{font:inherit;font-weight:800;font-size:16px;aspect-ratio:1;border-radius:14px;border:0;background:linear-gradient(#e9dfc9,#c9bba0);color:#3a2a14;box-shadow:0 4px 0 #8a7a5a;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.harita button small{font-size:11px;letter-spacing:0;margin-top:3px;font-family:'Segoe UI Symbol','Apple Symbols',system-ui,sans-serif;color:#b8860b}
.harita button.su{background:linear-gradient(#ffd34a,#e8a81a);box-shadow:0 4px 0 #9a6a0a,0 0 14px rgba(255,211,74,.6)}
.harita button:disabled{opacity:.35;cursor:default}
.tanit{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.tanit .dIk{width:64px;height:64px}.tanit .dIk svg{width:42px;height:42px}
.tanit .ok{font-size:26px;opacity:.8}
.tanit .jet{--j:64px}
.kural{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;font-size:12px;text-align:left}
.kural>div{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:10px;padding:4px 6px}
.kural .jet{--j:26px}.kural .dIk{width:26px;height:26px}.kural .dIk svg{width:17px;height:17px}
#err{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;background:#141a24;text-align:center;padding:20px;font-weight:700}
#err small{display:block;opacity:.7;margin-top:6px;font-weight:600}
#err .cark{width:36px;height:36px;border:4px solid rgba(255,255,255,.2);border-top-color:#ffd34a;border-radius:50%;animation:don 1s linear infinite;margin-bottom:10px}
@keyframes don{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button class="pil" id="bMenu" aria-label="Menü">☰</button>
    <div class="pil" id="hSev">⚔️ <span id="hSevNo">1</span> <small id="hSevAd"></small></div>
    <div class="pil" id="hDalga">Dalga <span id="hDalgaNo">1/3</span></div>
    <div class="pil" id="kaleBar">🏰 <div class="dis"><div class="ic" id="kaleIc"></div></div></div>
  </div>
  <div id="onizle"></div>
  <div id="dalgaYazi"></div>
  <div id="panel">
    <div id="kislaSat"><div class="lbl">KIŞLA</div></div>
    <div id="tupSat"></div>
  </div>
  <div id="ip"></div>
  <div id="over"><div class="card" id="ekran"></div></div>
  <div id="err"></div>
</div>
<script>
/* Yukleme ekrani: hazir olunca kalkar; sadece gercek yukleme hatasinda "Tekrar dene". */
(function () {
  var e = document.getElementById('err'), t0 = Date.now(), hata = false;
  var hazir = function () { return window.G && window.G.hazir; };
  var goster = function (html) { e.innerHTML = html; e.style.display = 'flex'; };
  var dugme = '<button class="btn" style="margin-top:16px" onclick="location.reload()">Tekrar dene</button>';
  window.__yukHata = function () { if (hazir()) return; hata = true; goster('3D kütüphanesi yüklenemedi.<small>İnternet bağlantısını kontrol edip tekrar dene.</small>' + dugme); };
  addEventListener('error', function (ev) { if (ev.target && ev.target.tagName === 'SCRIPT') window.__yukHata(); }, true);
  addEventListener('unhandledrejection', function () { window.__yukHata(); });
  (function kontrol() {
    if (hazir()) { e.style.display = 'none'; return; }
    if (!hata) { var sn = (Date.now() - t0) / 1000;
      if (sn > 2) goster('<div class="cark"></div>Yükleniyor…' + (sn > 20 ? '<small>Bağlantı yavaş, biraz daha bekle</small>' : '') + (sn > 60 ? dugme : '')); }
    setTimeout(kontrol, 400);
  })();
})();
</script>
<script>
/* <<<MANTIK>>> */
// Ordu Tupleri: water-sort tupleri + tek koridorlu gercek zamanli savas
const KAP = 4;               // tup kapasitesi = manga boyu
const KORIDOR = 32;          // kale (0) -> dusman kampi (KORIDOR)
const TAKVIYE_SN = 3;        // gonderilen tupun yerine yeni karisik sutun gelme suresi
const NEFES_SN = 4; 
const YEDEK = 4;             // kisla: tamamlanan mangalarin bekledigi yer (tup bosalir)          // dalgalar arasi mola
const KALE_CAN = 12;
const SIRA_BIZ = false, SIRA_ONLAR = true, ESLESME = true;
const KUSATMA = 0.02;         // savasmayan (sirada bekleyen) her dusman askeri saniyede bu kadar kale cani goturur
const ARA = 1.8;              // ayni taraftaki mangalar arasi en az mesafe (sira)         // kaleye ulasan her dusman askeri 1 can goturur

const BIRIM = {
  okcu:   { ad: 'Okçu',     renk: '#4cbf4c', hp: 7,  dmg: 2.2, menzil: 6,   hiz: 2.2, karsi: { goblin: 2.2 } },
  balta:  { ad: 'Baltacı',  renk: '#e0483a', hp: 11, dmg: 2.8, menzil: 1.3, hiz: 2.2, karsi: { zirhli: 2.6 } },
  kalkan: { ad: 'Kalkanlı', renk: '#3f7fe0', hp: 18, dmg: 1.5, menzil: 1.3, hiz: 1.8, karsi: { dokcu: 2.2 }, okDirenc: 0.3 },
  mizrak: { ad: 'Mızrakçı', renk: '#f2c230', hp: 10, dmg: 2.6, menzil: 1.6, hiz: 2.2, karsi: { suvari: 2.6 } },
};
const DUSMAN = {
  goblin: { ad: 'Goblin',      hp: 11, dmg: 2.6, menzil: 1.3, hiz: 1.6, zirh: 1,   deger: 3 },
  suvari: { ad: 'Süvari',      hp: 10, dmg: 3.4, menzil: 1.3, hiz: 3.6, zirh: 1,   deger: 5 },
  zirhli: { ad: 'Zırhlı',      hp: 22, dmg: 2.4, menzil: 1.3, hiz: 1.0, zirh: 0.5, deger: 6 },
  dokcu:  { ad: 'Kara okçu',   hp: 9,  dmg: 3.4, menzil: 6,   hiz: 1.6, zirh: 1,   deger: 4, ok: true },
};
// hangi dusmana hangi birlik iyi gelir (bot + arayuz ipucu)
const KARSI = { goblin: 'okcu', suvari: 'mizrak', zirhli: 'balta', dokcu: 'kalkan' };

function rngYap(tohum) { let s = (tohum >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

// ---------- seviyeler
// her seviye: renkler, dusman havuzu, toplam manga, iki manga arasi saniye (tempo), dalga boyu (dalgalar arasi NEFES_SN mola)
// dalgalar takvimle gelir: sahayi temizlemeni beklemez -> yanlis birlik = birikme = kaleye sizma
// elle tasarlanmis seviyeler. dalga dizisi: G goblin, S suvari, Z zirhli, O kara okcu. aralik: iki dusman mangasi arasi sn
const HARF = { G: 'goblin', S: 'suvari', Z: 'zirhli', O: 'dokcu' };
const SEVIYE_TAB = [
  { ad: 'Sınır köyü',     renkler: ['okcu', 'balta', 'kalkan'], aralik: 6.0, kat: 1,    dalga: ['GG', 'GGG', 'GGG'], yeni: 'goblin' },
  { ad: 'Süvari izi',     aralik: 6.5, kat: 1,    dalga: ['GS', 'GSG', 'SGS'], yeni: 'suvari' },
  { ad: 'Demir adımlar',  aralik: 6.0, kat: 1,    dalga: ['ZG', 'GZS', 'ZSG'], yeni: 'zirhli' },
  { ad: 'Kara oklar',     aralik: 6.2, kat: 1,    dalga: ['OG', 'OSZ', 'GOZ'], yeni: 'dokcu' },
  { ad: 'Süvari akını',   aralik: 5.8, kat: 1,    dalga: ['SSG', 'SSZ', 'GSSS', 'SOS'] },
  { ad: 'Dört bir yan',   aralik: 6.0, kat: 1,    dalga: ['GSZO', 'SGOZ', 'ZOSG'] },
  { ad: 'Zırhlı duvar',   aralik: 5.6, kat: 1.05, dalga: ['ZZG', 'ZOZ', 'ZZSG', 'OZZ'] },
  { ad: 'Karışık cephe',  aralik: 5.8, kat: 1.05, dalga: ['GSZO', 'OZSG', 'SGZO', 'ZOGS'] },
  { ad: 'Ok yağmuru',     aralik: 5.9, kat: 1.05, dalga: ['OOG', 'SOO', 'OZO', 'GOOS'] },
  { ad: 'Kale kuşatması', aralik: 5.6, kat: 1.05, dalga: ['GSZOG', 'SZOSG', 'ZOSGZ', 'OSZGO'] },
];
const TUM_RENK = ['okcu', 'balta', 'kalkan', 'mizrak'];
function seviye(n) {
  let T;
  if (n < SEVIYE_TAB.length) T = SEVIYE_TAB[n];
  else { // sonsuz mod: elle seviyelerden karistir, tempo ve can yavasca artar
    const r = rngYap(9000 + n * 77), k = n - SEVIYE_TAB.length + 1, kaynak = SEVIYE_TAB[4 + Math.floor(r() * (SEVIYE_TAB.length - 4))];
    T = { ad: kaynak.ad + ' ' + (k + 1), aralik: Math.max(4.4, kaynak.aralik - k * 0.06), kat: kaynak.kat + k * 0.02, dalga: kaynak.dalga.map(d => d.split('').sort(() => r() - 0.5).join('')) };
  }
  const dalgalar = T.dalga.map(d => d.split('').map((h, i) => [+(i * T.aralik).toFixed(2), HARF[h]]));

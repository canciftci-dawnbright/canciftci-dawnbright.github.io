<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kapibara Kaplıcası</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #2a3a2a; overflow: hidden; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: relative; width: 100%; max-width: 480px; height: 100%; margin: 0 auto; overflow: hidden; background: linear-gradient(#bfe6c8, #8cc89a 40%, #6aa878); background-size: cover; background-position: center; }
#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 10px 10px 0; z-index: 30; }
.pill { background: rgba(255,252,240,.95); color: #4a5a2a; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 rgba(40,60,20,.35); white-space: nowrap; }
#hud button { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,252,240,.95); color: #4a5a2a; font-size: 19px; font-weight: 900; box-shadow: 0 3px 0 rgba(40,60,20,.35); flex: none; }
#ad { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#kalpler { letter-spacing: 1px; font-size: 16px; }
#kalpler .bos { filter: grayscale(1); opacity: .35; }
#tahta { position: absolute; left: 50%; transform: translateX(-50%); z-index: 4; display: grid; padding: 8px; border-radius: 18px;
  background: linear-gradient(#8a6a48, #6a4e34); box-shadow: 0 10px 20px rgba(20,40,10,.4), inset 0 2px 0 rgba(255,230,190,.4); }
.havuz { position: relative; margin: 2px; border-radius: 40%; cursor: pointer;
  background: radial-gradient(ellipse at 50% 60%, #6fd6dc 0%, #3fb2c4 55%, #2a8ea6 72%, #9a8a78 74%, #b8a890 86%, #8a7a66 100%); box-shadow: inset 0 3px 6px rgba(0,0,0,.35); transition: filter .2s, transform .2s; }
.havuz::after { content: ''; position: absolute; left: 22%; top: 30%; width: 22%; height: 10%; border-radius: 50%; background: rgba(255,255,255,.45); filter: blur(1px); }
.havuz.bolgeA { background: radial-gradient(ellipse at 50% 60%, #7fdce0 0%, #48bccc 55%, #2f96ac 72%, #a89a86 74%, #c6b69c 86%, #96866e 100%); }
.havuz.sonuk { filter: brightness(.55) saturate(.5); }
.havuz.hedef { box-shadow: inset 0 3px 6px rgba(0,0,0,.35), 0 0 0 3px #ffe27a, 0 0 14px #ffe27a; }
.havuz.yanlis { animation: salla .35s; }
@keyframes salla { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.cit { position: absolute; background: linear-gradient(#5aa04a, #3a7a32); border-radius: 4px; z-index: 5; pointer-events: none; box-shadow: 0 2px 2px rgba(0,0,0,.3); }
#alan { position: absolute; left: 0; right: 0; z-index: 4; display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 0 8px; }
.sira { position: relative; border-radius: 16px; background: rgba(255,255,255,.25); box-shadow: inset 0 2px 6px rgba(0,0,0,.15); }
.sira .say { position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%); font-weight: 900; font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
#bank { position: relative; border-radius: 14px; background: linear-gradient(#b07a46, #8a5a2e); box-shadow: 0 4px 0 #5a3a1e, inset 0 2px 0 rgba(255,230,190,.4); display: flex; gap: 4px; padding: 6px; }
#bank .yer { border-radius: 10px; background: rgba(0,0,0,.18); }
#bank .etiket { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); letter-spacing: 1px; white-space: nowrap; }
#katman { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.sonraki { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; pointer-events: none; z-index: 25; }
.sonraki .isaret { position: relative; width: 24px; height: 24px; font-size: 12px; border-width: 2px; }
.sonraki .isaret.c::after { content: '💕'; position: absolute; right: -12px; top: -6px; font-size: 11px; }
.sonraki .isaret.z::after { content: '💤'; position: absolute; right: -12px; top: -6px; font-size: 11px; }
.sonraki .etk { font-size: 9px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); letter-spacing: 1px; }
.havuz.altin { animation: altin 1.2s ease-out; }
@keyframes altin { 30% { box-shadow: inset 0 0 0 5px #ffd23a, 0 0 18px #ffd23a; transform: scale(1.06); } }
.kapi .govde { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; display: block; pointer-events: none; }
.kapi .sapka, .kapi .zzz, .kapi .rozet, .kapi .kalpI { position: absolute; display: none; pointer-events: none; }
.kapi.uyuyor .govde { filter: brightness(.8) saturate(.7); }
.kapi.uyuyor .sapka { display: block; width: 46%; left: 18%; top: 2%; transform: rotate(-18deg); }
.kapi.uyuyor .zzz { display: block; right: 0; top: 0; font-size: 18px; animation: zzz 1.6s infinite; }
.kapi.uyuyor .rozet { display: flex; left: 4%; bottom: 4%; min-width: 22px; height: 22px; border-radius: 11px; background: #3a4a7a; color: #fff; font-weight: 900; font-size: 13px; align-items: center; justify-content: center; border: 2px solid #fff; }
.kapi.ciftli .kalpI { display: block; width: 34%; right: -6%; top: 6%; animation: nabiz .6s infinite alternate; }
.kapi.bugulu .govde { filter: grayscale(1) brightness(1.1) blur(1px); }
.kafaKus { position: absolute; width: 34%; left: 30%; top: -14%; pointer-events: none; animation: nabiz 1.2s infinite alternate; }
@keyframes zzz { 0% { transform: translate(0,0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(8px,-16px); opacity: 0; } }
.havuzUst { position: absolute; pointer-events: none; z-index: 16; }
.isaret { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 900; border: 2.5px solid #fff; box-shadow: 0 2px 3px rgba(0,0,0,.35); pointer-events: none; line-height: 1; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.kapi .isaret { left: 50%; bottom: 2%; transform: translateX(-50%); width: 40%; height: 40%; font-size: calc(var(--k) * .24); }
.kapi.havuzda .isaret { left: auto; right: 0; bottom: 6%; transform: none; width: 34%; height: 34%; font-size: calc(var(--k) * .2); }
.kapi.bugulu .isaret { background: #9aa4ac !important; }
.havuz.dolu { box-shadow: inset 0 0 0 4px var(--r), inset 0 3px 6px rgba(0,0,0,.35); }
.havuz.cakisan { animation: cakis .5s 3; }
@keyframes cakis { 50% { box-shadow: inset 0 0 0 5px #ff3a2a, 0 0 16px #ff3a2a; } }
#palet { position: absolute; left: 50%; transform: translateX(-50%); top: 58px; z-index: 20; display: flex; gap: 5px; padding: 5px 8px; border-radius: 14px; background: rgba(255,252,240,.9); box-shadow: 0 3px 0 rgba(40,60,20,.3); }
#palet .renk { display: flex; align-items: center; gap: 3px; font-weight: 900; font-size: 13px; color: #4a5a2a; padding: 1px 4px 1px 1px; border-radius: 12px; transition: transform .15s, background .15s; }
#palet .renk .isaret { position: static; width: 24px; height: 24px; font-size: 13px; border-width: 2px; }
#palet .renk.secili { background: #ffe27a; transform: scale(1.12); }
#palet .renk.bitti { opacity: .35; }
.sakura { position: absolute; width: 12px; height: 9px; border-radius: 60% 0 60% 0; background: #ffc0d8; pointer-events: none; z-index: 2; opacity: .85; }
.kapi.nefes .govde { animation: nefes 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes nefes { 50% { transform: scaleY(1.035) scaleX(.985); } }
.havuz::before { content: ''; position: absolute; inset: 18% 18% 22%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 40%); animation: parilti 3.5s ease-in-out infinite; }
@keyframes parilti { 50% { transform: translate(10%, 6%); opacity: .5; } }
.havuz.bolgeA { filter: hue-rotate(-12deg) brightness(1.06); }
.havuzUst .isiI { position: absolute; right: -4%; top: -4%; width: 38%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.havuzUst .kusI { position: absolute; left: 8%; top: 4%; width: 84%; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
.havuzUst .buguI { position: absolute; left: -12%; top: -14%; width: 124%; opacity: .97; filter: drop-shadow(0 2px 4px rgba(0,0,0,.15)); }
.kapi { position: absolute; left: 0; top: 0; pointer-events: auto; transition: transform .34s cubic-bezier(.3,1.3,.5,1), filter .2s, opacity .3s; transform-origin: 50% 100%; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); will-change: transform; }
.kapi.havuzda { pointer-events: none; filter: none; }
.kapi.secili { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #ffe27a); }
.kapi.ipucu { animation: ipucu .5s infinite alternate; }
@keyframes ipucu { to { filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #ffd23a); } }
.buhar { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.7); filter: blur(4px); pointer-events: none; z-index: 12; }
.yazi { position: absolute; font-weight: 900; font-size: 17px; color: #fff; text-shadow: 0 2px 0 #3a5a2a, 0 0 6px rgba(0,0,0,.4); white-space: nowrap; transform: translate(-50%, 0); animation: yazi 1.2s ease-out forwards; pointer-events: none; z-index: 40; }
.yazi.uyari { color: #ffe0d8; } .yazi.altin { color: #ffe27a; font-size: 20px; }
@keyframes yazi { 0% { transform: translate(-50%, 6px) scale(.6); opacity: 0; } 18% { transform: translate(-50%, -6px) scale(1.12); opacity: 1; } 100% { transform: translate(-50%, -40px) scale(1); opacity: 0; } }
.konf { position: absolute; width: 9px; height: 9px; border-radius: 2px; pointer-events: none; z-index: 45; }
#ip { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 35; background: rgba(255,252,240,.97); color: #4a5a2a; border-radius: 14px; padding: 9px 14px; font-size: 14px; line-height: 1.35; box-shadow: 0 4px 0 rgba(40,60,20,.35); text-align: center; transition: opacity .3s; }
#ip.gizli { opacity: 0; pointer-events: none; }
#ip b { color: #d0602a; }
.ekran { position: absolute; inset: 0; z-index: 60; background: rgba(20,40,20,.5); display: flex; align-items: center; justify-content: center; padding: 18px; }
.ekran.gizli { display: none; }
.kart { width: 100%; max-width: 370px; background: linear-gradient(#fffdf2, #eef6dc); color: #4a5a2a; border-radius: 22px; padding: 18px; text-align: center; box-shadow: 0 8px 0 #6a9a4a, 0 18px 40px rgba(0,0,0,.45); animation: kartGel .35s cubic-bezier(.3,1.4,.5,1); }
@keyframes kartGel { from { transform: scale(.7); opacity: 0; } }
.kart h1 { margin: 4px 0 6px; font-size: 26px; color: #3a6a2a; }
.kart p { margin: 6px 0 12px; font-size: 15px; line-height: 1.4; }
.kart .ust { font-size: 11px; letter-spacing: 2px; font-weight: 800; color: #7aaa5a; }
.kart .gorsel { height: 100px; margin: 2px 0; }
.btn { border: 0; border-radius: 16px; padding: 12px 26px; font-size: 19px; font-weight: 900; color: #fff; background: linear-gradient(#ffb04a, #f07a1a); box-shadow: 0 5px 0 #a04a08; margin: 6px 4px 0; font-family: inherit; }
.btn.gri { background: linear-gradient(#b8c8a8, #8aa07a); box-shadow: 0 5px 0 #5a704a; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.harita { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 14px; }
.harita button { border: 0; border-radius: 16px; padding: 10px 4px 6px; background: linear-gradient(#fff, #e2f0d0); box-shadow: 0 4px 0 #9ab87a; font-size: 22px; color: #4a5a2a; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 900; }
.harita button small { font-size: 13px; color: #f0a020; letter-spacing: 1px; }
.harita button.su { background: linear-gradient(#ffe6a8, #ffc860); box-shadow: 0 4px 0 #c08a28; animation: nabiz .7s infinite alternate; }
.harita button:disabled { filter: grayscale(1); opacity: .45; }
@keyframes nabiz { to { transform: scale(1.06); } }
.yildizlar { font-size: 42px; letter-spacing: 6px; margin: 2px 0; }
.yildizlar span { display: inline-block; color: #d0d8c0; } .yildizlar span.dolu { color: #ffc12a; text-shadow: 0 3px 0 #b07a10; animation: yGel .4s cubic-bezier(.3,1.6,.5,1) backwards; }
@keyframes yGel { from { transform: scale(0) rotate(-90deg); } }
.ornekRenk { display: flex; justify-content: center; gap: 4px; margin: 6px 0; } .ornekRenk img { height: 46px; }
</style>
</head>

  <div id="hud"><button id="bMenu">☰</button><div class="pill" id="ad">Kapibara Kaplıcası</div><div class="pill" id="kalpler"></div><button id="bIpucu">🔍</button></div>
  <div id="palet"></div>

  <div id="alan"></div>

</div>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forvet Yolu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b1410;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#f4f6ef}
#app{position:relative;margin:0 auto;height:100%;width:min(100vw,calc(100vh * 0.5625));overflow:hidden;background:#0b1410}
#app canvas{display:block;width:100%;height:100%}
.ik{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.17em;background:center/contain no-repeat}
.ik.p{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23e0a817'/><circle cx='16' cy='16' r='10.5' fill='%23ffd35a' stroke='%23c48a0a' stroke-width='1.5'/><path d='M16 9.5v13M12.5 12.5h7M12.5 19.5h7' stroke='%23c48a0a' stroke-width='2.2' stroke-linecap='round'/></svg>")}
#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:2}
#hud .satir{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pill{background:rgba(10,18,14,.8);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:3px 11px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px;text-shadow:0 1px 3px rgba(0,0,0,.6);transition:transform .12s}
.pill s{text-decoration:none;font-size:12px;opacity:.7}
.pill.vur{transform:scale(1.15)}
#skor{font-size:20px;padding:2px 14px;gap:10px}
#skor .biz{color:#ff6b5e}#skor .rak{color:#6fa8ff}
#ataklar{display:flex;gap:4px}#ataklar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}#ataklar i.on{background:#ffd35a}#ataklar i.bitti{background:#7a8a80}
#statlar{justify-content:center!important;gap:5px!important}
#statlar .pill{font-size:13px;padding:2px 8px}
#statlar .pill.art{animation:art .6s}
@keyframes art{30%{transform:scale(1.25);background:#2f7a3a}}
#ipuc{position:absolute;left:14px;right:14px;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
#ipuc.goster{opacity:1}
#ipuc span{display:inline-block;background:rgba(10,16,12,.8);border:1px solid rgba(255,211,90,.3);border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px;line-height:1.25}
#damga{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:800;font-size:44px;letter-spacing:.02em;color:#ffd35a;text-shadow:0 0 22px rgba(255,150,40,.85),0 4px 0 rgba(0,0,0,.6);pointer-events:none;opacity:0;z-index:3;line-height:1}
#damga.goster{animation:damga 1.25s cubic-bezier(.2,.9,.3,1.2) forwards}
#damga.kirmizi{color:#ff6b5e;text-shadow:0 0 22px rgba(255,60,40,.8),0 4px 0 rgba(0,0,0,.6)}
#damga.yesil{color:#b8f27a;text-shadow:0 0 22px rgba(120,220,60,.85),0 4px 0 rgba(0,0,0,.6)}
#damga.dev{font-size:76px}
@keyframes damga{0%{opacity:0;transform:scale(2.4) rotate(-6deg)}14%{opacity:1;transform:scale(1) rotate(-6deg)}78%{opacity:1}100%{opacity:0;transform:scale(1.05) rotate(-6deg)}}
#ucanlar{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
#cizim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.yuzen{position:absolute;left:0;top:0;font-weight:800;font-size:17px;color:#ffd35a;text-shadow:0 2px 4px rgba(0,0,0,.85);white-space:nowrap}
/* kart */
#kartAlan{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.25),rgba(0,0,0,.6))}
#kartAlan.acik{display:flex}
#kart{position:relative;width:62%;max-width:250px;aspect-ratio:.7;border-radius:18px 18px 40px 40px;padding:14px 14px 12px;box-sizing:border-box;color:#2a1d08;box-shadow:0 14px 40px rgba(0,0,0,.6);touch-action:none;cursor:grab;will-change:transform;display:flex;flex-direction:column;align-items:center;text-align:center}
#kart.giris{animation:kartGir .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes kartGir{from{transform:translateY(80px) scale(.5) rotate(-10deg);opacity:0}}
#kart.bronz{background:linear-gradient(160deg,#f0c08a,#b8773f 55%,#8a5426)}
#kart.gumus{background:linear-gradient(160deg,#f4f7fa,#b9c3cc 55%,#8a96a2)}
#kart.altin{background:linear-gradient(160deg,#fff1b0,#f2c94c 50%,#c9961a);box-shadow:0 0 30px rgba(255,210,80,.6),0 14px 40px rgba(0,0,0,.6)}
#kart .ust{display:flex;width:100%;justify-content:space-between;align-items:flex-start}
#kart .rey{font-size:42px;font-weight:800;line-height:.9}
#kart .nad{font-size:11px;letter-spacing:.15em;font-weight:800;opacity:.75;text-transform:uppercase}
#kart .ikon{font-size:62px;line-height:1.1;margin:4px 0 0;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
#kart .ad{font-size:18px;font-weight:800;line-height:1.05;margin-top:2px}
#kart .st{width:100%;margin-top:8px;display:flex;flex-direction:column;gap:2px;font-weight:800;font-size:15px}
#kart .st div{display:flex;justify-content:space-between;background:rgba(255,255,255,.28);border-radius:8px;padding:1px 8px}
#kart .st u{text-decoration:none}#kart .st .ar{color:#1b7a2a}#kart .st .az{color:#b8261b}
#kart .eski{font-size:11px;font-weight:700;opacity:.75;margin-top:auto}
#kart .rozet{position:absolute;top:40%;font-size:30px;font-weight:800;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-12deg);background:rgba(255,255,255,.7)}
#kart .rozet.k{left:10px;color:#1b8a2a}#kart .rozet.s{right:10px;color:#c42a1b;transform:rotate(12deg)}
#kartDug{display:flex;gap:18px;margin-top:22px}
#kartDug button{border:0;border-radius:50%;width:64px;height:64px;font:800 26px "Baloo 2",system-ui;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#kartDug .sat{background:#e9564a;color:#fff}#kartDug .kus{background:#4bc45a;color:#fff}
#kartDug small{display:block;font-size:11px;margin-top:-6px}
#kart.olay{--tema:#3a8fd0;width:80%;max-width:330px;background:linear-gradient(165deg,color-mix(in srgb,var(--tema) 70%,#fff 10%),color-mix(in srgb,var(--tema) 45%,#0b1410) 55%,#0b1410);color:#f4f6ef;aspect-ratio:auto;min-height:50%;border-radius:26px;border:2px solid rgba(255,255,255,.35);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--tema) 40%,transparent),0 0 46px color-mix(in srgb,var(--tema) 80%,transparent),0 18px 40px rgba(0,0,0,.6);overflow:hidden;padding:16px 16px 14px;z-index:1}
#kart.olay::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);background-size:260% 100%;animation:parla 2.8s ease-in-out infinite}
@keyframes parla{0%{background-position:130% 0}55%,100%{background-position:-60% 0}}
#kart.olay .nad{letter-spacing:.3em;opacity:.75}
#kart.olay .ikon{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-size:66px;margin:6px 0 4px;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.45),rgba(255,255,255,.08) 70%);box-shadow:0 0 34px color-mix(in srgb,var(--tema) 90%,#fff 10%),inset 0 0 18px rgba(255,255,255,.25);animation:ikonNabiz 1.8s ease-in-out infinite}
@keyframes ikonNabiz{50%{transform:scale(1.06)}}
#kart.olay .ad{font-size:26px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#kart.olay .metin{font-size:15px}
#kart.olay .secim .s{font-size:14.5px;padding:10px 8px;border-radius:14px;background:rgba(0,0,0,.28)}
#kartIsik{position:absolute;left:50%;top:42%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(255,250,220,.9) 0deg 7deg,rgba(255,255,255,0) 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 14%,transparent 36%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.7) 18%,transparent 40%);animation:isikDon 14s linear infinite}
#kartIsik::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,var(--tema,#ffd35a) 0,transparent 24%);animation:isikNabiz 1.8s ease-in-out infinite}
@keyframes isikDon{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes isikNabiz{50%{opacity:.6}}
#kartAlan{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#kartDug button{width:70px;height:70px}
#kart.olay .nad{opacity:.6}
#kart .metin{font-size:14px;opacity:.85;margin-top:2px;line-height:1.25}
#kart .mini{width:100%;box-sizing:border-box;background:rgba(255,255,255,.12);border-radius:10px;padding:4px 8px;margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:1px;font-weight:700}
#kart .mini.gumus{border:2px solid #c7d0d8}#kart .mini.altin{border:2px solid #f2c94c}#kart .mini.bronz{border:2px solid #c9874a}
#kart .mini u{text-decoration:none}#kart .mini .ar{color:#7dff8a}#kart .mini .az{color:#ff8a7a}
#kart .secim{display:flex;gap:8px;width:100%;margin-top:auto;padding-top:12px}
#kart .secim .s{flex:1;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 6px;font-size:13px;font-weight:800;line-height:1.15;transition:transform .1s,background .1s}
#kart .secim .s.sec{background:#ffd35a;color:#1a1409;transform:scale(1.06)}
#kart.olay .rozet{display:none}
#kartDug .sat,#kartDug .kus{background:#3a6ea8!important}
#modlar{font-size:13px;padding:2px 8px}
#modlar:empty{display:none}
#kartIp{margin-top:10px;font-weight:800;font-size:14px;opacity:.85;text-shadow:0 2px 6px #000}
/* ekranlar */
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,10,8,.62);z-index:6}
.card{background:linear-gradient(#1f3326,#132017);border:1px solid rgba(255,211,90,.25);border-radius:22px;padding:18px 20px;text-align:center;width:80%;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:kartIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes kartIn{from{transform:scale(.6);opacity:0}}
.card h2{margin:0;font-size:28px;line-height:1.1}
.card.genis .btn{margin-top:10px}
.card.genis{width:90%;max-height:92%;overflow-y:auto;padding:12px 12px 14px;box-sizing:border-box}
.card h2.mac{font-size:24px}.card h2.mac small{font-size:15px;opacity:.6;margin:0 4px}
.fiks{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.fm{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:rgba(255,255,255,.06);border-radius:8px;padding:2px 6px;font-size:12.5px;font-weight:700}
.fm .t1{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fm .t2{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm i,.tablo i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px;vertical-align:0;border:1px solid rgba(255,255,255,.4)}
.fm b{min-width:42px;text-align:center;background:rgba(0,0,0,.35);border-radius:6px;padding:0 6px}
.fm.biz{background:rgba(255,211,90,.18);border:1px solid rgba(255,211,90,.5)}
.fm.ev .t1,.fm.dep .t2{color:#b8f27a}
.fm.yeni{animation:fmGir .35s both}
@keyframes fmGir{from{opacity:0;transform:translateX(-14px)}}
.bay{font-size:12px;opacity:.6;margin-top:2px}
.tablo{width:100%;margin-top:8px;border-collapse:collapse;font-size:12.5px}
.tablo th{font-size:10.5px;opacity:.6;font-weight:800;padding:2px}
.tablo td{padding:2px 2px;text-align:center;border-top:1px solid rgba(255,255,255,.06)}
.tablo td.ad{text-align:left;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.tablo tr.biz td{background:rgba(255,211,90,.18);font-weight:800}
.tablo tr.lider td:first-child{color:#ffd35a}
.tablo u{text-decoration:none;font-size:9px;margin-left:1px}.tablo .ar{color:#7dff8a}.tablo .az{color:#ff8a7a}
.baslikYazi{font-size:42px!important;letter-spacing:.04em;background:linear-gradient(#fff6cf,#ffc21a 60%,#e08a0a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
.logo{font-size:66px;line-height:1;animation:topZ 1.1s ease-in-out infinite}
@keyframes topZ{50%{transform:translateY(-12px) rotate(180deg)}}
.card .kucuk{font-size:13px;opacity:.65}
#skor.gol{animation:skorGol .8s}
@keyframes skorGol{20%{transform:scale(1.35);background:#2f7a3a}}
.card .alt{font-size:13px;letter-spacing:.2em;opacity:.7;font-weight:800}
.card p{margin:6px 0 0;font-size:15px;opacity:.85}
.card .buyuk{font-size:44px;font-weight:800;margin:4px 0}
.card .ant{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.card .ant button{border:0;border-radius:12px;padding:6px 4px;background:#2c4a35;color:#f4f6ef;font:800 14px "Baloo 2",system-ui;cursor:pointer;line-height:1.15}
.card .ant button:disabled{opacity:.45}
.card .ant small{display:block;font-size:12px;color:#ffd35a}
.btn{margin-top:14px;border:0;border-radius:16px;padding:10px 30px;font:800 20px "Baloo 2",system-ui,sans-serif;color:#1a1409;background:#ffc21a;box-shadow:0 4px 0 #a37a05;cursor:pointer}
.btn:active{transform:translateY(2px)}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 45%,rgba(0,0,0,.45) 100%);z-index:1}
#app.duel::after{opacity:1}
#err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:#0b1410;z-index:50;font-weight:800;font-size:17px;line-height:1.35}
#err small{display:block;font-size:13px;opacity:.7;font-weight:700;margin-top:6px}
#err .cark{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,194,26,.25);border-top-color:#ffc21a;animation:don .8s linear infinite;margin-bottom:14px}
@keyframes don{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="satir">
      <div class="pill"><b id="hMac">1/8</b><s id="hRakip"></s></div>
      <div class="pill" id="skor"><span class="biz" id="sBiz">0</span><span id="ataklar"></span><span class="rak" id="sRak">0</span></div>
      <div class="pill" id="pPara"><i class="ik p"></i><b id="hPara">0</b></div>
    </div>
    <div class="satir" id="statlar">
      <div class="pill" id="st_cal">🌀 <b>50</b></div><div class="pill" id="st_hiz">💨 <b>50</b></div><div class="pill" id="st_guc">💪 <b>50</b></div><div class="pill" id="st_sut">🎯 <b>50</b></div><div class="pill" id="modlar"></div>
    </div>
  </div>
  <div id="damga"></div>
  <div id="ipuc"></div>
  <canvas id="cizim"></canvas>
  <div id="ucanlar"></div>
  <div id="kartAlan">
    <div id="kartIsik"></div>
    <div id="kart"></div>
    <div id="kartDug"><button class="sat" id="kSat">◀<small id="kSatF">sol</small></button><button class="kus" id="kKus">▶<small>sağ</small></button></div>
    <div id="kartIp">Sağa kaydır: kuşan · Sola: sat</div>
  </div>
  <div id="over"><div class="card" id="ekran"></div></div>
  <div id="err"></div>
</div>
<script>
/* Yukleme ekrani: hazir olunca kalkar; sadece gercek yukleme hatasinda "Tekrar dene". */
(function () {
  var e = document.getElementById('err'), t0 = Date.now(), hata = false;
  var hazir = function () { return window.G && window.G.hazir; };
  var goster = function (html) { e.innerHTML = html; e.style.display = 'flex'; };
  var dugme = '<button class="btn" style="margin-top:16px" onclick="location.reload()">Tekrar dene</button>';
  window.__yukHata = function () { if (hazir()) return; hata = true; goster('3D kütüphanesi yüklenemedi.<small>İnternet bağlantısını kontrol edip tekrar dene.</small>' + dugme); };
  addEventListener('error', function (ev) { if (ev.target && ev.target.tagName === 'SCRIPT') window.__yukHata(); }, true);
  addEventListener('unhandledrejection', function () { window.__yukHata(); });
  (function kontrol() {
    if (hazir()) { e.style.display = 'none'; return; }
    if (!hata) { var sn = (Date.now() - t0) / 1000;
      if (sn > 2) goster('<div class="cark"></div>Yükleniyor…' + (sn > 20 ? '<small>Bağlantı yavaş, biraz daha bekle</small>' : '') + (sn > 60 ? dugme : '')); }
    setTimeout(kontrol, 400);
  })();
})();
</script>
<script>
/* <<<MANTIK>>> */
/* Forvet Yolu -- oyun mantigi (DOM/three.js'e dokunmaz; botlar ayni kodu calistirir).
   Path of Kings x futbol: forvet yolda kendi kosar. Karsisina defanscilar cikar; her biri bir duello:
   defansci bir yana yuklenir (orta saha once aldatir), oyuncu ters yana kaydirarak calim atar.
   Gecilen defansci kart dusurur: kusan ya da sat. Yolun sonunda kaleci: yukari kaydirarak kose secilir.
   Mac = 3 atak; top kaybinda rakip kontra yapar. Sezon = 9 takimli lig, 8 hafta: her hafta bir rakiple oynanir, diger maclar
   guce gore simule edilir; puan tablosunda 1. biten sampiyon olur. */
const AYAR = {
  kosHiz: 6.5,            // m/s, hiz 50'de
  aralik: 15,             // iki defansci arasi yol (m)
  sutBolge: 28,           // kale cizgisine bu kadar kala sut acilir (kosarken)
  kapatma: 9,             // bu kadar yaklasip vurmazsan savunma/kaleci kapatir
  sonKosu: 30,            // son defanscidan kale cizgisine yol
  tetik: 7,               // defansciya bu kadar kala duello baslar
  sutMesafe: 12,          // kaleciye karsi sut noktasi (kale cizgisine uzaklik)
  kaleYari: 3.66,         // kale genisliginin yarisi (m)
  atakSay: 3, macSay: 8,
  gecis: 0.45,            // duello sonucu animasyon suresi (s)
  kayipBekle: 1.6, atakSonuBekle: 1.7,
};
const TIP = {
  bek: { ad: 'Bek', W: 0.40, aldat: false },            // cabuk karar verir
  orta: { ad: 'Orta Saha', W: 0.50, aldat: true },      // once ters yana aldatir
  stoper: { ad: 'Stoper', W: 0.46, aldat: false, ezilir: true },  // kaydirmazsan Guc ile ezip gecebilirsin
};
const SLOT = {
  krampon: { ad: 'Krampon', ana: 'hiz', yan: 'cal', adlar: ['Rüzgâr', 'Şimşek', 'Kadife', 'Çelik', 'Yıldız'] },
  forma: { ad: 'Forma', ana: 'guc', yan: 'cal', adlar: ['Demir', 'Kaptan', 'Sokak', 'Retro', 'Efsane'] },
  top: { ad: 'Top', ana: 'sut', yan: 'guc', adlar: ['Klasik', 'Ateş', 'Tüy', 'Roket', 'Altın'] },
};
const STAT_AD = { cal: 'Çalım', hiz: 'Hız', guc: 'Güç', sut: 'Şut' };
const NADIR = { bronz: { puan: [5, 9], fiyat: 6 }, gumus: { puan: [10, 15], fiyat: 14 }, altin: { puan: [16, 24], fiyat: 32 } };

function rnd(S) { S.rs = (S.rs + 0x6D2B79F5) >>> 0; let t = S.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const olay = (S, o) => S.olaylar.push(o);
const sinirla = (x, a, b) => Math.max(a, Math.min(b, x));

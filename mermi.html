<style>
html,body{margin:0;height:100%;background:#0d0f14;overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#eef3f8}
#app{position:relative;margin:0 auto;height:100%;width:min(100vw,calc(100vh * 0.5625));overflow:hidden;background:#0d0f14}

#vinyet{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px rgba(0,0,0,.75);opacity:.45;transition:opacity .25s}

.pill{background:rgba(18,24,34,.78);border:1px solid rgba(160,200,255,.18);border-radius:14px;padding:5px 12px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px}

#pBolum{pointer-events:auto;cursor:pointer}
#pBolum s{text-decoration:none;font-size:12px;opacity:.7;letter-spacing:.08em}
#sagUst{display:flex;gap:6px;align-items:center}
.mermiler{display:flex;gap:4px;align-items:center;height:20px}
.mermiler i{display:block;width:7px;height:17px;border-radius:4px 4px 2px 2px;background:linear-gradient(#ffe2a3,#d99a3e);box-shadow:0 0 6px rgba(255,180,90,.6)}

#bSes{pointer-events:auto;background:rgba(18,24,34,.78);border:1px solid rgba(160,200,255,.18);color:#eef3f8;border-radius:12px;width:38px;height:32px;font-size:16px;padding:0}
#hizRozet{position:absolute;right:12px;top:calc(54px + env(safe-area-inset-top,0px));background:#ffb457;color:#1a1206;font-weight:800;font-size:15px;border-radius:10px;padding:2px 10px;display:none;pointer-events:none;box-shadow:0 0 14px rgba(255,170,70,.6)}
#hizRozet.acik{display:block}

#kontrolKutu .et{font-size:12px;font-weight:800;letter-spacing:.14em;color:#8fb6d8;margin-bottom:4px;text-shadow:0 1px 4px rgba(0,0,0,.8)}

#nisan{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;opacity:.9;transition:transform .08s}

#nisan::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
#ipuc{position:absolute;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:800;font-size:17px;color:#e8f1f9;text-shadow:0 2px 8px rgba(0,0,0,.95);pointer-events:none;padding:0 16px}

#flas.ates{animation:flas .14s ease-out}

#damga{position:absolute;left:0;right:0;top:33%;text-align:center;font-weight:800;font-size:56px;letter-spacing:.06em;color:#fff;text-shadow:0 0 26px rgba(255,70,40,.95),0 4px 0 rgba(0,0,0,.6);pointer-events:none;opacity:0}

/* son yaklasma: kirmizi vinyet */

/* KIL PAYI */
#kilpayi{position:absolute;left:0;right:0;top:22%;text-align:center;font-weight:800;font-size:30px;letter-spacing:.12em;color:#fff;
  text-shadow:0 0 18px rgba(120,190,255,.95),0 3px 0 rgba(0,0,0,.6);pointer-events:none;opacity:0}
#kilpayi.zincir{color:#fff;text-shadow:0 0 20px rgba(255,70,40,.95),0 3px 0 rgba(0,0,0,.6)}
#kilpayi.masum{text-shadow:0 0 18px rgba(255,210,90,.95),0 3px 0 rgba(0,0,0,.6)}
#kilpayi.goster{animation:kilpayi .9s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes kilpayi{0%{opacity:0;transform:scale(1.8)}18%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.card .ist{display:block;margin-top:3px;font-size:13px;color:#9fb8cf;font-weight:700;letter-spacing:.02em}
#liste .toplam{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 2px;font-weight:800}
#liste .toplam span{font-size:18px;color:#eef3f8}
#liste .toplam b{color:#ffc445;font-size:17px}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const G = window.G = {};

/* <<<FIZIK>>> */
/* Merminin ucusu: sabit hizla ilerler, oyuncu sag/sol ve yukari/asagi cekerek
   yonunu buker. Bukme "kontrol yakiti" harciyor, bitince mermi duz gider --
   yani sinirsiz zikzak yok, rota bastan planlanmali.
   DOM'a dokunmayan saf fonksiyonlar: harness bu blogu oldugu gibi kesip
   calistiriyor, dolayisiyla dogrulanan sey ile oynanan sey ayni kod.
   Carpisma tek bir yerde (carp) -- oyun ve harness ikisi de onu cagiriyor. */
const ODA = { en: 30, boy: 62, yuk: 9 };          // x: -15..15, z: 0..-62, y: 0..9
/* donus ve yakit tahminle degil aranarak secildi. Once 2.7 rad/s + 2.4 sn idi:
   donus yaricapi 10 m oluyordu, yani bir saniye basili tutunca mermi 155 derece
   donup odadan cikiyordu -- 8 bolumun 5'i cozulemez haldeydi. 2.0 + 1.1'de her
   depo bolumu cozuluyor ve toplam donebilme 126 derece: mermiyi spiral
   yaptiramiyorsun, rotayi bastan planlaman gerekiyor. */
const MERMI = { hiz: 27, donus: 2.0, yakit: 1.1, r: 0.18, egimSinir: 0.7 };
const ATIS = { x: 0, y: 1.6, z: -1.5 };            // namlu agzi
/* Serbest nisan siniri: ekranda dokunulan yon bu acilarla kirpilir (odanin disina atis yok). */
const NISAN = { yaw: 1.0, pitch: 0.6 };
function nisanYonu(px, py, pz) {                    // namludan bir noktaya: {yaw, pitch}, kirpilmis
  const dx = px - ATIS.x, dy = py - ATIS.y, dz = pz - ATIS.z;
  return { yaw: Math.max(-NISAN.yaw, Math.min(NISAN.yaw, Math.atan2(dx, -dz))), pitch: Math.max(-NISAN.pitch, Math.min(NISAN.pitch, Math.atan2(dy, Math.hypot(dx, dz)))) };
}

/* Nesne kaliplari. Gorsel model de carpisma kutulari da bu olculerden uretiliyor,
   ikisi ayrisamasin diye. Her parca eksen hizali bir kutu: dy = tabandan merkez
   yuksekligi, dz = nesne merkezine gore boyuna kayma. Arabalar boyuna z ekseninde
   tanimli; dondur:true 90 derece cevirir, ters:true on-arka cevirir.
   tur: iskada hangi efektin cikacagi (yaprak, tas, metal...). */
const KALIP = {
  agac:     [{ dy: 1.35, ex: 0.28, ey: 1.35, ez: 0.28, tur: 'kutuk' }, { dy: 4.1, ex: 1.9, ey: 1.45, ez: 1.9, tur: 'yaprak' }],
  bufe:     [{ dy: 1.5, ex: 1.6, ey: 1.5, ez: 1.3, tur: 'ahsap' }],
  cesme:    [{ dy: 0.4, ex: 2.6, ey: 0.4, ez: 2.6, tur: 'tas' }, { dy: 1.6, ex: 0.35, ey: 1.2, ez: 0.35, tur: 'tas' }, { dy: 3.4, ex: 0.55, ey: 0.6, ez: 0.55, tur: 'tas' }],
  heykel:   [{ dy: 1.1, ex: 1.1, ey: 1.1, ez: 1.1, tur: 'tas' }, { dy: 3.2, ex: 0.5, ey: 1.0, ez: 0.5, tur: 'tas' }],
  bank:     [{ dy: 0.45, ex: 0.9, ey: 0.45, ez: 0.32, tur: 'ahsap' }],
  lamba:    [{ dy: 2.2, ex: 0.22, ey: 2.2, ez: 0.22, tur: 'metal' }],
  cop:      [{ dy: 0.45, ex: 0.28, ey: 0.45, ez: 0.28, tur: 'metal' }],
  cicek:    [{ dy: 0.25, ex: 1.4, ey: 0.25, ez: 0.6, tur: 'yaprak' }],
  varil:    [{ dy: 0.45, ex: 0.95, ey: 0.45, ez: 0.85, tur: 'metal' }],
  palet:    [{ dy: 0.6, ex: 0.6, ey: 0.6, ez: 0.5, tur: 'ahsap' }],
  forklift: [{ dy: 1.1, ex: 0.7, ey: 1.1, ez: 1.3, tur: 'metal' }],
  sutun:    [{ dy: 4.5, ex: 0.6, ey: 4.5, ez: 0.6, tur: 'tas' }],
  raf:      [{ dy: 2.4, ex: 0.55, ey: 2.4, ez: 2.4, tur: 'metal' }],
  kulube:   [{ dy: 1.25, ex: 0.9, ey: 1.25, ez: 0.9, tur: 'metal' }],
  sedan:    [{ dy: 0.475, ex: 0.9, ey: 0.475, ez: 2.2, tur: 'metal' }, { dy: 1.2, ex: 0.8, ey: 0.25, ez: 1.15, dz: -0.2, tur: 'cam' }],
  suv:      [{ dy: 0.55, ex: 0.95, ey: 0.55, ez: 2.35, tur: 'metal' }, { dy: 1.45, ex: 0.9, ey: 0.35, ez: 1.55, dz: -0.25, tur: 'cam' }],
  kamyonet: [{ dy: 0.7, ex: 1.05, ey: 0.7, ez: 2.7, tur: 'metal' }, { dy: 1.85, ex: 1.0, ey: 0.45, ez: 2.35, dz: -0.3, tur: 'metal' }],
  reklam:   [{ dy: 1.45, ex: 1.8, ey: 1.25, ez: 0.22, tur: 'metal' }],    // ayakli reklam panosu (alti 0.2 m bos)
  otomat:   [{ dy: 1.0, ex: 0.55, ey: 1.0, ez: 0.45, tur: 'metal' }],
  msutun:   [{ dy: 4.5, ex: 0.5, ey: 4.5, ez: 0.5, tur: 'tas' }],        // fayansli istasyon sutunu
};
function nesneKutulari(n) {
  let pr;
  if (n.tip === 'cit') pr = [{ dy: n.h / 2, ex: n.ex, ey: n.h / 2, ez: 0.55, tur: 'yaprak' }];
  else if (n.tip === 'duvar') pr = [{ dy: n.ey, ex: n.ex, ey: n.ey, ez: n.ez, tur: 'tas' }];
  else pr = KALIP[n.tip] || [];
  const taban = n.y || 0, sg = n.ters ? -1 : 1;
  return pr.map(p => { const dz = (p.dz || 0) * sg;

/* Yuruyen canlilar. Konumlari oyun saatinin deterministik fonksiyonu: harness
   ayni fonksiyonla, istedigi atis aninda ayni sahneyi kurabiliyor. Her grup yol
   noktasina gore yan/ileri kaymis dikey kapsullerden olusuyor. */
const CANLI = { insan: { r: 0.3, y0: 0.25, y1: 1.55 }, kedi: { r: 0.2, y0: 0.14, y1: 0.3 }, kopek: { r: 0.3, y0: 0.28, y1: 0.55 } };
const GRUP = {
  cift:    [{ tur: 'insan', yan: -0.36, ileri: 0 }, { tur: 'insan', yan: 0.36, ileri: 0 }],
  kisi:    [{ tur: 'insan', yan: 0, ileri: 0 }],
  sahipli: [{ tur: 'insan', yan: 0, ileri: 0 }, { tur: 'kopek', yan: 0.85, ileri: 0.7 }],
  kedi:    [{ tur: 'kedi', yan: 0, ileri: 0 }],
  kopek:   [{ tur: 'kopek', yan: 0, ileri: 0 }],
};
// Kose yuvarlatilmis dikdortgen yol: koselerde yon aniden donmesin (gorsel ve carpisma ayni yolu kullaniyor)
function dortgen(x0, z0, x1, z1, r, ters) {
  r = r || 1.1; const p = [], N = 5;
  const xa = Math.min(x0, x1), xb = Math.max(x0, x1), za = Math.min(z0, z1), zb = Math.max(z0, z1);
  for (const [cx, cz, a0] of [[xb - r, zb - r, Math.PI / 2], [xb - r, za + r, 0], [xa + r, za + r, -Math.PI / 2], [xa + r, zb - r, -Math.PI]])
    for (let k = 0; k <= N; k++) { const a = a0 - (k / N) * (Math.PI / 2); p.push([cx + r * Math.cos(a), cz + r * Math.sin(a)]); }
  return ters ? p.reverse() : p;
}
function yolKonum(yol, hiz, faz0, t) {
  if (!yol._uz) { let L = 0; yol._uz = [0];
    for (let i = 0; i < yol.length; i++) { const a = yol[i], b = yol[(i + 1) % yol.length]; L += Math.hypot(b[0] - a[0], b[1] - a[1]); yol._uz.push(L); } }
  const uz = yol._uz, L = uz[uz.length - 1], s = (((faz0 || 0) + hiz * t) % L + L) % L;
  let i = 0; while (i < yol.length - 1 && uz[i + 1] < s) i++;
  const a = yol[i], b = yol[(i + 1) % yol.length], seg = uz[i + 1] - uz[i] || 1, f = (s - uz[i]) / seg;
  return { x: a[0] + (b[0] - a[0]) * f, z: a[1] + (b[1] - a[1]) * f, yx: (b[0] - a[0]) / seg, yz: (b[1] - a[1]) / seg, s: (faz0 || 0) + hiz * t };
}
function canliGovdeler(c, t) {
  const k = yolKonum(c.yol, c.hiz, c.faz0, t);
  return GRUP[c.grup].map((g, i) => { const o = CANLI[g.tur];
    return { i, tur: g.tur, x: k.x + k.yz * g.yan + k.yx * g.ileri, z: k.z - k.yx * g.yan + k.yz * g.ileri, y0: o.y0, y1: o.y1, r: o.r }; });
}
/* Bir bolumde birden fazla dusman olabilir (zincirleme vurus): lv.dusmanlar; eski bolumler lv.dusman. */
const dusmanListesi = lv => lv.dusmanlar || [lv.dusman];
/* Rehine: dusmanin onunde duran sabit bir masum. Govdesi yuruyen insanlarla ayni kapsul. */
function rehineGovde(rh) { const o = CANLI.insan; return { i: 0, tur: 'insan', x: rh.x, z: rh.z, y0: o.y0, y1: o.y1, r: o.r }; }
function dusmanKonum(d, t) {
  if (!d.yol) return d;
  const k = yolKonum(d.yol, d.hiz, d.faz0, t);
  return { x: k.x, y: d.y, z: k.z, yx: k.yx, yz: k.yz, s: k.s };
}
/* Metro trenleri: raylar x ekseni boyunca, her periyotta bir gecis. Konum oyun saatinin
   deterministik fonksiyonu -- yuruyenler gibi harness ayni sahneyi her atis aninda kurar.
   Vagonlar arasi TREN.ara bos: oradan gecen mermi carpmaz (gorselde de kapali koruk yok). */
const TREN = { vagon: 7.2, ara: 1.1, en: 1.45, yuk: 3.4, taban: 0.15 };
const RAY_Z = [-19, -25];
function trenBoy(tr) { return tr.vagon * TREN.vagon + (tr.vagon - 1) * TREN.ara; }
function trenBas(tr, t) {                          // on ucun x'i; yon -1 aynalanmis
  const s = (((tr.faz0 || 0) + t) % tr.periyot + tr.periyot) % tr.periyot;
  return (-ODA.en / 2 - 12 + tr.hiz * s) * tr.yon;
}
function trenKutulari(tr, t) {
  const bas = trenBas(tr, t), k = [];
  for (let i = 0; i < tr.vagon; i++) { const m = bas - tr.yon * (i * (TREN.vagon + TREN.ara) + TREN.vagon / 2);
    if (Math.abs(m) < ODA.en / 2 + TREN.vagon) k.push({ x: m, y: TREN.taban + TREN.yuk / 2, z: tr.z, ex: TREN.vagon / 2, ey: TREN.yuk / 2, ez: TREN.en, tur: 'metal', tren: true }); }
  return k;
}
// Bolumun tum sabit carpisma kutulari: duz kutular + nesneler + bolge dekoru + yuksekteki hedefin iskelesi
function kutular(lv) {
  if (lv._kutu) return lv._kutu;
  const k = [];
  for (const e of lv.engeller || []) k.push(Object.assign({ tur: 'kutu' }, e));
  for (const n of lv.nesneler || []) k.push(...nesneKutulari(n));
  for (const n of (BOLGE[lv.bolge] || {}).nesneler || []) k.push(...nesneKutulari(n));
  for (const d of dusmanListesi(lv)) if (!d.yol && d.y > 3) k.push({ x: d.x, y: d.y - 1.95, z: d.z, ex: 1.7, ey: 0.25, ez: 1.7, tur: 'metal' });
  return (lv._kutu = k);
}
function engelde(x, y, z, engeller) {
  for (const e of engeller)
    if (Math.abs(x - e.x) < e.ex + MERMI.r && Math.abs(y - e.y) < e.ey + MERMI.r && Math.abs(z - e.z) < e.ez + MERMI.r) return e;
  return null;
}
/* Tek carpisma kontrolu. Sira: hedef, masumlar, sabit kutular, oda sinirlari. */
/* olu: bu ucusta/bolumde olmus dusmanlarin indisleri -- mermi olulerin icinden gecer. */
function carp(x, y, z, lv, t, olu) {
  const ds = dusmanListesi(lv);
  for (let i = 0; i < ds.length; i++) { if (olu && olu.has(i)) continue;
    const d = dusmanKonum(ds[i], t); if (Math.hypot(x - d.x, y - d.y, z - d.z) < ds[i].r + MERMI.r) return { tur: 'dusman', i }; }
  for (const c of lv.canlilar || []) for (const g of canliGovdeler(c, t)) {
    const yy = Math.max(g.y0, Math.min(g.y1, y));
    if (Math.hypot(x - g.x, y - yy, z - g.z) < g.r + MERMI.r) return { tur: 'masum', canli: c, govde: g };
  }
  for (let j = 0; j < (lv.rehineler || []).length; j++) { const g = rehineGovde(lv.rehineler[j]), yy = Math.max(g.y0, Math.min(g.y1, y));
    if (Math.hypot(x - g.x, y - yy, z - g.z) < g.r + MERMI.r) return { tur: 'masum', rehine: j, govde: g }; }
  const e = engelde(x, y, z, kutular(lv));
  if (e) return { tur: 'engel', e };
  for (const tr of lv.trenler || []) { const te = engelde(x, y, z, trenKutulari(tr, t)); if (te) return { tur: 'engel', e: te }; }
  if (Math.abs(x) > ODA.en / 2 || y < 0 || y > ODA.yuk || z < -ODA.boy || z > 1) return { tur: 'duvar' };
  return null;
}

/* girdi(t, durum) -> { yatay:-1..1, dikey:-1..1 }. t0: atis anindaki oyun saati. */
/* Mermi dusmani deler ve devam eder: hepsi vurulunca vurdu=true. vurulan: bu ucusta vurulanlar.
   onceOlu: onceki mermilerle olmus dusmanlar (bolum icinde). */
/* yon0: atis yonu {yaw, pitch} -- oyuncu nereye dokunduysa. Verilmezse duz ileri. */
function ucus(girdi, lv, sinir, t0, onceOlu, yon0) {
  t0 = t0 || 0;
  const olu = new Set(onceOlu || []), toplam = dusmanListesi(lv).length, vurulan = [];
  let x = ATIS.x, y = ATIS.y, z = ATIS.z, yaw = yon0 ? yon0.yaw : 0, pitch = yon0 ? yon0.pitch : 0, yakit = MERMI.yakit;
  const iz = [{ x, y, z, yaw, pitch }], dt = 1 / 120;
  for (let n = 0; n < 120 * (sinir || 8); n++) {
    const g = girdi(n * dt, { x, y, z, yaw, pitch, yakit, t: t0 + n * dt }) || {};
    let yt = Math.max(-1, Math.min(1, g.yatay || 0)), dk = Math.max(-1, Math.min(1, g.dikey || 0));
    const guc = Math.min(1, Math.hypot(yt, dk));
    if (yakit <= 0) { yt = 0; dk = 0; } else yakit = Math.max(0, yakit - guc * dt);
    yaw += yt * MERMI.donus * dt;
    pitch = Math.max(-MERMI.egimSinir, Math.min(MERMI.egimSinir, pitch + dk * MERMI.donus * dt));
    const c = Math.cos(pitch), adim = MERMI.hiz * dt;
    x += Math.sin(yaw) * c * adim; y += Math.sin(pitch) * adim; z -= Math.cos(yaw) * c * adim;
    if (n % 2 === 0) iz.push({ x, y, z, yaw, pitch });
    const k = carp(x, y, z, lv, t0 + (n + 1) * dt, olu);
    if (k && k.tur === 'dusman') { olu.add(k.i); vurulan.push(k.i);
      if (olu.size === toplam) return { vurdu: true, vurulan, sebep: 'dusman', carpan: k, iz, yakit, x, y, z };
      continue; }
    if (k) return { vurdu: false, vurulan, sebep: k.tur, carpan: k, iz, yakit, x, y, z };
  }
  return { vurdu: false, vurulan, sebep: 'sure', iz, yakit, x, y, z };
}

/* Oyun icindeki adimlama FIZIK blogundaki ucus() ile ayni denklemleri kullanir,

    const d = dusmanKonum(dm.d, saat), dx = d.x - M.x, dy = d.y - M.y, dz = d.z - M.z, L = Math.hypot(dx, dy, dz);

/* Kil payi: bir kutunun yuzeyine ya da bir masumun govdesine carpmadan cok yakin gecis.
   Her engel/govde ucus basina bir kez sayilir. */
function kilPayiKontrol() {
  if (M.t < 0.12) return;
  const kil = M.kil || (M.kil = new Set());
  for (const e of kutular(LV)) { if (kil.has(e)) continue;
    const dx = Math.max(0, Math.abs(M.x - e.x) - e.ex), dy = Math.max(0, Math.abs(M.y - e.y) - e.ey), dz = Math.max(0, Math.abs(M.z - e.z) - e.ez);
    if (dx * dx + dy * dy + dz * dz < KIL_PAYI * KIL_PAYI) { kil.add(e); kilPayi(false); return; } }
  (LV.trenler || []).forEach((tr, ti) => { trenKutulari(tr, saat).forEach((e, vi) => { const ad = 't' + ti + ':' + vi; if (kil.has(ad)) return;
    const dx = Math.max(0, Math.abs(M.x - e.x) - e.ex), dy = Math.max(0, Math.abs(M.y - e.y) - e.ey), dz = Math.max(0, Math.abs(M.z - e.z) - e.ez);
    if (dx * dx + dy * dy + dz * dz < KIL_PAYI * KIL_PAYI) { kil.add(ad); kilPayi(false); } }); });
  (LV.rehineler || []).forEach((rh, ri) => { const ad = 'r' + ri, b = rehineGovde(rh); if (kil.has(ad)) return;
    const yd = M.y < b.y0 ? b.y0 - M.y : M.y > b.y1 ? M.y - b.y1 : 0;
    if (yd < 0.4 && Math.hypot(M.x - b.x, M.z - b.z) - b.r < KIL_MASUM) { kil.add(ad); kilPayi(true); } });
  (LV.canlilar || []).forEach((c, ci) => { for (const b of canliGovdeler(c, saat)) { const ad = ci + ':' + b.i; if (kil.has(ad)) continue;
    const yd = M.y < b.y0 ? b.y0 - M.y : M.y > b.y1 ? M.y - b.y1 : 0;
    if (yd < 0.4 && Math.hypot(M.x - b.x, M.z - b.z) - b.r < KIL_MASUM) { kil.add(ad); kilPayi(true); } } });
}
function kilPayi(masum) {

  const d = $('kilpayi'); d.textContent = M.kilSay > 1 ? 'KIL PAYI ×' + M.kilSay : 'KIL PAYI!'; d.className = masum ? 'masum' : ''; void d.offsetWidth; d.classList.add('goster');

function mermiAdim(dt) {
  let yt = girdiYatay, dk = girdiDikey;
  const guc = Math.min(1, Math.hypot(yt, dk));
  if (M.yakit <= 0) { yt = 0; dk = 0; } else M.yakit = Math.max(0, M.yakit - guc * dt);
  M.yaw += yt * MERMI.donus * dt;
  M.pitch = Math.max(-MERMI.egimSinir, Math.min(MERMI.egimSinir, M.pitch + dk * MERMI.donus * dt));
  const c = Math.cos(M.pitch), adim = MERMI.hiz * dt;
  M.yol = (M.yol || 0) + adim; _onceki.set(M.x, M.y, M.z);
  M.x += Math.sin(M.yaw) * c * adim; M.y += Math.sin(M.pitch) * adim; M.z -= Math.cos(M.yaw) * c * adim;
  M.t += dt; M.iz.push({ x: M.x, y: M.y, z: M.z });
  if (M.iz.length > 400) M.iz.shift();
  const kb = $('kBar'); kb.firstElementChild.style.width = (M.yakit / MERMI.yakit * 100) + '%';
  kb.classList.toggle('bos', M.yakit <= 0.001);
  camKontrol(_onceki, _mSimdi.set(M.x, M.y, M.z), ileriYon(M.yaw, M.pitch, _mYon));
  const k = carp(M.x, M.y, M.z, LV, saat, olenler);
  if (!k) { if (M.t > 8) iska('sure', null); else kilPayiKontrol(); return; }
  if (k.tur === 'dusman') dusmanVurus(k.i);
  else if (k.tur === 'masum') masumVurus(k);
  else iska(k.tur, k.e || null);
}

<style>
:root{
  --bg:#14171C; --panel:#1D222A; --panel2:#262D36; --line:#333C47;
  --ink:#ECF0F4; --ink-soft:#9AA8B6; --ink-dim:#6B7887;
  --gold:#E8B84B; --gold-dk:#1A1305;
  --steel:#7E8A96; --steel-lo:#525C66;
  --ball:#FFF3D6;
  --ok:#4FC07E; --bad:#DE5A4E;
  --shadow:0 20px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(620px 340px at 50% 0%, rgba(232,184,75,.08), transparent 70%);
}
#app{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:7px 5px 12px}
.cab{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:8px 9px 10px;box-shadow:var(--shadow);position:relative;overflow:hidden}

.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:1px 3px 7px;
  border-bottom:1px solid var(--line)}
.stat{line-height:1.05}
.stat small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-dim)}
.stat b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .u{font-size:12px;font-weight:600;color:var(--ink-soft)}
.title{text-align:center;line-height:1.1}
.title b{font-size:12.5px;font-weight:800;letter-spacing:.02em}
.title small{display:block;font-size:8.5px;font-weight:600;color:var(--ink-dim);letter-spacing:.08em}

.stage{position:relative;margin-top:7px;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);background:#0C0F13;touch-action:none;cursor:crosshair}
#cv{display:block;margin:0 auto}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.pop{position:absolute;font-weight:800;font-size:14px;text-shadow:0 2px 7px rgba(0,0,0,.75);
  animation:popUp .8s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.pop.ok{color:#8CE8AE} .pop.gold{color:var(--gold)} .pop.bad{color:#FF9C93}
/* Zincir rozeti: normal pop 14px, bu %50 büyük. Vuruş anında okunması
   gereken tek sayı bu. */
.pop.zincir{font-size:21px;font-weight:800;letter-spacing:-.01em;
  text-shadow:0 2px 10px rgba(0,0,0,.85), 0 0 18px currentColor}
@keyframes popUp{0%{transform:translate(-50%,4px) scale(.7);opacity:0}
  22%{transform:translate(-50%,-6px) scale(1.12);opacity:1}
  100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
.stage.shake{animation:shk .28s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{0%,100%{transform:translate(0)}30%{transform:translate(-4px,2px)}
  65%{transform:translate(3px,-1px)}}

.row{display:flex;gap:6px;margin-top:8px}
button{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:12px;font-weight:800;padding:10px 6px;border-radius:10px;cursor:pointer}
button:hover:not(:disabled){background:#323B46;border-color:var(--steel-lo)}
button.go{background:var(--gold);color:var(--gold-dk);border-color:var(--gold)}
button.mini{flex:0 0 44px;padding:10px 0;font-size:14px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.foot{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);
  font-size:9.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-dim);
  display:flex;justify-content:space-between;gap:8px}

.ov{position:absolute;inset:0;background:rgba(17,20,25,.96);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:20px 18px;z-index:20}
.ov h2{font-weight:800;margin:0 0 4px;font-size:24px}
.ov.scroll{padding-top:16px}
.ov .big{font-size:38px;line-height:1;margin-bottom:2px}
.ov .sub{color:var(--ink-soft);font-size:12.5px;line-height:1.55;margin:0 0 12px;max-width:290px;
  font-weight:600}
.ov .num{font-size:42px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.ov .row{width:100%;max-width:290px;margin-top:12px}
.ov.scroll{justify-content:flex-start;overflow-y:auto}
.legend{display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px;margin:4px 0 8px}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line)}
.lrow p{margin:0;font-size:12px;line-height:1.45;color:var(--ink-soft);text-align:left;font-weight:600}
.lrow p b{color:var(--ink)}
.lart{flex:0 0 30px;text-align:center}
/* Kart ekranı: TEK SÜTUN, yatay düzen.
   İki sütuna sıkıştırdığımda açıklama 10 px'e iniyor, başlıklar sarıyor
   ve ekran okunmuyordu. Genişliği tek karta vermek yazıyı büyütüyor. */
.kartlar{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px;
  margin:10px 0 4px}
.kart{display:grid;grid-template-columns:42px 1fr;gap:11px;align-items:start;
  text-align:left;padding:12px 13px;border-radius:13px;
  background:var(--panel2);border:1px solid var(--line);cursor:pointer;color:var(--ink);
  transition:border-color .12s, background .12s, transform .12s}
.kart:hover,.kart:focus-visible{border-color:var(--gold);background:#2F3742;
  transform:translateY(-1px);outline:none}
.kart:active{transform:translateY(0)}
.kart .ki{display:flex;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:11px;font-size:21px;line-height:1;
  color:var(--gold);background:rgba(232,184,75,.11);border:1px solid rgba(232,184,75,.26)}
.kart .gov{min-width:0}
.kart b{display:block;font-size:15px;font-weight:800;line-height:1.2;margin-bottom:1px}
.kart .ust{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.kart small{font-size:9px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-dim)}
.kart .rozet{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);background:rgba(232,184,75,.13);border:1px solid rgba(232,184,75,.3);
  border-radius:999px;padding:2px 7px;white-space:nowrap}
/* Nadirlik: ölçülen güce göre. Kart kenarı ve ikon rengi kademeyi
   bir bakışta anlatsın. */
.kart.n1{border-color:rgba(120,190,255,.42)}
.kart.n1 .ki{color:#7FBCFF;background:rgba(127,188,255,.11);border-color:rgba(127,188,255,.3)}
.kart.n2{border-color:rgba(198,130,255,.5)}
.kart.n2 .ki{color:#C682FF;background:rgba(198,130,255,.12);border-color:rgba(198,130,255,.34)}
.kart .nd{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border-radius:999px;padding:2px 7px;white-space:nowrap}
.kart .nd1{color:#7FBCFF;background:rgba(127,188,255,.13);border:1px solid rgba(127,188,255,.32)}
.kart .nd2{color:#C682FF;background:rgba(198,130,255,.14);border:1px solid rgba(198,130,255,.36)}
.kart.n1:hover{border-color:#7FBCFF}
.kart.n2:hover{border-color:#C682FF}
.yeniden{margin-top:4px;width:100%;max-width:340px}
.kart .kat{font-size:8.5px;font-weight:800;color:#1A1305;background:var(--gold);
  border-radius:999px;padding:2px 7px;white-space:nowrap}
.kart p{margin:0;font-size:12.5px;line-height:1.5;color:#B9C6D4;font-weight:600}
@media (max-width:400px){
  .kart{grid-template-columns:38px 1fr;gap:10px;padding:11px}
  .kart .ki{width:38px;height:38px;font-size:19px}
  .kart b{font-size:14px} .kart p{font-size:12px}
}
.ic{width:22px;height:22px;display:inline-block;vertical-align:middle}
@media (max-width:430px){
  #app{padding:4px 3px 8px}
  .cab{padding:6px 7px 8px;border-radius:13px}
}
@media (prefers-reduced-motion:reduce){.pop,.stage{animation:none!important}}
.boot{position:fixed;left:10px;right:10px;top:10px;z-index:9999;padding:12px 14px;border-radius:10px;
  background:#3B1512;color:#FFD9D2;border:1px solid #A8422F;font-size:13px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.boot b{color:#fff}
</style>

<div id="app"><div class="cab" id="cab">
  <div class="hud">
    <span class="stat"><small>Top</small><b id="hBall">20</b></span>
    <span class="title"><b id="hAd">Mona Lisa</b><small id="hYazar">Leonardo da Vinci</small></span>
    <span class="stat" style="text-align:right"><small>Atış</small><b id="hTur">1</b></span>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="fx" id="fx"></div>
  </div>

  <div class="row">
    <button id="bFast" class="go">» Hızlandır</button>
    <button id="bNew" class="mini" title="Yeniden başla">↻</button>
    <button id="bHelp" class="mini" title="Nasıl oynanır">?</button>
  </div>

  <div class="foot"><span id="fLeft">DAWNBRIGHT · PROTOTİP</span><span id="fInfo">—</span></div>
</div></div>

<script>
(function(){
"use strict";

/* ═══════════════════ FİZİK — SAF, DOM YOK ═══════════════════
   Node testleri tam olarak bu bloğu kesip çalıştırır, böylece
   doğrulanan fizikle oynanan fizik ayrışamaz.                        */
/* <<<FIZIK>>> */
/* 22 sütun x 28 satır resim: DİKEY portre oranı. Kare ızgara gerçek
   Mona Lisa'yı (2:3) eziyordu; resimler artık tablodan örneklendiği
   için oran da doğru olmak zorunda.
   Hücre 24 -> 14 px küçüldüğü için top yarıçapı ve alt adım mesafesi
   de küçülmek ZORUNDA: aynı SUB=5 ile 14 px hücrede tünelleme başlar.
   Tahta 38 satır, yani inmeye 10 satır pay. Ölçüm: 6 satır payla bot
   hiç kazanamıyordu, 10 satırla kazanıyor. */
var COLS = 22, CELL = 14, BX = 36, BY = 12, ROWS = 46;
var BR = 2.9;                    /* top yarıçapı */
var SPD = 700;                   /* top hızı, px/sn */
var SUB = 2.4;                   /* bir alt adımda en fazla yol (px) */
var ATES_ARA = 0.055;            /* topların çıkış aralığı, sn */
var YER = BY + ROWS*CELL;        /* taban çizgisi = kaybetme çizgisi */
/* Toplar buradan çıkar ve buradan AŞAĞI geçince toplanır. İkisini de
   YER'e eşitlemiştim: top doğduğu karede ölüyordu, her atış 1.1 sn
   sürüyordu (yani 20 topun çıkış süresi) ve 0 blok kırılıyordu. */
var ATIS_Y = YER + 14, OLUM_Y = YER + 26;
var SOL = BX, SAG = BX + COLS*CELL, TAVAN = BY;
/* Topun sekme hakkı. 5'te atış başına 13 blok yıkılıyordu (can
   mekaniğinden önce 75'ti) ve tablo bitirilemiyordu. */
var TEMEL_CAN = 12;              /* topun sekme hakkı (can) */
/* Kaç blok kırılınca kart ekranı gelir. 40'ta tablo başına ~15 kart
   düşüyordu, yani sürekli kart seçiliyordu; 200 ile tablo başına ~3. */
/* Kaç blok kırılınca kart ekranı gelir. 40'ta sürekli kart seçiliyordu,
   200'de tablo başına ~3 kart kalıyordu — en eğlenceli sistem en kısa
   ömürlü olandı. 140 ile ~5 kart. */
var KART_ESIK = 140;
var REST_BASLA = 5;              /* restoratör bu turdan sonra başlar */
var REST_TAVAN = 5;              /* turda en fazla bu kadar kare onarır */
var SIKIS_SN = 1.4;              /* bu kadar süre dikey ilerlemezse müdahale */
var SIKIS_VY = 26;               /* "dikey ilerlemiyor" eşiği, px/sn */
/* Atış süresi tavanı. 13'te en uzun atış 10.5 sn sürüyordu; 5-6'da
   kuyruk 8 sn'ye iniyor ve hiçbir atış takılmıyor. */
var TUR_TAVAN = 6;               /* atış süresi tavanı, sn */

/* Hücre türleri */
var BOS = 0, RESIM = 1, CELIK = 2, HEDIYE = 3, ZIP = 4;

function hucre(tur, hp, renk){
  /* parla: vuruş parlaması (0..1, çizim katmanında sönümlenir) */
  return { tur:tur, hp:hp, renk:renk, vur:0, asit:0, ates:0, parla:0 };
}
/* Blok dayanıklılığı. Burada, fizik bloğunun İÇİNDE duruyor: oyun
   katmanında tutunca Node testi kendi kopyasını kullanıyor ve eski
   zorluğu ölçüyordu (bot 12/12 kazanıyor sanıldı).
   400 blok tek dayanıklılıkla dengelenmiyor: HP 1 çok kolay (7 tur),
   HP 2 kazanılamıyor. O yüzden FON ile FİGÜR ayrı: puslu manzara
   çabuk dağılır, figür direnir. Toplam HP ikisinin arasına düşüyor. */
function blokHp(no){ return Math.min(3, 1 + Math.floor(no/2)); }
function sertHp(no){
  /* Ilk tabloda sert bonusu YOK: olcumde sert+1 ile bot 1/6 kazaniyor
     ve 51 blok kaliyordu; bonussuz 6/6 ve 9 tur. Bonus sonraki
     tablolarda devreye giriyor, oyuncu da top devrettigi icin
     elinde daha cok topla karsiliyor. */
  return blokHp(no) + (no === 0 ? 0 : 1);
}

function mkBoard(){
  var g = new Array(COLS*ROWS), i;
  for(i=0;i<g.length;i++) g[i] = null;
  /* YARA HAFIZASI: yıkılan resim karelerinin rengi burada durur, tahta
     indikçe onunla birlikte iner. Restoratör bunlara bakarak tabloyu
     geri boyuyor. Diziye özellik takmak, bütün imzaları değiştirmemek
     için bilinçli bir tercih. */
  g.yara = new Array(COLS*ROWS);
  for(i=0;i<g.yara.length;i++) g.yara[i] = null;
  return g;
}
function al(g, c, r){
  if(c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
  return g[r*COLS + c];
}
function koy(g, c, r, h){
  if(c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  g[r*COLS + c] = h;
}
/* Tabloyu ızgaraya yerleştir (üstten hizalı).
   Blok canı TEK değer değil: palet koyudan açığa sıralı olduğu için
   rengin sıra numarası dayanıklılığı belirliyor. Koyu üçte bir (figür)
   en dayanıklı, açık üçte bir (fon) en zayıf. Böylece tabloda 1-2-3
   canlı bloklar doğal olarak dağılıyor ve figür direniyor. */
var PAL_SIRA = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
function blokCani(ch, palUzunluk, taban){
  var i = PAL_SIRA.indexOf(ch);
  if(i < 0 || palUzunluk < 2) return taban;
  var oran = i / (palUzunluk - 1);
  if(oran < 0.34) return taban + 2;
  if(oran < 0.67) return taban + 1;
  return taban;
}
function tabloYerlestir(g, px, pal, hp){
  var r, c, anahtar = [], k;
  for(k in pal) anahtar.push(k);
  for(r=0;r<px.length;r++){
    for(c=0;c<COLS;c++){
      var ch = px[r].charAt(c);
      if(ch === "." || ch === " ") continue;
      koy(g, c, r, hucre(RESIM, blokCani(ch, anahtar.length, hp), pal[ch] || "#888"));
    }
  }
  g.basBlok = resimKaldi(g);        /* son düzlük hesabı için */
}
function indir(g){
  var r, c, tasti = false;
  for(r = ROWS-1; r > 0; r--){
    for(c=0;c<COLS;c++){
      g[r*COLS+c] = g[(r-1)*COLS+c];
      if(g.yara) g.yara[r*COLS+c] = g.yara[(r-1)*COLS+c];
    }
  }
  for(c=0;c<COLS;c++){ g[c] = null; if(g.yara) g.yara[c] = null; }
  /* HEDIYE tasma sayilmaz: alta serptigim hediyeler asagi inip son
     satira varinca oyunu bitiriyordu ve tur sayisi 11'den 4'e dustu.
     Oyuncuyu odul oldurmemeli. */
  for(c=0;c<COLS;c++){
    var hh = g[(ROWS-1)*COLS+c];
    if(hh && hh.tur !== HEDIYE) tasti = true;
  }
  return tasti;
}
/* Üstteki boş satıra engel dizisi koy. */
function engelSatiri(g, tur, rnd){
  var c, kondu = 0;
  var yogun = Math.min(4, 1 + Math.floor(tur/3));
  for(c=0;c<COLS;c++){
    if(al(g, c, 0)) continue;
    if(rnd() < 0.10 + yogun*0.035){
      koy(g, c, 0, hucre(CELIK, Infinity, null));
      kondu++;
    }
  }
  /* Her satırda en az bir hediye: top sayısı büyümezse oyun tıkanır. */
  var dene = 0;
  while(dene < 30){
    c = Math.floor(rnd()*COLS);
    if(!al(g, c, 0)){ koy(g, c, 0, hucre(HEDIYE, 1, null)); break; }
    dene++;
  }
  /* ÜSTTEKİ hediye çoğu zaman ULAŞILAMAZ: tablo dolu bir dikdörtgen
     olduğu için topların değdiği tek yüzey resmin alt kenarı, hediye
     ise resmin üstünde kalıyor. Ölçümde 11 tur boyunca hiç hediye
     toplanmadı ve top sayısı hiç büyümedi. O yüzden resmin ALTINDAKİ
     boş alana da hediye koyuyoruz — topların gerçekten uçtuğu yere. */
  hediyeAlttaKoy(g, rnd, 4);
  /* Ara sıra zıplatıcı: topun yönünü sertçe değiştirir. */
  if(tur >= 4 && rnd() < 0.5){
    dene = 0;
    while(dene < 20){
      c = Math.floor(rnd()*COLS);
      if(!al(g, c, 0)){ koy(g, c, 0, hucre(ZIP, Infinity, null)); break; }
      dene++;
    }
  }
  return kondu;
}
/* ═══ RESTORATÖR ═══
   Tablo kendini onarır. Bu olmadan kaybetmek neredeyse imkânsızdı:
   kartsız bot 6/6 kazanıyordu, yani hiçbir karar gerçek risk
   taşımıyordu. Onarılan kareler 1 canla geri gelir — baskı olsun
   ama duvar olmasın.
   Öncelik: yaşayan resme KOMŞU yaralar. Böylece tablo kenarlarından
   içeri doğru iyileşir ve oyuncunun az önce temizlediği alt kenar
   geri gelir — asıl baskı burada. */
var SON_DUZLUK = 0.18;           /* bu orandan az kaldıysa restoratör durur */
function restoreAdet(g, tur, basla, tavan){
  if(tur < basla) return 0;
  /* SON DÜZLÜK. Bu koşul olmadan her oyun tam "tavan" kadar blok kala
     kilitleniyordu: oyuncu her şeyi kırıyor, restoratör tam o kadarını
     geri boyuyor ve kazanmak imkânsız oluyordu. Tablo bitmeye yakınsa
     restoratör pes eder — son düzlük bir koşuya dönüşür. */
  if(g && g.basBlok && resimKaldi(g) < g.basBlok*SON_DUZLUK) return 0;
  var a = Math.ceil((tur - basla + 1) / 2);
  return a > tavan ? tavan : a;
}
function komsuResimVar(g, c, r){
  var d = [[1,0],[-1,0],[0,1],[0,-1]], i;
  for(i=0;i<4;i++){
    var h = al(g, c + d[i][0], r + d[i][1]);
    if(h && h.tur === RESIM) return true;
  }
  return false;
}
function restoreEt(g, adet, rnd){
  if(!g.yara || adet <= 0) return [];
  var komsu = [], uzak = [], i;
  for(i=0;i<g.length;i++){
    if(!g.yara[i] || g[i]) continue;
    var c = i % COLS, r = Math.floor(i / COLS);
    if(r >= ROWS - 1) continue;                  /* taban çizgisine boyama */
    (komsuResimVar(g, c, r) ? komsu : uzak).push(i);
  }
  var havuz = komsu.length ? komsu : uzak;
  var yapilan = [];
  while(yapilan.length < adet && havuz.length){
    var k = Math.floor(rnd()*havuz.length);
    var idx = havuz.splice(k, 1)[0];
    g[idx] = hucre(RESIM, 1, g.yara[idx]);
    g[idx].parla = 1;
    g.yara[idx] = null;
    yapilan.push(idx);
  }
  return yapilan;
}

/* Resmin altındaki boş bölgeye hediye serp. */
function hediyeAlttaKoy(g, rnd, adet){
  var alt = enAltDolu(g);
  var bas = alt + 2;                     /* dolu bölgenin hemen altı */
  if(bas >= ROWS - 1) return 0;
  var kondu = 0, dene = 0;
  while(kondu < adet && dene < 60){
    dene++;
    var c = Math.floor(rnd()*COLS);
    var r = bas + Math.floor(rnd()*(ROWS - 1 - bas));
    if(al(g, c, r)) continue;
    koy(g, c, r, hucre(HEDIYE, 1, null));
    kondu++;
  }
  return kondu;
}
function resimKaldi(g){
  var i, n = 0;
  for(i=0;i<g.length;i++) if(g[i] && g[i].tur === RESIM) n++;
  return n;
}
/* En alttaki TEHLIKELI satir. Hediye sayilmaz (bkz. indir). */
function enAltDolu(g){
  var r, c;
  for(r = ROWS-1; r >= 0; r--)
    for(c=0;c<COLS;c++){
      var h = g[r*COLS+c];
      if(h && h.tur !== HEDIYE) return r;
    }
  return -1;
}

/* ═══ KARTLAR ═══
   Her kart bir sayı: kaç kez alındığı. Aynı kart yığılabilir. */
function bosKartlar(){
  return { sacilma:0, delici:0, patlayici:0, titanyum:0, mitoz:0, statik:0,
           agir:0, meditasyon:0, inatci:0, phoenix:0, buzul:0, kamikaze:0,
           hayalet:0, vampir:0, sonNefes:0, geriDonusum:0, asit:0, nekro:0,
           ritim:0, sansli7:0, ekTop:0 };
}
/* Topun en fazla canı. Şanslı 7 "diğer kartlar ne derse desin" diyor,
   o yüzden her şeyin önünde. */
function topMaxCan(K){
  if(!K) return TEMEL_CAN;
  if(K.sansli7) return 7;
  if(K.kamikaze) return 1;
  var m = TEMEL_CAN + K.titanyum*3 - K.sacilma - K.delici*2;
  return m < 1 ? 1 : m;
}
function topHizi(K){
  if(!K || !K.titanyum) return SPD;
  var h = SPD * Math.pow(0.68, K.titanyum);   /* ağırlaşır, yavaşlar */
  return h < 200 ? 200 : h;
}
function topAdedi(K, taban){
  if(!K) return taban;
  return taban + K.sacilma*2 + K.ekTop;
}

/* ---------- atış durumu ---------- */
function mkShot(g, x0, aci, adet, K, rnd){
  K = K || bosKartlar();
  var hiz = topHizi(K);
  return { g:g, K:K, rnd:rnd || Math.random,
           balls:[], bekleyen:topAdedi(K, adet), x0:x0, y0:ATIS_Y,
           aci:aci, hiz:hiz,
           vx:Math.cos(aci)*hiz, vy:Math.sin(aci)*hiz,
           t:0, sonrakiAtes:0, inenX:-1, biten:0, adet:topAdedi(K, adet),
           hediye:0, kirilan:0, yokEdilen:0, enZincir:0, bitti:false, zorla:false,
           havadaOlen:0, yeniTop:0, simsek:[] };
}
function topYap(S, x, y, vx, vy, can){
  var K = S.K;
  return { x:x, y:y, vx:vx, vy:vy, canli:true,
           can: can || topMaxCan(K),
           buz: K.buzul*2,              /* Buzul Zırh: ilk N çarpışma bedava */
           delindi: false,              /* Delici Uç: tek kullanımlık */
           zincir: 0,                   /* Ritim: duvarsız üst üste blok */
           bosSure: 0,                  /* Meditasyon: temassız süre */
           vurus: 0, sonC:-1, sonR:-1, zombi:false,
           dikeySure:0 };
}
function topEkle(S){
  var K = S.K, aci = S.aci;
  /* Saçılma: namludan fazladan top ve rastgele açı sapması */
  if(K.sacilma) aci += (S.rnd() - 0.5) * 0.30 * K.sacilma;
  S.balls.push(topYap(S, S.x0, S.y0, Math.cos(aci)*S.hiz, Math.sin(aci)*S.hiz));
}
/* Daire-dikdörtgen çarpışması: en yakın nokta + en sığ eksenden itme. */
function kutuCarp(b, rx, ry, rw, rh){
  var nx = b.x < rx ? rx : (b.x > rx+rw ? rx+rw : b.x);
  var ny = b.y < ry ? ry : (b.y > ry+rh ? ry+rh : b.y);
  var dx = b.x - nx, dy = b.y - ny;
  var d2 = dx*dx + dy*dy;
  if(d2 >= BR*BR) return null;
  if(d2 > 1e-9){
    var d = Math.sqrt(d2);
    return { nx:dx/d, ny:dy/d, derin:BR - d };
  }
  /* Merkez kutunun İÇİNDE: en sığ eksenden çıkar. Bu dal olmazsa top
     kutunun içinde kilitlenir. */
  var sol = b.x - rx, sag = rx + rw - b.x;
  var ust = b.y - ry, alt = ry + rh - b.y;
  var en = Math.min(sol, sag, ust, alt);
  if(en === sol) return { nx:-1, ny:0, derin:sol + BR };
  if(en === sag) return { nx: 1, ny:0, derin:sag + BR };
  if(en === ust) return { nx:0, ny:-1, derin:ust + BR };
  return { nx:0, ny:1, derin:alt + BR };
}
function yansit(b, n){
  b.x += n.nx * n.derin;
  b.y += n.ny * n.derin;
  var vn = b.vx*n.nx + b.vy*n.ny;
  if(vn < 0){ b.vx -= 2*vn*n.nx; b.vy -= 2*vn*n.ny; }
}
/* Hızı sabit tut: sekmeler hız kaybettirirse atışlar yavaşlar ve
   tur uzar. Yön değişir, büyüklük değişmez. */
function hiziSabitle(b){
  var s = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
  if(s < 1e-6){ b.vx = 0; b.vy = SPD; return; }
  b.vx = b.vx/s*SPD; b.vy = b.vy/s*SPD;
}
/* ═══ KART KURALLARI TEK YERDE ═══
   Yirmi kartın tamamı iki soruya iniyor: bu çarpışma topun kaç canını
   götürür, ve kaça hasar verir. Kuralları çarpışma kodunun içine
   serpiştirmek yerine burada topluyoruz — yoksa kartlar birbirini
   sessizce eziyor.                                                     */
/* buzEmer: bu çarpışmayı buz zırhı emebilir mi?
   Yalnız DUVAR ve ÇELİK. Her çarpışmayı emmesine izin verdiğimde kart
   ölüydü: top ortalama 2-3 çarpışma yapıp yere iniyor, ilk 2'si buza
   giderse hiç hasar vermiyor (ölçümde x4'te bile toplam 0 hasar).
   Kartın kendi metnindeki niyet "hasar almadan dar alanlara sokmak";
   duvar ve çelik zaten hasar vermeyen çarpışmalar, onları emmek gerçek
   bir kazanç. */
function buzEmer(h){ return !h || h.tur === CELIK; }
function canBedeli(S, b, duvarMi, deldi, h){
  var K = S.K;
  if(K.hayalet && duvarMi) return 0;     /* Hayalet Top: duvar can yemez */
  if(b.buz > 0 && buzEmer(h)) return 0;  /* Buzul Zırh: duvar/çelik bedava */
  if(deldi) return 0;                    /* Delici Uç: delmek can yemez */
  if(K.agir) return 1 + K.agir;          /* Ağır Metal: sert vurur, çok yer */
  return 1;
}
function hasarMiktari(S, b, h){
  var K = S.K;
  var d = 1;
  if(K.agir) d = 1 + K.agir;             /* Ağır Metal */
  if(K.kamikaze) d = 5;                  /* Kamikaze: tek atımlık ama sert */
  if(K.inatci && b.can <= 1 && d < 3) d = 3;      /* İnatçı: son vuruş */
  if(K.ritim && b.zincir >= 2 && d < 3) d = 3;    /* Ritim: 3. blok */
  if(h && h.asit) d += K.asit;           /* Asit Damlası */
  return d;
}
/* Bir hücreye hasar ver. Patlama, şimşek ve ateş de buradan geçiyor ki
   kırılan blok sayacı her yolda doğru işlesin. */
function hucreyeHasar(S, c, r, miktar, ev){
  var h = al(S.g, c, r);
  if(!h || h.tur !== RESIM || miktar <= 0) return false;
  h.hp -= miktar; h.vur = 1;
  h.parla = 1;                           /* vuruş parlaması */
  S.kirilan += miktar;
  var rx = BX + c*CELL, ry = BY + r*CELL;
  if(h.hp <= 0){
    S.g[r*COLS + c] = null;
    if(S.g.yara) S.g.yara[r*COLS + c] = h.renk;    /* restoratör için */
    S.yokEdilen++;
    ev.push(["kir", rx + CELL/2, ry + CELL/2, h.renk]);
    return true;
  }
  ev.push(["cat", rx + CELL/2, ry + CELL/2, h.renk]);
  return false;
}
function komsuHasar(S, x, y, kat, ev){
  var c0 = Math.floor((x - BX)/CELL), r0 = Math.floor((y - BY)/CELL), dc, dr;
  for(dr=-1; dr<=1; dr++)
    for(dc=-1; dc<=1; dc++){
      if(!dc && !dr) continue;
      hucreyeHasar(S, c0+dc, r0+dr, kat, ev);
    }
  ev.push(["patla", x, y]);
}
function rastgeleHucre(S){
  var aday = [], i;
  for(i=0;i<S.g.length;i++) if(S.g[i] && S.g[i].tur === RESIM) aday.push(i);
  if(!aday.length) return -1;
  return aday[Math.floor(S.rnd()*aday.length)];
}
function simsekCak(S, kat, ev){
  var i = rastgeleHucre(S);
  if(i < 0) return;
  var c = i % COLS, r = Math.floor(i / COLS);
  ev.push(["simsek", BX + c*CELL + CELL/2, BY + r*CELL + CELL/2]);
  hucreyeHasar(S, c, r, kat, ev);
}
/* Topun ölümü ve ölüm kartları. */
function topOldur(S, b, ev){
  if(!b.canli) return;
  b.canli = false;
  S.biten++;
  var K = S.K, i;
  var yerde = b.y - BR > OLUM_Y;
  if(yerde){ if(S.inenX < 0) S.inenX = b.x; }
  else S.havadaOlen++;

  if(K.patlayici) komsuHasar(S, b.x, b.y, K.patlayici, ev);
  if(K.statik){
    /* "hayatta kaldığı her 2 can için" -> yaptığı her 2 çarpışma */
    var adet = Math.floor(b.vurus/2) * K.statik;
    if(adet > 10) adet = 10;
    for(i=0;i<adet;i++) simsekCak(S, 1, ev);
  }
  if(K.phoenix && b.sonC >= 0){
    var h = al(S.g, b.sonC, b.sonR);
    if(h && h.tur === RESIM){ h.ates = 1; ev.push(["yak", b.x, b.y]); }
  }
  if(K.nekro && !b.zombi && S.balls.length < 300 && S.rnd() < 0.15*K.nekro){
    var z = topYap(S, b.x, b.y, -b.vx, -b.vy, 2);
    z.zombi = true;
    S.balls.push(z); S.adet++;
    ev.push(["zombi", b.x, b.y]);
  }
}
/* Son Nefes: tek canı kalan top, en yakın ZAYIF kareye çekilir. */
function sonNefesYonel(S, b){
  var enI = -1, enD = Infinity, enHp = Infinity, i;
  for(i=0;i<S.g.length;i++){
    var h = S.g[i];
    if(!h || h.tur !== RESIM) continue;
    var c = i % COLS, r = Math.floor(i / COLS);
    var dx = (BX + c*CELL + CELL/2) - b.x, dy = (BY + r*CELL + CELL/2) - b.y;
    var d = dx*dx + dy*dy;
    if(h.hp < enHp || (h.hp === enHp && d < enD)){ enHp = h.hp; enD = d; enI = i; }
  }
  if(enI < 0) return;
  var cc = enI % COLS, rr = Math.floor(enI / COLS);
  var tx = (BX + cc*CELL + CELL/2) - b.x, ty = (BY + rr*CELL + CELL/2) - b.y;
  var tl = Math.sqrt(tx*tx + ty*ty) || 1;
  var hiz = Math.sqrt(b.vx*b.vx + b.vy*b.vy) || S.hiz;
  /* yumuşak çekim: yön yavaşça hedefe döner */
  b.vx += (tx/tl*hiz - b.vx) * 0.16;
  b.vy += (ty/tl*hiz - b.vy) * 0.16;
}
function hiziKoru(S, b){
  var h = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
  if(h < 1e-6){ b.vx = 0; b.vy = S.hiz; return; }
  b.vx = b.vx/h*S.hiz; b.vy = b.vy/h*S.hiz;
}
function topAdim(S, b, dt, ev){
  var g = S.g, K = S.K;
  b.x += b.vx*dt;
  b.y += b.vy*dt;
  b.bosSure += dt;

  var carpti = false;

  /* --- duvarlar --- */
  var duvar = false;
  if(b.x - BR < SOL){ b.x = SOL + BR; b.vx = Math.abs(b.vx); duvar = true; }
  if(b.x + BR > SAG){ b.x = SAG - BR; b.vx = -Math.abs(b.vx); duvar = true; }
  if(b.y - BR < TAVAN){ b.y = TAVAN + BR; b.vy = Math.abs(b.vy); duvar = true; }
  if(duvar){
    carpti = true;
    b.zincir = 0;                        /* Ritim zinciri duvarda kopar */
    var bed = canBedeli(S, b, true, false, null);
    if(bed === 0 && b.buz > 0 && !K.hayalet) b.buz--;
    b.can -= bed;
    if(bed > 0) b.vurus++;
    if(b.can <= 0){ topOldur(S, b, ev); return; }
  }

  /* --- yere indi mi --- */
  if(b.y - BR > OLUM_Y){ topOldur(S, b, ev); return; }

  /* --- bloklar --- */
  var c0 = Math.floor((b.x - BR - BX)/CELL), c1 = Math.floor((b.x + BR - BX)/CELL);
  var r0 = Math.floor((b.y - BR - BY)/CELL), r1 = Math.floor((b.y + BR - BY)/CELL);
  var c, r;
  for(r = r0; r <= r1 && b.canli; r++){
    for(c = c0; c <= c1 && b.canli; c++){
      var h = al(g, c, r);
      if(!h) continue;
      var rx = BX + c*CELL, ry = BY + r*CELL;
      var nrm = kutuCarp(b, rx, ry, CELL, CELL);
      if(!nrm) continue;

      if(h.tur === HEDIYE){
        g[r*COLS + c] = null;
        S.hediye++;
        ev.push(["hediye", rx + CELL/2, ry + CELL/2]);
        continue;                        /* hediye sektirmez, can yemez */
      }

      carpti = true;
      ev.push(["vurus", b.x, b.y]);
      /* Delici Uç: ilk blokta sekme yok, can da gitmez */
      var deldi = (K.delici > 0 && !b.delindi && h.tur === RESIM);
      if(deldi) b.delindi = true;
      else yansit(b, nrm);

      if(h.tur === ZIP){
        b.vx += nrm.nx*S.hiz*0.55;
        b.vy += nrm.ny*S.hiz*0.55;
        h.parla = 1;
        ev.push(["zip", rx + CELL/2, ry + CELL/2]);
        b.zincir = 0;
      } else if(h.tur === RESIM){
        var d = hasarMiktari(S, b, h);
        var sonCan = b.can;
        var asitliydi = h.asit;
        b.sonC = c; b.sonR = r;
        b.zincir++;
        /* ZİNCİR: duvara değmeden üst üste kaç kareye vurdu. Beceriyi
           görünür kılan tek sayı bu — iyi nişan uzun zincir demek. */
        if(b.zincir > S.enZincir) S.enZincir = b.zincir;
        /* Eşik 3'te 40 atışın 35'inde rozet çıkıyordu, yani hep;
           medyan zincir 6, en çok 12. 4'ten başlatmak tırmanışı
           gösteriyor ama sıradanlaştırmıyor. */
        if(b.zincir >= 4) ev.push(["zincir", b.x, b.y, b.zincir]);
        var yikildi = hucreyeHasar(S, c, r, d, ev);
        if(!yikildi && K.asit){ var h2 = al(g, c, r); if(h2) h2.asit = 1; }
        if(asitliydi && !yikildi){ var h3 = al(g, c, r); if(h3) h3.asit = 0; }

        if(yikildi){
          /* Can Çalan */
          if(K.vampir && S.rnd() < 0.30*K.vampir && b.can < topMaxCan(K)) b.can++;
          /* Şanslı 7: 7. ve son çarpışmada kare yıkarsa 3 kare patlar */
          if(K.sansli7 && sonCan === 1){
            for(var q=0;q<3;q++) simsekCak(S, 99, ev);
          }
          /* Çoğalan Hücre */
          if(K.mitoz && S.balls.length < 300){
            var yari = Math.floor(b.can/2);
            if(yari >= 1){
              b.can = yari;
              var a2 = Math.atan2(b.vy, b.vx) + 0.55;
              var yt = topYap(S, b.x, b.y, Math.cos(a2)*S.hiz, Math.sin(a2)*S.hiz, yari);
              S.balls.push(yt); S.adet++;
              ev.push(["bol", b.x, b.y]);
            }
          }
        }
      } else {
        h.parla = 1;
        ev.push(["celik", rx + CELL/2, ry + CELL/2]);
        b.zincir = 0;
      }

      var bed2 = canBedeli(S, b, false, deldi, h);
      if(bed2 === 0 && b.buz > 0 && !deldi && buzEmer(h)) b.buz--;
      b.can -= bed2;
      if(bed2 > 0) b.vurus++;
      if(!deldi) hiziKoru(S, b);
      if(b.can <= 0){ topOldur(S, b, ev); return; }
    }
  }

  if(carpti) b.bosSure = 0;
  /* Meditasyon: 1 sn temassız süzülürse can kazanır */
  else if(K.meditasyon && b.bosSure >= 1){
    b.bosSure = 0;
    if(b.can < topMaxCan(K)) b.can++;
    ev.push(["med", b.x, b.y]);
  }
  /* Son Nefes */
  if(K.sonNefes && b.can <= 1) sonNefesYonel(S, b);
}
function stepShot(S, dt){
  var ev = [], i, k;
  if(S.bitti) return ev;
  S.t += dt;

  if(S.bekleyen > 0){
    S.sonrakiAtes -= dt;
    while(S.bekleyen > 0 && S.sonrakiAtes <= 0){
      topEkle(S);
      S.bekleyen--;
      S.sonrakiAtes += ATES_ARA;
      ev.push(["ates", S.x0, S.y0]);
    }
  }

  /* Süre tavanı: kalan toplar aşağı çekilir. Bu olmadan tek bir top
     yatay bir koridorda sonsuza kadar sekip turu kilitleyebilir. */
  if(S.t > TUR_TAVAN) S.zorla = true;
  /* KESİN sınır: zorlamalı iniş kapalı bir cepte hâlâ uzun sürebiliyor.
     Tavanın 4 sn ötesinde kalan toplar toplanır. */
  if(S.t > TUR_TAVAN + 4){
    for(i=0;i<S.balls.length;i++)
      if(S.balls[i].canli) topOldur(S, S.balls[i], ev);
    S.bekleyen = 0;
  }

  for(i=0;i<S.balls.length;i++){
    var b = S.balls[i];
    if(!b.canli) continue;

    if(S.zorla){
      b.vy += 900*dt;
      hiziKoru(S, b);
    } else {
      if(Math.abs(b.vy) < SIKIS_VY) b.dikeySure += dt;
      else b.dikeySure = 0;
      if(b.dikeySure > SIKIS_SN){
        b.vy += (b.vy >= 0 ? 1 : -1) * S.hiz * 0.5 * dt * 4;
        if(Math.abs(b.vy) < SIKIS_VY) b.vy = SIKIS_VY*2;
        hiziKoru(S, b);
      }
    }

    var hiz = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    var n = Math.ceil(hiz*dt / SUB);
    if(n < 1) n = 1;
    if(n > 40) n = 40;
    var sdt = dt/n;
    for(k=0;k<n && b.canli;k++) topAdim(S, b, sdt, ev);
  }

  /* Geri Dönüşüm: havada ölen her 4 top -> sonraki tura kalıcı +1 top */
  if(S.K.geriDonusum){
    var hak = Math.floor(S.havadaOlen / 4) * S.K.geriDonusum;
    if(hak > S.yeniTop){ S.yeniTop = hak; }
  }

  if(S.bekleyen === 0 && S.biten >= S.adet) S.bitti = true;
  return ev;
}
/* Alevden Doğan: yanan kareler her TUR 1 hasar alır. */
function atesleriIsle(g){
  var i, yikilan = 0;
  for(i=0;i<g.length;i++){
    var h = g[i];
    if(!h || h.tur !== RESIM || !h.ates) continue;
    h.hp--; h.vur = 1;
    if(h.hp <= 0){ g[i] = null; yikilan++; }
  }
  return yikilan;
}
/* Nişan önizlemesi: duvardan bir sekme. */
function nisanYolu(x0, y0, aci, uzunluk){
  var vx = Math.cos(aci), vy = Math.sin(aci);
  var yol = [[x0, y0]];
  var x = x0, y = y0, kalan = uzunluk, sekti = 0, adim;
  while(kalan > 0 && sekti < 2){
    var tx = Infinity, ty = Infinity;
    if(vx > 1e-6) tx = (SAG - BR - x)/vx;
    else if(vx < -1e-6) tx = (SOL + BR - x)/vx;
    if(vy < -1e-6) ty = (TAVAN + BR - y)/vy;
    var t = Math.min(tx, ty, kalan);
    x += vx*t; y += vy*t; kalan -= t;
    yol.push([x, y]);
    if(t === tx && tx < ty){ vx = -vx; sekti++; }
    else if(t === ty){ vy = -vy; sekti++; }
    else break;
  }
  return yol;
}

function hazir(ad){ return IMG[ad] && IMG[ad].complete && IMG[ad].naturalWidth; }

/* ═══════════════════ OYUN ═══════════════════ */
var LW = 380, LH = 700;
var LS_BEST = "dbg.tablo.rekor";
function el(id){ return document.getElementById(id); }

var cv, ctx, raf = null, lastTs = 0, scale = 1, tms = 0;
var g = null, S = null, tabloNo = 0, tur = 1, toplar = 20;
var nisanX = BX + COLS*CELL/2, aci = -Math.PI/2;
var nisan = null, durum = "nisan";   /* nisan | atis | ara | bitti */
var paused = false, hizli = false, parca = [], sarsinti = 0;
var KART = bosKartlar(), kirilanToplam = 0, kartBorcu = 0, kartVerilen = 0, kartYenile = 2;
var enIyiAtis = 0, enIyiZincir = 0;   /* tablo başına en iyi atış */
/* Yeteneklerin görselleri. Her biri {tip, x, y, t, sure, ...}; loop'ta
   yaşlanır, draw'da çizilir. */
var efekt = [];
function efektEkle(tip, x, y, ek){
  var e = { tip:tip, x:x, y:y, t:0, sure:ek && ek.sure || 0.4 };
  if(ek) for(var k in ek) if(k !== "sure") e[k] = ek[k];
  efekt.push(e);
  if(efekt.length > 160) efekt.splice(0, efekt.length - 160);
}

function rekor(){ try{ return parseInt(localStorage.getItem(LS_BEST), 10) || 0; }catch(e){ return 0; } }
function rekorYaz(v){ try{ if(v > rekor()) localStorage.setItem(LS_BEST, String(v)); }catch(e){} }

function tabloBasla(no, devirTop){
  tabloNo = no % TABLOLAR.length;
  var T = TABLOLAR[tabloNo];
  g = mkBoard();
  /* Dayanıklılık ölçümle seçildi: HP 2'de bot 8/8 kazanıyor ve oyun
     5 turda bitiyor (çok kolay), HP 3'te 7/8 ve 8 tur, HP 5'te hiç
     kazanılmıyor. Sonraki tablolar sertleşir ama oyuncu topları
     DEVREDER — yoksa HP 4-5 kazanılamaz. */
  /* T.sert / sertHp artik kullanilmiyor: blok cani palet sirasindan
     geliyor. Eski argumanlari birakmak yeni imzada T.sert'i rnd
     yerine geciriyordu ve rnd() patlardi. */
  tabloYerlestir(g, T.px, T.pal, blokHp(no));
  tur = 1;
  toplar = devirTop ? Math.max(20, devirTop) : 20;
  /* KARTLAR HER TABLODA SIFIRLANIR. Tablolar arası taşındığında güç
     sonsuza kadar birikiyordu; her tablo kendi destesini sıfırdan
     kuruyor. Toplar devredilmeye devam ediyor — o ilerleme hissi
     kalsın diye. */
  KART = bosKartlar();
  kirilanToplam = 0; kartVerilen = 0; kartBorcu = 0; kartYenile = 2;
  enIyiAtis = 0; enIyiZincir = 0;
  nisanX = BX + COLS*CELL/2;
  durum = "nisan"; S = null; parca = [];
  el("hAd").textContent = T.ad;
  el("hYazar").textContent = T.yazar;
  renderHud();
}
function yeniOyun(){ tabloBasla(0); hideOverlay(); showIntro(); }

function atesle(a){
  aci = a;
  S = mkShot(g, nisanX, aci, toplar, KART, Math.random);
  durum = "atis";
  renderHud();
}
function turBitti(){
  var T = TABLOLAR[tabloNo];

  /* ATIŞ ÖZETİ: kaç blok, en uzun zincir, rekor kırıldı mı.
     Ölçümde iyi nişan atış başına %58 daha verimli ama oyuncu bunu
     hiç göremiyordu; bu özet o farkı hissedilir kılıyor. */
  var yik = S.yokEdilen || 0, zin = S.enZincir || 0;
  var rekor = yik > enIyiAtis;
  if(rekor) enIyiAtis = yik;
  if(zin > enIyiZincir) enIyiZincir = zin;
  var ozet = yik + " blok" + (zin >= 4 ? "  ·  zincir ×" + zin : "");
  popAt(BX + COLS*CELL/2, YER - 52, rekor && yik > 0 ? "gold" : "ok",
        (rekor && yik > 0 ? "★ " : "") + ozet);
  if(rekor && yik > 0 && yik >= 8) sarsinti = 0.14;

  toplar += S.hediye + (S.yeniTop || 0);       /* Geri Dönüşüm dahil */
  if(S.inenX >= 0) nisanX = Math.max(SOL + BR + 2, Math.min(SAG - BR - 2, S.inenX));
  if(S.hediye) popAt(nisanX, YER - 20, "gold", "+" + S.hediye + " top");
  if(S.yeniTop) popAt(nisanX, YER - 40, "ok", "+" + S.yeniTop + " geri dönüşüm");

  /* Alevden Doğan: yanan kareler her tur hasar alır */
  var yanan = atesleriIsle(g);

  /* RESTORATÖR: tablo kendini onarır. Gerçek tehdit bu. */
  var onarilan = restoreEt(g, restoreAdet(g, tur, REST_BASLA, REST_TAVAN), Math.random);
  if(onarilan.length){
    popAt(BX + COLS*CELL/2, BY + 18, "bad", "restorasyon +" + onarilan.length);
    for(var oi=0; oi<onarilan.length; oi++){
      var oc = onarilan[oi] % COLS, orr = Math.floor(onarilan[oi] / COLS);
      efektEkle("halka", BX + oc*CELL + CELL/2, BY + orr*CELL + CELL/2,
                { renk:"222,90,78", r:16, sure:0.5 });
    }
  }

  /* KART SAYACI: kırılan her KART_ESIK blok bir kart seçimi kazandırır */
  kirilanToplam += (S.yokEdilen || 0) + yanan;
  var hakEdilen = Math.floor(kirilanToplam / KART_ESIK);
  if(hakEdilen > kartVerilen){
    kartBorcu += hakEdilen - kartVerilen;
    kartVerilen = hakEdilen;
  }

  if(resimKaldi(g) === 0){
    rekorYaz(tabloNo + 1);
    durum = "bitti";
    setTimeout(function(){ showKazandi(); }, 420);
    return;
  }
  /* tablo iner, üstten yeni engeller girer */
  var tasti = indir(g);
  engelSatiri(g, tur, Math.random);
  tur++;
  if(tasti || enAltDolu(g) >= ROWS-1){
    durum = "bitti";
    setTimeout(function(){ showKaybettin(); }, 420);
    return;
  }
  durum = "nisan"; S = null;
  renderHud();
  if(kartBorcu > 0) showKart();
}

/* ---------- girdi ---------- */
function pt(ev){
  var r = cv.getBoundingClientRect();
  var t = (ev.touches && ev.touches[0]) || ev;
  return { x:(t.clientX - r.left)/(r.width/LW), y:(t.clientY - r.top)/(r.height/LH) };
}
function aciHesapla(p){
  var dx = p.x - nisanX, dy = p.y - (YER + 12);
  var a = Math.atan2(dy, dx);
  /* yukarı doğru, yataya 12° kala sınırla */
  var enAz = -Math.PI + 0.21, enCok = -0.21;
  if(a > 0) a = (p.x < nisanX) ? enAz : enCok;
  if(a < enAz) a = enAz;
  if(a > enCok) a = enCok;
  return a;
}
function onDown(ev){
  ev.preventDefault();
  if(paused || durum !== "nisan") return;
  nisan = aciHesapla(pt(ev));
}
function onMove(ev){
  if(paused || durum !== "nisan" || nisan === null) return;
  ev.preventDefault();
  nisan = aciHesapla(pt(ev));
}
function onUp(){
  if(durum !== "nisan" || nisan === null) return;
  var a = nisan; nisan = null;
  atesle(a);
}

/* ---------- döngü ---------- */
function loop(ts){
  raf = requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  var dt = Math.min(0.026, (ts - lastTs)/1000);
  lastTs = ts; tms = ts;

  if(!paused && durum === "atis" && S){
    var kez = hizli ? 3 : 1, i, k;
    for(i=0;i<kez;i++){
      var ev = stepShot(S, dt);
      for(k=0;k<ev.length;k++) onEvent(ev[k]);
      if(S.bitti) break;
    }
    if(S.bitti){ durum = "ara"; setTimeout(turBitti, 180); }
    renderHud();
  }
  for(var j=parca.length-1;j>=0;j--){
    var q = parca[j];
    q.life -= dt; q.vy += 900*dt;
    q.x += q.vx*dt; q.y += q.vy*dt; q.r += q.dr*dt;
    if(q.life <= 0) parca.splice(j, 1);
  }
  /* TOP İZİ: her karede konum kaydediliyor, çizimde soluklaşan bir
     kuyruk oluyor. Sunum verisi, fiziğe dokunmuyor. */
  if(S && !paused && durum === "atis"){
    for(j=0;j<S.balls.length;j++){
      var bz = S.balls[j];
      if(!bz.canli){ bz.iz = null; continue; }
      if(!bz.iz) bz.iz = [];
      bz.iz.push(bz.x, bz.y);
      if(bz.iz.length > 16) bz.iz.splice(0, bz.iz.length - 16);
    }
  }
  for(j=efekt.length-1;j>=0;j--){
    efekt[j].t += dt;
    if(efekt[j].t >= efekt[j].sure) efekt.splice(j, 1);
  }
  /* hücre vuruş parlamalarını söndür */
  if(g) for(j=0;j<g.length;j++) if(g[j] && g[j].parla > 0){
    g[j].parla -= dt*3.4;
    if(g[j].parla < 0) g[j].parla = 0;
  }
  if(sarsinti > 0) sarsinti -= dt;
  draw();
}
function onEvent(e){
  var t = e[0];
  if(t === "kir"){
    patlat(e[1], e[2], e[3], 8);
    efektEkle("kir", e[1], e[2], { renk:e[3], sure:0.34 });
  }
  else if(t === "cat"){ patlat(e[1], e[2], e[3], 2); }
  else if(t === "vurus"){ efektEkle("vurus", e[1], e[2], { sure:0.20 }); }
  else if(t === "hediye"){
    popAt(e[1], e[2], "gold", "+1");
    patlat(e[1], e[2], "#E8B84B", 6);
    efektEkle("halka", e[1], e[2], { renk:"232,184,75", r:20, sure:0.4 });
  }
  else if(t === "zip"){
    patlat(e[1], e[2], "#4FC07E", 4);
    efektEkle("halka", e[1], e[2], { renk:"79,192,126", r:22, sure:0.35 });
  }
  else if(t === "celik"){ patlat(e[1], e[2], "#9AA8B6", 2); }
  else if(t === "zincir"){                      /* duvarsız üst üste vuruş */
    var z = e[3];
    popAt(e[1], e[2] - 10, (z >= 8 ? "gold" : "ok") + " zincir", "×" + z);
    efektEkle("halka", e[1], e[2], {
      renk: z >= 8 ? "232,184,75" : "140,232,174", r: 10 + z*2, sure:0.34 });
  }
  else if(t === "patla"){                       /* Patlayıcı Son */
    efektEkle("patlama", e[1], e[2], { sure:0.42 });
    patlat(e[1], e[2], "#FF9C4A", 12);
    sarsinti = 0.16;
  }
  else if(t === "simsek"){                      /* Statik Yük / Şanslı 7 */
    efektEkle("simsek", e[1], e[2], { sure:0.30, kirik:simsekYolu(e[1], e[2]) });
    patlat(e[1], e[2], "#BFE6FF", 6);
  }
  else if(t === "yak"){                         /* Alevden Doğan */
    efektEkle("halka", e[1], e[2], { renk:"255,140,60", r:18, sure:0.5 });
    patlat(e[1], e[2], "#FF8C3C", 7);
  }
  else if(t === "bol"){                         /* Çoğalan Hücre */
    efektEkle("bol", e[1], e[2], { sure:0.38 });
    patlat(e[1], e[2], "#7FE3FF", 6);
  }
  else if(t === "zombi"){                       /* Nekromansi */
    efektEkle("halka", e[1], e[2], { renk:"120,220,120", r:16, sure:0.45 });
    patlat(e[1], e[2], "#78DC78", 7);
  }
  else if(t === "med"){                         /* Meditasyon */
    efektEkle("halka", e[1], e[2], { renk:"235,245,255", r:14, sure:0.5 });
  }
}
/* Şimşek için kırık çizgi: tavandan hedefe. */
function simsekYolu(x, y){
  var yol = [[x + (Math.random()-0.5)*40, BY]], i;
  var adim = 5;
  for(i=1;i<adim;i++){
    var k = i/adim;
    yol.push([x + (yol[0][0] - x)*(1-k) + (Math.random()-0.5)*22,
              BY + (y - BY)*k]);
  }
  yol.push([x, y]);
  return yol;
}
function patlat(x, y, renk, n){
  for(var i=0;i<n;i++)
    parca.push({ x:x, y:y, vx:(Math.random()-0.5)*200, vy:(Math.random()-0.7)*220,
                 r:2 + Math.random()*2.4, dr:-2, life:0.35 + Math.random()*0.35,
                 renk:renk || "#DCB78E" });
}

/* ---------- HUD ---------- */
function renderHud(){
  el("hBall").textContent = (durum === "atis" && S)
    ? (S.adet - S.biten) : topAdedi(KART, toplar);
  el("hTur").textContent = tur;
  var kalanKart = KART_ESIK - (kirilanToplam % KART_ESIK);
  var rest = restoreAdet(g, tur, REST_BASLA, REST_TAVAN);
  /* "can" yalnız kartlar onu DEĞİŞTİRDİĞİNDE yazılıyor: alt satır zaten
     dolu, taban değer her turda yer kaplamasın. */
  var mc = topMaxCan(KART);
  el("fInfo").textContent = resimKaldi(g) + " blok" +
    (mc !== TEMEL_CAN ? " · can " + mc : "") +
    (enIyiAtis ? " · en iyi atış " + enIyiAtis : "") +
    (enIyiZincir >= 4 ? " (×" + enIyiZincir + ")" : "") +
    (rest ? " · restorasyon +" + rest : "") +
    " · kart " + kalanKart;
  var sahip = [], i;
  for(i=0;i<KART_LISTE.length;i++){
    var sy = KART[KART_LISTE[i].k];
    if(sy) sahip.push(KART_LISTE[i].ikon + "︎" + (sy > 1 ? sy : ""));
  }
  el("fLeft").textContent = sahip.length ? sahip.join(" ")
    : (FIRLATICI_AD[tabloNo % FIRLATICI_AD.length] || "DAWNBRIGHT · PROTOTİP");
}

/* ---------- çizim ---------- */
/* Blok üstündeki sayının okunması için: açık blokta koyu, koyu blokta
   açık mürekkep. Sabit renk seçince tablonun yarısında sayı kayboluyor. */
var CAN_YAZ = false;             /* blok canını rakamla da yaz */
function parlaklik(hex){
  var r = parseInt(hex.substr(1,2),16), g2 = parseInt(hex.substr(3,2),16),
      b = parseInt(hex.substr(5,2),16);
  return (0.299*r + 0.587*g2 + 0.114*b)/255;
}
function koyulastir(hex, k){
  var r = Math.round(parseInt(hex.substr(1,2),16)*k),
      g2 = Math.round(parseInt(hex.substr(3,2),16)*k),
      b = Math.round(parseInt(hex.substr(5,2),16)*k);
  return "rgb(" + r + "," + g2 + "," + b + ")";
}
function aclastir(hex, k){
  var r = parseInt(hex.substr(1,2),16), g2 = parseInt(hex.substr(3,2),16),
      b = parseInt(hex.substr(5,2),16);
  return "rgb(" + Math.round(r+(255-r)*k) + "," + Math.round(g2+(255-g2)*k) +
         "," + Math.round(b+(255-b)*k) + ")";
}
/* Dayanıklılığı ÖNCE görsel olarak, sonra sayıyla anlatıyoruz.
   İlk sürümde 128 bloğun hepsinde kalın beyaz bir "3" vardı ve tablo
   hiç okunmuyordu — oyunun bütün fikri tabloyu görmek olduğu için bu
   ölümcül. Şimdi sağlam blok koyu bir tabaka altında, kırıldıkça
   gerçek rengi ortaya çıkıyor ve çatlıyor; sayı yalnızca soluk bir
   ipucu.                                                              */
function cizResim(h, x, y){
  var renk = h.renk || "#8a8a8a";
  /* Hücrenin TAMAMINI doldur. Önce CELL-1 boyutunda doldurup 2 px üst ve
     2 px alt kabartma çiziyordum: 14 px hücrede bu, alanın %29'u demek
     ve tablonun rengini eziyordu — örnekleyicinin düz renkli önizlemesi
     oyundan çok daha iyi görünüyordu. Blok hissi artık yalnızca 1 px'lik
     kenar çizgisinden geliyor. */
  ctx.fillStyle = renk;
  ctx.fillRect(x, y, CELL, CELL);
  /* sağlamlık tabakası: hp düştükçe incelir, resim açılır */
  /* Kademeler belirginleşsin: can bilgisi artık ağırlıklı olarak
     buradan okunuyor. */
  var kat = Math.max(0, Math.min(1, (h.hp - 1) / 3));
  if(kat > 0){
    ctx.fillStyle = "rgba(8,10,14," + (0.06 + kat*0.34).toFixed(3) + ")";
    ctx.fillRect(x, y, CELL, CELL);
  }
  ctx.fillStyle = "rgba(255,255,255,.10)";
  ctx.fillRect(x, y, CELL, 1);
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.fillRect(x, y + CELL - 1, CELL, 1);
  ctx.fillRect(x + CELL - 1, y, 1, CELL);
  /* hasar: çatlaklar */
  if(h.vur){
    ctx.strokeStyle = "rgba(255,255,255,.34)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x+3, y+CELL*0.28); ctx.lineTo(x+CELL*0.46, y+CELL*0.54);
    ctx.lineTo(x+CELL*0.28, y+CELL-4);
    ctx.moveTo(x+CELL-4, y+CELL*0.38); ctx.lineTo(x+CELL*0.58, y+CELL*0.6);
    ctx.stroke();
  }
  /* ASİT: yeşil sızıntı */
  if(h.asit){
    ctx.fillStyle = "rgba(120,220,90,.30)";
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = "rgba(150,255,110,.75)";
    ctx.fillRect(x + CELL*0.24, y + CELL - 4, 2, 3);
    ctx.fillRect(x + CELL*0.62, y + CELL - 3, 2, 2);
  }
  /* ATEŞ: titreşen turuncu */
  if(h.ates){
    var alev = 0.28 + 0.22*Math.sin(tms/90 + x*0.7 + y*0.5);
    ctx.fillStyle = "rgba(255,120,40," + alev.toFixed(3) + ")";
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = "rgba(255,210,90,.7)";
    ctx.fillRect(x + CELL*0.35, y + 1, 2, 3);
  }
  /* VURUŞ PARLAMASI: taze vuruş beyaz parlar */
  if(h.parla > 0){
    ctx.fillStyle = "rgba(255,255,255," + (h.parla*0.55).toFixed(3) + ")";
    ctx.fillRect(x, y, CELL, CELL);
  }
  /* Blok canı RAKAMLA değil koyuluk tabakasıyla anlatılıyor. hp>=3
     koşuluyla açtığımda blokların üçte biri rakam taşıyordu (~200 sayı)
     ve tabloyu boğuyordu — oyunun bütün fikri tabloyu görmek.
     Rakamı geri istersen CAN_YAZ'ı true yap. */
  if(CAN_YAZ && h.hp >= 3){
    ctx.font = "600 8px Archivo, system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = parlaklik(renk)*(1-kat*0.5) > 0.45
      ? "rgba(18,21,26,.40)" : "rgba(255,255,255,.40)";
    ctx.fillText(String(h.hp), x + CELL/2 - 0.5, y + CELL/2);
    ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
  }
}
function cizCelik(x, y){
  ctx.fillStyle = "#6B7681";
  ctx.fillRect(x, y, CELL, CELL);
  ctx.fillStyle = "rgba(255,255,255,.16)";
  ctx.fillRect(x, y, CELL, 1);
  ctx.fillStyle = "rgba(0,0,0,.30)";
  ctx.fillRect(x, y + CELL - 1, CELL, 1);
  ctx.fillRect(x + CELL - 1, y, 1, CELL);
  /* perçinler: çeliği tablodan ayıran işaret */
  ctx.fillStyle = "rgba(255,255,255,.34)";
  ctx.beginPath(); ctx.arc(x + 3.5, y + 3.5, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + CELL-3.5, y + CELL-3.5, 1.2, 0, Math.PI*2); ctx.fill();
}
function cizHediye(x, y){
  var cx = x + CELL/2 - 0.5, cy = y + CELL/2 - 0.5;
  ctx.fillStyle = "rgba(232,184,75,.20)";
  ctx.fillRect(x, y, CELL, CELL);
  ctx.strokeStyle = "#E8B84B"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, cy, CELL*0.34, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = "#E8B84B";
  ctx.font = "800 8px Archivo, system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("+1", cx, cy + 0.5);
  ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
}
function cizZip(x, y){
  ctx.fillStyle = "#24463A";
  ctx.fillRect(x, y, CELL, CELL);
  ctx.strokeStyle = "#4FC07E"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
  var i;
  for(i=0;i<2;i++){
    var yy = y + 4 + i*5;
    ctx.beginPath();
    ctx.moveTo(x + 3, yy + 3); ctx.lineTo(x + CELL/2, yy);
    ctx.lineTo(x + CELL - 3, yy + 3);
    ctx.stroke();
  }
}
function cizCerceve(){
  /* Müze çerçevesi: oynanan alanın bu bir TABLO olduğunu söylüyor.
     Üretilen görsel çerçeve denendi ve kaldırıldı: kenarı görselin
     %24'üydü, tahtanın yanında ise %9 yer var — resmin üstünü
     örtüyordu. Elle çizilen ince çerçeve hiç yer kaplamıyor. */
  var x = BX - 7, y = BY - 7, w = COLS*CELL + 13, h = ROWS*CELL + 13;
  var gr = ctx.createLinearGradient(x, y, x + w, y + h);
  gr.addColorStop(0, "#8A6A28"); gr.addColorStop(0.45, "#D8B25A");
  gr.addColorStop(0.55, "#A5813A"); gr.addColorStop(1, "#6F5420");
  ctx.strokeStyle = gr; ctx.lineWidth = 6;
  ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1;
  ctx.strokeRect(x + 6.5, y + 6.5, w - 13, h - 13);
}
function draw(){
  if(!g) return;
  var c, r, i;
  ctx.save();
  if(sarsinti > 0) ctx.translate((Math.random()-0.5)*4, (Math.random()-0.5)*3);

  /* MÜZE DUVARI. Yüklenmediyse eski degradeye düşüyor. */
  if(hazir("duvar")){
    if(!duvarDeseni) duvarDeseni = ctx.createPattern(IMG.duvar, "repeat");
    ctx.fillStyle = duvarDeseni;
    ctx.fillRect(-8, -8, LW+16, LH+16);
    /* köşeleri karartan hafif vinyet: çerçeve öne çıksın */
    var vg = ctx.createRadialGradient(LW/2, LH*0.42, LH*0.18, LW/2, LH*0.42, LH*0.78);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.62)");
    ctx.fillStyle = vg; ctx.fillRect(-8, -8, LW+16, LH+16);
  } else {
    var bg = ctx.createLinearGradient(0, 0, 0, LH);
    bg.addColorStop(0, "#171B22"); bg.addColorStop(1, "#0C0F13");
    ctx.fillStyle = bg; ctx.fillRect(-8, -8, LW+16, LH+16);
  }

  /* tuval zemini */
  ctx.fillStyle = "#0F1318";
  ctx.fillRect(BX, BY, COLS*CELL, ROWS*CELL);
  ctx.strokeStyle = "rgba(255,255,255,.035)"; ctx.lineWidth = 1;
  for(c=1;c<COLS;c++){
    ctx.beginPath(); ctx.moveTo(BX + c*CELL, BY);
    ctx.lineTo(BX + c*CELL, BY + ROWS*CELL); ctx.stroke();
  }
  cizCerceve();

  /* bloklar */
  for(r=0;r<ROWS;r++){
    for(c=0;c<COLS;c++){
      var h = g[r*COLS + c];
      if(!h) continue;
      var x = BX + c*CELL, y = BY + r*CELL;
      if(h.tur === RESIM) cizResim(h, x, y);
      else if(h.tur === CELIK) cizCelik(x, y);
      else if(h.tur === HEDIYE) cizHediye(x, y);
      else if(h.tur === ZIP) cizZip(x, y);
      if(h.tur !== RESIM && h.parla > 0){
        ctx.fillStyle = "rgba(255,255,255," + (h.parla*0.5).toFixed(3) + ")";
        ctx.fillRect(x, y, CELL, CELL);
      }
    }
  }

  /* kaybetme çizgisi */
  ctx.strokeStyle = "rgba(222,90,78,.55)"; ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(BX - 4, YER); ctx.lineTo(BX + COLS*CELL + 4, YER);
  ctx.stroke(); ctx.setLineDash([]);

  /* nişan önizlemesi */
  if(durum === "nisan"){
    var a = (nisan !== null) ? nisan : aci;
    var yol = nisanYolu(nisanX, ATIS_Y, a, nisan !== null ? 900 : 200);
    ctx.strokeStyle = nisan !== null ? "rgba(232,184,75,.85)" : "rgba(232,184,75,.35)";
    ctx.lineWidth = 2; ctx.setLineDash([5, 6]);
    ctx.beginPath();
    ctx.moveTo(yol[0][0], yol[0][1]);
    for(i=1;i<yol.length;i++) ctx.lineTo(yol[i][0], yol[i][1]);
    ctx.stroke(); ctx.setLineDash([]);
    if(nisan !== null && yol.length > 1){
      var son = yol[yol.length-1];
      ctx.fillStyle = "rgba(232,184,75,.9)";
      ctx.beginPath(); ctx.arc(son[0], son[1], 3.2, 0, Math.PI*2); ctx.fill();
    }
  }

  /* toplar */
  if(S){
    var enCan = topMaxCan(KART);
    for(i=0;i<S.balls.length;i++){
      var b = S.balls[i];
      if(!b.canli) continue;
      /* Topun DURUMU görünsün: rengi canını, halkası kartını anlatır. */
      var govde = "#FFF3D6";
      if(b.zombi) govde = "#8FE08F";                       /* Nekromansi */
      else if(KART.kamikaze) govde = "#FFB4A0";            /* Kamikaze */
      else if(b.can <= 1) govde = "#FF9C93";               /* son can */
      else if(b.can <= enCan*0.34) govde = "#FFD08A";      /* azalıyor */
      /* İZ: soluklaşan kuyruk. Tek karelik "hayalet daire" yerine
         gerçek bir iz, top 6 px olduğu için hareketi bu okutuyor. */
      if(b.iz && b.iz.length >= 4){
        ctx.globalCompositeOperation = "lighter";
        for(var q=0;q<b.iz.length;q+=2){
          var ff = (q/2) / (b.iz.length/2 - 1);
          ctx.globalAlpha = 0.05 + 0.30*ff*ff;
          ctx.fillStyle = govde;
          ctx.beginPath();
          ctx.arc(b.iz[q], b.iz[q+1], BR*(0.30 + 0.75*ff), 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      /* PARLAMA: çarpışma yarıçapı değişmeden topu belirgin yapar */
      var gl = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, BR*3.2);
      gl.addColorStop(0, "rgba(255,243,214,.55)");
      gl.addColorStop(0.45, "rgba(255,243,214,.18)");
      gl.addColorStop(1, "rgba(255,243,214,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(b.x, b.y, BR*3.2, 0, Math.PI*2); ctx.fill();
      if(hazir("top")){
        /* Sprite beyaza yakın; durum rengini üstüne "multiply" ile
           basıyoruz, böylece can/kart bilgisi sprite'ta da okunuyor. */
        ctx.drawImage(IMG.top, b.x - BR*1.7, b.y - BR*1.7, BR*3.4, BR*3.4);
        if(govde !== "#FFF3D6"){
          ctx.globalCompositeOperation = "multiply";
          ctx.globalAlpha = 0.75;
          ctx.fillStyle = govde;
          ctx.beginPath(); ctx.arc(b.x, b.y, BR*1.1, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
        }
      } else {
        ctx.fillStyle = govde;
        ctx.beginPath(); ctx.arc(b.x, b.y, BR*1.25, 0, Math.PI*2); ctx.fill();
      }
      if(b.buz > 0){                                        /* Buzul Zırh */
        ctx.strokeStyle = "rgba(150,220,255,.9)"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(b.x, b.y, BR + 1.8, 0, Math.PI*2); ctx.stroke();
      }
      if(KART.agir){                                        /* Ağır Metal */
        ctx.strokeStyle = "rgba(40,46,54,.85)"; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(b.x, b.y, BR + 0.9, 0, Math.PI*2); ctx.stroke();
      }
      if(KART.inatci && b.can <= 1){                        /* İnatçı hazır */
        ctx.strokeStyle = "rgba(255,120,90,.9)"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(b.x, b.y, BR + 3.2, 0, Math.PI*2); ctx.stroke();
      }
      if(KART.ritim && b.zincir >= 2){                      /* Ritim hazır */
        ctx.strokeStyle = "rgba(255,215,100,.95)"; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(b.x, b.y, BR + 3.2, 0, Math.PI*2); ctx.stroke();
      }
    }
  }

  /* FIRLATICI */
  ctx.fillStyle = "#2B333D";
  ctx.fillRect(BX - 7, ATIS_Y - 3, COLS*CELL + 13, 12);
  var alet = IMGF[tabloNo % FIRLATICI.length];
  if(alet && alet.complete && alet.naturalWidth){
    /* Alet YUKARI bakıyor; nişan açısı a için dönme a + PI/2 kadar.
       Dönme ekseni aletin TABANI, yoksa nişan alırken kayıyor. */
    var aa = (durum === "nisan" && nisan !== null) ? nisan : aci;
    /* Aletler dar ve uzun: 46 px yukseklikte 15 px genislikte bir cubuk
       kaliyordu ve koyu zeminde secilmiyordu. Buyutup arkasina sicak bir
       isik koyuyoruz. */
    var yuk = 66, gen = yuk * (alet.naturalWidth / alet.naturalHeight);
    ctx.save();
    ctx.translate(nisanX, ATIS_Y + 8);
    ctx.rotate(aa + Math.PI/2);
    var ag = ctx.createRadialGradient(0, -yuk*0.45, 0, 0, -yuk*0.45, yuk*0.62);
    ag.addColorStop(0, "rgba(255,210,130,.30)");
    ag.addColorStop(1, "rgba(255,190,100,0)");
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0, -yuk*0.45, yuk*0.62, 0, Math.PI*2); ctx.fill();
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 7; ctx.shadowOffsetY = 2;
    ctx.drawImage(alet, -gen/2, -yuk, gen, yuk);
    ctx.restore();
  }
  ctx.fillStyle = "#E8B84B";
  ctx.beginPath(); ctx.arc(nisanX, ATIS_Y + 8, 6.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#1A1305";
  ctx.font = "800 9px Archivo, system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  var kalan = (durum === "atis" && S) ? (S.bekleyen + canliTop()) : toplar;
  if(kalan < 100) ctx.fillText(String(kalan), nisanX, ATIS_Y + 8.5);
  ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";

  /* YETENEK EFEKTLERİ */
  for(i=0;i<efekt.length;i++) cizEfekt(efekt[i]);

  /* parçacıklar */
  for(i=0;i<parca.length;i++){
    var q = parca[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life*2.2));
    ctx.fillStyle = q.renk;
    ctx.fillRect(q.x - q.r/2, q.y - q.r/2, Math.max(1, q.r), Math.max(1, q.r));
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function cizEfekt(e){
  var k = e.t / e.sure;                  /* 0..1 ilerleme */
  var sol = 1 - k;
  if(e.tip === "vurus"){
    ctx.strokeStyle = "rgba(255,243,214," + (sol*0.85).toFixed(3) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, 3 + k*9, 0, Math.PI*2); ctx.stroke();
  }
  else if(e.tip === "kir"){
    ctx.strokeStyle = "rgba(255,255,255," + (sol*0.8).toFixed(3) + ")";
    ctx.lineWidth = 2.4*sol + 0.6;
    ctx.beginPath(); ctx.arc(e.x, e.y, 4 + k*16, 0, Math.PI*2); ctx.stroke();
  }
  else if(e.tip === "halka"){
    ctx.strokeStyle = "rgba(" + e.renk + "," + (sol*0.9).toFixed(3) + ")";
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(e.x, e.y, 4 + k*(e.r || 18), 0, Math.PI*2); ctx.stroke();
  }
  else if(e.tip === "patlama"){
    var r = 6 + k*34;
    var gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
    gr.addColorStop(0, "rgba(255,220,140," + (sol*0.55).toFixed(3) + ")");
    gr.addColorStop(0.6, "rgba(255,140,60," + (sol*0.35).toFixed(3) + ")");
    gr.addColorStop(1, "rgba(255,100,40,0)");
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(255,190,110," + (sol*0.9).toFixed(3) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, r*0.8, 0, Math.PI*2); ctx.stroke();
  }
  else if(e.tip === "simsek"){
    if(!e.kirik) return;
    ctx.strokeStyle = "rgba(200,235,255," + (sol*0.95).toFixed(3) + ")";
    ctx.lineWidth = 2.6*sol + 0.8;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(e.kirik[0][0], e.kirik[0][1]);
    for(var q=1;q<e.kirik.length;q++) ctx.lineTo(e.kirik[q][0], e.kirik[q][1]);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255," + (sol*0.6).toFixed(3) + ")";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  else if(e.tip === "bol"){
    ctx.strokeStyle = "rgba(127,227,255," + (sol*0.9).toFixed(3) + ")";
    ctx.lineWidth = 2;
    var ay = 10 + k*16;
    ctx.beginPath(); ctx.arc(e.x - ay*0.5, e.y, ay*0.55, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(e.x + ay*0.5, e.y, ay*0.55, 0, Math.PI*2); ctx.stroke();
  }
}
function canliTop(){
  if(!S) return 0;
  var n = 0, i;
  for(i=0;i<S.balls.length;i++) if(S.balls[i].canli) n++;

function fitCanvas(){
  var box = el("stage");
  var availW = box.clientWidth || LW;
  var cabH = el("cab").offsetHeight, cvH = cv.offsetHeight;
  var chrome = (cabH > 0 && cvH > 0) ? (cabH - cvH) : 150;
  var availH = (window.innerHeight || 760) - chrome - 18;
  if(availH < 300) availH = 300;
  scale = Math.min(availW / LW, availH / LH);
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(LW*scale*dpr);
  cv.height = Math.round(LH*scale*dpr);
  cv.style.width = Math.round(LW*scale) + "px";
  cv.style.height = Math.round(LH*scale) + "px";
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
}

/* KART SEÇİMİ: 4 rastgele karttan biri. Kartlar kalıcı ve yığılabilir;
   aynı kartı tekrar alırsan etkisi katlanır. */
function showKart(){
  /* Tek seçimlik kartlar bir kez alındıktan sonra havuzdan çıkar:
     üst üste alındıklarında hiçbir şey değişmeyen kartlar bunlar
     (canı sabitleyenler, ikili kurallar, sabit hasar yazanlar) ve
     Çoğalan Hücre — o yığıldığında top sayısı katlanarak patlıyor. */
  /* NADİRLİK: ölçülen tek-kart hasarına göre üç kademe. Ağır Metal 826
     ile Saçılma 217 arasında 4 kat fark var; hepsini eşit olasılıkla
     dağıtmak o farkı tesadüfe bırakıyordu. */
  var havuz = [], secilen = [], i, j;
  for(i=0;i<KART_LISTE.length;i++){
    var kk = KART_LISTE[i];
    if(kk.tek && KART[kk.k]) continue;
    var agirlik = kk.nadir === 2 ? 0.18 : (kk.nadir === 1 ? 0.45 : 1);
    havuz.push({ c:kk, a:agirlik });
  }
  if(!havuz.length){ kartBorcu = 0; return; }
  for(i=0;i<4 && havuz.length;i++){
    var toplamA = 0;
    for(j=0;j<havuz.length;j++) toplamA += havuz[j].a;
    var hedef = Math.random()*toplamA, birikim = 0, sec = havuz.length-1;
    for(j=0;j<havuz.length;j++){
      birikim += havuz[j].a;
      if(hedef <= birikim){ sec = j; break; }
    }
    secilen.push(havuz.splice(sec, 1)[0].c);
  }

  var html = '<h2>Kart seç</h2><p class="sub">' +
    (kartBorcu > 1 ? kartBorcu + ' kart hakkın var — birini seç. ' : '') +
    'Seçtiğin kart bu tablo boyunca kalır.</p><div class="kartlar">';
  for(i=0;i<secilen.length;i++){
    var c = secilen[i], sy = KART[c.k] || 0;
    var nd = c.nadir || 0;
    html += '<button class="kart' + (nd ? ' n' + nd : '') + '" data-kart="' + c.k + '">' +
      '<span class="ki">' + c.ikon + '︎</span>' +
      '<span class="gov">' +
        '<b>' + c.ad + '</b>' +
        '<span class="ust"><small>' + c.en + '</small>' +
          (nd === 2 ? '<span class="nd nd2">efsane</span>' : '') +
          (nd === 1 ? '<span class="nd nd1">nadir</span>' : '') +
          (c.tek ? '<span class="rozet">tek seçimlik</span>' : '') +
          (sy ? '<span class="kat">×' + (sy+1) + '</span>' : '') +
        '</span>' +
        '<p>' + c.ac + '</p>' +
      '</span></button>';
  }
  html += '</div>';
  /* Kart başına bir yeniden dağıtma: dört kötü kart gelince oyuncunun
     elinde bir şey olsun. */
  if(kartYenile > 0)
    html += '<div class="row yeniden"><button data-a="yenile">⟳ Yeniden dağıt (' +
            kartYenile + ')</button></div>';
  var d = overlay(html, "scroll");
  d.addEventListener("click", function(e){
    if(e.target.getAttribute && e.target.getAttribute("data-a") === "yenile"){
      if(kartYenile > 0){ kartYenile--; hideOverlay(); showKart(); }
      return;
    }
    var t = e.target;
    while(t && t !== d && !(t.getAttribute && t.getAttribute("data-kart"))) t = t.parentNode;
    if(!t || t === d) return;
    var k = t.getAttribute("data-kart");
    KART[k] = (KART[k] || 0) + 1;
    kartBorcu--;
    hideOverlay();
    renderHud();
    if(kartBorcu > 0) setTimeout(showKart, 140);
  });
}
function showKazandi(){
